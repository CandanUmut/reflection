# Runs the same checks on every pull request, so problems show before merging.
name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx eslint .
      - run: node scripts/contrast.mjs
      - run: npx astro build
