# Glossary (DESIGN.md §7). Every gloss is a definition the research itself
# gives; `from` names the item where it appears. Nothing here is new content.
terms:
  - term: { tr: tefekkür, en: tefekkür (tafakkur) }
    gloss: { tr: Düşünmek, derinlemesine üzerine eğilmek; bu sitenin adı ve daveti., en: Reflection; the name and the invitation of this site. }
    from: 00-research-brief
  - term: { tr: âyet, en: āya (pl. āyāt) }
    gloss: { tr: İşaret. Kur'an'ın doğadaki şeylere verdiği ad; aynı zamanda Kur'an'ın cümlesi., en: Sign. The Quran's name for things in nature that invite reflection; also a verse of the Quran. }
    from: Q12
  - term: { tr: kader, en: qadar }
    gloss: { tr: İlahi takdir. Gelenek ona bir sır (*sır*) der., en: Divine decree. The tradition calls it a mystery (*sirr*). }
    from: Q2
  - term: { tr: cüz'î irade, en: cüz'î irade (partial will) }
    gloss: { tr: İnsanın gerçek ama küçük seçme gücü; Nursî'ye göre küçük ama belirleyici., en: The human being's real but small power of choice; for Nursi, small but decisive. }
    from: Q2
  - term: { tr: kesb, en: kasb }
    gloss: { tr: '"Kazanmak, edinmek." Eş''arîlere göre fiilleri Allah yaratır, insan onları kesbeder.', en: '"Acquisition." For Ashʿarīs, God creates acts and humans "acquire" them.' }
    from: Q2
  - term: { tr: vesvese, en: waswasa (vesvese) }
    gloss: { tr: İstenmeyen, zorlayıcı, takıntılı şüpheler; dinî titizlik tipi OKB'nin dinî bir görünümü., en: Unwanted, intrusive, obsessive doubts; a religious presentation of OCD (scrupulosity). }
    from: Q8
  - term: { tr: haşyet, en: khashya }
    gloss: { tr: 'Bilgiyle gelen saygı; 35:28''de "bilgi sahibi olanların" karşılığı.', en: 'Reverence that comes with knowledge; the response of "those with knowledge" in 35:28.' }
    from: S33
  - term: { tr: fıtrat, en: fiṭra }
    gloss: { tr: Doğuştan gelen yatkınlık; Allah'a doğal bir açıklık (30:30)., en: The innate disposition; a natural openness to God (30:30). }
    from: Q26
  - term: { tr: makâsıd, en: maqāṣid }
    gloss: { tr: Şeriatın amaçları; zararı önlemek dâhil. Klasik olarak can, din, akıl, nesil ve malın korunması., en: The Sharia's purposes, including preventing harm; classically the protection of life, religion, intellect, lineage and wealth. }
    from: Q20
  - term: { tr: taabbüdî, en: taʿabbudī }
    gloss: { tr: Amacı tam olarak açıklanmamış, saf kulluk olarak yapılan ibadetler., en: Acts of pure devotion, whose purpose is not fully explained. }
    from: Q35
  - term: { tr: ihsan, en: iḥsān }
    gloss: { tr: Güzellik, mükemmellik; her şeyde güzel davranmak (Müslim 1955)., en: Excellence; doing things beautifully and well, prescribed in all things (Muslim 1955). }
    from: M2
  - term: { tr: tevekkül, en: tawakkul }
    gloss: { tr: 'Allah''a güvenmek. "Deveni bağla ve tevekkül et" (Tirmizî 2517).', en: 'Trust in God. "Tie your camel and trust" (Tirmidhī 2517).' }
    from: Q16
  - term: { tr: tekfir, en: takfīr }
    gloss: { tr: Diğer Müslümanları kâfir ilan etmek; Amman Mesajı (2005) bunu yasakladı., en: Declaring other Muslims unbelievers; the Amman Message (2005) forbade it. }
    from: Q19
  - term: { tr: içtihat, en: ijtihād }
    gloss: { tr: Bağımsız hukukî akıl yürütme., en: Independent legal reasoning. }
    from: Q23
  - term: { tr: emanet, en: amāna }
    gloss: { tr: 'Güven ve emanet: bırakılan mal, sırlar, kamu görevi, kişinin bedeni ve insan olmanın bütün ahlâkî sorumluluğu (33:72).', en: 'Trust: property left with you, secrets, public office, one''s body and abilities, and the whole moral responsibility of being human (33:72).' }
    from: M9
  - term: { tr: hikmet, en: ḥikma }
    gloss: { tr: Hikmet; Mâtürîdîlere göre aklın kısmen kavrayabileceği ilahi bilgelik., en: Wisdom; for Māturīdīs, divine wisdom that reason can partly grasp. }
    from: Q1
