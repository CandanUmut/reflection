fullAnswer:
  - kind: quran
    en: |-
      **Honour is given to all.** "We have certainly honored the children of Adam and carried them on the land and sea and provided for them of the good things" (17:70). The verse says "children of Adam", not believers only.

      **Difference is for knowing each other.** "O mankind, indeed We have created you from male and female and made you peoples and tribes that you may know one another. Indeed, the most noble of you in the sight of Allah is the most righteous of you" (49:13). Race, nation and family give no rank; righteousness does, and only God sees it fully.

      **One life, all of humanity.** "Whoever kills a soul unless for a soul or for corruption [done] in the land — it is as if he had slain mankind entirely. And whoever saves one — it is as if he had saved mankind entirely" (5:32).
  - kind: sunnah
    en: '**God looks at hearts.** "Allah does not look to your bodies nor to your faces but He looks to your hearts" {hadith:muslim:2564}.'
  - kind: research
    en: "**Meeting people reduces prejudice.** A meta-analysis of 515 studies (713 samples) found that intergroup contact typically reduces prejudice; the effect generalises to the whole group and is not explained by publication bias (Pettigrew and Tropp, 2006). [Established] It supports the Quran's \"that you may know one another\" (49:13) as practical advice."
  - kind: practice
    en: "**Know one another.** Eat with, work beside, and learn from people of other backgrounds. Check your jokes and words for contempt (see the page on speech). In a mosque or community, ask who is missing or unwelcome."
  - kind: heart
    en: "**Your worth is not given by others.** 17:70 gives honour to every child of Adam, and 49:13 measures people only by what God sees in the heart {hadith:muslim:2564}. Racism or sectarian contempt among Muslims goes against both."
followUps:
  - q:
      en: Does "most righteous" make Muslims superior?
    a:
      en: The verse speaks of righteousness, which only God judges (49:13); it gives no group a right to look down on another.
  - q:
      en: Does 5:32 apply to non-Muslims?
    a:
      en: It speaks of "a soul" and "mankind entirely" (5:32).
  - q:
      en: What about the "right hands possess" and other unequal rules?
    a:
      en: Classical law did contain inequalities (for example slavery, see the question on slavery); this page states the principle of 17:70 and 49:13, and the hard questions are treated there.
