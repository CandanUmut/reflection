fullAnswer:
  - kind: meaning
    en: '**Karāma.** *Karrama* (17:70) means "to honour, to ennoble". The dignity is given by God to "the children of Adam" — all humans — and so is not earned or lost by belief or behaviour.'
  - kind: quran
    en: |-
      **Honour for all humans (17:70).** "And We have certainly honored the children of Adam and carried them on the land and sea and provided for them of the good things and preferred them over much of what We have created, with [definite] preference" (17:70), Meccan. The addressee is humanity, named through its common ancestor.

      **Difference for knowing one another (49:13).** "O mankind, indeed We have created you from male and female and made you peoples and tribes that you may know one another. Indeed, the most noble of you in the sight of Allah is the most righteous of you" (49:13), Medinan, addressed to all people. Ibn Kathir reads "that you may know one another" as knowing lineage, and adds that honour with God comes "on account of Taqwa, not family lineage".

      **Languages and colours as signs (30:22).** "And of His signs is the creation of the heavens and the earth and the diversity of your languages and your colors. Indeed in that are signs for those of knowledge" (30:22). Human diversity is placed alongside the heavens and the earth as a sign of God.

      **One life as all humanity (5:32).** "Because of that, We decreed upon the Children of Israel that whoever kills a soul unless for a soul or for corruption [done] in the land — it is as if he had slain mankind entirely. And whoever saves one — it is as if he had saved mankind entirely" (5:32). The verse comes right after the story of Adam's two sons, one of whom killed the other (5:27–31); "Because of that" refers to that first murder. It states a law given to the Children of Israel, which the Quran repeats as a lesson. It contains two exceptions — killing "for a soul" (legal retaliation) and "for corruption in the land" — which should be quoted, not cut, when the verse is cited.
  - kind: sunnah
    en: '**No superiority except by piety.** In a sermon reported by a Companion, the Prophet (pbuh) said: "there is no virtue of an Arab over a non-Arab, nor of a non-Arab over an Arab, nor of a red-skinned over a black-skinned, nor of a black-skinned over a red-skinned except through piety" (Musnad Ahmad 23489; chain graded *ṣaḥīḥ* by Shuʿayb al-Arnaʾut; al-Haythami: its narrators are those of the *Ṣaḥīḥ*).'
  - kind: scholars
    en: "**Inviolability through being human.** The current page cites the Hanafi principle that a person is protected (*maʿṣūm*) by being human (*bi-l-ādamiyya*), and the modern *maqāṣid* scholars Ibn ʿAshur and Jasser Auda. None of these works was read for this run (see Gaps)."
  - kind: history
    en: "**The ideal and the record.** Muslim history includes both the Prophet's (pbuh) words above and real racism and ethnic hierarchy — including slavery (see \"Slavery\") and prejudice against Black Muslims. No historical study was read for this run, so no examples are given; they should be added from named sources."
  - kind: research
    en: "**Contact between groups reduces prejudice.** [Established.] Pettigrew and Tropp's 2006 meta-analysis covered \"515 studies involving a quarter of a million participants in 38 nations\" and found an average relationship between contact and lower prejudice of r = .21; \"the more rigorous experimental studies yield a stronger mean effect of r = .33\" (Pettigrew and Tropp, 2008, p. 922). Contact under Allport's \"optimal conditions\" — equal status, shared goals, cooperation, support from authorities — typically produced larger reductions. This fits 49:13's \"that you may know one another\": knowing people across groups reduces contempt."
  - kind: practice
    en: |-
      **Know people unlike you.** Make friends across ethnicity, language and class: eat together, work together, visit.

      **Check your words.** Jokes and nicknames that demean a group are forbidden (49:11; see "Ethics of speech").

      **In the mosque.** Notice who is not welcome or not seen — converts, Black Muslims, refugees — and change that.
  - kind: heart
    en: "**If you have faced racism, including from Muslims**, the Prophet's (pbuh) words are on your side: no one is above you by colour or origin. That some Muslims fail this teaching is their failure, not a flaw in your worth."
followUps:
  - q:
      en: Does 17:70 include non-Muslims?
    a:
      en: 'Yes: it speaks of "the children of Adam", all humans.'
  - q:
      en: What does "that you may know one another" mean?
    a:
      en: "Ibn Kathir: knowing lineage; honour with God comes by *taqwa*, not lineage. A wider reading — getting to know other peoples — is common today."
  - q:
      en: Is 5:32 a universal rule against killing?
    a:
      en: It states a law given to the Children of Israel, with two exceptions (retaliation and "corruption in the land"), and the Quran presents it as a lesson.
  - q:
      en: Is the Farewell Sermon hadith authentic?
    a:
      en: The version in Musnad Ahmad 23489 has a chain graded *ṣaḥīḥ* by al-Arnaʾut.
  - q:
      en: Why do Muslim societies still have racism?
    a:
      en: Because people fail their ideals. The teaching condemns it; history shows it persisted.
