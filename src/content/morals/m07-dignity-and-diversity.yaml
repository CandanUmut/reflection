title:
  tr: İnsan onuru ve çeşitlilik
  en: Dignity and diversity
summary:
  tr: İnsan onurlandırılmıştır; çeşitlilik, birbirimizi tanıyalım diyedir.
  en: The human being is honoured; diversity is so that we may know one another.
teachings:
  tr: |
    - Veda Hutbesi: "Takva dışında hiçbir üstünlük yoktur" (Müsned, Ahmed 23489).
  en: |
    - The Farewell Sermon: "no superiority except by piety" (Musnad Aḥmad 23489).
scholarship:
  tr: Hanefîlerin, insan olmak sebebiyle dokunulmazlık görüşü; İbn Âşûr ve Auda.
  en: The Hanafī view of inviolability through being human; Ibn ʿĀshūr and Auda.
evidence:
  tr: Temas araştırmaları, olumlu temasın önyargıyı azalttığını gösteriyor. [Established]
  en: Contact research shows positive contact reduces prejudice. [Established]
gaps:
  tr: Irkçılık ve mezhepçilik.
  en: Racism and sectarianism.
visualizations:
  - id: ideas
    tr: Benlikten bütün yaratılışa uzanan bir "haklar çemberi".
    en: A "circle of rights" running from self to all creation.
