fullAnswer:
  - kind: quran
    en: |-
      **Justice starts with yourself.** "O you who have believed, be persistently standing firm in justice, witnesses for Allah, even if it be against yourselves or parents and relatives. Whether one is rich or poor, Allah is more worthy of both. So follow not [personal] inclination, lest you not be just" (4:135). Ibn Kathir explains: say the truth when you are asked, "even if harm will effect you as a consequence", and do not let the blame of anyone stop you.

      **Justice even toward those you dislike.** "Do not let the hatred of a people prevent you from being just. Be just; that is nearer to righteousness" (5:8). The verse expects that we will have enemies, and still asks for fairness toward them.

      **Justice with goodness.** "Indeed, Allah orders justice and good conduct and giving to relatives and forbids immorality and bad conduct and oppression" (16:90). Justice (*'adl*) gives each their due; good conduct (*ihsan*) gives more than is due. The Quran asks for both.
  - kind: sunnah
    en: |-
      **Help the oppressor too — by stopping him.** The Prophet (pbuh) said: "Help your brother, whether he is an oppressor or he is an oppressed one." People asked how one helps an oppressor. He said: "By preventing him from oppressing others" {hadith:bukhari:2444}.

      **Oppression has a cost beyond this life.** "Oppression will be a darkness on the Day of Resurrection" {hadith:bukhari:2447}.

      **No exemption for the powerful.** When a woman of a noble tribe stole and people sought to have her spared, the Prophet (pbuh) refused, warning that earlier nations were ruined because they punished the weak and let the noble go, and said he would apply the law even to his own daughter Fatima {hadith:bukhari:3475}.
  - kind: scholars
    en: "**Justice is the aim of the law.** In the earlier research for this page, two classical voices stand out. Al-Shatibi (d. 1388) described the law as serving its objectives (*maqasid*), such as protecting life, mind, faith, family and property. Ibn al-Qayyim (d. 1350) went further: wherever justice is found, God's law is there. Both mean that a ruling which produces injustice has missed its own purpose."
  - kind: practice
    en: "**Be fair where it costs you.** Tell the truth in a dispute even when it hurts your side (4:135). Give a fair review to someone you dislike (5:8). When a friend wrongs someone, \"help\" him by stopping him {hadith:bukhari:2444}. At work and at home, apply the same rule to the people you like and the people you don't."
  - kind: research
    en: "**Fair processes build trust.** Research on procedural justice links fair processes — being heard, consistent rules, respectful treatment — to trust in institutions, even when people do not get the outcome they wanted. [Established]"
  - kind: heart
    en: '**Your claim is not lost.** The Quran commands justice and forbids oppression (16:90), and the Prophet (pbuh) called oppression "a darkness" for the one who does it {hadith:bukhari:2447}. Seeking justice through fair means is not a lack of patience; it is what these verses ask for.'
followUps:
  - q:
      en: Does justice mean treating everyone the same?
    a:
      en: Justice gives each person their due; good conduct (*ihsan*) can give more. The verse joins the two (16:90).
  - q:
      en: What if being just harms my family?
    a:
      en: 4:135 names that exact case — "even if it be against yourselves or parents and relatives" — and asks for the truth anyway.
  - q:
      en: Is justice only for Muslims?
    a:
      en: "No: 5:8 asks for justice even toward a people you hate."
