fullAnswer:
  - kind: meaning
    en: |-
      **Two words for justice.** *ʿAdl* means putting things in balance, giving each their due; *qisṭ* means fairness, especially in measures and judgements. 4:135 uses *qisṭ* ("standing firm in justice", *qawwāmīna bi-l-qisṭ*); 16:90 uses *ʿadl*. Both are about giving what is due, not about being kind or soft.

      **"Witnesses for Allah."** A witness (*shāhid*) tells what happened. To be a witness "for Allah" means testifying as if before God, not for your side.
    tr: |-
      **Adalet için iki kelime.** *Adl*, şeyleri dengeye koymak, herkese hakkını vermek demektir; *kıst* ise özellikle ölçülerde ve hükümlerde hakkaniyet demektir. 4:135 *kıst* kelimesini kullanır ("adaleti ayakta tutan", *kavvâmîne bi'l-kıst*); 16:90 *adl* kelimesini kullanır. İkisi de nazik ya da yumuşak olmakla değil, hakkı vermekle ilgilidir.

      **"Allah için şahitlik eden."** Bir şahit (*şâhid*) olanı anlatır. "Allah için" şahit olmak, kendi tarafın için değil, Allah'ın huzurundaymış gibi şahitlik etmek demektir.
    title:
      en: Ne anlama geliyor?
      tr: Ne anlama geliyor?
  - kind: quran
    en: |-
      **Justice against yourself and your family (4:135).** "O you who have believed, be persistently standing firm in justice, witnesses for Allah, even if it be against yourselves or parents and relatives. Whether one is rich or poor, Allah is more worthy of both. So follow not [personal] inclination, lest you not be just. And if you distort [your testimony] or refuse [to give it], then indeed Allah is ever, with what you do, Acquainted" (4:135). This is a Medinan verse in Sura al-Nisaʾ, addressed to the believers. What it commands is justice (*qisṭ*); the means it names is honest testimony — not distorting it and not withholding it. It names the pressures that bend testimony: love of self, of family, and a bias for or against someone because they are rich or poor.

      **Justice toward enemies (5:8).** "O you who have believed, be persistently standing firm for Allah, witnesses in justice, and do not let the hatred of a people prevent you from being just. Be just; that is nearer to righteousness" (5:8), from Sura al-Maʾida, Medinan. Here the pressure is hatred: even toward people you have reason to dislike, justice is required.

      **Justice as a command, with good conduct (16:90).** "Indeed, Allah orders justice and good conduct and giving to relatives and forbids immorality and bad conduct and oppression" (16:90), from Sura al-Nahl, usually counted as Meccan. *Good conduct* here is *iḥsān* (see "Mercy and iḥsān"): justice is the floor, *iḥsān* goes beyond it.

      **Judging between people (4:58).** "Indeed, Allah commands you to render trusts to whom they are due and when you judge between people to judge with justice" (4:58). The command is to judges and those in authority, about "people" in general — not only Muslims.

      **What 4:135 does and does not say.** It commands justice and honest testimony. It does not command saying every true thing in every situation; Muslim scholars allowed some untruths to protect people (see "Ethics of speech"), and al-Ghazali (*Iḥyāʾ*, Book of the Banes of the Tongue) even required a lie when the truth would shed the blood of a Muslim hiding from an oppressor; al-Nawawi gives the same rule and case in *Riyāḍ al-Ṣāliḥīn* (ch. 261), adding that an indirect answer (*tawriya*) is the more cautious course. Applying it to any innocent person is a modern extension of their example.
    tr: |-
      **Kendine ve ailene karşı adalet (4:135).** "Ey iman edenler! Adaleti ayakta tutan ve kendiniz, anababanız ve yakın akrabanız aleyhine de olsa, yalnız Allah için şahitlik eden kimseler olunuz. Zira zengin de olsa, fakir de olsa, Allah ikisine de (sizden) daha yakındır. Nefsinizin arzusuna uyarak adaletten uzaklaşmayın. Eğer (şahitlik ederken) dilinizi eğer, bükerseniz veya çekinirseniz, şüphesiz Allah yaptıklarınızdan haberdardır." (4:135). Bu, Nisâ Sûresi'nde, müminlere hitap eden Medenî bir âyettir. Emrettiği şey adalettir (*kıst*); saydığı araç dürüst şahitliktir — onu çarpıtmamak ve gizlememek. Şahitliği eğen baskıları adlarıyla sayar: kişinin kendisine ve ailesine duyduğu sevgi ve birinin zengin ya da fakir olması yüzünden onun lehine ya da aleyhine taraf tutmak.

      **Düşmanlara karşı adalet (5:8).** "Ey iman edenler, Allah için hakkı ayakta tutanlar ve adaletle şahitlik yapanlar olunuz. Bir kavme olan kininiz, sizi adaletsizliğe sevketmesin. Adaletli olun, çünkü o, takvaya daha yakındır." (5:8), Mâide Sûresi'nden, Medenî. Burada baskı nefrettir: Hoşlanmamak için sebebin olan insanlara karşı bile adalet gereklidir.

      **İyilikle birlikte bir emir olarak adalet (16:90).** "Şüphesiz ki Allah, size adaleti, iyilik yapmayı ve yakınlara bakmayı emreder; hayasızlıktan, fenalıktan ve azgınlıktan nehyeder." (16:90), Nahl Sûresi'nden, genellikle Mekkî sayılır. Buradaki *iyilik yapmak* *ihsân*dır (bkz. "Rahmet ve ihsan"): Adalet tabandır, *ihsân* onun ötesine geçer.

      **İnsanlar arasında hükmetmek (4:58).** "Allah size, emanetleri ehline vermenizi ve insanlar arasında hükmettiğiniz zaman adaletle hükmetmenizi emrediyor." (4:58). Emir, hâkimlere ve yetki sahiplerine, genel olarak "insanlar" hakkındadır — yalnızca Müslümanlar hakkında değil.

      **4:135 neyi söyler, neyi söylemez?** Adaleti ve dürüst şahitliği emreder. Her durumda her doğru şeyi söylemeyi emretmez; Müslüman âlimler insanları korumak için bazı doğru olmayan sözlere izin verdi (bkz. "Dil âdâbı") ve Gazzâlî (*İhyâ*, Dilin Âfetleri Kitabı) doğru söylemek bir zalimden saklanan bir Müslümanın kanının dökülmesine yol açacaksa yalanı vacip bile saydı; Nevevî *Riyâzü's-Sâlihîn*'de (261. bab) aynı hükmü ve örneği verir ve dolaylı bir cevabın (*tevriye*) daha ihtiyatlı yol olduğunu ekler. Bunu herhangi bir masum insana uygulamak, onların örneğinin modern bir genişletmesidir.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: |-
      **The story of the Makhzumi woman.** ʿAʾisha (ra) reports that the Quraysh "worried about the lady from Bani Makhzum who had committed theft." The Makhzum were a powerful clan of Mecca. People asked who could intercede for her with the Prophet (pbuh), and said: "No one dare to do so except Usama bin Zaid the beloved one to Allah's Messenger." When Usama (ra) spoke to him, the Prophet (pbuh) said: "Do you try to intercede for somebody in a case connected with Allah's Prescribed Punishments?" Then he gave a sermon: "What destroyed the nations preceding you, was that if a noble amongst them stole, they would forgive him, and if a poor person amongst them stole, they would inflict Allah's Legal punishment on him. By Allah, if Fatima, the daughter of Muhammad stole, I would cut off her hand" ({hadith:bukhari:3475}).

      **What the story is about.** Its point is equality before the law: the same rule for a noble family as for a poor one, and no special pleading by people close to the ruler. Usama was the Prophet's (pbuh) beloved adopted grandson; Fatima (ra) his own daughter. Naming them is the strongest possible way of saying "no exceptions".

      **The punishment itself.** The story involves the classical punishment for theft, cutting off the hand, which the Quran prescribes (5:38). Classical law surrounded it with conditions — a minimum value, proof, and the absence of doubt — but those conditions have not yet been consulted in a named source. Many Muslim-majority states today do not apply it. Readers who find the punishment itself troubling are right to ask about it; this page's subject is the equality the story teaches, and the question of the punishments belongs on a page of its own.
    tr: |-
      **Mahzûmlu kadının hikâyesi.** Hz. Âişe (r.a.), Kureyş'in "hırsızlık yapmış Benî Mahzûm'dan bir kadın yüzünden kaygılandığını" aktarır. Mahzûm, Mekke'nin güçlü bir boyuydu. İnsanlar onun için Hz. Peygamber (s.a.v.) nezdinde kimin aracılık edebileceğini sordular ve şöyle dediler: "Allah Resulü'nün sevgilisi Üsâme b. Zeyd'den başka kimse buna cesaret edemez." Üsâme (r.a.) onunla konuşunca Hz. Peygamber (s.a.v.) şöyle buyurdu: "Allah'ın belirlediği cezalardan biriyle ilgili bir davada birine aracılık etmeye mi çalışıyorsun?" Sonra bir hutbe verdi: "Sizden önceki milletleri helâk eden şuydu: Aralarından soylu biri hırsızlık yaptığında onu bağışlarlardı, aralarından fakir biri hırsızlık yaptığında ona Allah'ın hukuki cezasını uygularlardı. Allah'a yemin ederim ki, Muhammed'in kızı Fâtıma hırsızlık yapsaydı, onun elini keserdim" ({hadith:bukhari:3475}).

      **Hikâye ne hakkında?** Vurgusu hukuk önünde eşitliktir: soylu bir aile için de fakir bir aile için de aynı kural ve yöneticiye yakın insanların özel bir kayırma talep etmemesi. Üsâme, Hz. Peygamber'in (s.a.v.) sevgili evlatlığının oğluydu; Fâtıma (r.a.) ise kendi kızı. Onların adını anmak, "istisna yok" demenin mümkün olan en güçlü yoludur.

      **Cezanın kendisi.** Hikâye, Kur'an'ın öngördüğü (5:38) hırsızlığın klasik cezası olan el kesmeyi içerir. Klasik hukuk onu şartlarla çevreledi — asgari bir değer, ispat ve şüphenin bulunmaması — ama bu şartlara adı belli bir kaynakta henüz başvurulmadı. Bugün pek çok Müslüman çoğunluklu devlet bu cezayı uygulamıyor. Cezanın kendisini rahatsız edici bulan okuyucular onu sormakta haklıdır; bu sayfanın konusu hikâyenin öğrettiği eşitliktir ve cezalar sorusu kendi sayfasında ele alınmalıdır.
    title:
      en: Hz. Peygamber (s.a.v.) ne öğretti?
      tr: Hz. Peygamber (s.a.v.) ne öğretti?
  - kind: scholars
    en: "**Ibn al-Qayyim: justice is the goal of the law.** Ibn al-Qayyim (d. 1350), a Hanbali scholar, writes in *al-Ṭuruq al-Ḥukmiyya* (1/13) that God's purpose in sending His law is \"to establish justice between His servants and for people to behave fairly\", and that \"Whichever path leads to justice and fairness is part of the religion and does not contradict it\" (English as quoted by Abu Amina Elias; translator not named). The often-quoted line \"wherever justice is, there is God's law\" is a paraphrase of this passage; its exact wording was not found."
    tr: "**İbn Kayyim: Adalet hukukun amacıdır.** Hanbelî âlim İbn Kayyim (ö. 1350), *et-Turuku'l-Hükmiyye*'de (1/13), Allah'ın şeriatını göndermekteki amacının \"kulları arasında adaleti ikame etmek ve insanların hakkaniyetle davranmasını sağlamak\" olduğunu ve \"adalete ve hakkaniyete götüren her yolun dinden olduğunu ve ona aykırı olmadığını\" yazar (Abu Amina Elias'ın aktardığı İngilizceye göre; çevirmenin adı verilmemiş). Sıkça alıntılanan \"adalet neredeyse Allah'ın şeriatı oradadır\" sözü bu pasajın bir başka ifadesidir; tam lafzı bulunamadı."
    title:
      en: Âlimler bunu nasıl anladı?
      tr: Âlimler bunu nasıl anladı?
  - kind: fiqh
    en: |-
      **Testimony for and against relatives.** According to islamicfiqh.net, testimony "by parents in favour of their children, or by children in favour of their parents, is not acceptable according to the majority of scholars", and "a testimony by one spouse in favour of the other is unacceptable" — because of the risk of favouritism. But "a testimony against such close relatives is acceptable, as it cannot be motivated by favouritism." This is 4:135 in practice: you may not be a witness *for* your family, but you must be one *against* them if justice requires. The page attributes a minority view, accepting testimony for parents or children from a witness of good character, to ʿUmar ibn al-Khattab, the judge Shurayh, ʿUmar ibn ʿAbd al-ʿAziz, Ibn al-Mundhir, and "al-Shafiʿi in one of his two views." The source does not name each school's position separately.

      **Women and non-Muslims as witnesses.** Classical law did not treat all witnesses equally. In the same source, women were not accepted as witnesses in marriage, divorce and similar non-financial matters; in financial matters two men, or one man and two women, were needed; and in matters mostly known to women (birth, breastfeeding), "the testimony of one woman of probity is accepted." These rules are discussed on the page "Does Islam treat women unequally?". The source read does not address non-Muslim witnesses in general.
    tr: |-
      **Akrabaların lehine ve aleyhine şahitlik.** islamicfiqh.net'e göre "anne babanın çocukları lehine ya da çocukların anne babaları lehine şahitliği, âlimlerin çoğunluğuna göre kabul edilmez" ve "eşlerden birinin diğeri lehine şahitliği kabul edilmez" — kayırma riski yüzünden. Ama "böyle yakın akrabaların aleyhine şahitlik kabul edilir, çünkü kayırmadan kaynaklanamaz." Bu, uygulamadaki 4:135'tir: Ailenin *lehine* şahit olamazsın, ama adalet gerektiriyorsa onların *aleyhine* şahit olmalısın. Sayfa, adalet sahibi bir şahidin anne baba ya da çocuklar lehine şahitliğini kabul eden bir azınlık görüşünü Hz. Ömer b. Hattâb'a, kadı Şüreyh'e, Ömer b. Abdülazîz'e, İbnü'l-Münzir'e ve "iki görüşünden birinde Şâfiî'ye" nispet eder. Kaynak her mezhebin görüşünü ayrı ayrı vermiyor.

      **Şahit olarak kadınlar ve gayrimüslimler.** Klasik hukuk bütün şahitlere eşit davranmadı. Aynı kaynakta kadınlar nikâh, boşanma ve benzeri mali olmayan konularda şahit olarak kabul edilmiyordu; mali konularda iki erkek ya da bir erkek ve iki kadın gerekiyordu; ve çoğunlukla kadınların bildiği konularda (doğum, emzirme) "adalet sahibi tek bir kadının şahitliği kabul edilir." Bu hükümler "İslam kadına eşitsiz mi davranıyor?" sayfasında ele alınıyor. Okunan kaynak genel olarak gayrimüslim şahitleri ele almıyor.
    title:
      en: Fakihler ne diyor?
      tr: Fakihler ne diyor?
  - kind: history
    en: "**Courts in practice.** Readers ask how Muslim courts actually applied this teaching. No historical study of court records was read, so no examples are given here. Honest examples exist in the scholarly literature, both of judges ruling against the powerful and of the powerful escaping; they should be added from named studies, not from popular stories."
    tr: "**Uygulamada mahkemeler.** Okuyucular Müslüman mahkemelerin bu öğretiyi gerçekte nasıl uyguladığını soruyor. Mahkeme kayıtları üzerine hiçbir tarihî çalışma okunmadı, dolayısıyla burada örnek verilmiyor. Akademik literatürde hem güçlülerin aleyhine hüküm veren kadılara hem de güçlülerin kaçtığı durumlara dair dürüst örnekler var; bunlar popüler hikâyelerden değil, adı belli çalışmalardan eklenmelidir."
    title:
      en: Tarih
      tr: Tarih
  - kind: research
    en: |-
      **People obey law they see as fair, mainly because fairness builds trust.** [Moderate.] Walters and Bolger (2019) combined 64 studies (95 samples) published between 1990 and 2018. Fair treatment by authorities (procedural justice) predicted belief that the authorities are legitimate, and legitimacy predicted obeying the law. The direct link from fairness to obeying the law was "relatively weak" and "could not be reliably established in longitudinal datasets"; the results varied a lot between studies. In plain words: fairness matters mainly because it makes people trust the system.

      **The Arab Barometer.** That is a real survey, but it measures trust and religiosity, not whether Muslim societies live by 4:135, so it was not used here.
    tr: |-
      **İnsanlar adil gördükleri hukuka, esas olarak adalet güven oluşturduğu için uyar.** [Orta.] Walters ve Bolger (2019), 1990 ile 2018 arasında yayımlanmış 64 çalışmayı (95 örneklem) birleştirdi. Otoritelerin adil davranması (usul adaleti), otoritelerin meşru olduğu inancını öngördü ve meşruiyet de hukuka uymayı öngördü. Adaletten hukuka uymaya giden doğrudan bağ "görece zayıftı" ve "boylamsal veri setlerinde güvenilir şekilde tespit edilemedi"; sonuçlar çalışmalar arasında çok değişkendi. Sade bir dille: Adalet esas olarak insanların sisteme güvenmesini sağladığı için önemlidir.

      **Arap Barometresi.** Bu gerçek bir ankettir, ama Müslüman toplumların 4:135'e göre yaşayıp yaşamadığını değil, güveni ve dindarlığı ölçer; bu yüzden burada kullanılmadı.
    title:
      en: Araştırmalar ne gösteriyor?
      tr: Araştırmalar ne gösteriyor?
  - kind: practice
    en: |-
      **At home.** If your child or sibling is in the wrong in a dispute with someone else, say so — kindly, but clearly. Family loyalty does not include taking the wrong side.

      **At work.** Evaluate people by the same standard whether you like them or not (5:8). If you have to give a reference or a testimony, give the true one.

      **In disputes.** Before taking a side, ask: would I judge this the same way if the roles were reversed, or if the other person were rich, or poor?

      **When the injustice comes from religious authorities.** 4:135 makes no exception for them. Speak through proper channels — a complaint to the institution, a lawyer, or the authorities — and do not let reverence for a title stop you from naming wrong. The first of al-Nawawi's cases where speaking about someone is allowed is complaining of an injustice to someone who can remedy it (see "Ethics of speech").
    tr: |-
      **Evde.** Çocuğun ya da kardeşin bir başkasıyla bir anlaşmazlıkta haksızsa, bunu söyle — nazikçe, ama açıkça. Aileye sadakat, yanlış tarafı tutmayı içermez.

      **İşte.** İnsanları sevsen de sevmesen de aynı ölçüyle değerlendir (5:8). Bir referans ya da şahitlik vermen gerekiyorsa, doğrusunu ver.

      **Anlaşmazlıklarda.** Taraf tutmadan önce sor: Roller yer değiştirseydi ya da öbür kişi zengin ya da fakir olsaydı, bunu yine aynı şekilde mi değerlendirirdim?

      **Haksızlık dinî otoritelerden geldiğinde.** 4:135 onlar için bir istisna yapmaz. Uygun yollardan konuş — kuruma bir şikâyet, bir avukat ya da yetkililer — ve bir unvana duyulan saygının yanlışı adlandırmanı engellemesine izin verme. Nevevî'nin, biri hakkında konuşmaya izin verilen durumlarından ilki, bir haksızlığı onu giderebilecek birine şikâyet etmektir (bkz. "Dil âdâbı").
    title:
      en: Günlük hayatta
      tr: Günlük hayatta
  - kind: heart
    en: |-
      **If you were wronged and no one stood up for you**, the Quran is on your side: it commands people to stand up for justice even against their own families. That others failed you is their failure, not a sign that you did not deserve justice.

      **If you are being asked to testify against someone you love**, the verse knows how hard that is; it names exactly that pressure. You can be honest and still be kind: say what is true, and nothing crueller than the truth.
    tr: |-
      **Haksızlığa uğradıysan ve kimse senin için ayağa kalkmadıysa**, Kur'an senin tarafındadır: İnsanlara kendi ailelerine karşı bile adalet için ayağa kalkmalarını emreder. Başkalarının seni yüzüstü bırakması onların kusurudur, adaleti hak etmediğinin işareti değildir.

      **Sevdiğin birinin aleyhine şahitlik etmen isteniyorsa**, âyet bunun ne kadar zor olduğunu bilir; tam da bu baskıyı adıyla anar. Hem dürüst hem nazik olabilirsin: Doğru olanı söyle ve doğrudan daha acımasız hiçbir şey söyleme.
    title:
      en: Zorlanan kişi için
      tr: Zorlanan kişi için
followUps:
  - q:
      en: How should I think about cutting the hand in the Bukhari 3475 story?
      tr: Buhârî 3475'teki hikâyede el kesmeyi nasıl düşünmeliyim?
    a:
      en: The story's lesson is that the law must be the same for rich and poor. The punishment comes from 5:38; classical law hedged it with conditions that are not covered here, and many Muslim states do not apply it. It deserves its own careful page.
      tr: Hikâyenin dersi, hukukun zengin ve fakir için aynı olması gerektiğidir. Ceza 5:38'den gelir; klasik hukuk onu burada ele alınmayan şartlarla sınırladı ve pek çok Müslüman devlet onu uygulamıyor. Kendi dikkatli sayfasını hak ediyor.
  - q:
      en: What does standing firm in justice look like when the injustice comes from religious authorities?
      tr: Haksızlık dinî otoritelerden geldiğinde adaleti ayakta tutmak neye benzer?
    a:
      en: "The same as with anyone else: honest testimony and complaint through those who can remedy it. 4:135 makes no exceptions."
      tr: "Herhangi biriyle olduğu gibi: dürüst şahitlik ve onu giderebilecek olanlara şikâyet. 4:135 hiçbir istisna yapmaz."
  - q:
      en: What do "pbuh" and "maqāṣid" mean?
      tr: '"S.a.v." ve "makâsıd" ne demek?'
    a:
      en: "\"Peace be upon him\", said after the Prophet's name. *Maqāṣid* are the purposes of Islamic law, such as protecting life, faith, mind, family and property."
      tr: "\"Sallallâhu aleyhi ve sellem\", yani \"Allah'ın salât ve selamı onun üzerine olsun\"; Hz. Peygamber'in adından sonra söylenir. *Makâsıd*, İslam hukukunun amaçlarıdır; canın, dinin, aklın, ailenin ve malın korunması gibi."
  - q:
      en: Does the law give equal standing to women and non-Muslims as witnesses?
      tr: Hukuk kadınlara ve gayrimüslimlere şahit olarak eşit statü veriyor mu?
    a:
      en: "Not in classical law: women's testimony counted differently in some areas (see \"Does Islam treat women unequally?\"); non-Muslim testimony has not yet been checked."
      tr: 'Klasik hukukta hayır: Kadınların şahitliği bazı alanlarda farklı sayıldı (bkz. "İslam kadına eşitsiz mi davranıyor?"); gayrimüslimlerin şahitliği henüz kontrol edilmedi.'
  - q:
      en: Which work of Ibn al-Qayyim says justice is the goal of the law?
      tr: İbn Kayyim'in hangi eseri adaletin hukukun amacı olduğunu söylüyor?
    a:
      en: '*Al-Ṭuruq al-Ḥukmiyya*, 1/13: "Whichever path leads to justice and fairness is part of the religion."'
      tr: "*Et-Turuku'l-Hükmiyye*, 1/13: \"Adalete ve hakkaniyete götüren her yol dindendir.\""
  - q:
      en: How do the schools apply 4:135 to testimony about relatives?
      tr: Mezhepler 4:135'i akrabalar hakkındaki şahitliğe nasıl uygular?
    a:
      en: The majority reject testimony *for* parents, children or a spouse and accept testimony *against* them.
      tr: Çoğunluk anne baba, çocuklar ya da eş *lehine* şahitliği reddeder, onların *aleyhine* şahitliği kabul eder.
