title:
  tr: Kendi aleyhine bile adalet
  en: Justice even against oneself
summary:
  tr: Adalet, kişinin kendisi ya da yakınları aleyhine olsa bile ayakta tutulur.
  en: 'Justice in the Quran is owed to everyone, including people you dislike, and it binds you even when it costs you or your family: "be persistently standing firm in justice, witnesses for Allah, even if it be against yourselves or parents and relatives" (4:135). The Prophet (pbuh) refused to let the powerful escape the law, saying that earlier nations were destroyed because they punished the poor and spared the noble.'
