theme: justice
verses: ["4:135", "5:8", "16:90"]
title:
  tr: Kendi aleyhine bile adalet
  en: Justice even against oneself
summary:
  tr: Adalet, kişinin kendisi ya da yakınları aleyhine olsa bile ayakta tutulur.
  en: Justice is upheld even against oneself or one's relatives.
teachings:
  tr: |
    - Hz. Peygamber, hukuku kızı Fâtıma'ya bile uygulayacağını söyledi (Buhârî 3475).
  en: |
    - The Prophet would have applied the law even to his daughter Fatima (Bukhārī 3475).
scholarship:
  tr: "Şâtıbî'nin *makâsıd*ı (hukukun amaçları) ve İbn Kayyim'e göre: adalet neredeyse, Allah'ın hukuku oradadır."
  en: "Al-Shāṭibī's *maqāṣid* (objectives of the law), and Ibn al-Qayyim: wherever justice is, there is God's law."
evidence:
  tr: Usul adaleti araştırmaları, adil süreçleri güvenle ilişkilendirir. [Established]
  en: Procedural-justice research links fair processes to trust. [Established]
gaps:
  tr: Arap Barometresi, din önderlerine güvenin azaldığını gösteriyor.
  en: Arab Barometer shows falling trust in religious leaders.
