summary:
  tr: Hakkını aramak korunur; affetmek daha yüksektir. Güçlü olan öfkesini yenendir.
  en: 'The Quran praises those "who restrain anger and who pardon the people" (3:134), and it keeps the right to fair redress: "the retribution for an evil act is an evil one like it, but whoever pardons and makes reconciliation — his reward is [due] from Allah" (42:40). Forgiveness is a gift the wronged person may give; it is never something to be forced out of them.'
