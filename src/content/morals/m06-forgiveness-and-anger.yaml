summary:
  tr: Hakkını aramak korunur; affetmek daha yüksektir. Güçlü olan öfkesini yenendir.
  en: The Quran praises those "who restrain anger and who pardon the people" (3:134), and it keeps the right to fair redress (42:40). Forgiveness is a gift the wronged may give, never something forced out of them.
