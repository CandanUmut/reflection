fullAnswer:
  - kind: quran
    en: |-
      **Giving grows.** "The example of those who spend their wealth in the way of Allah is like a seed [of grain] which grows seven spikes; in each spike is a hundred grains" (2:261).

      **Fair trade.** "Woe to those who give less [than due]" (83:1).

      **Wealth must circulate.** Distribution is ordered "so that it will not be a perpetual distribution among the rich from among you" (59:7). In its context, this verse is about *fay'*: property that came to the Muslims without fighting, as with the Banu al-Nadir, which the Prophet (pbuh) spent on the poor and on public causes. Ibn Kathir explains the aim: "so that the wealth does not remain among the wealthy, who would spend it as they wish and desire and give none of it to the poor." Scholars draw a general principle from it: wealth should not circulate only among the rich.

      **Hoarding.** "Those who hoard gold and silver and spend it not in the way of Allah — give them tidings of a painful punishment" (9:34). The verse begins by criticising religious leaders who take people's wealth unjustly; its warning then covers anyone who hoards and does not pay what is due on their wealth.
  - kind: sunnah
    en: |-
      **Giving does not shrink wealth.** "Charity does not decrease wealth" {hadith:muslim:2588}. "Save yourself from Hell-fire even by giving half a date-fruit in charity" {hadith:bukhari:1417}. "The upper hand is better than the lower hand", and giving starts with one's dependants {hadith:bukhari:1427}.

      **Greed has no end.** "If the son of Adam had two valleys of money, he would wish for a third" {hadith:bukhari:6436}.

      **Honest trade.** Finding wet grain hidden under dry in a market pile, the Prophet (pbuh) said: "Whoever cheats is not one of us" {hadith:tirmidhi:1315}. Hoarding goods to raise prices is a sin {hadith:muslim:1605}, and the one who consumes usury (*riba*), pays it, records it or witnesses it is cursed {hadith:muslim:1598}. The often-quoted "honest, trustworthy merchant is with the prophets…" ({hadith:tirmidhi:1209}) is graded weak by most graders, so it is not used here as evidence.
  - kind: fiqh
    en: '**Who pays, how much, to whom.** Zakat is due once a year on savings above a minimum amount (*nisab*). On silver, the written instructions Abu Bakr (ra) sent with Anas (ra) say: "For silver the Zakat is one-fortieth of the lot (i.e. 2.5%), and if its value is less than two-hundred Dirhams, Zakat is not required" {hadith:bukhari:1454}. Today the *nisab* is usually worked out from the value of gold or silver, and the four schools differ in some details (for example on jewellery). The Quran names the eight groups who receive it: "the poor and for the needy and for those employed to collect [zakah] and for bringing hearts together [for Islam] and for freeing captives [or slaves] and for those in debt and for the cause of Allah and for the [stranded] traveler" (9:60).'
  - kind: scholars
    en: "**Wealth is one of the law's aims.** Protecting wealth (*hifz al-mal*) is one of the five classical objectives (*maqasid*) of the law in al-Ghazali and al-Shatibi; the modern scholar Ibn 'Ashur adds that wealth must circulate and be handled clearly and fairly. Al-Ghazali, in the *Ihya'*, treats greed as a disease of the heart and generosity as its cure. On *riba*, scholars agree on the ban but debate how it applies to modern bank interest. Most scholars and fiqh councils hold that bank interest is *riba*: the International Islamic Fiqh Academy of the OIC ruled in 1985 (Resolution 10) that any fixed increase on a loan is forbidden *riba*. A minority view, given by Al-Azhar's Islamic Research Academy in 2002, held fixed returns from bank investment to be permissible, treating the bank as an investment agent rather than a lender. [Debated in its details]"
  - kind: history
    en: "**Endowments built cities.** Across Islamic history, endowments (*waqf*) funded hospitals, schools, fountains and soup kitchens, and the market inspector (*muhtasib*) checked weights and fraud."
  - kind: research
    en: "**Giving helps the giver, a little.** A meta-analysis of 27 experiments found that acts of kindness raise the giver's wellbeing (d ≈ 0.28; Curry et al., 2018). Studies of \"prosocial spending\" (Dunn et al., 2008) mostly replicate, with smaller effects than first reported. [Established, small]"
  - kind: practice
    en: "**Simple steps.** Give regularly, even a little {hadith:bukhari:1417}. Pay zakat as a right, not a favour. Never hide defects in what you sell {hadith:tirmidhi:1315}. Before buying more, remember the third valley {hadith:bukhari:6436}."
  - kind: heart
    en: |-
      **No shame in receiving.** The Quran calls what the poor receive "a known right" (70:24) "for the petitioner and the deprived" (70:25). Zakat is the poor's share by God's order, not a favour from the rich, and "those in debt" are one of its eight groups (9:60).

      **If you are in debt.** The Quran tells lenders: "if someone is in hardship, then [let there be] postponement until [a time of] ease" (2:280). The Prophet (pbuh) said that whoever wants God to save him from the torments of the Day of Resurrection "should give respite to the insolvent or remit (his debt)" {hadith:muslim:1563}. He himself often prayed for protection "from being in debt", because debt pushes a person to break promises {hadith:bukhari:2397}. Need and debt are hardships to be eased, not a mark against you.
followUps:
  - q:
      en: Is all bank interest *riba*?
    a:
      en: Most fiqh councils, including the International Islamic Fiqh Academy (1985), say yes; a minority, including Al-Azhar's Islamic Research Academy (2002), allowed fixed returns on bank investment. [Debated]
  - q:
      en: What is zakat?
    a:
      en: An obligatory yearly 2.5% of savings above the *nisab*, given to the eight groups the Quran names (9:60); see "Zakat in brief" above.
  - q:
      en: Does charity really not decrease wealth?
    a:
      en: The hadith says so {hadith:muslim:2588}; scholars understand it as blessing and reward, not as an accounting promise.
