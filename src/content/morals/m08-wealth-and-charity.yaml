slugs:
  tr: servet-ve-sadaka
  en: wealth-and-charity
order: 8
theme: wealth
title:
  tr: Servet, sadaka, adil ticaret ve sömürü yasağı
  en: Wealth, charity, fair trade, and the ban on exploitation
verses:
  - 2:261
  - 83:1-3
  - 59:7
  - 9:34
summary:
  tr: Zekât fakirin servetteki hakkıdır, bir lütuf değil. Servet yalnızca zenginler arasında dolaşmamalı.
  en: Zakat is a right of the poor over wealth, not a favor. Wealth should not circulate only among the rich.
teachings:
  tr: |
    - Sadaka, yedi başak bitiren ve her başakta yüz tane bulunan bir tane gibi çoğalır (2:261). Sadaka başa kakmakla ve incitmekle boşa çıkarılmamalıdır (2:262–264).
    - Faiz (*ribâ*) haramdır; ticaret helaldir; vazgeçenin geçmişi kendisinindir. Darda kalan borçluya süre tanınmalı, borcu bağışlamak daha hayırlıdır (2:275–280).
    - "Ölçüde ve tartıda hile yapanların vay hâline" (83:1–3).
    - Servet yalnızca zenginler arasında dolaşmamalıdır (59:7).
    - Altın ve gümüşü yığıp Allah yolunda harcamayanlara uyarı (9:34).
    - 9:60'ta sayılan zekât alanları (fakirler, yoksullar, borçlular, yolcular ve diğerleri).
    - Hadis: Hz. Peygamber faizi yiyene, yedirene, yazana ve şahitlerine lanet etti (Müslim 1598). "Doğru sözlü, güvenilir tüccar peygamberlerle, sıddıklarla ve şehitlerle beraberdir" (Tirmizî 1209; bazılarınca zayıf ile hasen arası sayılır). "[Fiyatları yükseltmek için] mal stoklayan günahkârdır" (Müslim 1605).
  en: |-
    - Charity multiplies like a grain that grows seven ears, each with a hundred grains (2:261). Charity should not be spoiled by reminders or hurt (2:262–264).
    - Usury (*ribā*) is forbidden; trade is allowed; whoever stops gets what passed, and debtors in hardship should be given time, and forgiving the debt is better (2:275–280).
    - "Woe to those who give short measure" (83:1–3).
    - Wealth should not circulate only among the rich (59:7).
    - Warning to those who hoard gold and silver and do not spend in God's way (9:34).
    - Zakat recipients listed in 9:60 (the poor, the needy, debtors, travelers, and others).
    - Hadith: The Prophet cursed the one who consumes *ribā*, the one who pays it, the one who writes it and the witnesses (Muslim 1598). "The honest, trustworthy merchant is with the prophets, the truthful and the martyrs" (Tirmidhī 1209; graded weak-to-fair by some). "Whoever hoards [to raise prices] is a sinner" (Muslim 1605).
scholarship:
  tr: |
    - **Makâsıd:** *servetin* korunması (*hıfzu'l-mâl*), beş klasik amaçtan biridir (Gazzâlî, Şâtıbî). İbn Âşûr, servetin *dolaşması* (*revâc*), açık ve adil olması (*vuzûh*, *adl*) gerektiğini ekler. Jasser Auda makâsıdı yalnızca korumayı değil, insanın gelişmesini amaçlayan bir sistem olarak okur.
    - **Ahlâk:** Gazzâlî (*İhyâ*, Cimriliğin Kınanması Kitabı) hırsı bir kalp hastalığı, cömertliği onun ilacı olarak ele alır. Râgıb el-İsfahânî serveti iyi kullanılması gereken bir emanet olarak görür.
    - Zekât, fakirin servet üzerindeki bir hakkıdır (*hak*), bir lütuf değil (70:24–25).
    - *Ribâ* konusunda âlimler yasakta hemfikirdir, ama bunun modern banka faizine ve enflasyona nasıl uygulanacağını tartışır [Debated, ayrıntılarda].
  en: |-
    - **Maqāṣid:** protecting *wealth* (*ḥifẓ al-māl*) is one of the five classical objectives (al-Ghazālī, al-Shāṭibī). Ibn ʿĀshūr adds that wealth must *circulate* (*rawāj*) and be clear and fair (*wuḍūḥ*, *ʿadl*). Jasser Auda reads the maqāṣid as a system aimed at human development, not only protection.
    - **Akhlaq:** al-Ghazālī (*Iḥyāʾ*, Book on the Condemnation of Miserliness) treats greed as a disease of the heart and generosity as its cure. Al-Rāghib al-Iṣfahānī frames wealth as a trust to be used well.
    - Zakat is a right of the poor over the wealth (*ḥaqq*), not a favor (70:24–25).
    - On *ribā*, scholars agree on the ban but debate how it applies to modern bank interest and inflation [Debated in its details].
evidence:
  tr: |
    - İyilik ve cömertlik davranışları verenin iyi oluşunu artırır. 27 deneyin meta-analizi (Curry ve ark., 2018) küçük-orta düzeyde bir etki buldu (d ≈ 0,28). [Established, *küçük*]
    - "Toplum yararına harcama" çalışmaları (başkaları için para harcamak, insanları kendileri için harcamaktan daha mutlu eder; Dunn ve ark., 2008) çoğunlukla tekrarlandı, ama etkiler ilk bildirilenden küçük. [Established, *küçük*]
    - Yüksek eşitsizlik, ülkeler arasında daha düşük toplumsal güven ve daha kötü sağlık sonuçlarıyla ilişkilidir (Wilkinson ve Pickett). [Debated, büyüklüğü ve nedenselliği; *orta*]
  en: |-
    - Acts of kindness and generosity raise the giver's wellbeing. A meta-analysis of 27 experiments (Curry et al., 2018) found a small-to-medium effect (d ≈ 0.28). [Established, *small*]
    - "Prosocial spending" studies (spending on others makes people happier than spending on themselves; Dunn et al., 2008) have mostly replicated, with smaller effects than first reported. [Established, *small*]
    - High inequality is associated with lower social trust and worse health outcomes across countries (Wilkinson & Pickett). [Debated in size and causality, *moderate*]
stories:
  tr: |
    - Tebük seferinde Ebû Bekir bütün servetini, Ömer yarısını verdi (Tirmizî 3675).
    - Osman, Medine'deki Rûme kuyusunu satın alıp herkesin ücretsiz kullanımına açtı.
    - **Vakıf**: İslam tarihi boyunca vakıflar hastaneleri, okulları, çeşmeleri, aşevlerini (*imaret*) ve hatta sokak hayvanlarının ve göçmen kuşların bakımını finanse etti. Osmanlı vakıfları yüzyıllarca kamu hizmetlerinin büyük bir kısmını yürüttü.
    - **Hisbe** kurumu (çarşı denetçisi, *muhtesib*) çarşılarda tartıları, ölçüleri ve hileyi denetledi.
  en: |-
    - Abū Bakr gave all his wealth, ʿUmar half, during the Tabūk campaign (Tirmidhī 3675).
    - ʿUthmān bought the well of Rūma in Medina and made it free for everyone.
    - **Waqf**: across Islamic history, endowments funded hospitals, schools, water fountains, soup kitchens (*imaret*), and even care for stray animals and migratory birds. Ottoman foundations ran a large share of public services for centuries.
    - The **ḥisba** office (market inspector, *muḥtasib*) checked weights, measures and fraud in markets.
gaps:
  tr: |
    - Bugünkü "İslami finansın" büyük kısmı, Müslüman iktisatçılar (ör. Mahmoud El-Gamal) tarafından, farklı ve daha adil bir finans kurmak yerine faizli ürünleri yeni adlarla kopyalamakla ("şeriat arbitrajı") eleştirildi.
    - Zekât toplama pek çok Müslüman çoğunluklu ülkede zayıf ya da gayriresmîdir ve birçoğunda eşitsizlik yüksektir.
    - İslam iktisadının büyük ölçekte daha iyi işlediği kanıtlanmış değildir; dürüstçe gösterilebilecek olan, ilkeleri ve sicilidir.
  en: |-
    - Much modern "Islamic finance" has been criticized by Muslim economists (e.g., Mahmoud El-Gamal) for copying interest-based products with new names ("sharia arbitrage") rather than building different, fairer finance.
    - Zakat collection is weak or informal in many Muslim-majority countries, and inequality in several is high.
    - Islamic economics has not been proven to work better at scale; what can honestly be shown is its principles and its record.
visualizations:
  - id: ideas
    tr: |
      - "2:261'in tanesi": bir tane yedi başağa, her başak yüz taneye dönüşür; sakin bir sayaçla canlandırılmış.
      - "Servet nereye akar" şeması: zekât ve sadakanın merkezden toplumun kenarlarına akışı (59:7), servetin tepede birikmesiyle karşılaştırmalı.
    en: |-
      - "The grain of 2:261": one seed becomes seven ears of a hundred grains each, animated, next to a calm counter.
      - A "where wealth flows" diagram: zakat and charity moving from the center to the edges of society (59:7), contrasted with wealth pooling at the top.
