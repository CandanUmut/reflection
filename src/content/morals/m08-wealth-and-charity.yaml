  - kind: research
    en: "**Zakat programmes report people lifted out of poverty, but the evidence is weak.** [Mixed.] Indonesia's national zakat agency BAZNAS reports that in 2024 zakat programmes lifted 1,350,227 people out of poverty, including 721,748 from extreme poverty, measured by an annual \"Zakat Impact Assessment survey\" against five poverty standards. The summary does not explain how the effect was attributed to zakat, gives no comparison group, and its provider breakdown (adding to about 1,486,920) does not match the total. These are self-reported programme figures, not independent evaluations."
    tr: "**Zekât programları insanları yoksulluktan kurtardığını bildiriyor, ama delil zayıf.** [Karışık.] Endonezya'nın ulusal zekât kurumu BAZNAS, 2024'te zekât programlarının 721.748'i aşırı yoksulluktan olmak üzere 1.350.227 kişiyi yoksulluktan kurtardığını bildiriyor; bu, beş yoksulluk ölçütüne göre yıllık bir \"Zekât Etki Değerlendirmesi anketi\" ile ölçülmüş. Özet etkinin zekâta nasıl atfedildiğini açıklamıyor, bir karşılaştırma grubu vermiyor ve kuruluşlara göre dağılımı (toplamı yaklaşık 1.486.920) toplamla uyuşmuyor. Bunlar bağımsız değerlendirmeler değil, programın kendi bildirdiği rakamlardır."
