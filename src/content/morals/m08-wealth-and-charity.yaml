  - kind: practice
    en: |-
      **Calculate zakāh each year**: savings, gold and silver above the *niṣāb*, business stock; 2.5%. Ask a local scholar which school's rule on jewellery you follow.

      **Check your trade.** Correct weights, honest descriptions, fair prices, no hidden defects (83:1–3).

      **Give "in spite of love for it"** (2:177): something you would rather keep, not only what is left over.

      **If you have a mortgage, student loan or pension**, find out what the scholars you trust say, look for Islamic alternatives, and avoid the guilt-driven extremes of either ignoring the question or despairing over it.
    tr: |-
      **Zekâtını her yıl hesapla**: birikimler, nisabın üzerindeki altın ve gümüş, ticari mallar; %2,5. Mücevher konusunda hangi mezhebin hükmünü izlediğini yerel bir âlime sor.

      **Ticaretini kontrol et.** Doğru tartılar, dürüst tarifler, adil fiyatlar, gizli kusur yok (83:1–3).

      **"Malı sevmesine rağmen" ver** (2:177): yalnızca artakalanı değil, elinde tutmayı tercih edeceğin bir şeyi.

      **Konut kredin, öğrenim kredin ya da emeklilik fonun varsa**, güvendiğin âlimlerin ne dediğini öğren, İslami alternatifler ara ve suçluluk duygusuyla iki uca — soruyu görmezden gelmeye ya da onun yüzünden umutsuzluğa düşmeye — kapılmaktan kaçın.
    title:
      en: Günlük hayatta
      tr: Günlük hayatta
  - kind: heart
    en: |-
      **If you are poor or in debt**, the Quran names you as having a right in the wealth of others, and tells creditors to give time to debtors in hardship (2:280). Zakāh is for you; asking for it is not shameful. Debt advice services in your country can help with practical steps.

      **If you already have an interest-bearing loan and feel you are sinning**, you are not alone, and scholars differ on the conditions under which it is excused (the European Council; AMJA). Talk to a scholar you trust about your situation, and do what you can to reduce interest.
    tr: |-
      **Yoksulsan ya da borçluysan**, Kur'an başkalarının servetinde senin bir hakkın olduğunu söyler ve alacaklılara darlık içindeki borçlulara süre tanımalarını emreder (2:280). Zekât senin içindir; onu istemek utanılacak bir şey değildir. Ülkendeki borç danışmanlığı hizmetleri pratik adımlarda yardımcı olabilir.

      **Zaten faizli bir kredin varsa ve günah işlediğini hissediyorsan**, yalnız değilsin ve âlimler bunun hangi şartlarda mazur görüleceği konusunda farklı görüşlere sahip (Avrupa Konseyi; AMJA). Durumunu güvendiğin bir âlimle konuş ve faizi azaltmak için elinden geleni yap.
    title:
      en: Zorlanan kişi için
      tr: Zorlanan kişi için
followUps:
  - q:
      en: Do I owe zakāh on my jewellery?
      tr: Mücevherim için zekât borçlu muyum?
    a:
      en: In the Hanafi school, yes, once it reaches the *niṣāb*; in the Maliki, Shafiʿi and Hanbali schools, not on jewellery that is worn.
      tr: Hanefî mezhebinde, nisaba ulaştığında evet; Mâlikî, Şâfiî ve Hanbelî mezheplerinde, takılan mücevher için hayır.
  - q:
      en: What is the *niṣāb*?
      tr: Nisap nedir?
    a:
      en: 85 grams of gold (or its value). The silver figure was not confirmed here.
      tr: 85 gram altın (ya da değeri). Gümüş rakamı burada doğrulanmadı.
  - q:
      en: I have a mortgage — am I sinning?
      tr: Konut kredim var — günah mı işliyorum?
    a:
      en: Interest is forbidden. The European Council for Fatwa (1999) allowed a mortgage for a first home in Europe under strict need; others disagree. Ask a scholar about your case.
      tr: Faiz haramdır. Avrupa Fetva Konseyi (1999), Avrupa'da ilk ev için, sıkı bir ihtiyaç şartıyla konut kredisine izin verdi; başkaları katılmıyor. Durumunu bir âlime sor.
  - q:
      en: Is a student loan allowed?
      tr: Öğrenim kredisi caiz mi?
    a:
      en: AMJA (2011) allows it only as a last resort, under strict conditions.
      tr: AMJA (2011) buna yalnızca son çare olarak, sıkı şartlarla izin veriyor.
  - q:
      en: Does zakāh actually reduce poverty?
      tr: Zekât gerçekten yoksulluğu azaltıyor mu?
    a:
      en: Indonesia's agency reports large numbers, but without independent evaluation; the evidence is not strong.
      tr: Endonezya'nın kurumu büyük rakamlar bildiriyor, ama bağımsız bir değerlendirme olmadan; delil güçlü değil.
  - q:
      en: Does 59:7 forbid inequality?
      tr: 59:7 eşitsizliği yasaklıyor mu?
    a:
      en: It is about *fayʾ*; using it as a general economic principle is a scholarly extension.
      tr: "*Fey* hakkındadır; onu genel bir iktisadi ilke olarak kullanmak âlimlerin yaptığı bir genişletmedir."
