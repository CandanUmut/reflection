fullAnswer:
  - kind: meaning
    en: '**Zakāh and ṣadaqa.** *Zakāh* is the obligatory annual alms, usually 2.5% of savings above a threshold (*niṣāb*) held for a lunar year. The root means "purification" and "growth". *Ṣadaqa* is voluntary charity. **Ribā** is usury or interest on loans, forbidden in the Quran (2:275–280).'
    tr: "**Zekât ve sadaka.** *Zekât*, genellikle bir kameri yıl boyunca elde tutulan ve belli bir eşiğin (*nisâb*) üzerindeki birikimin %2,5'i olan, farz yıllık mali ibadettir. Kökü \"arınma\" ve \"artma\" anlamına gelir. *Sadaka* gönüllü bağıştır. **Ribâ**, Kur'an'da yasaklanan (2:275–280) tefecilik ya da borçlarda faizdir."
    title:
      en: Ne anlama geliyor?
      tr: Ne anlama geliyor?
  - kind: quran
    en: |-
      **Charity that multiplies (2:261).** "The example of those who spend their wealth in the way of Allah is like a seed [of grain] which grows seven spikes; in each spike is a hundred grains. And Allah multiplies [His reward] for whom He wills" (2:261), Medinan.

      **Righteousness includes giving (2:177).** "[True] righteousness is [in] one who believes in Allah… and gives wealth, in spite of love for it, to relatives, orphans, the needy, the traveler, those who ask [for help], and for freeing slaves; [and who] establishes prayer and gives zakah" (2:177). Giving "in spite of love for it" is named before prayer.

      **Cheating in trade (83:1–3).** "Woe to those who give less [than due], Who, when they take a measure from people, take in full. But if they give by measure or by weight to them, they cause loss" (83:1–3), Meccan.

      **Wealth must not circulate only among the rich (59:7).** "And what Allah restored to His Messenger from the people of the towns — it is for Allah and for the Messenger and for [his] near relatives and orphans and the [stranded] traveler — so that it will not be a perpetual distribution among the rich from among you" (59:7). The verse is about *fayʾ*, property gained without fighting (here, from the Banu Nadir), and how it was divided. Using its principle as a general rule against concentration of wealth is a scholarly extension, and should be labelled as one.

      **Hoarding (9:34).** "And those who hoard gold and silver and spend it not in the way of Allah — give them tidings of a painful punishment" (9:34), Medinan.

      **Neglecting the poor (107:1–3).** "Have you seen the one who denies the Recompense? For that is the one who drives away the orphan And does not encourage the feeding of the poor" (107:1–3), Meccan: denying religion is shown in how one treats the poor.
    tr: |-
      **Çoğalan sadaka (2:261).** "Mallarını Allah yolunda harcayanların durumu, bir tanenin durumu gibidir ki, yedi başak bitirmiş ve her başakta yüz tane var. Allah, dilediğine daha da katlar." (2:261), Medenî.

      **İyilik, vermeyi içerir (2:177).** "Fakat eren o kimselerdir ki, Allah'a, ahiret gününe, meleklere, kitaba ve bütün peygamberlere iman edip, yakınlığı olanlara, öksüzlere, yoksullara, yolda kalmışa, dilenenlere ve esirleri kurtarmaya seve seve mal verirler. Namazı kılarlar, zekatı verirler." (2:177). Saheeh International "seve seve" kısmını İngilizcede "in spite of love for it" ("ona duyduğu sevgiye rağmen", yani malı sevmesine rağmen) olarak çevirir. Malı sevmesine rağmen vermek, namazdan önce anılır.

      **Ticarette hile (83:1–3).** "Eksik ölçüp tartanların vay haline! Onlar insanlardan kendilerine bir şey aldıkları zaman tam ölçerler. Kendileri başkalarına bir şey ölçtükleri veya tarttıkları zaman eksik ölçer ve tartarlar." (83:1–3), Mekkî.

      **Servet yalnızca zenginler arasında dolaşmamalı (59:7).** "Allah'ın o kent halkından, Resulüne verdiği ganimetler, Allah'a, Resul'e, ona akrabalığı bulunanlara, yetimlere, yoksullara, yolcuya aittir. Ta ki içinizden yalnız zenginler arasında dolaşan bir şey olmasın." (59:7). Âyet, savaşmadan elde edilen mal olan *fey* (burada Benî Nadîr'den) ve onun nasıl paylaştırıldığı hakkındadır. İlkesini servetin yoğunlaşmasına karşı genel bir kural olarak kullanmak, âlimlerin yaptığı bir genişletmedir ve öyle etiketlenmelidir.

      **İstifçilik (9:34).** "Bir de altın ve gümüşü hazineye doldurup, onları Allah yolunda sarfetmeyenleri bu yüzden acıklı bir azap ile müjdele!" (9:34), Medenî.

      **Yoksulu ihmal etmek (107:1–3).** "Dini yalanlayanı gördün mü? İşte o, öksüzü iter, kakar. Yoksulu doyurmaya önayak olmaz." (107:1–3), Mekkî: Dini yalanlamak, insanın yoksula nasıl davrandığında görünür.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: fiqh
    en: |-
      **Zakāh on worn jewellery.** For the Hanafi school, zakāh "is obligatory when the nisab is sufficient", whether the jewellery alone or together with other wealth reaches it; for the Maliki, Shafiʿi and Hanbali schools, on permissible adornments that are worn, "zakat is not obligatory" (Mufti of the Federal Territory, Malaysia, citing al-Qaradawi). The named works of each school have not yet been consulted. Monzer Kahf, an economist of Islamic finance, notes that jewellery kept as a store of wealth rather than worn is widely treated as zakatable (IslamOnline).

      **The niṣāb.** "The renown nisab for gold is 85 grams" (Mufti of the Federal Territory; IslamOnline). The silver *niṣāb* (commonly given as 595 grams) was not confirmed in a source.

      **Mortgages for Muslims in the West.** The European Council for Fatwa and Research, at its fourth session (27–31 October 1999), reaffirmed that interest is forbidden but allowed a Muslim in Europe to take a conventional mortgage if they do not own a house and cannot buy one without a loan, "until" Islamic alternatives are available. Its grounds: a need (*ḥāja*) can be "elevated to a necessity (*ḍarūra*)" when it causes hardship, under the maxim "Necessities make the unlawful lawful", and renting would restrict where Muslims can live — for example near a mosque or school (Kamali). Yusuf al-Qaradawi endorsed the ruling. Many other scholars reject it; their arguments have not yet been consulted.

      **Student loans.** The Assembly of Muslim Jurists of America (AMJA), in a 2011 fatwa by Dr. Main Khalid al-Qudah, holds that "the default is the forbiddance of interest-based loans", but allows a student loan as an "urgent necessity" if all alternatives (scholarships, grants, work-study, subsidised loans) are exhausted, the loan is the only way to study, only the needed amount is borrowed, qualified scholars assess the need, and it is repaid as soon as possible. The necessity "removes the sin even though the ruling of impermissibility remains."

      **Pensions.** Rulings on pensions have not yet been consulted.
    tr: |-
      **Kullanılan mücevherin zekâtı.** Hanefî mezhebine göre zekât, mücevher tek başına ya da diğer mallarla birlikte nisaba ulaştığında, "nisap yeterli olduğunda farzdır"; Mâlikî, Şâfiî ve Hanbelî mezheplerine göre ise kullanılan, mubah süs eşyaları için "zekât farz değildir" (Malezya Federal Bölge Müftülüğü, Karadâvî'ye atıfla). Her mezhebin adı belli eserlerine henüz başvurulmadı. İslami finans iktisatçısı Münzir Kahf, takılmayıp servet olarak saklanan mücevherin yaygın olarak zekâta tabi sayıldığını not eder (IslamOnline).

      **Nisap.** "Altın için bilinen nisap 85 gramdır" (Federal Bölge Müftülüğü; IslamOnline). Gümüş nisabı (yaygın olarak 595 gram verilir) bir kaynakta doğrulanmadı.

      **Batı'daki Müslümanlar için konut kredisi.** Avrupa Fetva ve Araştırma Konseyi, dördüncü oturumunda (27–31 Ekim 1999), faizin haram olduğunu yeniden teyit etti, ama Avrupa'daki bir Müslümanın evi yoksa ve kredi olmadan ev alamıyorsa, İslami alternatifler mevcut olana "kadar" geleneksel bir konut kredisi almasına izin verdi. Gerekçesi: Bir ihtiyaç (*hâcet*), sıkıntıya yol açtığında "zaruret (*darûret*) derecesine yükseltilebilir"; "Zaruretler haramları mubah kılar" kaidesine göre; ve kiralamak, Müslümanların nerede yaşayabileceğini — örneğin bir camiye ya da okula yakın — kısıtlar (Kamali). Yûsuf el-Karadâvî bu kararı destekledi. Pek çok başka âlim onu reddeder; argümanlarına henüz başvurulmadı.

      **Öğrenim kredileri.** Amerika Müslüman Fakihler Meclisi (AMJA), Dr. Main Khalid el-Kudâh'ın 2011 tarihli bir fetvasında, "faizli kredilerde aslın haramlık olduğunu" kabul eder, ama bütün alternatifler (burslar, hibeler, çalışarak okuma programları, sübvansiyonlu krediler) tükenmişse, kredi okumanın tek yoluysa, yalnızca gereken miktar borç alınıyorsa, ehil âlimler ihtiyacı değerlendiriyorsa ve en kısa sürede geri ödeniyorsa, bir öğrenim kredisine "acil bir zaruret" olarak izin verir. Zaruret, "haramlık hükmü devam etse de günahı kaldırır."

      **Emeklilik fonları.** Emeklilik fonlarıyla ilgili hükümlere henüz başvurulmadı.
    title:
      en: Dört mezhep ne diyor?
