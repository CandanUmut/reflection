title:
  tr: Rahmet ve ihsan
  en: Mercy and iḥsān
summary:
  tr: Allah'ın rahmeti her şeyi kuşatır (7:156). Kur'an Hz. Peygamber'i âlemlere rahmet olarak tanıtır ve onun kaba, katı yürekli olsaydı insanların etrafından dağılıp gideceğini söyler (3:159).
  en: "God's \"mercy encompasses all things\" (7:156), and the Prophet (pbuh) was sent \"as a mercy to the worlds\" (21:107). Mercy in Islam is not softness alone: it is care that reaches people, animals, and even the way a task is done."
hadith:
  tr: |
    - Allah rahmeti yüz parça kıldı ve bunun yalnızca bir parçasını yeryüzüne indirdi (Buhârî 6000). Doksan dokuz parçası âhiret için saklıdır (Müslim 2752).
    - Allah her şeyde ihsanı (güzel davranmayı) emretmiştir (Müslim 1955).
    - Susuz kalmış bir köpeğe su veren kadın (Buhârî 3467).
  en: |
    - God made mercy in one hundred parts and sent down only one of them to the earth (Bukhārī 6000). Ninety-nine parts are kept for the Hereafter (Muslim 2752).
    - God has prescribed iḥsān (doing things beautifully and well) in all things (Muslim 1955).
    - The woman who gave water to a thirsty dog (Bukhārī 3467).
gaps:
  tr: Sert vaaz dili, 3:159 ile çelişir. Âyet, Hz. Peygamber kaba ve katı yürekli olsaydı insanların etrafından dağılıp gideceğini söyler.
  en: Harsh preaching and cold religious authority contradict 3:159, which says harshness drives people away. The page describes the teaching; it does not claim every Muslim community lives it.
