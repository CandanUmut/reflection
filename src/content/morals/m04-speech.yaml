summary:
  tr: "Kur'an alay etmeyi, kötü lakapları, zannı, kusur araştırmayı ve gıybeti yasaklar ve gıybete çarpıcı bir benzetme verir: \"Biriniz, ölmüş kardeşinin etini yemekten hoşlanır mı? İşte bundan tiksindiniz.\" (49:12). Ama birinin yanlışından söz etmek her zaman yasak değildir: Âlimler bunun caiz, hatta gerekli olduğu durumları — haksızlıktan şikâyet etmek, başkalarını zarara karşı uyarmak — tek tek saydı."
  en: "The Quran forbids mockery, insulting nicknames, suspicion, spying and backbiting, and gives backbiting a striking image: \"Would one of you like to eat the flesh of his brother when dead? You would detest it\" (49:12). But speaking about someone's wrong is not always forbidden: scholars set out cases — complaining of injustice, warning others of harm — where it is allowed or even required."
