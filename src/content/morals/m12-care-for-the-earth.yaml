fullAnswer:
  - kind: quran
    en: |-
      **No excess.** "O children of Adam, take your adornment at every masjid, and eat and drink, but be not excessive. Indeed, He likes not those who commit excess" (7:31).

      **Corruption has consequences.** "Corruption has appeared throughout the land and sea by [reason of] what the hands of people have earned so He may let them taste part of [the consequence of] what they have done that perhaps they will return" (30:41).

      **Keep the balance.** "That you not transgress within the balance" (55:8).
  - kind: sunnah
    en: |-
      **Planting is charity.** "There is none amongst the Muslims who plants a tree or sows seeds, and then a bird, or a person or an animal eats from it, but is regarded as a charitable gift for him" {hadith:bukhari:2320}.

      **Protected land.** "No Hima except for Allah and His Apostle": the Prophet (pbuh) made the place called al-Naqi' a protected pasture (*hima*), ending private reserves kept by the powerful {hadith:bukhari:2370}.

      **Water.** A hadith about not wasting water even at a flowing river is often quoted ({hadith:ibnmajah:425}); its chain is weak, so it is not used here as evidence. 7:31 makes the same point.
  - kind: scholars
    en: "**Stewardship, old and new.** Many modern scholars read the human as *khalifa* (2:30) in the sense of steward: the earth is a trust, not property to exhaust. Classical tafsir more often read *khalifa* as succession of generations or as ruling with justice; the ecological reading is a modern extension, consistent with 7:31 and 55:8. Thinkers such as S. H. Nasr (*Man and Nature*, 1968) and the Islamic Declaration on Global Climate Change (Istanbul, 2015) built on it."
  - kind: research
    en: "**Nature is good for people.** Spending about 120 minutes a week in nature is associated with better health and wellbeing (White et al., 2019). [Moderate, correlational] Religion's effect on environmental behaviour is mixed across studies: values need to be taught explicitly to turn into action. [Mixed]"
  - kind: practice
    en: "**Concrete steps.** Waste less food, especially in Ramadan; use water carefully, even at the mosque; plant something {hadith:bukhari:2320}; support protected green spaces, the modern *hima*."
followUps:
  - q:
      en: Does the Quran talk about climate change?
    a:
      en: No; it speaks of excess (7:31), corruption on land and sea (30:41) and balance (55:8), which believers apply to today's problems.
  - q:
      en: Is "khalifa" really about the environment?
    a:
      en: That is a modern reading; classical commentators mostly read it otherwise (see above).
