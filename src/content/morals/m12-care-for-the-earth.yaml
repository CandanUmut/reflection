title:
  tr: Yeryüzüne özen, ölçülülük ve yeryüzünde bozgunculuktan sakınmak
  en: Care for the earth, moderation, and avoiding corruption on earth
verses:
  - 7:31
  - 30:41
  - 6:141
  - 55:7-9
  - 2:205
  - 2:30
summary:
  tr: '"Kıyamet kopmak üzereyken birinizin elinde bir hurma fidanı varsa, onu diksin."'
  en: '"Eat and drink, but be not excessive" (7:31). "Corruption has appeared throughout the land and sea by [reason of] what the hands of people have earned" (30:41). Planting is charity even when an animal eats the fruit {hadith:bukhari:2320}.'
teachings:
  tr: |
    - "Yiyin, için, fakat israf etmeyin; O israf edenleri sevmez" (7:31; ayrıca 6:141).
    - "İnsanların kendi elleriyle yaptıkları yüzünden karada ve denizde bozulma ortaya çıktı" (30:41).
    - "Dengeyi bozmayın" (55:8).
    - Yeryüzünde *halife* (ardıl, emanetçi) olarak insan (2:30).
    - Güç kazandıklarında "bozgunculuk çıkaran, ekinleri ve hayvanları helak edenler" (2:205).
    - Hadis: "Kıyamet kopmak üzereyken birinizin elinde bir hurma fidanı varsa, onu diksin" (Müsned, Ahmed 12902; el-Edebü'l-Müfred 479). "Bir Müslüman bir ağaç diker ya da ekin eker de ondan bir kuş, bir insan ya da bir hayvan yerse, bu onun için sadakadır" (Buhârî 2320). Akan bir nehir kenarında bile suyu israf etmek üzerine olan hadis ({hadith:ibnmajah:425}) — **bu hadisin senedi zayıftır**.
  en: |
    - "Eat and drink, but do not waste; He does not love the wasteful" (7:31; also 6:141).
    - "Corruption has appeared on land and sea because of what people's hands have earned" (30:41).
    - "Do not transgress the balance" (55:8).
    - The human as *khalīfa* (successor, steward) on earth (2:30).
    - Those who, when they gain power, "spread corruption, destroying crops and livestock" (2:205).
    - Hadith: "If the Hour is about to come and one of you has a palm shoot in his hand, let him plant it" (Musnad Aḥmad 12902; al-Adab al-Mufrad 479). "Any Muslim who plants a tree or sows a crop, and a bird, a person or an animal eats from it, it is charity for him" (Bukhārī 2320). On wasting water even at a flowing river ({hadith:ibnmajah:425}) — **this hadith's chain is weak**.
scholarship:
  tr: |
    - *Hilâfet*, pek çok modern âlim tarafından emanetçilik olarak okunur: yeryüzü tüketilecek bir mülk değil, bir emanettir (*emanet*). Klasik tefsir *halife*yi daha çok nesillerin birbirini izlemesi ya da adaletle yönetmek olarak okudu; ekolojik okuma modern bir genişletmedir [Scholarly].
    - Hz. Peygamber, Medine yakınındaki Nakî' gibi otlak için korunan alanlar (*hima*) belirledi (Buhârî 2370: "Hima ancak Allah'ın ve Resûlü'nündür"); güçlülerin özel, kapalı korularına son verdi.
    - Çağdaş düşünürler: S.H. Nasr (*Man and Nature*, 1968) ekolojik krizin manevî kökleri üzerine; **Küresel İklim Değişikliğine Dair İslami Deklarasyon** (İstanbul, 2015).
  en: |-
    - *Khilāfa* is read by many modern scholars as stewardship: the earth is a trust (*amāna*), not property to exhaust. Classical tafsir more often read *khalīfa* as succession of generations or as ruling with justice; the ecological reading is a modern extension [Scholarly].
    - The Prophet established protected zones (*ḥimā*), such as al-Naqīʿ near Medina, for grazing (Bukhārī 2370: "No ḥimā except for God and His Messenger"), ending private, exclusive reserves by the powerful.
    - Contemporary thinkers: S.H. Nasr (*Man and Nature*, 1968) on the spiritual roots of the ecological crisis; the **Islamic Declaration on Global Climate Change** (Istanbul, 2015).
evidence:
  tr: |
    - Doğada vakit geçirmek, daha iyi ruh hâli ve daha düşük stresle ilişkilidir (derleme kanıtları; ör. White ve ark., 2019'da haftada yaklaşık 120 dakikalık eşik). [*orta*, ilişkisel]
    - Dinin çevreci davranışa etkisi çalışmalar arasında **karışıktır**; değerlerin eyleme dönüşmesi için açıkça öğretilmesi gerekir. [*karışık*]
  en: |-
    - Time in nature is associated with better mood and lower stress (review evidence; e.g., ~120 minutes per week threshold in White et al., 2019). [*moderate*, correlational]
    - Religion's effect on pro-environmental behavior is **mixed** across studies; values must be taught explicitly to translate into action. [*mixed*]
stories:
  tr: |
    - Ebû Bekir'in ordulara talimatları arasında meyve ağaçlarını kesmemek ve yiyecek dışında hayvan öldürmemek vardı (Mâlik, *Muvatta*).
    - Osmanlı vakıfları leyleklerin ve göçmen kuşların bakımını ve cami duvarlarına yapılan "kuş köşkleri"ni finanse etti.
    - Geleneksel *hima* sistemleri, Orta Doğu'nun bazı bölgelerinde topluluk temelli koruma olarak yeniden canlandırılıyor.
  en: |-
    - Abū Bakr's instructions to armies included not cutting fruit trees or killing animals except for food (Mālik, *Muwaṭṭaʾ*).
    - Ottoman waqfs paid for the care of storks and migratory birds, and for "bird palaces" (*kuş köşkleri*) built into mosque walls.
    - Traditional *ḥimā* systems are being revived in parts of the Middle East as community conservation.
gaps:
  tr: |
    - Orta Doğu ve Kuzey Afrika dünyanın su sıkıntısı en yüksek bölgesidir; pek çok Müslüman çoğunluklu ülkede su israfı ve kirliliği ciddi sorunlardır.
    - Gıda israfı, plastik kullanımı ve aşırı tüketim, Ramazan dâhil pek çok yerde yüksektir.
    - Müslümanların doğal olarak daha iyi çevreci olduğunu söylemenin bir dayanağı yoktur; burada gösterilen, öğreti ve onunla uygulama arasındaki dürüst boşluktur.
  en: The Middle East and North Africa is the most water-stressed region on earth, and waste and pollution are serious in many Muslim-majority countries. There is no basis for claiming that Muslims are naturally better environmentalists; what is shown here is the teaching, and the gap between it and practice.
visualizations:
  - id: ideas
    tr: |
      - "Yine de dik": son saat hadisi sakin bir canlandırma olarak — ışık değişirken toprağa bir hurma fidanı yerleştiren bir el.
      - Bir *hima* harita kartı: herkesin paylaştığı korunan bir vadi ve çitle çevrilmiş özel arazi.
    en: |-
      - "Plant it anyway": the last-hour hadith as a quiet animation — a hand placing a palm shoot into earth as the light changes.
      - A *ḥimā* map card: a protected valley shared by all, versus fenced private land.
