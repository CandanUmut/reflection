summary:
  tr: Kur'an inkârı toplumsal bir ihmal olarak tarif eder — yetimi itip kakan, yoksulu doyurmaya teşvik etmeyen.
  en: "The Quran describes faith in social terms: denying the Judgment looks like pushing away the orphan (107:1–2). Care reaches out in rings — parents, relatives, orphans, the needy, near and far neighbours, the traveller (4:36)."
teachings:
  tr: |
    - "Öyleyse yetimi ezme; isteyeni de azarlama" (93:9–10).
    - Anne babaya, akrabaya, yetimlere, yoksullara, yakın komşuya, uzak komşuya, yanındaki arkadaşa ve yolcuya iyilik (4:36).
    - "Dini yalanlayanı gördün mü? İşte o, yetimi itip kakar ve yoksulu doyurmaya teşvik etmez" (107:1–3) — imanın inkârı, toplumsal bir ihmal olarak tarif edilir.
    - Gerçek iyilik, malı sevmesine rağmen akrabaya, yetimlere, yoksullara, yolcuya ve isteyenlere vermeyi de içerir (2:177).
    - "Biz sizi yalnızca Allah rızası için doyuruyoruz; sizden ne bir karşılık ne bir teşekkür istiyoruz" (76:9).
    - Hadis: "Ben ve yetime bakan kişi cennette böyleyiz" — iki parmağını birleştirerek (Buhârî 5304). "Cebrail bana komşu hakkında o kadar tavsiyede bulundu ki, onu mirasçı kılacak sandım" (Buhârî 6014). "Komşusu açken tok yatan mümin değildir" (el-Edebü'l-Müfred 112).
  en: |-
    - "As for the orphan, do not oppress; as for the one who asks, do not repel" (93:9–10).
    - Kindness to parents, relatives, orphans, the needy, the near neighbor, the distant neighbor, the companion at your side, and the traveler (4:36).
    - "Have you seen the one who denies the Judgment? That is the one who pushes away the orphan and does not urge feeding the poor" (107:1–3) — denial of faith described as social neglect.
    - True righteousness includes giving wealth, despite loving it, to relatives, orphans, the needy, the traveler and those who ask (2:177).
    - "We feed you only for the sake of God; we want no reward or thanks" (76:9).
    - Hadith: "I and the one who cares for an orphan will be in Paradise like this," holding two fingers together (Bukhārī 5304). "Gabriel kept advising me about the neighbor until I thought he would make him an heir" (Bukhārī 6014). "He is not a believer who eats his fill while his neighbor goes hungry" (al-Adab al-Mufrad 112).
scholarship:
  tr: |
    - Klasik fakihler "komşu"yu geniş tanımladı — bazı rivayetlerde her yönde kırk ev — ve gayrimüslim komşuları da bu hakka dâhil etti (Kurtubî, 4:36).
    - Gazzâlî komşu haklarını sayar: selam vermek, hastayı ziyaret etmek, teselli etmek, yemek paylaşmak, kusurlarını örtmek.
    - Makâsıd çerçevesinde zayıfa özen; *canı* (*nefs*), *nesli/aileyi* (*nesl*) ve *onuru* (*ırz*) korur.
  en: |-
    - Classical jurists defined "neighbor" widely — some reported forty houses in each direction — and included non-Muslim neighbors in the right (al-Qurṭubī on 4:36).
    - Al-Ghazālī lists the rights of neighbors: greeting them, visiting the sick, consoling them, sharing food, covering their faults.
    - In the maqāṣid frame, care for the weak protects *life* (*nafs*), *lineage/family* (*nasl*) and *dignity* (*ʿirḍ*).
evidence:
  tr: |
    - Güçlü sosyal ilişkiler, çalışma süreleri boyunca yaklaşık **%50 daha yüksek hayatta kalma olasılığıyla** ilişkilidir (Holt-Lunstad ve ark., 2010; 148 çalışma, yaklaşık 308.000 kişi). [Established, *orta–güçlü*, ilişkisel]
    - Yalnızlık ve yalıtılmışlık, daha kötü beden ve ruh sağlığıyla ilişkilidir. [Established]
    - Büyük kurumlarda büyütülen çocuklar, aile temelli bakıma göre gelişimsel gecikmeler gösterir (Bükreş Erken Müdahale Projesi). [Established] Bu, İslam'ın aile benzeri yetim bakımını (*kefâlet*) tercih etmesini destekler.
  en: |-
    - Strong social relationships are linked to about **50% higher odds of survival** over the study periods (Holt-Lunstad et al., 2010; 148 studies, ~308,000 people). [Established, *moderate–strong*, correlational]
    - Loneliness and isolation are associated with worse physical and mental health. [Established]
    - Children raised in large institutions show developmental delays compared with family-based care (Bucharest Early Intervention Project). [Established] This supports the Islamic preference for family-like orphan care (*kafāla*).
stories:
  tr: |
    - Hz. Peygamber'in kendisi de yetimdi (93:6); dedesi ve amcası tarafından büyütüldü.
    - İslam şehirlerinde yolcular için vakıflar (kervansaraylar, *hanlar*), aşevleri ve hatta yoksul gelinlere çeyiz sağlayan, hizmetçiler cezalandırılmasın diye kırılan tabakları yenileyen vakıflar vardı.
    - *Kefâlet* (yetimin kendi adını ve soyunu koruyarak himaye edilmesi) yaşayan bir uygulamadır.
  en: |-
    - The Prophet was himself an orphan (93:6), raised by his grandfather and uncle.
    - Islamic cities had waqfs for travelers (caravanserais, *han*), soup kitchens, and even foundations to provide dowries for poor brides and to replace broken dishes for servants so they would not be punished.
    - *Kafāla* (sponsorship of an orphan, keeping their own name and lineage) remains a living practice.
gaps:
  tr: |
    - Modern şehirlerde komşuluk ilişkileri çoğu zaman zayıftır; pek çok kişi komşusunu tanımaz.
    - Müslüman çoğunluklu ülkelerde yetim ve mülteci bakımı, güçlü programlardan ciddi ihmale kadar büyük farklılıklar gösterir.
    - *Kefâlet*, Batı'daki evlat edinmeden farklıdır (çocuk soyunu korur); burada basitçe "daha iyi" diye değil, tarafsız biçimde anlatılır.
  en: Neighbour relationships in modern cities are often thin. Orphan and refugee care in Muslim-majority countries ranges from strong programmes to serious neglect.
visualizations:
  - id: ideas
    tr: |
      - **Haklar çemberi** (Birinci Grup'tan): benlik → anne baba → akrabalar → yakın komşu → uzak komşu → yolcu → insanlık şeklinde iç içe halkalar, her biri kendi âyetiyle aydınlanır.
      - Birleştirilmiş iki parmak (Buhârî 5304), sakin bir çizgi resim olarak.
    en: |-
      - **The circle of rights** (from Batch 1): concentric rings from self → parents → relatives → near neighbor → far neighbor → traveler → humanity, each lighting up with its verse.
      - Two fingers held together (Bukhārī 5304) drawn as a quiet line illustration.
