fullAnswer:
  - kind: quran
    en: |-
      **The circle of care.** "Worship Allah and associate nothing with Him, and to parents do good, and to relatives, orphans, the needy, the near neighbor, the neighbor farther away, the companion at your side, the traveler" (4:36).

      **Righteousness is giving what you love.** True righteousness includes giving wealth "in spite of love for it, to relatives, orphans, the needy, the traveler, those who ask [for help]" (2:177).

      **Faith shows in how you treat the weak.** "So as for the orphan, do not oppress [him]" (93:9). "Have you seen the one who denies the Recompense?" (107:1) — the sura answers: the one who pushes away the orphan and does not urge feeding the poor.
  - kind: sunnah
    en: |-
      **Next to him in Paradise.** "I and the one who looks after an orphan will be like this in Paradise", showing his middle and index fingers {hadith:bukhari:5304}.

      **Caring for widows and the poor.** "The one who looks after a widow or a poor person is like a Mujahid who fights for Allah's Cause, or like him who performs prayers all the night and fasts all the day" {hadith:bukhari:5353}.

      **Neighbours.** "Gabriel continued to recommend me about treating the neighbors kindly and politely so much so that I thought he would order me to make them as my heirs" {hadith:bukhari:6014}. And three times: "By Allah, he does not believe" — the one whose neighbour is not safe from his harm {hadith:bukhari:6016}.
  - kind: scholars
    en: "**Neighbours, widely.** Al-Qurtubi, on 4:36, reports a wide definition of neighbour (some said forty houses in each direction) and includes non-Muslim neighbours in the right. Al-Ghazali lists neighbours' rights: greeting, visiting the sick, consoling, sharing food, covering faults."
  - kind: research
    en: "**Connection keeps people alive.** A meta-analysis of 148 studies (about 308,000 people) found that strong social relationships were linked to about 50% higher odds of survival over the study periods (Holt-Lunstad et al., 2010). [Established, correlational] Children raised in large institutions show developmental delays compared with family-based care (Bucharest Early Intervention Project). [Established]"
  - kind: practice
    en: "**Start next door.** Learn your neighbours' names; share food; check on the elderly; sponsor an orphan through a trusted programme; welcome travellers and newcomers (4:36)."
  - kind: heart
    en: "**You are named in these verses.** The orphan, the needy, the traveller and the stranger are the people the Quran asks others to care for (4:36). If you are alone, reaching out for help is not weakness; it is what the community owes you."
followUps:
  - q:
      en: Does "neighbour" include non-Muslims?
    a:
      en: Al-Qurtubi includes them, on 4:36.
  - q:
      en: What is *kafala*?
    a:
      en: Sponsoring an orphan who keeps their own name and lineage. It differs from adoption as practised in many countries; it is described here neutrally, not as simply "better".
  - q:
      en: What does "those whom your right hands possess" in 4:36 mean?
    a:
      en: It refers to slaves in the society of the time; slavery and the Quran are discussed honestly in the question on slavery.
