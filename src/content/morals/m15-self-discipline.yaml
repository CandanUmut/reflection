  - 12:53
  - 13:11
summary:
  tr: '"Allah katında amellerin en sevimlisi, az da olsa devamlı olanıdır" (Buhârî 6464). Uzun ve inişli çıkışlı bir yol.'
  en: '"He has succeeded who purifies it, and he has failed who instills it [with corruption]" (91:9–10). Character is trained, little by little: "the most beloved deed to Allah is the most regular and constant even if it were little" {hadith:bukhari:6464}.'
teachings:
  tr: |
    - "Nefse ve onu düzenleyene, ona kötülüğünü ve takvasını ilham edene andolsun ki: onu arındıran kurtulmuş, onu gömüp kirleten ziyana uğramıştır" (91:7–10).
    - "Kim Rabbinin huzurunda durmaktan korkar ve nefsini hevadan alıkoyarsa, cennet onun barınağıdır" (79:40–41).
    - "Bizim uğrumuzda mücâhede edenleri (çaba gösterenleri) elbette yollarımıza ileteceğiz" (29:69).
    - "Nefis, Rabbimin merhamet ettiği müstesna, kötülüğü emreder" (12:53) — nefsin mertebeleri vardır (emmâre, levvâme 75:2, mutmainne 89:27).
    - "Bir toplum kendinde olanı değiştirmedikçe Allah onların durumunu değiştirmez" (13:11).
    - Hadis: "Mücahid, Allah için nefsiyle mücadele edendir" (Tirmizî 1621). "Allah katında amellerin en sevimlisi, az da olsa devamlı olanıdır" (Buhârî 6464).
  en: |-
    - "By the soul and the One who shaped it, and inspired it with its wickedness and its mindfulness: successful is the one who purifies it, and failed is the one who buries it" (91:7–10).
    - "As for one who feared standing before his Lord and held the self back from desire, Paradise is the refuge" (79:40–41).
    - "Those who strive in Us, We will surely guide them to Our ways" (29:69).
    - "The self commands to evil, except whom my Lord has mercy on" (12:53) — the soul has stages (commanding, blaming 75:2, at peace 89:27).
    - "God does not change a people's condition until they change what is in themselves" (13:11).
    - Hadith: "The *mujāhid* is the one who strives against his own self for God's sake" (Tirmidhī 1621). "The most beloved deeds to God are those done consistently, even if small" (Bukhārī 6464).
scholarship:
  tr: |
    - **Tezkiye** (arınma) ve **mücâhede** (nefisle mücadele), İslam ahlâkının merkezî temalarıdır.
    - Gazzâlî (*İhyâ*, "Riyâzatü'n-Nefs") nefsi eğitmeyi bir atı eğitmeye benzetir: ne ezmek ne şımartmak, alışkanlıkları yavaş yavaş oluşturmak.
    - Miskeveyh (*Tehzîbü'l-Ahlâk*) ve Nasîrüddîn-i Tûsî (*Ahlâk-ı Nâsırî*, Farsça) Aristoteles'in üzerine kurar: erdem, ikinci bir tabiat olana kadar tekrarlanan davranışla oluşan dengeli bir orta yoldur.
    - Nefsin mertebeleri (*nefs-i emmâre, levvâme, mutmainne*) bir büyüme haritası sunar.
  en: |-
    - **Tazkiya** (purification) and **mujāhada** (striving against the self) are central themes of Islamic ethics.
    - Al-Ghazālī (*Iḥyāʾ*, "Riyāḍat al-Nafs") compares training the soul to training a horse: neither crushing nor indulging, with gradual habits.
    - Miskawayh (*Tahdhīb al-Akhlāq*) and Naṣīr al-Dīn al-Ṭūsī (*Akhlāq-i Nāṣirī*, Persian) build on Aristotle: virtue is a balanced middle formed by repeated action until it becomes second nature.
    - The stages of the soul (*nafs ammāra, lawwāma, muṭmaʾinna*) give a map of growth.
evidence:
  tr: |
    - Dunedin çalışmasında (doğumdan itibaren izlenen yaklaşık 1.000 çocuk), çocukluktaki öz denetim, zekâ ve sosyal sınıf kontrol edildikten sonra bile yetişkinlikteki sağlığı, serveti ve daha az mahkûmiyeti yordadı (Moffitt ve ark., *PNAS* 2011). [Established, *orta*]
    - Yeni alışkanlıklar zaman alır: bir çalışmada otomatikleşme medyan **66 gün** sürdü; 18 ile 254 gün arasında değişti (Lally ve ark., 2010). [*küçük çalışma*, sık atıf alıyor]
    - İrade gücünün tükenen bir kas olduğu fikri olan **"ego tükenmesi"**, büyük ön kayıtlı tekrar çalışmalarında **tutmadı** (Hagger ve ark., 2016: etki sıfıra yakın; Vohs ve ark., 2021: çok küçük). Kanıtlar, iradeyi tükenen bir yakıt deposu gibi düşünmeyi desteklemez. [Established, özgün etkinin abartıldığı]
    - Öz denetim, anlık sürekli çabadan çok durumları ve alışkanlıkları biçimlendirerek daha iyi işler. [*orta*]
  en: |-
    - In the Dunedin study (~1,000 children followed from birth), childhood self-control predicted adult health, wealth and lower criminal convictions, even after controlling for intelligence and social class (Moffitt et al., *PNAS* 2011). [Established, *moderate*]
    - New habits take time: in one study, automaticity took a median of **66 days**, ranging from 18 to 254 days (Lally et al., 2010). [*small study*, widely cited]
    - **"Ego depletion"** — the idea that willpower is a muscle that runs out — **failed** large preregistered replications (Hagger et al., 2016: effect near zero; Vohs et al., 2021: very small). The evidence does not support picturing willpower as a fuel tank that runs out. [Established that the original effect was overstated]
    - Self-control works better by shaping situations and habits than by constant effort in the moment. [*moderate*]
stories:
  tr: |
    - Hz. Peygamber'in "az ama devamlı" (Buhârî 6464) ilkesine uyan, devamlı küçük uygulamaları (gece namazı, pazartesi ve perşembe orucu).
    - Yûsuf'un ayartmaya direnmesi ve zindanı tercih etmesi (12:33).
    - Ömer'in tavsiye ettiği, tasavvuf geleneğindeki günlük nefis muhasebesi (*muhasebe*): "Hesaba çekilmeden önce kendinizi hesaba çekin."
  en: |-
    - The Prophet's consistent small practices (night prayer, fasting Mondays and Thursdays), which match "small but consistent" (Bukhārī 6464).
    - Yūsuf (Joseph) resisting temptation and preferring prison (12:33).
    - The Sufi tradition of daily self-accounting (*muḥāsaba*), recommended by ʿUmar: "Take account of yourselves before you are taken to account."
gaps:
  tr: |
    - Dinî topluluklar öz disiplini bazen utanç ve korkuyla öğretir; bu da karaktere değil, dinî titizliğe (vesvese) yol açabilir. Bkz. Q8 (vesvese).
    - Disiplinin kolay ya da hızlı olacağı vaat edilemez; araştırmalar da gelenek de uzun ve inişli çıkışlı bir yol anlatır.
    - Ego tükenmesi efsanesi, popüler İslami kişisel gelişim kitaplarında hâlâ görülür.
  en: No one can promise that discipline will feel easy or quick; the research and the tradition both describe a long, uneven path. The ego-depletion myth still appears in popular self-help material, including Islamic.
visualizations:
  - id: ideas
    tr: |
      - "Üç nefis": *emmâre*den *levvâme*ye, oradan *mutmainne*ye giden bir yol; düz bir merdiven değil, dönemeçleri ve geri düşüşleri olan bir yol olarak çizilmiş.
      - Buhârî 6464 ruhunda bir alışkanlık takipçisi: küçük, günlük bir uygulama ve bir günü kaçırmanın her şeyi sıfırlamadığına dair dürüst bir not.
    en: |-
      - "The three selves": a path from *ammāra* to *lawwāma* to *muṭmaʾinna*, drawn as a road with turns and setbacks, not a straight staircase.
      - A habit tracker in the spirit of Bukhārī 6464: one small daily practice, with an honest note that missing a day does not reset everything.
