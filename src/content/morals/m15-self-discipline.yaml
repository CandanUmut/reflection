fullAnswer:
  - kind: quran
    en: |-
      **Purify the self.** "He has succeeded who purifies it, and he has failed who instills it [with corruption]" (91:9–10).

      **Hold back, and strive.** "As for he who feared the position of his Lord and prevented the soul from [unlawful] inclination" (79:40); "those who strive for Us — We will surely guide them to Our ways" (29:69).

      **Change starts inside.** "Allah will not change the condition of a people until they change what is in themselves" (13:11).
  - kind: sunnah
    en: |-
      **The real struggle.** "The Mujahid is one who strives against his own soul" {hadith:tirmidhi:1621}.

      **Small and steady.** "The most beloved deed to Allah is the most regular and constant even if it were little" {hadith:bukhari:6464}.
  - kind: scholars
    en: "**Training, not crushing.** Al-Ghazali (*Ihya'*) compares training the soul to training a horse: neither crushing nor indulging, with gradual habits. Miskawayh and al-Tusi describe virtue as a balanced middle formed by repeated action until it becomes second nature. The stages of the soul — commanding evil (12:53), blaming (75:2), at peace (89:27) — give a map of growth."
  - kind: research
    en: '**Self-control matters, and it grows slowly.** In the Dunedin study of about 1,000 children, childhood self-control predicted adult health, wealth and fewer convictions, even after controlling for intelligence and social class (Moffitt et al., 2011). [Established] New habits took a median of 66 days to become automatic, ranging from 18 to 254 (Lally et al., 2010). [Small study] The popular idea that willpower is a fuel tank that runs out ("ego depletion") failed large replications (Hagger et al., 2016; Vohs et al., 2021). [Established that the original effect was overstated]'
  - kind: practice
    en: "**One small habit.** Choose one small, regular practice {hadith:bukhari:6464}; attach it to an existing routine; expect weeks, not days; when you slip, return without despair (29:69)."
  - kind: heart
    en: '**Return is part of the path.** The verse promises guidance to "those who strive" (29:69), not to those who never fall. Habits take time; a broken streak is not a broken soul.'
followUps:
  - q:
      en: Is willpower limited?
    a:
      en: The evidence does not support picturing willpower as a fuel tank that runs out (see above).
  - q:
      en: What are the stages of the soul?
    a:
      en: Commanding evil (12:53), blaming (75:2) and at peace (89:27).
