fullAnswer:
  - kind: quran
    en: |-
      **Walk gently.** "The servants of the Most Merciful are those who walk upon the earth easily, and when the ignorant address them [harshly], they say [words of] peace" (25:63).

      **Luqman's advice.** "Do not turn your cheek [in contempt] toward people and do not walk through the earth exultantly. Indeed, Allah does not like everyone self-deluded and boastful. And be moderate in your pace and lower your voice" (31:18–19).

      **Know your size.** "Do not walk upon the earth exultantly. Indeed, you will never tear the earth [apart], and you will never reach the mountains in height" (17:37).
  - kind: sunnah
    en: |-
      **What arrogance is.** "He who has in his heart the weight of a mustard seed of pride shall not enter Paradise." A man asked about loving fine clothes and shoes. The Prophet (pbuh) said: "Allah is Graceful and He loves Grace. Pride is disdaining the truth (out of self-conceit) and contempt for the people" {hadith:muslim:91}.

      **At home.** Asked what he did at home, Aisha (ra) said: "He used to keep himself busy serving his family" {hadith:bukhari:676}.
  - kind: scholars
    en: "**The most dangerous pride.** Al-Ghazali, in the *Ihya'*, lists the roots of arrogance — knowledge, worship, lineage, beauty, wealth, strength, followers — and warns that pride in knowledge and piety is the most dangerous, because it hides inside good things. The definition in {hadith:muslim:91} ties humility directly to intellectual honesty: accepting the truth even from someone you dislike."
  - kind: research
    en: "**Intellectual humility.** Recognising that your beliefs might be wrong is linked to more openness to opposing views, less polarisation and better learning (review: Porter et al., 2022). [Moderate, mostly correlational]"
  - kind: practice
    en: '**Small tests.** Can you say "I was wrong"? Do you help at home {hadith:bukhari:676}? Do you speak to a cleaner the way you speak to a manager? In a disagreement, look for the truth in the other side first.'
  - kind: heart
    en: '**Humility is not self-hatred.** The same hadith affirms that "Allah is Graceful and He loves Grace" {hadith:muslim:91}. You may care for yourself and your appearance; what is forbidden is contempt for others and for the truth.'
followUps:
  - q:
      en: Is wanting nice clothes arrogant?
    a:
      en: "No: the Prophet (pbuh) answered exactly this {hadith:muslim:91}."
  - q:
      en: Is claiming my religion is true arrogant?
    a:
      en: "That is its own question (see \"Is claiming one religion is true arrogant?\"). This page's definition helps: arrogance is rejecting truth and despising people, not holding a belief."
