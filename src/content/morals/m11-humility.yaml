title:
  tr: Tevazu ve kibirden sakınmak
  en: Humility and avoiding arrogance
verses:
  - 31:18-19
  - 25:63
  - 17:37
  - 49:13
  - 28:83
summary:
  tr: Kibir güzel giyinmek değildir; hakkı reddetmek ve insanları küçük görmektir (Müslim 91).
  en: 'The Prophet (pbuh) defined arrogance precisely: "Pride is disdaining the truth (out of self-conceit) and contempt for the people" (Muslim 91). Humility is therefore not looking shabby or thinking badly of yourself; it is being open to the truth and never looking down on others — "And do not walk upon the earth exultantly" (17:37).'
teachings:
  tr: |
    - "İnsanlardan kibirle yüz çevirme, yeryüzünde böbürlenerek yürüme… Yürüyüşünde ölçülü ol, sesini alçalt" (31:18–19, Lokmân'ın oğluna öğüdü).
    - "Rahmân'ın kulları, yeryüzünde vakarla yürüyen kimselerdir; cahiller onlara laf attığında 'Selam' derler" (25:63).
    - "Yeryüzünde böbürlenerek yürüme; sen ne yeri yarabilirsin ne de boyca dağlara erişebilirsin" (17:37).
    - "Allah katında en değerliniz, O'na karşı en saygılı olanınızdır" (49:13).
    - Hadis: "Kalbinde zerre kadar kibir bulunan cennete girmez." Bir adam güzel elbise istemeyi sordu. Hz. Peygamber: "Allah güzeldir, güzeli sever. Kibir, **hakkı reddetmek ve insanları küçük görmektir**" (Müslim 91).
  en: |-
    - "Do not turn your cheek away from people in arrogance, nor walk on earth exultantly… Be moderate in your walk and lower your voice" (31:18–19, Luqmān's advice to his son).
    - "The servants of the Most Merciful are those who walk on the earth gently, and when the ignorant address them, they say: Peace" (25:63).
    - "Do not walk on earth with pride; you cannot split the earth or reach the mountains in height" (17:37).
    - "The most honored of you with God is the most mindful of Him" (49:13).
    - Hadith: "No one with an atom's weight of arrogance in his heart will enter Paradise." A man asked about wanting fine clothes. The Prophet said: "God is beautiful and loves beauty. Arrogance is **rejecting the truth and looking down on people**" (Muslim 91).
scholarship:
  tr: |
    - Müslim 91'deki tanım önemlidir: kibir (*kibr*) görünüşe özen göstermek değil, hakikati reddetmek ve başkalarını hor görmektir. Bu, tevazuyu doğrudan **düşünsel dürüstlüğe** bağlar.
    - İblis'in reddi — "Ben ondan hayırlıyım" (7:12) — ilk kibir eylemi olarak okunur.
    - Gazzâlî (*İhyâ*, "Zemmü'l-Kibr") kibrin kaynaklarını sayar: ilim, ibadet, soy, güzellik, servet, güç, taraftar — ve ilim ve takva yoluyla gelen kibrin en tehlikelisi olduğunu belirtir.
    - Tasavvuf ahlâkı tevazuyu (*tevâzu*) bütün öteki erdemlerin zemini sayar.
  en: |-
    - The definition in Muslim 91 is important: arrogance (*kibr*) is not caring about appearance; it is refusing truth and despising others. This links humility directly to **intellectual honesty**.
    - Iblīs's refusal — "I am better than him" (7:12) — is read as the first act of arrogance.
    - Al-Ghazālī (*Iḥyāʾ*, "Dhamm al-Kibr") lists sources of arrogance: knowledge, worship, lineage, beauty, wealth, strength, followers — noting that arrogance through knowledge and piety is the most dangerous.
    - Sufi ethics treat humility (*tawāḍuʿ*) as the ground of every other virtue.
evidence:
  tr: |
    - **Düşünsel tevazu** — kişinin inançlarının yanlış olabileceğini kabul etmesi — karşıt görüşlere daha açık olmak, daha az kutuplaşma ve daha iyi öğrenmeyle ilişkilidir (derleme: Porter ve ark., 2022). [*orta*, çoğunlukla ilişkisel]
    - Narsisizm, daha kötü ilişkiler ve eleştiri sonrası saldırganlıkla ilişkilidir. [Established]
    - Örgüt çalışmalarında alçakgönüllü olarak değerlendirilen liderler, daha bağlı ekiplerle ilişkilidir. [*küçük–orta*, karışık]
  en: |-
    - **Intellectual humility** — recognizing that one's beliefs might be wrong — is linked to more openness to opposing views, less polarization, and better learning (review: Porter et al., 2022). [*moderate*, mostly correlational]
    - Narcissism is associated with worse relationships and aggression after criticism. [Established]
    - Leaders rated as humble are associated with more engaged teams in organizational studies. [*small–moderate*, mixed]
stories:
  tr: |
    - Hz. Peygamber kendi sandaletini ve elbisesini kendisi onarır, ev işlerine yardım ederdi (Buhârî 676).
    - Mekke'ye zaferle girerken başını bineğinin üzerinde, neredeyse eyere değecek kadar eğdi.
    - Halife olan Ömer, yabancı bir elçi tarafından bir ağacın altında korumasız uyurken bulundu.
  en: |-
    - The Prophet mended his own sandals and clothes and helped with housework (Bukhārī 676).
    - On entering Mecca in victory, he bowed his head so low on his mount that it nearly touched the saddle.
    - ʿUmar, as ruler, was found sleeping under a tree without guards by a foreign envoy.
gaps:
  tr: |
    - Dinî kibir — "yalnızca benim grubum haklı", daha az dindar olanları küçük görmek — ölçülmüş verilere göre şüpheyi en çok tetikleyen etkenlerden biridir (Yaqeen: "tek bir doğru yol"). Burada dürüstçe adlandırılır.
    - Tevazu düşük öz değer değildir; Müslim 91'de Hz. Peygamber güzelliği sevmeyi onaylar. Tevazu, kendinden nefret etmek değildir.
  en: Al-Ghazali's Book 29 was read only through a review; his full list of the sources of pride is not given. The research on intellectual humility is mostly correlational; the humble-leadership results were not read beyond the abstract. Religious arrogance is one of the reasons people give for leaving faith; this page names the teaching, not a claim that communities live it.
visualizations:
  - id: ideas
    tr: |
      - "Vakarla yürü" (25:63): yeryüzüne zarar vermeyen ayak izleri, yanında onu çatlatan ağır izler (17:37).
      - Müslim 91 için iki parçalı bir kart: kibrin *ne olmadığı* (güzel elbise) / *ne olduğu* (hakkı reddetmek, insanları küçük görmek).
    en: |-
      - "Walk gently" (25:63): footprints that leave the earth unharmed, next to heavy prints that crack it (17:37).
      - A two-part card for Muslim 91: what arrogance is *not* (fine clothes) / what it *is* (rejecting truth, despising people).
