fullAnswer:
  - kind: quran
    en: |-
      **A sign, with affection and mercy.** "And of His signs is that He created for you from yourselves mates that you may find tranquillity in them; and He placed between you affection and mercy" (30:21). Commentators distinguish affection (*mawadda*), strong early, from mercy (*rahma*), which carries a marriage through age, illness and hardship.

      **Clothing for each other.** "They are clothing for you and you are clothing for them" (2:187): covering, warmth, protection — both ways.

      **Kindness even in dislike.** "Live with them in kindness. For if you dislike them — perhaps you dislike a thing and Allah makes therein much good" (4:19).

      **Ending well.** "Either keep [her] in an acceptable manner or release [her] with good treatment" (2:229).
  - kind: sunnah
    en: |-
      **The measure of a person.** "The best of you is the best to his wives, and I am the best of you to my wives" {hadith:tirmidhi:3895}.

      **At home and at play.** He "used to keep himself busy serving his family" {hadith:bukhari:676}. Aisha (ra) raced him on a journey and won; years later he won, and said "This is for that" {hadith:abudawud:2578}.

      **He never struck a woman.** Aisha (ra) reported that he "never beat anyone with his hand, neither a woman nor a servant" {hadith:muslim:2328}.
  - kind: scholars
    en: "**Gentle character and patience.** Al-Ghazali, in his book on marriage in the *Ihya'*, stresses gentle character, patience with a spouse's faults, and play. In the *maqasid* view, marriage protects family and dignity, and is a contract with rights on both sides."
  - kind: research
    en: "**Kindness predicts lasting love.** John Gottman's research found that stable couples have roughly five positive interactions for every negative one during conflict, and that contempt is a strong warning sign; his divorce-prediction claims have been criticised as overfitted (Heyman and Slep, 2001). [Moderate] Marital quality is linked to health in a meta-analysis of 126 studies (Robles et al., 2014). [Established, small]"
  - kind: practice
    en: "**Daily mercy.** Help at home {hadith:bukhari:676}; play together {hadith:abudawud:2578}; thank each other; in conflict, avoid contempt; if it ends, end it with good treatment (2:229)."
  - kind: heart
    en: '**Violence contradicts these verses.** Abuse goes against "affection and mercy" (30:21) and "live with them in kindness" (4:19), and the Prophet (pbuh) never struck a woman {hadith:muslim:2328}. Your safety comes first; the support on this page can help. Verse 4:34, which many ask about, is discussed honestly in the question "Does Islam treat women unequally?".'
followUps:
  - q:
      en: What about 4:34?
    a:
      en: It is discussed on the page "Does Islam treat women unequally?", with the classical and modern readings.
  - q:
      en: Is divorce allowed?
    a:
      en: Yes, with rules and good treatment (2:229); reconciliation is preferred where possible.
  - q:
      en: What does "clothing for each other" mean?
    a:
      en: Mutual covering, warmth and protection (2:187).
