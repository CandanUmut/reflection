summary:
  tr: Evliliğin kendisi bir âyettir. *Meveddet* (sevgi) çoğu zaman gençlik ve çekimle anılır; *rahmet* ise bir evliliği yaşlılık, hastalık ve zorluk boyunca taşır.
  en: 'Marriage is called a sign of God: "He placed between you affection and mercy" (30:21). Spouses are "clothing" for each other (2:187), and if a marriage ends it must end "with good treatment" (2:229).'
helpCard: urgent
teachings:
  tr: |
    - "Kendileriyle huzur bulasınız (*sükûn*) diye size kendi cinsinizden eşler yaratması ve aranıza sevgi (*meveddet*) ve merhamet (*rahmet*) koyması O'nun âyetlerindendir" (30:21). Evliliğin kendisi bir âyet olarak anılır.
    - "Onlarla iyilikle geçinin; onlardan hoşlanmıyorsanız, belki hoşlanmadığınız bir şeyde Allah çok hayır kılmıştır" (4:19).
    - "Onlar sizin için bir elbise, siz de onlar için bir elbisesiniz" (2:187).
    - Boşanma ya "iyilikle tutmak ya da iyilikle bırakmak" olmalıdır (2:229).
    - Barışmak daha hayırlıdır (4:128).
    - Hadis: "Sizin en hayırlınız, eşlerine en hayırlı olanınızdır; ben de eşlerime en hayırlı olanınızım" (Tirmizî 3895). Hz. Peygamber ev işlerine yardım eder ve "ailesinin hizmetinde" olurdu (Buhârî 676). Âişe ile yarıştı (Ebû Dâvûd 2578).
  en: |-
    - "Among His signs is that He created for you spouses from among yourselves so that you may find tranquility (*sakan*) in them, and He placed between you love (*mawadda*) and mercy (*raḥma*)" (30:21). Marriage itself is called a sign.
    - "Live with them in kindness; if you dislike them, perhaps you dislike something in which God has placed much good" (4:19).
    - "They are a garment for you and you are a garment for them" (2:187).
    - Divorce must be either "retaining in kindness or releasing in kindness" (2:229).
    - Reconciliation is better (4:128).
    - Hadith: "The best of you are those best to their wives, and I am the best of you to my wives" (Tirmidhī 3895). The Prophet helped with housework and "was in the service of his family" (Bukhārī 676). He raced with ʿĀʾisha (Abū Dāwūd 2578).
scholarship:
  tr: |
    - Müfessirler *meveddet*i (sevgi, çoğu zaman gençlik ve çekimle ilişkilendirilir) *rahmet*ten (yaşlılık, hastalık ve zorluk boyunca evliliği taşıyan merhamet) ayırır.
    - "Elbise" (2:187), örtmek, korumak, sıcaklık ve yakınlık olarak okunur — karşılıklı, tek taraflı değil.
    - Makâsıd çerçevesinde evlilik *nesli/aileyi* ve *onuru* korur; iki tarafa da haklar tanıyan bir sözleşmedir.
    - Gazzâlî'nin *Âdâbü'n-Nikâh*ı (*İhyâ*) evliliğin faydalarını ve tehlikelerini sayar; yumuşak huyu, eşin kusurlarına sabrı ve oyunu vurgular.
  en: |-
    - Commentators distinguish *mawadda* (love, often linked to youth and attraction) from *raḥma* (mercy, which carries a marriage through age, illness and hardship).
    - "Garment" (2:187) is read as covering, protection, warmth and closeness — mutual, not one-sided.
    - In the maqāṣid frame, marriage protects *lineage/family* and *dignity*; it is a contract with rights on both sides.
    - Al-Ghazālī's *Ādāb al-Nikāḥ* (*Iḥyāʾ*) lists benefits and dangers of marriage and stresses gentle character, patience with a spouse's faults, and play.
evidence:
  tr: |
    - John Gottman'ın araştırması, istikrarlı çiftlerin çatışma sırasında her olumsuz etkileşime karşılık kabaca **beş olumlu etkileşimi** olduğunu buldu ve küçümsemeyi güçlü bir uyarı işareti olarak tanımladı. [*orta*; boşanma tahmini iddiaları aşırı uyum gerekçesiyle eleştirildi]
    - Evlilik kalitesi sağlıkla ilişkilidir; 126 çalışmanın meta-analizi (Robles ve ark., 2014) **küçük** ama gerçek ilişkiler buldu. [Established, *küçük*]
    - Eşe karşı nezaket, şükran ve cömertlik evlilik memnuniyetini yordar. [*orta*]
  en: |-
    - John Gottman's research found that stable couples have roughly **five positive interactions for every negative one** during conflict, and identified contempt as a strong warning sign. [*moderate*; his divorce-prediction claims have been criticized for overfitting]
    - Marital quality is linked to health; a meta-analysis of 126 studies (Robles et al., 2014) found **small** but real associations. [Established, *small*]
    - Kindness, gratitude and generosity toward one's partner predict marital satisfaction. [*moderate*]
stories:
  tr: |
    - Hatice: Hz. Peygamber'in ilk eşi; ondan büyük, başarılı bir tüccar, ilk iman eden; Hz. Peygamber onu ömrünün sonuna kadar sevgiyle andı.
    - Pek çok hadiste kaydedilen, ev içi anlaşmazlıklarda yumuşak tavrı; hiçbir kadına vurmadı (Müslim 2328).
  en: |-
    - Khadīja: the Prophet's first wife, older than him, a successful merchant, the first to believe; he remembered her with love for the rest of his life.
    - His gentle handling of household disagreements, recorded in many hadith, without striking any woman (Muslim 2328).
gaps:
  tr: |
    - Türkiye'de 2025'te **552.237** çift evlendi ve **193.793** çift boşandı (kaba boşanma hızı binde **2,26**); boşanmaların **%34**'ü evliliğin ilk beş yılında gerçekleşti (TÜİK, Şubat 2026'da açıklandı).
    - Aile içi şiddet Türkiye'de ve pek çok Müslüman çoğunluklu toplumda ciddi bir sorundur. Şiddet 30:21 ve 4:19 ile açıkça çelişir.
    - 4:34 âyeti Q6'da (kadınlar ve eşitlik) ele alınıyor.
  en: Domestic violence is a serious problem in many societies, Muslim-majority ones included. Divorce rates are rising in many countries. Gottman's numbers are widely cited but his predictions have been criticised.
visualizations:
  - id: ideas
    tr: |
      - Bir ömür boyu "sevgi ve rahmet": bir zaman çizelgesi üzerinde iki çizgi — *meveddet* başta güçlü, *rahmet* yıllar içinde büyüyor — tek bir çizgide birleşiyor.
      - "Elbise" (2:187): her biri ötekini örten, tek bir kumaşta dokunmuş iki parça.
    en: |-
      - "Love and mercy" over a lifetime: two lines across a timeline — *mawadda* strong early, *raḥma* growing over the years — crossing into one.
      - "Garment" (2:187): two pieces of cloth woven into one, each covering the other.
