fullAnswer:
  - kind: quran
    en: |-
      **Gratitude grows.** "If you are grateful, I will surely increase you [in favor]; but if you deny, indeed, My punishment is severe" (14:7).

      **Patience has company.** "Seek help through patience and prayer. Indeed, Allah is with the patient" (2:153). "Indeed, the patient will be given their reward without account" (39:10).
  - kind: sunnah
    en: |-
      **Two halves of one life.** "Strange are the ways of a believer for there is good in every affair of his": in delight he thanks God, in trouble he endures patiently, and there is good for him in both {hadith:muslim:2999}.

      **Gratitude in action.** The Prophet (pbuh) prayed at night until his feet cracked. Asked why, since he was forgiven, he said: "Shouldn't I love to be a thankful slave?" {hadith:bukhari:4837}.

      **Thank people too.** "He who does not thank the people is not thankful to Allah" {hadith:abudawud:4811}.

      **Look in the right direction.** When you look at someone above you in wealth or body, also look at someone below you {hadith:muslim:2963}.

      **Patience at the first blow.** "The real patience is at the first stroke of a calamity" {hadith:bukhari:1302}.
  - kind: scholars
    en: "**Faith in two halves.** Al-Ghazali described faith as half patience and half gratitude."
  - kind: practice
    en: "**A short daily habit.** Name three specific gifts each day; thank one person by name {hadith:abudawud:4811}. When a loss comes, give yourself the first moment to turn to God (2:156; {hadith:bukhari:1302}), and then seek help — patience is not doing nothing."
  - kind: research
    en: "**Gratitude exercises help a little.** Cregg and Cheavens (2021) found small effects of gratitude interventions on depression (g = −0.29 after the intervention, −0.23 later), smaller against active controls. A 2023 meta-analysis (23 studies, 6,745 people) found g = 0.22 against neutral controls and 0.12, not significant, against active ones. [Established, small] Gratitude is good practice, not a cure."
  - kind: heart
    en: '**Patience is not silence about harm.** The Quran praises patience, and it also commands justice and forbids oppression (16:90). "Be patient" must never be used to keep someone in abuse. Patience with what cannot be changed, and action against what can.'
followUps:
  - q:
      en: Is it wrong to feel sad if I am patient?
    a:
      en: No. The Prophet (pbuh) wept at his son's death (see the question on suffering); patience is about what you hold on to, not about not feeling.
  - q:
      en: Does gratitude mean pretending everything is fine?
    a:
      en: "No: the hadith asks for gratitude in delight and patience in trouble {hadith:muslim:2999} — two different responses to two different things."
  - q:
      en: Do gratitude exercises work?
    a:
      en: A little, on average (see "What research shows").
