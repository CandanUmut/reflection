gaps:
  tr: Aileler çoğu zaman bu idealin gerisinde kalır ve bazı anne babalar bu öğretinin onlara verdiği dinî otoriteyi kötüye kullanır. Diğer mezheplerin itaat konusundaki görüşlerine ve aile bütünlüğü üzerine araştırmalara henüz başvurulmadı.
  en: Families often fall short of this ideal, and some parents abuse the religious authority this teaching gives them. The other schools' views on obedience, and research on family cohesion, have not yet been consulted.
