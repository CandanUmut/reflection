summary:
  tr: Yaşlılıkta özen ve saygı — ama günahta itaat yoktur.
  en: Kindness to parents comes right after worshipping God in the Quran (17:23). It is owed even to parents of another faith, but obedience stops where they command wrong (31:15). And the best person is "the best to his wives" {hadith:tirmidhi:3895}.
