summary:
  tr: "Kur'an'da anne babaya iyilik, Allah'a ibadetin hemen ardından gelir: \"Rabbin kesin olarak şunları emretti: Ancak kendisine ibadet edin, anne ve babaya iyilik edin.\" (17:23). Bu iyilik başka bir dinden olan anne babaya da borçludur, ama itaat, onlar yanlışı emrettiğinde sona erer (31:15) — ve aile görevleri her yöne işler: anne babadan çocuklara ve eşler arasında."
  en: 'In the Quran, kindness to parents comes straight after the worship of God: "your Lord has decreed that you not worship except Him, and to parents, good treatment" (17:23). It is owed even to parents of another faith, but obedience stops where they command wrong (31:15) — and family duties run in every direction, from parents to children and between spouses.'
