fullAnswer:
  - kind: quran
    en: |-
      **Return trusts, judge justly.** "Indeed, Allah commands you to render trusts to whom they are due and when you judge between people to judge with justice" (4:58).

      **Do not betray.** "Do not betray Allah and the Messenger or betray your trusts while you know [the consequence]" (8:27). Believers are those "who are to their trusts and their promises attentive" (23:8), and "fulfill [every] commitment. Indeed, the commitment is ever [that about which one will be] questioned" (17:34).

      **The trust humans carried.** God offered the trust to the heavens, the earth and the mountains, and they declined; the human being took it on (33:72). Commentators read it broadly: property, secrets, office, one's own body and abilities.
  - kind: sunnah
    en: |-
      **Three signs of a hypocrite.** "Whenever he speaks, he tells a lie. Whenever he promises, he always breaks it. If you trust him, he proves to be dishonest" {hadith:bukhari:33}.

      **When trust is lost.** "When honesty is lost, then wait for the Hour." Asked how it is lost, he said: "When authority is given to those who do not deserve it" {hadith:bukhari:6496}.

      **Truth builds character** {hadith:bukhari:6094}; cheating breaks community {hadith:tirmidhi:1315}.
  - kind: scholars
    en: "**Narrow exceptions only.** Al-Ghazali lists lying among the calamities of the tongue and allows only narrow exceptions — reconciling people, in war, and between spouses — which scholars themselves debate. [Debated]"
  - kind: research
    en: "**Trust is wealth.** Countries and regions with higher general trust tend to have better economic growth and institutions (Knack and Keefer, 1997, and later work). [Established, correlational] Corruption harms growth, public services and trust. [Established]"
  - kind: practice
    en: "**Keep small promises.** Arrive when you said you would; return what you borrowed; keep secrets; give positions to the qualified, not to friends {hadith:bukhari:6496}. At work, an honest report is part of *amana*."
  - kind: heart
    en: "**Betrayal is serious.** The Quran and the Prophet (pbuh) treat it as a mark of hypocrisy {hadith:bukhari:33}. It is right to protect yourself and seek fair redress (see the page on forgiveness)."
followUps:
  - q:
      en: Is any lie ever allowed?
    a:
      en: Scholars mention narrow exceptions, debated among them; the rule is truthfulness {hadith:bukhari:6094}.
  - q:
      en: Is a promise to a non-Muslim binding?
    a:
      en: The verses on promises and trusts are general (4:58; 17:34).
  - q:
      en: What counts as *amana* at work?
    a:
      en: Honest reports, fair hiring, protecting what you are entrusted with (4:58; {hadith:bukhari:6496}).
