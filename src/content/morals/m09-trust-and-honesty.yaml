theme: honesty
title:
  tr: "Emanet: güven, doğruluk, sözü tutmak"
  en: "Amāna: trust, honesty, keeping promises"
verses:
  - 4:58
  - 23:8
  - 17:34
  - 8:27
  - 33:72
summary:
  tr: Peygamberliğinden önce Hz. Muhammed *el-Emîn*, "güvenilir" diye bilinirdi. Bugünkü kamu hayatıyla arasındaki mesafe, gençlerin şüphe sebeplerinden biri.
  en: Before prophethood, Muhammad was known as *al-Amīn*, "the trustworthy". The gap with today's public life is one of the reasons young people give for doubt.
teachings:
  tr: |
    - "Allah size emanetleri ehline vermenizi ve hükmettiğinizde adaletle hükmetmenizi emreder" (4:58).
    - Müminler "emanetlerine ve sözlerine riayet edenlerdir" (23:8).
    - "Verdiğiniz sözü yerine getirin; söz verdiğiniz şeyden sorumlu tutulacaksınız" (17:34).
    - "Allah'a ve Peygamber'e ihanet etmeyin, bile bile emanetlerinize de ihanet etmeyin" (8:27).
    - Göklere, yere ve dağlara sunulan, onların kabul etmediği ve insanın yüklendiği emanet (33:72).
    - Hadis: "Münafığın alameti üçtür: konuşunca yalan söyler, söz verince sözünden döner, kendisine güvenilince ihanet eder" (Buhârî 33; Müslim 59). Peygamberliğinden önce Muhammed *el-Emîn*, "güvenilir" diye bilinirdi.
  en: |-
    - "God commands you to return trusts to their owners, and to judge with justice" (4:58).
    - Believers are "those who keep their trusts and their promises" (23:8).
    - "Fulfil the promise; the promise will be asked about" (17:34).
    - "Do not betray God and the Messenger, nor knowingly betray your trusts" (8:27).
    - The trust offered to heavens, earth and mountains, which they declined and the human took on (33:72).
    - Hadith: "The signs of a hypocrite are three: when he speaks he lies, when he promises he breaks it, when he is trusted he betrays" (Bukhārī 33; Muslim 59). Before prophethood, Muhammad was known as *al-Amīn*, "the trustworthy".
scholarship:
  tr: |
    - Müfessirler *emanet*i geniş okur: size bırakılan mal, sırlar, kamu görevi, kişinin kendi bedeni ve yetenekleri ve insan olmanın bütün ahlâkî sorumluluğu (33:72).
    - Gazzâlî yalanı "dil âfetleri" arasında sayar ve yalnızca dar istisnalara izin verir (insanları barıştırmak, savaş, eşler arası — ki bunlar da tartışmalıdır).
    - Makâsıd çerçevesinde doğruluk her amacı korur: güven olmadan hiçbir sözleşme, mahkeme ya da topluluk işlemez.
  en: |-
    - Commentators read *amāna* broadly: property left with you, secrets, public office, one's own body and abilities, and the whole moral responsibility of being human (33:72).
    - Al-Ghazālī lists lying among the "calamities of the tongue" and allows only narrow exceptions (reconciling people, war, between spouses — and these are themselves debated).
    - In the maqāṣid frame, honesty protects every objective: no contract, court or community works without trust.
evidence:
  tr: |
    - Genel güven düzeyi yüksek ülkeler ve bölgeler, daha iyi ekonomik büyüme ve kurumlara sahip olma eğilimindedir (Knack ve Keefer, 1997 ve sonraki çalışmalar). [Established, *ilişkisel*]
    - Yolsuzluk büyümeye, kamu hizmetlerine ve kurumlara güvene zarar verir. [Established]
  en: |
    - Countries and regions with higher generalized trust tend to have better economic growth and institutions (Knack & Keefer, 1997, and later work). [Established, *correlational*]
    - Corruption harms growth, public services and trust in institutions. [Established]
stories:
  tr: |
    - Hz. Peygamber Medine'ye hicret ederken, Mekkelilerin — muhalifleri de dâhil — kendisine emanet bıraktığı değerli eşyaları iade etmesi için Ali'yi geride bıraktı.
    - Kureyş, peygamberliğinden önce, Kâbe'nin yeniden inşasında Hacerülesved'i yerine koyması için ona güvendi.
    - Ömer'in valileri denetlenirdi; görev öncesi ve sonrası servetlerini karşılaştırırdı.
  en: |-
    - When the Prophet migrated to Medina, he left ʿAlī behind to return the valuables that Meccans — including his opponents — had left in his care.
    - The Quraysh trusted him to place the Black Stone during the Kaʿba rebuilding, before prophethood.
    - ʿUmar's governors were audited; he compared their wealth before and after office.
gaps:
  tr: |
    - Pek çok Müslüman çoğunluklu ülke, Uluslararası Şeffaflık Örgütü'nün Yolsuzluk Algı Endeksi'nde alt yarıda yer alıyor. Türkiye 2025 endeksinde **100 üzerinden 31** puan aldı (182 ülke ve bölge).
    - *El-Emîn* ile bugünkü kamu hayatı arasındaki mesafe, Yaqeen'in ABD'deki 630 Müslümanla yaptığı ankete (Chouhoud, 2018) göre gençlerin şüphe için gösterdiği başlıca sebeplerden biridir.
  en: |
    - Many Muslim-majority countries score in the lower half of Transparency International's Corruption Perceptions Index. Türkiye scored **31 out of 100** in the 2025 index (182 countries and territories).
    - The gap between *al-Amīn* and today's public life is one of the main reasons young people give for doubt, according to Yaqeen's survey of 630 US Muslims on what triggers doubt (Chouhoud, 2018).
visualizations:
  - id: ideas
    tr: |
      - "Emanetin ağırlığı": 33:72'nin sahnesi — gökler, yer ve dağlar kabul etmiyor, tek bir insan figürü öne çıkıyor — ince çizgiyle.
      - Bir "söz defteri" kartı: münafığın üç alameti (yalan, tutulmayan söz, ihanet edilen emanet) üç olumlu günlük alışkanlığa dönüşür.
    en: |-
      - "Weight of the trust": the scene of 33:72 — heavens, earth and mountains declining, a single human figure stepping forward — drawn in fine line.
      - A "promise ledger" card: three signs of hypocrisy (lie, broken promise, betrayed trust) turned into three positive daily practices.
