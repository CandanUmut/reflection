theme: knowledge
title:
  tr: İlim ve ilim talebi
  en: Knowledge and seeking it
verses:
  - 96:1-5
  - 20:114
  - 39:9
  - 58:11
  - 35:28
summary:
  tr: "İnen ilk kelime \"Oku\"ydu (96:1) ve Hz. Peygamber'e (s.a.v.) şöyle söylendi: \"\"Rabbim! benim ilmimi artır\" de.\" (20:114). Kur'an sorar: \"Hiç bilenlerle bilmeyenler bir olur mu?\" (39:9)."
  en: "The first word revealed was \"Recite\" (96:1), and the Prophet (pbuh) was told: \"say, 'My Lord, increase me in knowledge'\" (20:114). The Quran asks: \"Are those who know equal to those who do not know?\" (39:9)."
teachings:
  tr: |
    - İlk vahiy: "Yaratan Rabbinin adıyla oku… O ki kalemle öğretti, insana bilmediğini öğretti" (96:1–5).
    - "De ki: Rabbim, ilmimi artır" (20:114) — Hz. Peygamber'e daha *fazlasını* istemesi söylenen tek şey.
    - "Hiç bilenlerle bilmeyenler bir olur mu?" (39:9).
    - "Allah sizden iman edenlerin ve kendilerine ilim verilenlerin derecelerini yükseltir" (58:11).
    - "Kulları içinden Allah'tan ancak âlimler gerçekten saygıyla korkar" (35:28) — bağlamın doğa ve renkler olduğuna dikkat (S33).
    - Hadis: "Kim ilim talebi için bir yola girerse, Allah ona cennete giden bir yolu kolaylaştırır" (Müslim 2699). "İlim talep etmek her Müslümana farzdır" sözü yaygın olarak aktarılır, ama {hadith:ibnmajah:224} rivayetinin senedi zayıf sayılır; bu yüzden burada delil olarak kullanılmaz.
  en: |-
    - The first revelation: "Read, in the name of your Lord who created… who taught by the pen, taught the human what he did not know" (96:1–5).
    - "Say: My Lord, increase me in knowledge" (20:114) — the only thing the Prophet is told to ask for *more* of.
    - "Are those who know equal to those who do not know?" (39:9).
    - "God raises in rank those of you who believe and those given knowledge" (58:11).
    - "Of His servants, only those with knowledge truly revere Him" (35:28) — note the context is nature and colors (S33).
    - Hadith: "Whoever takes a path seeking knowledge, God makes easy for him a path to Paradise" (Muslim 2699). "Seeking knowledge is an obligation on every Muslim" is widely quoted, but its chain in {hadith:ibnmajah:224} is graded weak, so it is not used here as evidence.
scholarship:
  tr: |
    - Gazzâlî *İhyâ*'yı İlim Kitabı ile açar; farz-ı ayn olan ilmi (herkesin imanı ve gündelik hayatı için muhtaç olduğu bilgi) farz-ı kifâye olandan (tıp, matematik, zanaatlar — topluluğun sahip olması gereken bilimler) ayırır.
    - İbn Rüşd (*Faslü'l-Makâl*), doğayı akılla incelemenin Kur'an'ın tefekküre davetleriyle emredildiğini savundu.
    - Makâsıd çerçevesinde ilim *aklı* (*akl*) korur.
  en: |-
    - Al-Ghazālī opens the *Iḥyāʾ* with the Book of Knowledge, distinguishing knowledge that is an individual duty (*farḍ ʿayn*: what each person needs for faith and daily life) from communal duties (*farḍ kifāya*: medicine, mathematics, crafts — sciences the community must have).
    - Ibn Rushd (*Faṣl al-Maqāl*) argued that studying nature with reason is commanded by the Quran's invitations to reflect.
    - In the maqāṣid frame, knowledge protects *intellect* (*ʿaql*).
evidence:
  tr: |
    - Merak öğrenmeyi ve hafızayı güçlendirir: insanlar meraklı olduklarında cevabı — ve hatta ilgisiz bilgileri — daha iyi hatırlar (Gruber ve ark., *Neuron* 2014). [*orta*]
    - Eğitim, ülkeler genelinde sağlık, gelir ve uzun ömürle güçlü biçimde ilişkilidir. [Established, kısmen nedensel]
    - "Gelişim zihniyeti" (yeteneğin gelişebileceğine inanmak) büyük çalışmalarda başarı üzerinde yalnızca **küçük** etkiler gösterir. [*küçük*, tartışmalı]
  en: |-
    - Curiosity improves learning and memory: when people are curious, they remember the answer — and even unrelated information — better (Gruber et al., *Neuron* 2014). [*moderate*]
    - Education is strongly linked to health, income and longevity across countries. [Established, partly causal]
    - A "growth mindset" (believing ability can grow) shows only **small** effects on achievement in large studies. [*small*, debated]
stories:
  tr: |
    - Bağdat'taki Beytü'l-Hikme (Hikmet Evi): tercüme ve araştırma merkezi (9. yüzyıl).
    - Bir kadın, Fâtıma el-Fihrî tarafından kurulan Fas'taki Karaviyyîn (859), sürekli faaliyetteki en eski öğrenim yerlerinden biri olarak sık sık anılır.
    - Hârizmî (cebir), İbnü'l-Heysem (optik ve deneysel yöntem) ve İbn Sînâ (tıp) gibi âlimler.
    - Kadın âlimler: Akram Nadwi binlerce kadın hadis râvisini belgeledi (*el-Muhaddisât*).
  en: |-
    - Bayt al-Ḥikma (House of Wisdom) in Baghdad: translation and research center (9th century).
    - Al-Qarawiyyīn in Fez, founded by a woman, Fāṭima al-Fihrī (859), is often cited as one of the oldest continuously operating places of learning.
    - Scholars such as al-Khwārizmī (algebra), Ibn al-Haytham (optics and experimental method) and Ibn Sīnā (medicine).
    - Women scholars: Akram Nadwi documented thousands of women hadith transmitters (*al-Muḥaddithāt*).
gaps:
  tr: Gazzâlî'nin İlim Kitabı'na henüz başvurulmadı. Müslüman çoğunluklu ülkelerin eğitim istatistikleri henüz kontrol edilmedi. "Altın çağ" nostaljisi, bugün hiçbir şeyin değişmesi gerekmediğini yanlış bir şekilde ima edebilir.
  en: Al-Ghazali's Book of Knowledge has not yet been consulted. Education statistics for Muslim-majority countries have not yet been checked. "Golden age" nostalgia can wrongly imply nothing needs to change today.
visualizations:
  - id: ideas
    tr: |
      - "Oku" (96:1): ilk kelime, bilimlere — cebir, optik, tıp, astronomi — dallanan bir kalem darbesiyle çizilir; her biri küçük resimli bir yaprak.
      - "Rabbi zidnî ilmâ" (20:114) günlük kartı: her gün öğrenilecek ve üzerine düşünülecek yeni bir şey, bir âyet sayfasına bağlantıyla.
    en: |-
      - "Read" (96:1): the first word drawn by a pen stroke that branches into the sciences — algebra, optics, medicine, astronomy — each a small illustrated leaf.
      - A "rabbī zidnī ʿilmā" (20:114) daily card: one new thing to learn and reflect on each day, linked to a sign page.
