fullAnswer:
  - kind: quran
    en: |-
      **It began with reading.** "Recite in the name of your Lord who created" (96:1).

      **Ask for more.** "Say, 'My Lord, increase me in knowledge'" (20:114).

      **Not equal.** "Say, 'Are those who know equal to those who do not know?'" (39:9).
  - kind: sunnah
    en: |-
      **A path to Paradise.** "He who treads the path in search of knowledge, Allah would make that path easy, leading to Paradise for him" {hadith:muslim:2699}.

      **Two famous weak reports.** "Seeking knowledge is an obligation on every Muslim" ({hadith:ibnmajah:224}) and "Whoever goes out seeking knowledge is in Allah's cause until he returns" ({hadith:tirmidhi:2647}) are widely quoted, but their chains are graded weak, so they are not used here as evidence. The Quran and Muslim 2699 make the point.
  - kind: scholars
    en: "**Two kinds of duty.** Al-Ghazali opens the *Ihya'* with the Book of Knowledge. He distinguishes knowledge every person must have for faith and daily life (*fard 'ayn*) from knowledge the community must have through some of its members (*fard kifaya*), such as medicine and mathematics. Ibn Rushd (*Fasl al-Maqal*) argued that studying nature with reason is commanded by the Quran's invitations to reflect."
  - kind: history
    en: "**Learning, by men and women.** Baghdad's House of Wisdom translated and researched in the 9th century; al-Qarawiyyin in Fez was founded by a woman, Fatima al-Fihri (859). Akram Nadwi documented thousands of women hadith transmitters (*al-Muhaddithat*)."
  - kind: research
    en: "**Curiosity helps memory.** When people are curious, they remember the answer — and even unrelated information — better (Gruber et al., 2014). [Moderate] Education is strongly linked to health, income and longevity. [Established, partly causal]"
  - kind: practice
    en: '**A daily habit.** Learn one thing a day, in faith and in the world; ask "My Lord, increase me in knowledge" (20:114); read the sources, not only summaries.'
followUps:
  - q:
      en: Is secular knowledge religiously valuable?
    a:
      en: Al-Ghazali counted fields like medicine as communal duties (*fard kifaya*).
  - q:
      en: Why does the page reject a famous hadith?
    a:
      en: Because its chain is graded weak by the hadith scholars named in its badge; the site does not rest claims on weak hadith.
