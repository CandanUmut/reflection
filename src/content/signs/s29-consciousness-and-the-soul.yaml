slugs:
  tr: bilinc-ve-ruh
  en: consciousness-and-the-soul
order: 29
theme: human
title:
  tr: İnsan bilinci ve ruh
  en: Human consciousness and the soul
verses:
  - 17:85
  - 51:20-21
  - 15:29
summary:
  tr: Beyni haritalayabiliyoruz, ama deneyimin kendisini henüz açıklayamıyoruz.
  en: We can map the brain but not yet explain experience itself.
tafsir:
  tr: |
    [Scholarly]

    - Müfessirlerin çoğu 17:85'i bilinçli bir sınır olarak okur: *rûh*un mahiyeti açıklanmaz ve insanın ona dair bilgisi azdır.
    - Âlimler *rûh* (ruh) ile *nefs* (benlik) arasındaki ilişkiyi tartıştı. Gazzâlî gerçek benliği, bedeni bir alet olarak kullanan manevî bir hakikat olarak ele alır. İbn Kayyim (*Kitâbü'r-Rûh*) pek çok görüşü bir araya getirir. Bazı kelâmcılar *rûh*u latif bir cisim saydı.
    - 51:21, insanın kendi yapısı, duyuları ve iç dünyası üzerine düşünmeye bir davet olarak okunur.
  en: |-
    [Scholarly]

    - Most commentators read 17:85 as a deliberate limit: the nature of the *rūḥ* is not explained, and human knowledge of it is small.
    - Scholars debated the relation of *rūḥ* (spirit) and *nafs* (self). Al-Ghazālī treats the true self as a spiritual reality that uses the body as a tool. Ibn al-Qayyim (*Kitāb al-Rūḥ*) collects many views. Some theologians held the *rūḥ* to be a subtle body.
    - 51:21 is read as an invitation to reflect on the human being's own design, senses and inner life.
howItWorks:
  tr: |
    [Established] [Debated]

    …ve nerede durur.

    - Sinirbilim bilincin pek çok **eşlikçisini** haritaladı: bir şeyin farkında olmaya güvenilir biçimde eşlik eden beyin etkinliği.
    - Filozof David Chalmers **"zor problem"** adını koydu: fiziksel süreçlere neden iç deneyim eşlik ediyor; kırmızıyı görmenin ya da acı hissetmenin "nasıl bir şey olduğu" neden var? Bu hâlâ çözülmedi [Debated].
    - İki önde gelen kuram, Bütünleşik Bilgi Kuramı ve Küresel Nöronal Çalışma Alanı Kuramı, büyük bir "hasım iş birliğinde" (Cogitate konsorsiyumu) karşı karşıya sınandı. 2025'te *Nature*'da yayımlanan sonuçlar **her iki** kuramın da temel öngörülerini sorguladı.
    - 2023'te sinirbilimci Christof Koch, bilincin sinirsel temelinin o zamana kadar açıkça belirleneceğine dair Chalmers'la yaptığı 25 yıllık iddiayı kaybetti.
  en: |-
    [Established] [Debated]

    …and where it stops.

    - Neuroscience has mapped many **correlates** of consciousness: brain activity that reliably comes with being aware of something.
    - Philosopher David Chalmers named the **"hard problem"**: why physical processes are accompanied by inner experience at all, why there is "something it is like" to see red or feel pain. This remains unsolved [Debated].
    - Two leading theories, Integrated Information Theory and Global Neuronal Workspace Theory, were tested head to head in a large "adversarial collaboration" (the Cogitate consortium). Results published in *Nature* in 2025 challenged key predictions of **both** theories.
    - In 2023 neuroscientist Christof Koch lost a 25-year bet to Chalmers that the neural basis of consciousness would be clearly identified by then.
awe:
  tr: |
    - Beyinde kabaca 86 milyar nöron var; yine de kimse bu etkinliğin neden içeriden hissedildiğini açıklayamıyor.
    - On yıllarca süren araştırmalardan ve ünlü bir 25 yıllık iddiadan sonra, temel soru hâlâ açık.
  en: |-
    - The brain has roughly 86 billion neurons, yet no one can explain why their activity is felt from the inside.
    - After decades of research and a famous 25-year bet, the core question is still open.
reflection:
  tr: |
    Kur'an iç dünyayı bir âyet olarak gösterir ("kendi nefislerinizde") ve aynı nefeste bir sınır koyar ("size pek az bilgi verilmiştir"). Modern bilim de sınırda hemfikir: beyni haritalayabiliyoruz, ama deneyimin kendisini henüz açıklayamıyoruz.
  en: 'The Quran points to the inner life as a sign ("in yourselves") and, in the same breath, sets a limit ("only a little knowledge"). Modern science agrees on the limit: we can map the brain but not yet explain experience itself.'
honestNotes:
  - tr: |
      - Zor problemin çözülmemiş olması bir ruhun var olduğunu **kanıtlamaz**. Materyalist filozoflar onun gelecekte çözülebileceğini ya da karışık bir soru olduğunu savunur. Bu adil bir tartışmadır.
      - *Rûh*, filozofların kullandığı anlamda "bilinç" ile tam olarak aynı değildir. İslam geleneği *rûh* hakkında birkaç görüş taşır.
      - Bu, imanın da dürüst bilimin de sırrı kabul ettiği açık bir sınırdır.
    en: |-
      - The hard problem being unsolved does **not** prove a soul exists. Materialist philosophers argue it may be solved in the future or is a confused question. This is a fair debate.
      - *Rūḥ* is not exactly the same as "consciousness" as philosophers use the word. Islamic tradition itself holds several views of the *rūḥ*.
      - This is an open frontier where faith and honest science both admit mystery.
visualizations:
  - id: ideas
    tr: |
      - Bir "harita ve deneyim" kartı: bir yanda ayrıntılı bir beyin etkinliği taraması, öbür yanda hiçbir taramanın gösteremeyeceği "nasıl hissettirdiği" etiketli boş bir çerçeve.
      - 1998'deki Koch–Chalmers iddiasından 2023'teki sonuca ve 2025 *Nature* sonuçlarına bir zaman çizelgesi.
    en: |-
      - A "map vs. experience" card: a detailed brain-activity scan on one side, and on the other side an empty frame labeled "what it feels like", which no scan can show.
      - A timeline of the 1998 Koch–Chalmers bet to its 2023 settlement and the 2025 *Nature* results.
