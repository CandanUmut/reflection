verseNotes:
  en: |-
    "And they ask you, [O Muhammad], about the soul. Say, 'The soul is of the affair of my Lord. And mankind have not been given of knowledge except a little'" (17:85), Meccan, in Sura al-Isrāʾ.

    "And on the earth are signs for the certain [in faith]. And in yourselves. Then will you not see?" (51:20–21), Meccan, in Sura al-Dhāriyāt.

    "And when I have proportioned him and breathed into him of My [created] soul, then fall down to him in prostration" (15:29), Meccan, God's words to the angels about Adam (pbuh) in Sura al-Ḥijr.

    - **Key words.** *Al-rūḥ*: spirit or soul; the same word is used elsewhere in the Quran for the angel of revelation, which is why commentators differ on what it means in 17:85 (below). *Min amri rabbī* ("of the affair of my Lord"): from His command or His matter. *Min rūḥī* (15:29, "of My [created] soul"): the bracket "[created]" is Saheeh International's, not in the Arabic.
    - **Occasion.** A report in al-Bukhari, cited by Ibn Kathir (below), says the question came from some Jews; *Tanwīr al-Miqbās* says it came from the Meccans. The sura is Meccan.
legacyHonestNotes:
  - tr: |
      - Zor problemin çözülmemiş olması bir ruhun var olduğunu **kanıtlamaz**. Materyalist filozoflar onun gelecekte çözülebileceğini ya da karışık bir soru olduğunu savunur. Bu görüş adil bir değerlendirmeyi hak eder.
      - *Rûh*, filozofların kullandığı anlamda "bilinç" ile tam olarak aynı değildir. İslam geleneği *rûh* hakkında birkaç görüş taşır.
      - Bu, imanın da dürüst bilimin de sırrı kabul ettiği açık bir sınırdır.
    en: |-
      - The hard problem being unsolved does **not** prove a soul exists. Materialist philosophers argue it may be solved in the future or is a confused question. That view deserves a fair hearing.
      - *Rūḥ* is not exactly the same as "consciousness" as philosophers use the word. Islamic tradition itself holds several views of the *rūḥ*.
      - This is an open frontier where faith and honest science both admit mystery.
followUps:
  - q:
      en: Is the soul the same as consciousness?
    a:
      en: Not exactly. *Rūḥ* in 17:85 is read as the life-giving spirit (al-Jalālayn), the soul in its link to the self (Ibn Kathir), or even the angel of revelation (Mawdudi). Consciousness is a modern philosophical term for inner experience.
  - q:
      en: Who asked the Prophet (pbuh) about the *rūḥ*?
    a:
      en: Some Jews, according to Ibn Masʿud's report in al-Bukhari (cited by Ibn Kathir); the Meccans, according to *Tanwīr al-Miqbās*.
  - q:
      en: Does neuroscience disprove the soul?
    a:
      en: No. Nor does it prove it. It has mapped much of what happens in the brain during experience, but why experience exists at all is still debated (Weisberg, *IEP*), and the 2025 Cogitate tests challenged both leading theories.
  - q:
      en: What does "My [created] soul" in 15:29 mean?
    a:
      en: "Al-Jalālayn: the attribution to God is \"a conferring of honour upon Adam\", not a part of God. The bracket \"[created]\" is Saheeh International's addition."
