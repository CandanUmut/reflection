order: 31
theme: earth
title:
  tr: Ekolojik denge ve ölçü
  en: Ecological balance and measure
verses:
  - 55:7-9
  - 15:19
seeAlso:
  - 54:49
  - 25:2
summary:
  tr: '55:7–9 göğü ve teraziyi birleştirir: Allah göğü "yükseltti ve mizanı koydu", sonra insanlara şöyle der: "Tartıyı adaletle yapın, terazide eksiklik yapmayın."'
  en: '55:7–9 joins the sky and the scale: God "raised" the heaven and "imposed the balance", then tells people "establish weight in justice and do not make deficient the balance".'
verseNotes:
  tr: |-
    "Göğü yükseltti ve mizanı koydu. Sakın tartıda taşkınlık etmeyin. Tartıyı adaletle yapın, terazide eksiklik yapmayın." (55:7–9), Rahmân Sûresi'nde; Tanzil sınıflandırmasında Medenî.

    "Yeryüzünü düzgün bir şekilde yarattık ve oraya sabit dağlar yerleştirdik. Orada hikmetle ölçülmüş her şeyden bitkiler bitirdik." (15:19), Mekkî.

    - **Anahtar kelimeler.** *El-mîzân* ("mizan"): bir terazi ve bundan genişleyerek adalet. Arapçada 55:7–9'da üç kez geçer (Elmalılı onu "mizan", "tartı" ve "terazi" olarak verir). *Mevzûn* (15:19, "hikmetle ölçülmüş"): tartılmış, ölçülmüş.
    - **Bağlam.** Rahmân Sûresi Allah'ın nimetlerini birbiri ardınca sayar ve dinleyenlerinin bunların hangisini yalanlayacağını soran bir nakaratı tekrarlar. 55:7–9 üç âyette gökten çarşıya iner.
    - **İlgili bir âyet.** "Andolsun biz peygamberlerimizi açık delillerle gönderdik ve insanların adaleti yerine getirmeleri için beraberlerinde kitabı ve ölçüyü indirdik." (57:25): İbn Kesîr 55:7'deki *mîzân*ı açıklamak için onu zikreder.
  en: |-
    "And the heaven He raised and imposed the balance. That you not transgress within the balance. And establish weight in justice and do not make deficient the balance" (55:7–9), in Sura al-Raḥmān, Medinan in the Tanzil classification.

    "And the earth - We have spread it and cast therein firmly set mountains and caused to grow therein [something] of every well-balanced thing" (15:19), Meccan.

    - **Key words.** *Al-mīzān* ("the balance"): a scale, and by extension justice. It appears three times in 55:7–9. *Mawzūn* (15:19, "well-balanced"): weighed, measured.
    - **Setting.** Al-Raḥmān lists God's gifts one after another, with a repeated refrain asking which of them its hearers would deny. 55:7–9 moves in three verses from the sky to the marketplace.
    - **A related verse.** "We have already sent Our messengers with clear evidences and sent down with them the Scripture and the balance that the people may maintain [their affairs] in justice" (57:25) — Ibn Kathir cites it to explain *mīzān* in 55:7.
tafsir:
  tr: |-
    **İbn Kesîr, 55:7–9 hakkında.** Mizan "adalettir"; 57:25'i zikreder. 55:8 hakkında: "Gökleri ve yeri adalet ve hakikat üzere yarattı; öyle ki her şey adalet ve hakikat üzerine kurulmuştur ve onlara riayet eder." 55:9 hakkında: "Tartılarda ve ölçülerde hile yapmayın, aksine adalete ve hakkaniyete riayet edin".

    ***Celâleyn*, 55:7 hakkında.** "Göğü yükseltti ve mizanı koydu; adaleti tesis etti".

    ***Tenvîrü'l-Mikbâs*, 55:7 hakkında.** "Adil ölçüyü terazi yoluyla açıkladı".

    **İbn Kesîr, 15:19 hakkında.** "Her türlü şey yerinde bir oranla": İbn Abbâs, "Bu, önceden belirlenmiş oranlarıyla demektir" dedi ve bu, "Saîd b. Cübeyr, İkrime, Ebû Mâlik, Mücâhid, Hakem b. Uteybe, Hasan b. Muhammed, Ebû Sâlih ve Katâde'nin de görüşüydü."

    ***Celâleyn*, 15:19 hakkında.** "Bilinen ve belirlenmiş her tür şey." *Tenvîr*: "Ölçülmüş ve bilinen miktarlarda bitkilerden ve meyvelerden" ya da başka bir okumaya göre, tartıyla ölçülen şeyler, "altın, gümüş, maden cevheri, bakır vb. gibi".

    **Nerede ayrılıyorlar?** 55:7 hakkında, mizanın adalet (İbn Kesîr; *Celâleyn*) ya da adil ölçü (*Tenvîr*) anlamına geldiğinde birleşirler. 15:19 hakkında *mevzûn*u Allah'ın koyduğu bir oran (İbn Kesîr yoluyla İbn Abbâs ve erken müfessirler), "bilinen ve belirlenmiş" olan (*Celâleyn*) ya da ikinci bir okumada tartılan madenler (*Tenvîr*) olarak okurlar. Hiçbiri iki âyetten birini ekoloji hakkında okumaz.
  en: |-
    **Ibn Kathir on 55:7–9.** The balance is "the justice", citing 57:25. On 55:8: "He created the heavens and earth in justice and truth so that everything is founded on, and observing, justice and truth." On 55:9: "do not cheat in the weights and measures, but rather observe justice and fairness".

    **Al-Jalālayn on 55:7.** "He has raised the heaven and set up the balance He has established justice".

    **Tanwīr al-Miqbās on 55:7.** "He explained fair measure through the scale".

    **Ibn Kathir on 15:19.** "All kinds of things in due proportion": Ibn ʿAbbas said "this means with their predetermined proportions", and this "was also the opinion of Sa'id bin Jubayr, 'Ikrimah, Abu Malik, Mujahid, Al-Hakim bin 'Utaybah, Al-Hasan bin Muhammad, Abu Salih and Qatadah."

    **Al-Jalālayn on 15:19.** "every kind of thing known and determined." *Tanwīr*: "of vegetation and fruits in measured and known quantities", or, as another reading, things measured by weight "such as gold, silver, ore, copper, etc."

    **Where they differ.** On 55:7 they agree that the balance means justice (Ibn Kathir; al-Jalālayn), or fair measure (*Tanwīr*). On 15:19 they read *mawzūn* as a proportion set by God (Ibn ʿAbbas and the early commentators via Ibn Kathir), as what is "known and determined" (al-Jalālayn), or, in a second reading, as metals that are weighed (*Tanwīr*). None of them reads either verse as being about ecology.
howItWorks:
  tr: |-
    Bunlar tabiattaki denge hakkında modern gerçeklerdir. Âyetlere yalnızca tefekkür yoluyla bağlanırlar; âyetlerin kendi konusu adalettir.
    - **Bir avcı, koca bir kıyı.** [Established] Estes ve Palmisano, "deniz samuru popülasyonları olan ve olmayan batı Aleut Adaları'nı" karşılaştırarak "deniz samurlarının otçul omurgasız popülasyonlarını kontrol ettiğini" ve "deniz samurlarının ortadan kaldırılmasının otlamanın artmasına ve sonunda makrofit topluluklarının (kelp gibi büyük deniz yosunları) yok olmasına yol açtığını" buldu (*Science*, 1974). Ekolojistler bu tür hayvanlara "kilit taşı" türler der.
    - **Yellowstone ve basit hikâyelerin neden yetmediği.** [Debated] Kurtlar 1995'te Yellowstone'a döndükten sonra, söğütleri yeniden canlandıran bir "trofik çağlayan" (besin ağında aşağı doğru bir etkiler zinciri) başlattıkları yaygın olarak söylendi. Ripple ve arkadaşlarının 2025'teki bir çalışması söğüt taç hacminde %1.500'lük bir artış bildirdi. Resmî bir cevapta Daniel MacNulty (Utah State) ve arkadaşları, bu tahminin "döngüsel bir akıl yürütmeye dayandığını" savundu, çünkü "yükseklik hem hacmi hesaplamak hem de tahmin etmek için kullanıldı"; verilerin "daha mütevazı ve mekâna göre değişen bir tepki" gösterdiğini söylediler. David Cooper (Colorado State): "Avcıların geri dönüşünün söğüt büyümesinde büyük ya da sistem çapında bir artışa yol açtığına dair hiçbir delil yoktur". MacNulty: "Yellowstone'daki avcı etkileri gerçektir ama bağlama bağlıdır". Duyuru, yaklaşık 20 yıllık saha deneylerinde yalnızca zayıf çağlayan etkileri bulan Hobbs ve ark.'nı (2024) da not eder (*ScienceDaily*, 2026). Tartışma sürüyor.
  en: |-
    These are modern facts about balance in nature. They connect to the verses only by reflection; the verses' own subject is justice.
    - **One predator, a whole coast.** [Established] Comparing "western Aleutian Islands with and without sea otter populations", Estes and Palmisano found that "Sea otters control herbivorous invertebrate populations", and that "Removal of sea otters causes increased herbivory and ultimately results in the destruction of macrophyte associations" (large seaweeds such as kelp) (*Science*, 1974). Ecologists call such animals "keystone" species.
    - **Yellowstone, and why simple stories fail.** [Debated] After wolves returned to Yellowstone in 1995, it was widely said they set off a "trophic cascade" (a chain of effects down the food web) that restored willows. A 2025 study by Ripple and colleagues reported a 1,500% rise in willow crown volume. In a formal reply, Daniel MacNulty (Utah State) and colleagues argued that this estimate "relies on circular reasoning", because "height was used both to compute and to predict volume", and that the data show a "more modest and spatially variable response". David Cooper (Colorado State): "there is no evidence that predator recovery caused a large or system-wide increase in willow growth". MacNulty: "Predator effects in Yellowstone are real but context-dependent". The release also notes Hobbs et al. A Yellowstone experiment lasting more than twenty years found that once heavy elk browsing had turned willow stands into grassland, the landscape "resisted returning to previous conditions once the carnivores were restored" (Hobbs, Cooper et al., *Ecological Monographs*, 2024). The debate continues.
awe:
  tr: |-
    - Deniz samuru olmayan adalarda kelp ormanları otlayan hayvanlarca yok edildi; samurların olduğu yerde ayakta kaldılar (Estes ve Palmisano, 1974).
    - Yeniden kurulan dengenin en ünlü hikâyesi bile, Yellowstone kurtları, dikkatli bilim insanlarınca hâlâ tartışılıyor (MacNulty ve ark., 2025).
  en: |-
    - On islands without sea otters, the kelp forests were destroyed by grazers; with otters, they stood (Estes & Palmisano, 1974).
    - Even the most famous story of balance restored — Yellowstone's wolves — is still being argued about by careful scientists (MacNulty et al., 2025).
reflection:
  tr: |-
    Rahmân Sûresi üç kısa âyette alışılmadık bir şey yapar. Yükseltilmiş göğe bakar ve Allah hakkında şöyle der: "Göğü yükseltti ve mizanı koydu." Sonra, ara vermeden, bir tüccarın terazisine bakar: "Tartıyı adaletle yapın, terazide eksiklik yapmayın."

    İbn Kesîr bağlantıyı açıklar: Gökler ve yer "adalet ve hakikat üzere yaratıldı; öyle ki her şey adalet ve hakikat üzerine kurulmuştur ve onlara riayet eder". Göğü ayakta tutan aynı düzen, un tartan elden de istenir. Terazide hile yapmak küçük bir şey değildir; yaratılışın dokusuna aykırıdır.

    Âyetler ekosistemlerden söz etmez. Ama modern bir okuyucu düşünceyi genişletebilir ve onu bir genişletme olarak işaretleyebilir: Biz de canlı dünyanın üzerinde bir terazi tutuyoruz. Deniz samurunu kaldırın, kelp ormanı çöker. Aşırı avlanın, ormanları temizleyin, iklimi ısıtın; başka bir anlamda "terazide eksiklik" yaparız.

    Yellowstone gerekli bir uyarı ekler. Güzel bir hikâye (kurtlar döner, nehirler iyileşir) anlatıldığından daha karmaşık çıktı. Kur'an'ın "Tartıyı adaletle yapın" emri burada da geçerlidir: delili adilce tartmak ve teraziyi sevdiğimiz hikâyeden yana eğmemek.
  en: |-
    Al-Raḥmān does something unusual in three short verses. It looks up at the raised sky and says God "imposed the balance". Then, without a pause, it looks down at a merchant's scale: "establish weight in justice and do not make deficient the balance."

    Ibn Kathir explains the link: the heavens and earth were made "in justice and truth so that everything is founded on, and observing, justice and truth". The same order that holds the sky is asked of the hand that weighs flour. Cheating on a scale is not a small thing; it goes against the grain of creation.

    The verses do not speak of ecosystems. But a modern reader can extend the thought, and label it as an extension: we also hold a scale over the living world. Remove the sea otter, and the kelp forest falls. Overfish, clear forests, warm the climate, and we "make deficient the balance" in another sense.

    Yellowstone adds a needed warning. A beautiful story — wolves return, rivers heal — turned out to be more complicated than it was told. The Quranic command "establish weight in justice" applies here too: to weigh the evidence fairly, and not to tip the scale toward the story we like.
honestNotes:
  - en: "**The verses are about justice.** Ibn Kathir, al-Jalālayn and *Tanwīr* read *mīzān* as justice and fair measure. Reading 55:7–9 as a teaching about ecology is a modern extension. It is a reasonable one, but it must be labelled."
    tr: "**Âyetler adalet hakkındadır.** İbn Kesîr, *Celâleyn* ve *Tenvîr* *mîzân*ı adalet ve adil ölçü olarak okur. 55:7–9'u ekoloji hakkında bir öğreti olarak okumak modern bir genişletmedir. Makul bir genişletmedir, ama işaretlenmelidir."
  - en: "**Nature's \"balance\" is not harmony.** Ecosystems change, species go extinct, and competition is constant. The sea otter case shows strong effects, not a fixed balance."
    tr: '**Tabiatın "dengesi" uyum değildir.** Ekosistemler değişir, türler yok olur ve rekabet süreklidir. Deniz samuru örneği sabit bir dengeyi değil, güçlü etkileri gösterir.'
  - en: "**Yellowstone.** The willow debate is live. This page reports both sides through a university release; neither paper itself was read."
    tr: "**Yellowstone.** Söğüt tartışması canlıdır. Bu sayfa iki tarafı bir üniversite duyurusu yoluyla aktarır; makalelerin hiçbiri okunmadı."
  - en: "**15:19.** The early commentators read *mawzūn* as a measure set by God. Modern claims that it describes chemical or ecological proportions go beyond them."
    tr: "**15:19.** Erken müfessirler *mevzûn*u Allah'ın koyduğu bir ölçü olarak okudu. Onun kimyasal ya da ekolojik oranları anlattığına dair modern iddialar onların ötesine geçer."
