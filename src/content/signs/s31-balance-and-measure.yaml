id: S31
slugs:
  tr: denge-ve-olcu
  en: balance-and-measure
order: 31
theme: earth
title:
  tr: Ekolojik denge ve ölçü
  en: Ecological balance and measure
verses:
  - 55:7-9
  - 15:19
seeAlso:
  - 54:49
  - 25:2
summary:
  tr: Âyet kozmik dengeyi ve adil ticareti yan yana koyar. Doğada gördüğümüz düzen aynı zamanda ahlâkî bir öğüttür.
  en: The verse puts the cosmic balance and fair trade side by side. The order we see in nature is also a moral instruction.
verseNotes:
  tr: 55:7'de *el-mîzân* (denge, ölçü); 15:19'da *mevzûn* (ölçülü).
  en: In 55:7, *al-mīzān* (the balance); in 15:19, *mawzūn* (in measured proportion).
tafsir:
  tr: |
    [Scholarly]

    - Müfessirler 55:7'deki *mîzân*ı hem kozmik düzen hem adalet olarak okur. Sonraki âyetler doğrudan ticaretteki adil tartılara ve ölçülere geçer.
    - 15:19'daki *mevzûn* "doğru oranda", her şeyin hikmete ve ihtiyaca göre olması diye okunur.
    - Temel adım kozmostan ahlâka geçiştir: yaratılıştaki denge, insan ilişkilerindeki denge için bir örnektir.
  en: |-
    [Scholarly]

    - Commentators read *mīzān* in 55:7 as both the cosmic order and justice. The next verses move straight to fair weights and measures in trade.
    - *Mawzūn* in 15:19 is read as "in right proportion", each thing according to wisdom and need.
    - The key move is from cosmos to ethics: the balance in creation is a model for balance in human dealings.
howItWorks:
  tr: |
    [Established]

    - Ekosistemler karbon, azot, su ve besin döngüleriyle işler. Üreticiler, tüketiciler ve ayrıştırıcılar maddelerin dolaşmasını sağlar.
    - **Kilit türlerin** etkisi sayılarından çok daha büyüktür. Klasik bir örnek deniz samurudur: deniz kestanelerini yiyerek yosun ormanlarını korur.
    - 1995'te geri getirilen Yellowstone kurtlarının bir "trofik çağlayan" yoluyla nehirleri ve titrek kavakları eski hâline getirdiği sık sık söylenir. Son çalışmalar bu etkinin gerçekte ne kadar güçlü olduğuna itiraz ediyor ve bilim insanları hâlâ tartışıyor.
    - İnsan etkinliği sistemleri dengeden çıkarabilir: aşırı avlanma, yaşam alanı kaybı ve iklim değişikliği.
  en: |-
    [Established]

    - Ecosystems run on cycles of carbon, nitrogen, water and nutrients. Producers, consumers and decomposers keep materials moving.
    - **Keystone species** have effects far larger than their numbers. A classic case is the sea otter: by eating sea urchins, otters protect kelp forests.
    - Yellowstone's wolves, returned in 1995, are often said to have restored rivers and aspen trees through a "trophic cascade". Recent studies dispute how strong this effect really was, and scientists still debate it.
    - Human activity can push systems out of balance: overfishing, habitat loss and climate change.
awe:
  tr: |
    - Küçük tek bir avcıyı ortadan kaldırmak, bütün bir kıyının ekosistemini değiştirebilir.
    - Doğanın dengesi donmuş değil, dinamiktir; sürekli kendini ayarlar.
  en: |-
    - Removing one small predator can change a whole coastline's ecosystem.
    - Nature's balance is dynamic, constantly adjusting, not frozen.
reflection:
  tr: |
    Âyet kozmik dengeyi ve adil ticareti yan yana koyar. Doğada gördüğümüz düzen aynı zamanda ahlâkî bir öğüttür: *dengeyi bozmayın*. Bu, hem insanlara hem yeryüzüne nasıl davrandığımız için geçerlidir.
  en: "The verse puts the cosmic balance and fair trade side by side. The order we see in nature is also a moral instruction: *do not transgress the balance*. That applies to how we treat both people and the earth."
honestNotes:
  - tr: |
      - Doğanın "dengesi" kusursuz bir ahenk değildir. Yok oluşu, rekabeti ve değişimi de içerir. Doğayı hep barışçıl göstermekten kaçınmak gerekir.
      - Yellowstone kurtlarının hikâyesi sık sık basit bir başarı olarak anlatılır; bilimsel tartışmayı dürüstçe sunmak gerekir.
      - 55:7–9'daki *mîzân* öncelikle adaletle ilgilidir; onu ekoloji olarak okumak geçerli bir genişletmedir [Scholarly], tek anlamı değil.
    en: |-
      - Nature's "balance" is not perfectly harmonious. It also includes extinction, competition and change. Avoid painting nature as always peaceful.
      - The Yellowstone wolf story is often told as a simple success; present the scientific debate honestly.
      - *Mīzān* in 55:7–9 is primarily about justice; reading it as ecology is a valid extension [Scholarly], not its only meaning.
visualizations:
  - id: ideas
    tr: |
      - Etkileşimli bir besin ağı: bir kilit türü (deniz samurları) çıkarın ve etkilerin sistemde dalga dalga yayılışını izleyin (deniz kestaneleri çoğalır, yosun kaybolur).
      - 55:7'yi (kozmos) 55:9'a (adil tartı) bağlayan bir "denge" terazisi kartı.
    en: |-
      - An interactive food web: remove a keystone species (sea otters) and watch the effects ripple through the system (urchins boom, kelp disappears).
      - A "balance" scale card linking 55:7 (cosmos) to 55:9 (fair weight).
