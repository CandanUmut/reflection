legacyHonestNotes:
  - tr: |
      - Doğanın "dengesi" kusursuz bir ahenk değildir. Yok oluşu, rekabeti ve değişimi de içerir. Doğa her zaman barışçıl değildir.
      - Yellowstone kurtlarının hikâyesi sık sık basit bir başarı olarak anlatılır; bilimsel tartışma gerçektir.
      - 55:7–9'daki *mîzân* öncelikle adaletle ilgilidir; onu ekoloji olarak okumak geçerli bir genişletmedir [Scholarly], tek anlamı değil.
    en: |-
      - Nature's "balance" is not perfectly harmonious. It also includes extinction, competition and change. Nature is not always peaceful.
      - The Yellowstone wolf story is often told as a simple success; the scientific debate is real.
      - *Mīzān* in 55:7–9 is primarily about justice; reading it as ecology is a valid extension [Scholarly], not its only meaning.
followUps:
  - q:
      en: Is the verse about ecology?
    a:
      en: Classically it is about justice and fair measure (Ibn Kathir; al-Jalālayn). Applying it to the environment is a modern reflection, and this page labels it as one.
  - q:
      en: What does "do not make deficient the balance" mean in practice?
    a:
      en: 'Ibn Kathir: "do not cheat in the weights and measures, but rather observe justice and fairness".'
  - q:
      en: What does "well-balanced" in 15:19 mean?
    a:
      en: '"With their predetermined proportions", said Ibn ʿAbbas, followed by Mujahid, Qatada and others (via Ibn Kathir).'
  - q:
      en: Did wolves really save Yellowstone?
    a:
      en: Scientists disagree. One 2025 study reported a large willow recovery; a reply argued that its method was circular and that the effect is "modest and spatially variable" (MacNulty et al.).
