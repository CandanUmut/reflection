  en: expanding-heavens
order: 23
theme: cosmos
title:
  tr: Göklerin genişletilmesi
  en: Expansion of the heavens
verses:
  - 51:47
summary:
  tr: Gördüğümüz gök sabit bir tavan değil; uçsuz bucaksız ve hâlâ büyüyen bir yaratılıştır.
  en: The sky we see is not a fixed ceiling but a vast, still-growing creation.
verseNotes:
  tr: '*Bi-eyd*: kuvvetle ("ellerle" değil). *Le-mûsiûn*: genişleticiler ya da genişlik sahibi olanlar.'
  en: '*Bi-ayd*: with strength (not "hands"). *La-mūsiʿūn*: expanders, or possessors of vastness.'
tafsir:
  tr: |
    [Scholarly]

    - İbn Abbâs ve diğerlerine göre *eyd*, kuvvet ya da güç demektir ("eller" değil).
    - *Mûsiûn* birkaç şekilde okundu: "Biz geniş bir güce sahibiz" (Taberî bunu nakleder); "Yaratıkların rızkını genişletiriz"; ya da "Onu geniş kıldık". İbn Kesîr göğün geniş ve uçsuz bucaksız kılınmasından söz eder.
    - Klasik vurgu, kozmosun zaman içinde değişen büyüklüğü değil, Allah'ın kudreti ve cömertliğidir.
  en: |-
    [Scholarly]

    - *Ayd* means strength or power (not "hands"), per Ibn ʿAbbās and others.
    - *Mūsiʿūn* was read in several ways: "We are able, with vast capacity" (al-Ṭabarī reports this); "We widen provision for creatures"; or "We made it wide". Ibn Kathīr mentions making the sky wide and vast.
    - The classical focus is God's power and generosity, not a changing size of the cosmos over time.
howItWorks:
  tr: |
    [Established]

    - 1927'de Georges Lemaître, 1929'da Edwin Hubble, uzak galaksilerin bizden uzaklaştığını ve ne kadar uzaksalar o kadar hızlı uzaklaştıklarını gösterdi. En iyi açıklama, uzayın kendisinin genişlemesidir.
    - Genişleme hızı (Hubble sabiti) megaparsek başına saniyede yaklaşık 67–73 km'dir. İki ana yöntem biraz farklı sonuç verir (erken evrenden yaklaşık 67, yakın yıldızlardan yaklaşık 73). Bu "Hubble gerilimi" açık bir sorundur.
    - 1998'den beri genişlemenin hızlandığını biliyoruz; bu "karanlık enerjiye" bağlanır.
    - Genişlemeyi geriye doğru izlemek yaklaşık 13,8 milyar yıllık bir yaş verir.
  en: |-
    [Established]

    - In 1927 Georges Lemaître, and in 1929 Edwin Hubble, showed that distant galaxies are moving away from us, faster the farther they are. The best explanation is that space itself is expanding.
    - The expansion rate (the Hubble constant) is about 67–73 km/s per megaparsec. Two main methods disagree slightly (about 67 from the early universe, about 73 from nearby stars). This "Hubble tension" is an open problem.
    - Since 1998 we know the expansion is speeding up, which is attributed to "dark energy".
    - Tracing the expansion back gives an age of about 13.8 billion years.
awe:
  tr: |
    - Gördüğümüz galaksiler uzayda uçmuyor; aralarındaki uzay büyüyor.
    - En uzak galaksilerden gelen ışık, onlardan 13 milyar yıldan daha uzun süre önce yola çıktı.
    - Einstein bile önce genişleyen bir evrene direndi ve onu durağan tutmak için denklemine bir terim ekledi.
  en: |-
    - The galaxies we see are not flying through space; space between them is growing.
    - Light from the most distant galaxies left them more than 13 billion years ago.
    - Even Einstein first resisted an expanding universe and added a term to keep it static.
reflection:
  tr: |
    Gördüğümüz gök sabit bir tavan değil; uçsuz bucaksız ve hâlâ büyüyen bir yaratılıştır. "Kuvvetle bina ettik" ve "Onu genişletmekteyiz" ifadeleri, aklımızın zor kavradığı bir ölçek karşısında hayrete davet eder.
  en: The sky we see is not a fixed ceiling but a vast, still-growing creation. "Built with strength" and "We are expanding it" invite awe at a scale our minds can barely hold.
honestNotes:
  - tr: |
      - "Kur'an genişleyen evreni önceden bildirdi" demek abartıdır. Kelime "genişleten" okumasına imkân verir ve bazı modern âlimler bunu tercih eder [Debated]; ama klasik müfessirler onu çoğunlukla kudret, güç ya da cömertlik olarak okudu.
      - Modern okumayı, âyetin tek anlamı olarak değil, klasik okumaların yanında kozmolojiyle uyuşan ve kelimenin izin verdiği bir anlam olarak sunmak gerekir.
      - Kozmoloji kesin genişleme hızını hâlâ tartışıyor; bu yüzden "Kur'an rakamla örtüşüyor" gibi kesin iddialardan kaçınmak gerekir.
    en: |-
      - "The Quran predicted the expanding universe" overstates. The word allows an "expanding" reading, and some modern scholars favor it [Debated], but classical commentators mostly read it as power, capacity or generosity.
      - Present the modern reading as an allowed meaning that harmonizes with cosmology, alongside the classical readings, not as the verse's only meaning.
      - Cosmology itself is still debating the exact expansion rate, so avoid precise "the Quran matches the number" claims.
visualizations:
  - id: ideas
    tr: |
      - Bir "üzümlü ekmek" ya da balon canlandırması: gerilen bir yüzeydeki noktalar (galaksiler); uzaktaki noktalar arasındaki mesafe daha hızlı büyür.
      - *Le-mûsiûn* için klasik okumaları ve modern okumayı yan yana gösteren bir kelime kartı.
    en: |-
      - A "raisin bread" or balloon animation: dots (galaxies) on a stretching surface, with distances growing faster for farther dots.
      - A word card for *la-mūsiʿūn* that shows the classical readings and the modern one side by side.
