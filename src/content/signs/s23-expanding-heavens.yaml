legacyHonestNotes:
  - tr: |
      - "Kur'an genişleyen evreni önceden bildirdi" demek abartıdır. Kelime "genişleten" okumasına imkân verir ve bazı modern âlimler bunu tercih eder [Debated]; ama klasik müfessirler onu çoğunlukla kudret, güç ya da cömertlik olarak okudu.
      - Modern okuma, kelimenin izin verdiği ve kozmolojiyle uyuşan bir anlamdır; klasik okumaların yanında durur, âyetin tek anlamı değildir.
      - Kozmoloji kesin genişleme hızını hâlâ tartışıyor; bu yüzden "Kur'an rakamla örtüşüyor" gibi kesin iddialar tutmaz.
    en: |-
      - "The Quran predicted the expanding universe" overstates. The word allows an "expanding" reading, and some modern scholars favor it [Debated], but classical commentators mostly read it as power, capacity or generosity.
      - The modern reading is an allowed meaning that harmonizes with cosmology; it stands alongside the classical readings and is not the verse's only meaning.
      - Cosmology itself is still debating the exact expansion rate, so precise "the Quran matches the number" claims do not hold.
    important: true
followUps:
  - q:
      en: Does 51:47 say the universe is expanding?
    a:
      en: The word *mūsiʿūn* can be read that way, but the early commentators mostly read it as God's power or His widening of provision (al-Qurtubi, reporting Ibn ʿAbbas, al-Hasan and al-Dahhak), and Ibn Kathir as having made the sky vast.
  - q:
      en: What does *bi-ayd* mean?
    a:
      en: '"With strength" — the reading of Ibn ʿAbbas, Mujahid, Qatada, al-Thawri and others (Ibn Kathir; al-Qurtubi). It is not "hands".'
  - q:
      en: Who discovered the expansion?
    a:
      en: Georges Lemaître proposed and justified it in 1927, and Edwin Hubble published the distance–velocity relation in 1929. The IAU now recommends the name "Hubble–Lemaître law" (Kragh, 2018).
  - q:
      en: What is the Hubble tension?
    a:
      en: The early universe (Planck) gives an expansion rate of 67.4 km/s per megaparsec; nearby stars and supernovae give 73.0. The difference is too large to be chance, and no one yet knows why.
  - q:
      en: What is dark energy?
    a:
      en: It is the name for whatever is making the expansion speed up. It makes up about three quarters of the universe, but its nature is unknown (Nobel Prize press release, 2011).
