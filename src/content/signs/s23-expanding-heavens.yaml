followUps:
  - q:
      en: Did classical scholars read 51:47 as the expanding universe?
    a:
      en: No; their readings were about power, vastness and provision. The modern cosmology and the debate about reading it into the verse are on this page, kept separate.
  - q:
      en: Is "expander" a good translation?
    a:
      en: It is Saheeh International's; the Arabic allows the classical meanings above as well.
