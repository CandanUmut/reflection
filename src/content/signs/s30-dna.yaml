legacyHonestNotes:
  - tr: |
      - "DNA tasarımı kanıtlar" iddiası **[Debated]**. Akıllı tasarım hareketi (ör. Stephen Meyer) biyolojik bilginin bir akla işaret ettiğini savunur. Biyologların çoğu, mutasyon ve doğal seçilim yoluyla evrimin genetik bilginin nasıl arttığını açıkladığını söyler; ABD mahkemeleri de (Kitzmiller - Dover davası, 2005) akıllı tasarımın bilim olmadığına hükmetti.
      - Şuayb Ahmed Malik gibi Müslüman âlimler, Allah'a imanın evrimsel açıklamalardaki boşluklara bağlı olmadığını savunur; Allah doğal süreçler aracılığıyla da iş görebilir.
      - DNA burada bilimsel bir kanıt olarak **değil**, hayrete davet eden bir âyet olarak sunuluyor ve iki tarafa da adilce yer veriliyor.
    en: |-
      - "DNA proves design" is **[Debated]**. The intelligent design movement (e.g., Stephen Meyer) argues that biological information points to a mind. Most biologists reply that evolution by mutation and natural selection explains how genetic information grows, and US courts (Kitzmiller v. Dover, 2005) ruled that intelligent design is not science.
      - Muslim scholars such as Shoaib Ahmed Malik argue that belief in God does not depend on gaps in evolutionary explanations; God can work through natural processes.
      - DNA is presented here as a sign that invites wonder, **not** as a scientific proof, and both sides are given fairly.
    important: true
followUps:
  - q:
      en: Is "guided" a reference to DNA?
      tr: "\"Yolunu gösteren\" DNA'ya bir atıf mı?"
    a:
      en: No classical commentator read it that way. They read it as guidance to food, drink and mates (al-Jalālayn), to pasture and to happiness or misery (Mujahid), or to a measure set in advance (Ibn Kathir). The DNA link is a modern reflection.
      tr: Hiçbir klasik müfessir onu öyle okumadı. Onu yiyeceğe, içeceğe ve eşlere yol gösterme (*Celâleyn*), otlağa ve mutluluğa ya da bedbahtlığa yol gösterme (Mücâhid) ya da önceden konmuş bir ölçüye yöneltme (İbn Kesîr) olarak okudular. DNA bağlantısı modern bir tefekkürdür.
  - q:
      en: What does "each thing its form" mean?
      tr: '"Her şeye şeklini veren" ne demek?'
    a:
      en: "In Ibn ʿAbbas's words (via al-Ḍaḥḥāk), each kind made what it is: \"He made the man a man, and the donkey a donkey and the sheep a sheep.\" In another report from him, it means God created \"a mate for everything.\""
      tr: "İbn Abbâs'ın sözleriyle (Dahhâk yoluyla), her türün olduğu şey yapılması: \"İnsanı insan, eşeği eşek, koyunu koyun yaptı.\" Ondan gelen başka bir rivayette, Allah'ın \"her şey için bir eş\" yaratması demektir."
  - q:
      en: What does "with predestination" in 54:49 mean?
      tr: 54:49'daki "bir kadere göre" ne demek?
    a:
      en: Ibn Kathir reads it as God's decree, against those who denied it, citing "Every thing is predetermined, even laziness and intelligence" (Muslim).
      tr: İbn Kesîr onu, onu inkâr edenlere karşı Allah'ın hükmü olarak okur ve "Her şey, tembellik ve zekâ bile, önceden takdir edilmiştir" sözünü zikreder (Müslim).
  - q:
      en: Does DNA prove God?
      tr: DNA Allah'ı ispat eder mi?
    a:
      en: That is debated. Meyer argues it points to design; critics argue natural processes can produce biological information; some Muslim scholars, such as Shoaib Ahmed Malik, hold that faith does not depend on the answer.
      tr: Bu tartışmalıdır. Meyer onun tasarıma işaret ettiğini savunur; eleştirmenler tabii süreçlerin biyolojik bilgi üretebileceğini savunur; Shoaib Ahmed Malik gibi bazı Müslüman âlimler imanın bu sorunun cevabına bağlı olmadığını savunur.
