title:
  tr: DNA ve hayattaki bilgi
  en: DNA and the information in life
verses:
  - 20:50
  - 87:2-3
  - 54:49
summary:
  tr: Aynı dört harf; bir bakterinin, bir meşe ağacının ve bir insanın talimatlarını yazar.
  en: The same four letters write the instructions for a bacterium, an oak tree and a human being.
verseNotes:
  tr: Bu âyetler DNA hakkında iddia olarak değil, tefekkür için dayanak olarak verilmiştir.
  en: These verses are given as anchors for reflection, not as claims about DNA.
tafsir:
  tr: |
    [Scholarly]

    Müfessirler 20:50'yi ve 87:2–3'ü iki adım olarak okur: Allah her varlığa yaratılışını verir, sonra onu ihtiyaç duyduğu şeye yönlendirir; yeni doğanı annesinin sütüne, arıyı işine yönlendirmesi gibi. Her varlığın fıtratına yerleştirilmiş bir "hidayet" (*hidâye*) gördüler.
  en: "**Form, then guidance.** On \"Our Lord is He who gave each thing its form and then guided [it]\" (20:50), Ibn Kathir quotes Ibn 'Abbas: \"He made the man a man, and the donkey a donkey and the sheep a sheep\", and Mujahid: \"He gave everything its form.\" On \"And who destined and [then] guided\" (87:3), he quotes Mujahid: \"he guided the cattle to their pastures\", and sums up: \"He decreed a set measure and guided the creation to it.\" Commentators read the two verses as two steps — form, then guidance to what each creature needs, such as a newborn to its mother's milk. They saw guidance (*hidaya*) built into every creature's nature."
howItWorks:
  tr: |
    [Established]

    - DNA, bir canlıyı kurmanın ve işletmenin talimatlarını dört kimyasal "harfle" (A, T, C, G) yazılı olarak saklar.
    - İnsan genomunda yaklaşık 3,1 milyar harf çifti vardır. Uzatılırsa, tek bir insan hücresindeki DNA yaklaşık 2 metre uzunluğundadır ve birkaç mikrometre genişliğindeki bir çekirdeğe katlanmıştır.
    - Yaklaşık 20.000 gen protein kodlar; geri kalanın büyük kısmı genlerin ne zaman ve nerede açılacağını düzenlemeye yardım eder.
    - Hücreler DNA'yı, düzeltme ve onarım sistemleri sayesinde çok düşük hata oranlarıyla kopyalar.
  en: |-
    [Established]

    - DNA stores the instructions for building and running a living thing, written in four chemical "letters" (A, T, C, G).
    - The human genome has about 3.1 billion letter-pairs. Stretched out, the DNA in a single human cell is about 2 metres long, folded into a nucleus a few micrometres across.
    - About 20,000 genes code for proteins; much of the rest helps regulate when and where genes are switched on.
    - Cells copy DNA with very low error rates, thanks to proofreading and repair systems.
awe:
  tr: |
    - Yaklaşık 2 metre DNA her hücre çekirdeğine sığar; beden ise trilyonlarca hücreden oluşur.
    - Aynı dört harf; bir bakterinin, bir meşe ağacının ve bir insanın talimatlarını yazar.
  en: |-
    - About 2 metres of DNA fits inside every cell nucleus, and the body has trillions of cells.
    - The same four letters write the instructions for a bacterium, an oak tree and a human being.
reflection:
  tr: |
    "Her şeye yaratılışını verdi, sonra onu yönlendirdi" ifadesi, her varlığın kendi şekli ve davranışı için içinde talimatlar taşıdığı bir dünyaya çarpıcı biçimde uyar. Bir mümin için böyle bir kodun varlığı, ölçünün ve hidayetin bir âyetidir.
  en: '"Gave everything its form, then guided it" fits strikingly well with a world where every creature carries inner instructions for its form and behavior. For a believer, the existence of such a code is a sign of measure and guidance.'
honestNotes:
  - tr: |
      - "DNA tasarımı kanıtlar" iddiası **[Debated]**. Akıllı tasarım hareketi (ör. Stephen Meyer) biyolojik bilginin bir akla işaret ettiğini savunur. Biyologların çoğu, mutasyon ve doğal seçilim yoluyla evrimin genetik bilginin nasıl arttığını açıkladığını söyler; ABD mahkemeleri de (Kitzmiller - Dover davası, 2005) akıllı tasarımın bilim olmadığına hükmetti.
      - Şuayb Ahmed Malik gibi Müslüman âlimler, Allah'a imanın evrimsel açıklamalardaki boşluklara bağlı olmadığını savunur; Allah doğal süreçler aracılığıyla da iş görebilir.
      - DNA burada bilimsel bir kanıt olarak **değil**, hayrete davet eden bir âyet olarak sunuluyor ve iki tarafa da adilce yer veriliyor.
    en: |-
      - "DNA proves design" is **[Debated]**. The intelligent design movement (e.g., Stephen Meyer) argues that biological information points to a mind. Most biologists reply that evolution by mutation and natural selection explains how genetic information grows, and US courts (Kitzmiller v. Dover, 2005) ruled that intelligent design is not science.
      - Muslim scholars such as Shoaib Ahmed Malik argue that belief in God does not depend on gaps in evolutionary explanations; God can work through natural processes.
      - DNA is presented here as a sign that invites wonder, **not** as a scientific proof, and both sides are given fairly.
    important: true
visualizations:
  - id: ideas
    tr: |
      - Bir insandan hücreye, çekirdeğe, kromozoma, DNA çift sarmalına ve A-T-C-G harflerine uzanan bir yakınlaştırma; "her hücrede 2 metre" sayacıyla.
      - Bir "aynı alfabe" kartı: bakteri, ağaç ve insan, hepsi aynı dört harfle yazılmış.
    en: |-
      - A zoom from a person to a cell, to the nucleus, to a chromosome, to the DNA double helix, to the letters A-T-C-G, with a "2 metres in every cell" counter.
      - A "same alphabet" card: bacterium, tree and human, all written in the same four letters.
