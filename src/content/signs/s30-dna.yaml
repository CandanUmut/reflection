followUps:
  - q:
      en: Is "guided" a reference to DNA?
    a:
      en: No classical scholar read it that way. The page describes DNA in "How it works" and treats the link as a reflection, not a prediction.
  - q:
      en: What does "each thing its form" mean?
    a:
      en: "In Ibn 'Abbas's words, each kind made what it is: a man a man, a sheep a sheep."
