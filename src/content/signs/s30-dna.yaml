title:
  tr: DNA ve hayattaki bilgi
  en: DNA and the information in life
verses:
  - 20:50
  - 87:2-3
  - 54:49
summary:
  tr: "20:50, Hz. Mûsâ'nın (a.s.) Firavun'a cevabını verir (\"Bizim Rabbimiz her şeye şeklini veren, sonra da yolunu gösterendir.\"); 87:2–3 ve 54:49 aynı şeyi başka kelimelerle söyler: Allah yarattı, düzene koydu, \"takdir edip hidayeti gösteren\" O'dur ve her şeyi \"bir kadere göre\" yaptı."
  en: "20:50 gives Moses' (pbuh) answer to Pharaoh — \"Our Lord is He who gave each thing its form and then guided [it]\" — and 87:2–3 and 54:49 say the same in other words: God created, proportioned, \"destined and [then] guided\", and made all things \"with predestination\"."
verseNotes:
  tr: |-
    "Musa: "Bizim Rabbimiz her şeye şeklini veren, sonra da yolunu gösterendir." dedi." (20:50), Mekkî, Tâhâ Sûresi'nde: Hz. Mûsâ (a.s.) Firavun'un "Rabbiniz kim?" sorusuna cevap veriyor (soru önceki âyettedir, burada alıntılanmadı).

    "Yaratıp düzene koyan O'dur. Takdir edip hidayeti gösteren O'dur." (87:2–3), Mekkî, A'lâ Sûresi'nde, ilk âyetindeki "Rabbinin yüce adı"nı anlatırken.

    "Haberiniz olsun ki, biz her şeyi bir kadere göre yarattık." (54:49), Mekkî, Kamer Sûresi'nin sonuna doğru.

    - **Anahtar kelimeler.** *Halkahû* (20:50, "şeklini"): yaratılmış tabiatı. *Hedâ* ("yolunu gösteren"). *Kaddera* (87:3, "takdir edip"): ölçüp biçmek, belirlemek. *Bi-kader* (54:49, "bir kadere göre"): ölçüyle, hükümle; 25:2'deki "her şeyi yaratıp bir ölçüye göre düzenleyerek takdir etmiştir" ifadesiyle aynı kök.
    - **Kime hitap ediyorlar?** 20:50, ilahlık iddia eden bir hükümdara verilmiş bir cevaptır. 87 ve 54 Mekke'deki dinleyenlere hitap eder. Hiçbiri hücrelerden ya da moleküllerden söz etmez.
  en: |-
    "He said, 'Our Lord is He who gave each thing its form and then guided [it]'" (20:50), Meccan, in Sura Ṭā Hā: Moses (pbuh) answering Pharaoh's question, "who is your Lord?" (the question is in the verse before, not quoted here).

    "Who created and proportioned. And who destined and [then] guided" (87:2–3), Meccan, in Sura al-Aʿlā, describing "your Lord, the Most High" of its first verse.

    "Indeed, all things We created with predestination" (54:49), Meccan, near the end of Sura al-Qamar.

    - **Key words.** *Khalqahu* (20:50, "its form"): its created nature. *Hadā* ("guided"). *Qaddara* (87:3, "destined"): measured out, determined. *Bi-qadar* (54:49, "with predestination"): with measure, by decree; the same root as 25:2, "determined it with [precise] determination".
    - **Whom they address.** 20:50 is a reply to a ruler who claimed divinity. 87 and 54 address the listeners in Mecca. None of them speaks of cells or molecules.
tafsir:
  tr: |-
    **İbn Kesîr, 20:50 hakkında.** "Her şeye şeklini veren" ifadesinin birkaç erken okumasını verir:
    - İbn Abbâs (Ali b. Ebû Talha yoluyla): "Her şey için bir eş yarattığını söylüyor."
    - İbn Abbâs (Dahhâk yoluyla): "İnsanı insan, eşeği eşek, koyunu koyun yaptı."
    - Mücâhid: "Her şeye şeklini verdi"; ve "Her canlının yaratılışına biçim verdi."
    - Saîd b. Cübeyr: "Yarattıklarının her birine yaratılışına uygun olanı verdi" ve "Her yaratığa uygun bir eş de verdi ve her şeyi o eşe doğru yöneltti."

    ***Celâleyn*, 20:50 hakkında.** Allah her şeye "kendine has tabiatını" verdi ve her hayvana "yiyeceğinin, içeceğinin ve üremesinin kaynağına ve başka yollara" yol gösterdi. *Tenvîrü'l-Mikbâs*: "Her şeye tabiatını verdi" ve "sonra onlara nasıl yiyeceklerini, içeceklerini ve çiftleşeceklerini ilham etti."

    **İbn Kesîr, 87:2–3 hakkında.** "Yaratılmış olanı yarattı ve her yaratılmışı en güzel biçimde şekillendirdi." "Takdir edip hidayeti gösteren" hakkında Mücâhid'den aktarır: "İnsana bedbahtlığı ve mutluluğu, hayvanlara da otlaklarını gösterdi"; âyeti 20:50'ye bağlar ve şöyle açıklar: "Yani belirli bir ölçü takdir etti ve yaratılmışları ona yöneltti." Abdullah b. Amr'dan (r.a.) *Sahîh-i Müslim*'deki hadisi zikreder: "Şüphesiz Allah, gökleri ve yeri yaratmadan elli bin yıl önce bütün yaratılmışların ölçüsünü takdir etti" (Müslim; okunan sayfada numara verilmedi). *Celâleyn* 87:3 hakkında: Allah "dilediğini takdir etti ve takdir ettiği hayra ya da şerre yol gösterdi". *Tenvîr*: "Yarattıkları için mutluluğu ve bedbahtlığı ölçtü".

    **İbn Kesîr, 54:49 hakkında.** Onu ilahî kader (*kader*) hakkında bir âyet olarak okur; "Sahâbe'nin son döneminde fırkalarını başlatan Kaderiyye fırkasını reddetmek için" zikredilir (Kaderiyye, Allah'ın önceden takdirini inkâr ediyordu). "Kureyş müşriklerinin Allah'ın Resûlü'ne geldiği" ve kader hakkında tartıştığı bir rivayeti ve "Her şey, tembellik ve zekâ bile, önceden takdir edilmiştir" sözünü zikreder (Abdullah b. Ömer'den, Müslim'in derlediği; sayfa numara vermez). *Tenvîr*: "Bu âyet kader hakkında tartışanlar hakkında indi."

    **Nerede ayrılıyorlar?** 20:50'deki "şekil" konusunda: her şey için bir eş (Ali b. Ebû Talha yoluyla İbn Abbâs; Saîd b. Cübeyr) ya da her türün olduğu şey yapılması (Dahhâk yoluyla İbn Abbâs; Mücâhid). "Yol göstermek" konusunda: yiyeceğe, içeceğe ve çiftleşmeye yol gösterme (*Celâleyn*; *Tenvîr*), hayvanlar için otlağa, insanlar için mutluluğa ya da bedbahtlığa (Mücâhid) ya da önceden takdir edilmiş bir ölçüye (İbn Kesîr). 54:49 tabiatın oranları hakkında değil, esas olarak Allah'ın hükmü hakkında bir âyet olarak okunur.
  en: |-
    **Ibn Kathir on 20:50.** He gives several early readings of "gave each thing its form":
    - Ibn ʿAbbas (via ʿAlī ibn Abī Ṭalḥa): "He is saying that He created a mate for everything."
    - Ibn ʿAbbas (via al-Ḍaḥḥāk): "He made the man a man, and the donkey a donkey and the sheep a sheep."
    - Mujahid: "He gave everything its form"; and "He fashioned the creation of every moving creature."
    - Saʿīd ibn Jubayr: "He gave each of His creatures what is suitable for its creation", and "He also gave creature a suitable spouse, and He influenced everything towards that mate."

    **Al-Jalālayn on 20:50.** God gave everything "its peculiar nature", and guided each animal "to its source of food drink and procreation and in other ways." *Tanwīr al-Miqbās*: "He gave unto everything its nature", and "then He inspired them how to eat, drink and copulate."

    **Ibn Kathir on 87:2–3.** "He created that which has been created, and He fashioned every creation in the best of forms." On "destined and guided", he cites Mujahid: "He guided man to distress and happiness, and he guided the cattle to their pastures", links the verse to 20:50, and explains: "meaning, He decreed a set measure and guided the creation to it." He cites the hadith in Sahih Muslim from ʿAbdullah ibn ʿAmr (ra): "Verily, Allah ordained the measure of all creation fifty thousand years before He created the heavens and the earth" (Muslim; the number was not given on the page read). Al-Jalālayn on 87:3: God "determined what He wants and guided to what He had determined of good or evil". *Tanwīr*: "He measured felicity and wretchedness for His created beings".

    **Ibn Kathir on 54:49.** He reads it as a verse on divine decree (*qadar*), cited "to refute the Qadariyyah sect, who started their sect during the latter time of the Companions" (the Qadariyya denied God's prior decree). He cites a report that "The idolators of the Quraysh came to the Messenger of Allah" disputing about decree, and the saying "Every thing is predetermined, even laziness and intelligence" (from ʿAbdullah ibn ʿUmar, collected by Muslim; the page gives no number). *Tanwīr*: "This verse was revealed about those who argued about destiny."

    **Where they differ.** On "form" in 20:50: a mate for each thing (Ibn ʿAbbas via ʿAlī ibn Abī Ṭalḥa; Saʿīd ibn Jubayr) or each kind made what it is (Ibn ʿAbbas via al-Ḍaḥḥāk; Mujahid). On "guided": guidance to food, drink and mating (al-Jalālayn; *Tanwīr*), to pasture for animals and to happiness or misery for humans (Mujahid), or to a measure decreed in advance (Ibn Kathir). 54:49 is read mainly as a verse about God's decree, not about nature's proportions.
howItWorks:
  tr: |-
    Her madde "her şeye şeklini veren" ve "takdir edip" (önceden konmuş bir ölçü) ifadelerine bağlanır.
    - **Yazılı bir talimatlar dizisi.** [Established] DNA bir organizmanın kalıtsal talimatlarını dört kimyasal "harfle" taşır. "Tam bir genom talimatları dizisi yaklaşık 3 milyar baz çiftidir" (NHGRI, *Human Genome Project FAQ*).
    - **Bütün metin, nihayet okundu.** [Established] 2022'de Telomerden Telomere Konsorsiyumu, tek bir insan genomunun "eksiksiz 3,055 milyar baz çiftlik dizisini" (T2T-CHM13) yayımladı. "Genomun geri kalan %8'ini" doldurdu ve "yaklaşık 200 milyon baz çifti" ekledi (Nurk ve ark., *Science*).
    - **Beklenenden az gen.** [Established] 2004'te Uluslararası İnsan Genomu Dizileme Konsorsiyumu "19.599 protein kodlayan gen" saydı; manşetteki tahmin "20.000–25.000" idi; öngörülenden çok daha az (News-Medical, *Nature* makalesini aktararak). Genomun geri kalanının büyük kısmı genlerin ne zaman ve nerede kullanılacağını kontrol etmeye yardım eder.
  en: |-
    Each point is tied to "gave each thing its form" and "destined" (a measure set in advance).
    - **A written set of instructions.** [Established] DNA carries an organism's inherited instructions in four chemical "letters". "One complete set of genomic instructions is about 3 billion base pairs" (NHGRI, *Human Genome Project FAQ*).
    - **The full text, finally read.** [Established] In 2022 the Telomere-to-Telomere Consortium published a "complete 3.055 billion-base pair sequence" of one human genome (T2T-CHM13). It filled "the remaining 8% of the genome", adding "nearly 200 million base pairs" (Nurk et al., *Science*).
    - **Fewer genes than expected.** In 2004 the International Human Genome Sequencing Consortium confirmed 19,599 protein-coding genes and estimated 20,000–25,000 in all — far below the "about 100,000" most scientists had expected a decade earlier (NHGRI, 2004, on the consortium's *Nature* paper). Much of the rest of the genome helps control when and where genes are used.
awe:
  tr: |-
    - Yaklaşık 3 milyar harf, insanın talimatlarının bir dizisini oluşturur; eksiksiz, boşluksuz bir okuma ancak 2022'de geldi (NHGRI; Nurk ve ark.).
    - Bir insan yaklaşık 20.000 protein kodlayan genden inşa edilir (2004 sayımı); pek çoklarının beklediğinden az.
  en: |-
    - About 3 billion letters make one set of human instructions; a complete, gap-free reading came only in 2022 (NHGRI; Nurk et al.).
    - A human being is built from around 20,000 protein-coding genes (2004 count) — fewer than many expected.
reflection:
  tr: |-
    Firavun aşağılamak için bir soru sordu: "Rabbiniz kim?" Hz. Mûsâ (a.s.) bir isimle ya da bir unvanla cevap vermedi. Dünyayı gösterdi: "her şeye şeklini veren, sonra da yolunu gösteren".

    Müfessirler bu cümlede iki adım duydu. Önce şekil: insan insan, koyun koyun yapıldı; her yaratığa "yaratılışına uygun olan" verildi. Sonra yol gösterme: Her yaratık yiyeceğini, içeceğini, eşini, sürü de otlağını bulur. A'lâ Sûresi aynı deseni tekrarlar: yarattı, düzene koydu, takdir etti, yol gösterdi.

    Modern bir okuyucu "şekil, sonra yol gösterme" sözünü her canlı hücrenin taşıdığı talimatları düşünmeden duyamaz. Her yaratığın, neye dönüşeceğini ve nasıl davranacağını biçimlendiren bir metin gibi bir şeyi kendi içinde taşıması çarpıcıdır. Bir mümin için bu, âyetin ölçülmüş ve yol gösterilmiş bir dünya resmine uyar. Ama âyet DNA'dan söz etmez ve müfessirler onu öyle okumadı. Bağlantı bizimdir ve âyetin anlamı olarak değil, bir tefekkür olarak sunulmalıdır.

    Âyetin herkese sunduğu şey, Hz. Mûsâ'nın (a.s.) Firavun'a yönelttiği sorudur: Her canlıdan geçen şekli ve yol göstermeyi gördüğünde, arkasında ne olduğunu düşünüyorsun?
  en: |-
    Pharaoh asked a question meant to humiliate: "Who is your Lord?" Moses (pbuh) did not answer with a name or a title. He pointed at the world: the One "who gave each thing its form and then guided [it]."

    The commentators heard two steps in that sentence. First, form: a man made a man, a sheep a sheep, each creature given "what is suitable for its creation". Then guidance: each creature finding its food, its drink, its mate, and the herd its pasture. Al-Aʿlā repeats the pattern: created, proportioned, measured, guided.

    A modern reader cannot hear "form, then guidance" without thinking of the instructions every living cell carries. It is striking that each creature carries, inside itself, something like a text that shapes what it becomes and how it behaves. For a believer this fits the verse's picture of a world measured and guided. But the verse does not mention DNA, and the commentators did not read it so. The link is ours, and it should be offered as a reflection, not as the verse's meaning.

    What the verse offers everyone is the question Moses (pbuh) put to Pharaoh: when you see form and guidance running through every living thing, what do you think lies behind it?
honestNotes:
  - en: "**The popular claim.** It is often said that DNA proves design. The best-known version is Stephen Meyer's *Signature in the Cell* (2009), which argues that \"intelligent design is therefore the best explanation for the emergence of life on this planet\", because chance and chemistry have not been shown able to produce the information in DNA and proteins (*Wikipedia* summary). [Debated]"
    tr: "**Popüler iddia.** Sık sık DNA'nın tasarımı ispat ettiği söylenir. En bilinen versiyonu Stephen Meyer'in *Signature in the Cell*'idir (2009); tesadüfün ve kimyanın DNA'daki ve proteinlerdeki bilgiyi üretebildiği gösterilmediği için \"akıllı tasarımın bu gezegende hayatın ortaya çıkışı için en iyi açıklama olduğunu\" savunur (*Wikipedia* özeti). [Debated]"
  - en: "**The reply.** The chemist Stephen Fletcher replied in the *Times Literary Supplement* (December 2009) that \"natural selection is a chemical as well as a biological process\", so it could act before the first cells (as quoted in Meyer's reply). In the US, a federal district court ruled in *Kitzmiller v. Dover* (20 December 2005, Judge John E. In 2005 a US federal judge, John E. Jones III, ruled that \"ID is not science and cannot be adjudged a valid, accepted scientific theory\" (*Kitzmiller v. Dover*, p. 89). A court ruling settles a question of law, not of science. *Limit:* a court ruling on what may be taught in schools does not settle the philosophical question of whether information points to a mind."
    tr: "**Cevap.** Kimyager Stephen Fletcher (Loughborough) gibi eleştirmenler, tabii seçilimin kendisinin hücreler var olmadan önce işleyen kimyasal bir süreç olduğunu ve RNA araştırmalarının Meyer'in argümanını zayıflattığını savunur (\"gerçeklik Meyer'in kitabını geride bıraktı\"); biyolog Darrel Falk (BioLogos) da argümanı reddetti (*Wikipedia*). ABD'de bir federal bölge mahkemesi *Kitzmiller v. Dover* davasında (20 Aralık 2005, Yargıç John E. Jones III) \"akıllı tasarımın bilim olmadığına\" hükmetti (*Wikipedia*). *Sınır:* Okullarda neyin öğretilebileceğine dair bir mahkeme kararı, bilginin bir akla işaret edip etmediğine dair felsefi soruyu çözmez."
  - en: "**A Muslim alternative.** Shoaib Ahmed Malik argues, using al-Ghazālī's framework, that \"his ideas can be used to reach an alignment between Islam and Neo-Darwinian evolution\" (*Islam and Evolution*, Routledge, 2021, abstract). On this view, belief in God does not depend on gaps in biology."
    tr: "**Müslüman bir alternatif.** Shoaib Ahmed Malik, Gazzâlî'nin çerçevesini kullanarak \"fikirlerinin İslam ile Neo-Darwinci evrim arasında bir uyuma ulaşmak için kullanılabileceğini\" savunur (*Islam and Evolution*, Routledge, 2021, özet). Bu görüşe göre Allah'a iman biyolojideki boşluklara bağlı değildir."
  - en: "**This page's position.** DNA is presented as a sign that invites wonder, not as proof, and not as something the verses predicted."
    tr: "**Bu sayfanın tutumu.** DNA bir ispat olarak ya da âyetlerin önceden bildirdiği bir şey olarak değil, hayranlığa davet eden bir işaret olarak sunulur."
  - en: "Stretched out, the DNA in one human cell is about two metres long, folded into a nucleus about a thousandth of a millimetre across (Salk Institute, 2017). Copying is extremely accurate: in the bacterium *E. coli*, about one error per ten billion letters per copy (Fijalkowska et al., 2012)."
visualizations:
  - id: ideas
    tr: |
      - Bir insandan hücreye, çekirdeğe, kromozoma, DNA çift sarmalına ve A-T-C-G harflerine uzanan bir yakınlaştırma; "her hücrede 2 metre" sayacıyla.
      - Bir "aynı alfabe" kartı: bakteri, ağaç ve insan, hepsi aynı dört harfle yazılmış.
    en: |-
      - A zoom from a person to a cell, to the nucleus, to a chromosome, to the DNA double helix, to the letters A-T-C-G, with a "2 metres in every cell" counter.
      - A "same alphabet" card: bacterium, tree and human, all written in the same four letters.
