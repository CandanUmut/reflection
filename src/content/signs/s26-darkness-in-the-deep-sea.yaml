legacyHonestNotes:
  - tr: |
      - Yaygın bir iddiaya göre âyet "iç dalgaları bildirdi." Âyet açıkça hidayet hakkında bir temsildir ve klasik âlimler "dalga üstüne dalga" ifadesini üst üste binen yüzey dalgaları ve manevî karanlık olarak okudu. İç dalgalar en fazla ilginç bir modern tefekkürdür.
      - Denize açılan ya da dalan insanlar derin suyun karardığını biliyordu; yani derin denizdeki karanlık bilinmeyen bir bilgi değildi.
      - Odak, temsilin anlamındadır.
    en: |-
      - A popular claim says the verse "revealed internal waves". The verse is explicitly a parable about guidance, and classical scholars read the "wave above which is a wave" as stacked surface waves and spiritual darkness. Internal waves are, at most, an interesting modern reflection.
      - People who sailed or dove knew that deep water grows dark, so darkness in the deep sea was not unknown knowledge.
      - The focus stays on the parable's meaning.
    important: true
followUps:
  - q:
      en: Does the verse describe internal waves?
      tr: Âyet iç dalgaları mı anlatıyor?
    a:
      en: The classical commentators read it as a parable of the heart and of deeds, with surface waves, night and cloud. Internal waves are real (some exceed 200 m), but linking them to the verse is a modern reading; see Honest notes.
      tr: Klasik müfessirler onu, yüzey dalgaları, gece ve bulutla birlikte, kalp ve ameller hakkında bir benzetme olarak okudu. İç dalgalar gerçektir (bazıları 200 m'yi aşar), ama onları âyete bağlamak modern bir okumadır; bkz. "Dürüst notlar".
  - q:
      en: Which commentator said what?
      tr: Hangi müfessir ne dedi?
    a:
      en: "Al-Ṭabarī: the darkness is the disbelievers' deeds. Ibn Kathir: the heart of one who follows blindly, with Ubayy's five darknesses. Al-Qurṭubī: cloud, wave, night and sea, and a \"said\" view that the sea is the heart. *Tanwīr*: denial in a sealed heart."
      tr: "Taberî: Karanlık inkâr edenlerin amelleridir. İbn Kesîr: körü körüne uyan birinin kalbi, Übey'in beş karanlığıyla birlikte. Kurtubî: bulut, dalga, gece ve deniz ve denizin kalp olduğuna dair \"denildi ki\" diye aktarılan bir görüş. *Tenvîr*: mühürlenmiş bir kalpteki inkâr."
  - q:
      en: Is it God's fault if someone is in darkness?
      tr: Biri karanlıktaysa bu Allah'ın kusuru mu?
    a:
      en: "The verse says light is God's gift. The commentators' response is to ask for it: Ibn Kathir closes with a prayer for light. The Quran also promises guidance to those who strive (29:69). The deeper question of predestination is on the Ask page \"If everything is written, how am I free?\"."
      tr: "Âyet nurun Allah'ın armağanı olduğunu söyler. Müfessirlerin cevabı onu istemektir: İbn Kesîr nur için bir duayla bitirir. Kur'an ayrıca gayret edenlere hidayet vaat eder (29:69). Kaderle ilgili daha derin soru \"Her şey yazılmışsa, nasıl özgürüm?\" Soru sayfasındadır."
  - q:
      en: How deep does light reach?
      tr: Işık ne kadar derine ulaşır?
    a:
      en: In clear open ocean, useful light reaches about 200 m and the last faint light about 1,000 m (NOAA); in murky water the lit layer can be as shallow as 15 m (*Wikipedia*).
      tr: Berrak açık okyanusta işe yarar ışık yaklaşık 200 m'ye, son zayıf ışık yaklaşık 1.000 m'ye ulaşır (NOAA); bulanık suda aydınlık katman 15 m kadar sığ olabilir (*Wikipedia*).
  - q:
      en: Is it completely dark down there?
      tr: Aşağısı tamamen karanlık mı?
    a:
      en: "Without sunlight, yes, below about 1,000 m. But many animals make their own light: 76% of those seen in a long survey off California (Martini & Haddock, 2017)."
      tr: "Güneş ışığı olmadan, evet, yaklaşık 1.000 m'nin altında. Ama pek çok hayvan kendi ışığını yapar: Kaliforniya açığındaki uzun bir araştırmada görülenlerin %76'sı (Martini ve Haddock, 2017)."
