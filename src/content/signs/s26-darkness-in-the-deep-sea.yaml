summary:
  tr: "24:40 okyanusun bir tarifi değil, bir benzetmedir: İnkâr edenlerin amelleri \"engin bir denizdeki yoğun karanlıklar gibidir\", katman katman; o kadar karanlık ki insan kendi elini \"nerdeyse … dahi göremez\"; ve âyet noktasıyla biter: Nur Allah'ın armağanıdır."
  en: "24:40 is a parable, not a description of the ocean: the deeds of those who reject faith are \"like darknesses within an unfathomable sea\", layer on layer, so dark that a man \"can hardly see\" his own hand — and the verse ends with its point, that light is God's gift."
verseNotes:
  tr: |-
    "Yahut (o kâfirlerin duygu, düşünce ve davranışları) engin bir denizdeki yoğun karanlıklar gibidir ki, onu dalga üstüne dalga kaplıyor; üstünde de bulut. Bir biri üstüne karanlıklar... İnsan, elini çıkarıp uzatsa, nerdeyse onu dahi göremez. Bir kimseye Allah, nur vermemişse, artık o kimsenin ışık ve aydınlıktan nasibi yoktur." (24:40), Medenî, Nûr ("Işık") Sûresi'nde.

    - **Bağlam.** 24:40 iki benzetmenin ikincisidir. Birincisi (24:39; kullanılan doğrulanmış veride olmadığı için burada alıntılanmadı) serap benzetmesidir; *Celâleyn*'in 24:40 hakkındaki açıklamasının açıkça gösterdiği gibi ikisi de inkâr edenleri anlatır. İkisi de Nur Âyeti'nin (24:35) hemen ardından gelir: "Allah, göklerin ve yerin nurudur (aydınlatıcısıdır). O'nun nurunun temsili, içinde lamba bulunan bir kandil gibidir. … Allah dilediği kimseyi nuruyla hidayete iletir." (24:35). Sûre, içeriden aydınlanmış mümin kalbini katman katman karanlığa gömülmüş bir kalbin karşısına koyar.
    - **Kimi anlatıyor?** "Yahut … gibidir" ifadesinin öznesi 24:39'dan devam eder: inkâr edenler ya da amelleri (Taberî; *Celâleyn*). Denizcilere hitap etmez.
    - **Anahtar kelimeler.** *Bahrun lüccî* ("engin bir deniz"): *lücce*den, derin, geniş su kütlesi; Kurtubî onu "dibine ulaşılamayan deniz" olarak açıklar (aşağıda). *Mevcün min fevkıhî mevc* ("dalga üstüne dalga"). *Zulümâtün ba'duhâ fevka ba'd* ("bir biri üstüne karanlıklar"). *Lem yekad yerâhâ* ("nerdeyse onu dahi göremez"): Arapça *lem yekad* "zar zor" ya da "neredeyse hiç" demektir.
  en: |-
    "Or [they are] like darknesses within an unfathomable sea which is covered by waves, upon which are waves, over which are clouds - darknesses, some of them upon others. When one puts out his hand [therein], he can hardly see it. And he to whom Allah has not granted light - for him there is no light" (24:40), Medinan, in Sura al-Nūr ("The Light").

    - **Setting.** 24:40 is the second of two parables. The first (24:39, not quoted here because it was not in the verified data used) is the parable of the mirage; both describe those who reject faith, as al-Jalālayn's gloss on 24:40 makes explicit. Both come right after the Light Verse (24:35): "Allah is the Light of the heavens and the earth. The example of His light is like a niche within which is a lamp … Allah guides to His light whom He wills" (24:35). The sura sets the believer's heart, lit from within, against a heart sunk in layered dark.
    - **Whom it describes.** The subject of "Or [they are]" carries over from 24:39: those who reject faith, or their deeds (al-Ṭabarī; al-Jalālayn). It is not addressed to sailors.
    - **Key words.** *Baḥr lujjī* ("an unfathomable sea"): from *lujja*, the deep, vast body of water; al-Qurṭubī explains it as "the sea whose bottom cannot be reached" (below). *Mawj min fawqihi mawj* ("waves, upon which are waves"). *Ẓulumāt baʿḍuhā fawqa baʿḍ* ("darknesses, some of them upon others"). *Lam yakad yarāhā* ("he can hardly see it"): Arabic *lam yakad* means "barely" or "all but not".
tafsir:
  tr: |-
    **Taberî** (ö. 923, Bağdat; ilk nesillerin rivayetlerini toplayan büyük erken dönem müfessiri). Ona göre karanlık, inkâr edenlerin yaptıklarını temsil eder: "ومثل أعمال هؤلاء الكفار" ("bu kâfirlerin amellerinin misali"); "فجعل الظلمات مثلا لأعمالهم" ("karanlıkları onların amellerine misal yaptı"). Son satır hakkında, nuru olmayan kişi "من لم يرزقه الله إيمانا وهدى من الضلالة"dır ("Allah'ın kendisine iman ve sapıklıktan kurtaracak hidayet nasip etmediği kişi").

    **İbn Kesîr** (ö. 1373, Şam; tefsiri Kur'an'ı Kur'an, hadis ve erken rivayetlerle açıklar). Kısaltılmış İngilizce metinde: "Bu, cehaleti basit olan kâfirin kalbinin benzetmesidir"; "sadece uyan ve uyduğu kişinin gerçek mahiyetini bilmeyen" biri. El "karanlık çok yoğun olduğu için" görünmez. Son satır hakkında: "Allah'ın hidayet etmediği kişi cahildir ve helake mahkûmdur". Arapça metinde Sahâbî Übey b. Kâ'b'dan (r.a.) böyle bir kişinin "يتقلب في خمسة من الظلم" ("beş karanlık içinde dolaştığını") aktarır: sözü, ameli, girişi, çıkışı ve Ateş'teki sonu. Allah'ın "يجعل في قلوبنا نورا، وعن أيماننا نورا، وعن شمائلنا نورا" ("kalplerimize nur, sağımıza nur ve solumuza nur koyması") için bir duayla bitirir.

    **Kurtubî** (ö. 1273, Kurtuba ve Mısır; tefsiri önceki görüşleri toplayan Mâlikî bir fakih). Ona "kâfirler için başka bir misal" der ("ضرب تعالى مثلا آخر للكفار"). Önce fiziksel katmanları verir: "ظلمة السحاب، وظلمة الموج، وظلمة الليل، وظلمة البحر" ("bulutun karanlığı, dalganın, gecenin ve denizin karanlığı"); sonra aktarılan bir okuma: "وقيل : أراد بالظلمات أعمال الكافر ، وبالبحر اللجي قلبه" ("Denildi ki: Karanlıklarla kâfirin amellerini, engin denizle de onun kalbini kastetti"). Übey'in beş karanlığını da aktarır. Son satır hakkında İbn Abbâs'tan aktarır: "من لم يجعل الله له دينا فما له من دين" ("Allah'ın kendisine din vermediği kişinin dini yoktur"); ve âhiretle ilgili ikinci bir okuma: O "لم يهتد إلى الجنة" ("Cennet'e yol bulamaz").

    ***Celâleyn*** (15. yüzyıl Mısır; kısa, yaygın olarak okutulan bir tefsir): "İnkâr edenlerin kötü amelleri derin bir denizdeki kat kat karanlık gibidir"; "Allah'ın hidayet etmediği kişi hidayete eremez."

    ***Tenvîrü'l-Mikbâs*** (İbn Abbâs'a nispet edilen bir tefsir): "Kâfirin kalbindeki inkârın misali, çok derin bir denizin derinliğindeki karanlık gibidir", "çünkü Allah kâfirlerin kalplerini, kulaklarını ve gözlerini mühürledi." "Nur"u ilim olarak okur: "Âhirette onun hiçbir ilmi yoktur."

    **Nur Âyeti (24:35) hakkında.** İbn Kesîr, İbn Abbâs'tan buradaki "Nur"un "göklerin ve yerin sakinlerinin Hâdî'si (yol göstericisi) demek olduğunu", Übey b. Kâ'b'dan da kandilin ve lambanın "müminin kalbinin misali" olduğunu aktarır: "Lamba nurdur ve bu, Kur'an'a ve kalbindeki imana işaret eder." "Allah dilediği kimseyi nuruyla hidayete iletir" hakkında İbn Kesîr: "Allah seçtiklerine yolu gösterir" demektir. *Celâleyn*: "Allah dilediğini Nuruna, yani İslam dinine hidayet eder."

    **Nerede ayrılıyorlar?** Âyetin iman etmeyenler hakkında bir benzetme olduğunda birleşirler. Karanlığın neyi temsil ettiğinde ayrılırlar: onların *amelleri* (Taberî; *Celâleyn*), körü körüne uyan birinin *kalbi* (İbn Kesîr) ya da kalpte mühürlenmiş *inkâr* (*Tenvîr*); Kurtubî önce fiziksel katmanları, ameller-ve-kalp okumasını da "denildi ki" diye bir görüş olarak aktarır. Son satırda "nur"; iman ve hidayet (Taberî; İbn Kesîr), din (İbn Abbâs, Kurtubî yoluyla), âhirette Cennet (Kurtubî'nin ikinci okuması) ya da ilimdir (*Tenvîr*). Hiçbiri dalgaları denizin içindeki gizli katmanlar olarak okumaz.
  en: |-
    **Al-Ṭabarī** (d. 923, Baghdad; the great early commentator who collected the reports of the first generations). For him the darkness stands for what the disbelievers do: "ومثل أعمال هؤلاء الكفار" ("the likeness of the deeds of these disbelievers"); "فجعل الظلمات مثلا لأعمالهم" ("He made the darknesses a likeness for their deeds"). On the last line, the one with no light is "من لم يرزقه الله إيمانا وهدى من الضلالة" ("whoever God does not grant faith, and guidance out of misguidance").

    **Ibn Kathir** (d. 1373, Damascus; his commentary explains the Quran by the Quran, hadith and early reports). In the abridged English: "This is the parable of the heart of the disbeliever whose ignorance is simple", one "who merely follows and does not know the true nature of the one whom he follows". The hand is unseen "because it is so intensely dark." On the last line: "One whom Allah does not guide is ignorant and doomed". In the Arabic text he reports the Companion Ubayy ibn Kaʿb (ra) that such a person "يتقلب في خمسة من الظلم" ("moves about within five darknesses"): his speech, his deeds, his coming in, his going out, and his end in the Fire. He closes with a prayer that God "يجعل في قلوبنا نورا، وعن أيماننا نورا، وعن شمائلنا نورا" ("place light in our hearts, light on our right and light on our left").

    **Al-Qurṭubī** (d. 1273, Córdoba and Egypt; a Maliki jurist whose commentary gathers earlier views). He calls it "another parable for the disbelievers" ("ضرب تعالى مثلا آخر للكفار"). He gives the physical layers first — "ظلمة السحاب، وظلمة الموج، وظلمة الليل، وظلمة البحر" ("the darkness of the clouds, of the waves, of the night and of the sea") — then a reported reading: "وقيل : أراد بالظلمات أعمال الكافر ، وبالبحر اللجي قلبه" ("it was said: by the darknesses He meant the disbeliever's deeds, and by the deep sea his heart"). He also reports Ubayy's five darknesses. On the last line he cites Ibn ʿAbbas: "من لم يجعل الله له دينا فما له من دين" ("whoever God does not grant religion has no religion"), and a second reading about the next world: he "لم يهتد إلى الجنة" ("will not be guided to Paradise").

    **Al-Jalālayn** (15th-century Egypt; a short, widely taught commentary): "those who disbelieve their evil deeds are as the manifold darkness on a deep sea"; "he whom God does not guide cannot be guided."

    **Tanwīr al-Miqbās** (a commentary attributed to Ibn ʿAbbas): "the similitude of denial in the heart of the disbeliever is like darkness in the depth of a very deep sea", "because Allah sealed the disbelievers hearts and hearings and sights." It reads "light" as knowledge: "he has no knowledge in the Hereafter".

    **On the Light Verse (24:35).** Ibn Kathir reports Ibn ʿAbbas that "Light" here "means, the Guide of the inhabitants of the heavens and the earth", and Ubayy ibn Kaʿb that the niche and lamp are "the likeness of the heart of the believer": "The lamp is the light, and this refers to the Qur'an and the faith that is in his heart." On "Allah guides to His light whom He wills", Ibn Kathir: it "means, Allah shows the way to the ones whom He chooses". Al-Jalālayn: "God guides to His Light that is to the religion of Islam whom He will."

    **Where they differ.** They agree that the verse is a parable about those without faith. They differ on what the darkness stands for: their *deeds* (al-Ṭabarī; al-Jalālayn), the *heart* of one who follows blindly (Ibn Kathir), or *denial* sealed in the heart (*Tanwīr*); al-Qurṭubī reports the physical layers first and the deeds-and-heart reading as a "said" view. On the last line, "light" is faith and guidance (al-Ṭabarī; Ibn Kathir), religion (Ibn ʿAbbas via al-Qurṭubī), Paradise in the next world (al-Qurṭubī's second reading), or knowledge (*Tanwīr*). None of them reads the waves as hidden layers inside the sea.
howItWorks:
  tr: |-
    Her madde âyetin resmine bağlanır: "engin bir denizdeki yoğun karanlıklar… nerdeyse onu dahi göremez".
    - **Güneş ışığının bittiği yer.** [Established] NOAA: "200 metrenin (656 fit) ötesinde nadiren kayda değer ışık vardır". 200 ile 1.000 m arası "genellikle 'alacakaranlık' bölgesi olarak anılır" (loş ışık); güneş ışığı olmayan afotik bölge "1.000 metrenin altındaki derinliklerde bulunur". LibreTexts, ışığın "okyanusta yaklaşık 1.000 metrede algılanabildiğini" ekler.
    - **Renkler birer birer gider.** [Established] Deniz suyu önce kırmızı, en son mavi ışığı soğurur: "Mavi ışık en iyi nüfuz eder", sonra yeşil, sarı, en son da turuncu ve kırmızı; "100 metrede kırmızı ışık nüfuz etmez"; bu yüzden kırmızı bir derin deniz balığı "o derinlikte yansıtacak kırmızı ışık olmadığı için siyahımsı görünür" (NOAA Ocean Exploration).
    - **Suyun ne kadar berrak olduğuna bağlıdır.** [Established] Aydınlık katman (öfotik bölge), "radyasyonun yüzeydeki gücünün %1'ine indiği" derinlik olarak tanımlanır. "Tipik öfotik derinlikler, çok bulanık ötrofik göllerdeki birkaç santimetreden açık okyanustaki 200 metre civarına kadar değişir"; bulanık suda "yalnızca elli fit (on beş metre) derinliğinde olabilir" (*Wikipedia*, "Photic zone"). Dolayısıyla 200 m ve 1.000 m rakamları berrak açık okyanus içindir; çamurlu ya da planktonca zengin suda karanlık çok daha erken gelir.
    - **Karanlıkta yapılan ışık.** Pek çok deniz hayvanı kendi ışığını yapar (biyolüminesans). Kaliforniya kıyıları açığında uzaktan kumandalı araçlarla 17 yılda çekilen videolarda, yüzeyden "3.900 m derinliğe kadar" "350.000'den fazla gözlemle", Martini ve Haddock "gözlenen bireylerin %76'sının biyolüminesans yeteneği olduğunu" buldu (*Scientific Reports*, 2017). [Orta]: tek bir bölge ve kameraların gördüğü hayvanlar; küresel bir sayım değil.
    - **Denizin içindeki dalgalar.** [Established] Farklı yoğunluktaki katmanların buluştuğu yerde (daha soğuk ya da daha tuzlu suyun üstünde daha ılık ya da daha tatlı su), dalgalar yüzeyin altındaki sınır boyunca ilerleyebilir. Güney Çin Denizi'nde bu iç dalgalar "200 metre yüksekliği aşabilir" (Alford ve ark., *Nature*, 2015, *Physics Today* yoluyla). İlk olarak "ölü su" yoluyla fark edildiler: 1893'te Fridtjof Nansen'in gemisi "gizemli bir kuvvetle yavaşladı" ve 1904'te Vagn Walfrid Ekman bu sürüklenmeyi "tuzlu su ve tatlı su katmanları arasındaki ara yüzde, yüzeyin altında oluşan dalgalara" bağladı (CNRS, 2020).
  en: |-
    Each point is tied to the verse's picture: "darknesses within an unfathomable sea … he can hardly see it".
    - **Where sunlight ends.** [Established] NOAA: "there is rarely any significant light beyond 200 meters (656 feet)". From 200 to 1,000 m "is usually referred to as the 'twilight' zone" (dim light); the aphotic zone, with no sunlight, "exists in depths below 1,000 meters". LibreTexts adds that light "can be detected about 1,000 meters in the ocean".
    - **Colours go one by one.** [Established] Seawater absorbs red light first and blue last: "Blue light penetrates best", then green, yellow, and orange and red last; "At 100 meters, red light does not penetrate", which is why a red deep-sea fish "appears blackish because there is no red light to reflect at that depth" (NOAA Ocean Exploration).
    - **It depends on how clear the water is.** [Established] The lit layer (the euphotic zone) is defined as the depth "where radiation is degraded down to 1% of its surface strength". "Typical euphotic depths vary from only a few centimetres in highly turbid eutrophic lakes, to around 200 meters in the open ocean"; in murky water it "can be only fifty feet (fifteen meters) deep" (*Wikipedia*, "Photic zone"). So the 200 m and 1,000 m figures are for clear open ocean; in muddy or plankton-rich water, darkness comes much sooner.
    - **Light made in the dark.** Many sea animals make their own light (bioluminescence). In 17 years of video from remotely operated vehicles off the California coast, with "More than 350,000 observations" from the surface "down to 3,900 m depth", Martini and Haddock found that "76% of the observed individuals have bioluminescence capability" (*Scientific Reports*, 2017). [Moderate] — one region and the animals the cameras saw, not a global census.
    - **Waves inside the sea.** [Established] Where layers of different density meet (warmer or fresher water over colder or saltier water), waves can travel along the boundary below the surface. In the South China Sea such internal waves "can top 200 meters in height" (Alford et al., *Nature*, 2015, via *Physics Today*). They were first noticed through "dead water": in 1893 Fridtjof Nansen's ship "was slowed by a mysterious force", and in 1904 Vagn Walfrid Ekman linked the drag to "waves formed under the surface at the interface between the salt water and freshwater layers" (CNRS, 2020).
awe:
  tr: |-
    - Yaklaşık 1.000 m'nin altına hiç güneş ışığı ulaşmaz (NOAA); yine de uzun bir araştırmada görülen her dört hayvandan yaklaşık üçü kendi ışığını yapabiliyordu (Martini ve Haddock).
    - Kırmızı, denizin ilk aldığı renktir; 100 m'de yok olur ve kırmızı bir balık siyah görünür (NOAA).
    - Berrak okyanusta aydınlık katman yaklaşık 200 m'ye ulaşabilir; bulanık suda 15 m kadar az olabilir (*Wikipedia*).
  en: |-
    - In 17 years of video surveys off California, from the surface to 3,900 m, 76% of the animals seen could make light, and the share was about the same at every depth (Martini & Haddock, *Scientific Reports*, 2017).
    - Red is the first colour the sea takes away; by 100 m it is gone, and a red fish looks black (NOAA).
    - In clear ocean the lit layer can reach about 200 m; in murky water, as little as 15 m (*Wikipedia*).
reflection:
  tr: |-
    Âyet hiç ışık kalmamış bir yeri gözümüzde canlandırmamızı ister: yukarıda gece, gecenin üstünde bulutlar, dalga üstüne dalga ve onların altında derinlik. Sahip olduğun en yakın şeyi, kendi elini uzatırsın ve onu neredeyse göremezsin.

    Müfessirler bunu deniz hakkında bir ders olarak okumadı. Bir hayatın resmi olarak okudular. Taberî imansız yapılmış amelleri gördü; İbn Kesîr neye uyduğunu bilmeden uyan bir kalbi gördü; Übey b. Kâ'b, bir kişinin sözlerinden son akıbetine kadar beş karanlık saydı.

    Âyet karanlıkta durmaz. Son satırı nur hakkındadır: "Bir kimseye Allah, nur vermemişse, artık o kimsenin ışık ve aydınlıktan nasibi yoktur." Nûr Sûresi nurun nereden geldiğini zaten söylemişti: "Allah, göklerin ve yerin nurudur (aydınlatıcısıdır)." (24:35). Nur verilir ve bu umutsuzluk için bir sebep değildir. Kimden isteyeceğimizi söyler. İbn Kesîr yorumunu tam da bununla bitirir: kalpte, sağda ve solda nur için bir dua. Kur'an ayrıca vaat eder: "Ama bizim yolumuzda cihad edenleri, elbette kendi yollarımıza eriştireceğiz." (29:69).

    Bilim sessiz bir resim ekler. Hiç güneş ışığının ulaşmadığı yerde bile, derinlikte süzülen yaratıkların çoğu kendi ışığını taşır. Tefekkür (âyetin değil, bizim tefekkürümüz) şudur: Hiçbir karanlık, Allah'ın içine bir nur koyamayacağı kadar derin değildir.
  en: |-
    The verse asks us to picture a place with no light left: night above, clouds over the night, waves over waves, and under them the deep. You stretch out your own hand, the nearest thing you have, and you can hardly see it.

    The commentators did not read this as a lesson about the sea. They read it as a picture of a life. Al-Ṭabarī saw deeds done without faith; Ibn Kathir saw a heart that follows without knowing what it follows; Ubayy ibn Kaʿb named five darknesses, from a person's words to his final end.

    The verse does not stop in the dark. Its last line is about light: "he to whom Allah has not granted light - for him there is no light." Sura al-Nūr has already said where light comes from: "Allah is the Light of the heavens and the earth" (24:35). Light is given, and that is not a reason for despair. It tells us whom to ask. Ibn Kathir ends his comment with exactly that: a prayer for light in the heart, on the right and on the left. The Quran also promises: "And those who strive for Us - We will surely guide them to Our ways" (29:69).

    Science adds one quiet image. Even where no sunlight reaches, most of the creatures that drift through the deep carry a light of their own. The reflection — ours, not the verse's — is that no darkness is so deep that God cannot place a light in it.
honestNotes:
  - en: '**The popular claim.** A widely shared article says the verse describes deep-sea darkness and internal waves: "Scientists have recently discovered this darkness", and, quoting an oceanography textbook (Gross), "Internal waves cannot be seen by the human eye" (IslamReligion, article 217). The argument is that no one in the 7th century could have known about darkness below about 200 m or about waves inside the sea.'
    tr: "**Popüler iddia.** Yaygın olarak paylaşılan bir makale âyetin derin deniz karanlığını ve iç dalgaları anlattığını söyler: \"Bilim insanları bu karanlığı yakın zamanda keşfetti\" ve bir oşinografi ders kitabından (Gross) aktararak, \"İç dalgalar insan gözüyle görülemez\" (IslamReligion, makale 217). Argüman, 7. yüzyılda hiç kimsenin yaklaşık 200 m'nin altındaki karanlığı ya da denizin içindeki dalgaları bilemeyeceğidir."
  - en: "**Weighing it.** (1) The verse is a parable, introduced by \"Or [they are] like\", in a passage about disbelievers' deeds; every commentator read here takes it that way. (2) None of them reads \"waves, upon which are waves\" as waves *inside* the sea. Al-Qurṭubī's layers are cloud, wave, night and sea — a storm at night, seen from above. (3) That deep water grows dark is something divers and sailors can notice; a critic makes this point (WikiIslam). (4) \"Scientists have recently discovered this darkness\" is not accurate: what modern science added is measurement — the depths, the colours, the role of clarity — not the bare fact that the deep is dark. (5) Internal waves fit the words \"waves, upon which are waves\" only on a modern reading the classical commentators did not give. It can be offered as a reflection, labelled as one, never as a prediction."
    tr: "**Değerlendirme.** (1) Âyet, inkâr edenlerin amelleri hakkındaki bir pasajda, \"Yahut … gibidir\" diye başlayan bir benzetmedir; burada okunan her müfessir onu böyle alır. (2) Hiçbiri \"dalga üstüne dalga\"yı denizin *içindeki* dalgalar olarak okumaz. Kurtubî'nin katmanları bulut, dalga, gece ve denizdir: yukarıdan görülen bir gece fırtınası. (3) Derin suyun karardığı dalgıçların ve denizcilerin fark edebileceği bir şeydir; bir eleştirmen bu noktayı belirtir (WikiIslam). (4) \"Bilim insanları bu karanlığı yakın zamanda keşfetti\" doğru değildir: Modern bilimin eklediği şey ölçümdür (derinlikler, renkler, berraklığın rolü), derinliğin karanlık olduğu çıplak gerçeği değil. (5) İç dalgalar \"dalga üstüne dalga\" sözlerine ancak klasik müfessirlerin vermediği modern bir okumayla uyar. Bir tefekkür olarak, öyle işaretlenerek sunulabilir; asla bir kehanet olarak değil."
  - en: "**Fatalism.** The last line can sound as if God withholds light and then blames people for being in the dark. The commentators read here do not draw that conclusion. They read \"light\" as faith and guidance, and they answer by asking for it (Ibn Kathir's prayer). The wider question of God's will and human choice is on the Ask page \"If everything is written, how am I free?\"; this page does not settle it."
    tr: "**Kadercilik.** Son satır, sanki Allah nuru esirgiyor ve sonra insanları karanlıkta oldukları için suçluyormuş gibi gelebilir. Burada okunan müfessirler bu sonucu çıkarmaz. \"Nur\"u iman ve hidayet olarak okurlar ve ona onu isteyerek cevap verirler (İbn Kesîr'in duası). Allah'ın iradesi ve insanın seçimi hakkındaki daha geniş soru \"Her şey yazılmışsa, nasıl özgürüm?\" Soru sayfasındadır; bu sayfa onu çözmez."
  - en: "**Numbers.** The 200 m and 1,000 m figures are for clear open ocean. The 76% figure comes from one region off California."
    tr: "**Rakamlar.** 200 m ve 1.000 m rakamları berrak açık okyanus içindir. %76 rakamı Kaliforniya açığındaki tek bir bölgeden gelir."
visualizations:
  - id: ideas
    tr: |
      - Bir "iniş" kaydırması: kullanıcı okyanusta aşağı inerken renkler sırayla kaybolur (önce kırmızı, sonra yeşil, sonra mavi), 1.000 m'de tam karanlığa kadar. Bir el belirir ve gözden kaybolur.
      - Fiziksel katmanları temsilin manevî katmanlarına eşleyen bir karanlık katmanları kartı.
    en: |-
      - A "descent" scroll: the user scrolls down through the ocean while colors drop out (red first, then green, then blue) until total darkness at 1,000 m. A hand appears and fades from view.
      - A layered-darkness card mapping the physical layers to the parable's spiritual layers.
  - id: ocean
    tr: Derine iniş — ışık nerede biter?
    en: The descent — where does the light end?
    labels:
      tr:
        depth: Derinlik
        surface: Yüzeye yakın. Kırmızı ışık çoğunlukla ilk birkaç metrede emilir.
        sunlight: Işıklı bölge (yaklaşık 200 m'ye kadar). Mavi en derine iner.
        twilight: Alacakaranlık bölgesi (yaklaşık 1.000 m'ye kadar). Yalnızca loş ışık.
        dark: "Yaklaşık 1.000 m'nin altında hiç güneş ışığı yok. Âyetteki temsil: \"İnsan, elini çıkarıp uzatsa, nerdeyse onu dahi göremez.\" (24:40)"
      en:
        depth: Depth
        surface: Near the surface. Red light is mostly absorbed in the top few metres.
        sunlight: The sunlight zone (to about 200 m). Blue goes deepest.
        twilight: The twilight zone (to about 1,000 m). Only dim light.
        dark: "Below about 1,000 m there is no sunlight at all. The verse's parable: \"When one puts out his hand [therein], he can hardly see it.\" (24:40)"
    textVersion:
      tr: |
        - Güneş ışığı deniz suyunda hızla söner. Kırmızı ışık çoğunlukla ilk birkaç metrede emilir; mavi ışık en derine iner.
        - Işıklı bölge yaklaşık 200 m'ye kadar uzanır. Onun altında alacakaranlık bölgesi yaklaşık 1.000 m'ye kadar iner. Yaklaşık 1.000 m'nin altında hiç güneş ışığı yoktur.
        - Renklerin kayboluşu bu üç bilgiye göre şematik olarak çizilmiştir; ölçülmüş bir renk eğrisi değildir.
        - Âyet bir temsildir: hidayetten yoksun olanın iç hâli. Çizim onun fiziksel resmini gösterir, anlamını değil.
      en: |
        - Sunlight fades quickly in seawater. Red light is mostly absorbed in the top few metres; blue light goes deepest.
        - The sunlight zone reaches about 200 m. Below that, the twilight zone reaches about 1,000 m. Below about 1,000 m there is no sunlight at all.
        - The colour fade is drawn schematically from these three facts; it is not a measured colour curve.
        - The verse is a parable about the inner state of one without guidance. The drawing shows its physical picture, not its meaning.
