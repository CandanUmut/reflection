followUps:
  - q:
      en: Does the verse describe internal waves in the ocean?
    a:
      en: The commentators read it as a parable of the heart; the modern claim and its limits are in the honest notes.
  - q:
      en: Why two parables (24:39–40)?
    a:
      en: 'Both describe the one without guidance: the mirage, then the darkness. Ibn Kathir reads the darkness as the heart that "merely follows" without knowing.'
