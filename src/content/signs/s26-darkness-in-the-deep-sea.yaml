        - Sunlight fades quickly in seawater. Red light is mostly absorbed in the top few metres; blue light goes deepest.
        - The sunlight zone reaches about 200 m. Below that, the twilight zone reaches about 1,000 m. Below about 1,000 m there is no sunlight at all.
        - The colour fade is drawn schematically from these three facts; it is not a measured colour curve.
        - The verse is a parable about the inner state of one without guidance. The drawing shows its physical picture, not its meaning.
