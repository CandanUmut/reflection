order: 26
theme: seas
title:
  tr: Derin denizde karanlık
  en: Darkness in the deep sea
verses:
  - 24:40
seeAlso:
  - 24:39
summary:
  tr: Bir temsil. Üst üste binen karanlıklar ve son cümle, ışığın bir ikram olduğunu söyler.
  en: A parable. Darkness stacked on darkness, and a last line saying that light is a gift.
verseNotes:
  tr: "*Lüccî*: derin, engin deniz."
  en: "*Lujjī*: a deep, vast sea."
tafsir:
  tr: |
    [Scholarly]

    - Bu âyet bir **temsildir**. Seraba dair temsilin (24:39) ardından gelir ve hidayetten yoksun olanın iç hâlini anlatır.
    - Müfessirler (Taberî, İbn Kesîr, Kurtubî) karanlık katmanlarını kalbin katmanlarına eşler: inancın, sözlerin, amellerin karanlığı, biri ötekinin üstünde.
    - *Lüccî* derin, engin bir deniz demektir.
  en: "**A parable of the heart.** The verse is a parable; it follows the parable of the mirage (24:39). Ibn Kathir: \"This is the parable of the heart of the disbeliever whose ignorance is simple, who merely follows and does not know the true nature of the one whom he follows or where he is going.\" Al-Tabari, Ibn Kathir and al-Qurtubi map the layers of darkness onto layers of the heart: darkness of belief, of words, of deeds, one on top of another. \"He can hardly see it\" means, in Ibn Kathir's words, \"because it is so intensely dark.\" *Lujji* means a deep, vast sea."
howItWorks:
  tr: |
    [Established]

    - Güneş ışığı deniz suyunda hızla söner. Kırmızı ışık çoğunlukla ilk birkaç metrede emilir; mavi ışık en derine iner.
    - **Işıklı bölge** yaklaşık 200 m'ye kadar uzanır. Onun altında, yalnızca loş ışığın olduğu **alacakaranlık bölgesi** yaklaşık 1.000 m'ye kadar iner. Yaklaşık 1.000 m'nin altında hiç güneş ışığı yoktur.
    - **İç dalgalar**, yüzeyin çok altında, yoğunlukları farklı su katmanları arasındaki sınırlar boyunca ilerler. Bazıları onlarca metreden 100 m'nin üzerine kadar yüksektir, ama yukarıdan görünmezler.
    - İç dalgalar ilk kez 1900'lerin başında bilimsel olarak incelendi (Nansen ve Ekman'ın tarif ettiği "ölü su" etkisi).
  en: |-
    [Established]

    - Sunlight fades quickly in seawater. Red light is mostly absorbed in the top few metres; blue light goes deepest.
    - The **sunlight zone** reaches about 200 m. Below that, the **twilight zone** reaches about 1,000 m with only dim light. Below about 1,000 m there is no sunlight at all.
    - **Internal waves** travel along boundaries between water layers of different density, deep below the surface. Some are tens of metres to over 100 m high, yet invisible from above.
    - Internal waves were first studied scientifically in the early 1900s (the "dead water" effect described by Nansen and Ekman).
awe:
  tr: |
    - Okyanusun hacimce büyük kısmı tam bir karanlık içindedir.
    - Denizin içinde, görünen yüzey dalgalarının altında, denizcilerin göremediği dev dalgalar hareket eder.
  en: |-
    - Most of the ocean, by volume, lies in total darkness.
    - Huge waves move inside the sea, under the visible surface waves, unseen by sailors.
reflection:
  tr: |
    Temsil, ışıksız bir ruhu anlatmak için üst üste binmiş karanlıkların fiziksel bir resmini kullanır. Anahtar son cümledir: ışık bir ikramdır ve "Allah kime nur vermemişse, onun hiç nuru yoktur."
  en: 'The parable uses a physical picture of stacked darkness to describe a soul without light. Its last line is the key: light is a gift, and "whoever God gives no light has no light".'
honestNotes:
  - tr: |
      - Yaygın bir iddiaya göre âyet "iç dalgaları bildirdi." Âyet açıkça hidayet hakkında bir temsildir ve klasik âlimler "dalga üstüne dalga" ifadesini üst üste binen yüzey dalgaları ve manevî karanlık olarak okudu. İç dalgalar en fazla ilginç bir modern tefekkürdür.
      - Denize açılan ya da dalan insanlar derin suyun karardığını biliyordu; yani derin denizdeki karanlık bilinmeyen bir bilgi değildi.
      - Odak, temsilin anlamındadır.
    en: |-
      - A popular claim says the verse "revealed internal waves". The verse is explicitly a parable about guidance, and classical scholars read the "wave above which is a wave" as stacked surface waves and spiritual darkness. Internal waves are, at most, an interesting modern reflection.
      - People who sailed or dove knew that deep water grows dark, so darkness in the deep sea was not unknown knowledge.
      - The focus stays on the parable's meaning.
    important: true
visualizations:
  - id: ideas
    tr: |
      - Bir "iniş" kaydırması: kullanıcı okyanusta aşağı inerken renkler sırayla kaybolur (önce kırmızı, sonra yeşil, sonra mavi), 1.000 m'de tam karanlığa kadar. Bir el belirir ve gözden kaybolur.
      - Fiziksel katmanları temsilin manevî katmanlarına eşleyen bir karanlık katmanları kartı.
    en: |-
      - A "descent" scroll: the user scrolls down through the ocean while colors drop out (red first, then green, then blue) until total darkness at 1,000 m. A hand appears and fades from view.
      - A layered-darkness card mapping the physical layers to the parable's spiritual layers.
  - id: ocean
    tr: Derine iniş — ışık nerede biter?
    en: The descent — where does the light end?
