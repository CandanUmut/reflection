id: S33
slugs:
  tr: renklerin-cesitliligi
  en: diversity-of-colors
order: 33
theme: diversity
title:
  tr: Doğada renklerin çeşitliliği
  en: The diversity of colors in nature
verses:
  - 35:27-28
seeAlso:
  - 16:13
  - 30:22
summary:
  tr: "35:27–28 rengi renk ardına sayar (meyveler, beyaz ve kırmızı dağ yolları, \"kapkara\" topraklar, insanlar ve hayvanlar) ve sonra ilimle biter: \"Kulları içinde Allah'tan ancak âlimler korkar.\""
  en: '35:27–28 lists colour after colour — fruits, white and red mountain tracts, "extremely black" rock, people and animals — and then ends with knowledge: "Only those fear Allah, from among His servants, who have knowledge."'
verseNotes:
  tr: |-
    "Görmedin mi Allah gökten bir su indirdi. Biz onunla renkleri başka başka meyveler çıkardık. Dağlarda da yollar, beyazlı kırmızılı çeşitli renklerde ve kapkara topraklar var. Yine insanlardan, hayvanlardan ve davarlardan da türlü renklileri vardır. Kulları içinde Allah'tan ancak âlimler korkar. Şüphe yok ki Allah çok güçlüdür. Hüküm ve hikmet sahibidir." (35:27–28), Mekkî, Fâtır ("Yaratan") Sûresi'nde.

    - **Anahtar kelimeler.** *Muhtelifen elvânuhâ* ("renkleri başka başka"); meyveler, dağlar ve canlılar için tekrarlanır. *Cüded* ("yollar"): çizgiler ya da patikalar. *Garâbîbu sûd* ("kapkara"). *Yahşâ* ("korkar"): saygı dolu huşu (*haşyet*). *El-ulemâ* ("âlimler", ilim sahipleri).
    - **Kime hitap ediyor?** "Görmedin mi": bakmaya davet edilen dinleyici. Âyet renkler listesini doğrudan ilim hakkındaki cümleye bağlar.
  en: |-
    "Do you not see that Allah sends down rain from the sky, and We produce thereby fruits of varying colors? And in the mountains are tracts, white and red of varying shades and [some] extremely black. And among people and moving creatures and grazing livestock are various colors similarly. Only those fear Allah, from among His servants, who have knowledge. Indeed, Allah is Exalted in Might and Forgiving" (35:27–28), Meccan, in Sura Fāṭir ("The Originator").

    - **Key words.** *Mukhtalifan alwānuhā* ("of varying colors"), repeated for fruits, mountains and living things. *Judad* ("tracts"): streaks or paths. *Gharābību sūd* ("extremely black"). *Yakhshā* ("fear"): reverent awe (*khashya*). *Al-ʿulamāʾ* ("those … who have knowledge").
    - **Whom it addresses.** "Do you not see" — the listener, invited to look. The verse ties the list of colours directly to the sentence on knowledge.
tafsir:
  tr: |-
    **İbn Kesîr, 35:27 hakkında.** "Sudan çeşitli renklerde meyveler çıkarır: sarı, kırmızı, yeşil, beyaz ve başka renkler"; "Dağları da böyle, farklı renklerde yarattı; gerçekten beyaz ve kırmızı dağlar olduğunu da görüyoruz" ve "bazılarında yine çeşitli renklerde çizgiler vardır." "İbn Abbâs *el-cüded*in yollar demek olduğunu söyledi." İkrime: "*El-garâbîb*, yüksek ve kara dağlar demektir." İnsanlar ve hayvanlar hakkında: "Aynısı canlılar, insanlar ve hayvanlar için de geçerlidir" ve "hayvanlar ve davarlar, aynı tür içinde bile renk bakımından farklılık gösterir". Kendi dünyasından insan rengi örnekleri verir: "Çok kara olan Berberiler, Habeşler ve bazı Arap olmayanlar", "çok beyaz olan Slavlar ve Rumlar, arada olan Araplar ve Hintliler."

    **İbn Kesîr, 35:28 hakkında.** "O'ndan, O'ndan korkulması gerektiği gibi gerçekten ancak ilim sahipleri korkar; çünkü en mükemmel sıfatlara sahip olan ve en güzel isimlerle nitelenen Azîz, Kadîr, Alîm hakkında ne kadar çok bilirlerse, … O'ndan o kadar çok korkarlar." İbn Abbâs (Ali b. Ebû Talha yoluyla): Onlar "Allah'ın her şeye gücü yettiğini bilenlerdir" ve "Kulları arasında Rahmân'ı bilen, O'na ibadette hiçbir şeyi ortak koşmayandır". Saîd b. Cübeyr: "Korku, seninle Allah'a isyan etmek arasında duran şeydir; O ne yücedir." Hasan-ı Basrî: "Âlim, Rahmân'dan gaybda korkan kişidir".

    ***Celâleyn*, 35:27 hakkında.** "*Garâbîbu sûd* … yani simsiyah kayalar". *Tenvîrü'l-Mikbâs*: "Karalıkları çok yoğun olan kara dağlar".

    **Nerede ayrılıyorlar?** *Cüded* konusunda: yollar (İbn Abbâs) ya da çizgiler (İbn Kesîr'in kendi ifadesi; *Tenvîr*). 35:28'deki "ilim" konusunda: Allah'ın kudretinin ve sıfatlarının bilgisi (İbn Kesîr; İbn Abbâs); itaatte (Saîd b. Cübeyr) ve gaybda Allah korkusunda (Hasan) görünen bir bilgi. Hiçbiri buradaki "ilmi" tabiat bilimi olarak okumaz; bu modern bir genişletmedir.
  en: |-
    **Ibn Kathir on 35:27.** "From water He brings forth fruits of various colors, yellow, red, green, white and other colors"; "He created the mountains like this, with different colors, as we also see that there are indeed white and red mountains", and "in some of them there are streaks which are also of varying colors." "Ibn 'Abbas said Al-Judad means pathways." ʿIkrima: "Al-Gharabib means mountains which are high and black." On people and animals: "the same is true of living creatures too, humans and animals", and "animals and cattle vary in their colors, even within one species". He gives examples of human colour from his own world — "Berbers, Ethiopians and some non-Arabs who are very black", "and Slavs and Romans who are very white, and the Arabs who are in between, and the Indians."

    **Ibn Kathir on 35:28.** "Only those who have knowledge truly fear Him as He should be feared, because the more they know about the Almighty, All-Powerful, All-Knowing Who has the most perfect attributes and is described with the most beautiful Names, … the more they will fear Him." Ibn ʿAbbas (via ʿAlī ibn Abī Ṭalḥa): they are "those who know that Allah is able to do all things", and "The one among His servants who knows about Ar-Rahman, is the one who does not associate anything in worship with Him". Saʿīd ibn Jubayr: "Fear is what stands between you and disobeying Allah, may He be glorified." Al-Hasan al-Basri: "The knowledgeable person is the one who fears Ar-Rahman with regard to the Unseen".

    **Al-Jalālayn on 35:27.** "gharābību sūd … meaning dark-black rocks". *Tanwīr al-Miqbās*: "black mountains, very intense in their blackness".

    **Where they differ.** On *judad*: pathways (Ibn ʿAbbas) or streaks (Ibn Kathir's own wording; *Tanwīr*). On "knowledge" in 35:28: knowledge of God's power and attributes (Ibn Kathir; Ibn ʿAbbas), shown in obedience (Saʿīd ibn Jubayr) and in fear of God unseen (al-Hasan). None of them reads "knowledge" here as natural science; that is a modern extension.
howItWorks:
  tr: |-
    Her madde "renkleri başka başka" ifadesine bağlanır.
    - **Pigmentsiz renk.** [Established] Morpho kelebeğinin kanatları "hiç mavi pigment içermez; nano ölçekte ışığın fiziğinden yararlanır". Bu "yapısal renk"tir: "ışığı yansıtan ve büken nano boyutta incelikli şekillerle renk üretimi"; pullardaki sırtlar "temel bir bileşendir" (KQED, UC Berkeley'deki Patel laboratuvarından aktararak). Her pul tek bir hücredir; yaklaşık 50 mikron eninde ve 200–250 mikron boyundadır.
    - **Mavi, pigment olarak nadirdir.** [Established] "Mavi, pigment olarak yapılan en nadir renklerden biridir"; "çoğu hayvan mavi pigment üretemez" (Ryan Null, UC Berkeley, KQED'de).
    - **Boşlukları değiştir, renk değişsin.** [Established] Bir Morpho'nun pul sırtları arasındaki boşlukları hava yerine metanol doldurduğunda, hesaplanan yansıma tepesi 452 nm'den 545 nm'ye, maviden yeşile doğru kayar; çünkü boşlukların kırılma indisi değişir (Kuntzleman, ChemEd X, 2019). Renk bir boyada değil, şekildedir.
    - **İnsan deri rengi.** [Established] Topluluklar arasında "deri yansıtıcılığı mutlak enlem ve UV radyasyonu düzeyleriyle güçlü biçimde ilişkilidir". Jablonski ve Chaplin, koyu derinin "folatın UV'nin yol açtığı fotolizine karşı koruduğunu", daha açık derinin ise tropiklerden uzakta "UVB'nin yol açtığı provitamin D(3) sentezine izin vermek için" evrimleştiğini savunur: iki ihtiyaç arasında "bir uzlaşma çözümü" (*Journal of Human Evolution*, 2000, özet).
  en: |-
    Each point is tied to "of varying colors".
    - **Colour without pigment.** [Established] Morpho butterfly wings "contain no blue pigment — they harness the physics of light at the nanoscale". This is "structural color": "the production of color by nano-sized elaborate shapes that reflect and bend light"; ridges on the scales are "a key component" (KQED, quoting the Patel lab, UC Berkeley). Each scale is a single cell, about 50 microns across and 200–250 microns long.
    - **Blue is rare as a pigment.** [Established] "Blue is one the rarest colors made as a pigment"; "Most animals can't produce blue pigments" (Ryan Null, UC Berkeley, in KQED).
    - **Change the gaps, change the colour.** [Established] When methanol fills the gaps between a Morpho's scale ridges instead of air, the calculated reflected peak shifts from 452 nm to 545 nm — from blue towards green — because the refractive index of the gaps changes (Kuntzleman, ChemEd X, 2019). The colour is in the shape, not in a dye.
    - **Human skin colour.** [Established] Across populations, "skin reflectance is strongly correlated with absolute latitude and UV radiation levels". Jablonski and Chaplin argue that dark skin "protected against UV-induced photolysis of folate", while lighter skin evolved away from the tropics "to permit UVB-induced synthesis of previtamin D(3)" — "a compromise solution" between the two needs (*Journal of Human Evolution*, 2000, abstract).
awe:
  tr: |-
    - Morpho'nun mavisi yalnızca şekille yapılır; şekli hava yerine alkolle doldurun, mavi yeşilimsi olur (KQED; Kuntzleman).
    - Çoğu hayvan hiç mavi pigment yapamaz (KQED).
    - İnsan deri rengi güneş ışığını yakından izler: folatı korumakla D vitamini yapmak arasında bir denge (Jablonski ve Chaplin).
  en: |-
    - The Morpho's blue is made by shape alone; fill the shape with alcohol instead of air and the blue turns greenish (KQED; Kuntzleman).
    - Most animals cannot make blue pigment at all (KQED).
    - Human skin colour follows sunlight closely: darker skin protects folate from ultraviolet light, lighter skin lets enough UV-B in to make vitamin D, and each population's colour is "a compromise" between the two (Jablonski & Chaplin, *Journal of Human Evolution*, 2000).
reflection:
  tr: |-
    35:27 basit bir soru sorar: "Görmedin mi?" Sonra bize dünyayı bir ressamın paleti gibi gösterir. Tek bir yağmur yağar; meyveler sarı, kırmızı, yeşil ve beyaz çıkar. Dağlarda beyaz ve kırmızı yollar uzanır ve bazıları "kapkara"dır. İnsanlar ve hayvanlar da "türlü renklileri" ile gelir.

    İbn Kesîr bu listeyi kendi dünyasının gözüyle okudu ve Habeşistan'dan Slavlara kadar halkları adlandırdı. Âyetin noktası, insan renginin meyvelerle ve tepelerle aynı listede durmasıdır: insanların bir sıralaması değil, Yaratıcının bir işareti.

    Sonra âyet renkten bakana döner: "Kulları içinde Allah'tan ancak âlimler korkar." İbn Kesîr ve İbn Abbâs için bu, Allah'ın bilgisidir: Kişi O'nu ne kadar çok bilirse, "O'ndan o kadar çok korkar." Modern bir okuyucu bunu genişletebilir ve bunun bir genişletme olduğunu söylemelidir: Rengin nasıl işlediğini öğrenmek (yalnızca şekille yapılmış bir kelebek mavisi, güneş ışığına ayarlanmış bir deri tonu) aynı huşuyu derinleştirebilir. Tehlike tersidir: çok şey bilip hiçbir şey görmemek. Âyet saygıya götüren bir ilim ister.
  en: |-
    35:27 asks a simple question: "Do you not see?" Then it shows us the world as a painter's palette. One rain falls; fruits come out yellow, red, green and white. Mountains run in white and red tracts, and some are "extremely black". People and animals, too, come in "various colors similarly".

    Ibn Kathir read this list through the eyes of his own world, naming peoples from Ethiopia to the Slavs. The verse's point is that human colour sits in the same list as the fruits and the hills: a sign of the Creator, not a ranking of people.

    Then the verse turns from colour to the one who looks: "Only those fear Allah, from among His servants, who have knowledge." For Ibn Kathir and Ibn ʿAbbas, this is knowledge of God: the more one knows of Him, "the more they will fear Him." A modern reader may extend it, and should say it is an extension: learning how colour works — a butterfly blue made only by shape, a skin tone tuned to sunlight — can deepen the same awe. The danger is the reverse: knowing a lot and seeing nothing. The verse asks for knowledge that leads to reverence.
honestNotes:
  - en: '**No popular "miracle" claim** about these verses was found in the sources read. The science here is a way to deepen appreciation, not a fulfilled prediction; the verse celebrates variety and does not describe pigments or structural colour.'
    tr: '**Okunan kaynaklarda bu âyetler hakkında popüler bir "mucize" iddiası bulunamadı.** Buradaki bilim, takdiri derinleştirmenin bir yoludur, gerçekleşmiş bir kehanet değil; âyet çeşitliliği kutlar, pigmentleri ya da yapısal rengi anlatmaz.'
  - en: '**"Those who have knowledge."** Classically, this means those who know God (Ibn Kathir; Ibn ʿAbbas). Reading it as scientists is a modern extension, and should be labelled as one.'
    tr: "**\"Âlimler\".** Klasik olarak bu, Allah'ı bilenler demektir (İbn Kesîr; İbn Abbâs). Onu bilim insanları olarak okumak modern bir genişletmedir ve öyle işaretlenmelidir."
  - en: "**Human colour.** Ibn Kathir's examples reflect the peoples known in 14th-century Damascus. The verse itself names no group and ranks no colour. The site should present this verse as a sign of variety, never as a basis for judging people by colour."
    tr: "**İnsan rengi.** İbn Kesîr'in örnekleri 14. yüzyıl Şam'ında bilinen halkları yansıtır. Âyetin kendisi hiçbir grubu adlandırmaz ve hiçbir rengi sıralamaz. Site bu âyeti, insanları renklerine göre yargılamanın bir dayanağı olarak değil, her zaman bir çeşitlilik işareti olarak sunmalıdır."
  - en: "**Not read:** al-Rāzī on 35:27–28; a source on mineral colours in mountains; a source on peacock feathers."
    tr: "**Okunmadı:** Râzî'nin 35:27–28 tefsiri; dağlardaki mineral renkleri hakkında bir kaynak; tavus kuşu tüyleri hakkında bir kaynak."
visualizations:
  - id: ideas
    tr: |
      - Bir "doğada renk" gezgini: bir yaprağa, bir havuca, bir kelebek kanadına, kırmızı bir dağa ya da tene dokunun ve renginin pigmentten mi, yapıdan mı, minerallerden mi geldiğini görün.
      - Yapı bozulunca mavinin kaybolduğu bir "kanadı öğüt" gösterimi.
    en: |-
      - A "color in nature" explorer: tap a leaf, a carrot, a butterfly wing, a red mountain or skin to see whether its color comes from pigment, structure or minerals.
      - A "grind the wing" demo where the blue vanishes when the structure is destroyed.
