order: 33
theme: diversity
title:
  tr: Doğada renklerin çeşitliliği
  en: The diversity of colors in nature
verses:
  - 35:27-28
seeAlso:
  - 16:13
  - 30:22
summary:
  tr: Rengin nasıl oluştuğunu öğrendikçe hayret için daha çok sebep bulunur.
  en: The more one learns about how color arises, the more reason there is for awe.
verseNotes:
  tr: "*Cüded*: dağlardaki farklı renkli yollar, damarlar. Âyet bilgiyi *haşyet* (derin saygı) ile birleştirerek biter."
  en: "*Judad*: streaks or paths of different colors on mountains. The verse ends by linking knowledge with reverence (*khashya*)."
tafsir:
  tr: |
    [Scholarly]

    - *Cüded*, dağlardaki farklı renklerde çizgiler ya da yollardır.
    - Müfessirler tek bir sudan ve tek bir topraktan doğan çeşitliliği vurgular.
    - Râzî ve diğerleri, âyetin bu çeşitliliği bilgiye bağlayarak bittiğini not eder: "bilgi sahibi olanlar", âyetleri gören ve onlara saygıyla (*haşyet*) karşılık verenlerdir.
  en: "**Colours, and those who know.** On 35:27, Ibn Kathir describes fruits \"of various colors, yellow, red, green, white\", and mountains: \"white and red mountains, and in some of them there are streaks which are also of varying colors\". *Judad* are streaks or paths: \"Ibn 'Abbas said Al-Judad means pathways.\" Commentators stress the variety arising from one water and one earth. The verse ends: \"Only those fear Allah, from among His servants, who have knowledge\" (35:28). Ibn Kathir explains: \"the more they know about the Almighty… the more they will fear Him.\" Al-Razi and others link this variety to knowledge: those who know see the signs and respond with reverence (*khashya*)."
howItWorks:
  tr: |
    [Established]

    - Doğadaki renkler iki ana kaynaktan gelir:
      1. **Pigmentler** ışığın bazı dalga boylarını emer, bazılarını yansıtır. Klorofil (yeşil), karotenoidler (turuncu, sarı), antosiyaninler (kırmızı, mor) ve melanin (kahverengi, siyah).
      2. **Yapısal renk**, ışığı büken ve yansıtan mikroskobik desenlerden gelir. Morpho kelebeğinin mavisi ve tavus kuşu tüyünün parıltısı mavi pigmentten değil, nano yapılardan gelir.
    - Dağların renkleri minerallerden gelir: demir oksitler kırmızı ve sarıları, kuvars ve kireçtaşı beyazları verir.
    - İnsan ten rengi esas olarak melaninden gelir ve insanların yaşadığı yerdeki UV ışığının miktarına göre zaman içinde değişti.
  en: |-
    [Established]

    - Colors in nature come from two main sources:
      1. **Pigments** absorb some wavelengths of light and reflect others. Chlorophyll (green), carotenoids (orange, yellow), anthocyanins (red, purple) and melanin (brown, black).
      2. **Structural color** comes from microscopic patterns that bend and reflect light. The blue of the Morpho butterfly and the shimmer of a peacock's feather come from nanostructures, not blue pigment.
    - Mountain colors come from minerals: iron oxides give reds and yellows, while quartz and limestone give whites.
    - Human skin color comes mainly from melanin, and has changed over time with the amount of UV light where people lived.
awe:
  tr: |
    - Gerçek mavi pigment doğada nadirdir. Mavi hayvanların çoğu boya yüzünden değil, yapı yüzünden mavidir.
    - Bir Morpho kelebeğinin kanadını öğütün, mavi kaybolur; çünkü renk maddede değil, şekilde yaşar.
  en: |-
    - True blue pigment is rare in nature. Most blue animals are blue because of structure, not dye.
    - Grind up a Morpho butterfly's wing and the blue disappears, because the color lives in the shape, not the substance.
reflection:
  tr: |
    Âyet meyvelerden dağlara, insanlara ve hayvanlara, oradan da bilgiye geçer. Rengin nasıl oluştuğunu öğrendikçe hayret için daha çok sebep bulunur. Bu, saygıya giden bir yol olarak bilime doğrudan bir davettir.
  en: The verse moves from fruits, to mountains, to people and animals, then to knowledge. The more one learns about how color arises, the more reason there is for awe. It is a direct invitation to science as a path to reverence.
honestNotes:
  - tr: |
      Âyet çeşitliliği kutlar; pigmentleri ya da yapısal rengi anlatmaz. Bilim, gerçekleşmiş bir öngörü değil, âyetin davet ettiği şeyi daha derinden takdir etmenin bir yoludur.
    en: The verse celebrates variety; it does not describe pigments or structural color. The science is a way to deepen appreciation of what the verse invites, not a fulfilled prediction.
visualizations:
  - id: ideas
    tr: |
      - Bir "doğada renk" gezgini: bir yaprağa, bir havuca, bir kelebek kanadına, kırmızı bir dağa ya da tene dokunun ve renginin pigmentten mi, yapıdan mı, minerallerden mi geldiğini görün.
      - Yapı bozulunca mavinin kaybolduğu bir "kanadı öğüt" gösterimi.
    en: |-
      - A "color in nature" explorer: tap a leaf, a carrot, a butterfly wing, a red mountain or skin to see whether its color comes from pigment, structure or minerals.
      - A "grind the wing" demo where the blue vanishes when the structure is destroyed.
