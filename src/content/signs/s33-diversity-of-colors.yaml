followUps:
  - q:
      en: Who are "those who have knowledge"?
    a:
      en: Classically, those who know God; many today read it to include anyone whose study of nature leads to reverence.
  - q:
      en: Why mention colours of people and animals?
    a:
      en: '35:28 continues the list: "among people and moving creatures and grazing livestock are various colors similarly" — variety as a sign.'
