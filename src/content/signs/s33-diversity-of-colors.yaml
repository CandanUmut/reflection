legacyHonestNotes:
  - tr: |
      Âyet çeşitliliği kutlar; pigmentleri ya da yapısal rengi anlatmaz. Bilim, gerçekleşmiş bir öngörü değil, âyetin davet ettiği şeyi daha derinden takdir etmenin bir yoludur.
    en: The verse celebrates variety; it does not describe pigments or structural color. The science is a way to deepen appreciation of what the verse invites, not a fulfilled prediction.
followUps:
  - q:
      en: Who are "those who have knowledge"?
      tr: '"Âlimler" kimlerdir?'
    a:
      en: 'Classically, those who know God: "those who know that Allah is able to do all things" (Ibn ʿAbbas, via Ibn Kathir). Many today extend it to anyone whose study of nature leads to reverence; that is a modern reading.'
      tr: "Klasik olarak Allah'ı bilenler: \"Allah'ın her şeye gücü yettiğini bilenler\" (İbn Abbâs, İbn Kesîr yoluyla). Bugün pek çokları onu, tabiat üzerine çalışması saygıya götüren herkese genişletiyor; bu modern bir okumadır."
  - q:
      en: Why mention the colours of people and animals?
      tr: İnsanların ve hayvanların renkleri neden anılıyor?
    a:
      en: 'The verse puts them in the same list as fruits and mountains, as a sign. Ibn Kathir: "the same is true of living creatures too, humans and animals".'
      tr: 'Âyet onları meyvelerle ve dağlarla aynı listeye bir işaret olarak koyar. İbn Kesîr: "Aynısı canlılar, insanlar ve hayvanlar için de geçerlidir".'
  - q:
      en: What are the "tracts" in the mountains?
      tr: Dağlardaki "yollar" nedir?
    a:
      en: '*Judad*: "pathways" (Ibn ʿAbbas) or streaks (Ibn Kathir; *Tanwīr*); the "extremely black" are high black mountains (ʿIkrima) or dark-black rocks (al-Jalālayn).'
      tr: '*Cüded*: "yollar" (İbn Abbâs) ya da çizgiler (İbn Kesîr; *Tenvîr*); "kapkara" olanlar yüksek kara dağlar (İkrime) ya da simsiyah kayalardır (*Celâleyn*).'
  - q:
      en: Why is a Morpho butterfly blue?
      tr: Morpho kelebeği neden mavidir?
    a:
      en: Not because of pigment. Tiny ridged structures on its scales reflect and bend light (KQED); fill them with methanol and the colour shifts towards green (Kuntzleman).
      tr: Pigment yüzünden değil. Pullarındaki minik sırtlı yapılar ışığı yansıtır ve büker (KQED); onları metanolle doldurun, renk yeşile doğru kayar (Kuntzleman).
