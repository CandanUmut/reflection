legacyHonestNotes:
  - tr: |
      - Âyet, herkesin gökyüzünde izleyebileceği şeyi anlatır. Âyetin "kümülonimbus su döngüsünü önceden bildirdiği" söylenemez.
      - 500 tonluk rakam, tipik 1 km³'lük bir kümülüs için yapılmış bir tahmindir. Gerçek bulutlar çok farklılık gösterir.
      - "Aşılayan rüzgârlar", klasik âlimler tarafından hem bulutlar hem tozlaşma açısından anlaşıldı; yani bu okuma eskidir, modern bir ekleme değildir.
    en: |-
      - The verse describes what anyone can watch in the sky. It did not "predict the cumulonimbus water cycle".
      - The 500-tonne figure is an estimate for a typical 1 km³ cumulus. Real clouds vary a lot.
      - "Winds fertilizing" was understood by classical scholars both in terms of clouds and in terms of pollination, so this reading is old, not a modern addition.
followUps:
  - q:
      en: What are the "mountains… within which is hail"?
    a:
      en: al-Tabari gives two readings — mountains of hail created in the sky, or hail falling in mountain-like amounts — and al-Qurtubi adds al-Farraʾ's view that the mountains are the hail itself. "[Of clouds]" is the translator's addition.
  - q:
      en: How does hail form?
    a:
      en: Updrafts carry raindrops into very cold air where they freeze; they grow as they are lifted again and again, until they fall (NOAA NSSL).
  - q:
      en: How much water is in a cloud?
    a:
      en: About 500 tonnes in a 1 km³ cumulus cloud, by USGS's example.
  - q:
      en: What are "fertilizing winds" (15:22)?
    a:
      en: Ibn Kathir explains them as winds that pollinate as well as winds that bring rain clouds.
  - q:
      en: Why does the verse say hail strikes "whom He wills"?
    a:
      en: Because the same sky that brings rain can bring ruin; the verse places both in God's hand.
