title:
  tr: Korunmuş tavan
  en: The protected roof
verses:
  - 21:32
  - 2:22
seeAlso:
  - 15:16-18
summary:
  tr: Nadiren fark ettiğimiz koruma katmanlarının altında yaşıyoruz. Koruma o kadar süreklidir ki onu unuturuz.
  en: We live under layers of protection we rarely notice. The protection is so constant that we forget it.
verseNotes:
  tr: "21:32: *ve cealne's-semâe sakfen mahfûzâ*, \"göğü korunmuş bir tavan yaptık\". 2:22'de gök bir *binâ* (bina, kubbe) olarak anılır; 15:16–18 göğün kayan yıldızlarla korunmasından söz eder."
  en: '21:32: *wa jaʿalnā al-samāʾa saqfan maḥfūẓā*, "We made the sky a protected roof". In 2:22 the sky is a canopy (*bināʾ*); 15:16–18 speaks of the sky guarded by shooting stars.'
tafsir:
  tr: |
    [Scholarly]

    - Müfessirler "korunmuş" kelimesini, yeryüzüne düşmekten korunmuş (22:65) ve göklere kulak veren şeytanlardan korunmuş (15:17–18, 37:6–10) olarak okur.
    - Vurgu Allah'ın inayeti ve düzenidir: bizim için inşa edilmiş ve korunan bir tavan.
  en: "**High and guarded.** On \"a protected ceiling\" (21:32), Ibn Kathir explains: \"high and protected from anything reaching it\"; Mujahid said \"Raised up.\" Other commentators read \"protected\" as protected from falling onto the earth (22:65), and from devils listening to the heavens (15:17–18, 37:6–10). On \"but they, from its signs, are turning away\", Ibn Kathir says: \"They do not think about how Allah has created it, so vast and high\", adorned with the sun, moon and stars. The emphasis is God's care and order: a roof built and kept for us."
howItWorks:
  tr: |
    [Established]

    - **Atmosfer** soluyacak hava verir, Dünya'yı sıvı suya yetecek kadar sıcak tutar ve gelen göktaşı parçacıklarının çoğunu "kayan yıldız" olarak yakar. Her gün tonlarca uzay tozu ve kayası atmosfere düşer; neredeyse hepsi yanıp gider.
    - Stratosferdeki **ozon tabakası** zararlı morötesi ışığın çoğunu emer (UV-C'nin tamamını ve UV-B'nin çoğunu).
    - Dünya'nın manyetik alanı olan **manyetosfer**, Güneş'ten gelen yüklü parçacık akımı olan güneş rüzgârının çoğunu saptırır. Kutuplara yakın yerlerde bazı parçacıklar içeri sızar; orada kutup ışıklarını (aurora) görürüz.
    - Manyetik alanı olmayan bir gezegen atmosferini yavaş yavaş kaybedebilir. Mars'ın başına muhtemelen bu geldi.
  en: |-
    [Established]

    - The **atmosphere** gives air to breathe, keeps Earth warm enough for liquid water, and burns up most incoming meteoroids as "shooting stars". Many tonnes of space dust and rock fall into it every day; almost all of it burns up.
    - The **ozone layer** in the stratosphere absorbs most harmful ultraviolet light (all UV-C and most UV-B).
    - The **magnetosphere**, Earth's magnetic field, deflects most of the solar wind, a stream of charged particles from the Sun. Where some particles get through near the poles, we see the aurora.
    - Without a magnetic field, a planet can slowly lose its atmosphere. This likely happened to Mars.
awe:
  tr: |
    - Her açık gecenin "kayan yıldızları", tepemizde onlarca kilometre yukarıda yanan uzay enkazıdır.
    - Kutup ışıkları, başka türlü göremeyeceğimiz bir kalkanın görünür delilidir.
    - Manyetik alanının çoğunu kaybetmiş olan Mars'ın atmosferi bugün Dünya'nınkinin yaklaşık %1'i kadar yoğundur.
  en: |-
    - Every clear night's "shooting stars" are space debris burning up high above us, tens of kilometres up.
    - The aurora is visible evidence of a shield we cannot otherwise see.
    - Mars, which lost most of its magnetic field, now has an atmosphere about 1% as thick as Earth's.
reflection:
  tr: |
    Nadiren fark ettiğimiz koruma katmanlarının altında yaşıyoruz: hava, ozon, manyetik bir kalkan. Âyet yumuşak bir sitemle biter: "Onlar ise göğün âyetlerinden yüz çevirirler." Koruma o kadar süreklidir ki onu unuturuz.
  en: 'We live under layers of protection we rarely notice: air, ozone, a magnetic shield. The verse ends with a gentle rebuke: "yet they turn away from its signs". The protection is so constant that we forget it.'
honestNotes:
  - tr: |
      - Âyet korunmuş bir tavandan söz eder; klasik âlimler korumayı esas olarak göğün tutulması ve şeytanlardan korunması olarak anladı. Ozon ve manyetosfer, imgeye iyi uyan modern tefekkürlerdir.
      - Âyetin "ozon tabakasını anlattığı" söylenemez. Bilim, "korunmuş tavan"ın bugün ne anlama gelebileceğini görmenin bir yoludur.
    en: |-
      - The verse speaks of a protected roof; classical scholars understood the protection mainly as the sky being held up and guarded from devils. Ozone and the magnetosphere are modern reflections that fit the image well.
      - The verse did not "describe the ozone layer". The science is a way to see what "protected roof" can mean today.
visualizations:
  - id: ideas
    tr: |
      - Katmanlı bir "kalkan" canlandırması: bir göktaşı atmosferde yanar, UV ışınları ozon tarafından emilir, güneş rüzgârı parçacıkları manyetik alanın etrafından kıvrılır, kutuplarda bir aurora parlar.
      - Bir karşılaştırma kartı: manyetik kalkanlı ve kalkansız Dünya ile Mars.
    en: |-
      - A layered "shield" animation: a meteoroid burns in the atmosphere, UV rays are absorbed by ozone, solar-wind particles curve around the magnetic field, an aurora glows at the poles.
      - A comparison card: Earth vs Mars, with and without a magnetic shield.
