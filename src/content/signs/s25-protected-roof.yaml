legacyHonestNotes:
  - tr: |
      - Âyet korunmuş bir tavandan söz eder; klasik âlimler korumayı esas olarak göğün tutulması ve şeytanlardan korunması olarak anladı. Ozon ve manyetosfer, imgeye iyi uyan modern tefekkürlerdir.
      - Âyetin "ozon tabakasını anlattığı" söylenemez. Bilim, "korunmuş tavan"ın bugün ne anlama gelebileceğini görmenin bir yoludur.
    en: |-
      - The verse speaks of a protected roof; classical scholars understood the protection mainly as the sky being held up and guarded from devils. Ozone and the magnetosphere are modern reflections that fit the image well.
      - The verse did not "describe the ozone layer". The science is a way to see what "protected roof" can mean today.
followUps:
  - q:
      en: What does "protected ceiling" mean?
    a:
      en: "The classical commentators gave three answers: protected from falling (al-Qurtubi, citing 35:41; al-Jalālayn), raised out of reach (Ibn Kathir, with Mujahid), and guarded from devils (al-Tabari; al-Farraʾ). The verse itself does not specify."
  - q:
      en: Does the verse describe the ozone layer?
    a:
      en: No. The ozone layer and the magnetic field are modern facts that fit the image of a protective roof, but no classical commentator read the verse that way, and the verse names neither.
  - q:
      en: Why does the verse say people "turn away" from its signs?
    a:
      en: Al-Tabari says the signs are the sun, the moon and the stars, and that the disbelievers do not reflect on them. The complaint is not that the signs are hidden, but that people stop looking.
  - q:
      en: Is the sky a solid roof?
    a:
      en: 'The Quran uses "roof" and "ceiling" as images (2:22; 21:32). Al-Jalālayn compares it to "the roof of a house". The commentators did not need a solid dome to make their point: the sky is held, kept and ordered.'
  - q:
      en: What do the verses around it say?
    a:
      en: '21:30–33 form one passage: the heavens and earth separated, life from water, the mountains, the protected sky, and the sun and moon each in an orbit. Each is a sign, and the passage asks: "Then will they not believe?" (21:30).'
