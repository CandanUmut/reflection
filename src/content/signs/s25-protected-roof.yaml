summary:
  tr: Nadiren fark ettiğimiz koruma katmanlarının altında yaşıyoruz. Koruma o kadar süreklidir ki onu unuturuz.
  en: '"And We made the sky a protected ceiling, but they, from its signs, are turning away" (21:32): the verse calls the sky a roof that is kept safe, and complains that people do not look.'
verseNotes:
  tr: "21:32: *ve cealne's-semâe sakfen mahfûzâ*, \"göğü korunmuş bir tavan yaptık\". 2:22'de gök bir *binâ* (bina, kubbe) olarak anılır; 15:16–18 göğün kayan yıldızlarla korunmasından söz eder."
  en: |-
    "And We made the sky a protected ceiling, but they, from its signs, are turning away" (21:32), Meccan, in a run of signs after 21:30–31.

    "[He] who made for you the earth a bed [spread out] and the sky a ceiling and sent down from the sky, rain and brought forth thereby fruits as provision for you. So do not attribute to Allah equals while you know [that there is nothing similar to Him]" (2:22), Medinan, among the first commands of Sura al-Baqara.

    - **Key words.** *Saqf*: ceiling, roof. *Maḥfūẓ*: "protected", guarded, preserved.
tafsir:
  tr: |
    [Scholarly]

    - Müfessirler "korunmuş" kelimesini, yeryüzüne düşmekten korunmuş (22:65) ve göklere kulak veren şeytanlardan korunmuş (15:17–18, 37:6–10) olarak okur.
    - Vurgu Allah'ın inayeti ve düzenidir: bizim için inşa edilmiş ve korunan bir tavan.
  en: |-
    **Ibn Kathir.** "Protected" means "high and protected from anything reaching it"; Mujahid: "Raised up." On the end of the verse: "Yet they turn away from its signs."

    **Al-Jalālayn.** "a roof for the earth functioning like the roof of a house preserved from collapsing".

    **Tanwīr al-Miqbās.** It reads the protection as protection from devils (as reported on the surahquran page; the wording was not quoted).

    **Where they differ.** Three meanings of "protected": out of reach (Ibn Kathir), kept from falling (al-Jalālayn), and guarded from devils (*Tanwīr al-Miqbās*). None mentions radiation or the atmosphere's layers.
howItWorks:
  tr: |
    [Established]

    - **Atmosfer** soluyacak hava verir, Dünya'yı sıvı suya yetecek kadar sıcak tutar ve gelen göktaşı parçacıklarının çoğunu "kayan yıldız" olarak yakar. Her gün tonlarca uzay tozu ve kayası atmosfere düşer; neredeyse hepsi yanıp gider.
    - Stratosferdeki **ozon tabakası** zararlı morötesi ışığın çoğunu emer (UV-C'nin tamamını ve UV-B'nin çoğunu).
    - Dünya'nın manyetik alanı olan **manyetosfer**, Güneş'ten gelen yüklü parçacık akımı olan güneş rüzgârının çoğunu saptırır. Kutuplara yakın yerlerde bazı parçacıklar içeri sızar; orada kutup ışıklarını (aurora) görürüz.
    - Manyetik alanı olmayan bir gezegen atmosferini yavaş yavaş kaybedebilir. Mars'ın başına muhtemelen bu geldi.
  en: |-
    Each point is tied to "protected ceiling".
    - **The ozone layer.** [Established] "the ozone layer is a special region of the atmosphere that absorbs much of this radiation" — the Sun's ultraviolet light (Cain, *Universe Today*).
    - **The magnetosphere.** [Established] Earth's magnetic field protects us from solar plasma, "keeping it safely away from the surface of the planet" (Cain).
awe:
  tr: |
    - Her açık gecenin "kayan yıldızları", tepemizde onlarca kilometre yukarıda yanan uzay enkazıdır.
    - Kutup ışıkları, başka türlü göremeyeceğimiz bir kalkanın görünür delilidir.
    - Manyetik alanının çoğunu kaybetmiş olan Mars'ın atmosferi bugün Dünya'nınkinin yaklaşık %1'i kadar yoğundur.
  en: |-
    - The ozone layer absorbs much of the Sun's harmful ultraviolet light (Cain).
    - Earth's magnetic field keeps solar plasma away from the surface (Cain).
reflection:
  tr: |
    Nadiren fark ettiğimiz koruma katmanlarının altında yaşıyoruz: hava, ozon, manyetik bir kalkan. Âyet yumuşak bir sitemle biter: "Onlar ise göğün âyetlerinden yüz çevirirler." Koruma o kadar süreklidir ki onu unuturuz.
  en: |-
    A roof is something you only think about when it leaks. The verse asks us to think about the sky that way: "And We made the sky a protected ceiling, but they, from its signs, are turning away" (21:32).

    The commentators each saw a different protection. Ibn Kathir: high, beyond anything's reach. Al-Jalālayn: a roof "preserved from collapsing", like the roof of a house. Another early reading: guarded from devils who would listen in. In every reading, the sky is kept for us.

    The complaint at the end is the real point. The roof is there, every day, and people "are turning away" from its signs. Ibn Kathir: they do not think about how it was made, "so vast and high".

    Today we can add, as reflection, protections the first listeners could not see: a thin layer of ozone that absorbs much of the Sun's ultraviolet light, and a magnetic field that holds solar plasma away from the ground. They are invisible until we learn about them — and then, like a good roof, they are easy to forget again. The verse's call is simply to look up, and not to turn away.
honestNotes:
  - en: "**No ozone in the verse.** The verse speaks of a protected roof; the classical commentators understood the protection as height, being held up, and being guarded from devils. Ozone and the magnetosphere are modern reflections that fit the image."
  - en: '**The popular claim.** That the verse "described the ozone layer" or the magnetosphere is common; no named source for it was read.'
visualizations:
  - id: ideas
    tr: |
      - Katmanlı bir "kalkan" canlandırması: bir göktaşı atmosferde yanar, UV ışınları ozon tarafından emilir, güneş rüzgârı parçacıkları manyetik alanın etrafından kıvrılır, kutuplarda bir aurora parlar.
      - Bir karşılaştırma kartı: manyetik kalkanlı ve kalkansız Dünya ile Mars.
    en: |-
      - A layered "shield" animation: a meteoroid burns in the atmosphere, UV rays are absorbed by ozone, solar-wind particles curve around the magnetic field, an aurora glows at the poles.
      - A comparison card: Earth vs Mars, with and without a magnetic shield.
