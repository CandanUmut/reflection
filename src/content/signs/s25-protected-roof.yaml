followUps:
  - q:
      en: Does "protected" mean the atmosphere shields us?
    a:
      en: Classical commentators read it as protected from falling, from reaching, and from devils. The atmosphere's protection is described in "How it works", not read into the verse.
  - q:
      en: What is the reader asked to do?
    a:
      en: 'Not to "turn away": to look at the sky and think about how it was made.'
