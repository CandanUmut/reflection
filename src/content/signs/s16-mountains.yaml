followUps:
  - q:
      en: Does the verse say mountains stop earthquakes?
    a:
      en: It does not, and mountain-building zones are among the most earthquake-prone on earth (see the honest notes). Ibn Kathir's "not quake" reflects the classical picture.
  - q:
      en: What do mountain roots look like?
    a:
      en: The science of isostasy is in "How it works".
