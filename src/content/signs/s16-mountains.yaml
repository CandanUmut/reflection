      en: |
        - Under isostasy, Earth's crust floats on the denser mantle, a bit like an iceberg in water. A high mountain range is balanced by a thick root of lighter crust pushing down into the mantle.
        - In the simple Airy model, the root goes about five times deeper than the mountain is tall. The drawing uses that ratio. Normal continental crust is 30–40 km thick; it is drawn here at 35 km.
        - The drawing is schematic: only the vertical scale is to scale; the shapes of the mountain and its root are illustrative. The Airy rule describes broad ranges, not single peaks.
        - Under the Himalaya and Tibetan Plateau, the crust is about 70–75 km thick (some studies say up to 80 km).
        - Honest note: mountains do not prevent earthquakes. The plate collisions that raise mountains also cause quakes.
