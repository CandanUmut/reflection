summary:
  tr: Bir dağın büyük kısmı yerin altında gizlidir. Âyetin asıl vurgusu, ayağımızın bastığı yerin bize sağlam bir yurt kılınmasıdır.
  en: Most of a mountain is hidden underground. The deeper point of the verse is that the ground under our feet was made a stable home for us.
verseNotes:
  tr: "*Evtâd* çadır kazıklarıdır. 16:15'te dağlar için *revâsî* (sabit, sağlam) kelimesi ve \"sizi sarsmasın diye\" (*en temîde*) ifadesi geçer."
  en: '*Awtād* are tent pegs. In 16:15 the mountains are *rawāsiya* (firm), cast "lest it sway with you" (*an tamīda*).'
tafsir:
  tr: |
    [Scholarly]

    - Klasik müfessirler (Taberî, Kurtubî, İbn Kesîr) kendi dünya tasavvurları içinde çalıştı. Bazı rivayetler yeryüzünün önce hareket ettiğini ya da eğildiğini, ta ki Allah onu dağlarla sabitleyene kadar, anlatır.
    - *Evtâd* çadır kazıklarıdır. İmge, bir örtüyü sabit tutan bir şeydir.
    - Asıl vurgu, Allah'ın yeryüzünü sağlam ve yaşanabilir bir yer kılmasındaki inayetidir (78:6'da *mihâd*: beşik ya da döşek).
  en: |-
    [Scholarly]

    - Classical commentators (al-Ṭabarī, al-Qurṭubī, Ibn Kathīr) worked within their own picture of the world. Some reports describe the earth as at first moving or tilting, until God fixed it with mountains.
    - *Awtād* are tent pegs. The image is of something that holds a covering steady.
    - The main emphasis is God's care in making the earth a stable, livable place (*mihād*, a cradle or bed, in 78:6).
howItWorks:
  tr: |
    [Established]

    - Dağların gerçekten derin "kökleri" vardır. İzostaziye göre yerkabuğu, daha yoğun olan manto üzerinde, sudaki bir buzdağı gibi yüzer. Yüksek bir sıradağ, mantoya doğru inen kalın ve daha hafif bir kabuk köküyle dengelenir.
    - Himalayalar ve Tibet Platosu'nun altında kabuk yaklaşık 70–75 km kalınlığındadır (bazı çalışmalara göre 80 km'ye kadar); bu, 30–40 km olan normal kıtasal kalınlığın kabaca iki katıdır.
    - Basit Airy modelinde kök, dağın yüksekliğinin yaklaşık beş katı derine iner.
    - Sıradağlar levha çarpışmalarıyla oluşur. Himalayalar, Hindistan Asya'ya doğru ilerledikçe oluştu ve hâlâ oluşuyor.
  en: |-
    [Established]

    - Mountains do have deep "roots". Under isostasy, Earth's crust floats on the denser mantle, a bit like an iceberg in water. A high mountain range is balanced by a thick root of lighter crust pushing down into the mantle.
    - Under the Himalaya and Tibetan Plateau, the crust is about 70–75 km thick (some studies say up to 80 km), roughly double the normal continental thickness of 30–40 km.
    - In the simple Airy model, the root goes about five times deeper than the mountain is tall.
    - Mountain ranges are built by plate collisions. The Himalaya formed, and is still forming, as India pushes into Asia.
awe:
  tr: |
    - Bir dağın büyük kısmı yerin altında gizlidir. Everest'in görünen 8,8 km'si, altına gömülü kabuğun yanında küçük kalır.
    - George Airy, dağların yakınındaki çekül iplerinin beklenenden daha az çekilmesini açıklamak için 1855'te bu kökleri önerdi. Bir asır sonra sismik araştırmalar onları doğruladı.
  en: |-
    - Most of a mountain is hidden underground. Everest's visible 8.8 km is small next to the crust buried beneath it.
    - George Airy proposed these roots in 1855 to explain why plumb lines near mountains were pulled less than expected. A century later, seismic surveys confirmed them.
reflection:
  tr: |
    "Kazık" imgesi, insanların göremediği bir gerçeğe uyar: dağlar yüzeyin çok altına demirlenmiştir. Âyetin daha derin vurgusu ise ayağımızın bastığı yerin bize sağlam bir yurt kılınmasıdır.
  en: 'The "peg" image fits a truth people could not see: mountains are anchored deep below the surface. The deeper point of the verse is that the ground under our feet was made a stable home for us.'
honestNotes:
  - tr: |
      - Yaygın bir iddiaya göre "dağlar yeryüzünü sabitler ve depremleri önler." Bu doğru değildir. Himalayalar, Zagros ve Anadolu gibi dağ oluşum bölgeleri, dünyanın en çok deprem olan yerleri arasındadır; çünkü dağları yükselten levha çarpışmaları depremlere de yol açar. Âyeti, dağların depremleri durdurduğunu söylüyormuş gibi sunmamak gerekir.
      - Doğru olan şudur: dağların derin kökleri vardır (izostazi) ve jeolojik zaman içinde kabuk bir dengeye oturur.
      - Âyetteki *sizi sarsmasın diye* ifadesi, yeryüzünün bir yurt olarak genel sağlamlığı şeklinde okunabilir. Bu bir [Scholarly] tefekkürdür, sismoloji iddiası değildir.
      - Press ve Siever'in *Earth* adlı ders kitabının "Kur'an'ı doğruladığı" yönündeki, sıkça yanlış aktarılan iddiadan kaçınmak gerekir. Yazarları böyle bir iddiada bulunmadı.
    en: |-
      …important.

      - A popular claim says "mountains stabilize the earth and prevent earthquakes." This is not accurate. Mountain-building zones like the Himalaya, Zagros and Anatolia are among the most earthquake-prone places on Earth, because the same plate collisions that raise mountains also cause quakes. Do not present the verse as saying mountains stop earthquakes.
      - What is accurate is that mountains have deep roots (isostasy), and that over geological time the crust settles into balance.
      - The verse's wording, *lest it sway with you*, can be read as general stability of the earth as a home. That is a [Scholarly] reflection, not a seismology claim.
      - Avoid the often-misquoted claim that the textbook *Earth* by Press and Siever "confirms the Quran". Its authors made no such claim.
    important: true
visualizations:
  - id: ideas
    tr: |
      - Kaydırıcılı bir "buzdağı dağ" kesiti: dağın yüksekliğini artırın ve altındaki kökün derinleştiğini izleyin.
      - Hindistan'ın Asya ile buluşmasını gösteren bir levha çarpışması canlandırması: hem dağ oluşumunu hem deprem bölgelerini gösterir, dürüst notu görünür kılar.
    en: |-
      - An "iceberg mountain" cross-section with a slider. Raise the mountain's height and watch the root deepen below.
      - A plate-collision animation of India meeting Asia that shows both mountain building and earthquake zones, to make the honest note visible.
