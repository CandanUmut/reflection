    textVersion:
      tr: |
        - İzostaziye göre yerkabuğu, daha yoğun olan manto üzerinde, sudaki bir buzdağı gibi yüzer. Yüksek bir sıradağ, mantoya doğru inen kalın ve daha hafif bir kabuk köküyle dengelenir.
        - Basit Airy modelinde kök, dağın yüksekliğinin yaklaşık beş katı derine iner. Çizim bu oranı kullanır. Normal kıtasal kabuk 30–40 km kalınlığındadır; burada 35 km olarak çizildi.
        - Çizim şematiktir: yalnızca dikey ölçek gerçeğe göredir; dağın ve kökün şekli temsilîdir. Airy kuralı tek tek doruklar için değil, geniş sıradağlar için geçerlidir.
        - Himalayalar ve Tibet'in altında kabuk yaklaşık 70–75 km kalınlığındadır (bazı çalışmalara göre 80 km'ye kadar).
