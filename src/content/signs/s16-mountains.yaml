legacyHonestNotes:
  - tr: |
      - Yaygın bir iddiaya göre "dağlar yeryüzünü sabitler ve depremleri önler." Bu doğru değildir. Himalayalar, Zagros ve Anadolu gibi dağ oluşum bölgeleri, dünyanın en çok deprem olan yerleri arasındadır; çünkü dağları yükselten levha çarpışmaları depremlere de yol açar. Âyet, dağların depremleri durdurduğunu söylemez.
      - Doğru olan şudur: dağların derin kökleri vardır (izostazi) ve jeolojik zaman içinde kabuk bir dengeye oturur.
      - Âyetteki *sizi sarsmasın diye* ifadesi, yeryüzünün bir yurt olarak genel sağlamlığı şeklinde okunabilir. Bu bir [Scholarly] tefekkürdür, sismoloji iddiası değildir.
      - Sıkça tekrarlanan bir iddiaya göre Press ve Siever'in *Earth* adlı ders kitabı "Kur'an'ı doğrular". Yazarları böyle bir iddiada bulunmadı.
    en: |-
      - A popular claim says "mountains stabilize the earth and prevent earthquakes." This is not accurate. Mountain-building zones like the Himalaya, Zagros and Anatolia are among the most earthquake-prone places on Earth, because the same plate collisions that raise mountains also cause quakes. The verse does not say that mountains stop earthquakes.
      - What is accurate is that mountains have deep roots (isostasy), and that over geological time the crust settles into balance.
      - The verse's wording, *lest it sway with you*, can be read as general stability of the earth as a home. That is a [Scholarly] reflection, not a seismology claim.
      - An often-repeated claim says the textbook *Earth* by Press and Siever "confirms the Quran". Its authors made no such claim.
    important: true
followUps:
  - q:
      en: Do mountains really have roots?
    a:
      en: Yes. Under isostasy, high mountains are balanced by thick roots of lighter crust; in the Airy model, about five times deeper than the mountain is tall (*Wikipedia*).
  - q:
      en: Do mountains prevent earthquakes?
    a:
      en: No. Mountain belts are earthquake zones, because the same plate collisions build mountains and cause quakes (USGS).
  - q:
      en: Then what does "lest it shift with you" mean?
    a:
      en: 'The commentators read it as the earth being made a stable home: so that it does "not quake with those who are in it" and its creatures can live (Ibn Kathir).'
  - q:
      en: What are *awtād*?
    a:
      en: 'Tent pegs. Al-Jalālayn: the earth "is tied down like tents are tied down with pegs."'
