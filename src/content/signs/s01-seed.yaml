title:
  tr: Yarılan tane ve çekirdek
  en: The seed and the date stone split open
summary:
  tr: "\"Şüphesiz ki taneleri ve çekirdekleri yaran Allah'tır.\" (6:95): Âyet bize sert, kuru bir tohumun yarıldığı ve içinden canlı bir şeyin çıktığı ana bakmamızı ister."
  en: '"Indeed, Allah is the cleaver of grain and date seeds" (6:95): the verse asks us to look at the moment a hard, dry seed splits open and something alive comes out of it.'
tafsir:
  tr: |-
    **İbn Kesîr (14. yüzyıl Şamlı âlim).** Allah "tohum tanesini ve meyve çekirdeğini toprakta yarar ve filizlendirir" ve pek çok türde tahıl ve meyve çıkarır. Sonraki ifadeyi bitkinin kendisiyle açıklar: "Cansız ve hareketsiz bir nesne olan tohum tanesinden ve meyve çekirdeğinden canlı bitkiyi çıkarır." Sonra, kimin savunduğunu belirtmeden, iki başka okuma aktarır: "Tavuktan yumurtayı çıkarır ve bunun tersini" ve "Başkaları bunun, salih anne babadan kötü çocuk çıkarması ve bunun tersi anlamına geldiğini söyledi."

    ***Celâleyn* (Celâleddin el-Mahallî ve Celâleddin es-Suyûtî'nin kısa klasik tefsiri).** "Taneyi bitkilerden, hurma çekirdeğini hurma ağaçlarından yaran Allah'tır." Diri ve ölü hakkında: "Diriyi ölüden çıkarır; insanı nutfeden ve kuşu yumurtadan çıkarması gibi" ve tersini, "nutfeyi ve yumurtayı diriden".

    **Nerede ayrılıyorlar?** İbn Kesîr "ölüden diriyi" ifadesini her şeyden önce tohumdan çıkan bitki olarak okur, çünkü ondan önceki cümle tohumlar hakkındadır. *Celâleyn*'in örnekleri hayvan ve insandır: yumurtadan kuş, nutfeden insan. İbn Kesîr'in aktardığı üçüncü bir okuma ahlakidir: kötü bir anne babadan salih bir çocuk. Hiçbiri tohumu biyolojik anlamda kelimenin tam anlamıyla ölü saymaz; onlar için "ölü", hiçbir hayat belirtisi göstermeyen demektir.

    **Ne söylemediler?** Burada okunan tefsirlerin hiçbiri bir tohumun nasıl çimlendiğini anlatmaz. Noktaları âyetin kendisinin yaptığı argümandır: "İşte Allah budur. O halde nasıl yüz çevirirsiniz?" (6:95).
  en: |-
    **Ibn Kathir (the 14th-century Damascene scholar).** God "causes the seed grain and the fruit stone to split and sprout in the ground", producing many kinds of grain and fruit. He explains the next phrase by the plant itself: "He brings the living plant from the seed grain and the fruit stone, which is a lifless and inanimate object" (his translator's spelling). He then reports two other readings, without naming who held them: "He brings the egg from the chicken, and the opposite", and "Others said that it means, He brings the wicked offspring from the righteous parent and the opposite."

    **Al-Jalālayn (a short classical commentary by Jalal al-Din al-Mahalli and Jalal al-Din al-Suyuti).** "God it is Who splits the grain from the plants and the date-stone from the palm-trees." On the living and the dead: "He brings forth the living from the dead such as the human being from the sperm and the bird from the egg", and the reverse, "the sperm and the egg from the living".

    **Where they differ.** Ibn Kathir reads "the living out of the dead" first of all as the plant from the seed, because the sentence before it is about seeds. Al-Jalālayn's examples are animal and human: the bird from the egg, the human from the sperm. A third reading, reported by Ibn Kathir, is moral: a righteous child from a wicked parent. None of them treats the seed as literally dead in a biological sense; for them, "dead" means what shows no sign of life.

    **What they did not say.** Neither commentary read here describes how a seed germinates. Their point is the argument the verse itself makes: "That is Allah; so how are you deluded?" (6:95).
howItWorks:
  tr: |-
    - **Tohum ölü değil, uykudadır.** [Established] Kuru bir tohum cansız görünür ama canlıdır: Sonraki maddelerin gösterdiği gibi, yıllarca bekleyebilir ve su ona ulaştığında yine de büyüyebilir.
    - **Yarılma suyla başlar.** [Established] UF/IFAS üç evre tarif eder. "Erken tohum çimlenmesi suyun emilmesiyle (imbibisyon) başlar": Kuru tohum suyu emer ve şişer. Sonra "az su alınan, gecikme evresi denen bir dönem" gelir. Son olarak "su alımı radikulanın çıkışını sağlar": Embriyonik kök tohum kabuğunu delip çıkar.
    - **Sert hurma çekirdeği.** [Established] (2005): Hurmanın depoladığı besin, çok kalın hücre duvarlarına yerleştirilmiş bir karbonhidrattır (galaktomannan); çekirdeğin bu kadar sert olmasının sebebi budur; esas olarak kök çıktıktan sonra parçalanır. (Bu çalışmaya henüz yeniden başvurulmadı.)
    - **Bir tohum ne kadar bekleyebilir?** [Established, tek tohum için; Orta, genel nokta için] 1960'larda Masada'da kazılarda çıkarılan, sonra yaklaşık kırk yıl oda sıcaklığında saklanan bir hurma çekirdeği, 2005'te Sarah Sallon (Hadassah Tıp Kuruluşu) liderliğindeki bir ekip tarafından ekildi ve Elaine Solowey tarafından bakıldı. Kendi kabuğunun parçaları radyokarbon yöntemiyle yaklaşık 2.000 yıllık olarak tarihlendi, "artı eksi yaklaşık 50 yıl" (National Geographic, Sallon ve ark., *Science*, 2008'i aktararak). Sallon onun hayatta kalmasını, Masada'nın sıcak ve kuru ikliminin "tohum yaşlanmasında başlıca güç" olan serbest radikallerin verdiği zararı sınırlamasına bağladı.
    - **Tek bir istisna değil.** [Orta] 2020'de ekip, aralarında Kumran'ın da bulunduğu üç Yahudiye çölü bölgesinden, yaklaşık 1.800 ila 2.400 yıllık, Methuselah, Adam, Jonah, Uriel, Boaz, Judith ve Hannah adı verilen "başarıyla filizlenmiş yedi antik tohum" bildirdi (Phys.org, Sallon ve ark., *Science Advances*, 2020'yi aktararak). Makalenin kendisi açılmadı.
  en: |-
    - **A seed is dormant, not dead.** [Established] A dry seed looks lifeless but is alive: as the next points show, it can wait for years and still grow when water reaches it.
    - **Splitting begins with water.** [Established] UF/IFAS describes three phases. "Early seed germination begins with imbibition of water": the dry seed soaks up water and swells. Then comes "a period where there is little water uptake called the lag phase". Finally "water uptake drives the emergence of the radicle": the embryonic root breaks through the seed coat.
    - **The hard date stone.** [Established] (2005): the date's stored food is a carbohydrate (galactomannan) laid down in very thick cell walls, which is why the stone is so hard; it is broken down mainly after the root has emerged. (This study has not yet been consulted again.)
    - **How long a seed can wait.** [Established for the one seed; Moderate for the general point] A date seed excavated at Masada in the 1960s, then stored at room temperature for about four decades, was planted in 2005 by a team led by Sarah Sallon (Hadassah Medical Organisation), and cared for by Elaine Solowey. Fragments of its own shell were radiocarbon-dated to about 2,000 years old, "give or take about 50 years" (National Geographic, reporting Sallon et al., *Science*, 2008). Sallon put its survival down to Masada's hot, dry climate, which limited damage from free radicals, "a major force in seed ageing".
    - **Not a single freak.** [Moderate] In 2020 the team reported "seven successfully sprouted ancient seeds" from three Judean desert sites, including Qumran, roughly 1,800 to 2,400 years old, named Methuselah, Adam, Jonah, Uriel, Boaz, Judith and Hannah (Phys.org, reporting Sallon et al., *Science Advances*, 2020). The paper itself was not opened.
awe:
  tr: |-
    - Bir tohum en az iki bin yıl bekleyebilir ve su ona ulaştığında yine de yarılabilir (Sallon ve ark. 2008, National Geographic yoluyla).
    - İlk görünür hayat belirtisi filiz değil, köktür: "su alımı radikulanın çıkışını sağlar" (UF/IFAS).
    - Antik Yahudiye tohumlarından şimdiye kadar yedi hurma ağacı yetişti (Phys.org, 2020).
  en: |-
    - A seed can wait at least two thousand years and still split when water reaches it (Sallon et al. 2008, via National Geographic).
    - The first visible sign of life is the root, not the shoot: "water uptake drives the emergence of the radicle" (UF/IFAS).
    - Seven palms have now grown from ancient Judean seeds (Phys.org, 2020).
reflection:
  tr: |-
    Çoğumuz bir tohumun yarıldığını hiç izlemedik. Toprağın altında, gözden uzakta, her tarlada ve bahçede olur. Âyet bizi o anda durdurur: "Şüphesiz ki taneleri ve çekirdekleri yaran Allah'tır." (6:95). İki tohum seçer, küçük taneyi ve sert hurma çekirdeğini, sanki şunu söylemek ister gibi: Yumuşak ya da sert, kendini açan tohum değildir.

    Sonra bakışı genişletir: "O, ölüden diriyi çıkarır." Müfessirler bu satırda pek çok şey duydu: tohumdan bitki, yumurtadan kuş, salih bir anne babadan kötü bir çocuk ve bunun tersi. Hepsi, hayatın beklemediğimiz yerde ortaya çıkmasıyla ilgilidir.

    Vâkıa Sûresi çiftçiye doğrudan sorar: "Onu siz mi bitiriyorsunuz, yoksa bitiren biz miyiz?" (56:64). Çiftçinin emeği gerçektir; hikâyenin tamamı değildir. Kur'an başka bir yerde sonucu bizim için çıkarır: Ölü toprağa hayat veren, "mutlaka ölüleri de diriltir" (41:39).

    İki bin yıl bekleyip sonra suya cevap veren bir tohum, bu umudun küçük ve gerçek bir resmidir. Âyetin bizimle bıraktığı soru kendi sorusudur: "O halde nasıl yüz çevirirsiniz?"
  en: |-
    Most of us have never watched a seed split. It happens underground, out of sight, in every field and garden. The verse stops us at that moment: "Indeed, Allah is the cleaver of grain and date seeds" (6:95). It chooses two seeds, the small grain and the hard date stone, as if to say: soft or hard, it is not the seed that opens itself.

    Then it widens the view: "He brings the living out of the dead." The commentators heard many things in this line: the plant from the seed, the bird from the egg, a wicked child from a righteous parent and the reverse. All of them are about life appearing where we did not expect it.

    Sura al-Wāqiʿa asks the farmer directly: "Is it you who makes it grow, or are We the grower?" (56:64). The farmer's work is real; it is not the whole story. Elsewhere the Quran draws the conclusion for us: the One who gives life to dead earth "is the Giver of Life to the dead" (41:39).

    A seed that waited two thousand years and then answered water is a small, true picture of that hope. The question the verse leaves with us is its own: "so how are you deluded?"
