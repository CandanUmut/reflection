    tr: Filizlenme zaman atlaması — ABA/GA "anahtarı" ile
    en: Germination time-lapse — with the ABA/GA "switch"
    steps:
      tr:
        - "Uyku hâli: absisik asit (ABA) tohumu uykuda tutar."
        - "Su: tohum su alınca gibberellin (GA) sinyali başlar."
        - "Anahtar döner: tohum beklemeyi bırakır ve büyümeye yönelir."
        - "Kök: kökçük çıkar ve yer çekimine göre aşağı doğru büyür."
        - "Filiz: enzimler depolanmış besini çözmeye başlar ve sürgün yukarı yükselir."
      en:
        - "Dormant: abscisic acid (ABA) keeps the seed asleep."
        - "Water: taking up water triggers gibberellin (GA) signalling."
        - "The switch turns: the seed stops waiting and commits to growing."
        - "Root: the radicle comes out and grows downward, following gravity."
        - "Shoot: enzymes start breaking down the stored food, and the shoot rises."
