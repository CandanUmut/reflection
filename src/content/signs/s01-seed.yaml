id: S1
slugs:
  tr: tohum
  en: seed
order: 1
theme: plants
verses: ["6:95", "56:63-64"]
pause:
  ref: "56:63"
title:
  tr: Yarılan tane ve çekirdek
  en: The seed and the date stone split open
summary:
  tr: Ölü gibi duran bir çekirdek suyla buluşunca uyanır. Yaklaşık iki bin yıl bekleyen bir hurma çekirdeği bile.
  en: A seed that looks dead wakes when it meets water. Even a date stone that waited about two thousand years.
tafsir:
  tr: |
    Râzî ve Kurtubî, ölü gibi görünen şeyden canlının çıkışını vurgular. İbn Kesîr ise insanın muhtaçlığını öne çıkarır.
  en: |
    Al-Rāzī and al-Qurṭubī stress the living emerging from what seems dead. Ibn Kathīr stresses human dependence.
howItWorks:
  tr: |
    [Established]

    - **Uyku hâli.** Absisik asit (ABA) adlı bitki hormonu tohumu uykuda tutar.
    - **Uyanış.** Tohum su alınca gibberellin (GA) sinyali başlar. Buğday gibi bir tahıl tanesinde amilaz enzimleri depolanmış nişastayı şekere çevirir.
    - **Hurma çekirdeği farklıdır.** Besini çoğunlukla galaktomannandır: endosperm hücrelerinin çok sert duvarlarına örülmüş bir şeker zinciri. Çekirdeği bu kadar sert yapan da odur. Kök çıktıktan sonra endo-β-mannanaz enzimi bu duvarları parçalamaya başlar (Gong ve ark., 2005).
    - **Kök.** Önce kökçük (embriyonik kök) çıkar ve yer çekimine göre aşağı doğru büyür (gravitropizma).
    - **Filiz.** Ardından sürgün yukarı yükselir.
  en: |
    [Established]

    - **Dormancy.** A plant hormone, abscisic acid (ABA), keeps the seed dormant.
    - **Waking.** Taking up water triggers gibberellin (GA) signalling. In a cereal grain such as wheat, amylase enzymes turn stored starch into sugar.
    - **A date stone is different.** Its food is mostly galactomannan, a sugar chain built into the very hard walls of its endosperm cells; that is what makes the stone so hard. After the root has come out, the enzyme endo-β-mannanase starts to break these walls down (Gong et al., 2005).
    - **Root.** The radicle (the embryonic root) comes out first and grows downward, following gravity (gravitropism).
    - **Shoot.** Then the shoot rises.
awe:
  tr: |
    - Masada'da bulunan bir hurma çekirdeği 2005'te filizlendi (Sallon, Solowey ve ark., *Science* 320:1464, 2008). Zürih Üniversitesi çekirdeği **1.990 ± 50 yıl** öncesine tarihlendirdi; 2020'deki devam makalesi ondan 1.900 yıllık bir tohum diye söz eder. Fidana "Methuselah" adı verildi.
    - 2020'de altı antik çekirdek daha filizlendirildi (*Science Advances*).
    - Lut Gölü (Ölü Deniz) çevresinin kuruluğu, serbest radikallerin verdiği hasarı sınırladı.
    - İkincil kaynaklara göre "Hannah" adlı dişi bir hurma ağacı daha sonra meyve verdi.
  en: |
    - A date seed found at Masada sprouted in 2005 (Sallon, Solowey et al., *Science* 320:1464, 2008). The University of Zurich dated it to **1,990 ± 50 years**; the 2020 follow-up paper calls it a 1,900-year-old seed. The palm was named "Methuselah".
    - Six more ancient seeds were germinated in 2020 (*Science Advances*).
    - The dryness of the Dead Sea region limited damage from free radicals.
    - Secondary sources report that a female palm, "Hannah", later bore dates.
reflection:
  tr: |
    İki bin yıl bekleyen ve yine de suya cevap veren bir çekirdek, 6:95'in resmidir. Kur'an'ın diriliş benzetmesini de hatırlatır: ölü toprağı yağmurla dirilten, ölüleri de diriltir (41:39).
  en: |
    A stone that waits two thousand years and still answers to water is a picture of 6:95. It also recalls the Quran's analogy for resurrection: the One who revives dead earth with rain will revive the dead (41:39).
reflectionVerses: ["41:39"]
honestNotes:
  - tr: Âyet tohumun uyku hâli hakkında bir "öngörüde" bulunmaz. Çekirdeğin yaşı da yaklaşık bir tarihlendirmedir.
    en: The verse makes no "prediction" about seed dormancy. The seed's age is also an approximate dating.
