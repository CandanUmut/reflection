followUps:
  - q:
      en: Did classical scholars know how germination works?
    a:
      en: No; they read the verse as a sign of God's power to bring life from the lifeless. The biology on this page is modern and kept in its own layer.
  - q:
      en: Why a date stone?
    a:
      en: The verse names both grain and the date stone; the date stone is famously hard, and a 2,000-year-old one has germinated (see "How it works").
