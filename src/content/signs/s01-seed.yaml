honestNotes:
  - en: "**No prediction is claimed.** The verse describes something every farmer could see. It makes no claim about dormancy, hormones or seed longevity, and the commentators did not read it that way."
    tr: "**Hiçbir kehanet iddia edilmiyor.** Âyet her çiftçinin görebileceği bir şeyi anlatır. Uyku hâli, hormonlar ya da tohumun ömrü hakkında hiçbir iddiada bulunmaz ve müfessirler onu böyle okumadı."
  - en: '**"Dead" is not a biological term here.** A dormant seed is alive. The verse speaks of how things look to us, and the commentators read "dead" in that sense, or morally.'
    tr: '**"Ölü" burada biyolojik bir terim değildir.** Uykudaki bir tohum canlıdır. Âyet şeylerin bize nasıl göründüğünden söz eder ve müfessirler "ölü"yü bu anlamda ya da ahlaki anlamda okudu.'
  - en: "**Dates are approximate.** The Masada seed is about 2,000 years old, ± about 50 years. The 2020 seeds span roughly 1,800 to 2,400 years."
    tr: "**Tarihler yaklaşıktır.** Masada tohumu yaklaşık 2.000 yıllıktır, artı eksi yaklaşık 50 yıl. 2020 tohumları yaklaşık 1.800 ila 2.400 yıl arasına yayılır."
  - en: '**Popular claim.** No widespread "scientific miracle" claim about 6:95 was found; the page does not need one.'
    tr: '**Popüler iddia.** 6:95 hakkında yaygın bir "bilimsel mucize" iddiası bulunamadı; sayfanın da böyle bir iddiaya ihtiyacı yok.'
visualizations:
  - id: germination
    tr: Filizlenme zaman atlaması — ABA/GA "anahtarı" ile
    en: Germination time-lapse — with the ABA/GA "switch"
    steps:
      tr:
        - "Uyku hâli: absisik asit (ABA) tohumu uykuda tutar."
        - "Su: tohum su alınca gibberellin (GA) sinyali başlar."
        - "Anahtar döner: tohum beklemeyi bırakır ve büyümeye yönelir."
        - "Kök: kökçük çıkar ve yer çekimine göre aşağı doğru büyür."
        - "Filiz: enzimler depolanmış besini çözmeye başlar ve sürgün yukarı yükselir."
      en:
        - "Dormant: abscisic acid (ABA) keeps the seed asleep."
        - "Water: taking up water triggers gibberellin (GA) signalling."
        - "The switch turns: the seed stops waiting and commits to growing."
        - "Root: the radicle comes out and grows downward, following gravity."
        - "Shoot: enzymes start breaking down the stored food, and the shoot rises."
