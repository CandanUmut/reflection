followUps:
  - q:
      en: Did classical scholars know how germination works?
      tr: Klasik âlimler çimlenmenin nasıl işlediğini biliyor muydu?
    a:
      en: Not in the modern sense. Ibn Kathir and al-Jalālayn read the verse as a sign of God's power to bring life from what looks lifeless. The biology on this page is modern and kept in its own layer.
      tr: Modern anlamda hayır. İbn Kesîr ve *Celâleyn* âyeti, Allah'ın cansız görünenden hayat çıkarma kudretinin bir işareti olarak okudu. Bu sayfadaki biyoloji moderndir ve kendi katmanında tutulmuştur.
  - q:
      en: Why a date stone?
      tr: Neden hurma çekirdeği?
    a:
      en: The verse names both grain and *nawā*, the date stone. The date stone is famously hard; a 2,000-year-old one has germinated (see "How it works").
      tr: Âyet hem taneyi hem *nevâ*yı, hurma çekirdeğini anar. Hurma çekirdeği sertliğiyle bilinir; 2.000 yıllık bir tanesi çimlendi (bkz. "Nasıl işler?").
  - q:
      en: What does "He brings the living out of the dead" mean?
      tr: '"Ölüden diriyi çıkarır" ne demek?'
    a:
      en: Ibn Kathir reads it first as the plant from the seed; al-Jalālayn as the human from the sperm and the bird from the egg; a reading reported by Ibn Kathir applies it to a righteous child born to a wicked parent.
      tr: İbn Kesîr onu önce tohumdan bitki olarak okur; *Celâleyn* nutfeden insan ve yumurtadan kuş olarak; İbn Kesîr'in aktardığı bir okuma onu kötü bir anne babadan doğan salih bir çocuğa uygular.
  - q:
      en: Is this verse about resurrection?
      tr: Bu âyet dirilişle mi ilgili?
    a:
      en: 'Not directly, but the Quran links new life in the earth to resurrection elsewhere: "He who has given it life is the Giver of Life to the dead" (41:39).'
      tr: "Doğrudan değil, ama Kur'an başka bir yerde topraktaki yeni hayatı dirilişe bağlar: \"Şüphesiz ki ona hayat veren Allah mutlaka ölüleri de diriltir.\" (41:39)."
