honestNotes:
  - en: "**No prediction is claimed.** The verse describes something every farmer could see. It makes no claim about dormancy, hormones or seed longevity, and the commentators did not read it that way."
  - en: '**"Dead" is not a biological term here.** A dormant seed is alive. The verse speaks of how things look to us, and the commentators read "dead" in that sense, or morally.'
  - en: "**Dates are approximate.** The Masada seed is about 2,000 years old, ± about 50 years. The 2020 seeds span roughly 1,800 to 2,400 years."
  - en: '**Popular claim.** No widespread "scientific miracle" claim about 6:95 was found; the page does not need one.'
