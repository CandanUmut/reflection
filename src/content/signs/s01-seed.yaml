followUps:
  - q:
      en: Did classical scholars know how germination works?
    a:
      en: Not in the modern sense. Ibn Kathir and al-Jalālayn read the verse as a sign of God's power to bring life from what looks lifeless. The biology on this page is modern and kept in its own layer.
  - q:
      en: Why a date stone?
    a:
      en: The verse names both grain and *nawā*, the date stone. The date stone is famously hard; a 2,000-year-old one has germinated (see "How it works").
  - q:
      en: What does "He brings the living out of the dead" mean?
    a:
      en: Ibn Kathir reads it first as the plant from the seed; al-Jalālayn as the human from the sperm and the bird from the egg; a reading reported by Ibn Kathir applies it to a righteous child born to a wicked parent.
  - q:
      en: Is this verse about resurrection?
    a:
      en: 'Not directly, but the Quran links new life in the earth to resurrection elsewhere: "He who has given it life is the Giver of Life to the dead" (41:39).'
