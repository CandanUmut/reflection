legacyHonestNotes:
  - tr: |
      - Süper çiçeklenme için gereken yağış eşikleri yere ve türe göre değişir; popüler kaynaklar rakamları gelişigüzel verir. Sabit bir rakam yerine "derin, ıslatan bir yağmur" demek doğrudur.
      - Âyet, toprağın dirilişini diriliş için bir benzetme olarak kullanır; botanik bir iddia olarak değil.
    en: |-
      - Exact rainfall thresholds for superblooms vary by place and species, and popular sources quote numbers loosely. Use "a deep, soaking rain" rather than a fixed figure.
      - The verse uses revival of earth as an analogy for resurrection, not as a botanical claim.
followUps:
  - q:
      en: What does *khāshiʿa* mean?
    a:
      en: 'Still, lowered, humbled. Ibn Kathir: "lifeless, with nothing growing in it". The same word is used for a humble heart.'
  - q:
      en: How does rain "revive" earth?
    a:
      en: It wakes seeds that have waited in the soil, sometimes for years, as in Death Valley in 2026 (AP).
  - q:
      en: Is this verse about resurrection?
    a:
      en: 'Yes: its last sentence says so, and Ibn Kathir reads it as "signs of His ability to bring the dead back to life."'
  - q:
      en: What is a superbloom?
    a:
      en: A mass flowering of desert plants after unusually good rains; Death Valley's 2026 bloom was its best since 2016 (AP).
