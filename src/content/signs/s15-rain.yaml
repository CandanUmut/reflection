theme: water
title:
  tr: Ölü toprağı dirilten yağmur
  en: Rain reviving dead earth
verses:
  - 41:39
seeAlso:
  - 22:5
  - 35:9
  - 50:9-11
summary:
  tr: Tamamen ölü görünen toprak, bekleyen hayatla doludur.
  en: '41:39 points to dry, still earth that "quivers and grows" when rain comes, and draws the conclusion: "He who has given it life is the Giver of Life to the dead."'
verseNotes:
  tr: 41:39'da yeryüzü *hâşia* (sakin, kuru, boynu bükük) diye anılır. 35:9 aynı benzetmeyi dirilişe bağlar.
  en: |-
    "And of His signs is that you see the earth stilled, but when We send down upon it rain, it quivers and grows. Indeed, He who has given it life is the Giver of Life to the dead. Indeed, He is over all things competent" (41:39), Meccan, in Sura Fuṣṣilat, in a run of signs (41:37–39) after the call not to prostrate to the sun or moon but to their Creator.

    - **Key words.** *Khāshiʿa* ("stilled"): lowered, humbled, still; the same word describes a humble heart or lowered eyes. *Ihtazzat* ("quivers"): stirs, moves. *Rabat* ("grows"): swells, rises.
    - **What the verse argues.** From something anyone sees — dry land turning green — to something no one sees: the raising of the dead.
tafsir:
  tr: |
    [Scholarly]

    Müfessirler diriliş delilini vurgular: kuru toprağı dirilten kudret, ölüleri de diriltecektir. Râzî, yeryüzünün *hâşia* diye anıldığını not eder; bu kelime alçak gönüllü, eğilmiş bir kalp için de kullanılır. İmge topraktan ruha geçer.
  en: |-
    **Ibn Kathir.** "Stilled" "means, lifeless, with nothing growing in it; it is dead." When rain comes, "it brings forth all kinds of crops and fruits". And on the opening, "And among His signs": it "means, signs of His ability to bring the dead back to life."

    **Al-Jalālayn.** "you see the earth desolate dried out without any vegetation"; when the rain falls, "it stirs it moves and swells swells and rises."

    **What they share.** Both read the verse as an argument for resurrection from the yearly revival of the land. Al-Jalālayn's "stirs… swells… rises" follows the Arabic verbs closely.
howItWorks:
  tr: |
    [Established]

    - Çöl toprakları bir "tohum bankası" barındırır: tek yıllık çiçeklerin, toprakta yıllarca, bazen on yıllarca bekleyebilen tohumları.
    - Pek çok çöl tohumu, ancak bol ve ıslatan bir yağmurun yıkayabileceği, filizlenmeyi engelleyen maddelerle kaplıdır. Bu, onları hayat döngülerini tamamlatamayacak hafif bir sağanaktan sonra filizlenmekten korur.
    - Doğru zamanda ve sıcaklıkta yeterli yağmur yağınca çok sayıda tohum birlikte filizlenir. Buna "süper çiçeklenme" (superbloom) denir.
    - Ölüm Vadisi'ne (Death Valley) yılda ortalama 2 inçin (yaklaşık 50 mm) biraz altında yağmur düşer. Buna rağmen 2026 baharında 2016'dan bu yana en büyük süper çiçeklenmesini yaşadı.
  en: |-
    Each point is tied to "the earth stilled" and "it quivers and grows".
    - **Waiting seeds.** [Established] In Death Valley, the driest place in North America, long-dormant seeds buried in the soil burst through after rain; ecologist Tiffany Pereira (Desert Research Institute) says "desert plants have adapted to go decades without water" (AP, 2026).
    - **The 2026 bloom.** [Established] After "nearly a year's worth of rain since October", including the wettest November on record (1.76 inches, 4.47 cm, according to the National Park Service), Death Valley had, in park ranger Matthew Lamar's words, "the best the park has seen since 2016"; the AP calls such blooms "once-in-a-decade" (AP, 2026).
awe:
  tr: |
    - Çöl ekolojistlerine göre bazı tohumlar toprakta on yıl ya da daha uzun süre bekleyebilir.
    - Tohumlar, ne kadar yağmur yağdığına bakarak uyanıp uyanmamaya "karar verir". İnce bir sağanak görmezden gelinir; derin, ıslatan bir yağmur kapıyı açar.
    - İyi bir yılda bile her tohum filizlenmez. Bazıları, sonraki bir kuraklığa karşı sigorta olarak hep geride kalır.
  en: |-
    - Seeds in Death Valley's soil can wait for years — the AP report says plants can go "decades" — and then bloom after one wet season (AP, 2026).
    - A single wet winter can turn the driest place in North America into fields of flowers (AP, 2026).
reflection:
  tr: |
    Tamamen ölü görünen toprak, bekleyen hayatla doludur. Kur'an bunu her yıl, her manzarada dirilişin resmi olarak kullanır: bitmiş görünen şey bir emri beklemektedir.
  en: |-
    Most of us have seen it: a field brown and cracked in summer, and the same field green a few weeks after the rains. It is so ordinary that we forget to be amazed. The Quran does not forget. "And of His signs is that you see the earth stilled, but when We send down upon it rain, it quivers and grows" (41:39).

    The word for "stilled", *khāshiʿa*, is also used for a humble heart. The earth lies low, quiet, waiting. It has no power to green itself. Then the rain comes, and the verbs move: it stirs, it swells, it rises.

    Ibn Kathir and al-Jalālayn see the conclusion the verse draws: "Indeed, He who has given it life is the Giver of Life to the dead." The revival of the land is a picture of resurrection, repeated every year in every landscape, for anyone who looks.

    Death Valley showed it this year. Ground that looked completely dead held seeds that had waited for years. One wet season, and the desert flowered. What seems finished may only be waiting for a command.

    There is a lesson for the heart as well. A life that feels dry and still is not therefore dead. It too may be waiting for its rain.
honestNotes:
  - en: "**An analogy, not botany.** The verse uses the revival of the earth as an argument for resurrection; it makes no claim about seed banks or germination inhibitors."
  - en: '**Figures not yet sourced.** The page says seeds carry "germination inhibitors that only a soaking rain washes away" and that "Death Valley averages a little under 2 inches (about 50 mm)" of rain a year. Neither was found in the source read.'
  - en: "**The popular claim.** No named source making a scientific-miracle claim about this verse was read."
