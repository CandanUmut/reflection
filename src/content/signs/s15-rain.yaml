legacyHonestNotes:
  - tr: |
      - Süper çiçeklenme için gereken yağış eşikleri yere ve türe göre değişir; popüler kaynaklar rakamları gelişigüzel verir. Sabit bir rakam yerine "derin, ıslatan bir yağmur" demek doğrudur.
      - Âyet, toprağın dirilişini diriliş için bir benzetme olarak kullanır; botanik bir iddia olarak değil.
    en: |-
      - Exact rainfall thresholds for superblooms vary by place and species, and popular sources quote numbers loosely. Use "a deep, soaking rain" rather than a fixed figure.
      - The verse uses revival of earth as an analogy for resurrection, not as a botanical claim.
followUps:
  - q:
      en: What does "stilled" (*khāshiʿa*) mean?
    a:
      en: Low, humbled, lifeless. Qatada (in al-Tabari) explains it as "dusty and crumbling", al-Suddi as "dry", Ibn Kathir as "lifeless, with nothing growing in it".
  - q:
      en: Why compare rain to resurrection?
    a:
      en: Because both are life after death that only God can give. The Quran makes the comparison several times (22:5; 35:9; 50:11; 30:19), and al-Suddi says that as God revives the earth with rain, He will revive the dead with water.
  - q:
      en: Does the earth really "swell" when it rains?
    a:
      en: "Some soils do: clay-rich Vertisols swell when wet and crack when dry (USDA NRCS). Mujahid and al-Suddi noticed the earth swelling before the plants appear. The verse's point, though, is the coming of life, not soil physics."
  - q:
      en: How long can seeds wait for rain?
    a:
      en: Desert plants "have adapted to go decades without water", according to an ecologist quoted by the AP (2026).
  - q:
      en: Does the verse speak to the heart too?
    a:
      en: The Quran uses *khāshiʿ* of humble hearts and eyes. Reading the verse as hope for a dry life is a reflection, not its literal meaning — but it is the same God who sends both rains.
