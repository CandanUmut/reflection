followUps:
  - q:
      en: Does the hump store water?
    a:
      en: No. It stores fat (*Wikipedia*).
  - q:
      en: Why the camel, of all animals?
    a:
      en: 'Because it was the animal the first listeners knew best. Ibn Kathir: God "directs the bedouin to consider what he himself witnesses".'
  - q:
      en: Why does the verse go on to the sky, mountains and earth?
    a:
      en: "It moves from the near to the far, through everything a desert traveller sees, asking the same question of each: how was it made?"
  - q:
      en: How much can a camel drink?
    a:
      en: Up to about 110 litres in ten minutes after severe dehydration (Ali et al. 2023); *Wikipedia* gives up to 140 litres at a time.
