followUps:
  - q:
      en: Why does the verse mention camels, not another animal?
    a:
      en: Because the Arabs knew them best and lived by them (Qatada, in al-Tabari). al-Hasan, asked about the elephant, said the Arabs were far from it (al-Qurtubi).
  - q:
      en: What did the commentators find amazing in the camel?
    a:
      en: Its strength with gentleness (Ibn Kathir), kneeling to be loaded and rising (Qatada, Muqatil), and its patience with thirst (al-Qurtubi).
  - q:
      en: How long can a camel go without water?
    a:
      en: In a 2023 study, 20 days, losing 31% of body weight (Ali et al.).
  - q:
      en: How much can a camel drink at once?
    a:
      en: Up to 110 litres in ten minutes after severe dehydration (Ali et al., Introduction).
  - q:
      en: Could *ibil* mean clouds?
    a:
      en: A minority said so (al-Mubarrad), but most commentators, including al-Mawardi, read it as camels (al-Qurtubi).
