followUps:
  - q:
      en: Why does the Quran point to the camel?
    a:
      en: For its first listeners it was the most familiar and useful animal; Ibn Kathir lists its strength, gentleness and uses.
  - q:
      en: Is the camel's water storage a "miracle"?
    a:
      en: The page describes the camel's physiology in "How it works" and avoids miracle language.
