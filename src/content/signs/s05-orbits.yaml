followUps:
  - q:
      en: Why are there 27.3 days and 29.5 days?
      tr: Neden 27,3 gün ve 29,5 gün var?
    a:
      en: The Moon goes around the sky in 27.3 days, measured against the stars. But phases depend on where the Sun is, and since the Earth has moved along its own orbit, the Moon needs just over two more days to line up with the Sun again. So new moon to new moon is 29.5 days (NASA StarChild). These are the "phases" of 36:39.
      tr: Ay yıldızlara göre ölçüldüğünde gökyüzünü 27,3 günde dolaşır. Ama evreler Güneş'in nerede olduğuna bağlıdır ve Dünya kendi yörüngesinde ilerlediği için Ay'ın Güneş'le yeniden hizalanması iki günden biraz fazla sürer. Dolayısıyla yeni aydan yeni aya 29,5 gündür (NASA StarChild). Bunlar 36:39'daki "menziller"dir.
  - q:
      en: What does "the sun runs" mean?
      tr: '"Güneş akıp gidiyor" ne demek?'
    a:
      en: In the verse, that the sun moves continuously on its course. Ibn Kathir and al-Jalālayn read "toward its stopping point" as a place beneath the Throne or a fixed term at the end of time. Astronomy adds that the Sun moves around the galaxy at about 230 km/s.
      tr: Âyette, güneşin kendi yolunda sürekli hareket etmesi. İbn Kesîr ve *Celâleyn* *li-müstekarrin lehâ*yı Arş'ın altında bir yer ya da zamanın sonunda belirlenmiş bir vakit olarak okur. Astronomi, Güneş'in galaksi etrafında yaklaşık 230 km/s hızla hareket ettiğini ekler.
  - q:
      en: What is a *falak*?
      tr: "*Felek* nedir?"
    a:
      en: A rounded course or orbit. Ibn Kathir's sources compare it to "the arc of a spinning wheel" and read "swimming" as "floating, i.e., revolving, in their orbits".
      tr: Yuvarlak bir yol ya da yörünge. İbn Kesîr'in kaynakları onu "dönen bir çarkın kavsine" benzetir ve "yüzerler"i "yörüngelerinde süzülerek, yani dönerek" diye okur.
  - q:
      en: What does the sun's "prostration" mean?
      tr: Güneşin "secde"si ne demek?
    a:
      en: 'Scholars differ. Al-Khattabi: it happens "in a manner that we cannot see or comprehend". Ibn Hajar: possibly its submission, or the prostration of the angel charged with it. *Maʿārif al-Qurʾān*: a similitude; the sun is always beneath the Throne and always in prostration.'
      tr: "Âlimler farklı düşünür. Hattâbî: \"bizim göremeyeceğimiz ve kavrayamayacağımız bir şekilde\" olur. İbn Hacer: Belki onun boyun eğişi ya da onunla görevli meleğin secdesi. *Meâriful-Kur'ân*: bir benzetme; güneş her zaman Arş'ın altındadır ve her zaman secdededir."
  - q:
      en: The hadith says the sun prostrates after it sets — but the sun is always rising somewhere. How can that be?
      tr: Hadis güneşin battıktan sonra secde ettiğini söylüyor; ama güneş her an bir yerde doğuyor. Bu nasıl olabilir?
    a:
      en: This is a real objection. The answers above read the prostration as non-physical (submission), or continuous, or beyond our knowledge. A reader may or may not find them convincing; the page shows the hadith and the readings rather than hiding them.
      tr: Bu gerçek bir itirazdır. Yukarıdaki cevaplar secdeyi fiziksel olmayan (boyun eğiş), sürekli ya da bilgimizin ötesinde bir şey olarak okur. Bir okuyucu onları ikna edici bulabilir ya da bulmayabilir; sayfa hadisi ve okumaları saklamak yerine gösterir.
  - q:
      en: Did classical scholars think the sun goes around the earth?
      tr: Klasik âlimler güneşin dünyanın etrafında döndüğünü mü düşünüyordu?
    a:
      en: 'Their cosmology was that of their time: Ibn Kathir reads the orbits as "in the heaven" and the Throne as "a dome" over the universe. (Whether he states an Earth-centred model in so many words has not yet been checked.) This page does not claim the verse described modern astronomy.'
      tr: "Kozmolojileri kendi zamanlarınınkiydi: İbn Kesîr yörüngeleri \"gökte\", Arş'ı da kâinatın üstünde \"bir kubbe\" olarak okur. (Dünya merkezli bir modeli açıkça söyleyip söylemediği henüz kontrol edilmedi.) Bu sayfa âyetin modern astronomiyi anlattığını iddia etmez."
