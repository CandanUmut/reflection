title:
  tr: Her biri bir yörüngede güneş ve ay
  en: Sun and moon, each in an orbit
summary:
  tr: '36:37–40 zamanı tutan bir gökyüzünü anlatır: gündüzden soyulan gece, "akıp giden" bir güneş, "menziller" tayin edilen bir ay ve "onların her biri kendi yörüngesinde yüzerler".'
  en: '36:37–40 describes a sky that keeps time: night drawn off the day, a sun that "runs", a moon given "phases", and "each, in an orbit, is swimming".'
verseNotes:
  tr: |-
    "Gece de onlara bir delildir. Biz ondan gündüzü soyar çıkarırız, bir de bakarlar ki karanlığa dalmışlar. Güneş de bir delildir ki kendi yolunda akıp gidiyor. İşte bu çok güçlü ve her şeyi bilen Allah'ın takdiridir. Ay'a gelince, ona menziller tayin ettik. Nihayet o eski hurma salkımının çöpü gibi (yay haline) dönmüştür. Ne güneşin aya çatması yaraşır, ne de gece gündüzü geçebilir; onların her biri kendi yörüngesinde yüzerler." (36:37–40).

    - **Anahtar kelimeler.**
      - *Tecrî* ("akıp gidiyor"): suyun akması gibi sürekli hareket eder.
      - *Li-müstekarrin lehâ* (Elmalılı'da "kendi yolunda", Saheeh'te "its stopping point", "durma noktasına doğru"): *müstekarr* bir dinlenme yeri ya da bir dinlenme zamanı anlamına gelebilir (*Meâriful-Kur'ân*). Çevirmenler farklıdır: "its stopping point" (durma noktası; Saheeh), "a resting-place" (bir dinlenme yeri; Pickthall), "a period determined for him" (onun için belirlenmiş bir süre; Yusuf Ali), "its fixed term" (belirlenmiş vakti; Khattab) (Quranpedia).
      - *Menâzil* ("menziller", kelimenin tam anlamıyla "konaklar"): ayın geçtiği evreler.
      - *El-urcûnu'l-kadîm* ("eski hurma salkımının çöpü"): bir hurma salkımının kurumuş, kıvrık sapı; ince hilalin bir resmi.
      - *Felek* ("yörünge"): yuvarlak bir yol. İbn Kesîr'in kaynakları onu "dönen bir çarkın kavsine" benzetir (aşağıda).
      - *Yesbehûn* ("yüzerler"): yüzer ya da süzülür gibi akıcı biçimde hareket etmek.
    - **Bağlam.** Yâsîn Sûresi Mekkîdir. Bu âyetler yeryüzündeki işaretlerden (diriltilen ölü toprak, bahçeler ve pınarlar, 36:33–35) sonra ve denizdeki işaretlerden (gemiler, 36:41–42) önce gelir. Pasaj dirilişi inkâr eden insanlara hitap eder.
  en: |-
    "And a sign for them is the night. We remove from it [the light of] day, so they are [left] in darkness. And the sun runs [on course] toward its stopping point. That is the determination of the Exalted in Might, the Knowing. And the moon - We have determined for it phases, until it returns [appearing] like the old date stalk. It is not allowable for the sun to reach the moon, nor does the night overtake the day, but each, in an orbit, is swimming" (36:37–40).

    - **Key words.**
      - *Tajrī* ("runs"): moves continuously, as water runs.
      - *Li-mustaqarrin lahā* ("toward its stopping point"): *mustaqarr* can mean a place of rest or a time of rest (*Maʿārif*). Translators differ: "its stopping point" (Saheeh), "a resting-place" (Pickthall), "a period determined for him" (Yusuf Ali), "its fixed term" (Khattab) (Quranpedia).
      - *Manāzil* ("phases", literally "stations"): the stages through which the moon passes.
      - *Al-ʿurjūn al-qadīm* ("the old date stalk"): the dried, curved stalk of a date cluster, an image of the thin crescent.
      - *Falak* ("orbit"): a rounded course. Ibn Kathir's sources compare it to "the arc of a spinning wheel" (below).
      - *Yasbaḥūn* ("swimming"): moving smoothly, as one swims or floats.
    - **Setting.** Sura Yā Sīn is Meccan. These verses follow signs on earth (dead land revived, gardens and springs, 36:33–35) and precede signs at sea (ships, 36:41–42). The passage addresses people who deny the resurrection.
tafsir:
  tr: |-
    **İbn Kesîr, *li-müstekarrin lehâ* hakkında.** İki görüş verir. Birincisi, yer: "Arş'ın altında olan, belirlenmiş konum yoluna işaret eder." İkincisi, zaman: "Bu, güneşin belirlenmiş vaktinin sona ermesine işaret eder; bu da Kıyamet Günü olacaktır"; Katâde'den: "Onun belirlenmiş bir vakti vardır ve onu aşmayacaktır." İbn Mes'ûd ve İbn Abbâs'ın âyeti "onun için hiçbir durak yoktur" (*lâ müstekarra lehâ*) diye okuduklarını da aktarır ve bunu "hiç yavaşlamadan ya da durmadan" diye açıklar. Aynı sayfada Arş'a dair tarifi de var: "ayaklar ya da sütunlar üzerinde duran, melekler tarafından taşınan bir kubbe; ve kâinatın üstündedir" ve "Arş yaratılışın tavanıdır ve pek çok astronomun iddia ettiği gibi bir küre değildir" (surahquran.com, 36:38). Bu, onun zamanının kozmolojisidir.

    ***Celâleyn*.** "dinlenme yerine, yani onu aşmaz" ve "onun akışı, mülkünde Aziz olanın, yarattıklarını Bilen'in takdiridir".

    ***Meâriful-Kur'ân*.** Kelime "hem dinlenme yerini hem de dinlenme zamanını göstermek için kullanılır"; zaman görüşüne göre güneş "önceden belirlenmiş hareketinin sonuna" ulaşır, "ve o zaman Kıyamet Günü'dür"; yer görüşüne göre "güneşin hareketinin bir devrinin tamamlandığı bir yerdir".

    **Ay ve yörüngeler hakkında.** İbn Kesîr: Ay "eski, kurumuş, kıvrık hurma sapı gibi görünene kadar" küçülür; İbn Abbâs bunu hurma salkımını ağaca bağlayan sap olarak açıklar. "Her biri bir yörüngede", "gökte, yörüngelerinde süzülerek, yani dönerek" demektir. İbn Abbâs'tan "ve Selef'ten (ilk nesillerden) başkalarından" aktarır: "Dönen bir çarkın kavsi gibi bir yörüngede"; "süzülerek, dönerek" okuması için İbn Abbâs, İkrime, Dahhâk, Hasan, Katâde ve Atâ el-Horasânî'yi sayar. "Ne de gece gündüzü geçebilir" hakkında Mücâhid der ki: "Birbirlerini hızla ararlar"; İbn Kesîr açıklar: "Gece ile gündüz arasında boşluk yoktur; her biri diğerini aralıksız izler."

    **Güneşin secdesi hadisi.** Ebû Zer (r.a.) rivayet eder: Güneş batarken Hz. Peygamber (s.a.v.) ona "Ey Ebû Zer! Güneşin nereye battığını biliyor musun?" diye sordu ve şöyle buyurdu: "Gider ve (Allah'ın) Arş'ının altında secde eder", sonra 36:38'i okudu ({hadith:bukhari:4802}). Daha uzun rivayette güneş "yeniden doğmak için izin ister" ve bir zaman gelecek ki "geldiği yere dönmesi emredilecek ve batıdan doğacaktır" ({hadith:bukhari:3199}). İkisi de *Sahîh-i Buhârî*'dedir.

    **Âlimler secdeyi nasıl okudu?** Farklı okudular ve bu farkları belirtmeye değer:
    - **Hattâbî**, *A'lâmü'l-Hadîs* (Buhârî şerhi): "Onun Arş'ın altında, bizim göremeyeceğimiz ve kavrayamayacağımız bir şekilde durduğu inkâr edilemez" (IslamQA'nın çevirisi). Ona göre bunun nasıl olduğu gayba aittir.
    - **İbn Hacer**, *Fethu'l-Bârî*, birini dayatmadan birkaç okuma sunar: Bu, "onunla görevli meleğin secdesi" olabilir ya da güneş "içinde bulunduğu hâlle", yani boyun eğişiyle "secde eder". İbn Arabî'den aktarır: "Bazı insanlar onun secdesini inkâr etti, oysa sahihtir ve mümkündür"; başkaları ise onu güneşin sürekli boyun eğiş hâli olarak okudu (SeekersGuidance'ın çevirileri).
    - ***Meâriful-Kur'ân*** secdeye "etkili peygamber öğretisinin üslubuna uygun bir benzetmeden ibaret" der: Güneş "her zaman ve her yerde Arş'ın altındadır", dolayısıyla "yörüngesinde hareket ederken her an secde eder" ve "hiçbir duraklamaya ya da araya ihtiyaç duymaz".
    - **İbn Kesîr** (*el-Bidâye ve'n-Nihâye*'de; SeekersGuidance, Kastallânî yoluyla aktarır), "bu hadiste güneşin secde etmek için göklerin üstüne çıktığını söyleyen hiçbir şey yoktur" görüşündedir: Güneş yörüngesinde devam ederken bizim gözümüzden batar.

    **Müfessirlerin söylemedikleri.** Burada okunan tefsirlerin hiçbiri güneşin bir galaksinin içinde hareket ettiğini anlatmaz. Kozmolojileri kendi zamanlarınınkiydi; İbn Kesîr yörüngeleri "gökte" olarak okur.
  en: |-
    **Ibn Kathir on "toward its stopping point".** He gives two views. The first, place: it "refers to its fixed course of location, which is beneath the Throne". The second, time: "this refers to when the sun's appointed time comes to an end, which will be on the Day of Resurrection", with Qatada: "It has an appointed time and it will not go beyond that." He also reports that Ibn Masʿud and Ibn ʿAbbas recited the verse as "with no fixed course" (*lā mustaqarra lahā*), which he explains as "never slowing down or stopping". The same page also has his description of the Throne: "a dome supported by legs or pillars, carried by the angels, and it is above the universe", and "the Throne is the roof of creation and it is not a sphere as many astronomers claim" (surahquran.com, 36:38). That is the cosmology of his time.

    **Al-Jalālayn.** "to its resting-place in other words it does not overstep it", and "its running is the ordaining of the Mighty in His kingdom the Knower of His creation".

    ***Maʿārif al-Qurʾān*.** The word "is used to denote place of rest as well as time of rest"; on the time view, the sun reaches "the end of its movement already determined - and that time is the Day of Doom"; on the place view, it is "a place where one orbit of the movement of the sun stands completed".

    **On the moon and the orbits.** Ibn Kathir: the moon wanes "until it appears like the old dried curved date stalk", which Ibn ʿAbbas explains as the stem joining the date cluster to the tree. "Each in an orbit" means "floating, i.e., revolving, in their orbits in the heaven". He cites Ibn ʿAbbas "and others among the Salaf" (the earliest generations): "In an orbit like the arc of a spinning wheel", and lists Ibn ʿAbbas, ʿIkrima, al-Dahhak, al-Hasan, Qatada and ʿAtaʾ al-Khurasani for the "floating, revolving" reading. On "nor does the night overtake the day", Mujahid says: "They seek one another rapidly"; Ibn Kathir explains that "there is no gap between night and day; each of them follows the other with no interval".

    **The hadith of the sun's prostration.** Abu Dharr (ra) reports that at sunset the Prophet (pbuh) asked him, "O Abu Dharr! Do you know where the sun sets?" and said: "It goes and prostrates underneath (Allah's) Throne", then recited 36:38 ({hadith:bukhari:4802}). In the fuller report, it "takes the permission to rise again", and a time will come when "it will be ordered to return whence it has come and so it will rise in the west" ({hadith:bukhari:3199}). Both are in Sahih al-Bukhari.

    **How scholars read the prostration.** They differ, and the differences are worth stating:
    - **Al-Khattabi**, *Aʿlām al-Ḥadīth* (commentary on al-Bukhari): "It cannot be denied that it halts beneath the Throne, in a manner that we cannot see or comprehend" (IslamQA's translation). For him the manner belongs to the unseen.
    - **Ibn Hajar**, *Fatḥ al-Bārī*, offers several readings without insisting on one: it may be "the prostration of the angel charged with it", or the sun "prostrates by the state it is in", that is, by its submission. He reports Ibn al-ʿArabi: "Some people denied its prostration, though it is sound and possible", while others read it as the sun's permanent state of subjection (SeekersGuidance's renderings).
    - ***Maʿārif al-Qurʾān*** calls the prostration "simply a similitude in consonance with the mores of effective prophetic teaching": the sun "is nowhere but under the ʿArsh, at all times and at every place", so it "at every moment while moving on its orbit keeps offering sajdah" and "needs no pause or break".
    - **Ibn Kathir** (in *al-Bidāya wa al-Nihāya*, cited by SeekersGuidance through al-Qastallani) holds that "nothing in this hadith says the sun ascends above the heavens to prostrate": it sets from our sight while continuing in its orbit.

    **What the commentators did not say.** None of the commentaries read here describes the sun moving through a galaxy. Their cosmology was that of their time; Ibn Kathir reads the orbits as "in the heaven".
howItWorks:
  tr: |-
    Her madde âyetlerdeki bir ifadeye bağlanır.
    - **"Ona menziller tayin ettik" (36:39).** [Established] Ay yıldızlara göre gökyüzünü "yaklaşık 27,3 günde" bir kez dolaşır, ama "Güneş'e göre gök küresinde aynı noktaya dönmesi 29,5 gün sürer" (NASA StarChild). Fark, Dünya'nın bu arada kendi yörüngesinde ilerlemiş olmasından doğar; bu yüzden Ay'ın Güneş'le yeniden hizalanması için iki günden biraz fazlasına ihtiyacı vardır. Evreler Güneş–Dünya–Ay açısına bağlıdır; dolayısıyla yeni aydan yeni aya bütün bir evre döngüsü 29,5 günlük aydır. Bu, kamerî (Hicrî) ayın uzunluğudur: 29 ya da 30 gün.
    - **"Nihayet o eski hurma salkımının çöpü gibi (yay haline) dönmüştür" (36:39).** [Established] Yeni aydan önce ve sonra, aydınlık yarının yalnızca ince, kıvrık bir kenarı bize döner: âyetin kurumuş bir hurma sapına benzettiği hilal.
    - **"Güneş… akıp gidiyor" (36:38).** [Established] Güneş sabit değildir. Güneş sistemini galaksimizin merkezi etrafında ortalama yaklaşık "230 km/s (828.000 km/sa)" hızla taşır (*Wikipedia*, "Galactic year", NASA StarChild'a atıfla, Şubat 2000). NASA StarChild ekler: "Samanyolu etrafında bir tam turu tamamlamamız yine de yaklaşık 230 milyon yıl sürer!" (*Wikipedia* "yaklaşık 225 milyon Dünya yılı" der, Leong 2002'ye atıfla.)
    - **"Ne de gece gündüzü geçebilir" (36:40).** [Established] Dünya döndükçe gündüz ve gece birbirini izler; her an Dünya'nın bir yarısında gündüz, öbür yarısında gecedir.
    - **Şüphecinin hadisle ilgili noktası.** [Established] Aynı dönüş yüzünden Güneş her an bir yerde batar, başka bir yerde doğar. (Bunun güneşin secdesi hadisi için ne anlama geldiği burada değil, "Dürüst notlar"da tartışılıyor.)
  en: |-
    Each point is tied to a phrase in the verses.
    - **"We have determined for it phases" (36:39).** [Established] The Moon goes once around the sky relative to the stars "in about 27.3 days", but "takes 29.5 days to return to the same point on the celestial sphere as referenced to the Sun" (NASA StarChild). The difference arises because the Earth has moved along its own orbit in the meantime, so the Moon needs just over two more days to line up with the Sun again. Phases depend on the Sun–Earth–Moon angle, so a full cycle of phases, new moon to new moon, is the 29.5-day month. That is the length of a lunar (Islamic) month: 29 or 30 days.
    - **"Until it returns [appearing] like the old date stalk" (36:39).** [Established] Before and after new moon, only a thin curved edge of the lit half faces us: the crescent the verse compares to a dried date stalk.
    - **"The sun runs" (36:38).** [Established] The Sun is not fixed. It carries the solar system around the centre of our galaxy at an average speed of about "230 km/s (828,000 km/h)" (*Wikipedia*, "Galactic year", citing NASA StarChild, February 2000). NASA StarChild adds that "it still takes us about 230 million years to make one complete orbit around the Milky Way!" (*Wikipedia* gives "approximately 225 million Earth years", citing Leong 2002.)
    - **"Nor does the night overtake the day" (36:40).** [Established] Day and night follow each other as the Earth turns; at every moment it is day on one half of the Earth and night on the other.
    - **The skeptic's point about the hadith.** [Established] Because of the same rotation, the Sun is always setting somewhere and rising somewhere else. (What this means for the hadith of the sun's prostration is discussed in "Honest notes", not here.)
reflection:
  tr: |-
    Bu âyetler güvenilebilecek bir gökyüzünü anlatır. Gece gündüzden bir elbise gibi soyulur. Güneş "akıp gidiyor" ve başıboş dolaşmaz. Ay evrelerinden geçerek büyür ve küçülür ve ince ve kıvrık olarak geri döner, "eski hurma salkımının çöpü gibi" (36:39). Hiçbir şey bir başkasını geçmez: "onların her biri kendi yörüngesinde yüzerler" (36:40).

    Âyetler bu düzene bir ad verir: "çok güçlü ve her şeyi bilen Allah'ın takdiri" (36:38). Müslümanlar her gün onun içinde yaşar. Beş vakit namaz güneşi izler. Ay hilalle başlar, Ramazan da öyle.

    Müfessirler bizim astronomimizi paylaşmıyordu ve bu sayfa paylaşıyormuş gibi yapmıyor. *Müstekarr*ı Arş'ın altında bir yer ya da zamanın sonu olarak okudular; güneşin "secde"sinin ne anlama geldiği konusunda ayrıldılar. Üzerinde birleştikleri ve hâlâ geçerli olan şey, gökyüzünün itaatkâr, düzenli ve verilmiş olduğudur.

    Bir hayat için de bir ders var; burada bir tefekkür olarak sunuluyor. Âyetteki her ışık kendi yolunu tutar ve bir başkasının yerini almaya çalışmaz: "Ne güneşin aya çatması yaraşır." İnsan da aynısını yapmakta huzur bulabilir.
  en: |-
    These verses describe a sky that can be trusted. Night comes off the day like a garment. The sun "runs", and does not wander. The moon grows and shrinks through its phases and comes back, thin and curved, "like the old date stalk" (36:39). Nothing overtakes anything else: "each, in an orbit, is swimming" (36:40).

    The verses give a name to that order: "the determination of the Exalted in Might, the Knowing" (36:38). Muslims live inside it every day. The five prayers follow the sun. The month begins with the crescent, and so does Ramadan.

    The commentators did not share our astronomy, and this page does not pretend they did. They read "stopping point" as a place beneath the Throne, or as the end of time; they disagreed about what the sun's "prostration" means. What they agreed on, and what still holds, is that the sky is obedient, regular and given.

    There is a lesson for a life, too, offered here as reflection. Each light in the verse keeps to its own course and does not try to take another's place: "It is not allowable for the sun to reach the moon." A person can find peace in doing the same.
honestNotes:
  - en: '**The popular claim.** A widely shared article says "the Quran stated 1400 years ago that the sun and the stars moved; this proves that the Quran is the word of Allah", and that the sun moves "faster than 720.000 km an hour… toward the star Vega on an orbit called the Solar Apex" (AboutIslam, Discovering Islam Team, 2017; no source is given for the figures).'
    tr: "**Popüler iddia.** Yaygın olarak paylaşılan bir makale, \"Kur'an'ın 1400 yıl önce güneşin ve yıldızların hareket ettiğini söylediğini; bunun Kur'an'ın Allah'ın kelamı olduğunu ispat ettiğini\" ve güneşin \"saatte 720.000 km'den hızla… Güneş Apeksi denen bir yörüngede Vega yıldızına doğru\" hareket ettiğini söyler (AboutIslam, Discovering Islam Team, 2017; rakamlar için hiçbir kaynak verilmez)."
  - en: |-
      **Weighing it.**
        - "The sun runs" fits the fact that the Sun moves through the galaxy, and a reader may notice that.
        - But the verse does not mention a galaxy, and the commentators read here did not read it that way: for them, the sun's running was its daily and yearly course across the sky.
        - People in the seventh century already saw the sun move across the sky every day; a verse saying "the sun runs" was not, to them, a hidden claim.
        - The claim also uses "proves", which this site does not. The fair statement: the verse's words are compatible with what we now know; they are not a prediction of it.
    tr: |-
      **Değerlendirme.**
        - "Güneş… akıp gidiyor" ifadesi Güneş'in galakside hareket ettiği gerçeğine uyar ve bir okuyucu bunu fark edebilir.
        - Ama âyet bir galaksiden söz etmez ve burada okunan müfessirler onu böyle okumadı: Onlar için güneşin akışı, gökyüzündeki günlük ve yıllık yoluydu.
        - Yedinci yüzyıldaki insanlar güneşin her gün gökyüzünde hareket ettiğini zaten görüyordu; "güneş akıp gidiyor" diyen bir âyet onlar için gizli bir iddia değildi.
        - İddia ayrıca bu sitenin kullanmadığı "ispat eder" kelimesini kullanır. Adil ifade: Âyetin sözleri bugün bildiklerimizle bağdaşır; onların bir kehaneti değildir.
  - en: "**The hadith, stated plainly.** Bukhari 3199 and 4802 are *ṣaḥīḥ* reports in which the sun, after setting, \"goes and prostrates underneath (Allah's) Throne\" and asks permission to rise. A skeptic's objection is real: the sun is always rising somewhere. The answers differ. Al-Khattabi leaves the manner to the unseen. Ibn Hajar allows a figurative reading (submission, or the prostration of its angel). *Maʿārif al-Qurʾān* calls it a similitude and says the sun is always beneath the Throne, so its prostration \"needs no pause or break\". *Limit:* a reader who takes the hadith's words as a physical sequence will find a conflict with astronomy; these answers resolve it only by reading the prostration as non-physical or unknowable. The page shows the hadith and the readings rather than choosing for the reader."
    tr: "**Hadis, açıkça.** Buhârî 3199 ve 4802, güneşin battıktan sonra \"gidip (Allah'ın) Arş'ının altında secde ettiği\" ve doğmak için izin istediği *sahih* rivayetlerdir. Bir şüphecinin itirazı gerçektir: Güneş her an bir yerde doğmaktadır. Cevaplar farklıdır. Hattâbî bunun nasıl olduğunu gayba bırakır. İbn Hacer mecazi bir okumaya izin verir (boyun eğiş ya da meleğinin secdesi). *Meâriful-Kur'ân* ona bir benzetme der ve güneşin her zaman Arş'ın altında olduğunu, dolayısıyla secdesinin \"hiçbir duraklamaya ya da araya ihtiyaç duymadığını\" söyler. *Sınır:* Hadisin sözlerini fiziksel bir sıra olarak alan bir okuyucu astronomiyle bir çelişki bulacaktır; bu cevaplar çelişkiyi ancak secdeyi fiziksel olmayan ya da bilinemez olarak okuyarak çözer. Sayfa okuyucu adına seçmek yerine hadisi ve okumaları gösterir."
  - en: '**The Throne passage.** Ibn Kathir calls the Throne "a dome" and "not a sphere as many astronomers claim". The quotation is correct (surahquran.com, 36:38). That is his cosmology, and the page is right to show it.'
    tr: "**Arş pasajı.** İbn Kesîr Arş'a \"bir kubbe\" ve \"pek çok astronomun iddia ettiği gibi bir küre değil\" der. Alıntı doğrudur (surahquran.com, 36:38). Bu onun kozmolojisidir ve sayfanın onu göstermesi doğrudur."
