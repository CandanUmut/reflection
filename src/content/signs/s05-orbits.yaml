followUps:
  - q:
      en: Did classical scholars think the sun goes around the earth?
    a:
      en: Classical cosmology was geocentric, and Ibn Kathir's comments reflect it; this page does not claim the verse described modern astronomy (see the honest note).
  - q:
      en: What does the sun's "prostration" mean?
    a:
      en: Many scholars read it as obedience to God's order, not a physical bow.
  - q:
      en: The hadith says the sun prostrates beneath the Throne after it sets — but the sun is always rising somewhere. How can that be?
    a:
      en: "This is a real objection. Ibn Kathir's own answer is that the sun is always beneath the Throne: \"Wherever it goes, it is beneath the Throne\". Many scholars read the prostration as obedience, not a physical event at one place. A reader may or may not find this convincing; the page shows the hadith and the readings rather than hiding them."
