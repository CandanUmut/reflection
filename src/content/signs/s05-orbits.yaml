title:
  tr: Her biri bir yörüngede güneş ve ay
  en: Sun and moon, each in an orbit
summary:
  tr: Ay her yıl yaklaşık 3,8 cm uzaklaşıyor. Âyetler ölçülü, güvenilir bir düzeni vurgular.
  en: 'Night, day, sun and moon keep a measured order: "each, in an orbit, is swimming" (36:40). That order makes calendars and prayer times possible.'
verseNotes:
  tr: Güneş "bir karar yerine doğru akar" (36:38); "her biri bir yörüngede yüzer" (36:40).
  en: The sun runs "to a resting place" (36:38); "each swims in an orbit" (36:40).
tafsir:
  tr: |
    - İbn Kesîr, güneşin Arş'ın altında secde ettiğine dair hadisi aktarır (Buhârî 3199, 4802).
    - İbn Mes'ûd ve İbn Abbâs'ın okumasını da aktarır: güneşin "karar yeri yoktur".
    - Daha sonraki âlimler secdeyi itaat olarak okudu. [Scholarly]
  en: "**Two views of \"its fixed course\".** Ibn Kathir reports two views on \"the sun runs on its fixed course for a term\". The first is that it refers to a place \"beneath the Throne\"; he describes the Throne as \"a dome supported by legs or pillars\" and says it is \"not a sphere as many astronomers claim\" — the cosmology of his time. The second is that it runs until an appointed term, the end of the world. He cites the hadith of the sun prostrating beneath the Throne (Bukhari 3199, 4802) and the reading of Ibn Mas'ud and Ibn 'Abbas that the sun has \"no resting place\". Later scholars read the prostration as obedience. [Scholarly]"
howItWorks:
  tr: |
    [Established]

    - 23,4°'lik eksen eğikliği mevsimleri oluşturur.
    - Ay, Dünya'nın çevresini 27,3 günde dolanır; evreleri her 29,5 günde bir tekrarlanır.
    - Güneş galaksinin çevresini yaklaşık 230 milyon yılda dolanır.
    - NASA JPL: Apollo 11, 14 ve 15'in bıraktığı yansıtıcılara lazerle yapılan ölçümler, Ay'ın her yıl yaklaşık 3,8 cm (1,5 inç) uzaklaştığını ve günlerin her yüzyılda yaklaşık 1,7 milisaniye uzadığını gösteriyor.
  en: |
    [Established]

    - A 23.4° axial tilt gives seasons.
    - The Moon orbits in 27.3 days; its phases repeat every 29.5 days.
    - The Sun circles the galaxy in about 230 million years.
    - NASA JPL: laser ranging off the Apollo 11, 14 and 15 retroreflectors shows the Moon receding about 3.8 cm (1.5 inches) a year, with days lengthening about 1.7 ms per century.
reflection:
  tr: Âyetler ölçülü, güvenilir bir düzeni (*takdîr*) vurgular; takvimler ve namaz vakitleri bu düzene dayanır.
  en: "Night, day, sun and moon keep their order: \"each, in an orbit, is swimming\" (36:40). The verses call this \"the determination of the Exalted in Might, the Knowing\" (36:38). That order is what makes calendars, prayer times and fasting possible: Muslims time the month by the moon's phases and the prayers by the sun. The classical commentators did not share our astronomy, and this page does not pretend they did. What they saw, and what still holds, is that the sky is reliable, and that a reliable sky is a gift people did not arrange."
honestNotes:
  - tr: Âyet "galaktik yörünge" öngörüsünde bulunmadı; klasik kozmoloji yer merkezliydi. Hadis burada gizlenmez; nasıl yorumlandığı açıklanır.
    en: The verse made no "galactic orbit" prediction; classical cosmology was geocentric. The hadith is not hidden here; how it has been interpreted is explained.
