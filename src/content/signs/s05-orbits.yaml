followUps:
  - q:
      en: Did classical scholars think the sun goes around the earth?
    a:
      en: Classical cosmology was geocentric, and Ibn Kathir's comments reflect it; this page does not claim the verse described modern astronomy (see the honest notes).
  - q:
      en: What does the sun's "prostration" mean?
    a:
      en: Many scholars read it as obedience to God's order, not a physical bow.
