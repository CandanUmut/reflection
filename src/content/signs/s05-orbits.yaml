awe:
  tr: |-
    - Kamerî ay (29,5 gün), Ay'ın gökyüzündeki turundan (27,3 gün) iki gün daha uzundur, çünkü Dünya'nın kendisi hareket ediyor (NASA StarChild).
    - Güneş galaksi etrafında yaklaşık 230 km/s hızla hareket eder; bir turu yaklaşık 230 milyon yıl sürer (NASA StarChild).
    - Âyetin kurumuş bir hurma sapına benzettiği hilal, görülmesiyle her Hicrî ayın başladığı şekildir.
  en: |-
    - The lunar month (29.5 days) is two days longer than the Moon's trip around the sky (27.3 days), because the Earth itself is moving (NASA StarChild).
    - The Sun moves at about 230 km/s around the galaxy, one circuit in about 230 million years (NASA StarChild).
    - The crescent the verse compares to a dried date stalk is the same shape whose sighting begins each Islamic month.
legacyHonestNotes:
  - tr: Âyet "galaktik yörünge" öngörüsünde bulunmadı; klasik kozmoloji yer merkezliydi. Hadis burada gizlenmez; nasıl yorumlandığı açıklanır.
    en: The verse made no "galactic orbit" prediction; classical cosmology was geocentric. The hadith is not hidden here; how it has been interpreted is explained.
