followUps:
  - q:
      en: What is *farth*?
    a:
      en: The contents of the stomach and gut — digested food. Saheeh renders it "excretion".
  - q:
      en: What does "pure milk" mean here?
    a:
      en: Free of any mixing with blood or gut contents (al-Tabari), "free of murkiness" (al-Saʿdi); in whiteness, taste and sweetness (Ibn Kathir).
  - q:
      en: Did the Quran reveal how milk is made?
    a:
      en: It describes milk coming from between food and blood. Ibn Kathir already explained it as digested food sending blood to the veins and milk to the udder. The details of milk-making cells are modern physiology, not in the verse.
  - q:
      en: How much blood does it take to make milk?
    a:
      en: In sows, about 470 litres of blood per kilogram of milk (Renaudeau et al., 2002); for cows the page's Cornell source gives about 500 litres per litre.
  - q:
      en: Why is it called a "lesson"?
    a:
      en: 'Because it points beyond itself: to "the wisdom, power, mercy and kindness of the Creator" (Ibn Kathir).'
