slugs:
  tr: sut
  en: milk
order: 2
theme: animals
verses:
  - 16:66
title:
  tr: '"Fışkı ile kan arasından" süt'
  en: Milk "from between digested food and blood"
summary:
  tr: Bir litre süt için ineğin memesinden yaklaşık 500 litre kan geçer.
  en: About 500 litres of blood pass through a cow's udder for every litre of milk.
tafsir:
  tr: İbn Kesîr ve Kurtubî, pis şeylerin arasından saf sütün çıkmasını vurgular.
  en: '**Pure from between the impure.** Ibn Kathir explains that cattle — "camels, cows and sheep" — are "a lesson", "a sign and an evidence of the wisdom, power, mercy and kindness of the Creator". On "from between excretions and blood, pure milk", he notes that it is "free of blood" and of what surrounds it. Al-Qurtubi makes the same point: pure milk coming out from among impurities.'
howItWorks:
  tr: |
    [Established]

    - Besinler bağırsaktan kana, kandan da memenin alveollerine geçer; oradaki hücreler laktoz, kazein ve yağ üretir.
    - CSIRO Publishing'e (2005) göre bir litre süt için memeden yaklaşık 500 litre kan geçer. Cornell'e göre günde 60 litre süt veren bir inek, meme bezinden 30.000 litre kan dolaştırır.
  en: |
    [Established]

    - Nutrients pass from gut to blood to the udder's alveoli, where cells synthesize lactose, casein and fat.
    - CSIRO Publishing (2005) puts it at about 500 L of blood through the udder per litre of milk. Cornell notes that a cow producing 60 litres a day circulates 30,000 litres of blood through the mammary gland.
awe:
  tr: Bir litre süt için geçen kan miktarı 400 ile 600 litre arasındadır.
  en: The range is 400–600 L of blood per litre of milk.
reflection:
  tr: Âyetteki "arasından" ifadesi, bağırsaktan kana, kandan bezeye giden gerçek yola uyar.
  en: 'Milk comes out "between excretion and blood" (16:66), and yet it is pure and good to drink. The verse calls this "a lesson". In the body, nutrients pass from gut to blood to the udder, where cells make something new out of what they receive. Something clean and nourishing comes from among things we would never drink. A reader can take the lesson inward too: good can come out of a mixed and messy life, if it passes through the right process.'
honestNotes:
  - tr: Âyet bir hücre biyolojisi metni değildir. Uygun düşen bir imgedir. Süt ve kan rakamları da yaklaşık değerlerdir.
    en: The verse is not a cell-biology text. It is a fitting image. The milk and blood figures are also approximations.
visualizations:
  - id: ideas
    tr: Litre litre kanı sayan bir sayaçla besinlerin yolculuğu canlandırması.
    en: A nutrient-journey animation with a counter of litres of blood.
