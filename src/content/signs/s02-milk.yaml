followUps:
  - q:
      en: Does the verse describe milk production scientifically?
    a:
      en: No. It is an image of purity coming from between impurities; the physiology is described separately, with its limits, in "How it works" and the honest notes.
  - q:
      en: Why does it say "its belly" and elsewhere "their bellies"?
    a:
      en: Ibn Kathir says the singular can refer to one animal or the whole species; "either way is plausible".
