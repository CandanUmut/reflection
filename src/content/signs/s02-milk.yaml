followUps:
  - q:
      en: Does the verse describe milk production scientifically?
    a:
      en: No. It is an image of purity coming from between impurities. The physiology is described separately, with its limits, in "How it works".
  - q:
      en: Why does it say "its bellies" and elsewhere "their bellies"?
    a:
      en: Ibn Kathir says the singular pronoun can refer to one animal or to the whole species.
  - q:
      en: Is milk really made from blood?
    a:
      en: Its raw materials come from the blood, but milk is not blood. Cells in the udder build milk sugar, protein and fat from what the blood brings (Cornell).
  - q:
      en: What is the "lesson" (*ʿibra*)?
    a:
      en: For Ibn Kathir, a sign of the Creator's "wisdom, power, mercy and kindness". The verse invites the reader to pass from the drink to the Giver.
