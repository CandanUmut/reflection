legacyHonestNotes:
  - tr: |
      - Dilin nasıl evrimleştiği bilim insanları arasında hâlâ tartışmalıdır. Hiçbir kuram kesinleşmiş değildir.
      - Âyet, yalnızca konuşulan seslerden daha geniş olan *beyân*dan, açık ifadeden söz eder (yazıyı ve işaret dilini de içerir).
    en: |-
      - How language evolved is still debated among scientists. No single theory is settled.
      - The verse speaks of *bayān*, clear expression, which is broader than spoken sounds alone (it includes writing and sign language).
followUps:
  - q:
      en: Why is speech counted as a blessing?
      tr: Konuşma neden bir nimet sayılır?
    a:
      en: Al-Raḥmān lists it among the first mercies (55:3–4). Ibn Kathir explains it as God making it easy to speak and form letters with the mouth.
      tr: Rahmân Sûresi onu ilk rahmetler arasında sayar (55:3–4). İbn Kesîr bunu, Allah'ın konuşmayı ve ağızla harf oluşturmayı kolaylaştırması olarak açıklar.
  - q:
      en: What are "the two ways" (90:10)?
      tr: 90:10'daki "iki yol" nedir?
    a:
      en: '"The good and the evil", said Ibn Masʿud (ra), via Ibn Kathir.'
      tr: İbn Mes'ûd'a (r.a.) göre "iyi ve kötü" (İbn Kesîr yoluyla).
  - q:
      en: Did Adam (pbuh) learn a language?
      tr: Hz. Âdem (a.s.) bir dil mi öğrendi?
    a:
      en: 'The verse says he was taught "the names - all of them". Ibn ʿAbbas: the names people use, down to the plate and the pot; other reports say the names of the angels or of his descendants.'
      tr: 'Âyet ona "isimlerin hepsini" öğrettiğini söyler. İbn Abbâs: insanların kullandığı isimler, tabağa ve tencereye kadar; başka rivayetler meleklerin ya da zürriyetinin isimleri der.'
  - q:
      en: How do babies learn to speak?
      tr: Bebekler konuşmayı nasıl öğrenir?
    a:
      en: They start able to hear the sound differences of all languages and, by about 12 months, have tuned in to their own (Kuhl). They learn best from live people (Kuhl, 2004).
      tr: Bütün dillerin ses farklarını duyabilerek başlarlar ve yaklaşık 12 aylıkken kendi dillerine uyum sağlamış olurlar (Kuhl). En iyi canlı insanlardan öğrenirler (Kuhl, 2004).
