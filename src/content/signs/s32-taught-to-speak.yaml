followUps:
  - q:
      en: Why is speech counted as a blessing?
    a:
      en: "The verses join speech with moral choice: being able to explain is tied to being responsible."
  - q:
      en: Did Adam (pbuh) learn a language?
    a:
      en: Commentators differ on what "the names" were; Ibn Kathir reads it as the names of everything. The science of language is in "How it works".
