slugs:
  tr: konusmayi-ogretti
  en: taught-to-speak
order: 32
theme: human
title:
  tr: Konuşmayı öğretilen insan
  en: The human being taught to speak
verses:
  - 55:3-4
  - 90:8-10
  - 2:31
summary:
  tr: Dil düşünmemizi, dua etmemizi, öğretmemizi ve sevmemizi sağlar; onunla birlikte söylediklerimizin sorumluluğu gelir.
  en: Language lets us think, pray, teach and love, and with it comes responsibility for what we say.
verseNotes:
  tr: "55:4'te *el-beyân*: açık ifade."
  en: "In 55:4, *al-bayān*: clear speech."
tafsir:
  tr: |
    [Scholarly]

    - *El-beyân*, zihindekini konuşmayla ifade etme yeteneği, daha geniş olarak da açıklama ve ayırt etme yeteneği olarak okunur (Râzî, İbn Kesîr).
    - 90:8–10 görmenin ve konuşmanın araçlarını sayar, ardından ahlâkî seçimi ("iki yol"). Konuşma sorumlulukla bağlantılıdır.
    - 2:31, insana şeyleri adlandırma ve kavram oluşturma yeteneği verildiği şeklinde okunur; bu, onu bilgide meleklerin üstüne çıkardı.
  en: "**Speech, choice and names.** On \"[And] taught him eloquence\" (55:4), Ibn Kathir quotes al-Hasan: \"Eloquent speech\", and explains God teaching people \"to speak and pronounce letters with the various parts of the mouth, such as the alveolar bridge, the tongue and the lips\". *Al-bayan* is read as the ability to express what is in the mind, and more broadly to explain and distinguish (al-Razi, Ibn Kathir). 90:8–10 lists the tools of seeing and speaking, then moral choice; on \"the two ways\", Ibn Kathir quotes Ibn Mas'ud: \"The good and the evil.\" On 2:31, he says God taught Adam (pbuh) \"the names of everything\", which showed \"Adam's superiority over them in knowledge\" — the capacity to name things and form concepts."
howItWorks:
  tr: |
    [Established]

    - İnsanlar, alçalmış bir gırtlak, dilin ince kontrolü ve birlikte çalışan dudaklar ve dişler sayesinde çok geniş bir ses yelpazesi çıkarabilir.
    - Bebekler herhangi bir dilin sesleri arasındaki farkları duyabilecek şekilde doğar. Yaklaşık 10–12 aylıkken çevrelerindeki dilin seslerine ayarlanırlar.
    - Çocuklar okul çağına kadar, büyük ölçüde resmî bir öğretim olmadan binlerce kelime öğrenir.
    - Yaklaşık 7.000 yaşayan dil vardır ve hepsi karmaşık düşünceyi ifade etmeye tamamen yeterlidir.
  en: |-
    [Established]

    - Humans can make a huge range of speech sounds thanks to a lowered larynx, fine tongue control, and lips and teeth working together.
    - Babies are born able to hear the differences between sounds of any language. By about 10–12 months, they tune in to the sounds of the language around them.
    - Children learn thousands of words by school age, largely without formal teaching.
    - There are about 7,000 living languages, all fully capable of expressing complex thought.
awe:
  tr: |
    - Bir bebek, kendi diline ayarlanmadan önce, anne babasının artık duyamadığı ses farklarını ayırt edebilir.
    - Konuşmak, yaklaşık 100 kasın eş güdümlü kontrolünü gerektirir.
  en: |-
    - A baby can tell apart sound contrasts that its parents can no longer hear, before tuning in to its own language.
    - Speech requires coordinated control of about 100 muscles.
reflection:
  tr: |
    *Er-Rahmân* sûresi konuşmayı, insanın yaratılışının hemen ardından, rahmetin ilk ikramları arasında sayar. Dil düşünmemizi, dua etmemizi, öğretmemizi ve sevmemizi sağlar; onunla birlikte söylediklerimizin sorumluluğu gelir.
  en: The surah *al-Raḥmān* lists speech among the first gifts of mercy, right after creating the human. Language lets us think, pray, teach and love, and with it comes responsibility for what we say.
honestNotes:
  - tr: |
      - Dilin nasıl evrimleştiği bilim insanları arasında hâlâ tartışmalıdır. Hiçbir kuram kesinleşmiş değildir.
      - Âyet, yalnızca konuşulan seslerden daha geniş olan *beyân*dan, açık ifadeden söz eder (yazıyı ve işaret dilini de içerir).
    en: |-
      - How language evolved is still debated among scientists. No single theory is settled.
      - The verse speaks of *bayān*, clear expression, which is broader than spoken sounds alone (it includes writing and sign language).
visualizations:
  - id: ideas
    tr: |
      - Bir kelimeyi oluşturmak için dilin, dudakların, gırtlağın ve nefesin birlikte çalıştığını gösteren yandan bir baş çizimi.
      - Bir "kelimeler dünyası" küresi: dünya dillerinden birinde bir selamı duymak için bir bölgeye dokunun.
    en: |-
      - A side-view head diagram showing tongue, lips, larynx and breath working together to make a word.
      - A "world of words" globe: tap a region to hear a greeting in one of the world's languages.
