  en: taught-to-speak
order: 32
theme: human
title:
  tr: Konuşmayı öğretilen insan
  en: The human being taught to speak
verses:
  - 55:3-4
  - 90:8-10
  - 2:31
summary:
  tr: Rahmân Sûresi konuşmayı Rahmân'ın ilk armağanları arasında sayar ("İnsanı yarattı. Ona beyanı öğretti." 55:3–4); 90:8–10 ise görmenin ve konuşmanın araçlarını "iki yol" arasındaki ahlaki seçime bağlar.
  en: Sura al-Raḥmān names speech among the first gifts of the Most Merciful — "Created man, [And] taught him eloquence" (55:3–4) — and 90:8–10 ties the tools of seeing and speaking to the moral choice between "the two ways".
verseNotes:
  tr: |-
    "İnsanı yarattı. Ona beyanı öğretti." (55:3–4), Rahmân Sûresi'nde; Tanzil sınıflandırmasında Medenî. Sûre, Rahmân'ı ve O'nun Kur'an'ı öğretmesini anarak açılır (55:1–2; kullanılan doğrulanmış veride olmadıkları için burada alıntılanmadı); insanı yaratmak ve *beyân*ı öğretmek bunların ardından gelir.

    "Biz ona iki göz vermedik mi? Bir dil ve iki dudak? Ona iki yolu gösterdik." (90:8–10), Mekkî, Beled Sûresi'nde.

    "Ve Âdem'e isimlerin hepsini öğretti, sonra onları meleklere gösterip: "Haydi davanızda sadıksanız bana şunları isimleriyle haber verin." dedi." (2:31), Medenî.

    - **Anahtar kelimeler.** *El-beyân* (55:4, "beyan"; Saheeh: "eloquence", güzel ve açık konuşma): açık ifade, içte olanı açığa çıkarmak. *En-necdeyn* (90:10, "iki yol"): kelimenin tam anlamıyla iki yüksek yol. *El-esmâ* (2:31, "isimler").
    - **Kime hitap ediyorlar?** 55, dinleyenlerine Allah'ın nimetleri hakkında tekrarlanan bir soruyla hitap eder; 90 genel olarak insandan söz eder.
  en: |-
    "Created man, [And] taught him eloquence" (55:3–4), in Sura al-Raḥmān, Medinan in the Tanzil classification. The sura opens by naming the Most Merciful and His teaching of the Quran (55:1–2, not quoted here because they were not in the verified data used); creating the human and teaching *al-bayān* come next.

    "Have We not made for him two eyes? And a tongue and two lips? And have shown him the two ways?" (90:8–10), Meccan, in Sura al-Balad.

    "And He taught Adam the names - all of them. Then He showed them to the angels and said, 'Inform Me of the names of these, if you are truthful'" (2:31), Medinan.

    - **Key words.** *Al-bayān* (55:4, "eloquence"): clear expression, making plain what is inside. *Al-najdayn* (90:10, "the two ways"): literally two raised paths. *Al-asmāʾ* (2:31, "the names").
    - **Whom they address.** 55 addresses its hearers with a repeated question about God's favours; 90 speaks of the human being in general.
tafsir:
  tr: |-
    **İbn Kesîr, 55:1–4 hakkında.** Açılışı şöyle çerçeveler: "Allah yarattıklarına olan nimetlerini ve rahmetini bildirir." *Beyân* hakkında Hasan-ı Basrî'den aktarır: "Güzel ve açık konuşma." Allah'ın "ağzın çeşitli kısımlarıyla konuşmayı ve harfleri telaffuz etmeyi onlara kolaylaştırmasını" açıklar; diş eti çıkıntısını, dili ve dudakları sayar ve bunu Kur'an'ın öğretilmesine bağlar: "Bu, Allah'ın Kur'an'ı öğretmesine işaret eder."

    ***Celâleyn*, 55:4 hakkında.** "Ona tutarlı konuşmayı, sözü öğretti."

    ***Tenvîrü'l-Mikbâs*, 55:4 hakkında.** "Allah ona her şeyin açıklamasını ilham etti" ve her yaratığın isimlerinden söz eder.

    **Mevdûdî** (modern, 20. yüzyıl) *beyân*ı daha geniş okur; "iyi ile kötü, fazilet ile rezilet arasındaki ayrımı" da kapsadığını söyler.

    **İbn Kesîr, 90:8–10 hakkında.** Gözler "onlarla görsün diye"dir; dil "onunla konuşsun ve içindekini ifade edebilsin diye"; dudaklar "konuşmaya, yemek yemeye, yüzünü ve ağzını güzelleştirmeye" yardım eder. "İki yol": "Bu, iki yola işaret eder"; İbn Mes'ûd (r.a.): "İyi ve kötü." İbn Abbâs aynı görüşte olanlar arasında sayılır. *Tenvîr* 90:9 hakkında: dil, "onunla konuştuğu", dudaklar "birleştirebildiği ya da ayırabildiği".

    **İbn Kesîr, 2:31 hakkında.** İbn Abbâs (Dahhâk yoluyla) isimlerin "insanların kullandığı isimler, insan, hayvan, gök, yer, kara, deniz gibi" olduğunu söyledi; buna "tabağın ve tencerenin isimlerinin" de dahil olup olmadığı sorulunca "Evet" dedi. Mücâhid: "Güvercinin, karganın ve her şeyin ismi." Zeyd b. Eslem'in rivayetinde meleklerin isimleri vardır; *Tenvîr* "bütün zürriyetinin isimleri" der. İbn Kesîr'in kendi özeti: Allah Hz. Âdem'e (a.s.) "her şeyin isimlerini, özel isimlerini, niteliklerinin isimlerini ve ne yaptıklarını" öğretti; bu da "Âdem'in ilimde onlardan üstünlüğünü" gösterdi. *Celâleyn*: İsimler, "onların bilgisi kalbine konarak" öğretildi.

    **Nerede ayrılıyorlar?** *Beyân* konusunda: konuşmanın kendisi (İbn Kesîr yoluyla Hasan; *Celâleyn*), her şeyin açıklaması (*Tenvîr*) ya da modern bir okumada ahlaki ayırt etme (Mevdûdî). 2:31 konusunda: her şeyin isimleri (İbn Abbâs; Mücâhid; İbn Kesîr), meleklerin (Zeyd b. Eslem) ya da Âdem'in zürriyetinin isimleri (*Tenvîr*). 90:10 konusunda, zikredilen erken otoriteler birleşir: iyi ve kötü.
  en: |-
    **Ibn Kathir on 55:1–4.** He frames the opening: "Allah informs of His favors and His mercy for His creatures." He cites al-Hasan al-Basri on *al-bayān*: "Eloquent speech." He explains God "making it easy for them to speak and pronounce letters with the various parts of the mouth", naming the alveolar ridge, the tongue and the lips, and links this to teaching the Quran: "This refers to Allah teaching the Qur'an."

    **Al-Jalālayn on 55:4.** "teaching him the coherent speech utterance."

    **Tanwīr al-Miqbās on 55:4.** "Allah inspired him with the exposition of everything", and it mentions the names of every creature.

    **Mawdudi** (modern, 20th century) reads *al-bayān* more widely, as including "the distinction between good and evil, virtue and vice".

    **Ibn Kathir on 90:8–10.** The eyes are "for him to see with them"; the tongue "for him to speak with, and so that he can express that which is inside of him"; the lips help "with speaking, eating food, and beautifying his face and his mouth." "The two ways": "This refers to the two paths"; Ibn Masʿud (ra): "The good and the evil." Ibn ʿAbbas is listed among those with the same view. *Tanwīr* on 90:9: the tongue "with which he speaks", the lips "which he can join together or separate".

    **Ibn Kathir on 2:31.** Ibn ʿAbbas (via al-Ḍaḥḥāk) said the names were "the names that people use, such as human, animal, sky, earth, land, sea"; asked whether this included "the names of the plate and the pot", he said, "Yes". Mujahid: "The name of the pigeon, the crow and everything." Zayd ibn Aslam's report has the names of angels; *Tanwīr* gives "the names of all his progeny". Ibn Kathir's own summary: God taught Adam (pbuh) "the names of everything, their proper names, the names of their characteristics, and what they do", which showed "Adam's superiority over them in knowledge". Al-Jalālayn: the names were taught by "placing knowledge of them into his heart."

    **Where they differ.** On *al-bayān*: speech itself (al-Hasan via Ibn Kathir; al-Jalālayn), the exposition of everything (*Tanwīr*), or, in a modern reading, moral discernment (Mawdudi). On 2:31: the names of all things (Ibn ʿAbbas; Mujahid; Ibn Kathir), of the angels (Zayd ibn Aslam), or of Adam's descendants (*Tanwīr*). On 90:10, the early authorities cited agree: good and evil.
howItWorks:
  tr: |-
    Her madde "Ona beyanı öğretti" ve "Bir dil ve iki dudak" ifadelerine bağlanır.
    - **Pek çok kas, tek bir cümle.** [Established] Konuşmak, "100'den fazla gırtlak, ağız-yüz ve solunum kasının hassas bir eşgüdümünü gerektirir"; bu kısmen motor korteksteki gırtlak bölgesince kontrol edilir (Simonyan ve Horwitz, *The Neuroscientist*, 2011).
    - **Her dili duyabilecek şekilde doğmak.** [Established] Patricia Kuhl (Washington Üniversitesi): Bebekler, "herhangi bir dilde kullanılan bütün ünsüzler ve ünlüler arasındaki farkları duyabilen" "dünya vatandaşlarıdır"; sonra "kendi dillerinde hangi ses ayrımlarının anlamlı olduğunu öğrenmeleri gerekir": İngilizce "r" ile "l"yi ayırır, Japonca ayırmaz. "12 aylıkken bebekler kuralları zaten kapmıştır" (UW News, 2001, Kuhl'u aktararak). 2004 tarihli derlemesi: "Küçük bebekler bütün ses birimleri arasındaki ince farklara duyarlıdır", ardından "yabancı dil ayrımları için ayırt etme yeteneğinin kaybı" gelir.
    - **Öğrenme sosyaldir.** [Established] "Bebekler başka bir dil konuşan insanlarla etkileşimden daha kolay öğrenir" (Kuhl, 2004). Dil yalnızca duyulmaz, insanlardan öğrenilir.
    - **Pek çok dil.** [Established] "Bugün 7.164 dil kullanılıyor"; "dillerin kabaca %40'ı artık tehlike altında" ve "yalnızca 23 dil dünya nüfusunun yarısından fazlasını oluşturuyor" (Ethnologue).
  en: |-
    Each point is tied to "taught him eloquence" and "a tongue and two lips".
    - **Many muscles, one sentence.** [Established] Speaking "involves a precise coordination of more than 100 laryngeal, orofacial, and respiratory muscles", controlled in part by a region of the motor cortex for the larynx (Simonyan & Horwitz, *The Neuroscientist*, 2011).
    - **Born able to hear every language.** [Established] Patricia Kuhl (University of Washington): infants are "citizens of the world" who "can hear the differences between all the consonants and vowels used in any language"; they then "have to learn which sound distinctions are meaningful in their language" — English separates "r" and "l", Japanese does not. "Already by 12 months, infants have the rules down" (UW News, 2001, reporting Kuhl). Her 2004 review: "Young infants are sensitive to subtle differences between all phonetic units", followed by "The loss of discrimination for foreign-language distinctions".
    - **Learning is social.** [Established] "Infants learn more easily from interactions with human beings speaking another language" (Kuhl, 2004). Language is learned from people, not just heard.
    - **Many tongues.** [Established] "7,164 languages are in use today"; "Roughly 40% of languages are now endangered", and "just 23 languages account for more than half the world's population" (Ethnologue).
awe:
  tr: |-
    - Konuşulan tek bir cümle, zamanında birlikte çalışan 100'den fazla kas gerektirir (Simonyan ve Horwitz).
    - Bir bebek, ilk yaş gününe doğru kendi diline uyum sağlamadan önce, anne babasının artık duyamadığı ses farklarını duyabilir (Kuhl).
    - Bugün 7.000'den fazla dil konuşuluyor; yaklaşık %40'ı tehlike altında (Ethnologue).
  en: |-
    - A single spoken sentence needs more than 100 muscles working in time (Simonyan & Horwitz).
    - A baby can hear sound differences its parents no longer can, before tuning in to its own language around the first birthday (Kuhl).
    - More than 7,000 languages are spoken today; about 40% are endangered (Ethnologue).
reflection:
  tr: |-
    Rahmân Sûresi kısa bir rahmet listesiyle açılır: Kur'an'ın öğretilmesi, insanın yaratılması ve sonra *beyân*, içte olanı açığa çıkarma armağanı. Güneşten ve aydan, yıldızlardan ve ağaçlardan önce sûre konuşmayı anar.

    İbn Kesîr bunu bedende görür: dil, diş eti çıkıntısı ve dudaklarla biçimlenen harfler. Beled Sûresi aynı bedeni bir soruya çevirir: "Biz ona iki göz vermedik mi? Bir dil ve iki dudak? Ona iki yolu gösterdik." Görmenin ve konuşmanın araçları önce gelir; iyi ile kötü arasındaki seçim hemen ardından. Konuşma tarafsız değildir. Söylediğimiz şey iki yoldan birinin ilk adımı olabilir.

    Bilim armağanın ne kadar büyük olduğunu doldurur. Tek bir cümle için yüzden fazla kas zamanında birlikte hareket eder. Bir bebek herhangi bir insan dilinin seslerini duyabilecek şekilde doğar, sonra çevresindeki yüzlerden ve seslerden hangilerinin önemli olduğunu öğrenir. Yedi bin dil duaları, şiirleri, şakaları ve kanunları taşır.

    2:31 en derin katmanı ekler. Hz. Âdem'e (a.s.) "isimlerin hepsi" öğretildi ve İbn Kesîr bunda onun "ilimde … üstünlüğünü" gördü. Bir şeye isim vermek onu anlamaya başlamaktır. Bir mümin için konuştuğumuz her kelime bizim yapmadığımız bir armağanı kullanır ve her kelime tartılacaktır. Tefekkür basittir: onu "iki yol"un daha iyisi için kullanmak.
  en: |-
    Al-Raḥmān opens with a short list of mercies: the teaching of the Quran, the creation of the human, and then *al-bayān*, the gift of making plain what is inside. Before the sun and moon, the stars and the trees, the sura names speech.

    Ibn Kathir sees it in the body: letters shaped by tongue, ridge and lips. Al-Balad turns the same body into a question: "Have We not made for him two eyes? And a tongue and two lips? And have shown him the two ways?" The tools of seeing and speaking come first; the choice between good and evil comes right after. Speech is not neutral. What we say can be the first step on either path.

    Science fills in how great the gift is. More than a hundred muscles move in time for one sentence. A baby is born able to hear the sounds of any human language, then learns, from the faces and voices around it, which ones matter. Seven thousand languages carry prayers, poems, jokes and laws.

    2:31 adds the deepest layer. Adam (pbuh) was taught "the names - all of them", and Ibn Kathir saw in this his "superiority … in knowledge". To name a thing is to begin to understand it. For a believer, every word we speak uses a gift we did not make, and every word will be weighed. The reflection is simple: use it for the better of "the two ways".
honestNotes:
  - en: '**No popular "miracle" claim** about these verses was found in the sources read. The risk is a different one: reading modern linguistics into 55:4 or 2:31. Neither verse describes the larynx, the brain, or how children learn language.'
    tr: "**Okunan kaynaklarda bu âyetler hakkında popüler bir \"mucize\" iddiası bulunamadı.** Risk farklıdır: 55:4'e ya da 2:31'e modern dilbilimi okumak. İki âyet de gırtlağı, beyni ya da çocukların dili nasıl öğrendiğini anlatmaz."
  - en: '**"The names" (2:31).** Commentators differ on what they were. Reading them as "the capacity to form concepts" is a modern reflection, not a classical reading.'
    tr: "**2:31'deki \"isimler\".** Müfessirler onların ne olduğu konusunda ayrılır. Onları \"kavram oluşturma yeteneği\" olarak okumak klasik bir okuma değil, modern bir tefekkürdür."
  - en: "**Bayān and sign language.** Whether *al-bayān* includes writing or sign language is not addressed by the commentators read. It is a reasonable modern extension (deaf people express themselves fully in sign), but should be labelled as one."
    tr: "**Beyân ve işaret dili.** *Beyân*ın yazıyı ya da işaret dilini kapsayıp kapsamadığı okunan müfessirlerce ele alınmaz. Makul bir modern genişletmedir (sağır insanlar kendilerini işaret diliyle tam olarak ifade eder), ama öyle işaretlenmelidir."
