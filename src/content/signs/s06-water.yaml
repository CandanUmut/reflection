verseNotes:
  tr: |-
    "O kâfir olanlar, görmediler mi ki, göklerle yer bitişik bir halde iken biz onları ayırdık. Hayatı olan her şeyi sudan yarattık. Hâlâ inanmıyorlar mı?" (21:30), Mekkî (Enbiyâ Sûresi).

    "İçtiğiniz suya baktınız mı? Buluttan onu siz mi indirdiniz, yoksa indiren biz miyiz? Dileseydik onu tuzlu yapardık. O halde şükretseniz ya!" (56:68–70), Mekkî (Vâkıa Sûresi).

    - **Anahtar kelimeler.** *Ce'alnâ mine'l-mâi külle şey'in hayy*: "Hayatı olan her şeyi sudan yarattık". *El-müzn* (56:69): yağmur bulutları. *Ücâc* (56:70): içilemeyen acı, tuzlu su.
    - **Bağlam.** 21:30, Allah'ı inkâr edenlere yöneltilmiş bir argümanın parçasıdır: Gökler, yer ve hayatın kendisi Yaratıcılarını gösterir. 56:68–70, Vâkıa Sûresi'nde, insanın yaratılışından (56:58–59) sonra gelen ve bizi ayakta tutan şeyler hakkındaki dört sorunun üçüncüsüdür: tohum (56:63–64), su (56:68–70), ateş (56:71–72). Her biri onu gerçekte kimin sağladığını sorar.
    - **Bu sayfa ve S24.** 21:30'un ilk yarısı ("bitişik bir halde iken biz onları ayırdık") S24'te, "Duman gibi bir başlangıç; bitişikken ayrılan gökler ve yer" sayfasında tartışılıyor. Bu sayfa ikinci yarısı ve içme suyu hakkındadır.
  en: |-
    "Have those who disbelieved not considered that the heavens and the earth were a joined entity, and We separated them and made from water every living thing? Then will they not believe?" (21:30), Meccan (Sura al-Anbiyāʾ).

    "And have you seen the water that you drink? Is it you who brought it down from the clouds, or is it We who bring it down? If We willed, We could make it bitter, so why are you not grateful?" (56:68–70), Meccan (Sura al-Wāqiʿa).

    - **Key words.** *Jaʿalnā min al-māʾi kulla shayʾin ḥayy*: "made from water every living thing". *Al-muzn* (56:69): rain-clouds. *Ujāj* (56:70): bitter, salty water that cannot be drunk.
    - **Setting.** 21:30 is part of an argument addressed to those who deny God: the heavens, the earth and life itself point to their Maker. 56:68–70 is the third of four questions in Sura al-Wāqiʿa about what sustains us: the seed (56:63–64), the water (56:68–70), the fire (56:71–72), after the creation of the human being (56:58–59). Each asks who really provides it.
    - **This page and S24.** The first half of 21:30 ("joined entity… separated") is discussed on S24. This page is about its second half and about drinking water.
awe:
  tr: |-
    - Bir yetişkin yaklaşık %60'a kadar sudur; akciğerler yaklaşık %83 (USGS).
    - Yeni doğmuş bir bebek yaklaşık %78 sudur (USGS).
    - Buz sıvı sudan yaklaşık %9 daha az yoğundur; bu yüzden göller üstten donar ve hayat altında devam eder (USGS).
  en: |-
    - An adult is up to about 60% water; the lungs about 83% (USGS).
    - A newborn is about 78% water (USGS).
    - Ice is about 9% less dense than liquid water, so lakes freeze from the top and life survives beneath (USGS).
