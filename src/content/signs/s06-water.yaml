pause:
  ref: 56:68
title:
  tr: Su ve hayat
  en: Water and life
summary:
  tr: '"İçtiğiniz suya baktınız mı?" (56:68). Bu âyetler günün en sıradan işini bir soruya çevirir: Onu kim indirdi ve kim tatlı tutuyor?'
  en: '"And have you seen the water that you drink?" (56:68). These verses turn the most ordinary act of the day into a question: who brought it down, and who keeps it sweet?'
howItWorks:
  tr: |-
    - **"Hayatı olan her şey" ve su.** [Established] "Yetişkin insan vücudunun %60'a kadarı sudur" (USGS). Organlara göre: "beyin ve kalp %73 sudan oluşur, akciğerler yaklaşık %83 sudur"; deri yaklaşık %64, kaslar ve böbrekler %79, kemikler %31'dir (USGS, Mitchell ve başkaları, 1945'e atıfla). Bebekler yaklaşık %78 su ile doğar; bu oran bir yaşına kadar yaklaşık %65'e düşer (USGS, Dr. Jeffrey Utz'a atıfla).
    - **"Buluttan onu siz mi indirdiniz?" (56:69).** [Established] Deniz suyu buharlaştığında tuz geride kalır; bulutları oluşturan buhar tatlıdır. Yağmur damıtılmış sudur; yağmurun içilebilir, denizin içilemez olmasının sebebi budur.
    - **"Dileseydik onu tuzlu yapardık" (56:70).** [Established] Tuzlu su daha ağırdır: "İçinde çözünmüş tuz bulunan okyanus suyu saf sudan daha yoğundur" (USGS, "Water Density").
    - **Suyun alışılmadık davranışı.** [Established] Çoğu madde donunca küçülür. Su tersini yapar: "Donma sırasında buzun yoğunluğu yaklaşık yüzde 9 azalır" (USGS). Su en yoğun hâline yaklaşık 4 °C'de ulaşır; dolayısıyla donmaya yakın su daha hafiftir ve üstte kalır, buz da orada oluşur; aksi hâlde, USGS'nin not ettiği gibi, "göl alttan yukarıya doğru donabilirdi". Üstte yüzen buz, altındaki suyu yalıtır; balıklar ve bitkiler kışı orada atlatır. (Bu, suyun hayatı destekleyen bir özelliğidir; âyetler ondan söz etmez.)
  en: |-
    - **"Every living thing" and water.** [Established] "Up to 60% of the human adult body is water" (USGS). By organ: "the brain and heart are composed of 73% water, and the lungs are about 83% water"; skin is about 64%, muscles and kidneys 79%, bones 31% (USGS, citing Mitchell and others, 1945). Babies are born at about 78% water, falling to about 65% by age one (USGS, citing Dr Jeffrey Utz).
    - **"Is it you who brought it down from the clouds?" (56:69).** [Established] When seawater evaporates, the salt stays behind; the vapour that forms clouds is fresh. Rain is distilled water, which is why rain is drinkable and the sea is not.
    - **"We could make it bitter" (56:70).** [Established] Salt water is heavier: "ocean water, which contains dissolved salt, is denser than pure water" (USGS, "Water Density").
    - **Water's unusual behaviour.** [Established] Most substances shrink when they freeze. Water does the opposite: "Upon freezing, the density of ice decreases by about 9 percent" (USGS). Water is densest at about 4 °C, so near-freezing water is lighter and stays on top, where ice forms; otherwise, USGS notes, "the lake could freeze from the bottom up". Ice floating on top insulates the water below, where fish and plants survive the winter. (This is a fact about water that supports life; the verses do not mention it.)
reflection:
  tr: |-
    "İçtiğiniz suya baktınız mı?" (56:68). Bakmadan içeriz. Âyet bakmamızı ister.

    Sonra üç soru sorar. Onu buluttan kim indirdi? Onu kim tatlı tutuyor? Ve neden şükretmiyoruz? İbn Kesîr son soruda bir sitem ve bir davet duyar: yağmurun "tatlı, içmeye hazır" olarak indirilmesindeki "lütfun kıymetini bilmeye".

    Her bardak suyun uzun bir hikâyesi vardır. Bir zamanlar tuzlu suydu, ya da buz, ya da bir bulut. Yükseldi, düştü, toprağın ve taşın içinden aktı. Yolun bir yerinde tuz geride kaldı ve bardağına ulaşan şey seni hayatta tutabilecek hâle geldi. Bunların hiçbirini sen yapmadın.

    21:30 bakışı genişletir: "Hayatı olan her şeyi sudan yarattık." İbn Kesîr bunu asıl, *Celâleyn* sebep olarak okur. Her iki durumda da yeryüzündeki hayat, aldığımız ve yapamadığımız bir şeye bağlıdır.

    Âyetler bir kimya dersi istemez. Bir alışkanlık ister: içmek ve onun verildiğini bilmek. Bunu her gün fark eden biri şükretmeyi öğreniyordur ve şükür, Kur'an'ın bu soruların varmasını istediği yerdir.
  en: |-
    "And have you seen the water that you drink?" (56:68). We drink without looking. The verse asks us to look.

    Then it asks three questions. Who brought it down from the clouds? Who keeps it sweet? And why are we not grateful? Ibn Kathir hears in the last question a reproach and an invitation: to "appreciate the favor" of rain sent down "fresh, ready to consume".

    Every glass of water has a long story. It was salt water once, or ice, or a cloud. It rose, it fell, it ran through soil and stone. Somewhere along the way the salt was left behind, and what reached your glass could keep you alive. You did none of that.

    21:30 widens the view: "made from water every living thing". Ibn Kathir reads it as origin, al-Jalālayn as cause. Either way, life on earth depends on something we receive and cannot make.

    The verses do not ask for a lecture on chemistry. They ask for a habit: to drink, and to know that it was given. A person who notices that every day is learning gratitude, and gratitude is where the Quran wants these questions to lead.
honestNotes:
  - en: '**Not a claim about where life began.** "Made from water every living thing" is read by Ibn Kathir as "the origin of every living thing is in water" and by al-Jalālayn as water being "the cause" of life. Neither is a theory of abiogenesis (life arising from non-living matter). Modern theories that life began in water exist, but the verse does not state one.'
    tr: '**Hayatın nerede başladığına dair bir iddia değil.** "Hayatı olan her şeyi sudan yarattık" ifadesini İbn Kesîr "her canlının aslı sudadır", *Celâleyn* ise suyun hayatın "sebebi" olması olarak okur. Hiçbiri bir abiyogenez (hayatın cansız maddeden ortaya çıkması) teorisi değildir. Hayatın suda başladığına dair modern teoriler vardır, ama âyet bunlardan birini söylemez.'
  - en: "**The popular claim.** Popular articles often present 21:30 as anticipating the discovery that cells are mostly water. No named source making that claim was read. The dependence of all life on water was visible to anyone in the seventh century, and that is how the commentators read it."
    tr: "**Popüler iddia.** Popüler makaleler 21:30'u çoğu zaman hücrelerin büyük kısmının su olduğunun keşfini önceden haber veriyormuş gibi sunar. Bu iddiayı ileri süren adı belli hiçbir kaynak okunmadı. Bütün hayatın suya bağlı olduğu yedinci yüzyılda herkesin görebileceği bir şeydi ve müfessirler âyeti böyle okudu."
  - en: '**Numbers.** USGS gives "up to 60%" for adults; the figure varies with age, sex and body composition (USGS: about 60% for men, 55% for women).'
    tr: "**Rakamlar.** USGS yetişkinler için \"%60'a kadar\" der; rakam yaşa, cinsiyete ve vücut yapısına göre değişir (USGS: erkeklerde yaklaşık %60, kadınlarda %55)."
