  ref: 56:68
title:
  tr: Su ve hayat
  en: Water and life
summary:
  tr: Buz sıvı sudan yaklaşık %9 daha hafiftir; bu yüzden göller üstten donar.
  en: Ice is about 9% lighter than liquid water, so lakes freeze from the top.
howItWorks:
  tr: |
    [Established]

    - Su yaklaşık 4 °C'de en yoğundur. Buz sıvı sudan yaklaşık %9 daha hafiftir; bu yüzden göller üstten donar.
    - Özgül ısısı yaklaşık 4,18 J/g·K'dir; bu, iklimi dengeler.
    - Buharlaşma tuzu geride bırakır; bu yüzden yağmur tatlıdır. 56:70'teki "acı" su ile karşıtlık buradan gelir.
  en: |
    [Established]

    - Water is densest at about 4 °C. Ice is about 9% lighter than liquid water, so lakes freeze from the top.
    - Specific heat is about 4.18 J/g·K, which buffers climate.
    - Evaporation leaves salt behind, so rain is fresh, the contrast with "bitter" water in 56:70.
reflection:
  tr: Her bardak su, insanların yapmadığı gezegen çapında bir damıtmanın ürünüdür.
  en: '"And have you seen the water that you drink?" (56:68). The next verses ask who brought it down from the clouds, and add: "If We willed, We could make it bitter, so why are you not grateful?" (56:70). Evaporation leaves salt behind, so rain falls fresh: every glass is the product of a planetary distillation that no human made or runs. Water also freezes from the top, which keeps lakes alive under the ice. The verse turns a daily habit into a question of gratitude.'
honestNotes:
  - tr: Âyet, hayatın nerede başladığına dair bir iddia değildir.
    en: The verse is not a claim about where life originated.
visualizations:
  - id: ideas
    tr: '"Tuzun geride kaldığı" bir su döngüsü ve donmuş bir gölün kesiti.'
    en: A water cycle where "the salt stays behind", and a cross-section of a frozen lake.
sources:
  - label: Ibn Kathir, *Tafsir* (abridged English, Quran.com), on 21:30.
  - &a1
    label:
      tr: Fiziksel kimya kaynakları (suyun yoğunluğu ve özgül ısısı)
      en: Physical chemistry references (density and specific heat of water)
tafsir:
  en: '**Water and every living thing.** Ibn Kathir explains "And We have made from water every living thing. Will they not then believe": people "see with their own eyes how creation develops step by step. All of that is proof of the existence of the Creator Who is in control of all things". For him the verse is an argument from what anyone can see: rain, growth and life depend on water.'
followUps:
  - q:
      en: Does the verse mean all life is made of water?
    a:
      en: Classical scholars read it as life depending on and arising from water; the biology of water in living things is in "How it works".
  - q:
      en: Is this verse about the Big Bang?
    a:
      en: Its first part ("joined together… then We parted them") is discussed under S24; this page is about water and life.
