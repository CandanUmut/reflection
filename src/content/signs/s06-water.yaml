tafsir:
  tr: |-
    **İbn Kesîr, 21:30 hakkında.** "yani her canlının aslı sudadır". Âyeti herkesin görebileceği şeyden yapılan bir argüman olarak okur: Yağmur, büyüme ve hayat suya bağlıdır.

    ***Celâleyn*, 21:30 hakkında.** "yani su, bu şeylerin hayat sahibi olmasının sebebidir". İbn Kesîr'in asıldan söz ettiği yerde *Celâleyn* sebepten söz eder: Hayat suya bağlıdır.

    **İbn Kesîr, 56:68–70 hakkında.** *El-müzn*, "İbn Abbâs'a, Mücâhid'e ve başkalarına göre bulutlar" demektir. "Allah, yağmuru yağdıranın gerçekten Kendisi olduğunu bildirmektedir". *Ücâc*, "tuzlu, ekşi, içilemez ve bitki yetiştirmeye elverişsiz" demektir. Ve "şükretseniz ya" ifadesi şunu sorar: "Allah'ın yağmuru tatlı, içmeye hazır olarak indirerek size yaptığı lütfun kıymetini neden bilmiyorsunuz?"

    **Söylemedikleri.** Hiçbir tefsir "Hayatı olan her şeyi sudan yarattık" ifadesini modern biyolojik anlamda hayatın kökeni ya da hücrelerin kimyası hakkında bir ifade olarak okumaz.
  en: |-
    **Ibn Kathir on 21:30.** "meaning, the origin of every living thing is in water". He reads the verse as an argument from what anyone can see: rain, growth and life depend on water.

    **Al-Jalālayn on 21:30.** "in other words water is the cause of such things having life". Where Ibn Kathir speaks of origin, al-Jalālayn speaks of cause: life depends on water.

    **Ibn Kathir on 56:68–70.** *Al-muzn* means "clouds, according to Ibn ʿAbbas, Mujahid and others". "Allah is stating that indeed He is the One Who causes the rain to fall". "Bitter" (*ujāj*) means "salty, sour, undrinkable and unfit for growing plants". And the question "why are you not grateful?" asks: "why do you not appreciate the favor Allah does for you by sending down the rain fresh, ready to consume".

    **What they did not say.** Neither commentary reads "made from water every living thing" as a statement about the origin of life in the modern biological sense, or about the chemistry of cells.
followUps:
  - q:
      en: Does the verse mean all life is made of water?
      tr: Âyet bütün hayatın sudan yapıldığı anlamına mı geliyor?
    a:
      en: Ibn Kathir reads it as "the origin of every living thing is in water"; al-Jalālayn as water being "the cause of such things having life". The biology of water in living things is in "How it works".
      tr: İbn Kesîr onu "her canlının aslı sudadır", *Celâleyn* ise suyun "bu şeylerin hayat sahibi olmasının sebebi" olması olarak okur. Canlılardaki suyun biyolojisi "Nasıl işler?" bölümünde.
  - q:
      en: Is this verse about the Big Bang?
      tr: Bu âyet Büyük Patlama ile mi ilgili?
    a:
      en: Its first part ("joined entity… separated") is discussed on S24. This page is about water and life.
      tr: İlk kısmı ("bitişik bir halde iken biz onları ayırdık") S24'te, "Duman gibi bir başlangıç; bitişikken ayrılan gökler ve yer" sayfasında tartışılıyor. Bu sayfa su ve hayat hakkındadır.
  - q:
      en: Why is rain fresh when the sea is salty?
      tr: Deniz tuzluyken yağmur neden tatlı?
    a:
      en: When water evaporates, the salt is left behind. Clouds are made of fresh water vapour, so rain is fresh.
      tr: Su buharlaştığında tuz geride kalır. Bulutlar tatlı su buharından oluşur, dolayısıyla yağmur tatlıdır.
  - q:
      en: What does *ujāj* ("bitter") mean?
      tr: '*Ücâc* ("tuzlu") ne demek?'
    a:
      en: 'Ibn Kathir: "salty, sour, undrinkable and unfit for growing plants".'
      tr: 'İbn Kesîr: "tuzlu, ekşi, içilemez ve bitki yetiştirmeye elverişsiz".'
  - q:
      en: Why does ice float, and why does it matter?
      tr: Buz neden yüzer ve bu neden önemlidir?
    a:
      en: Ice is about 9% less dense than liquid water (USGS), so lakes freeze from the top, and the ice shelters the water and the life below.
      tr: Buz sıvı sudan yaklaşık %9 daha az yoğundur (USGS); bu yüzden göller üstten donar ve buz, altındaki suyu ve hayatı korur.
