title:
  tr: İnce ayar
  en: Fine-tuning
summary:
  tr: Bazı sabitler hayata izin veren dar aralıklarda durur. İnce ayar bir kanıt değil, bir davettir.
  en: Some constants sit in narrow ranges that permit life. Fine-tuning is an invitation, not proof.
tafsir:
  tr: Arka plan, Gazzâlî ve Râzî'nin kullandığı kelâmdaki tahsis (belirleme) delilidir.
  en: '**Everything measured.** On 25:2, which says God "has created each thing and determined it with [precise] determination", Ibn Kathir explains that "everything apart from Him is created and subject to Him". On "Indeed, all things We created with predestination" (54:49) — the word is *qadar* — he links the two verses and 87:1–3: God "measured out" everything. The background of the modern fine-tuning discussion is the *kalam* argument from particularisation (*takhsis*), used by al-Ghazali and al-Razi: if things could have been otherwise, something chose that they be as they are.'
howItWorks:
  tr: |
    [Established] — çıkarımlar ise [Debated]

    - Bazı sabitler hayata izin veren dar aralıklarda durur. Bir tahmine göre kozmolojik sabitin ince ayarı 10^120'de 1'dir (Stanford Felsefe Ansiklopedisi).

    **Cevaplar:**

    - Çoklu evren: şişme (enflasyon) artı sicim manzarası.
    - Bu çıkarımın eleştirmenleri "ters kumarbaz yanılgısı"nı ve "bu evren itirazı"nı (Hacking, White) öne sürer; savunucular buna itiraz eder.
    - Weinberg bazı örneklerin "o kadar da ince olmadığına" hükmetti.
  en: |
    [Established] — inferences [Debated]

    - Some constants sit in narrow ranges that permit life. One estimate puts the cosmological constant's fine-tuning at 1 part in 10^120 (Stanford Encyclopedia of Philosophy).

    **Responses:**

    - The multiverse: inflation plus the string landscape.
    - Critics of that inference cite the "inverse gambler's fallacy" and the "this-universe objection" (Hacking, White); defenders dispute it.
    - Weinberg judged some cases "not so fine".
honestNotes:
  - tr: İnce ayar bir kanıt değil, bir davettir.
    en: Fine-tuning is an invitation, not proof.
