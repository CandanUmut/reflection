followUps:
  - q:
      en: Did classical scholars know about physical constants?
    a:
      en: No; they spoke of God measuring everything (25:2; 54:49). The physics is modern and kept in "How it works", with its debates.
  - q:
      en: Does fine-tuning prove God?
    a:
      en: The page presents it as a sign that invites reflection, with the scientific and philosophical objections in the honest notes.
