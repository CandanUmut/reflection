followUps:
  - q:
      en: Does fine-tuning prove God exists?
    a:
      en: No. It is one of the stronger pointers in modern design arguments, but philosophers dispute the probabilities and the alternatives (multiverse, deeper law). The SEP sets out both sides.
  - q:
      en: What does *qadar* mean in 54:49?
    a:
      en: Measure and decree. Ibn Kathir reads the verse as affirming God's decree over all things, against the Qadariyya who denied it.
  - q:
      en: What is the "inverse gambler's fallacy"?
    a:
      en: Inferring many earlier trials from one surprising result — like assuming many dice were thrown before because the roll you saw was a double six. Hacking argued the multiverse inference makes this mistake; others dispute it.
  - q:
      en: Is the multiverse a scientific theory?
    a:
      en: Some versions follow from theories such as inflation, but there is no direct evidence for other universes; the SEP treats the inference to them as debated.
