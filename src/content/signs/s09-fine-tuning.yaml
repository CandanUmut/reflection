title:
  tr: İnce ayar
  en: Fine-tuning
summary:
  tr: "25:2, Allah'ın \"her şeyi yaratıp bir ölçüye göre düzenleyerek takdir etmiş\" olduğunu söyler: Âyet ölçüyle yapılmış bir dünyadan söz eder."
  en: '25:2 says God "has created each thing and determined it with [precise] determination": the verse speaks of a world made to measure.'
tafsir:
  tr: |-
    **İbn Kesîr, 25:2 hakkında.** "O'nun dışındaki her şey yaratılmıştır ve O'na tâbidir".

    **İbn Kesîr, 54:49 hakkında.** Âyeti fizik hakkında değil, kader hakkında bir ifade olarak okur ve Sünnet imamlarının "bu âyeti ve benzeri âyetleri ve hadisleri, Sahâbe'nin son döneminde fırkalarını başlatan Kaderiyye fırkasını reddetmek için kullandığını" aktarır. Sayfada İmam Ahmed'e, Müslim'e, Tirmizî'ye ve İbn Mâce'ye nispet edilen, Ebû Hüreyre'den (r.a.) bir rivayet zikreder (Müslim numarası doğrulanmadı): "Kureyş müşrikleri Allah'ın Resûlü'ne geldiler… onunla tartışıp kaderi inkâr ettiler", bunun üzerine âyetler indi. (*Kaderiyye*, Allah'ın insanın fiillerini takdir ettiğini inkâr eden erken bir gruptu.)

    ***Celâleyn*, 54:49 hakkında.** Yorumu dilbilgiseldir: "*inne külle şey'in* diye okunan 'her şey' mansuptur". (Bu, *Celâleyn*'in değil bu sayfanın açıklamasıdır: Mansup okuma, "yarattığımız her şey bir ölçüyledir" yerine "her şeyi bir ölçüyle yarattık" okumasını destekler.)

    **Nerede birleşiyorlar ve ne söylemediler?** İkisi de *kader*i Allah'ın her şey üzerindeki ölçmesi ve hükmü olarak okur. Hiçbiri tabiat sabitlerinden ya da hayata izin veren bir evrenden söz etmez; bu okuma moderndir.
  en: |-
    **Ibn Kathir on 25:2.** "everything apart from Him is created and subject to Him".

    **Ibn Kathir on 54:49.** He reads the verse as a statement about decree, not about physics, and reports that the Imams of the Sunnah "used this Ayah and similar Ayat and Hadiths to refute the Qadariyyah sect, who started their sect during the latter time of the Companions." He cites a report from Abu Hurayra (ra), attributed on the page to Imam Ahmad, Muslim, al-Tirmidhi and Ibn Majah (the Muslim number was not confirmed): "The idolators of the Quraysh came to the Messenger of Allah… arguing with him and discounting the Qadar", after which the verses were revealed. (The *Qadariyya* were an early group who denied that God decrees human acts.)

    **Al-Jalālayn on 54:49.** Its comment is grammatical: "everything read inna kulla shay'in is in the accusative". (This page's explanation, not al-Jalālayn's: the accusative supports reading "We created everything with a measure" rather than "everything that We created is with a measure".)

    **Where they agree, and what they did not say.** Both read *qadar* as God's measuring and decree over all things. Neither speaks of constants of nature or of a life-permitting universe; that reading is modern.
howItWorks:
  tr: |-
    - **"İnce ayar" ne demek?** [Established, bir tarif olarak] Fizikçiler, tabiatın bazı sabitlerinin ve evrenin bazı başlangıç koşullarının hayata izin veren aralıklarda bulunduğunu ve küçük değişikliklerin, bugünkü modellere göre, hayatı imkânsız kılacağını buldu. SEP ince ayarlı sabitleri, erken evrenin koşullarını ve yasaları sayar (Friederich).
    - **En ünlü örnek.** [Established] *Kozmolojik sabit* (boş uzayın enerjisi; kozmik genişlemeyi yönlendirir): Kuantum alan teorisinden yapılan saf bir tahmin, gözlenen değerden "muazzam sayıda büyüklük mertebesi" daha büyüktür; varsayımlara göre "uyuşmazlık 10^50 ile 10^123 arasındadır", "yaklaşık 120 büyüklük mertebesi" (SEP). Steven Weinberg (1987), galaksilerin ancak boşluk enerjisi gözlenen değerinin en fazla birkaç büyüklük mertebesi üstündeyse oluşabileceğini savundu (SEP).
    - **Üç cevap.** [Debated]
      1. *Tasarım:* Bir tasarımcı varsa hayata izin veren sabitler daha olasıdır (SEP'teki Bayesçi versiyonlar; Sober ve başkaları gözlem seçilim etkilerinin bunu zayıflattığını söyleyerek itiraz eder, Kotzen ve Weisberg cevap verir).
      2. *Çoklu evren:* Sabitleri farklı olan çok sayıda evren varsa, en az biri hayata izin verir ve gözlemciler kendilerini onun içinde bulur.
      3. *Çıplak olgu ya da daha derin bir yasa:* Sabitler henüz bilinmeyen daha derin bir teoriyle belirlenmiş olabilir.
    - **Olasılıklarla ilgili sorunlar.** [Debated] McGrew, McGrew ve Vestrup (2001), bir sabit herhangi bir gerçel değeri alabiliyorsa, düzgün bir olasılığın her sonlu aralığa sıfır olasılık vereceğini, dolayısıyla hayata izin veren aralığın "ne kadar olasılık dışı" olduğunun düzgün biçimde tanımlanamayacağını savunur (SEP).
    - **Çoklu evren çıkarımıyla ilgili sorunlar.** [Debated] Ian Hacking (1987), bizim ince ayarlı evrenimizden çok sayıda evren çıkarmanın "ters kumarbaz yanılgısı" (şanslı tek bir atıştan çok sayıda geçmiş atış çıkarmak) olduğunu ileri sürdü; Roger White (2000) ilgili bir noktayı öne çıkardı: Başka pek çok evrenin varlığı "bu evrenin" hayata izin vermesini daha olası kılmaz; McGrath, Manson ve Thrush, Epstein ve başkaları çoklu evren argümanını bu suçlamaya karşı savunur (SEP). Friederich şu sonuca varır: "Yerleşik akılcılık standartları, ince ayardan çoklu evrene yapılan çıkarımın yanlış olup olmadığına karar vermemize izin vermeyebilir."
  en: |-
    - **What "fine-tuning" means.** [Established, as a description] Physicists have found that some constants of nature and initial conditions of the universe sit in ranges that permit life, and that small changes would, on current models, make life impossible. The SEP lists fine-tuned constants, conditions of the early universe, and laws (Friederich).
    - **The most famous case.** [Established] The *cosmological constant* (the energy of empty space, which drives cosmic expansion): a naive estimate from quantum field theory is larger than the observed value "by an immense number of magnitudes" — "the discrepancy is between 10^50 and 10^123" depending on assumptions — "about 120 orders of magnitude" (SEP). Steven Weinberg (1987) argued that galaxies could form only if the vacuum energy was no more than a few orders of magnitude above its observed value (SEP).
    - **Three responses.** [Debated]
      1. *Design:* life-permitting constants are more probable if there is a designer (Bayesian versions in the SEP; Sober and others object that observation selection effects undercut this, Kotzen and Weisberg reply).
      2. *Multiverse:* if there are very many universes with varying constants, at least one would permit life, and observers would find themselves in it.
      3. *Brute fact or deeper law:* the constants may be fixed by a deeper theory not yet known.
    - **Problems with the probabilities.** [Debated] McGrew, McGrew and Vestrup (2001) argue that if a constant can take any real value, a uniform probability gives zero probability to any finite range, so "how unlikely" the life-permitting range is cannot be properly defined (SEP).
    - **Problems with the multiverse inference.** [Debated] Ian Hacking (1987) charged that inferring many universes from our fine-tuned one commits the "inverse gambler's fallacy" (inferring many past rolls from one lucky roll); Roger White (2000) pressed a related point, that many other universes do not make it more likely that "this one" is life-permitting; McGrath, Manson and Thrush, Epstein and others defend the multiverse argument against the charge (SEP). Friederich concludes that "established standards of rationality may not allow us to decide whether the inference from fine-tuning to a multiverse is fallacious or not".
honestNotes:
  - en: "**The popular claim.** Fine-tuning is often presented as proof that God exists, and 25:2 or 54:49 as having foretold it. Neither is warranted. The verses speak of measure and decree; the commentators read them as about God's decree (Ibn Kathir reports that the Imams of the Sunnah used 54:49 against the Qadariyya), not about physical constants."
    tr: "**Popüler iddia.** İnce ayar çoğu zaman Allah'ın var olduğunun ispatı olarak, 25:2 ya da 54:49 da onu önceden bildirmiş gibi sunulur. İkisi de yerinde değildir. Âyetler ölçüden ve hükümden söz eder; müfessirler onları fiziksel sabitler hakkında değil, Allah'ın hükmü hakkında okudu (İbn Kesîr, Sünnet imamlarının 54:49'u Kaderiyye'ye karşı kullandığını aktarır)."
  - en: "**The science is real; the inference is debated.** That some constants are life-permitting only in narrow ranges is widely accepted. Whether this points to design, a multiverse or a deeper law is a philosophical question, and the probability calculations behind each are disputed (SEP)."
    tr: "**Bilim gerçektir; çıkarım tartışmalıdır.** Bazı sabitlerin yalnızca dar aralıklarda hayata izin verdiği yaygın olarak kabul edilir. Bunun tasarıma mı, çoklu evrene mi yoksa daha derin bir yasaya mı işaret ettiği felsefi bir sorudur ve her birinin arkasındaki olasılık hesapları tartışmalıdır (SEP)."
