followUps:
  - q:
      en: Does fine-tuning prove God exists?
      tr: İnce ayar Allah'ın var olduğunu ispat eder mi?
    a:
      en: No. It is one of the stronger pointers in modern design arguments, but philosophers dispute the probabilities and the alternatives (multiverse, deeper law). The SEP sets out both sides.
      tr: Hayır. Modern tasarım argümanlarındaki güçlü işaretlerden biridir, ama filozoflar olasılıkları ve alternatifleri (çoklu evren, daha derin yasa) tartışıyor. SEP iki tarafı da ortaya koyar.
  - q:
      en: What does *qadar* mean in 54:49?
      tr: 54:49'da *kader* ne demek?
    a:
      en: Measure and decree. Ibn Kathir reads the verse as affirming God's decree over all things, against the Qadariyya who denied it.
      tr: Ölçü ve hüküm. İbn Kesîr âyeti, Allah'ın her şey üzerindeki hükmünü, onu inkâr eden Kaderiyye'ye karşı teyit eden bir âyet olarak okur.
  - q:
      en: What is the "inverse gambler's fallacy"?
      tr: '"Ters kumarbaz yanılgısı" nedir?'
    a:
      en: Inferring many earlier trials from one surprising result — like assuming many dice were thrown before because the roll you saw was a double six. Hacking argued the multiverse inference makes this mistake; others dispute it.
      tr: Tek bir şaşırtıcı sonuçtan çok sayıda önceki deneme çıkarmak; gördüğünüz atış düşeş olduğu için daha önce çok sayıda zar atıldığını varsaymak gibi. Hacking çoklu evren çıkarımının bu hatayı yaptığını savundu; başkaları buna itiraz ediyor.
  - q:
      en: Is the multiverse a scientific theory?
      tr: Çoklu evren bilimsel bir teori mi?
    a:
      en: Some versions follow from theories such as inflation, but there is no direct evidence for other universes; the SEP treats the inference to them as debated.
      tr: Bazı versiyonları şişme gibi teorilerden çıkar, ama başka evrenler için doğrudan bir delil yoktur; SEP onlara yapılan çıkarımı tartışmalı olarak ele alır.
