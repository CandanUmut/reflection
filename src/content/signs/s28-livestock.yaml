title:
  tr: Hayvanlar ve faydaları
  en: Livestock and their benefits
verses:
  - 16:5-7
  - 36:71-73
seeAlso:
  - 16:8
  - 6:142
summary:
  tr: '16:5–7 ve 36:71–73 otlayan hayvanların verdiklerini sayar (sıcaklık, yiyecek, güzellik, yük taşıma) ve bir soruyla biter: "Hâlâ şükretmeyecekler mi?"'
  en: '16:5–7 and 36:71–73 list what grazing animals give — warmth, food, beauty, the carrying of loads — and end with a question: "so will they not be grateful?"'
verseNotes:
  tr: |-
    "Hayvanları da O yarattı. Onlarda sizi ısıtacak şeyler ve birçok faydalar vardır. Ve siz onlardan bir kısmını da yersiniz. O hayvanları, akşam vakti getirirken ve sabahleyin salarken, onlarda sizin için bir güzellik ve zevk vardır. Bu hayvanlar, ancak güçlükle varabileceğiniz bir memlekete yüklerinizi taşır. Rabbiniz, şüphesiz çok şefkatlidir, çok merhametlidir." (16:5–7), Mekkî, Nahl ("Arı") Sûresi'ndeki uzun bir nimetler listesinin başında.

    "Şunu da görmediler mi: Biz onlar için kudretimizin meydana getirdiklerinden birtakım hayvanlar yaratmışız da onlara sahip bulunuyorlar. Onları, kendilerinin hizmetine vermişiz de, hem onlardan binekleri var, hem de onlardan yiyorlar. Onlarda daha birçok menfaatleri ve türlü içecekleri de var. Hâlâ şükretmeyecekler mi?" (36:71–73), Mekkî, Yâsîn Sûresi'nin sonuna doğru, dirilişten şüphe edenlere cevap veren bir pasajda.

    - **Anahtar kelimeler.** *El-en'âm* ("hayvanlar"): develer, sığırlar, koyunlar ve keçiler. *Dif'* ("ısıtacak şeyler"). *Cemâl* ("güzellik"). *Zellelnâhâ* (36:72, "kendilerinin hizmetine vermişiz"; Saheeh: "tamed", evcilleştirdik): yönetilebilir, boyun eğer kıldık.
    - **Kime hitap ediyorlar?** Genel olarak insanlara ("sizin için") ve 36'da "görmeyenlere": tanıdık bir manzaraya bakmaya bir davet.
  en: |-
    "And the grazing livestock He has created for you; in them is warmth and [numerous] benefits, and from them you eat. And for you in them is [the enjoyment of] beauty when you bring them in [for the evening] and when you send them out [to pasture]. And they carry your loads to a land you could not have reached except with difficulty to yourselves. Indeed, your Lord is Kind and Merciful" (16:5–7), Meccan, at the start of a long list of blessings in Sura al-Naḥl ("The Bee").

    "Do they not see that We have created for them from what Our hands have made, grazing livestock, and [then] they are their owners? And We have tamed them for them, so some of them they ride, and some of them they eat. And for them therein are [other] benefits and drinks, so will they not be grateful?" (36:71–73), Meccan, near the end of Sura Yā Sīn, in a passage answering those who doubt the resurrection.

    - **Key words.** *Al-anʿām* ("grazing livestock"): camels, cattle, sheep and goats. *Difʾ* ("warmth"). *Jamāl* ("beauty"). *Dhallalnāhā* (36:72, "We have tamed them"): made them manageable, submissive.
    - **Whom they address.** People in general ("for you"), and in 36 those who "do not see" — an invitation to look at a familiar sight.
tafsir:
  tr: |-
    **İbn Kesîr, 16:5–7 hakkında.** "Nimetler, elbiselerin ve döşeklerin yapıldığı yünlerinden ve kıllarından elde edilen faydaları içerir"; İbn Abbâs sıcaklığın "giysiye işaret ettiğini" söyledi. Yiyecek, "içilen sütlerinden ve yenen yavrularından"dır. 16:6 hakkında: "Güzellikleri bir tür süstür"; "akşam meradan geri getirildiklerinde" ve "sabah onları meraya saldığınızda" görülür. 16:7 hakkında yükler, "kendi başınıza kımıldatamayacağınız ya da taşıyamayacağınız ağır yükler"dir.

    **İbn Kesîr, 36:71–73 hakkında.** "Allah, bu hayvanları onların kullanımına boyun eğdirerek yarattıklarına verdiği nimeti anar." "Onlara sahip bulunuyorlar" hakkında Katâde'den aktarır: "Onların efendileridir." "Hizmetine vermişiz" hakkında: "Küçük bir çocuk bir deveye gelse bile onu çöktürebilir" ve "Kervan yüz ya da daha fazla deveden oluşsa bile hepsini küçük bir çocuk yönetebilir." Binmek hakkında: "Bazılarına yolculuklarında binerler ve yüklerini her bölgeye taşımak için onları kullanırlar." Diğer faydalar arasında "yün, post ve kıl, döşekler ve eşyalar" vardır; "içecekler" "onların sütü"dür (idrarlarının ilaç olarak kullanılmasından da söz eder).

    ***Celâleyn*** 16:5 hakkında: "Onlarda sıcaklık vardır; kıllarından ve yünlerinden alınan elbiseler ve giysiler yoluyla ısındığınız şey". 36:71 hakkında hayvanlar "develer, sığırlar ve koyunlar"dır, insanlar da "onları kontrol eden efendiler"dir.

    ***Tenvîrü'l-Mikbâs*** 16:5'te hayvanları "yani develer" olarak okur ve "derilerinden yapılmış" "sıcak giysiler"den söz eder.

    **Nerede ayrılıyorlar?** Çoğunlukla birleşirler. Ayrıntıda ayrılırlar: Sıcaklık yünden ve kıldan (İbn Kesîr; *Celâleyn*) ya da derilerden (*Tenvîr*) gelir; hayvanlar yalnızca develerdir (*Tenvîr*, 16:5 hakkında) ya da develer, sığırlar ve koyunlardır (*Celâleyn*, 36:71 hakkında). Akşam dönüşünün güzelliği ve yüz deveyi yöneten bir çocuk resmi üzerinde yalnız İbn Kesîr durur.
  en: |-
    **Ibn Kathir on 16:5–7.** "The blessings include the benefits derived from their wool and hair, from which clothes and furnishings are made"; Ibn ʿAbbas said the warmth "refers to clothing". The food is "from their milk which is drunk, and their young which are eaten." On 16:6: "Their beauty is a kind of adornment", seen "when they are brought back from the pasture in the evening" and "when you send them out to the pasture in the morning." On 16:7, the loads are "the heavy burdens that you cannot move or carry by yourselves".

    **Ibn Kathir on 36:71–73.** "Allah mentions the blessing that He has bestowed upon His creation by subjugating these cattle for their use." On "they are their owners", he cites Qatada: "They are their masters." On "We have tamed them": "even if a young child comes to a camel he can make it kneel down", and "Even if the train consists of a hundred or more camels, they could all be led by a young child." On riding: "some of them they ride on their journeys, and use them to carry their burdens to all regions." The other benefits include "wool, fur, and hair, furnishings and articles of convenience"; the "drinks" are "their milk" (he also mentions the use of their urine as medicine).

    **Al-Jalālayn** on 16:5: "In them there is warmth that by which you keep warm in the way of clothes and garments taken from their hairs and wools". On 36:71, the livestock are "camels cows and sheep", and the people are "masters controlling them."

    **Tanwīr al-Miqbās** on 16:5 reads the livestock as "i.e. the camels", giving "warm clothing" "made of their skin."

    **Where they differ.** Mostly they agree. They differ in detail: the warmth comes from wool and hair (Ibn Kathir; al-Jalālayn) or from skins (*Tanwīr*); the animals are camels alone (*Tanwīr* on 16:5) or camels, cattle and sheep (al-Jalālayn on 36:71). Ibn Kathir alone dwells on the beauty of the evening return and on the image of a child leading a hundred camels.
howItWorks:
  tr: |-
    Her madde "Onları, kendilerinin hizmetine vermişiz" (36:72) ifadesine ve sayılan faydalara bağlanır.
    - **Koyunlar ve keçiler ne zaman evcilleştirildi?** [Established, tarih yaklaşık] Evcil koyunların ve keçilerin genlerini yabani atalarıyla (Asya muflonu ve Bezoar dağ keçisi) karşılaştıran Cardiff araştırmacıları (Pablo Orozco-terWengel ve Mike Bruford), evcilleştirilmelerini "yaklaşık 10.500 yıl önce", "Bereketli Hilal yakınında" konumlandırır (Cardiff Üniversitesi haberi; dergi makalesine henüz başvurulmadı).
    - **Develer ne zaman evcilleştirildi?** [Established, tarih yaklaşık] 21 ülkeden 1.083 modern tek hörgüçlü devenin DNA'sını ve antik örnekleri kullanan Almathen ve ark. (2016), "tek hörgüçlü devenin evcilleştirilmesinin muhtemelen MÖ ikinci binyılın sonlarında gerçekleştiği" (yaklaşık 3.000 yıl önce) sonucuna varır; kemik boyutundaki küçülmeyi "yaklaşık MÖ 1100–800"e tarihlendirir ve "Arap Yarımadası'nın güneydoğusunu ilk evcilleştirmenin yapıldığı bölge" olarak belirler (phys.org haberi). Alışılmadık biçimde tek hörgüçlü develer yüksek genetik çeşitliliği korudu, çünkü yabani hayvanlar evcil sürülerle çiftleşmeye devam etti.
    - **"Hizmetine vermek" neyi içeriyordu?** [Established] Evcilleştirme, idare edilecek kadar sakin hayvanları seçip üretmeye dayanan uzun bir insan süreciydi. Âyet Allah'ın onları hizmete verdiğinden söz eder; tarihî süreç burada ayrıca anlatılıyor ve âyetin anlamı değildir.
  en: |-
    Each point is tied to "We have tamed them for them" (36:72) and to the benefits named.
    - **When sheep and goats were tamed.** [Established, date approximate] Comparing the genes of domestic sheep and goats with their wild ancestors (the Asiatic mouflon and the Bezoar ibex), Cardiff researchers (Pablo Orozco-terWengel and Mike Bruford) place their domestication "approximately 10,500 years ago" "near the fertile crescent" (Cardiff University news; the journal paper has not yet been consulted).
    - **When camels were tamed.** [Established, date approximate] Using DNA from 1,083 modern dromedaries from 21 countries, plus ancient specimens, Almathen et al. (2016) conclude that "The domestication of the dromedary likely happened in the late second millennium BCE" — roughly 3,000 years ago — with a reduction in bone size dated to "ca. 1,100–800 BCE", and identify "the Southeast Arabian Peninsula as the region of first domestication" (phys.org report). Unusually, dromedaries kept high genetic diversity, because wild animals kept breeding into domestic herds.
    - **What "tamed" involved.** [Established] Domestication was a long human process of selecting and breeding animals that were calm enough to handle. The verse speaks of God taming them; the historical process is described here separately and is not the verse's meaning.
awe:
  tr: |-
    - Koyunlar ve keçiler yaklaşık 10.500 yıldır insanlarla yaşıyor (Cardiff); müfessirlerin en çok aklındaki hayvan olan develer ise yaklaşık 3.000 yıldır (Almathen ve ark.).
    - Bir deve bir çocuğun ağırlığının kat kat fazlası olabilir; yine de İbn Kesîr'in resmi, yüz deveyi yöneten bir çocuktur.
  en: |-
    - Sheep and goats have lived with people for about 10,500 years (Cardiff); camels, the animal the commentators had most in mind, for about 3,000 (Almathen et al.).
    - A camel can weigh many times a child's weight, yet Ibn Kathir's picture is a child leading a hundred of them.
reflection:
  tr: |-
    Bu âyetler bir çobanın hayatındaki en sıradan şeyi alır ve ondan ona yeniden bakmasını ister. Bizden büyük ve güçlü hayvanlar onları sağmamıza, kırkmamıza, onlara binmemize ve onlara yük yüklememize izin verir. İbn Kesîr'e göre bir çocuk bir deveyi çöktürebilir.

    Sonra Kur'an beklenmedik bir şey ekler: güzellik. "O hayvanları, akşam vakti getirirken ve sabahleyin salarken, onlarda sizin için bir güzellik ve zevk vardır." İbn Kesîr sahneyi görür: akşam karnı tok eve dönen, sabah dışarı çıkan sürü. Âyet faydada durmaz; bakmanın verdiği zevke davet eder.

    36:73'teki soru merkezdir: "Hâlâ şükretmeyecekler mi?" Buradaki şükür yalnızca bir duygu değildir. Âyetler onu görmeye ("Şunu da görmediler mi") ve armağanın nereden geldiğini hatırlamaya bağlar: "Biz onlar için … yaratmışız". Hayvanlara sahip olmak ("onlara sahip bulunuyorlar") da bir başarı değil, bir emanettir.

    Modern okuyucu evcilleştirmenin binlerce yıllık insan emeği gerektirdiğini bilir. Tefekkür bunu inkâr etmez. Neden böyle şekillendirilebilecek hayvanların var olduğunu ve neden erişebileceğimiz yere konduklarını sorar. Bugün pek çok insan için hayvanlar yalnızca bir tabakta görülen şeylerdir. Âyetler bizden yemekten önce hayvanı görmemizi ve ikisi için de şükretmemizi ister.
  en: |-
    These verses take the most ordinary thing in a herder's life and ask him to look at it again. Animals that are larger and stronger than us let us milk them, shear them, ride them and load them. A child, says Ibn Kathir, can make a camel kneel.

    Then the Quran adds something unexpected: beauty. "For you in them is [the enjoyment of] beauty when you bring them in [for the evening] and when you send them out [to pasture]." Ibn Kathir sees the scene: the herd coming home full in the evening, going out in the morning. The verse does not stop at usefulness; it invites the pleasure of looking.

    The question in 36:73 is the centre: "so will they not be grateful?" Gratitude here is not only a feeling. The verses link it to seeing — "Do they not see" — and to remembering where the gift comes from: "We have created for them". Owning the animals ("they are their owners") is itself a trust, not an achievement.

    A modern reader knows that domestication took thousands of years of human work. The reflection does not deny that. It asks why there were animals at all that could be shaped this way, and why they were placed within reach. For many people today, livestock are something seen only on a plate. The verses ask us to see the animal before the meal, and to be grateful for both.
honestNotes:
  - en: '**Domestication and "tamed".** The verse says God tamed them; science describes a long human process of selection. These are answers to different questions (who gives, and how it happened). The page should not present the verse as describing domestication.'
    tr: "**Evcilleştirme ve \"hizmetine vermek\".** Âyet Allah'ın onları hizmete verdiğini söyler; bilim uzun bir insan seçilimi sürecini anlatır. Bunlar farklı soruların cevaplarıdır (kim veriyor ve nasıl oldu). Sayfa âyeti evcilleştirmeyi anlatıyormuş gibi sunmamalıdır."
  - en: "**Dates vary.** 10,500 years (sheep and goats) comes from a university news summary of a genetic study; 3,000 years for camels from the paper's own wording (\"likely\", \"late second millennium BCE\"). Other studies give other dates."
    tr: '**Tarihler değişir.** 10.500 yıl (koyun ve keçi), bir genetik çalışmanın üniversite haber özetinden gelir; develer için 3.000 yıl, makalenin kendi ifadesindendir ("muhtemelen", "MÖ ikinci binyılın sonları"). Başka çalışmalar başka tarihler verir.'
  - en: "**The urine-as-medicine remark** in Ibn Kathir on 36:73 is reported here for completeness; the hadith behind it has not yet been consulted and is not used."
    tr: "**İbn Kesîr'in 36:73 hakkındaki idrarın ilaç olarak kullanılması sözü** burada eksiksiz olsun diye aktarılıyor; arkasındaki hadise henüz başvurulmadı ve kullanılmıyor."
  - en: "**Animal welfare.** These verses speak of benefit and gratitude. The Islamic ethics of how animals must be treated (kindness, not overloading) is a real and related subject, but no source on it was read."
    tr: "**Hayvan refahı.** Bu âyetler fayda ve şükürden söz eder. Hayvanlara nasıl davranılması gerektiğine dair İslam ahlakı (iyilik, aşırı yüklememek) gerçek ve ilgili bir konudur, ama onun hakkında hiçbir kaynak okunmadı."
visualizations:
  - id: ideas
    tr: |
      - Koyun, keçi, inek ve devenin her faydasının (yün, süt, deri, taşıma) işaretlendiği bir "ikram haritası".
      - Yaklaşık 11.000 yıl önce başlayan bir evcilleştirme zaman çizelgesi.
    en: |-
      - A "gift map" of a sheep, goat, cow and camel, with each benefit (wool, milk, leather, transport) highlighted.
      - A timeline of domestication starting about 11,000 years ago.
