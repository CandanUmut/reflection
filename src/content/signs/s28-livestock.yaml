followUps:
  - q:
      en: Why does the Quran mention the beauty of cattle?
    a:
      en: "The verse joins usefulness and beauty: animals are for use, and also a pleasure to see (16:6)."
  - q:
      en: Does "tamed" mean they were domesticated?
    a:
      en: Classical scholars read it as God making them manageable; the history of domestication is described separately.
