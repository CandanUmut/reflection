id: S28
slugs:
  tr: hayvanlar-ve-faydalari
  en: livestock
order: 28
theme: animals
title:
  tr: Hayvanlar ve faydaları
  en: Livestock and their benefits
verses:
  - 16:5-7
  - 36:71-73
seeAlso:
  - 16:8
  - 6:142
summary:
  tr: Bu hayvanlar insan ihtiyaçlarına dikkat çekici biçimde uyar. Âyet bu boyun eğdirmeyi bir ikram sayar ve şükre çağırır.
  en: These animals fit human needs remarkably well. The verse calls this subjection a gift and asks for gratitude.
verseNotes:
  tr: "36:72'deki *zellelnâhâ*: \"onları boyun eğdirdik\"; büyük ve güçlü hayvanların uysal ve idare edilebilir kılınması."
  en: 'In 36:72, *dhallalnāhā*: "We subdued them", large and strong animals made gentle and manageable.'
tafsir:
  tr: |
    [Scholarly]

    - Müfessirler faydaları sayar: ısınmak için yün ve kıl, süt, et, deri, taşıma.
    - *Zellelnâhâ*'yı vurgularlar: büyük, güçlü hayvanlar uysal ve idare edilebilir kılınmıştır; öyle ki bir çocuk bile deveyi yedebilir. Bu, insanların yaratmadığı bir nimet sayılır.
    - Akşam ve sabahki "güzellik" (*cemâl*), hayvanlarda estetik zevkten nadir söz edilen yerlerden biri olarak not edilir.
  en: |-
    [Scholarly]

    - Commentators list the benefits: wool and hair for warmth, milk, meat, leather, transport.
    - They highlight *dhallalnāhā*: large, strong animals made gentle and manageable, so even a child can lead a camel. This is counted as a blessing people did not create.
    - The "beauty" (*jamāl*) in the evening and morning is noted as a rare mention of aesthetic pleasure in animals.
howItWorks:
  tr: |
    [Established]

    - Keçi, koyun ve sığır, yaklaşık 10.000–11.000 yıl önce Bereketli Hilal'de ve çevresinde evcilleştirildi. Tek hörgüçlü deve çok daha sonra, yaklaşık 3.000 yıl önce Arabistan'da evcilleştirildi.
    - Büyük memeli türlerinden yalnızca az sayıda tür başarıyla evcilleştirilebildi. Evcilleştirme için hayvanların sakin olması, sürü hâlinde yaşaması, esaret altında üremesi ve yeterince hızlı büyümesi gerekir.
    - Evcil hayvanlar insan hayatını değiştirdi: düzenli süt ve et, giysi için yün, deri, gübre, sabanı çekecek ve yük taşıyacak güç.
  en: |-
    [Established]

    - Goats, sheep and cattle were domesticated in and around the Fertile Crescent about 10,000–11,000 years ago. The dromedary camel was domesticated much later, about 3,000 years ago in Arabia.
    - Only a small number of large mammal species have ever been successfully domesticated. Domestication needs animals that are calm, live in herds, breed in captivity, and grow fast enough.
    - Domestic animals changed human life: steady milk and meat, wool for clothing, leather, fertilizer, and the power to plow and carry.
awe:
  tr: |
    - Yeryüzündeki pek çok büyük yabani memeliden yalnızca bir düzine kadarı gerçek anlamda evcil hayvan oldu.
    - Tek bir koyun yılda birkaç kilogram yün verebilir ve yün her yıl yeniden çıkar.
  en: |-
    - Of the many large wild mammals on Earth, only about a dozen or so became truly domesticated livestock.
    - A single sheep can produce several kilograms of wool a year, regrown each year.
reflection:
  tr: |
    Bu hayvanlar insan ihtiyaçlarına dikkat çekici biçimde uyar: yedilmeye razıdırlar, sıcaklık, besin ve taşıma sağlarlar. Âyet bu boyun eğdirmeyi bir ikram sayar ve şükre çağırır ("Hâlâ şükretmeyecekler mi?" 36:73).
  en: 'These animals fit human needs remarkably well: willing to be led, giving warmth, food and transport. The verse calls this subjection a gift and asks for gratitude ("Will they not then be grateful?" 36:73).'
honestNotes:
  - tr: |
      Evcilleştirme aynı zamanda insanın uzun bir seçme ve yetiştirme sürecidir. Âyet bunu inkâr etmez; bu hayvanların en başta buna elverişli olduğuna işaret eder. Kesin evcilleştirme tarihleri çalışmadan çalışmaya değişir.
    en: Domestication was also a long human process of selection and breeding. The verse does not deny that; it points to the fact that these animals were suitable in the first place. Exact domestication dates vary between studies.
visualizations:
  - id: ideas
    tr: |
      - Koyun, keçi, inek ve devenin her faydasının (yün, süt, deri, taşıma) işaretlendiği bir "ikram haritası".
      - Yaklaşık 11.000 yıl önce başlayan bir evcilleştirme zaman çizelgesi.
    en: |-
      - A "gift map" of a sheep, goat, cow and camel, with each benefit (wool, milk, leather, transport) highlighted.
      - A timeline of domestication starting about 11,000 years ago.
