legacyHonestNotes:
  - tr: |
      Evcilleştirme aynı zamanda insanın uzun bir seçme ve yetiştirme sürecidir. Âyet bunu inkâr etmez; bu hayvanların en başta buna elverişli olduğuna işaret eder. Kesin evcilleştirme tarihleri çalışmadan çalışmaya değişir.
    en: Domestication was also a long human process of selection and breeding. The verse does not deny that; it points to the fact that these animals were suitable in the first place. Exact domestication dates vary between studies.
followUps:
  - q:
      en: Why does the Quran mention the beauty of cattle?
      tr: Kur'an neden hayvanların güzelliğinden söz ediyor?
    a:
      en: '16:6 names it directly. Ibn Kathir: "Their beauty is a kind of adornment", seen as the herd goes out in the morning and comes home in the evening.'
      tr: '16:6 onu doğrudan adlandırır. İbn Kesîr: "Güzellikleri bir tür süstür"; sürü sabah dışarı çıkarken ve akşam eve dönerken görülür.'
  - q:
      en: Does "tamed" mean they were domesticated?
      tr: '"Hizmetine vermişiz" (Saheeh: "tamed") evcilleştirildikleri anlamına mı geliyor?'
    a:
      en: The commentators read it as God making them manageable — "even if a young child comes to a camel he can make it kneel down" (Ibn Kathir). The history of domestication (about 10,500 years for sheep and goats; about 3,000 for camels) is a separate, scientific account.
      tr: "Müfessirler onu Allah'ın onları yönetilebilir kılması olarak okudu: \"Küçük bir çocuk bir deveye gelse bile onu çöktürebilir\" (İbn Kesîr). Evcilleştirmenin tarihi (koyun ve keçi için yaklaşık 10.500 yıl; deve için yaklaşık 3.000 yıl) ayrı, bilimsel bir anlatımdır."
  - q:
      en: What is the "warmth" in 16:5?
      tr: 16:5'teki "ısıtacak şeyler" nedir?
    a:
      en: "Clothing, said Ibn ʿAbbas (via Ibn Kathir); al-Jalālayn: garments from their hair and wool; *Tanwīr*: clothing made from their skins."
      tr: "İbn Abbâs'a göre giysi (İbn Kesîr yoluyla); *Celâleyn*: kıllarından ve yünlerinden giysiler; *Tenvîr*: derilerinden yapılmış giysiler."
  - q:
      en: Which animals are meant?
      tr: Hangi hayvanlar kastediliyor?
    a:
      en: "*Al-anʿām*: al-Jalālayn names camels, cattle and sheep; *Tanwīr* reads 16:5 as camels."
      tr: "*El-en'âm*: *Celâleyn* develeri, sığırları ve koyunları sayar; *Tenvîr* 16:5'i develer olarak okur."
