id: S3
slugs:
  tr: ari-ve-bal
  en: bee-and-honey
order: 3
theme: animals
verses:
  - 16:68-69
title:
  tr: Arı ve bal
  en: The bee and honey
summary:
  tr: 16:68–69, arıya inşa etmesi, beslenmesi ve yollarını izlemesi için "vahyedildiğini" ve ondan "renkleri çeşitli bir bal" çıktığını söyler, "ki, onda insanlar için şifâ vardır".
  en: 16:68–69 says the bee was "inspired" to build, to feed and to follow its paths, and that from it comes "a drink, varying in colors, in which there is healing for people".
verseNotes:
  tr: |-
    "Senin Rabbin bal arısına şöyle vahyetti: Dağlardan, ağaçlardan ve insanların kuracakları kovanlardan kendine evler edin. Sonra meyvaların hepsinden ye de, Rabbinin (sana) kolay kıldığı yollara gir, diye ilham etti. Onların karınlarından renkleri çeşitli bir bal çıkar ki, onda insanlar için şifâ vardır. Şüphesiz ki bunda düşünen bir millet için, büyük bir ibret vardır." (16:68–69).

    - **Anahtar kelimeler.** *Evhâ* ("vahyetti"), peygamberlere gelen vahiy için de kullanılan *vahy* kelimesinden gelir; burada bir varlığa yerleştirilmiş yol gösterici bir yönlendirme demektir. *Şifâ* Arapçada nekredir (belirsizdir): "şifa", "tek tedavi" değil.
    - **Dişil fiiller.** Arıya verilen emirler (*ittehizî*, "edin"; *kulî*, "ye"; *üslükî*, "gir") dilbilgisi bakımından dişildir. Bunun arıların cinsiyeti hakkında bir şey söyleyip söylemediği belirsizdir: *nahl* gibi Arapça topluluk isimleri zaten genellikle dişil uyum alır (adı belli bir kaynakta kontrol edilmemiş bir dilbilgisi noktası). En azından biyolojiyle tutarlıdır (aşağıda).
    - **Bağlam.** Nahl Sûresi Mekkîdir ve adını bu pasajdan alır. 16:65–67'deki rızık işaretleri dizisini (yağmur, süt, meyve) sürdürür.
  en: |-
    "And your Lord inspired to the bee, 'Take for yourself among the mountains, houses, and among the trees and [in] that which they construct. Then eat from all the fruits and follow the ways of your Lord laid down [for you].' There emerges from their bellies a drink, varying in colors, in which there is healing for people. Indeed in that is a sign for a people who give thought" (16:68–69).

    - **Key words.** *Awḥā* ("inspired") is from *waḥy*, the word also used for revelation to prophets; here it means a guiding prompt placed in a creature. *Shifāʾ* ("healing") is indefinite in Arabic: "healing", not "the cure".
    - **Feminine verbs.** The commands to the bee (*ittakhidhī*, "take"; *kulī*, "eat"; *uslukī*, "follow") are grammatically feminine. Whether this says anything about the bees' sex is unclear: Arabic collective nouns like *naḥl* commonly take feminine agreement anyway (a grammatical point not checked in a named source). It is at least consistent with the biology (below).
    - **Setting.** Sura al-Naḥl is Meccan and is named after this passage. It continues the run of signs of provision in 16:65–67 (rain, milk, fruit).
tafsir:
  tr: |-
    **İbn Kesîr "vahyetti" hakkında.** "Buradaki vahiyden kasıt hidayettir." Arı "evini dağlarda, ağaçlarda ve insanların kurduğu yapılarda yapmaya yöneltilir." Peteğinde "altıgen şekiller ve birbirine geçen biçimler" vardır, "peteklerinde hiçbir gevşeklik yoktur". Beslenmek için dışarı çıkar ve "sağa sola sapmadan kovanına döner".

    **"Rabbinin yolları" hakkında.** İbn Kesîr iki okuma aktarır. Mücâhid: Bunlar arıların izlediği yollardır, "sizin için kolay oldukları gibi". Katâde ve Abdurrahman b. Zeyd: Arı onları "itaatkâr bir şekilde" izler. İbn Cerîr et-Taberî ikisinin de doğru olduğunu savundu.

    **Bal ve "şifa" hakkında.** İbn Kesîr balı "beyaz, sarı, kırmızı ya da arıların yediği farklı şeylere bağlı olarak başka güzel renklerde" olarak tarif eder ve şifayı balın şifası olarak okur: "Balda insanların uğradığı hastalıklara bir şifa vardır." Kardeşinin midesi rahatsız olan bir adamın hadisini zikreder: Hz. Peygamber (s.a.v.) ona bal vermesini söyledi ve adam faydası olmadığını söyleyerek geri dönünce, İbn Kesîr'in çevirmeninin ifadesiyle şöyle cevap verdi: "Allah doğru söyledi, kardeşinin midesi yalan söylüyor" (İbn Kesîr, Buhârî ve Müslim'e atıfla; sunnah.com'da {hadith:bukhari:5684}: "Allah doğruyu söyledi, ama kardeşinin karnı yalan söyledi"). Kardeşi daha fazla baldan sonra iyileşti.

    ***Celâleyn* "şifa" hakkında.** Ana okuması balın "insanlar için bütün hastalıklardan bir şifa" olduğudur. Sonra başka görüşler aktarır: "Bunun yalnızca bazı hastalıklar için şifa olduğu da söylenmiştir", "*şifâun* belirsiz isminin gösterdiği gibi", "ya da başka bir ilaçla desteklendiğinde bütün hastalıklar için bir şifa olduğu", "ya da bu diğer ilaçlar olmadan, ama iyileşme kararlılığıyla (niyetle)".

    **İkinci bir görüş.** İbn Abbâs'a nispet edilen bir tefsir olan *Tenvîrü'l-Mikbâs*, şifayı balın şifası olarak okur ("balda hastalıktan insanlar için ( şifa vardır )") ve sonra ikinci bir görüş aktarır: "Bunun şu anlama geldiği de söylenmiştir: Kur'an'da insanlar için şifa vardır" (surahquran.com, 16:69). İbn Kesîr bu ikinci görüşten söz etmez.
  en: |-
    **Ibn Kathir on "inspired".** "What is meant by inspiration here is guidance." The bee "is guided to make its home in the mountains, in trees and in structures erected by man". Its comb has "hexagonal shapes and interlocking forms" with "no looseness in its combs". It goes out to feed and "comes back to its hive without swerving to the right or left".

    **On "the ways of your Lord".** Ibn Kathir reports two readings. Mujahid: these are routes the bees follow, "as they are easy for you". Qatada and ʿAbd al-Rahman ibn Zayd: the bee follows them "in an obedient way". Ibn Jarir al-Tabari held that both are correct.

    **On honey and "healing".** Ibn Kathir describes honey as "white, yellow, red, or of other good colors, depending on the different things that the bees eat", and reads the healing as honey's: "there is a cure in honey for diseases that people suffer from". He cites the hadith of a man whose brother had stomach trouble: the Prophet (pbuh) told him to give honey, and when the man came back saying it had not helped, he replied, in Ibn Kathir's translator's wording, "Allah speaks the truth and your brother's stomach is lying" (Ibn Kathir, citing al-Bukhari and Muslim; on sunnah.com, {hadith:bukhari:5684}: "Allah has said the truth, but your brother's `Abdomen has told a lie"). The brother recovered after more honey.

    **Al-Jalālayn on "healing".** Its main reading is that honey is "a cure for mankind from all ailments". It then reports other views: "it is also said that it means that it is a cure only for some ailments", "as indicated by the indefinite noun *shifāʾun*", "or that it is a cure for all ailments when supplemented with some other remedy", "or without these other remedies but with the resolve niyya to get better".

    **A second view.** *Tanwīr al-Miqbās*, a commentary attributed to Ibn ʿAbbas, reads the healing as honey's ("in honey there ( is healing for mankind ) from illness"), and then reports a second view: "it is also said that this means: there is in the Qur'an healing for mankind" (surahquran.com, 16:69). Ibn Kathir does not mention this second view.
howItWorks:
  tr: |-
    - **"Meyvaların hepsinden".** [Established] Toplayıcı arılar çiçeklerden nektar toplar. "Nektar yüzde 80'e kadar su içerebilir" (Collins-Smith, MSU Extension).
    - **"Onların karınlarından".** [Established] Nektar, arının ağırlığının üçte birine kadarını taşıyabilen "arının kursağında, ya da bal midesinde" taşınır. Toplayıcı arı nektarı "yutarken" ona bir enzim, invertaz ekler; bu da sakkarozu daha basit şekerlere ayırmaya başlar. Kovana döndüğünde "nektar yükünü özel besin işleyen arılara geri çıkarır" (MSU Extension).
    - **Nektardan bala.** [Established] Arılar nektarı "kovanda kanatlarını hızla çırparak ya da yelpazeleyerek" kurutur; bu da "su içeriğini yaklaşık yüzde 18'e indirir" (MSU Extension).
    - **"Renkleri çeşitli".** [Established] Balın rengi ve tadı, nektarın geldiği çiçeklere bağlıdır; İbn Kesîr'in de söylediği gibi.
    - **Toplayıcılar dişidir.** [Established, ama okunan kaynak bunu göstermiyor] Toplayıcılar dişi işçi arılardır; MSU Extension anlatımı bunu yalnızca ima eder ("onun nektar yükü"). Adı belli bir kaynağa ihtiyaç var.
    - **"İnsanlar için şifa": denemeler ne gösteriyor?**
      - *Yanıklar.* [Orta ila Yüksek, bu tek kullanım için] Bir Cochrane derlemesi (Jull ve ark. 2015; 26 deneme, 3.011 katılımcı), "bal pansumanlarının kısmi kalınlıktaki yanıkları geleneksel pansumanlardan daha hızlı iyileştirdiğini", yaklaşık 4,7 gün daha hızlı olduğunu buldu (bu karşılaştırma için yüksek kesinlikte delil). Ama genel olarak yaralar için "genel sonuçlar çıkarmak zordu" ve delillerin çoğu düşük ya da çok düşük kesinlikteydi.
      - *Öksürük ve soğuk algınlığı.* [Orta] *BMJ Evidence-Based Medicine*'de yayımlanan bir meta-analiz (14 çalışma), balın olağan bakıma kıyasla öksürük sıklığını (standartlaştırılmış ortalama fark −0,36; %95 GA −0,50 ile −0,21) ve öksürük şiddetini (−0,44; −0,64 ile −0,25) azalttığını buldu. Yazarlar plasebo kontrollü denemeler yapılması çağrısında bulundu.
  en: |-
    - **"From all the fruits".** [Established] Foragers collect nectar from flowers. "Nectar can contain up to 80 percent water" (Collins-Smith, MSU Extension).
    - **"From their bellies".** [Established] Nectar is carried in "the bee's crop, or honey stomach", which can hold up to a third of the bee's weight. The forager adds an enzyme, invertase, "as they swallow it", which begins splitting sucrose into simpler sugars. Back at the hive, she "regurgitates her nectar load to special food-handling bees" (MSU Extension).
    - **From nectar to honey.** [Established] Bees dry the nectar by "rapidly beating or fanning their wings in the hive", which "reduces that water content to around 18 percent" (MSU Extension).
    - **"Varying in colors".** [Established] Honey's colour and flavour depend on the flowers the nectar came from, as Ibn Kathir also says.
    - **The foragers are female.** [Established, but not shown by the source read] Foragers are female worker bees; the MSU Extension account only implies it ("her nectar load"). A named source is needed.
    - **"Healing for people": what trials show.**
      - *Burns.* [Moderate to High for this one use] A Cochrane review (Jull et al. 2015; 26 trials, 3,011 participants) found that "honey dressings heal partial thickness burns more quickly than conventional dressings", by about 4.7 days (high-certainty evidence for this comparison). But for wounds overall it was "difficult to draw overall conclusions", and most of the evidence was of low or very low certainty.
      - *Coughs and colds.* [Moderate] A meta-analysis in *BMJ Evidence-Based Medicine* (14 studies) found honey reduced cough frequency (standardised mean difference −0.36; 95% CI −0.50 to −0.21) and cough severity (−0.44; −0.64 to −0.25) compared with usual care. The authors called for placebo-controlled trials.
awe:
  tr: |-
    - Kanada Bal Konseyi'nin hesabına göre (Ribbands 1949'a dayanarak yük başına en az 100 çiçek varsayar) yarım kilo bal için 2,6 milyonu aşkın çiçek ziyareti ve yaklaşık 80.000 kilometre (50.000 mil) uçuş.
    - Bir toplayıcı arının bal midesi vücut ağırlığının üçte birine kadarını taşıyabilir (MSU Extension).
    - Arılar kanatlarını yelpazeleyerek %80'e kadar su içeren nektarı yaklaşık %18 su içeren bala dönüştürür (MSU Extension).
  en: |-
    - Over 2.6 million flower visits for one pound of honey, and about 50,000 miles of flight, on the Canadian Honey Council's calculation (which assumes at least 100 flowers per load, after Ribbands 1949).
    - A forager's honey stomach can hold up to a third of her body weight (MSU Extension).
    - Bees turn nectar of up to 80% water into honey of about 18% water by fanning their wings (MSU Extension).
honestNotes:
  - en: "**\"Healing\", not \"cure for everything\".** The verse's *shifāʾ* is indefinite. Al-Jalālayn's English text says both \"from all ailments\" and \"only for some ailments\"; the evidence today supports benefit for some uses (partial-thickness burns; cough symptoms), uncertain benefit for others, and no evidence for honey as a general cure."
    tr: "**\"Şifa\", \"her şeyin tedavisi\" değil.** Âyetteki *şifâ* belirsizdir. *Celâleyn*'in İngilizce metni hem \"bütün hastalıklardan\" hem de \"yalnızca bazı hastalıklar için\" der; bugünkü deliller bazı kullanımlar için fayda (kısmi kalınlıktaki yanıklar; öksürük belirtileri), diğerleri için belirsiz fayda gösteriyor ve balın genel bir tedavi olduğuna dair hiçbir delil yok."
  - en: '**The popular claims.** Two are common: that the feminine verbs "prove" the Quran knew worker bees are female, and that "from their bellies" anticipated the honey stomach. Both fit the biology, but neither is decisive: the feminine grammar may simply follow the collective noun, and the commentators read here did not draw either point. No named source making these claims was read.'
    tr: "**Popüler iddialar.** İkisi yaygındır: dişil fiillerin Kur'an'ın işçi arıların dişi olduğunu bildiğini \"ispat ettiği\" ve \"onların karınlarından\" ifadesinin bal midesini önceden bildirdiği. İkisi de biyolojiye uyar, ama hiçbiri kesin değildir: Dişil dilbilgisi sadece topluluk ismini izliyor olabilir ve burada okunan müfessirler bu noktalardan hiçbirini çıkarmadı. Bu iddiaları ileri süren adı belli hiçbir kaynak okunmadı."
  - en: "**The numbers are estimates.** The Council's 2.6 million flowers and 50,000 miles are its own calculations from assumed averages."
    tr: "**Rakamlar tahminidir.** Konsey'in 2,6 milyon çiçeği ve 50.000 mili, varsayılan ortalamalardan yaptığı kendi hesaplarıdır."
  - en: '**A figure to drop.** No source for this was read. The Canadian Honey Council page says "about 1 and ½ teaspoons", with no source either. The two disagree by a factor of 18; the figure should be removed until a primary source is found.'
    tr: "**Çıkarılması gereken bir rakam.** Bunun için hiçbir kaynak okunmadı. Kanada Bal Konseyi'nin sayfası \"yaklaşık 1,5 çay kaşığı\" diyor, o da kaynaksız. İkisi arasında 18 kat fark var; birincil bir kaynak bulunana kadar rakam çıkarılmalı."
