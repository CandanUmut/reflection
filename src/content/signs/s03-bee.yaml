followUps:
  - q:
      en: Does "inspiration" mean the bee receives revelation like a prophet?
    a:
      en: "No: Ibn Kathir explains it as guidance, and al-Razi as instinct."
  - q:
      en: Is honey a cure for everything?
    a:
      en: The verse says of honey "in which there is healing for people" (16:69); scholars did not read it as a cure for every illness, and the honest notes on this page discuss the evidence.
