slugs:
  tr: ari-ve-bal
  en: bee-and-honey
order: 3
theme: animals
verses:
  - 16:68-69
title:
  tr: Arı ve bal
  en: The bee and honey
summary:
  tr: Bir libre bal için tahminen 2,6 milyondan fazla çiçek ziyareti. Bir arı ömrü boyunca bir çay kaşığının yaklaşık on ikide biri kadar bal yapar.
  en: An estimated 2.6 million or more flower visits for a pound of honey. One bee makes about 1/12 teaspoon in its lifetime.
verseNotes:
  tr: Allah arıya "vahyetti"; ondan "renkleri çeşitli, şifa veren" bir içecek çıkar; bu, "düşünen bir toplum için" bir âyettir.
  en: God "inspired" the bee, and from it comes a drink "of varied colours, with healing", a sign "for people who reflect".
tafsir:
  tr: |
    Râzî, arıya gelen *vahyi* içgüdü olarak okur. Âyetteki fiiller dişildir; işçi arılar da dişidir. Hz. Peygamber balı tavsiye etmiştir (Buhârî 5684).
  en: "**Inspiration as guidance.** Ibn Kathir: \"What is meant by inspiration here is guidance.\" The bee is guided to make its home \"in the mountains, in trees and in structures erected by man\", and its home is \"a solid structure, with its hexagonal shapes and interlocking forms\". Each bee goes out to the fruits and \"comes back to its hive without swerving\". Al-Razi reads the bee's inspiration (*wahy*) as instinct. The verbs addressed to the bee are feminine, and worker bees are female."
howItWorks:
  tr: |
    [Established]

    - Dişi toplayıcı arılar nektarı bal midelerinde taşır.
    - İnvertaz enzimi sakarozu parçalar.
    - Kanat çırpma (yelpazeleme), suyu yaklaşık %20'nin altına indirir.
  en: |
    [Established]

    - Female foragers carry nectar in the crop.
    - The enzyme invertase splits sucrose.
    - Fanning drives water below about 20%.
awe:
  tr: |
    - Her uçuşta 50–100 çiçek.
    - Kanada Bal Konseyi: bir libre bal için 2,6 milyondan fazla çiçek ziyareti (her yükte en az 100 çiçek varsayımıyla 2.670.588; Ribbands 1949'a dayanarak) ve yaklaşık 50.000 mil uçuş. Konseyin kendi "Arı Bilgileri" sayfası bunu iki milyona yuvarlar.
    - Bir arı ömrü boyunca bir çay kaşığının yaklaşık 1/12'si kadar bal yapar.
  en: |
    - 50–100 flowers per trip.
    - Canadian Honey Council: over 2.6 million flower visits per pound (2,670,588, assuming at least 100 flowers per load, after Ribbands 1949) and about 50,000 miles of flight. The Council's own "Bee Facts" page rounds this to two million.
    - One bee makes about 1/12 teaspoon in its lifetime.
honestNotes:
  - tr: Bu rakamlar varsayımlara dayanan tahminlerdir. Bal antibakteriyeldir ve öksürüğe iyi gelir, ama her derde deva değildir.
    en: These figures are assumption-based estimates. Honey is antibacterial and helps coughs, but it is not a cure-all.
visualizations:
  - id: ideas
    tr: Bir kovan kesiti ve kavanoz doldukça artan bir çiçek sayacı.
    en: A hive cross-section and a jar-filling flower counter.
