followUps:
  - q:
      en: Does "inspiration" mean the bee receives revelation like a prophet?
      tr: '"Vahyetti" arının bir peygamber gibi vahiy aldığı anlamına mı geliyor?'
    a:
      en: No. Ibn Kathir explains it as guidance. The same Arabic root covers a range of meanings, from a prophet's revelation to an instinct placed in a creature.
      tr: Hayır. İbn Kesîr bunu hidayet olarak açıklar. Aynı Arapça kök, bir peygamberin vahyinden bir varlığa yerleştirilmiş bir içgüdüye kadar bir anlam yelpazesini kapsar.
  - q:
      en: Is honey a cure for everything?
      tr: Bal her şeyin tedavisi mi?
    a:
      en: The verse says honey contains "healing" (16:69), with an indefinite noun. Al-Jalālayn notes that it can mean healing for some ailments. Trials show benefit for some uses, such as burns and coughs (see "How it works").
      tr: Âyet balın belirsiz bir isimle "şifa" içerdiğini söyler (16:69). *Celâleyn* bunun bazı hastalıklar için şifa anlamına gelebileceğini not eder. Denemeler yanıklar ve öksürük gibi bazı kullanımlar için fayda gösteriyor (bkz. "Nasıl işler?").
  - q:
      en: What is the hadith about honey and the stomach?
      tr: Bal ve mide hakkındaki hadis nedir?
    a:
      en: A man's brother had stomach trouble; the Prophet (pbuh) told him to give honey, and when it seemed not to work he said, "Allah has said the truth, but your brother's `Abdomen has told a lie" ({hadith:bukhari:5684}, narrated by Abu Saʿid al-Khudri). The brother recovered after more honey.
      tr: "Bir adamın kardeşinin midesi rahatsızdı; Hz. Peygamber (s.a.v.) ona bal vermesini söyledi ve işe yaramıyor gibi görünce şöyle buyurdu: \"Allah doğruyu söyledi, ama kardeşinin karnı yalan söyledi\" ({hadith:bukhari:5684}, Ebû Saîd el-Hudrî'den). Kardeşi daha fazla baldan sonra iyileşti."
  - q:
      en: Does "from their bellies" mean honey is vomit?
      tr: '"Onların karınlarından" balın kusmuk olduğu anlamına mı geliyor?'
    a:
      en: Nectar is carried in the crop ("the bee's crop, or honey stomach") and is passed from bee to bee. It is changed by enzymes and drying, not digested (MSU Extension).
      tr: Nektar kursakta ("arının kursağı, ya da bal midesi") taşınır ve arıdan arıya aktarılır. Sindirilmez, enzimlerle ve kurutmayla değiştirilir (MSU Extension).
  - q:
      en: Why does the verse say "varying in colors"?
      tr: Âyet neden "renkleri çeşitli" diyor?
    a:
      en: "Honey's colour depends on the flowers, as Ibn Kathir notes: \"white, yellow, red, or of other good colors\"."
      tr: "İbn Kesîr'in not ettiği gibi balın rengi çiçeklere bağlıdır: \"beyaz, sarı, kırmızı ya da başka güzel renklerde\"."
