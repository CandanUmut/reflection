followUps:
  - q:
      en: Does "None holds them up except Allah" (16:79) deny aerodynamics?
    a:
      en: 'No: Ibn Kathir himself says God holds them up by "subjecting the air to carry them". The physics of flight is in "How it works".'
  - q:
      en: Why gliding and flapping?
    a:
      en: Ibn Kathir reads "with wings outspread and [sometimes] folded in" (67:19) as those two kinds of flight.
