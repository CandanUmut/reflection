theme: animals
verses:
  - 16:79
  - 67:19
title:
  tr: Gökte tutulan kuşlar
  en: Birds held in the sky
summary:
  tr: Yaklaşık beş aylık bir kıyı çulluğu 2022'de, daha önce hiç uçmadığı bir rotada yaklaşık 13.560 km'yi konmadan uçtu.
  en: In 2022 a godwit about five months old flew about 13,560 km nonstop, on a route it had never flown.
verseNotes:
  tr: Her iki âyet de Allah'ın inayetini anlatan pasajların içindedir.
  en: Both verses sit within passages on God's care.
tafsir:
  tr: |
    Râzî ve İbn Kesîr: havada tutulan ağır bir beden, sebepleri (kanatları, havayı) yaratan bir Koruyucuya işaret eder; aerodinamik inkâr edilmez.
  en: '**Held up, with the means He gave.** On 16:79, Ibn Kathir asks the reader to "look at the birds held (flying) in the sky, between heaven and earth": "it is He Who gave them the strength to do that, subjecting the air to carry them and support them". On 67:19 he describes the two ways of flight: "sometimes they spread their wings out in the wind (gliding) and other times they gather and spread (flapping) the wings". Al-Razi makes the same point: a heavy body held in the air points to a Sustainer who creates the means — wings and air. The tafsir does not deny the means; it looks through them.'
howItWorks:
  tr: |
    - Kanatlar havayı aşağı doğru saptırır ve basınç farkları (kaldırma kuvveti) oluşturur; kanat çırpmak itme sağlar.
    - Süzülen kuşlar sıcak hava akımlarını (termikleri) kullanır.
    - Göçmen kuşlar güneşe, yıldızlara ve manyetik ipuçlarına göre yön bulur.
  en: |
    - Wings deflect air downward and create pressure differences (lift); flapping gives thrust.
    - Soaring birds use thermals.
    - Migrants navigate by sun, stars and magnetic cues.
awe:
  tr: |
    [Established]

    - Ekim 2022'de uydudan izlenen, yaklaşık beş aylık genç bir kıyı çulluğu (bar-tailed godwit), Alaska'dan Tazmanya'ya yaklaşık 13.560 km'yi 11 gün 1 saatte, yemeden, içmeden ve dinlenmeden, daha önce hiç uçmadığı bir rotada konmadan uçtu.
    - Kıyı çullukları yola çıkmadan önce sindirim organlarını küçültür ve vücut ağırlıklarının yarısından fazlası kadar yağ taşır (BirdLife International).
    - Sonraki modeller mesafeyi yaklaşık 13.391–13.560 km olarak verir.
  en: |
    [Established]

    - In October 2022 a satellite-tagged juvenile bar-tailed godwit, about five months old, flew roughly 13,560 km nonstop from Alaska to Tasmania in 11 days and 1 hour, without food, water or rest, on a route it had never flown.
    - Before departure godwits shrink digestive organs and carry fat over half their body weight (BirdLife International).
    - Later models put the distance at about 13,391–13,560 km.
reflection:
  tr: "Bağımlılık ve inayet: kendi yapmadığı yasalarla havada tutulan, görünmeyen bir okyanusun üzerinden yol gösterilen bir kuş."
  en: '"None holds them [aloft] except the Most Merciful" (67:19). Ibn Kathir does not deny the means: God holds the bird up by "subjecting the air to carry them". A five-month-old godwit flew about 13,560 km nonstop over an ocean it had never crossed. It was held up by laws it did not make and guided by senses it did not design. The verse invites a double look: see the physics clearly, and then see through it to the care behind it.'
honestNotes:
  - tr: Âyetler aerodinamiği anlatmaz; kaldırma kuvvetini "önceden bildirdiklerini" iddia etmemek gerekir.
    en: The verses don't describe aerodynamics; don't claim they "predicted" lift.
