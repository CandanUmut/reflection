followUps:
  - q:
      en: If air and wings keep birds up, why does the verse say God does?
    a:
      en: 'The commentators did not see these as rivals. Ibn Kathir: God gave them strength and subjected "the air to carry them". The means are how the holding happens.'
  - q:
      en: What do "outspread" and "folded in" mean?
    a:
      en: Gliding with wings spread, and flapping or folding them. Ibn Kathir describes both.
  - q:
      en: How did the godwit know where to go?
    a:
      en: The source read does not explain how it navigated, and no study of bird navigation was read for this run.
  - q:
      en: Why is the name "the Most Merciful" used in 67:19?
    a:
      en: The verse follows warnings of what God could send (67:16–17); holding the birds up is presented as mercy rather than punishment.
