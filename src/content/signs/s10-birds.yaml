followUps:
  - q:
      en: What do "outspread" and "folded in" mean?
    a:
      en: Gliding with wings spread, and flapping or folding them; Qatada and Mujahid (in al-Tabari) and al-Qurtubi describe exactly this.
  - q:
      en: If birds fly by lift, why does the verse say only God holds them?
    a:
      en: 'Ibn Kathir: God holds them by "subjecting the air to carry them". The physics describes the means; the verse names who gave the means.'
  - q:
      en: How long can a bird stay in the air?
    a:
      en: Great frigate birds can stay aloft for up to two months (Weimerskirch et al., 2016).
  - q:
      en: What is the longest non-stop bird flight recorded?
    a:
      en: A juvenile bar-tailed godwit flew 13,560 km from Alaska to Tasmania in 2022 (Guinness World Records).
  - q:
      en: Why "the Most Merciful" in 67:19?
    a:
      en: Because holding every bird in the air is a constant mercy; the next verse asks who else could protect us (67:20).
