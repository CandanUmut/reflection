      tr: |
        - Ekim 2022'de uydudan izlenen, yaklaşık beş aylık genç bir kıyı çulluğu Alaska'dan Tazmanya'ya yaklaşık 13.560 km'yi 11 gün 1 saatte, konmadan uçtu; daha önce hiç uçmadığı bir rotadaydı.
        - Yola çıkmadan önce kıyı çullukları sindirim organlarını küçültür ve vücut ağırlıklarının yarısından fazlası kadar yağ taşır (BirdLife International).
        - Sonraki modeller mesafeyi yaklaşık 13.391–13.560 km olarak verir.
        - Çizimdeki rota ve yağ göstergesi şematiktir: gerçek harita ya da yağ harcama eğrisi değildir. Gösterge yalnızca deponun azaldığını anlatır, varışta ne kadar kaldığını göstermez; mesafe sayacı da hızı sabit varsayar.
      en: |
        - In October 2022 a satellite-tagged juvenile godwit, about five months old, flew roughly 13,560 km nonstop from Alaska to Tasmania in 11 days and 1 hour, on a route it had never flown.
        - Before departure godwits shrink digestive organs and carry fat over half their body weight (BirdLife International).
        - Later models put the distance at about 13,391–13,560 km.
        - The route and the fat gauge in the drawing are schematic: not a real map, not a measured fat-burning curve. The gauge only shows that the store runs down, not how much is left on arrival; the distance counter assumes a constant speed.
