title:
  tr: Gökte tutulan kuşlar
  en: Birds held in the sky
summary:
  tr: Yaklaşık beş aylık bir kıyı çulluğu 2022'de, daha önce hiç uçmadığı bir rotada yaklaşık 13.560 km'yi konmadan uçtu.
  en: '16:79 and 67:19 ask us to look up: birds hang in the air, wings spread or folded, and "None holds them up except Allah."'
verseNotes:
  tr: Her iki âyet de Allah'ın inayetini anlatan pasajların içindedir.
  en: |-
    "Do they not see the birds controlled in the atmosphere of the sky? None holds them up except Allah. Indeed in that are signs for a people who believe" (16:79), Meccan. It comes in a passage listing God's gifts: hearing, sight and hearts (16:78), then homes and tents (16:80).

    "Do they not see the birds above them with wings outspread and [sometimes] folded in? None holds them [aloft] except the Most Merciful. Indeed He is, of all things, Seeing" (67:19), Meccan. It follows warnings that God could cause the earth to swallow people or send a storm of stones (67:16–17): the same God who could withhold safety holds the birds up.

    - **Key words.** *Musakhkharāt* ("controlled", made subservient). *Jaww al-samāʾ* ("the atmosphere of the sky"). *Ṣāffāt* ("outspread") and *yaqbiḍna* ("folded in"). *Mā yumsikuhunna illā Allāh*: "none holds them up except Allah". In 67:19 the name used is *al-Raḥmān*, "the Most Merciful".
tafsir:
  tr: |
    Râzî ve İbn Kesîr: havada tutulan ağır bir beden, sebepleri (kanatları, havayı) yaratan bir Koruyucuya işaret eder; aerodinamik inkâr edilmez.
  en: |-
    **Ibn Kathir on 16:79.** "They are held up only by Him, it is He Who gave them the strength to do that, subjecting the air to carry them and support them."

    **Ibn Kathir on 67:19.** "sometimes they spread their wings out in the wind ( gliding )", and at other times they flap.

    **Al-Jalālayn on 16:79.** "Nothing holds them when they draw in their wings or open them lest they fall except God by His power."

    **Al-Jalālayn on 67:19.** "Nothing sustains them from falling either when they are spreading them or closing them".

    **Where they agree.** Both name the means and credit God for them. Ibn Kathir: God gave the birds "strength" and subjected "the air to carry them". Al-Jalālayn, on the end of 16:79: the signs are "that they have been created in a way that enables them to fly as well as the creation of the air in such a way that it allows for flight and the holding of them up in the air so that they do not fall." For both, the means are part of what God does.
howItWorks:
  tr: |
    - Kanatlar havayı aşağı doğru saptırır ve basınç farkları (kaldırma kuvveti) oluşturur; kanat çırpmak itme sağlar.
    - Süzülen kuşlar sıcak hava akımlarını (termikleri) kullanır.
    - Göçmen kuşlar güneşe, yıldızlara ve manyetik ipuçlarına göre yön bulur.
  en: |-
    - **"Wings outspread" — gliding.** [Established] A spread wing deflects the air flowing past it downward; by Newton's third law, the air pushes the wing up. The pressure above the wing is also lower than below it. Together these produce *lift*. Soaring birds use rising columns of warm air (thermals) to gain height without flapping. (No named aerodynamics source was read for this run; this is textbook physics — see Gaps.)
    - **"Folded in" — flapping and diving.** [Established] Flapping adds forward thrust; folding the wings reduces drag for diving or bounding flight.
    - **How far the air can carry a bird.** [Established] On 13 October 2022, a bar-tailed godwit fitted with satellite tag 234684, "This five-month-old bird", left Alaska and landed at Ansons Bay in eastern Tasmania after flying "13,560 kilometres (8,435 miles)", in "11 days and one hour without the bird landing once", "without stopping for food or rest". Eric Woehler of BirdLife Tasmania estimated it lost "half or more of its body weight" on the way (Guinness World Records).
awe:
  tr: |
    [Established]

    - Ekim 2022'de uydudan izlenen, yaklaşık beş aylık genç bir kıyı çulluğu (bar-tailed godwit), Alaska'dan Tazmanya'ya yaklaşık 13.560 km'yi 11 gün 1 saatte, yemeden, içmeden ve dinlenmeden, daha önce hiç uçmadığı bir rotada konmadan uçtu.
    - Kıyı çullukları yola çıkmadan önce sindirim organlarını küçültür ve vücut ağırlıklarının yarısından fazlası kadar yağ taşır (BirdLife International).
    - Sonraki modeller mesafeyi yaklaşık 13.391–13.560 km olarak verir.
  en: |-
    - A five-month-old juvenile godwit flew 13,560 km without landing (Guinness World Records).
    - It flew day and night for 11 days, losing perhaps half its body weight (Guinness World Records, quoting Eric Woehler).
reflection:
  tr: "Bağımlılık ve inayet: kendi yapmadığı yasalarla havada tutulan, görünmeyen bir okyanusun üzerinden yol gösterilen bir kuş."
  en: |-
    Look up, the verses say: "Do they not see the birds above them with wings outspread and [sometimes] folded in?" (67:19). We see birds every day, and we stop seeing them. The Quran asks us to look again at something we take for granted: a living body, heavier than air, held up in the sky.

    The commentators did not pretend the air does nothing. Ibn Kathir says God holds the birds up by "subjecting the air to carry them and support them". The physics of lift is part of the sign, not a rival to it. Al-Jalālayn names both the bird's created ability to fly and "the creation of the air in such a way that it allows for flight".

    A young godwit that had never crossed an ocean flew from Alaska to Tasmania without landing. It was carried by air it did not make, steered by senses it did not design, and kept alive by fat its body had stored. In 67:19 the name used is *al-Raḥmān*, the Most Merciful. The verses before it warn that the ground could open and the sky could rain stones. Instead, the birds are held up.

    The verse invites a double look: see the means clearly, and then see through them to the mercy that keeps them working.
honestNotes:
  - en: '**No aerodynamics in the verse.** The verses describe what anyone can see: birds gliding and flapping, held in the air. Claims that they "predicted" lift go beyond the words, and the commentators did not read them that way.'
  - en: "**The popular claim.** No named source making a scientific-miracle claim about these verses was read for this run."
  - en: '**Distance figures.** The current page mentions "Later models put the distance at about 13,391–13,560 km". The Guinness article read here gives 13,560 km and does not mention a recalculation (see Corrections).'
