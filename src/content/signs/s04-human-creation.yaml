awe:
  tr: |-
    - Yaklaşık dört haftalıkken 3–5 mm'lik bir embriyonun zaten 21–29 çift somiti vardır (EHD; UNSW).
    - Yaygın bir kabule göre kalp yaklaşık 22. günde atmaya başlar (EHD).
    - Uzuv tomurcukları yaklaşık 24. günde (kollar) ve 26. günde (bacaklar) belirir (Lecturio).
  en: |-
    - At about four weeks, an embryo of 3–5 mm already has 21–29 pairs of somites (EHD; UNSW).
    - The heart begins to beat at about 22 days by one standard convention (EHD).
    - Limb buds appear on about day 24 (arms) and day 26 (legs) (Lecturio).
legacyHonestNotes:
  - tr: |
      Moore'un "ders kitabı embriyolojisi" iddiası tartışmalıdır. Kemik ve kas eş zamanlı gelişir; Needham da Galen'le paralellikler olduğunu not etmiştir. Âyetler bilim değil, bir âyettir (işarettir). [Debated]
    en: |
      Moore's "textbook embryology" claim is contested. Bone and muscle develop concurrently, and Needham noted Galenic parallels. The verses are a sign, not science. [Debated]
