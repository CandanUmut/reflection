title:
  tr: İnsanın yaratılışı
  en: Creation of the human being
summary:
  tr: Yaratmaya gücü yeten, eski hâline getirmeye de güç yetirir. "Başka bir yaratılış" kişiliği işaret eder.
  en: Capacity to create implies capacity to restore, and "another creation" marks personhood.
verseNotes:
  tr: 'Evreler: *nutfe* (damla), *alaka* (asılıp tutunan şey ya da pıhtı), *mudga* (çiğnenmiş et parçası), sonra etle örtülen kemikler, sonra "başka bir yaratılış".'
  en: The stages run *nuṭfa* (drop), *ʿalaqa* (clinging thing or clot), *muḍgha* (chewed lump), then bones clothed with flesh, then "another creation".
tafsir:
  tr: Klasik müfessirler *alaka*yı kan pıhtısı olarak okudu ve evreleri kırkar günlük dönemlere bağladı (Buhârî 3208); kudreti ve dirilişi vurguladılar.
  en: "**From clay, then from a drop.** Ibn Kathir explains 23:12: God \"initially created man from an extract of *Tin*\" — that is Adam (pbuh), created \"from sounding clay of altered black smooth mud\" — and then human beings from a drop (*nutfa*), in stages. Ibn Jarir al-Tabari is quoted: \"Adam was called *Tin* because he was created from it.\" Classical commentators read *'alaqa* as a clot of blood and linked the stages to forty-day phases (Bukhari 3208), using the stages above all as evidence of God's power to resurrect."
howItWorks:
  tr: |
    [Established]

    - Embriyonun rahme yerleşmesi (implantasyon) yaklaşık 6.–10. günlerde olur.
    - Kalp atışı yaklaşık 22. günde başlar.
    - Somitler 3.–4. haftalarda belirir.
    - Kemik ve kas ikisi de mezodermden doğar; kıkırdak modeller kaslarla birlikte, yaklaşık 6.–7. haftalarda oluşur.
  en: |
    [Established]

    - Implantation occurs around days 6–10.
    - The heartbeat begins around day 22.
    - Somites appear in weeks 3–4.
    - Bone and muscle both arise from mesoderm; cartilage models form around weeks 6–7, alongside muscle.
reflection:
  tr: Yaratmaya gücü yeten, yeniden diriltmeye de güç yetirir (22:5). "Başka bir yaratılış" ise kişiliğin başlangıcını işaret eder.
  en: Capacity to create implies capacity to restore (22:5), and "another creation" marks personhood.
honestNotes:
  - tr: |
      Moore'un "ders kitabı embriyolojisi" iddiası tartışmalıdır. Kemik ve kas eş zamanlı gelişir; Needham da Galen'le paralellikler olduğunu not etmiştir. Âyetler bilim değil, bir âyettir (işarettir). [Debated]
    en: |
      Moore's "textbook embryology" claim is contested. Bone and muscle develop concurrently, and Needham noted Galenic parallels. The verses are a sign, not science. [Debated]
