followUps:
  - q:
      en: Is "clay" about Adam or about every human?
    a:
      en: Ibn Kathir reads the extract of clay as Adam's creation, and the later stages as every human's.
  - q:
      en: Did the Quran describe embryology before science?
    a:
      en: Classical scholars did not read it that way; the claim and its problems are discussed in the honest notes.
