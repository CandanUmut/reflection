slugs:
  tr: insanin-yaratilisi
  en: creation-of-the-human-being
order: 4
theme: human
verses:
  - 23:12-14
seeAlso:
  - 22:5
title:
  tr: İnsanın yaratılışı
  en: Creation of the human being
summary:
  tr: '23:12–14 insanı çamurdan bir nutfeye, asılı duran bir şeye, bir et parçasına, kemiklere ve ete kadar izler ve sonra yeni bir şeyin ortaya çıktığını söyler: "sonra onu diğer bir yaratık olarak teşekkül ettirdik".'
  en: '23:12–14 traces a human being from clay to a drop, a clinging thing, a lump, bones and flesh, and then says something new appears: "then We developed him into another creation".'
verseNotes:
  tr: |-
    "And olsun biz insanı, çamurdan, bir sülâleden (süzülüp çıkarılmış çamurdan) yarattık. Sonra onu emin ve sağlam bir karargahta (rahimde) nutfe (sperma) haline getirdik. Sonra nutfeyi bir alaka (embrio) yarattık, derken o alakayı bir mudga (bir çiğnem et parçası halinde) yarattık, derken o mudgayı bir takım kemik yarattık, derken o kemiklere bir et giydirdik, sonra onu diğer bir yaratık olarak teşekkül ettirdik. Yapıp yaratanların en güzeli olan Allah, pek yücedir." (23:12–14).

    - **Anahtar kelimeler.** *Sülâle min tîn*: çamurdan bir öz. *Nutfe*: küçük bir sıvı damlası. *Karârun mekîn*: sağlam, güvenli bir yerleşim yeri. *Alaka*: tutunmak ya da asılı durmak anlamına gelen bir kökten; kan pıhtısı ya da sülük anlamına gelebilir. *Mudga*: çiğnenmiş bir lokma büyüklüğünde küçük bir et parçası. *İzâm*: kemikler. *Halkan âhar*: "diğer bir yaratık".
    - **Bağlayıcı kelimeler.** Arapça evreleri iki farklı kelimeyle bağlar: *summe* ("sonra", arada bir boşlukla) ve *fe-* ("derken", ardından gelerek). Âyet süre vermez.
    - **Bağlam.** Mü'minûn Sûresi Mekkîdir. Pasaj müminlerin bir tasvirinden (23:1–11) sonra gelir ve ölüme ve dirilişe geçer: Sonraki âyetler bundan sonra öleceğinizi, sonra Kıyamet Günü diriltileceğinizi söyler (23:15–16, özet; burada doğrulanmış veriden alıntı yapılmadı). Evreler, diriliş için yapılan bir argümanın parçasıdır.
  en: |-
    "And certainly did We create man from an extract of clay. Then We placed him as a sperm-drop in a firm lodging. Then We made the sperm-drop into a clinging clot, and We made the clot into a lump [of flesh], and We made [from] the lump, bones, and We covered the bones with flesh; then We developed him into another creation. So blessed is Allah, the best of creators" (23:12–14).

    - **Key words.** *Sulāla min ṭīn*: an extract of clay. *Nuṭfa*: a small drop of fluid. *Qarār makīn*: a firm, secure lodging. *ʿAlaqa*: from a root meaning to cling or hang; it can mean a clot of blood or a leech. *Muḍgha*: a small piece of flesh, the size of a chewed mouthful. *ʿIẓām*: bones. *Khalqan ākhar*: "another creation".
    - **The connecting words.** The Arabic links the stages with two different words: *thumma* ("then", with a gap) and *fa-* ("and so", following on). The verse does not give durations.
    - **Setting.** Sura al-Muʾminūn is Meccan. The passage follows a description of the believers (23:1–11) and leads into death and resurrection: the next verses say that after this you will die and then be raised on the Day of Resurrection (23:15–16, paraphrased; not quoted from verified data here). The stages are part of an argument for the resurrection.
tafsir:
  tr: |-
    **İbn Kesîr, 23:12 hakkında.** Allah "insanı başlangıçta *tîn*den bir özden yarattı", yani Hz. Âdem'i (a.s.), sonra onun soyunu bir damladan.

    **İbn Kesîr, evreler hakkında.** *Alaka*: "Sonra kırmızı bir pıhtı olur, uzunca bir pıhtı gibi"; İkrime'den aktarır: "Bu kandır." *Mudga*: "şekli ve hatları olmayan bir et parçası gibi". Sonra: "Ona bir şekil verdik; başı, iki kolu ve iki bacağıyla, kemikleri, sinirleri ve damarlarıyla" ve et "onu örten ve güçlendiren bir şey"dir. "Diğer bir yaratık" hakkında: "sonra ona ruhu üfledik, hareket etti ve yeni bir yaratık oldu". İbn Abbâs'tan da aktarır: "Onu bir evreden diğerine değiştiririz, ta ki bir bebek olarak çıkana kadar."

    **Kırk gün hadisi.** İbn Kesîr, İbn Mes'ûd'un (r.a.) rivayetini zikreder: "Her birinizin yaratılışı annesinin karnında kırk gün nutfe olarak toplanır", ardından pıhtı ve et parçası gelir ve "Sonra ona melek gönderilir ve ona ruhu üfler" (İbn Kesîr'in ifadesi, *Müsned-i Ahmed*'deki rivayetten; İbn Kesîr bunun "Buhârî ve Müslim tarafından da kaydedildiğini" söyler). {hadith:bukhari:3208}'in İngilizce metni farklıdır: "Bir insan(ın yaratılış maddesi) annenin rahminde kırk günde bir araya getirilir" ve "Sonra ona ruh üflenir" ifadesi, melek dört şeyi yazdıktan sonra gelir.

    ***Celâleyn*.** "Sonra nutfeyi bir pıhtıya, donmuş kana dönüştürdük… küçük bir et parçasına… kemiklere… Sonra kemiklere et giydirdik" ve "Sonra ona Ruhumuzdan üfleyerek onu bir başka yaratık olarak çıkardık."

    **Ortak noktaları ve söylemedikleri.** İkisi de *alaka*yı kan pıhtısı, "diğer bir yaratık"ı da ruhun üflenmesi olarak okur. Hiçbiri *alaka*yı "sülük" olarak okumaz ve hiçbiri kemik ile kasın hangi sırayla oluştuğunu tartışmaz. Evreleri, âyetin bağlamında olduğu gibi, Allah'ın yaratma ve dolayısıyla ölüleri diriltme kudretini göstermek için kullanırlar.
  en: |-
    **Ibn Kathir on 23:12.** God "initially created man from an extract of *Tin*" — that is, Adam (pbuh) — and then his descendants from a drop.

    **Ibn Kathir on the stages.** The *ʿalaqa*: "Then it becomes a red clot, like an elongated clot", and he cites ʿIkrima: "This is blood." The *muḍgha*: "like a piece of flesh with no shape or features". Then: "We gave it shape, with a head, two arms and two legs, with its bones, nerves and veins", and the flesh is "something to cover it and strengthen it". On "another creation": "then We breathed the soul into it, and it moved and became a new creature". He also reports Ibn ʿAbbas: "We change it from one stage to another until it emerges as an infant."

    **The forty-day hadith.** Ibn Kathir cites the report of Ibn Masʿud (ra): "The creation of anyone of you is gathered for forty days in his mother's stomach as a Nutfah", followed by the clot and the lump, and "Then the angel is sent to him and he breathes the soul into it" (Ibn Kathir's wording, from the version in Musnad Ahmad, which he says was also "recorded by Al-Bukhari and Muslim"). The English of {hadith:bukhari:3208} reads differently: "(The matter of the Creation of) a human being is put together in the womb of the mother in forty days", and "Then the soul is breathed into him" comes after the angel writes four things.

    **Al-Jalālayn.** "Then We transformed the drop of semen into a clot congealed blood… into a little lump of flesh… into bones… Then We clothed the bones with flesh", and "Then We produced him as yet another creature by breathing into him Our Spirit."

    **What they share, and what they did not say.** Both read *ʿalaqa* as a clot of blood, and "another creation" as the breathing of the soul. Neither reads *ʿalaqa* as "leech", and neither discusses the order in which bone and muscle form. Their use of the stages, as in the verse's setting, is to show God's power to create, and so to raise the dead.
howItWorks:
  tr: |-
    Her madde âyetin bir kelimesine bağlanır.
    - **"Sağlam bir karargah".** [Established] Embriyo rahim duvarına yerleşir ve orada annenin bedeniyle korunarak büyür. (Yerleşmenin zamanlamasına henüz bir kaynakta bakılmadı.)
    - **"Asılı duran" (*alaka*).** [Established] Dördüncü haftada embriyo 2–5 mm uzunluğundadır. EHD, Carnegie 10. evresini (kullandığı 1987 kabulüne göre yaklaşık 22 gün) 4–12 somitle 2–3,5 mm, 12. evreyi (yaklaşık 26 gün) 21–29 somitle 3–5 mm olarak verir; UNSW 12. evreyi "4. hafta, 26–30 gün" ve "3–5 mm" olarak verir. Bu evrede rahim duvarına tutunmuştur ve ona bağımlıdır.
    - **Kalp.** [Established, tarihlemesi tartışmalı] EHD, kalbin ilk kasılmalarının "uzun zamandır Carnegie 10. evresi ya da belki çok geç bir 9. evre olayı olarak tarif edildiğini" söyler (kendi kabulüne göre döllenmeden yaklaşık 22 gün sonra); 23, 25, hatta 28–30 gün bildiren başka çalışmaları da not eder.
    - **"Et parçası" (*mudga*).** [Established] Somitler embriyonun sırtı boyunca uzanan çift doku bloklarıdır; 10–12. evrelerde (EHD'nin kabulüne göre yaklaşık 22–26 gün) sayıları 4 çiftten 29 çifte çıkar (EHD). Embriyoya boğum boğum bir görünüm verirler.
    - **"Kemikler… et giydirdik".** [Orta, zamanlama konusunda] Uzuv tomurcukları dördüncü haftada belirir: "24. gün: üst uzuv tomurcuğunun belirmesi" ve "26. gün: alt uzuv tomurcuğunun belirmesi" (Lecturio). Uzuv dokusu "hiyalin kıkırdak modellerine" yoğunlaşır (Lecturio); bunlar sonra kemiğe dönüşür. Uzuv kası somitlerden göç eden hücrelerden gelir: "Kas miyotomdan gelir: somitlerden kaynaklanan ventrolateral hücreler" (Lecturio). Zamanlama konusunda LifeMap şöyle der: "Kemikler oluşup uzuvlar uzadıkça miyoblastlar bir araya gelir ve büyük kas kütlelerini oluşturur". Başka bir deyişle, kıkırdak iskelet ile kas aynı haftalarda, iç içe gelişir; asıl kemikleşme daha sonra gelir. Her biri için kesin hafta aralıkları okunan kaynaklarda bulunamadı.
  en: |-
    Each point is tied to a word of the verse.
    - **"A firm lodging".** [Established] The embryo implants in the wall of the womb and grows there, protected by the mother's body. (The timing of implantation has not yet been consulted in a source.)
    - **"Clinging" (*ʿalaqa*).** [Established] By the fourth week the embryo is 2–5 mm long. EHD gives Carnegie stage 10 (about 22 days, by the 1987 convention it uses) as 2–3.5 mm with 4–12 somites, and stage 12 (about 26 days) as 3–5 mm with 21–29 somites; UNSW gives stage 12 as "Week 4, 26 - 30 days" and "3 - 5 mm". At this stage it is attached to the womb wall and depends on it.
    - **The heart.** [Established, with debated dating] EHD says the heart's first contractions have "long been described as a Carnegie Stage 10 or possibly a very late Stage 9 event" — about 22 days after fertilisation by its convention — while noting other studies that report 23, 25, or even 28–30 days.
    - **"Lump" (*muḍgha*).** [Established] Somites are paired blocks of tissue along the embryo's back; at stages 10–12 (about 22–26 days by EHD's convention) their number rises from 4 to 29 pairs (EHD). They give the embryo a segmented look.
    - **"Bones… covered with flesh".** [Moderate, on the timing] Limb buds appear in the fourth week: "Day 24: appearance of upper limb bud" and "Day 26: appearance of lower limb bud" (Lecturio). The limb tissue condenses into "Models of hyaline cartilage" (Lecturio), which later turn to bone. Limb muscle comes from cells that migrate in from the somites: "Muscle comes from myotome: ventrolateral cells originating from somites" (Lecturio). On timing, LifeMap says that "As the bones form and limbs elongate, myoblasts aggregate and form the large muscle masses". In other words, the cartilage skeleton and the muscle develop in the same weeks, overlapping; bone proper (ossification) comes later. Exact week ranges for each were not found in the sources read.
reflection:
  tr: |-
    Bu âyetler, bugün yaşayan herkesin yaşadığı ama kimsenin hatırlamadığı bir hikâyeyi anlatır. Çamur, bir damla, asılı duran bir şey, bir et parçası, kemikler, et. Sonra bir kırılma: "sonra onu diğer bir yaratık olarak teşekkül ettirdik" (23:14). Müfessirler bu kırılmayı ruhun üflenmesi olarak anladı: bir bedenin bir kişi olduğu an.

    Âyetlerin sırası bir anatomi dersi değildir. Bağlamı amacını gösterir: Hemen sonraki âyetler ölümden ve yeniden diriltilmekten söz eder. Argüman basittir. Sen kendini yapmadın. Seçmediğin evrelerden, hatırlayamadığın bir yerde geçirilerek, şimdi olağan saydığın bir hayata getirildin. Bunu bir kez yapan, yeniden yapabilir.

    Burada okuyucu için başka bir şey de var. Karşılaştığın her insan aynı evrelerden geçti: birkaç milimetre olunan aynı haftalar, aynı bağımlılık. Kimse bir başkasından fazlası olarak başlamadı. Bu, alçakgönüllülük ve saygı için sessiz bir sebeptir.

    Pasaj bir açıklamayla bitmez. Övgüyle biter: "Yapıp yaratanların en güzeli olan Allah, pek yücedir." (23:14). İnsanın kendi varlığına verebileceği yakışan karşılık, çözümlemeden önce hayranlık olabilir.
  en: |-
    These verses tell a story everyone alive has lived but no one remembers. Clay, a drop, something clinging, a lump, bones, flesh. Then a break: "then We developed him into another creation" (23:14). The commentators understood that break as the breathing of the soul, the point at which a body becomes a person.

    The order of the verses is not a lecture in anatomy. Its setting shows its purpose: the very next verses speak of death and of being raised again. The argument is simple. You did not make yourself. You were brought through stages you did not choose, in a place you cannot remember, into a life you now take for granted. The One who did that once can do it again.

    There is something else here for the reader. Every person you meet passed through the same stages, the same weeks of being a few millimetres long, the same dependence. No one began as more than anyone else. That is a quiet reason for humility, and for respect.

    The passage does not end with an explanation. It ends with praise: "So blessed is Allah, the best of creators" (23:14). The fitting response to one's own existence may be wonder before it is analysis.
honestNotes:
  - en: "**The popular claim.** The best-known form is Keith Moore's: a Canadian anatomist who, by his own account, worked with an embryology committee at King Abdulaziz University and produced an edition of his textbook *The Developing Human* \"with Islamic Additions\" (1982/83). He is quoted as saying the Quran's descriptions \"cannot be based on scientific knowledge in the seventh century\" (Islamic Awareness). Photo captions there describe his \"Investigations in to the *'alaqa* or leech-like stage\"."
    tr: "**Popüler iddia.** En bilinen biçimi Keith Moore'unkidir: Kendi anlatımına göre Kral Abdulaziz Üniversitesi'ndeki bir embriyoloji komitesiyle çalışan ve *The Developing Human* adlı ders kitabının \"İslami Eklerle\" bir baskısını (1982/83) hazırlayan Kanadalı bir anatomist. Kur'an'ın tasvirlerinin \"yedinci yüzyıldaki bilimsel bilgiye dayanamayacağını\" söylediği aktarılır (Islamic Awareness). Oradaki fotoğraf altyazıları onun \"*alaka* ya da sülük benzeri evreye dair araştırmalarını\" anlatır."
  - en: |-
      **Weighing it.**
        - The words *ʿalaqa* and *muḍgha* fit the appearance of the embryo strikingly well, and that is worth noticing.
        - But the commentators read here take *ʿalaqa* as a blood clot (Ibn Kathir; ʿIkrima: "This is blood"; al-Jalālayn), not as a leech. The leech reading was not found in the classical sources read.
        - "We made [from] the lump, bones, and We covered the bones with flesh" can be read as a strict sequence: bones first, then muscle. Modern embryology shows the cartilage skeleton and muscle developing in the same weeks, overlapping (Lecturio; LifeMap). A possible reply (this page's own, not from a named source) is that "covered" describes the muscles wrapping the skeleton, not that they start later. Both readings are possible; neither is proven by the text.
        - The fair position: the verses can be read in harmony with embryology at a general level; they are not a textbook, and the commentators read here did not read them as one.
    tr: |-
      **Değerlendirme.**
        - *Alaka* ve *mudga* kelimeleri embriyonun görünüşüne çarpıcı biçimde uyar ve bu dikkat çekmeye değer.
        - Ama burada okunan müfessirler *alaka*yı sülük olarak değil, kan pıhtısı olarak alır (İbn Kesîr; İkrime: "Bu kandır"; *Celâleyn*). Sülük okuması okunan klasik kaynaklarda bulunamadı.
        - "O mudgayı bir takım kemik yarattık, derken o kemiklere bir et giydirdik" katı bir sıra olarak okunabilir: önce kemikler, sonra kas. Modern embriyoloji kıkırdak iskelet ile kasın aynı haftalarda, iç içe geliştiğini gösterir (Lecturio; LifeMap). Olası bir cevap (bu sayfanın kendi cevabı, adı belli bir kaynaktan değil), "giydirdik" ifadesinin kasların sonra başladığını değil, iskeleti sardığını tarif ettiğidir. İki okuma da mümkündür; hiçbiri metinle ispatlanmış değildir.
        - Adil tutum: Âyetler genel düzeyde embriyolojiyle uyum içinde okunabilir; bir ders kitabı değildir ve burada okunan müfessirler onları öyle okumadı.
  - en: "**The forty-day hadith.** {hadith:bukhari:3208} speaks of forty-day stages. How its timings relate to modern embryology is disputed among Muslim scholars; that debate has not yet been consulted in a named source."
    tr: "**Kırk gün hadisi.** {hadith:bukhari:3208} kırkar günlük evrelerden söz eder. Zamanlamalarının modern embriyolojiyle nasıl ilişkilendiği Müslüman âlimler arasında tartışmalıdır; bu tartışmaya henüz adı belli bir kaynakta bakılmadı."
  - en: The historian of science Joseph Needham, quoting the Quran's embryological verses, described them as "A seventh-century echo of Aristotle" (*A History of Embryology*, 1959) — a judgement this page weighs in its notes on 23:14.
