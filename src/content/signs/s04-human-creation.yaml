followUps:
  - q:
      en: Is "clay" about Adam or about every human?
      tr: "\"Çamur\" Hz. Âdem'le mi, yoksa her insanla mı ilgili?"
    a:
      en: Ibn Kathir reads the extract of clay as Adam's creation, and the later stages as every human's.
      tr: İbn Kesîr çamurdan özü Hz. Âdem'in yaratılışı, sonraki evreleri ise her insanın yaratılışı olarak okur.
  - q:
      en: Did the Quran describe embryology before science?
      tr: Kur'an embriyolojiyi bilimden önce mi tarif etti?
    a:
      en: "Classical scholars did not read it that way: they read the stages as signs of God's power to create and to resurrect. The modern claim and its problems are set out in the honest notes."
      tr: "Klasik âlimler onu böyle okumadı: Evreleri Allah'ın yaratma ve diriltme kudretinin işaretleri olarak okudular. Modern iddia ve sorunları \"Dürüst notlar\"da anlatılıyor."
  - q:
      en: What does *ʿalaqa* mean — a clot or a leech?
      tr: "*Alaka* ne demek: pıhtı mı, sülük mü?"
    a:
      en: The root means to cling or hang. Ibn Kathir and al-Jalālayn read it as a clot of blood; the "leech-like" reading was not found in the classical sources read.
      tr: Kök tutunmak ya da asılı durmak demektir. İbn Kesîr ve *Celâleyn* onu kan pıhtısı olarak okur; "sülük benzeri" okuma okunan klasik kaynaklarda bulunamadı.
  - q:
      en: What does "another creation" mean?
      tr: '"Diğer bir yaratık" ne demek?'
    a:
      en: 'Ibn Kathir: "then We breathed the soul into it, and it moved and became a new creature". Al-Jalālayn says the same.'
      tr: 'İbn Kesîr: "sonra ona ruhu üfledik, hareket etti ve yeni bir yaratık oldu". *Celâleyn* de aynısını söyler.'
  - q:
      en: Do bones really form before muscles?
      tr: Kemikler gerçekten kaslardan önce mi oluşur?
    a:
      en: In the limbs, the cartilage model and the muscle masses develop in the same weeks, overlapping; bone proper forms later. Whether the verse means a strict sequence is a matter of reading (see the honest notes).
      tr: Uzuvlarda kıkırdak model ile kas kütleleri aynı haftalarda, iç içe gelişir; asıl kemik daha sonra oluşur. Âyetin katı bir sıra kastedip kastetmediği bir okuma meselesidir (bkz. "Dürüst notlar").
