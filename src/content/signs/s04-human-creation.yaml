followUps:
  - q:
      en: Is "clay" about Adam or about every human?
    a:
      en: Ibn Kathir reads the extract of clay as Adam's creation, and the later stages as every human's.
  - q:
      en: Did the Quran describe embryology before science?
    a:
      en: "Classical scholars did not read it that way: they read the stages as signs of God's power to create and to resurrect. The modern claim and its problems are set out in the honest notes."
  - q:
      en: What does *ʿalaqa* mean — a clot or a leech?
    a:
      en: The root means to cling or hang. Ibn Kathir and al-Jalālayn read it as a clot of blood; the "leech-like" reading was not found in the classical sources read for this run.
  - q:
      en: What does "another creation" mean?
    a:
      en: 'Ibn Kathir: "then We breathed the soul into it, and it moved and became a new creature". Al-Jalālayn says the same.'
  - q:
      en: Do bones really form before muscles?
    a:
      en: In the limbs, the cartilage model and the muscle masses develop in the same weeks, overlapping; bone proper forms later. Whether the verse means a strict sequence is a matter of reading (see the honest notes).
