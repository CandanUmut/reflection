reflection:
  tr: |-
    İki su buluşur. Biri tatlı, biri acı. "Salıverilmişlerdir", akmakta serbesttirler, yine de bir şey her birinin diğerini istila etmesini önler: "Fakat aralarında bir engel vardır, birbirlerine geçip karışmıyorlar." (55:20).

    Müfessirler bunun en sade biçimini gördü. Nehirler tatlı akar; denizler tuzludur; kara aralarında durur. *Celâleyn*, birbirine değdikleri yerde "gözün algısında buluştuklarını" ama yine de ayrı kaldıklarını ekler. Bugün bir nehrin tatlı suyunun, yavaş yavaş karışmadan önce denizin üstünde aktığını izleyebiliyoruz.

    Rahmân Sûresi bunu bir bilmece olarak sunmaz. Bir nimet olarak sunar ve her işaretten sonra Rabbimizin hangi nimetlerini yalanlayacağımızı sorar. Tarlaları sulayacak kadar uzun süre tatlı kalan nehirler ve tuzlu kalan denizler, ikisi de birer armağandır.

    Burada insan hayatı için bir resim var; bir tefekkür olarak sunuluyor. Çok farklı türden insanlar yan yana yaşar. Her biri, hiçbirinin yapmadığı bir düzen içinde, diğerini istila etmeden kendi tabiatını koruyabilir. Âyet bu ölçülülüğe engel der; ona adalet de denebilir.
  en: |-
    Two waters meet. One is sweet, one bitter. They are "released", free to flow, and still something keeps each from overrunning the other: "Between them is a barrier [so] neither of them transgresses" (55:20).

    The commentators saw the plainest form of this. Rivers run sweet; seas are salt; the land stands between them. Al-Jalālayn adds that where they touch, they "meet in the perception of the eye" yet stay distinct. Today we can watch a river's fresh water ride over the sea before it slowly blends.

    Sura al-Raḥmān does not offer this as a puzzle. It offers it as a favour, and after each sign asks which of the Lord's favours we would deny. Rivers that stay sweet long enough to water fields, and seas that stay salt, are both gifts.

    There is a picture here for human life, offered as reflection. People of very different kinds live side by side. Each can keep its own nature without overrunning the other, within an order neither of them made. The verse calls that restraint a barrier; it might also be called justice.
verseNotes:
  tr: |-
    "(Acı ve tatlı) iki denizi salıverdi birbirine kavuşuyorlar. Fakat aralarında bir engel vardır, birbirlerine geçip karışmıyorlar." (55:19–20), Rahmân Sûresi (Mekkî mi Medenî mi olduğu henüz kontrol edilmedi). Sonraki âyetler ikisinden de inci ve mercan çıktığını söyler (55:22, burada özetlendi; doğrulanmış veriden alıntı yapılmadı) ve sûredeki her işaretin ardından, dinleyenlerin Rabblerinin hangi nimetlerini yalanlayacaklarını soran bir nakarat gelir (55:13 ve sonrası, özet).

    "Birinin suyu tatlı ve susuzluğu giderici, diğerininki tuzlu ve acı iki denizi salıveren ve aralarına bir engel, aşılmaz bir serhat koyan O'dur." (25:53), Furkân Sûresi, Mekkî.

    - **Anahtar kelimeler.** *Merace* ("salıverdi"): serbest bırakmak, serbestçe akıtmak. *Bahr* ("deniz"): büyük bir su kütlesi; aşağıdaki İbn Kesîr okuması bunun nehirleri de kapsayabileceğini gösterir. *Berzah* ("engel"): iki şeyin arasında duran şey. *Hicran mahcûrâ* ("aşılmaz bir serhat"): geçişi yasaklayan bir engel.
    - **Âyetler ne diyor?** İki su buluşur; aralarındaki bir şey her birinin diğerini istila etmesini önler. 25:53 birinin tatlı, birinin tuzlu olduğunu açıkça söyler.
  en: |-
    Sura al-Raḥmān is Meccan in the view of most commentators, though some (al-Zamakhshari, al-Suyuti) place it in Medina (as summarised by *Wikipedia*). The verses that follow say pearls and coral come from both (55:22, paraphrased here; not quoted from verified data), and each sign in the sura is followed by a refrain asking which of the Lord's favours the listeners would deny (55:13 and after, paraphrased).

    "And it is He who has released [simultaneously] the two seas, one fresh and sweet and one salty and bitter, and He placed between them a barrier and prohibiting partition" (25:53), Sura al-Furqān, Meccan.

    - **Key words.** *Maraja* ("released"): let loose, let flow freely. *Baḥr* ("sea"): a large body of water; Ibn Kathir's reading below shows it can cover rivers too. *Barzakh* ("barrier"): something that stands between two things. *Ḥijran maḥjūran* ("prohibiting partition"): a barrier that forbids passage.
    - **What the verses say.** Two waters meet; something between them keeps each from overrunning the other. 25:53 says plainly that one is fresh and one is salt.
legacyHonestNotes:
  - tr: '"Asla karışmazlar" demek yanlıştır. Gelgitler suyu güçlü biçimde karıştırır ve dışarı akış ilerledikçe karışır. Viral Alaska Körfezi videoları ise tortu cephelerini gösterir.'
    en: '"Never mix" is wrong. Tides mix the water strongly, and the outflow blends downstream. Viral Gulf of Alaska videos show sediment fronts.'
