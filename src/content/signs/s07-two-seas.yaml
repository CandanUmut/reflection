order: 7
theme: seas
verses:
  - 55:19-20
  - 25:53
title:
  tr: İki deniz ve aradaki engel
  en: Two seas and a barrier
summary:
  tr: Cebelitarık'ta Akdeniz suyu Atlantik suyunun altından akar. Ama "iki deniz asla karışmaz" demek yanlıştır.
  en: At Gibraltar, Mediterranean water flows beneath Atlantic water. But "the two seas never mix" is wrong.
tafsir:
  tr: Taberî ve İbn Kesîr bunu, Allah'ın kudretiyle birbirinden ayrı tutulan tatlı ve tuzlu sular olarak anladı.
  en: "**Fresh and salt, kept apart.** Ibn Kathir: \"The two seas are the fresh and salty waters, the former coming from running rivers.\" On \"between them is a barrier which none of them can transgress\", he says God \"has placed a barrier of land between these two types of waters\", and he quotes Ibn Zayd: God \"prevents them from meeting by the dividing barrier He placed between them\". Al-Tabari also understood fresh and salt waters kept distinct by God's power."
howItWorks:
  tr: |
    [Established]

    - Haloklinler (tuzluluk sınırları) ve piknoklinler (yoğunluk sınırları) su kütlelerini birbirinden ayırır.
    - Cebelitarık'ta Akdeniz suyu (tuzluluk yaklaşık 38,4–38,5, yaklaşık 13 °C), Atlantik suyunun (yaklaşık 36,1) altından akar. Ara yüz 37 tuzlulukta tanımlanır ve dışarı akış yaklaşık 0,7–1 Sverdrup'tur.
  en: |
    [Established]

    - Haloclines (salinity boundaries) and pycnoclines (density boundaries) separate water masses.
    - At Gibraltar, Mediterranean water (salinity about 38.4–38.5, about 13 °C) flows beneath Atlantic water (about 36.1). The interface is defined at salinity 37, and the outflow is about 0.7–1 Sverdrup.
awe:
  tr: Dönen Akdeniz suyu mercekleri ("meddy"ler) Atlantik'in içlerine kadar uzun yollar gider.
  en: Rotating lenses of Mediterranean water ("meddies") travel far into the Atlantic.
honestNotes:
  - tr: '"Asla karışmazlar" demek yanlıştır. Gelgitler suyu güçlü biçimde karıştırır ve dışarı akış ilerledikçe karışır. Viral Alaska Körfezi videoları ise tortu cephelerini gösterir.'
    en: '"Never mix" is wrong. Tides mix the water strongly, and the outflow blends downstream. Viral Gulf of Alaska videos show sediment fronts.'
