title:
  tr: İki deniz ve aradaki engel
  en: Two seas and a barrier
summary:
  tr: '55:19–20 ve 25:53, aralarında "bir engel" bulunan ve yan yana salıverilen iki su kütlesini anlatır: "Birinin suyu tatlı ve susuzluğu giderici, diğerininki tuzlu ve acı".'
  en: 55:19–20 and 25:53 describe two bodies of water, "one fresh and sweet and one salty and bitter", released side by side with "a barrier" between them.
tafsir:
  tr: |-
    **İbn Kesîr, 55:19–20 hakkında.** *Merace* "onları salıverdi" demektir (İbn Abbâs'a atıfla). "İki deniz tatlı ve tuzlu sulardır; birincisi akan nehirlerden gelir." Engel hakkında: Allah "bu iki tür su arasına kara parçasından bir engel" koydu ve İbn Zeyd'den aktarır: Allah "aralarına koyduğu ayırıcı engelle onların buluşmasını önler".

    **İbn Kesîr, 25:53 hakkında.** Tatlı su "nehirlerdeki, pınarlardaki ve kuyulardaki gibi"dir; "yaratılışta tatlı ve içimi hoş bir deniz hiçbir yerde yoktur". Tuzlu deniz "tuzlu, acı ve yutulması kolay olmayan"dır; Kızıldeniz, Akdeniz ve Hint Okyanusu gibi. *Berzah* "bir bölmedir, o da kuru topraktır" ve "aşılmaz serhat" da "birinin diğerine ulaşmasını önleyen bir engel"dir. Tatlı su anlamı için İbn Cüreyc'e ve İbn Cerîr et-Taberî'ye atıf yapar ve buna "şüphesiz doğru anlam" der.

    ***Celâleyn*, 55:19 hakkında.** "İki suyu, tatlıyı ve tuzluyu salıverdi; ve böylece gözün algısında buluşurlar."

    ***Celâleyn*, 25:53 hakkında.** "iki denizi birbirine bitişik akıtarak birleştirdi"; "ikisinin arasına bir berzah koydu"; "ikisinin karışmasını önleyen bir kalkan olan yasaklayıcı bir engel".

    **Nerede ayrılıyorlar?** İbn Kesîr'in engeli fiziksel karadır: Nehirleri ve denizleri aralarındaki toprak ayırır. *Celâleyn*'inki daha az belirlidir: İki su "gözün algısında buluşur" ve bir "kalkan… ikisinin karışmasını önler". Hiçbiri denizin içinde bir sınır tarif etmez ve hiçbiri Cebelitarık'tan söz etmez.
  en: |-
    **Ibn Kathir on 55:19–20.** *Maraja* means "let them loose" (citing Ibn ʿAbbas). "The two seas are the fresh and salty waters, the former coming from running rivers." On the barrier: God placed "a barrier of land between these two types of waters", and he quotes Ibn Zayd: God "prevents them from meeting by the dividing barrier He placed between them".

    **Ibn Kathir on 25:53.** The sweet water is "like that in rivers, springs and wells"; "nowhere in creation is there a sea which is fresh and sweet". The salt sea is "salty, bitter and not easy to swallow", like the Red Sea, the Mediterranean and the Indian Ocean. The *barzakh* is "a partition, which is dry land", and the "prohibiting partition" is "a barrier, to prevent one of them from reaching the other". He cites Ibn Jurayj and Ibn Jarir al-Tabari for the sweet-water meaning, calling it "the meaning without a doubt".

    **Al-Jalālayn on 55:19.** "He has loosed the two waters the sweet and the salty; and so they meet in the perception of the eye."

    **Al-Jalālayn on 25:53.** "merged the two seas letting them flow one adjacent to the other"; "He set between the two an isthmus"; "a forbidding ban a shield that prevents the two from becoming mixed".

    **Where they differ.** Ibn Kathir's barrier is physical land: rivers and seas are separated by the ground between them. Al-Jalālayn's is less specific: the two waters "meet in the perception of the eye", and a "shield… prevents the two from becoming mixed". Neither describes a boundary inside the sea, and neither mentions Gibraltar.
howItWorks:
  tr: |-
    Her madde âyetlerin "salıverdi… kavuşuyorlar", "tatlı ve susuzluğu giderici… tuzlu ve acı" ve "engel" sözlerine bağlanır.
    - **Tatlının tuzluyla buluştuğu yer.** [Established] Bir nehrin denizle buluştuğu haliçte tatlı su, daha az yoğun olduğu için "daha ağır deniz suyunun üstünde yüzer" (NOAA). Bu, 25:53'ün en yakın fiziksel resmidir: "Birinin suyu tatlı ve susuzluğu giderici, diğerininki tuzlu ve acı", yan yana.
    - **Sınırın keskinliği gelgite ve nehrin akışına bağlıdır.** [Established] NOAA haliçleri ne kadar karıştıklarına göre sınıflandırır:
      - "Tuz kamalı haliçler, hızlı akan bir nehir gelgit akıntılarının zayıf olduğu yerde okyanusa döküldüğünde oluşur": keskin bir sınır, üstte tatlı su, altta bir tuz kaması.
      - Kısmen karışmış haliçlerde "tuzlu su ve tatlı su her derinlikte karışır", ama alt katmanlar daha tuzlu kalır.
      - İyi karışmış haliçlerde "güçlü gelgit akıntıları dikey katmanlaşmayı ortadan kaldırır".
      Dolayısıyla yoğunluktan doğan bir "engel" keskin, kademeli ya da hiç olmayabilir.
    - **İki tuzlu deniz: Cebelitarık.** [Established] Cebelitarık Boğazı'ndan çıkan Akdeniz suyunun tuzluluğu "38 g/kg", sıcaklığı "13 °C"dir; bu, "o derinlik aralığındaki başka herhangi bir suya kıyasla son derece yüksektir". Yaklaşık 120 m derinlikten çıkar ve yaklaşık 1 Sverdrup (saniyede bir milyon metreküp) hızla, yaklaşık 1.100 m'lik bir denge derinliğine çöker (*Wikipedia*, "Mediterranean outflow").
    - **Ama karışır.** [Established] Cebelitarık'ta Camarinal Eşiği üzerinden akan gelgitler "bir iç dalga cephesi" oluşturur; bu da güçlü karışmaya yol açan iç dalgalara kırılır; çıkış suyu batıya ilerledikçe "karışma nedeniyle daha az tuzlu" hâle gelir. Meddy denen, 10–50 km yarıçaplı (yaklaşık 20–100 km çapında) ve 500–1.000 m kalınlığında Akdeniz suyu mercekleri, onun tuzunu Atlantik'in içlerine taşır; her yıl "15 ile 20 arasında meddy oluşur" (*Wikipedia*).
    - **Viral video.** [Established] Alaska Körfezi'nde "buluşan ama karışmayan iki okyanusu" gösterdiği söylenen ve yaygın olarak paylaşılan bir fotoğraf, Lead Stories'e göre "Alaska Körfezi'nde bir araştırma seferi sırasında çekilmiş başka bir nehir dumanını" gösterir (fotoğraf: Kent Smith, 2010). Orada aktarılan Ocean Networks Canada, benzer bir dumanı "hafif sudan bir birikinti (tatlı Fraser suyunun tuzlu suyla karışmasıyla oluşmuş)" olarak tarif eder.
  en: |-
    Each point is tied to the verses' words "released… meeting", "fresh and sweet… salty and bitter" and "barrier".
    - **Where fresh meets salt.** [Established] In an estuary, where a river meets the sea, fresh water "floats on top of the heavier seawater" because it is less dense (NOAA). This is the nearest physical picture of 25:53: "one fresh and sweet and one salty and bitter", side by side.
    - **How sharp the boundary is depends on tides and river flow.** [Established] NOAA classifies estuaries by how much they mix:
      - "Salt-wedge estuaries occur when a rapidly flowing river discharges into the ocean where tidal currents are weak": a sharp boundary, fresh above, a wedge of salt below.
      - In partially mixed estuaries "saltwater and freshwater mix at all depths", but the lower layers stay saltier.
      - In well-mixed estuaries, "Strong tidal currents eliminate the vertical layering".
      So a "barrier" of density can be sharp, gradual or absent.
    - **Two salt seas: Gibraltar.** [Established] Mediterranean water leaving through the Strait of Gibraltar has a salinity of "38 g/kg" and a temperature of "13 °C", "extremely high compared with any other waters in that depth range". It exits at about 120 m depth and sinks to an equilibrium depth of about 1,100 m, at a rate of about 1 Sverdrup (a million cubic metres per second) (*Wikipedia*, "Mediterranean outflow").
    - **But it does mix.** At Gibraltar, tides flowing over the Camarinal Sill create "an internal bore", which breaks into internal waves that drive strong mixing (*Wikipedia*). As it leaves Gibraltar, the Mediterranean water (salinity about 38.6) mixes so strongly with Atlantic water that by the time it settles, at around 900–1,000 m, its salinity has fallen to about 36.5 (Price & Yang, WHOI; Sánchez-Román et al., 2018). Mediterranean water also leaves in spinning lenses called *meddies*, typically 40–150 km across and about 800 m thick. At least 17 form each year, and some last four or five years and travel well over a thousand kilometres (Richardson, Bower & Zenk, *Progress in Oceanography*, 2000).
    - **The viral video.** [Established] A widely shared photo said to show "two oceans meeting but not mixing" in the Gulf of Alaska shows, according to Lead Stories, "another river plume taken during a research cruise in the Gulf of Alaska" (photo by Kent Smith, 2010). Ocean Networks Canada, quoted there, describes a similar plume as "a puddle of light water (formed by mixing fresh Fraser water with salt water)".
awe:
  tr: |-
    - Bir nehrin denizle buluştuğu yerde tatlı suyu, tuzlu suyun üstünde ayrı bir katman olarak akabilir (NOAA).
    - Her saniye yaklaşık bir milyon metreküp Akdeniz suyu, gelen Atlantik suyunun altından Atlantik'e dökülür (*Wikipedia*).
    - Yaklaşık 100 km çapa kadar varan Akdeniz suyu mercekleri "yıllarca hayatta kalabilir ve binlerce kilometre yol alabilir" (*Wikipedia*).
  en: |-
    - Where a river meets the sea, its fresh water can ride over the salt water in a distinct layer (NOAA).
    - About a million cubic metres of Mediterranean water pour into the Atlantic every second, beneath the incoming Atlantic water (*Wikipedia*).
    - Lenses of Mediterranean water up to about 100 km across "can survive for many years and can move through thousands of kilometers" (*Wikipedia*).
honestNotes:
  - en: '**The popular claim.** A widely shared article says: "Modern Science has discovered that in the places where two different seas meet, there is a barrier between them", that "each sea has its own temperature, salinity, and density", and that "they do not mix or transgress this barrier", using the Mediterranean outflow at Gibraltar as its example (islam-guide.com, on IslamReligion.com, citing oceanography textbooks by Davis, Gross, Kuenen and Thurman).'
    tr: "**Popüler iddia.** Yaygın olarak paylaşılan bir makale şunu söyler: \"Modern bilim, iki farklı denizin buluştuğu yerlerde aralarında bir engel olduğunu keşfetmiştir\", \"her denizin kendi sıcaklığı, tuzluluğu ve yoğunluğu vardır\" ve \"karışmazlar ya da bu engeli aşmazlar\"; örnek olarak Cebelitarık'taki Akdeniz çıkış suyunu kullanır (islam-guide.com, IslamReligion.com'da; Davis, Gross, Kuenen ve Thurman'ın oşinografi ders kitaplarına atıfla)."
  - en: |-
      **Weighing it.**
        - **"They do not mix" is wrong.** The Mediterranean outflow is strongly mixed by tides at Gibraltar and blends as it moves west (*Wikipedia*). Estuaries range from sharply layered to fully mixed (NOAA). The viral Gulf of Alaska photo shows a river plume, which mixes (Lead Stories).
        - **The verse does not say "they never mix".** It says neither "transgresses" (*lā yabghiyān*): in this page's gloss, neither overruns or takes over the other. A boundary that holds two waters apart while they slowly blend fits that word; a claim of no mixing at all is the article's, not the verse's.
        - **The commentators did not read it as an invisible barrier in the sea.** Ibn Kathir's barrier is "dry land"; he says "nowhere in creation is there a sea which is fresh and sweet". Al-Jalālayn's is a "shield". Neither mentions a density boundary.
        - **The fair statement:** the verses describe fresh and salt water meeting and staying distinct; estuaries show that vividly; the "no mixing" claim is false and should not be repeated.
    tr: |-
      **Değerlendirme.**
        - **"Karışmazlar" yanlıştır.** Akdeniz çıkış suyu Cebelitarık'ta gelgitlerle güçlü biçimde karışır ve batıya ilerledikçe harmanlanır (*Wikipedia*). Haliçler keskin katmanlıdan tamamen karışmışa kadar uzanır (NOAA). Viral Alaska Körfezi fotoğrafı, karışan bir nehir dumanını gösterir (Lead Stories).
        - **Arapça âyet "asla karışmazlar" demez.** Arapça kelime *lâ yebgıyân*'dır (Saheeh: "neither of them transgresses"): bu sayfanın açıklamasıyla, hiçbiri diğerini istila etmez ya da ele geçirmez. İki suyu yavaşça harmanlanırken ayrı tutan bir sınır bu kelimeye uyar; hiç karışmama iddiası âyetin değil, makalenin iddiasıdır.
        - **Müfessirler onu denizde görünmez bir engel olarak okumadı.** İbn Kesîr'in engeli "kuru toprak"tır; "yaratılışta tatlı ve içimi hoş bir deniz hiçbir yerde yoktur" der. *Celâleyn*'inki bir "kalkan"dır. Hiçbiri bir yoğunluk sınırından söz etmez.
        - **Adil ifade:** Âyetler tatlı ve tuzlu suyun buluşup ayrı kalmasını anlatır; haliçler bunu canlı biçimde gösterir; "hiç karışmama" iddiası yanlıştır ve tekrarlanmamalıdır.
  - en: "**Figures not yet sourced.** Those sources have not yet been consulted; the page read gives 38 g/kg and about 1 Sv."
    tr: "**Henüz kaynağı gösterilmemiş rakamlar.** Bu kaynaklara henüz başvurulmadı; okunan sayfa 38 g/kg ve yaklaşık 1 Sv verir."
