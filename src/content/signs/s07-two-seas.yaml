followUps:
  - q:
      en: Did classical scholars mean an invisible barrier in the sea?
    a:
      en: Ibn Kathir explains the barrier as land between fresh and salt water; modern estuary science is described separately.
  - q:
      en: Is the barrier "proof" of modern oceanography?
    a:
      en: No; the page treats it as a sign to notice, not a prediction (see the honest notes).
