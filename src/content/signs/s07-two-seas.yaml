followUps:
  - q:
      en: Did classical scholars mean an invisible barrier in the sea?
      tr: Klasik âlimler denizde görünmez bir engel mi kastetti?
    a:
      en: No. Ibn Kathir explains the barrier as land between rivers and sea; al-Jalālayn as a "shield" keeping them from mixing. Modern estuary science is described separately.
      tr: Hayır. İbn Kesîr engeli nehirlerle deniz arasındaki kara olarak; *Celâleyn* onların karışmasını önleyen bir "kalkan" olarak açıklar. Modern haliç bilimi ayrıca anlatılıyor.
  - q:
      en: Is the barrier "proof" of modern oceanography?
      tr: Engel modern oşinografinin "ispatı" mı?
    a:
      en: No. The page treats it as a sign to notice, not a prediction, and the popular "never mix" claim is false (see the honest notes).
      tr: Hayır. Sayfa onu bir kehanet olarak değil, fark edilecek bir işaret olarak ele alır ve popüler "asla karışmazlar" iddiası yanlıştır (bkz. "Dürüst notlar").
  - q:
      en: What is an estuary?
      tr: Haliç nedir?
    a:
      en: The place where a river meets the sea, where fresh and salt water meet and, depending on tides and river flow, layer or mix (NOAA).
      tr: Bir nehrin denizle buluştuğu yer; burada tatlı ve tuzlu su buluşur ve gelgite ve nehrin akışına göre katmanlaşır ya da karışır (NOAA).
  - q:
      en: What is happening at Gibraltar?
      tr: Cebelitarık'ta ne oluyor?
    a:
      en: Salty, warm Mediterranean water flows out under the Atlantic water flowing in, then sinks to about 1,100 m; tides mix it strongly at the strait (*Wikipedia*).
      tr: Tuzlu, ılık Akdeniz suyu içeri akan Atlantik suyunun altından dışarı akar, sonra yaklaşık 1.100 m'ye çöker; gelgitler onu boğazda güçlü biçimde karıştırır (*Wikipedia*).
  - q:
      en: What does "neither of them transgresses" mean?
      tr: '*Lâ yebgıyân* (Saheeh: "neither of them transgresses") ne demek?'
    a:
      en: That neither overruns the other. For Ibn Kathir, land keeps rivers and seas apart; in estuaries, density keeps fresh water above salt water for a while.
      tr: Hiçbirinin diğerini istila etmemesi. İbn Kesîr'e göre nehirleri ve denizleri kara ayrı tutar; haliçlerde yoğunluk tatlı suyu bir süre tuzlu suyun üstünde tutar.
