legacyHonestNotes:
  - tr: |
      Farklı kelimeler bilimle iyi uyuşur ve klasik âlimler nitelik farkını zaten fark etmişti. Ama *nûr* Allah için (24:35) ve vahiy için de kullanılır; dolayısıyla kesin olarak "yansıyan ışık" anlamına gelmez. Pek çok eski yazar da Ay'ın Güneş tarafından aydınlatıldığını biliyordu. Bu, yeni bir bilginin açıklanması değil, bir uyumdur.
    en: The different words fit the science well, and classical scholars already noticed the difference in quality. But *nūr* is also used for God (24:35) and for revelation, so it does not strictly mean "reflected light". Many ancient writers also knew the Moon is lit by the Sun. This is a harmony, not a revelation of new knowledge.
followUps:
  - q:
      en: What is the difference between *ḍiyāʾ* and *nūr*?
    a:
      en: "Ibn Kathir: the sun's rays are \"the source of light\", the moon's beams \"light\", of \"two different natures\". Al-Jalālayn: the sun is \"a radiance that is emitting light\", the moon \"a light\"."
  - q:
      en: Does the moon make its own light?
    a:
      en: No. It reflects about 11–12% of the sunlight that reaches it (NASA NSSDC).
  - q:
      en: Why are Islamic months 29 or 30 days?
    a:
      en: Because the Moon's cycle of phases is 29.53 days (NASA NSSDC).
  - q:
      en: What are the moon's "stations"?
    a:
      en: The 28 positions through which it passes in a month (al-Jalālayn).
