legacyHonestNotes:
  - tr: |
      Farklı kelimeler bilimle iyi uyuşur ve klasik âlimler nitelik farkını zaten fark etmişti. Ama *nûr* Allah için (24:35) ve vahiy için de kullanılır; dolayısıyla kesin olarak "yansıyan ışık" anlamına gelmez. Pek çok eski yazar da Ay'ın Güneş tarafından aydınlatıldığını biliyordu. Bu, yeni bir bilginin açıklanması değil, bir uyumdur.
    en: The different words fit the science well, and classical scholars already noticed the difference in quality. But *nūr* is also used for God (24:35) and for revelation, so it does not strictly mean "reflected light". Many ancient writers also knew the Moon is lit by the Sun. This is a harmony, not a revelation of new knowledge.
followUps:
  - q:
      en: Why does the Quran use different words for the sun and the moon?
    a:
      en: 'al-Qurtubi: *ḍiyāʾ* lights things up, while *nūr* shows them more softly; Ibn Kathir: God gave them "two different natures so they would not be confused". Both noticed the difference.'
  - q:
      en: Does "derived light" mean the Quran says the moon reflects sunlight?
    a:
      en: "\"Derived\" is Saheeh's translation of *nūr*, which means \"light\". The classical commentators read here did not draw that conclusion from 10:5. The moon does reflect sunlight — and Greek thinkers knew it centuries earlier."
  - q:
      en: How long is a lunar month?
    a:
      en: On average 29.53 days from new moon to new moon (NASA); Islamic months have 29 or 30 days.
  - q:
      en: Why does Ramadan move through the seasons?
    a:
      en: Twelve lunar months make about 354 days, about eleven days fewer than the solar year, so each year Ramadan comes earlier by about eleven days.
  - q:
      en: What are the moon's "stations"?
    a:
      en: The places where the moon is seen night by night against the stars; al-Qurtubi and al-Jalālayn count twenty-eight.
