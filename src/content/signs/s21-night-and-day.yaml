followUps:
  - q:
      en: Does "derived light" mean the Quran says the moon reflects sunlight?
    a:
      en: Classical commentators read the two words as two kinds of light, strong and gentle; they did not draw out reflection. The honest notes discuss the modern claim.
  - q:
      en: Why does the moon matter for time?
    a:
      en: Its phases give the months of the Islamic calendar, as Ibn Kathir describes.
