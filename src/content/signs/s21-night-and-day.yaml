title:
  tr: Gece ve gündüz; kandil olarak güneş, nur olarak ay
  en: Night and day; the sun as a lamp, the moon as a light
verses:
  - 10:5
  - 25:61
  - 78:13
seeAlso:
  - 71:16
summary:
  tr: Her ışığın bir görevi var. Biri yanar ve hayatı yürütür, öteki zamanı yumuşakça işaretler.
  en: Each light has its role. One burns and drives life, the other gently marks time.
verseNotes:
  tr: 'Güneş için *ziyâ* (parıltı) ve *sirâc* (kandil), ay için *nûr* (ışık) kelimeleri kullanılır. 78:13: *sirâcen vehhâcâ*, "parıl parıl yanan bir kandil".'
  en: 'The sun is called *ḍiyāʾ* (radiance) and *sirāj* (lamp), the moon *nūr* (light). 78:13: *sirājan wahhājā*, "a blazing lamp".'
tafsir:
  tr: |
    [Scholarly]

    - Müfessirler farklı kelimelere dikkat çeker: güneş *ziyâ* ya da *sirâc*tır (parıltı, yanan bir kandil), ay ise *nûr*dur (yumuşak ışık).
    - Râzî ve Zemahşerî *ziyâ*yı ısı ve güç taşıyan ışık, *nûr*u daha sakin bir ışık olarak ele alır.
    - İkisi de vakit ölçümüne bağlanır: ay aylar ve yıllar için, güneş günler ve namaz vakitleri için.
  en: "**Two lights, two jobs.** On 10:5, Ibn Kathir explains that God \"made the rays that come forth from the bright sun as the source of light, and made the beams that come forth from the moon as light. He made them of two different natures so they would not be confused with one another.\" He ordained phases for the moon: \"it starts small then its light increases until it completes a full moon. Then it begins to decrease\". On \"a burning lamp\" (78:13) he says: \"the radiant sun that gives light to all of the world\". Al-Razi and al-Zamakhshari discuss *diya'* as light with heat and strength, and *nur* as calmer light. Both are tied to timekeeping: the moon for months and years, the sun for days and prayer times."
howItWorks:
  tr: |
    [Established]

    - Güneş bir yıldızdır. Çekirdeğinde füzyon hidrojeni helyuma çevirir ve muazzam bir enerji açığa çıkarır; yani kendi ışığını üreten gerçek bir kandildir.
    - Ay ışık üretmez. Güneş ışığını yansıtır, üstelik kendisine ulaşanın yalnızca yaklaşık %12'sini; yüzeyi aslında karanlıktır.
    - Güneş ışığı Dünya'ya yaklaşık 8 dakika 20 saniyede ulaşır.
    - Ay'ın evreleri her 29,5 günde bir tekrarlanır; hicrî ayların temeli budur. On iki kamerî ay yaklaşık 354 gün eder; bu yüzden Ramazan yaklaşık 33 yılda bütün mevsimleri dolaşır.
  en: |-
    [Established]

    - The Sun is a star. In its core, fusion turns hydrogen into helium and releases enormous energy, so it is a true lamp that makes its own light.
    - The Moon makes no light. It reflects sunlight, and only about 12% of what hits it; its surface is actually dark.
    - Sunlight takes about 8 minutes 20 seconds to reach Earth.
    - The Moon's phases repeat every 29.5 days, the basis of the Islamic months. Twelve lunar months make about 354 days, so Ramadan moves through all seasons in about 33 years.
awe:
  tr: |
    - Güneş her saniye kütlesinin yaklaşık 4 milyon tonunu enerjiye dönüştürür.
    - Dolunay parlak görünür, ama yüzeyi aşınmış asfalt kadar karanlıktır. Yalnızca siyah bir gökyüzünün önünde tam güneş ışığı altında durduğu için parlar.
    - Yeterince uzun yaşayan bir Müslüman, yılın her mevsiminde Ramazan orucu tutar.
  en: |-
    - Every second, the Sun turns about 4 million tonnes of its mass into energy.
    - The full Moon looks bright, but its surface is about as dark as worn asphalt. It shines only because it sits in full sunlight against a black sky.
    - A Muslim who lives long enough fasts Ramadan in every season of the year.
reflection:
  tr: |
    Her ışığın bir görevi var: biri yanar ve hayatı yürütür, öteki zamanı yumuşakça işaretler. İkisi de insanlar sayabilsin, plan yapabilsin ve ibadet edebilsin diye yerleştirilmiştir. Göğün düzeni, gündelik hayatın ritmi olur.
  en: "Each light has its role: one burns and drives life, the other gently marks time. Both are placed so people can count, plan and worship. The order of the sky becomes the rhythm of daily life."
honestNotes:
  - tr: |
      Farklı kelimeler bilimle iyi uyuşur ve klasik âlimler nitelik farkını zaten fark etmişti. Ama *nûr* Allah için (24:35) ve vahiy için de kullanılır; dolayısıyla kesin olarak "yansıyan ışık" anlamına gelmez. Pek çok eski yazar da Ay'ın Güneş tarafından aydınlatıldığını biliyordu. Bu, yeni bir bilginin açıklanması değil, bir uyumdur.
    en: The different words fit the science well, and classical scholars already noticed the difference in quality. But *nūr* is also used for God (24:35) and for revelation, so it does not strictly mean "reflected light". Many ancient writers also knew the Moon is lit by the Sun. This is a harmony, not a revelation of new knowledge.
