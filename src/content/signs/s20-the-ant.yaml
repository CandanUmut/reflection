order: 20
theme: animals
title:
  tr: Karınca
  en: The ant
verses:
  - 27:18-19
summary:
  tr: 27:18–19 topluluğunu uyaran bir karıncayı ("Yuvalarınıza girin; Süleyman ve ordusu farkına varmadan sizi ezmesin!") ve onu duyan, gülümseyen ve şükre yönelen bir peygamberi anlatır.
  en: 27:18–19 tells of an ant who warned her community — "enter your dwellings that you not be crushed" — and a prophet who heard her, smiled, and turned to gratitude.
verseNotes:
  tr: |-
    "Nihayet karınca vâdisine geldikleri zaman, bir karınca: "Ey karıncalar! Yuvalarınıza girin; Süleyman ve ordusu farkına varmadan sizi ezmesin!" dedi. (Süleyman) onun sözüne gülümseyerek dedi ki: "Ey Rabbim! Bana ve ana babama verdiğin nimete şükretmemi ve hoşnut olacağın iyi iş yapmamı gönlüme getir. Rahmetinle, beni iyi kulların arasına kat."" (27:18–19), Mekkî, Neml ("Karıncalar") Sûresi'nde, Hz. Süleyman'ın (a.s.) kendisine kuş dilinin öğretildiğini söylemesinden (27:16, özet; doğrulanmış veriden alıntı yapılmadı) sonra.

    - **Anahtar kelimeler.** *Neml*e: bir karınca (dilbilgisi bakımından dişil). *Ve hüm lâ yeş'urûn*: "farkına varmadan".
  en: |-
    "Until, when they came upon the valley of the ants, an ant said, 'O ants, enter your dwellings that you not be crushed by Solomon and his soldiers while they perceive not.' So [Solomon] smiled, amused at her speech, and said, 'My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to do righteousness of which You approve. And admit me by Your mercy into [the ranks of] Your righteous servants'" (27:18–19), Meccan, in Sura al-Naml ("The Ants"), after Solomon (pbuh) says he was taught the speech of birds (27:16, paraphrased; not quoted from verified data).

    - **Key words.** *Namla*: an ant (grammatically feminine). *Wa-hum lā yashʿurūn*: "while they perceive not".
tafsir:
  tr: |-
    **İbn Kesîr.** "Süleyman (a.s.) karıncanın ne dediğini anladı." Bölümü sonra âyeti kendi çevirmeninin ifadesiyle verir ("smiled, amused at her speech"; "My Lord! Grant me the power and ability that I may be grateful for Your favors"); bu onun yorumu değil, âyetin kendisidir. Arapça metinde İbn Asâkir ve Hasan yoluyla karıncanın adının "حرس" (Haras) olduğunu ve Benû'ş-Şeysân denen bir kabileden olduğunu aktarır (quranislam.github.io). Bu ayrıntılar, dereceleri verilmemiş rivayetlere dayanır.

    ***Celâleyn*.** Vadi "ya Tâif'te ya da Şam'da bulunuyordu ve karıncaları ya küçük ya da büyüktü"; konuşan, "Süleyman'ın ordularını görmüş olan kraliçe karınca"ydı.

    **Taberî.** "Farkına varmadan" hakkında: "وهم لا يعلمون أنهم يحطمونكم": "Sizi ezdiklerini bilmezler" (Arapça metin, quranislam.github.io).

    **Konuşan karınca kelimenin tam anlamıyla mı kastediliyor?** İbn Kesîr karıncanın sözlerini, Allah'ın Hz. Süleyman'a (a.s.) anlamasını nasip ettiği gerçek bir konuşma olarak ele alır: "Allah Süleyman'ın kuşların ne dediğini anlamasını sağladı"; bu, "Allah'ın ona verdiği nimetler" arasındadır. *Celâleyn*'in bölümü (yalnızca 27:18 hakkında) Süleyman'ın duymasını tartışmaz, ama bir dilbilgisi notu ekler: "Karıncalar, akıl sahiplerinin konuşmasını kullanmalarında akıl sahiplerine benzetilmiştir." Taberî'nin Arapça bölümü kelimeleri açıklar ve konuşmanın gerçek olup olmadığına değinmez. Üçünden hiçbiri onu bir alegori olarak okumaz. Okuyucuların sorduğu Kurtubî ve Râzî'ye ulaşılamadı.

    **Söylemedikleri.** Hiçbiri karıncaların nasıl iletişim kurduğunu anlatmaz.
  en: |-
    **Ibn Kathir.** "Sulayman, peace be upon him, understood what the ant said." His section then prints the verse in its translator's wording — "smiled, amused at her speech"; "My Lord! Grant me the power and ability that I may be grateful for Your favors" — which is the verse, not his comment. In the Arabic, he cites, through Ibn ʿAsakir and al-Hasan, that the ant's name was "حرس" (Ḥaras), and that she was from a tribe called Banū al-Shayṣān (quranislam.github.io). These details rest on reports whose grades were not given.

    **Al-Jalālayn.** The valley was "located either in Tā'if or in Syria and whose ants are either small or large"; the speaker was "the queen ant who had seen Solomon's hosts".

    **Al-Tabari.** On "while they perceive not": "وهم لا يعلمون أنهم يحطمونكم" — "they do not know that they are crushing you" (Arabic text, quranislam.github.io).

    **Is the talking ant meant literally?** Ibn Kathir treats the ant's words as real speech that God let Solomon (pbuh) understand: "Allah enabled Sulayman to understand what the birds said", among "the blessings that Allah bestowed upon him". Al-Jalālayn's section (on 27:18 only) does not discuss Solomon's hearing, but adds a grammar note: "the ants are likened to rational beings in their use of the latter's speech." Al-Tabari's Arabic section explains the words and does not address whether the speech was real. None of the three reads it as allegory. Al-Qurtubi and al-Razi, whom readers asked about, were not available.

    **What they did not say.** None describes how ants communicate.
howItWorks:
  tr: |-
    Her madde "Yuvalarınıza girin" ve "farkına varmadan" ifadelerine bağlanır.
    - **Kimyayla alarm.** [Established] Karınca alarm sinyalleri "genellikle iki ya da daha fazla feromondan oluşur"; bunlar çoğu zaman aynı anda uyarır, çeker ve saldırganlığı kışkırtır. AntWiki'nin "alarm-savunma maddeleri" listesinde sitronellal, dendrolazin, dimetil sülfat ve undekan vardır; bazı formisin karıncaların kullandığı formik asit için "muhtemelen tamamen savunma amaçlı" der (AntWiki, Hölldobler ve Wilson'dan).
    - **Bir uyarı ne kadar uzağa ulaşır?** [Established] *Lasius claviger* karıncasında alarm Dufour bezinden gelir (mandibula beziyle birlikte boşaltılır). Bütün içerik için (yaklaşık 2,5 µg undekan) "Bossert ve Wilson'un (1963) difüzyon modeli", sinyalin "durgun havada en fazla yaklaşık 20 cm"ye ulaşacağını "öngörür"; bu bir ölçüm değil, bir model öngörüsüdür. Davranışta sistem "sıkıntıdaki bir yuva arkadaşının yardımına 10 cm'ye kadar mesafeden işçi getirmek için tasarlanmış gibi görünür"; birkaç milimetre uzaktaki karıncalar saniyeler içinde, birkaç santimetre uzaktakiler bir dakika ya da daha uzun sürede tepki verir. Güçlendirilmedikçe sinyal "birkaç dakika içinde söner" (AntWiki).
    - **İki tür alarm.** [Established] "Saldırgan alarmda koloninin bazı üyeleri… tehdit eden uyarana doğru çekilir"; "panik alarmda koloni bir bütün olarak uyarandan kaçar" (AntWiki).
    - **Ses de.** [Established] Bazı karıncalar, "çekimi artıran" sürtünme sesleri ekler (AntWiki).
    - **Bağlam önemlidir.** Sasaki, Hölldobler, Millar ve Pratt (2014), *Temnothorax rugatulus*'ta "bağlama bağlı bir alarm sinyalini" inceledi (başlık; bulgularına henüz başvurulmadı).
  en: |-
    Each point is tied to "enter your dwellings" and "while they perceive not".
    - **Alarm by chemistry.** [Established] Ant alarm signals "typically consist of two or more pheromones", which often alert, attract and provoke aggression at once. AntWiki's list of "alarm-defense substances" includes citronellal, dendrolasin, dimethyl sulfate and undecane; formic acid, used by some formicine ants, it calls "probably purely defensive" (AntWiki, from Hölldobler & Wilson).
    - **How far a warning reaches.** [Established] In the ant *Lasius claviger*, the alarm comes from the Dufour's gland (discharged with the mandibular gland). For the full contents (about 2.5 µg of undecane), "the diffusion model of Bossert and Wilson (1963) predicts" a signal reaching "a maximum of about 20 cm in still air" — a model prediction, not a measurement. In behaviour, the system "seems designed to bring workers to the aid of a distressed nestmate over distances of up to 10 cm"; ants a few millimetres away react within seconds, those a few centimetres away take a minute or longer. Unless reinforced, the signal "dies out within a few minutes" (AntWiki).
    - **Two kinds of alarm.** [Established] "In aggressive alarm some of the colony members… are drawn toward the threatening stimulus"; "In panic alarm the colony as a whole flees from the stimulus" (AntWiki).
    - **Sound too.** [Established] Some ants add stridulatory chirps, which "enhance attraction" (AntWiki).
    - **Context matters.** Sasaki, Hölldobler, Millar and Pratt (2014) studied "a context-dependent alarm signal" in *Temnothorax rugatulus* (title; the findings have not yet been consulted).
awe:
  tr: |-
    - Tek bir karıncanın alarmı yaklaşık 10 cm uzaktaki yuva arkadaşlarına ulaşmak üzere kuruludur (bir difüzyon modeli en fazla yaklaşık 20 cm öngörür) ve başkaları güçlendirmedikçe dakikalar içinde söner (AntWiki).
    - Karınca kolonilerinin iki alarm tepkisi vardır: saldırmak ya da bütün koloninin kaçması (AntWiki).
  en: |-
    - A single ant's alarm is built to reach nestmates up to about 10 cm away (a diffusion model predicts at most about 20 cm), and fades within minutes unless others reinforce it (AntWiki).
    - Ant colonies have two alarm responses: attack, or the whole colony fleeing (AntWiki).
reflection:
  tr: |-
    Âyet bir karıncaya ses verir. Gelen bir orduyu görür ve seslenir: "Ey karıncalar! Yuvalarınıza girin; Süleyman ve ordusu farkına varmadan sizi ezmesin!" (27:18). Bütün topluluğunu uyarır ve aynı nefeste orduyu mazur görür: Bunu kasten yapmazlar, sadece fark etmezler. Taberî açıklar: "Sizi ezdiklerini bilmezler."

    Yalnız bunda bile bir ders var. Güçlülere beddua etmez; zayıfları korur ve kötü niyet varsaymaz.

    Sonra peygamber onu duyar. Hz. Süleyman'ın (a.s.) insanlardan, cinlerden ve kuşlardan orduları vardı (27:17, özet). Bir karıncayı görmezden gelebilirdi. Bunun yerine "onun sözüne gülümseyerek" hemen şükre yöneldi: "Ey Rabbim! Bana ve ana babama verdiğin nimete şükretmemi ve hoşnut olacağın iyi iş yapmamı gönlüme getir." (27:19). Bu hikâyede güç onu daha az değil, daha dikkatli dinletir.

    Gerçek karıncalar alarm verir; kimyasallarla ve bazen sesle; bütün bir koloni yuvasına kaçabilir. Âyet feromonları anlatmaz. Küçük bir yaratığın halkına duyduğu özeni ve büyük bir insanın onun karşısındaki alçakgönüllülüğünü anlatır.
  en: |-
    The verse gives an ant a voice. She sees an army coming and calls out: "O ants, enter your dwellings that you not be crushed by Solomon and his soldiers while they perceive not" (27:18). She warns her whole community, and in the same breath she excuses the army: they would not mean it, they just would not notice. Al-Tabari explains: "they do not know that they are crushing you."

    There is a lesson in that alone. She does not curse the powerful; she protects the weak and assumes no malice.

    Then the prophet hears her. Solomon (pbuh) had armies of men, jinn and birds (27:17, paraphrased). He could have ignored an ant. Instead he "smiled, amused at her speech", and turned at once to gratitude: "My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents" (27:19). Power, in this story, makes him listen more carefully, not less.

    Real ants do raise the alarm, with chemicals and sometimes with sound, and a whole colony can flee into its nest. The verse does not describe pheromones. It describes a small creature's care for its people, and a great man's humility before it.
honestNotes:
  - en: "**A gift to a prophet, not entomology.** The verse tells of Solomon (pbuh) understanding an ant. It does not describe pheromones."
    tr: "**Bir peygambere verilmiş bir lütuf, böcek bilimi değil.** Âyet Hz. Süleyman'ın (a.s.) bir karıncayı anlamasını anlatır. Feromonları anlatmaz."
  - en: '**The feminine verb.** Some articles say the feminine form proves "the Quran knew worker ants are female". *Namla* is grammatically feminine in any case, so the grammar does not settle biology (not yet sourced).'
    tr: "**Dişil fiil.** Bazı makaleler dişil biçimin \"Kur'an'ın işçi karıncaların dişi olduğunu bildiğini\" ispat ettiğini söyler. *Neml*e her durumda dilbilgisi bakımından dişildir; dolayısıyla dilbilgisi biyolojiyi belirlemez (henüz kaynağı gösterilmedi)."
  - en: "**The skeptic's question.** Readers ask whether the story of Solomon and the ant appears in later Jewish tradition, suggesting borrowing. No source on Jewish versions of the story was read, so this page makes no claim either way."
    tr: "**Şüphecinin sorusu.** Okuyucular, Süleyman ve karınca hikâyesinin sonraki Yahudi geleneğinde geçip geçmediğini sorup bir alıntı ihtimaline işaret ediyor. Hikâyenin Yahudi versiyonları hakkında hiçbir kaynak okunmadı; dolayısıyla bu sayfa iki yönde de bir iddiada bulunmaz."
  - en: "**The ant's name.** \"Ḥaras\" comes from a report Ibn Kathir cites from Ibn ʿAsakir, by way of Ishaq ibn Bishr, from Saʿid, from Qatada, from al-Hasan; the same report says she was lame and \"as big as a wolf\" (بقدر الذيب). Ibn Kathir adds no judgement; Ishaq ibn Bishr's standing as a narrator has not yet been checked. It should not be presented as fact."
    tr: "**Karıncanın adı.** \"Haras\", İbn Kesîr'in İbn Asâkir'den, İshak b. Bişr yoluyla, Saîd'den, Katâde'den, Hasan'dan aktardığı bir rivayetten gelir; aynı rivayet onun topal olduğunu ve \"bir kurt büyüklüğünde\" (بقدر الذيب) olduğunu söyler. İbn Kesîr hiçbir hüküm eklemez; İshak b. Bişr'in bir râvi olarak durumu henüz kontrol edilmedi. Bir gerçek olarak sunulmamalıdır."
visualizations:
  - id: ideas
    tr: |
      - Bir alarm dalgası canlandırması: bir karınca kırmızı bir "koku bulutu" salar, komşuları kırmızıya döner ve aktarır, larvalar taşınır.
      - Süleyman'ın şükür duasıyla biten, 27:18–19 için bir hikâye kartı.
    en: |-
      - An alarm-wave animation: one ant releases a red "scent cloud", neighbors turn red and pass it on, larvae are carried away.
      - A story card for 27:18–19 that ends on Solomon's prayer of gratitude.
