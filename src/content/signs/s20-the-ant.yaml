order: 20
theme: animals
title:
  tr: Karınca
  en: The ant
verses:
  - 27:18-19
summary:
  tr: Hikâyedeki en küçük varlık topluluğunu korur; en güçlü kral şükürle cevap verir.
  en: The smallest creature in the story shows care for its community; the most powerful king answers with gratitude.
verseNotes:
  tr: Sûre, *en-Neml* ("Karıncalar") adını taşır.
  en: The surah is named *al-Naml*, "The Ants".
tafsir:
  tr: |
    [Scholarly]

    - Kurtubî, İbn Kesîr ve Râzî karıncanın konuşmasını, Allah'ın Süleyman'a anlamayı nasip ettiği gerçek bir iletişim olarak ele alır.
    - Karıncanın bütün topluluğu uyardığını ve orduyu bile mazur gördüğünü ("farkına varmadan") vurgularlar; bu, tehlike anında adaleti gösterir.
    - Süleyman gururla değil şükürle cevap verir: bir karıncayı duyma mucizesi onu duaya götürür.
  en: "**An ant's warning, a prophet's gratitude.** Ibn Kathir places the story among \"the great blessings and favors\" given to David and Solomon (peace be upon them both). He says Solomon (pbuh) \"understood what the ant said\", and al-Qurtubi and al-Razi likewise treat the ant's speech as real communication that God let Solomon (pbuh) understand. The commentators notice that the ant warned the whole community and even excused the army: \"while they perceive not\". Solomon's (pbuh) answer is gratitude, not pride; Ibn Kathir explains his prayer as \"inspire me to give thanks for the blessings that You have bestowed upon me\"."
howItWorks:
  tr: |
    [Established]

    - Karıncalar esas olarak feromon denen kimyasallarla iletişim kurar. Çoğu türün görmesi zayıftır, bazıları neredeyse kördür.
    - Tehlike sezen bir karınca bir alarm feromonu salabilir. Yakındaki karıncalar onu antenleriyle algılar ve sırayla onlar da salar; alarm zincirleme bir tepki gibi yayılır.
    - Türe ve miktara bağlı olarak tepki, saldırı ya da panik ve tahliyedir. Panikte işçiler larvaları ve pupaları kapıp götürür.
    - 2025'te *Cell* dergisinde yayımlanan bir çalışmada Rockefeller Üniversitesi araştırmacıları karınca beyinlerini görüntüledi ve alarm feromonuna tepki veren küçük, özel bir merkez buldu.
  en: |-
    [Established]

    - Ants communicate mainly through chemicals called pheromones. Most species see poorly, and some are nearly blind.
    - An ant sensing danger can release an alarm pheromone. Nearby ants detect it with their antennae and release it in turn, spreading the alarm like a chain reaction.
    - Depending on species and dose, the response is attack, or panic and evacuation. In panic, workers grab larvae and pupae and carry them away.
    - In a 2025 *Cell* study, Rockefeller University researchers imaged ant brains and found a small, dedicated hub that responds to the alarm pheromone.
awe:
  tr: |
    - Bir deneyde, bir rahatsızlık bütün koloniyi saniyeler içinde harekete geçirdi. İşçiler larvaları güvenli yere taşıdı, sonra bütün koloniyi yeni bir yuvaya taşıdı.
    - Klasik bir çalışmada, yaklaşık 5–19 cm içindeki karıncalar alarm feromonu salındıktan sonraki 30 saniye içinde uyarıldı.
    - Bir koloni, merkezî bir komutanı olmadan neredeyse tek bir organizma gibi davranır.
  en: |-
    - In one experiment, a disturbance made a whole colony explode into activity within seconds. Workers carried the larvae to safety and then moved the entire colony to a new nest.
    - In a classic study, ants within roughly 5–19 cm were alerted within 30 seconds of alarm pheromone being released.
    - A colony behaves almost like a single organism, with no central commander.
reflection:
  tr: |
    Hikâyedeki en küçük varlık, topluluğuna özen, kendisine zarar verebilecek olanlara karşı adalet ve zamanında bir uyarı gösterir. En güçlü kral ise şükürle cevap verir. Güç de küçüklük de Allah'ın lütfu altındadır.
  en: The smallest creature in the story shows care for its community, fairness toward those who might harm it, and a timely warning. The most powerful king answers with gratitude. Power and smallness both stand under God's favor.
honestNotes:
  - tr: |
      - Âyet, bir peygamberin mucizesini, bir karıncayı anlamasını anlatır. Feromonları tarif etmez.
      - Bazı yazılar dişil fiilin "Kur'an'ın işçi karıncaların dişi olduğunu bildiğini kanıtladığını" söyler. Arapçada *neml* kelimesi normalde dişil uyum alır; bu yüzden bunu en fazla güzel bir tesadüf olarak görmek gerekir, kanıt olarak değil. (İşçi karıncalar gerçekten de dişidir.)
      - Karıncalar "kelimelerle konuşmaz"; sinyalleri kimyasal, dokunsal ve bazen sesle ilgilidir.
    en: |-
      - The verse tells of a prophet's miracle, understanding an ant. It does not describe pheromones.
      - Some articles say the feminine verb proves "the Quran knew worker ants are female". *Naml* normally takes feminine agreement in Arabic, so treat this as a nice coincidence at most, not a proof. (Worker ants are in fact female.)
      - Ants do not "speak words"; their signals are chemical, touch-based and sometimes sound-based.
visualizations:
  - id: ideas
    tr: |
      - Bir alarm dalgası canlandırması: bir karınca kırmızı bir "koku bulutu" salar, komşuları kırmızıya döner ve aktarır, larvalar taşınır.
      - Süleyman'ın şükür duasıyla biten, 27:18–19 için bir hikâye kartı.
    en: |-
      - An alarm-wave animation: one ant releases a red "scent cloud", neighbors turn red and pass it on, larvae are carried away.
      - A story card for 27:18–19 that ends on Solomon's prayer of gratitude.
