legacyHonestNotes:
  - tr: |
      - Âyet, bir peygamberin mucizesini, bir karıncayı anlamasını anlatır. Feromonları tarif etmez.
      - Bazı yazılar dişil fiilin "Kur'an'ın işçi karıncaların dişi olduğunu bildiğini kanıtladığını" söyler. Arapçada *neml* kelimesi normalde dişil uyum alır; bu yüzden bunu en fazla güzel bir tesadüf olarak görmek gerekir, kanıt olarak değil. (İşçi karıncalar gerçekten de dişidir.)
      - Karıncalar "kelimelerle konuşmaz"; sinyalleri kimyasal, dokunsal ve bazen sesle ilgilidir.
    en: |-
      - The verse tells of a prophet's miracle, understanding an ant. It does not describe pheromones.
      - Some articles say the feminine verb proves "the Quran knew worker ants are female". *Naml* normally takes feminine agreement in Arabic, so treat this as a nice coincidence at most, not a proof. (Worker ants are in fact female.)
      - Ants do not "speak words"; their signals are chemical, touch-based and sometimes sound-based.
followUps:
  - q:
      en: Did the ant really speak?
      tr: Karınca gerçekten konuştu mu?
    a:
      en: The commentators read here (Ibn Kathir, al-Jalālayn, al-Tabari) treat it as real speech God let Solomon (pbuh) understand.
      tr: Burada okunan müfessirler (İbn Kesîr, *Celâleyn*, Taberî) onu, Allah'ın Hz. Süleyman'a (a.s.) anlamasını nasip ettiği gerçek bir konuşma olarak ele alır.
  - q:
      en: How do real ants warn each other?
      tr: Gerçek karıncalar birbirini nasıl uyarır?
    a:
      en: Mainly with alarm pheromones, sometimes with sound; the colony may attack or flee (AntWiki).
      tr: Esas olarak alarm feromonlarıyla, bazen sesle; koloni saldırabilir ya da kaçabilir (AntWiki).
  - q:
      en: What does "while they perceive not" mean?
      tr: '"Farkına varmadan" ne demek?'
    a:
      en: That the army would crush them without knowing it (al-Tabari).
      tr: Ordunun onları farkında olmadan ezeceği (Taberî).
  - q:
      en: Why did Solomon (pbuh) smile and pray?
      tr: Hz. Süleyman (a.s.) neden gülümsedi ve dua etti?
    a:
      en: He was "amused at her speech", and turned the moment into gratitude for God's favour (27:19; Ibn Kathir).
      tr: "\"Onun sözüne gülümseyerek\", o anı Allah'ın nimetine şükre çevirdi (27:19; İbn Kesîr)."
  - q:
      en: Is the story in Jewish tradition?
      tr: Hikâye Yahudi geleneğinde var mı?
    a:
      en: Not checked.
      tr: Kontrol edilmedi.
