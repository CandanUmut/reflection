      - Bir alarm dalgası canlandırması: bir karınca kırmızı bir "koku bulutu" salar, komşuları kırmızıya döner ve aktarır, larvalar taşınır.
      - Süleyman'ın şükür duasıyla biten, 27:18–19 için bir hikâye kartı.
    en: |-
      - An alarm-wave animation: one ant releases a red "scent cloud", neighbors turn red and pass it on, larvae are carried away.
      - A story card for 27:18–19 that ends on Solomon's prayer of gratitude.
