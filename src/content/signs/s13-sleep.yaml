legacyHonestNotes:
  - tr: |
      - Glimfatik bulgular esas olarak farelerden gelir. İnsanlardaki kanıtlar artıyor, ama etkinin insanda ne kadar büyük olduğu hâlâ araştırılıyor.
      - Âyet, bir âyet ve bir "alınma" olarak uykudan söz eder; beynin temizlenmesini anlatmaz. Kur'an'ın "glimfatik sistemi önceden bildirdiği" söylenemez.
    en: |-
      - The glymphatic findings come mainly from mice. Human evidence is growing, but how large the effect is in people is still being studied.
      - The verse is about sleep as a sign and a "taking". It does not describe brain-cleaning. The Quran did not "predict the glymphatic system".
followUps:
  - q:
      en: What does "the lesser death" mean?
    a:
      en: "Ibn Kathir's term for sleep: the soul is \"taken\" and then released, as against the \"greater death\" in which it is kept."
  - q:
      en: What did the Prophet (pbuh) say before sleeping?
    a:
      en: '"Bismika amutu wa ahya" — "In Your name I die and live" ({hadith:bukhari:6312}); and, after shaking out his bed, a prayer asking mercy for the soul if God keeps it and protection if He sends it back ({hadith:bukhari:6320}).'
  - q:
      en: Does sleep clean the brain?
    a:
      en: In mice, sleep widened the spaces between brain cells by about 60% and sped up waste clearance (Xie et al. 2013). How much this happens in humans is still being studied.
  - q:
      en: Is sleep in Islam a kind of death?
    a:
      en: The Quran uses the same verb, "take", for both. Ibn Kathir calls sleep a lesser death; it is not death, since the soul is released.
