legacyHonestNotes:
  - tr: |
      - Glimfatik bulgular esas olarak farelerden gelir. İnsanlardaki kanıtlar artıyor, ama etkinin insanda ne kadar büyük olduğu hâlâ araştırılıyor.
      - Âyet, bir âyet ve bir "alınma" olarak uykudan söz eder; beynin temizlenmesini anlatmaz. Kur'an'ın "glimfatik sistemi önceden bildirdiği" söylenemez.
    en: |-
      - The glymphatic findings come mainly from mice. Human evidence is growing, but how large the effect is in people is still being studied.
      - The verse is about sleep as a sign and a "taking". It does not describe brain-cleaning. The Quran did not "predict the glymphatic system".
followUps:
  - q:
      en: What does it mean that God "takes" souls in sleep?
    a:
      en: 'The Quran uses the same verb for death and sleep. Ibn Kathir calls sleep "the lesser death"; Ibn Zayd: "sleep is a death" (al-Tabari).'
  - q:
      en: Do the souls of the living and the dead meet in sleep?
    a:
      en: Saʿid ibn Jubayr and al-Suddi said so, as reported by al-Tabari. It is their explanation, not the words of the verse.
  - q:
      en: What did the Prophet (pbuh) say on waking?
    a:
      en: "\"Al-Hamdu lil-lahi al-ladhi ahyana ba'da ma amatana, wa ilaihi an-nushur\" — praise to Allah who gave us life after He caused us to die, and to Him is the rising ({hadith:bukhari:6314})."
  - q:
      en: Does science show what the brain does in sleep?
    a:
      en: "Partly: REM and non-REM cycles, memory consolidation, the light-set body clock (NINDS), and in mice faster clearance of brain waste (Xie et al., 2013)."
  - q:
      en: Did the Quran predict the glymphatic system?
    a:
      en: No. It speaks of rest and of the soul, not of brain fluid.
