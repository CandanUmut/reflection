summary:
  tr: Her gece kontrolü bırakırız, her sabah bize geri verilir. Farelerde, uyku sırasında beyin hücreleri, beynin kendini yıkayabilmesi için yer açar.
  en: '39:42 says God "takes the souls" in death and also in sleep, and "releases the others for a specified term": every night is a small rehearsal of death and return.'
verseNotes:
  tr: 78:9'daki *subāt* kelimesi "kesmek, ara vermek" anlamına gelen bir kökten gelir.
  en: |-
    "Allah takes the souls at the time of their death, and those that do not die [He takes] during their sleep. Then He keeps those for which He has decreed death and releases the others for a specified term. Indeed in that are signs for a people who give thought" (39:42), Meccan, in Sura al-Zumar, in a passage on God's sole power and the futility of other intercessors (39:43–44).

    "And of His signs is your sleep by night and day and your seeking of His bounty. Indeed in that are signs for a people who listen" (30:23), Meccan.

    "And made your sleep [a means for] rest" (78:9), Meccan. *Subāt* comes from a root meaning to cut off or to pause.

    - **Key word.** *Yatawaffā* ("takes"): to take in full; the same verb is used of death.
tafsir:
  tr: |
    [Scholarly]

    Râzî ve Kurtubî uykuyu "küçük ölüm" (*el-mevtetü's-suğrâ*) ve her gün tekrarlanan bir diriliş provası olarak anlatır. İbn Kesîr 39:42'yi Hz. Peygamber'in yatarken okuduğu duayla ilişkilendirir: "Senin adınla ölür ve dirilirim" (Buhârî 6312). Müfessirler, ölümde tamamen alınan ruh ile uykudaki kısmi "alınma"yı birbirinden ayırır: uykuda insandan bir şey çekilir, ama hayat devam eder.
  en: |-
    **Ibn Kathir on 39:42.** God causes people to "die a lesser death" when they sleep, as against the "greater death" when the angels take souls from bodies. He links it to 6:60–61: "Here Allah mentions the two deaths, the lesser death then the greater death after it."

    **The bedtime prayer.** Ibn Kathir cites, from al-Bukhari and Muslim through Abu Hurayra (ra), the supplication: "if You take my soul, have mercy on it, and if You send it back, protect it." On sunnah.com, {hadith:bukhari:6320} (Abu Hurayra) gives the Prophet's (pbuh) instruction to shake out one's bed, "for he does not know what has come on to it after him", and the Arabic: "Bismika Rabbi Wada`tu Janbi wa bika arfa'uhu, In amsakta nafsi farhamha wa in arsaltaha fahfazha bima tahfazu bihi ibadakas-salihin." In {hadith:bukhari:6312} (Hudhayfa), the bedtime words are "Bismika amutu wa ahya" (literally, "In Your name I die and live"), and on waking, "Al-hamdu li l-lahil-ladhi ahyana ba'da ma amatana wa ilaihin-nushur" — praise to God who gave us life after causing us to die, and to Him is the rising.

    **Al-Jalālayn on 39:42.** God takes those who have not died "in their sleep in other words He takes them during sleep."

    **What they share.** Sleep is a "taking" of the soul and a return; each morning's waking is a small resurrection. Neither commentary describes what the brain does in sleep.
howItWorks:
  tr: |
    [Established]

    - Bir gecelik uyku; hafif NREM, derin yavaş dalga uykusu ve REM evrelerinden oluşan, her biri yaklaşık 90 dakikalık döngülerle ilerler.
    - Beynin alışılmış bir lenf sistemi yoktur. Bunun yerine beyin-omurilik sıvısı beynin içinden akar ve atıkları yıkar. Buna glimfatik sistem denir.
    - Farelerde, doğal uyku ya da anestezi sırasında beyin hücreleri arasındaki boşluk yaklaşık %60 büyüdü. Bu, çok daha fazla sıvı alışverişine ve Alzheimer hastalığıyla bağlantılı bir protein olan beta-amiloidin daha hızlı temizlenmesine imkân verdi (Xie ve ark., *Science* 342:373, 2013).
    - Uyku hafızayı da pekiştirir. Vücut saati (sirkadiyen ritim) esas olarak göze ulaşan ışıkla ayarlanır.
  en: |-
    Each point is tied to the verse's words "rest" (78:9) and "sign" (30:23).
    - **The brain cleans itself during sleep — in mice.** [Moderate: animal evidence] In a study led by Maiken Nedergaard (University of Rochester), published in *Science* in 2013, "the space inside the brains increased by 60 percent when the mice were asleep or anesthetized"; dye injected into the cerebrospinal fluid flowed quickly through the brains of unconscious mice but barely moved when they were awake; and labelled beta-amyloid (a protein linked to Alzheimer's disease) "disappeared faster in mice brains when the mice were asleep" (NIH/NINDS release on Xie et al. 2013). The fluid system involved is called the *glymphatic system*.
    - **What this does and does not show.** Every experiment in the 2013 study was done in mice. How large this effect is in humans was not addressed in the source read.
awe:
  tr: |
    - Uyku sırasında beyin hücreleri, beynin kendini yıkayabilmesi için fiziksel olarak yer açar.
    - Fare çalışmasında, hayvanlar uyanıkken beyne doğru beyin-omurilik sıvısı akışı belirgin biçimde baskılandı.
    - İnsan her gece kontrolünü, farkındalığını ve kendini savunma gücünü tamamen bırakır; çoğu sabah hepsi ona geri verilir.
  en: |-
    - In sleeping mice, the spaces between brain cells widened by about 60%, letting fluid wash through (NIH/NINDS, 2013).
    - Every night a person gives up control, awareness and self-defence, and most mornings all of it is given back.
reflection:
  tr: |
    Uyku, her gün seçmeden yaptığımız bir teslimiyettir. Her gece kontrolü bırakırız, her sabah bize geri verilir. Kur'an bunu bir bağımlılık âyetine, ölümün ve dönüşün bir resmine çevirir.
  en: |-
    Sleep is a daily, unchosen surrender. However strong or busy we are, each night we lie down, let go of control, and become unaware of everything — even of ourselves. And most mornings it is all given back.

    The Quran calls this a "taking": "Allah takes the souls at the time of their death, and those that do not die [He takes] during their sleep" (39:42). Ibn Kathir calls sleep "a lesser death". The Prophet (pbuh) taught words for both ends of the night: before sleep, "Bismika amutu wa ahya" (In Your name I die and live); on waking, praise to the One who gave us life after causing us to die (this page's translation of the Arabic).

    That makes every bedtime a small act of trust, and every morning a small resurrection. It also makes waking a gift, not a right: "He keeps those for which He has decreed death and releases the others for a specified term."

    Today we know that sleep is busy work for the body — in mice, the brain even makes room to rinse itself. That does not replace the verse's sign; it adds to it. We do not run our own rest. We are put to sleep, and we are woken. The verse ends: "Indeed in that are signs for a people who give thought."
honestNotes:
  - en: '**The popular claim.** It is sometimes said that the Quran "predicted the glymphatic system". It did not: the verses speak of sleep as rest, as a sign and as a "taking" of the soul, not of brain fluid. No named source making the claim was read for this run.'
  - en: '**Mouse evidence.** The 2013 glymphatic findings are from mice. The current page says "Human evidence is growing"; no human study was read for this run (see Gaps).'
  - en: "**Sleep stages and the body clock.** The current page's points on ~90-minute sleep cycles, memory consolidation and light setting the body clock are not tied to a source on the page, and no source on them was read for this run (see Corrections)."
visualizations:
  - id: ideas
    tr: |
      - İkiye bölünmüş bir beyin kesiti: uyanık (hücreler sıkışık, akış az) ve uykuda (boşluklar genişler, mavi sıvı içinden akar).
      - Uyku döngülerini gösteren bir gece zaman çizelgesi; uykuya dalışta ve uyanışta yumuşak bir "alındı / geri verildi" canlandırması.
    en: |-
      - A split-screen brain cross-section: awake (cells packed tight, little flow) vs asleep (spaces widen, blue fluid flushes through).
      - A night timeline showing the sleep cycles, with a soft "taken / returned" animation at sleep and waking.
