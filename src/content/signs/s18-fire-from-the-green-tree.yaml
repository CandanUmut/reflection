followUps:
  - q:
      en: Is this about photosynthesis or stored solar energy?
    a:
      en: The commentators read it as the markh and 'afar fire-sticks and as a sign of resurrection. Modern chemistry is kept in "How it works", not read back into the verse.
  - q:
      en: What has fire to do with the resurrection?
    a:
      en: The verse comes right after the denial "Who will give life to bones while they are disintegrated?" (36:78); the answer points to opposites coming from opposites.
