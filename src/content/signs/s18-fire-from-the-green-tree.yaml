summary:
  tr: Her kamp ateşi, bir ağacın yıllar ya da on yıllar önce yakaladığı güneş ışığını salıverir.
  en: Every campfire releases sunlight that a tree captured years or decades earlier.
verseNotes:
  tr: 36:80, kendisine çürümüş kemikleri kimin dirilteceğini soran bir inkârcının sorusunun hemen ardından gelir (36:78–79).
  en: 36:80 comes right after a denier asks who will revive rotten bones (36:78–79).
tafsir:
  tr: |
    [Scholarly]

    - Kurtubî ve diğerleri iki Arabistan ağacının adını verir: *merh* ve *afâr*. Araplar bunlardan yeşil, özlü dallar keser ve çakmaktaşı gibi birbirine sürterek ateş yakardı.
    - Asıl vurgu "zıttan zıddı çıkarmak"tır. Ateş ıslak ve yeşil olan bir şeyden çıkar; öyleyse ölü kemiklerden hayat çıkarmak daha zor değildir.
    - Bazı müfessirler daha geniş de okur: her yeşil ağaç sonunda yakıta dönüşür.
  en: |-
    [Scholarly]

    - Al-Qurṭubī and others name two Arabian trees, *markh* and *ʿafār*. Arabs cut green, sappy twigs from them and rubbed one against the other to make fire, like a flint.
    - The main point is "bringing the opposite out of the opposite". Fire comes out of something wet and green, so bringing life out of dead bones is no harder.
    - Some commentators also read it more broadly: every green tree eventually becomes fuel.
howItWorks:
  tr: |
    [Established]

    - Bitkiler güneş ışığını fotosentezle yakalar. Karbondioksit ve suyu şekerlere ve selüloza dönüştürür, güneşin enerjisini kimyasal bağlarda depolar.
    - Odun yakmak bunu tersine çevirir. Oksijen, depolanmış karbon ve hidrojenle yeniden birleşir ve o depolanmış güneş ışığını ısı ve ışık olarak salıverir.
    - Sürtünmeyle ateş yakmak işe yarar, çünkü sürtmek odun liflerini için için yanmaya başlayana kadar ısıtır.
    - Kömür, petrol ve gaz eski bitki ve plankton kalıntılarıdır; dolayısıyla enerjileri de depolanmış güneş ışığıdır.
  en: |-
    [Established]

    - Plants capture sunlight by photosynthesis. They turn carbon dioxide and water into sugars and cellulose, storing the sun's energy in chemical bonds.
    - Burning wood reverses this. Oxygen recombines with the stored carbon and hydrogen and releases that stored sunlight as heat and light.
    - Friction fire works because rubbing heats wood fibres until they start to smoulder.
    - Coal, oil and gas are ancient plant and plankton matter, so their energy is also stored sunlight.
awe:
  tr: |
    - Her kamp ateşi, bir ağacın yıllar ya da on yıllar önce yakaladığı güneş ışığını salıverir.
    - İnsanların ısınmak, pişirmek ve sanayi için şimdiye kadar yaktığı enerjinin çoğunu (odun, kömür, petrol) önce yeşil bitkiler topladı.
    - Yeşil bir yaprak ile bir alev zıt görünür: biri ıslak, serin ve canlı; öteki sıcak ve yakıp tüketen. Kimyasal olarak ikisi aynı enerjinin girişi ve çıkışıdır.
  en: |-
    - Every campfire releases sunlight that a tree captured years or decades earlier.
    - Most of the energy people have ever burned for heat, cooking and industry (wood, coal, oil) was first gathered by green plants.
    - A green leaf and a flame look like opposites: one wet, cool and alive, the other hot and consuming. Chemically they are the same energy going in and coming out.
reflection:
  tr: |
    Âyet, diriliş hakkındaki bir şüpheye herkesin gördüğü bir şeyle cevap verir: yeşil ve ıslak olandan çıkan ateş. Modern tablo bu imgeyi derinleştirir; çünkü ağaç, ateşin daha sonra salıvereceği bir ışık deposudur. "O ağacı siz mi yarattınız?" sorusu bize, yalnızca kıvılcımı çaktığımızı hatırlatır; enerji bizim için hazırlanmıştı.
  en: 'The verse answers a doubt about resurrection with something everyone has seen: fire from what is green and wet. The modern picture deepens the image, because a tree is a store of light that fire later releases. "Is it you who produced its tree?" reminds us that we only strike the spark; the energy was prepared for us.'
honestNotes:
  - tr: |
      Âyet bilinen bir Arap uygulamasına (*merh* ve *afâr* dalları) atıf yapar. Fotosentezin tarifi değildir. Fotosentezi âyet üzerine bir tefekkür olarak kullanmak yerindedir; "Kur'an fotosentezi açıkladı" demek ise doğru değildir.
    en: The verse refers to a known Arabian practice (*markh* and *ʿafār* twigs). It is not a description of photosynthesis. Using photosynthesis as a reflection on the verse is fine; saying "the Quran revealed photosynthesis" is not.
visualizations:
  - id: ideas
    tr: |
      - İki yönlü bir canlandırma: güneş ışığı yaprağa akar ve odun olarak depolanır, sonra ateş onu ısı ve ışık olarak salıverir; aynı "enerji parçacıkları" iki yönde gösterilir.
      - *Merh* ve *afâr* ile sürtünme ateşi gösteren bir kart.
    en: |-
      - A two-way animation: sunlight flows into a leaf and is stored as wood, then fire releases it as heat and light, with the same "energy particles" shown both ways.
      - A *markh* and *ʿafār* friction-fire demo card.
