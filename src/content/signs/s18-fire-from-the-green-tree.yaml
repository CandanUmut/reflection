legacyHonestNotes:
  - tr: |
      Âyet bilinen bir Arap uygulamasına (*merh* ve *afâr* dalları) atıf yapar. Fotosentezin tarifi değildir. Fotosentezi âyet üzerine bir tefekkür olarak kullanmak yerindedir; "Kur'an fotosentezi açıkladı" demek ise doğru değildir.
    en: The verse refers to a known Arabian practice (*markh* and *ʿafār* twigs). It is not a description of photosynthesis. Using photosynthesis as a reflection on the verse is fine; saying "the Quran revealed photosynthesis" is not.
followUps:
  - q:
      en: What are *markh* and *ʿafār*?
    a:
      en: Two Arabian trees whose green branches were rubbed together to make fire (Ibn Kathir).
  - q:
      en: Why does a verse about fire follow a question about bones?
    a:
      en: "Because both are about opposites: fire from wet wood, life from dry bones (Qatada, via Ibn Kathir)."
  - q:
      en: What does "a reminder" mean in 56:73?
    a:
      en: A reminder of Hellfire, according to Mujahid and Qatada (Ibn Kathir).
  - q:
      en: Is this verse about photosynthesis?
    a:
      en: No. It is about fire from green wood; photosynthesis is a modern reflection that deepens it.
