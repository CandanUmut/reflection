legacyHonestNotes:
  - tr: |
      Âyet bilinen bir Arap uygulamasına (*merh* ve *afâr* dalları) atıf yapar. Fotosentezin tarifi değildir. Fotosentezi âyet üzerine bir tefekkür olarak kullanmak yerindedir; "Kur'an fotosentezi açıkladı" demek ise doğru değildir.
    en: The verse refers to a known Arabian practice (*markh* and *ʿafār* twigs). It is not a description of photosynthesis. Using photosynthesis as a reflection on the verse is fine; saying "the Quran revealed photosynthesis" is not.
followUps:
  - q:
      en: What is the "green tree"?
    a:
      en: "al-Qurtubi and Ibn Kathir: the Arabian trees *markh* and *ʿafār*, whose green branches were rubbed together to make fire. al-Jalālayn: the oil of green trees."
  - q:
      en: What is the argument?
    a:
      en: 'The denier said dry bones cannot live again. God answers that He brings fire out of wet green wood: "He is able to bring an opposite out of its opposite" (al-Qurtubi). Qatada: the One who brought fire from the tree "is able to resurrect him".'
  - q:
      en: Who was the man with the bone?
    a:
      en: Ibn Kathir reports that Mujahid, ʿIkrima and others named Ubayy ibn Khalaf, and Ibn ʿAbbas named al-ʿAs ibn Waʾil.
  - q:
      en: Why is fire "a reminder" in 56:73?
    a:
      en: Mujahid and Qatada said it reminds of the Fire of the Hereafter (Ibn Kathir). It is also "provision for the travelers".
  - q:
      en: Does the verse describe photosynthesis?
    a:
      en: No. It describes making fire from green wood. That the flame's energy came from sunlight is a modern reflection, not the verse's meaning.
