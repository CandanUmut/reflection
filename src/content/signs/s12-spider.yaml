followUps:
  - q:
      en: Is a spider's web really weak?
    a:
      en: The thread is strong — some silk is tougher than Kevlar (Agnarsson et al., 2010). But as a *home* it gives no shelter. The verse speaks of the home, and al-Tabari explains its weakness as uselessness in need.
  - q:
      en: Who are "those who take allies other than Allah"?
    a:
      en: In the first setting, those who worshipped idols (Ibn ʿAbbas and Qatada, in al-Tabari). The parable applies to anything a person relies on in place of God.
  - q:
      en: Does the verse say only female spiders build webs?
    a:
      en: No. The feminine verb follows the grammar of *ʿankabūt*; male spiders spin silk too. No classical commentator read here drew a biological lesson from the grammar.
  - q:
      en: Is the verse about spiders eating their mates?
    a:
      en: No. That happens in some species, but the verse and its commentators speak only of the web's weakness as a house.
  - q:
      en: Why does the verse end "if they only knew"?
    a:
      en: "Al-Tabari: because they do not realise how little their patrons can do, and think those patrons will help them and bring them near to God."
