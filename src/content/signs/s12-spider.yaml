followUps:
  - q:
      en: If spider silk is so strong, why is the spider's house the weakest?
    a:
      en: "Because a web is a trap, not a shelter: it keeps out neither heat nor cold (al-Jalālayn). Strength of material is not strength of refuge."
  - q:
      en: Is the verse about female spiders?
    a:
      en: The verb is grammatically feminine, but that follows the noun's grammatical gender; the commentators read here do not draw a biological point from it.
  - q:
      en: Who are "those who take allies other than Allah"?
    a:
      en: In context, those who worshipped idols; Ibn Kathir reads the verse about them. The lesson extends to anything relied on in God's place.
  - q:
      en: What does *awhan* mean?
    a:
      en: '"Weakest", the superlative of weak.'
