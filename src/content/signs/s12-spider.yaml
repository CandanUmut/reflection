theme: animals
verses:
  - 29:41
title:
  tr: Örümceğin evi
  en: The spider's house
summary:
  tr: En sağlam ipek, en çürük barınak. Etkileyici biçimde yapılmış bir şey de gerçek bir sığınak olmayabilir.
  en: 29:41 compares relying on anything other than God to "the home of the spider" — and calls it "the weakest of homes".
tafsir:
  tr: |
    Râzî, İbn Kesîr ve Kurtubî "çürüklüğü", sıcaktan, soğuktan, rüzgârdan ya da avcılardan koruyamamak olarak okur. Bazıları dişil fiile (*ittehazet*) dikkat çeker; ağı dişi örümceğin örmesiyle örtüşür.
  en: |-
    **Ibn Kathir.** The idolaters "were like the house of a spider, which is so weak and frail". The current page also quotes him: like "a person who holds on to a spider's web, who does not gain any benefit from that".

    **Al-Jalālayn.** The spider's home "neither protects it from heat nor cold".

    **Where they agree.** Both read the weakness as practical: the web gives no shelter. Ibn Kathir stresses the uselessness of holding on to it; al-Jalālayn names what it fails to keep out. Neither discusses which sex of spider builds webs, or spider family life.
howItWorks:
  tr: |
    [Established]

    - Darwin'in kabuk örümceğinin (*Caerostris darwini*, Madagaskar) çekme ipeğinin tokluğu ortalama yaklaşık 350 MJ/m³, bazı liflerde yaklaşık 520'dir: bilinen her ipeğin iki katı ve Kevlar'ın yaklaşık on katı; yaklaşık %91'e kadar uzayabilir (Agnarsson ve ark., PLoS ONE 2010; Garb ve ark., Communications Biology 2019).
    - Köprü iplikleri 25 m'ye kadar uzanır.
  en: |-
    - **The silk is strong.** [Established] The silk of Darwin's bark spider (*Caerostris darwini*, Madagascar) is the toughest biological material measured: "The toughness of forcibly silked fibers averages 350 MJ/m3, with some samples reaching 520 MJ/m3", "more than twice tougher than any previously described silk" and over ten times tougher than Kevlar (Agnarsson, Kuntner & Blackledge 2010). Its webs cover up to 2.8 m², anchored by threads up to 25 m long across rivers.
    - **The home is weak.** [Established] A web is a thin net, built to catch prey. It does not keep out wind, rain, heat, cold or predators. (This is ordinary observation; no named source on web function was read for this run.)
    - **So both are true.** The material is extraordinary; the shelter is not. That is exactly the gap the parable uses.
reflection:
  tr: Mesele "ipek zayıftır" değil; etkileyici biçimde yapılmış bir şeyin de gerçek bir sığınak sunamayabilmesidir. Yanlış dayanaklara güvenmeye dair asıl mesaj budur.
  en: |-
    Spider silk is, strand for strand, one of the toughest materials known. And yet the verse says: "the weakest of homes is the home of the spider, if they only knew" (29:41). Both are true. The point is not that the silk is weak. It is that something cleverly made can still give no real shelter.

    Al-Jalālayn names what the web cannot do: it "neither protects it from heat nor cold". Ibn Kathir names the people the parable is about: those who rely on protectors other than God are like someone holding on to a spider's web.

    The parable is not only about idols of stone. Anything we lean on in God's place can become a spider's house: money, status, a person, our own cleverness. These things may be impressive, even beautiful. They may hold for a while. But when the storm comes — illness, loss, death — they do not hold us up.

    The verse ends with a quiet regret: "if they only knew". It is not mockery. It is an invitation to check what we are leaning on before we need it to hold.
honestNotes:
  - en: '**The popular claims.** IslamReligion.com presents the verse as describing spider family life — "both female and male spiders commonly kill and eat the other after mating", "aggressive females kill their mates indiscriminately", spiderlings eating each other, a mother who "sacrifices her own body as food for her young" — and says God "mentioned that the worst household is that of a spider, long before naturalists and scientists started to study spider behavior in detail" (parts 1–2, 2016). Others argue that the feminine verb shows only female spiders build webs (as reported by WikiIslam).'
  - en: "**Weighing them.** The verse's point, as both commentators read it, is the web's weakness as a shelter, not spider behaviour; the \"household\" reading goes beyond the text and the tafsir read here. On the feminine verb, the critic at WikiIslam points out that the grammatical gender follows the noun *ʿankabūt*, which Lane's lexicon describes as \"generally fem., but sometimes masc.\", and that male spiders also spin silk. The grammar does not settle biology. Sexual cannibalism occurs in some species, not all (the current page's note; no source read for this run)."
  - en: '**"Takes", not "builds".** Saheeh renders *ittakhadhat* as "takes": the same verb as "those who take allies". The parallel is the point.'
