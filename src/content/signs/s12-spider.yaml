followUps:
  - q:
      en: Isn't spider silk very strong?
    a:
      en: Yes, strand for strand; the verse speaks of the "house" as shelter, and the parable is about relying on what cannot protect you. The science is in "How it works".
  - q:
      en: Who are the "protectors" in the parable?
    a:
      en: In Ibn Kathir's reading, gods taken besides God; the lesson extends to anything relied on in God's place.
