summary:
  tr: 13:4 yan yana toprak parçalarını, bağları ve hurmalıkları gösterir; "hepsi bir tek su ile sulanır", yine de Allah "meyvelerinde birini öbürüne üstün kılıyor"; ve buna "aklı eren bir kavim için" bir işaret der.
  en: 13:4 points to plots of land side by side, vines and palms, "watered with one water", yet God makes "some of them exceed others in [quality of] fruit" — and calls this a sign "for a people who reason".
tafsir:
  tr: |-
    **İbn Kesîr.** Toprak parçaları "birbirinin yanındadır; bazıları verimlidir ve insanlara faydalı olanı üretir, diğerleri ise ölü, tuzludur ve hiçbir şey üretmez." *Sınvân*, "incir, nar ve hurma gibi tek bir gövdeden iki ya da üç olarak büyümek demektir"; *gayru sınvân* ise "bitkilerin çoğunda olduğu gibi her ağacın tek bir gövdesi olması demektir." Nokta şudur: "Bütün bu farklılıklar ve karmaşık çeşitlilikler aynı suyla sulanır" ve "bu yüzden bitkiler ve meyveler arasında şekil, renk, tat, koku, çiçek" ve yapraklarının şekli bakımından farklar vardır.

    **İbn Kesîr'in zikrettiği bir hadis.** Ebû Hüreyre (r.a.), Hz. Peygamber'in (s.a.v.) "bazısını yemek bakımından diğerlerinden üstün kılarız" hakkında hurma türlerini saydığını rivayet eder: "Dakal, Fârisî …, tatlı, acı" ({hadith:tirmidhi:3118}). Tirmizî onu *hasen garîb*, Elbânî *hasen*, Zübeyr Ali Zeî ise *zayıf* olarak derecelendirdi ve senetteki bir râvi, Seyf b. Muhammed, yalancılıkla itham edildi (hadithunlocked). Derecesi tartışmalı olduğu için bu sayfadaki hiçbir şey ona dayanmaz.

    ***Celâleyn*.** Toprak parçaları "kimi iyi, kimi tuzlu, kimi az verimli, kimi bereketli"dir; "*sınvân*, *sınv*ın çoğuludur; aynı kökten gelen ama pek çok filizi olan hurma ağaçlarıdır"; "aynı su kaynağından" sulanırlar.

    ***Tenvîrü'l-Mikbâs*** "iyi, verimli bir toprağın yanında kötü, bataklık bir toprağı" resmeder; bunlar "yağmurla ya da nehirlerin suyuyla sulanır."

    **Nerede ayrılıyorlar?** İbn Kesîr ve *Celâleyn* komşu toprak parçalarını yan yana duran farklı nitelikte topraklar olarak okur; üçü de suyun aynı olduğunu vurgular. *Sınvân* konusunda ayrılırlar: *Celâleyn* onu hurma ağaçlarıyla sınırlar; İbn Kesîr incirleri ve narları da katar. Hiçbiri meyvelerin *neden* farklı olduğunu Allah'ın iradesinin ötesinde açıklamaz; âyet akıl yürütmeyi okuyucuya bırakır.
  en: |-
    **Ibn Kathir.** The plots are "next to each other, some of them are fertile and produce what benefits people, while others are dead, salty and do not produce anything." *Ṣinwān* "means, growing into two or three from a single stem, such as figs, pomegranate and dates", and *ghayru ṣinwān* "means, having one stem for every tree, as is the case with most plants." The point: "all these variances and complex diversities are watered by the same water", and "Therefore, there are differences between plants and fruits with regards to shape, color, taste, scent, blossoms" and the shape of their leaves.

    **A hadith Ibn Kathir cites.** Abu Hurayra (ra) reports that the Prophet (pbuh), on "some of them We make more excellent than others to eat", named kinds of dates: "The Daqal, the Persian …, the sweet, the bitter" ({hadith:tirmidhi:3118}). Al-Tirmidhi graded it *ḥasan gharīb*; al-Albani *ḥasan*; Zubayr ʿAlī Zaʾī *ḍaʿīf* (weak), and one narrator in the chain, Sayf ibn Muḥammad, was accused of lying (hadithunlocked). Because its grade is disputed, nothing on this page rests on it.

    **Al-Jalālayn.** The plots are "some good some briny some of little yield and some fruitful"; "sinwān is the plural of sinw which are date-palms belonging to the same root but with many offshoots"; they are watered "by the same source of water".

    **Tanwīr al-Miqbās** pictures "a bad, swampy land close to a good, fertile land", "watered with the rain or water from rivers."

    **Where they differ.** Ibn Kathir and al-Jalālayn read the neighbouring plots as soils of different quality side by side; all three stress that the water is the same. They differ on *ṣinwān*: al-Jalālayn limits it to date palms; Ibn Kathir includes figs and pomegranates. Neither explains *why* the fruits differ beyond God's will; the verse leaves the reader to reason.
howItWorks:
  tr: |-
    Her madde "birbirine komşu kıtalar… hepsi bir tek su ile sulanır. Halbuki… birini öbürüne üstün kılıyoruz" ifadesine bağlanır.
    - **Komşu topraklar gerçekten farklıdır.** [Established, bu örnek için] Oion'daki (Araba-Álava, Bask Ülkesi) sekiz hektarlık bir bağda, Olatz Unamunzaga'nın (Neiker-Tecnalia) yönettiği bir ekip "190'dan fazla noktadan" örnek aldı. Bağda "farklı özelliklere sahip topraklara sahip parseller" vardı ve bunlar "üzüm üretiminde ve şıranın kalitesinde önemli farklar" doğurdu. Toprak derinlikleri 25–80 cm (kumtaşı) ile 85–100 cm (killi şist) arasında değişiyordu; daha fazla su tutan topraklar en gürbüz asmaları verdi; kumtaşı üzerinde ise renk yoğunluğu "diğer topraklardakinden dört kata kadar daha fazla"ydı (CORDIS). Bu, bir özette aktarılan, tek bir bağ hakkındaki tek bir çalışmadır; makalenin kendisine henüz başvurulmadı.
    - **"Bir tek su" eşit su demek değildir.** [Established, bu örnek için] Aynı çalışma "su mevcudiyetinin asmanın birim üretimini etkilediğini" buldu: Yağmur ya da sulama aynı olabilir, ama her toprak ondan farklı bir pay tutar. Bu, müfessirlerin yan yana duran iyi ve kötü topraklar resmine uyar.
    - **Tek kökten birkaç gövde.** [Established] Hurma ağaçları dipten filizler verir. FAO: "Filiz bitkileri ana ağacın tıpatıp aynısıdır"; çekirdekten yetişenler ise farklıdır: "Yavruların yarısı erkek, yarısı dişi olur" ve "çekirdekten yetişen hiçbir iki hurma ağacı birbirine benzemez". Bir hurma ağacı "sınırlı sayıda (en fazla 20 ila 30)" filiz verir. Âyetteki *sınvân* bu büyüme biçimini anlatır; klonlama hakkında hiçbir şey söylemez.
  en: |-
    Each point is tied to "neighboring plots … watered with one water; but … some of them exceed others".
    - **Neighbouring soils really do differ.** [Established, for this case] In one eight-hectare vineyard at Oion (Araba-Álava, Basque Country), a team led by Olatz Unamunzaga (Neiker-Tecnalia) sampled "more than 190 points". The vineyard had "plots with soils of different characteristics", producing "significant differences in the production of the grape and in the quality of the must". Soil depths ranged from 25–80 cm (sandstone) to 85–100 cm (argillite); soils that held more water gave the most robust vines, while on sandstone the colour intensity was "up to four times greater than on the other soils" (CORDIS). This is one study of one vineyard, reported in a summary; the paper itself has not yet been consulted.
    - **"One water" does not mean equal water.** [Established, for this case] The same study found that "Hydric availability affected the unit production of the vine": rain or irrigation can be the same, while each soil keeps a different share of it. This matches the commentators' picture of good and poor soils side by side.
    - **Several trunks from one root.** [Established] Date palms send up offshoots from the base. FAO: "Offshoot plants are true to type to the parent palm", while seedlings differ — "half of the progeny will be males and half will be females" and "no two seedling palms are alike". A palm produces offshoots "in a limited number (20 to 30 at most)". The verse's *ṣinwān* describes this growth habit; it says nothing about cloning.
awe:
  tr: |-
    - Tek bir bağda birkaç metre arayla duran topraklar, bir asmanın ne kadar üzüm verdiğini ve renginin ne kadar koyu olduğunu değiştirdi; bir toprakta renk yoğunluğu dört kata kadar (CORDIS).
    - Bir hurma filizi "tıpatıp aynısıdır": aynı ağaç, ileriye taşınmış (FAO).
  en: |-
    - In a single vineyard, soils a few metres apart changed how much grape a vine gave and how deep its colour was — on one soil, up to four times the colour intensity (CORDIS).
    - A date-palm offshoot is "true to type": the same tree, carried forward (FAO).
reflection:
  tr: |-
    Bir tarlanın kenarında dur ve bir çitin üzerinden yandakine bak. Aynı yağmur ikisine de yağdı. Aynı güneş ikisinin de üstünden geçti. Yine de biri tatlı meyve verir, öbürü ekşi ya da neredeyse hiç.

    Âyet bu sıradan manzarayı bir işarete çevirir. Aynı olan şeyleri sayar (yan yana duran toprak, "bir tek su") ve sonra aynı olmayan tek şeyi: "Halbuki meyvelerinde birini öbürüne üstün kılıyoruz." Fark Allah'a nispet edilir.

    İbn Kesîr onu adlandırmak için yavaşlar: şekil, renk, tat, koku, çiçek, yaprak. Bu farkların yanından her gün fark etmeden geçeriz. Âyet fark etmemizi, sonra da akıl yürütmemizi ister. Son sözleri "botanik bilen insanlar için" değil, "aklı eren bir kavim için"dir.

    Bugün sebeplerin bazılarını tarif edebiliyoruz: suyu tutan bir toprak ve onu bırakan bir toprak, derine ya da sığa giden kökler, her bitkinin kalıtsal tabiatı. Bu işareti boşaltmaz. Bir okuyucu yine de dünyanın neden bir tek suyun bin tat vereceği şekilde kurulduğunu ve bu çeşitliliğin neden bu kadar sık bize karşı cömert olduğunu sorabilir. Bu soru tefekkürün kendisidir; âyet ona davet eder ama onu bir mekanizmayla cevaplamaz.
  en: |-
    Stand at the edge of a field and look across a fence at the next one. The same rain fell on both. The same sun crossed both. Yet one gives sweet fruit and the other gives sour, or little at all.

    The verse makes this ordinary sight into a sign. It lists the things that are the same — the land side by side, the "one water" — and then the one thing that is not: "We make some of them exceed others in [quality of] fruit." The difference is placed with God.

    Ibn Kathir slows down to name it: shape, colour, taste, scent, blossom, leaf. We pass these differences every day without noticing. The verse asks us to notice, and then to reason. Its last words are not "for people who know botany" but "for a people who reason".

    Today we can describe some of the causes: a soil that holds water and one that lets it go, roots that go deep or shallow, the inherited nature of each plant. This does not empty the sign. A reader can still ask why the world is built so that one water gives a thousand flavours, and why that variety is so often generous to us. That question is the reflection; the verse invites it but does not answer it with a mechanism.
honestNotes:
  - en: '**No popular "miracle" claim was found** for this verse in the sources read. The risk here is the opposite: treating the verse as if it denied natural causes. It does not; it attributes the variety to God and asks people to reason about it.'
    tr: "**Okunan kaynaklarda bu âyet için popüler bir \"mucize\" iddiası bulunamadı.** Buradaki risk tersidir: Âyeti tabii sebepleri inkâr ediyormuş gibi ele almak. İnkâr etmez; çeşitliliği Allah'a nispet eder ve insanlardan onun üzerine akıl yürütmelerini ister."
  - en: "**Science and the verse.** The vineyard study shows that neighbouring soils differ, which fits the commentators' picture. It does not test the verse and should not be presented as confirming it."
    tr: "**Bilim ve âyet.** Bağ çalışması komşu toprakların farklı olduğunu gösterir; bu da müfessirlerin resmine uyar. Âyeti sınamaz ve onu doğruluyormuş gibi sunulmamalıdır."
  - en: "**Al-Rāzī.** That may well be so, but his commentary on 13:4 has not yet been consulted, so the claim cannot stay unsourced."
    tr: "**Râzî.** Bu pekâlâ doğru olabilir, ama 13:4 hakkındaki tefsirine henüz başvurulmadı; dolayısıyla iddia kaynaksız kalamaz."
  - en: "**The hadith of the dates** (Tirmidhi 3118) has a disputed grade; it is reported, not relied on."
    tr: "**Hurmalar hadisi** (Tirmizî 3118) tartışmalı bir dereceye sahiptir; aktarılır, ona dayanılmaz."
