verseNotes:
  en: |-
    "And within the land are neighboring plots and gardens of grapevines and crops and palm trees, [growing] several from a root or otherwise, watered with one water; but We make some of them exceed others in [quality of] fruit. Indeed in that are signs for a people who reason" (13:4). Sura al-Raʿd is Medinan in the Tanzil classification.

    - **Setting.** The verse before speaks of the spread-out earth, mountains, rivers, fruits in pairs, and night covering day, ending "Indeed in that are signs for a people who give thought" (13:3). 13:4 narrows the view from the whole earth to a single landscape of neighbouring fields.
    - **Whom it addresses.** "A people who reason" — anyone willing to think about what they see.
    - **Key words.** *Qiṭaʿun mutajāwirāt* ("neighboring plots"). *Ṣinwān* ("several from a root"): plants growing as several trunks from one root; *ghayru ṣinwān* ("or otherwise"): single trunks. *Al-ukul* ("[quality of] fruit"; literally "what is eaten"). The bracketed words are the translator's.
  tr: |-
    "Yeryüzünde birbirine komşu kıtalar vardır. Üzüm bağları, ekinler, çatallı ve çatalsız hurmalıklar vardır ki, hepsi bir tek su ile sulanır. Halbuki meyvelerinde birini öbürüne üstün kılıyoruz. Aklı eren bir kavim için bunda muhakkak ibretler vardır." (13:4). Ra'd Sûresi, Tanzil sınıflandırmasında Medenîdir.

    - **Bağlam.** Önceki âyet döşenmiş yerden, dağlardan, ırmaklardan, çiftler hâlindeki meyvelerden ve gündüzü örten geceden söz eder ve şöyle biter: "Düşünecek olan bir kavim için bunda muhakkak ki, ibretler vardır." (13:3). 13:4 bakışı bütün yeryüzünden komşu tarlalardan oluşan tek bir manzaraya daraltır.
    - **Kime hitap ediyor?** "Aklı eren bir kavim": gördüğü üzerine düşünmeye istekli herkes.
    - **Anahtar kelimeler.** *Kıta'un mütecâvirât* ("birbirine komşu kıtalar", yani toprak parçaları). *Sınvân* ("çatallı"): tek kökten birkaç gövde olarak büyüyen bitkiler; *gayru sınvân* ("çatalsız"): tek gövdeliler. *El-ükül* ("meyveler"; kelimenin tam anlamıyla "yenen şey"). (Saheeh'in İngilizce çevirisinde köşeli parantez içindeki kelimeler çevirmenindir.)
legacyHonestNotes:
  - tr: |
      Genetik, aynı suyun *nasıl* farklı meyveler verdiğini açıklar. Bu tefekkürü ortadan kaldırmaz, ama Râzî'nin delilinin şeklini değiştirir: bugün soru, neden böylesine zengin ve cömert bir genetik "kütüphane" olduğuna dönüşür. Argümanın bugünkü dürüst şekli budur.
    en: "Genetics explains *how* the same water gives different fruits. That does not cancel the reflection, but it does change the shape of al-Rāzī's argument: today the question becomes why there is such a rich and generous genetic \"library\" at all. That is the honest form of the argument today."
followUps:
  - q:
      en: Doesn't soil science explain the differences?
      tr: Toprak bilimi farkları açıklamıyor mu?
    a:
      en: "It explains some of the *how*: in one vineyard, soil depth and water-holding changed yield and grape colour (CORDIS). The verse's question is a different one — why the world is ordered so that one water gives such variety — and it leaves that to the reader's reasoning."
      tr: "*Nasıl*ın bir kısmını açıklar: Bir bağda toprak derinliği ve su tutma, verimi ve üzüm rengini değiştirdi (CORDIS). Âyetin sorusu farklıdır (dünya neden bir tek su böyle bir çeşitlilik verecek şekilde düzenlenmiştir) ve onu okuyucunun akıl yürütmesine bırakır."
  - q:
      en: What does "several from a root" mean?
      tr: '"Çatallı" ne demek?'
    a:
      en: "*Ṣinwān*: several trunks from one root. Ibn Kathir gives figs, pomegranates and dates; al-Jalālayn says date palms with many offshoots."
      tr: "*Sınvân*: tek kökten birkaç gövde. İbn Kesîr incir, nar ve hurmayı örnek verir; *Celâleyn* pek çok filizi olan hurma ağaçları der."
  - q:
      en: Is "one water" literally the same water?
      tr: '"Bir tek su" kelimenin tam anlamıyla aynı su mu?'
    a:
      en: The commentators read it as the same rain or river water (*Tanwīr*; al-Jalālayn). Soils then hold different amounts of it, which is part of why neighbouring plots differ.
      tr: Müfessirler onu aynı yağmur ya da nehir suyu olarak okudu (*Tenvîr*; *Celâleyn*). Topraklar sonra ondan farklı miktarlar tutar; komşu toprak parçalarının farklı olmasının bir sebebi de budur.
  - q:
      en: Did the Prophet (pbuh) comment on this verse?
      tr: Hz. Peygamber (s.a.v.) bu âyet hakkında yorum yaptı mı?
    a:
      en: A report in al-Tirmidhi (3118) names kinds of dates for "some … more excellent than others to eat", but its grade is disputed (*ḥasan* to al-Albani, weak to Zubayr ʿAlī Zaʾī).
      tr: Tirmizî'deki (3118) bir rivayet "bazısını yemek bakımından diğerlerinden üstün" ifadesi için hurma türlerini sayar, ama derecesi tartışmalıdır (Elbânî'ye göre *hasen*, Zübeyr Ali Zeî'ye göre zayıf).
