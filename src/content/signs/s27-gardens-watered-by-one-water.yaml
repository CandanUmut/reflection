title:
  tr: Tek bir suyla sulanan bahçeler ve meyveler
  en: Gardens and fruits watered by one water
verses:
  - 13:4
seeAlso:
  - 13:3
  - 6:99
  - 6:141
summary:
  tr: Girdiler aynı, ürünler çeşit çeşit. Âyet, çeşitliliğin tesadüf değil tasarım olduğunu fark etmeye çağırır.
  en: Sameness of inputs, diversity of outputs. The verse asks us to notice that variety is designed, not accidental.
tafsir:
  tr: |
    [Scholarly]

    - *Sinvân* ("tek kökten"), ortak bir kökten büyüyen hurmaları anlatır; bu, hurma ağacının bir özelliğidir.
    - Râzî bu âyeti **seçen bir Yaratıcı** için temel bir delil olarak kullanır: aynı toprak, aynı su ve aynı güneş farklı tatlar, renkler ve kokular verir; o hâlde fark yalnızca bu sebeplerden gelemez.
    - İbn Kesîr tat, renk ve fayda çeşitliliğini vurgular.
  en: |-
    [Scholarly]

    - *Ṣinwān* ("from one root") describes palms growing from a shared root, a feature of date palms.
    - Al-Rāzī uses this verse as a key argument for a **choosing Creator**: the same soil, the same water and the same sun produce different tastes, colors and smells, so the difference cannot come from these causes alone.
    - Ibn Kathīr stresses the variety of taste, color and benefit.
howItWorks:
  tr: |
    [Established]

    - Aynı su ve toprak farklı meyveler verir, çünkü her bitki kendi **genetik programını** (DNA) taşır. Genler, bitkinin hangi şekerleri, asitleri, pigmentleri ve kokuları üreteceğini belirler.
    - Toprak türü, mineraller, mikroplar ve güneş ışığı da tadı değiştirir. Bağcılar buna *terroir* der.
    - Hurma ağaçları çoğu zaman ana ağacın dibinden fidanlar (yavrular) verir. Çiftçiler iyi bir çeşidi aynen çoğaltmak için bunları diker.
  en: |-
    [Established]

    - The same water and soil give different fruits because each plant carries its own **genetic program** (DNA). Genes decide which sugars, acids, pigments and aromas the plant makes.
    - Soil type, minerals, microbes and sunlight also change flavor. Wine growers call this *terroir*.
    - Date palms often send out offshoots from the base of the mother tree. Farmers plant these to copy a good variety exactly.
awe:
  tr: |
    - Bir su molekülü her yerde aynıdır; yine de asma onu tatlı üzüme, limon ağacı ekşi limona, biber acılığa çevirir.
    - Hurma fidanları genetik kopyalardır; ünlü çeşitler yüzyıllardır bu sayede korunmuştur.
  en: |-
    - One water molecule is the same everywhere, yet a grapevine turns it into sweet grapes, a lemon tree into sour lemons, a pepper into heat.
    - Date-palm offshoots are genetic copies; that is how famous varieties have been preserved for centuries.
reflection:
  tr: |
    Girdiler aynı, ürünler çeşit çeşit. Âyet "akıl eden bir toplum için" diye biter: çeşitliliğin tesadüf değil tasarım olduğunu fark etmeye çağırır.
  en: 'Sameness of inputs, diversity of outputs. The verse ends "for people who reason": it asks us to notice that variety is designed, not accidental.'
honestNotes:
  - tr: |
      Genetik, aynı suyun *nasıl* farklı meyveler verdiğini açıklar. Bu tefekkürü ortadan kaldırmaz, ama Râzî'nin delilinin şeklini değiştirir: bugün soru, neden böylesine zengin ve cömert bir genetik "kütüphane" olduğuna dönüşür. Argümanın bugünkü dürüst şekli budur.
    en: "Genetics explains *how* the same water gives different fruits. That does not cancel the reflection, but it does change the shape of al-Rāzī's argument: today the question becomes why there is such a rich and generous genetic \"library\" at all. That is the honest form of the argument today."
visualizations:
  - id: ideas
    tr: |
      - "Tek su, çok meyve": tek bir dere birkaç bitkiyi besler; her biri suyu kendi rengi, tadı ve kokusuyla farklı bir meyveye çevirir.
      - Bir hurma fidanı canlandırması.
    en: |-
      - "One water, many fruits": a single stream feeds several plants, each turning the water into a different fruit with its own color, taste and smell labels.
      - A date-palm offshoot animation.
