followUps:
  - q:
      en: Does "pairs" mean everything has male and female?
      tr: '"Çiftler" her şeyin erkeği ve dişisi olduğu anlamına mı geliyor?'
    a:
      en: 'Al-Jalālayn begins with "male and female", but both commentators read it far more widely: Ibn Kathir lists night and day, land and sea, life and death, faith and disbelief.'
      tr: '*Celâleyn* "erkek ve dişi" ile başlar, ama iki müfessir de onu çok daha geniş okur: İbn Kesîr gece ve gündüzü, kara ve denizi, hayat ve ölümü, iman ve küfrü sayar.'
  - q:
      en: What does the diversity of languages show?
      tr: Dillerin çeşitliliği neyi gösterir?
    a:
      en: For Ibn Kathir, the range of human languages and faces is itself a sign that "only Allah knows" in full (30:22). Today about 7,164 living languages are counted (Ethnologue).
      tr: İbn Kesîr'e göre insan dillerinin ve yüzlerinin çeşitliliği, tamamını "ancak Allah'ın bildiği" bir işarettir (30:22). Bugün yaklaşık 7.164 yaşayan dil sayılıyor (Ethnologue).
  - q:
      en: Why do human skin colours differ?
      tr: İnsanların deri renkleri neden farklıdır?
    a:
      en: 'Mainly because of sunlight. Jablonski and Chaplin (2000) found skin reflectance "strongly correlated" with UV levels: darker skin protects folate; lighter skin allows vitamin D to be made where sunlight is weaker.'
      tr: 'Esas olarak güneş ışığı yüzünden. Jablonski ve Chaplin (2000), deri yansıtıcılığının UV düzeyleriyle "güçlü biçimde ilişkili" olduğunu buldu: Koyu deri folatı korur; daha açık deri, güneş ışığının zayıf olduğu yerlerde D vitamini yapılmasına imkân verir.'
  - q:
      en: Is diversity a reason for pride or division?
      tr: Çeşitlilik gurur ya da ayrılık için bir sebep mi?
    a:
      en: '49:13 says the opposite: peoples and tribes exist "that you may know one another", and "the most noble of you in the sight of Allah is the most righteous of you".'
      tr: "49:13 tersini söyler: Milletler ve kabileler \"birbirinizle tanışmanız için\" vardır ve \"Allah yanında en değerli ve en üstününüz O'ndan en çok korkanınızdır\"."
  - q:
      en: Did the Quran predict antimatter?
      tr: Kur'an antimaddeyi önceden mi bildirdi?
    a:
      en: No. That is a modern reading of "pairs"; the commentators read the word as complementary opposites and male and female (see the honest notes).
      tr: Hayır. Bu "çiftler"in modern bir okumasıdır; müfessirler kelimeyi birbirini tamamlayan zıtlar ve erkek ve dişi olarak okudu (bkz. "Dürüst notlar").
