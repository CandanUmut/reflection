title:
  tr: Çiftler; dillerin ve renklerin çeşitliliği
  en: Pairs and the diversity of tongues and colours
summary:
  tr: Yaklaşık 7.000 yaşayan dil. 49:13 çeşitliliğe amacını verir — "tanışasınız diye".
  en: About 7,000 living languages. 49:13 gives diversity its purpose — "that you may know one another".
tafsir:
  tr: Çiftler, geniş anlamda birbirini tamamlayan zıtlar olarak okunur.
  en: Pairs are read broadly as complementary opposites.
howItWorks:
  tr: |
    [Established]

    - Her canlı eşeyli üremez.
    - Fizikte yük çiftleri ve parçacık–karşıt parçacık çiftleri vardır.
    - Yaklaşık 7.000 yaşayan dil vardır.
    - Ten rengi, UV ışınına maruz kalmayı izler.
  en: |
    [Established]

    - Not all life reproduces sexually.
    - Physics has charge pairs and particle–antiparticle pairs.
    - There are about 7,000 living languages.
    - Skin colour tracks UV exposure.
