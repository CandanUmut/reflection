verseNotes:
  tr: |-
    "Biz herşeyden iki çift yarattık. Umulur ki, iyice düşünürsünüz." (51:49), Zâriyât Sûresi, Mekkî. Göğün bina edilmesi ve yerin döşenmesi hakkındaki âyetlerden (51:47–48) sonra gelir.

    "Yine göklerin ve yerin yaratılışı ile dillerinizin ve renklerinizin farklı oluşu da O'nun âyetlerindendir. Şüphesiz ki bunda bilenler için nice ibretler vardır." (30:22), Rûm Sûresi, Mekkî; "O'nun âyetlerindendir" diye başlayan bir dizi âyetin içinde (30:20–25).

    İlgili bir âyet: "… yeryüzünde meyvelerin hepsinden iki çift yapan O'dur." (13:3). Ve çeşitliliğe bir amaç veren bir âyet: "Ey insanlar! Doğrusu biz sizi bir erkekle bir dişiden yarattık. Ve birbirinizle tanışmanız için sizi milletlere ve kabilelere ayırdık. Muhakkak ki Allah yanında en değerli ve en üstününüz O'ndan en çok korkanınızdır." (49:13), Medenî.

    - **Anahtar kelimeler.** *Zevceyn* ("iki çift"): bir çift, birbirine ait iki şey; erkek ve dişi için kullanılır, ama birbirine uyan ya da birbirini tamamlayan herhangi iki şey için de. *İhtilâfu elsinetiküm ve elvâniküm*: dillerinizin ve renklerinizin farklılığı. *Li'l-âlimîn* (30:22): "bilenler için"; *Celâleyn* bunun *li'l-âlemîn* olarak da harekelenebileceğini not eder ve bunu "akıl sahibi yaratıklar" diye açıklar.
    - **İfade hakkında bir not.** İbn Kesîr'in çevirmeni 51:49'u "And of everything We have created pairs" (Her şeyden çiftler yarattık) diye çevirir; Saheeh'te "And of all things We created two mates" (Her şeyden iki eş yarattık) vardır.
  en: |-
    "And of all things We created two mates; perhaps you will remember" (51:49), Sura al-Dhāriyāt, Meccan. It follows verses on the building of the sky and the spreading of the earth (51:47–48).

    "And of His signs is the creation of the heavens and the earth and the diversity of your languages and your colors. Indeed in that are signs for those of knowledge" (30:22), Sura al-Rūm, Meccan, in a run of "and of His signs" verses (30:20–25).

    A related verse: "And from all of the fruits He made therein two mates" (13:3). And one that gives diversity a purpose: "O mankind, indeed We have created you from male and female and made you peoples and tribes that you may know one another. Indeed, the most noble of you in the sight of Allah is the most righteous of you" (49:13), Medinan.

    - **Key words.** *Zawjayn* ("two mates"): a pair, two things that belong together; used of male and female, but also of any matching or complementary two. *Ikhtilāf alsinatikum wa-alwānikum*: the difference of your tongues and your colours. *Lil-ʿālimīn* (30:22): "for those of knowledge"; al-Jalālayn notes it can also be vowelled *lil-ʿālamīn*, which it glosses as "rational creatures".
    - **Note on wording.** Ibn Kathir's translator renders 51:49 as "And of everything We have created pairs"; Saheeh has "And of all things We created two mates".
awe:
  tr: |-
    - Bugün 7.164 yaşayan dil konuşuluyor (Ethnologue, 2024).
    - İnsan deri rengi dünya genelinde güneş ışığının gücünü izler; folatı korumakla D vitamini yapmak arasında bir denge (Jablonski ve Chaplin, 2000).
    - İbn Kesîr on dördüncü yüzyılda "her yüzün kendine has özellikleri vardır ve bir başkasına benzemez" diye yazmıştı bile.
  en: |-
    - 7,164 living languages are spoken today (Ethnologue, 2024).
    - Human skin colour tracks the strength of sunlight across the world, a balance between protecting folate and making vitamin D (Jablonski & Chaplin, 2000).
    - Ibn Kathir, in the fourteenth century, already wrote that "Each face has its own characteristics and does not look like another".
legacyHonestNotes:
  - tr: Âyet bir "karşıt madde öngörüsünde" bulunmadı.
    en: The verse made no "antimatter prediction".
