title:
  tr: Çiftler; dillerin ve renklerin çeşitliliği
  en: Pairs and the diversity of tongues and colours
summary:
  tr: Yaklaşık 7.000 yaşayan dil. 49:13 çeşitliliğe amacını verir — "tanışasınız diye".
  en: About 7,000 living languages. 49:13 gives diversity its purpose — "that you may know one another".
tafsir:
  tr: Çiftler, geniş anlamda birbirini tamamlayan zıtlar olarak okunur.
  en: |-
    **Everything in pairs.** On "And of everything We have created pairs", Ibn Kathir explains: "all the created are in pairs, the heaven and earth, night and day, sun and moon, land and sea, light and darkness, faith and disbelief, death and life, misery and happiness, Paradise and Fire, in addition to the animals and plants" — "that you may remember" that the Creator is One. Pairs, in his reading, are complementary opposites across all of creation, not only male and female.

    **Languages and colours.** On 30:22, Ibn Kathir lists the languages he knew — Arabic, the Tatars, Georgians, Romans, Franks, Berbers, Ethiopians, Indians, Persians, Slavs, Armenians, Kurds and others — and adds: "Only Allah knows the variety of languages spoken among the sons of Adam." The difference of colours, he says, refers to people's appearance: no two, from Adam to the Hour, are alike.
howItWorks:
  tr: |
    [Established]

    - Her canlı eşeyli üremez.
    - Fizikte yük çiftleri ve parçacık–karşıt parçacık çiftleri vardır.
    - Yaklaşık 7.000 yaşayan dil vardır.
    - Ten rengi, UV ışınına maruz kalmayı izler.
  en: |
    [Established]

    - Not all life reproduces sexually.
    - Physics has charge pairs and particle–antiparticle pairs.
    - There are about 7,000 living languages.
    - Skin colour tracks UV exposure.
reflection:
  tr: '49:13 çeşitliliğe amacını verir: "tanışasınız diye".'
  en: 'Ibn Kathir reads "pairs" across all of creation: night and day, land and sea, life and death. Opposites that complete each other. Then 30:22 points to the variety of languages and colours as a sign, and 49:13 gives that variety a purpose: "that you may know one another". The same verse adds who is most noble: "the most righteous of you" (49:13), not the best-born or the best-coloured. Diversity is not a problem to be fixed; it is a way to meet and learn.'
honestNotes:
