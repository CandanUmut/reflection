title:
  tr: Çiftler; dillerin ve renklerin çeşitliliği
  en: Pairs and the diversity of tongues and colours
summary:
  tr: "51:49 Allah'ın her şeyden \"iki çift\" yarattığını söyler; 30:22 de \"dillerinizin ve renklerinizin farklı oluşu\"nu O'nun âyetleri arasında sayar: Çeşitliliğin kendisi fark edilmesi gereken bir şeydir."
  en: '51:49 says God created "two mates" of all things, and 30:22 counts "the diversity of your languages and your colors" among His signs: variety itself is something to notice.'
tafsir:
  tr: |-
    **İbn Kesîr, 51:49 hakkında.** "Bütün yaratılmışlar çiftlerdir: gök ve yer, gece ve gündüz, güneş ve ay, kara ve deniz, aydınlık ve karanlık, iman ve küfür, ölüm ve hayat, bedbahtlık ve mutluluk, Cennet ve Cehennem", "hayvanlara ve bitkilere ek olarak". Ve "umulur ki iyice düşünürsünüz" hakkında: "Yaratıcının, Allah'ın, ortağı olmayan Bir olduğunu bilin." Ona göre çiftler bütün yaratılış boyunca birbirini tamamlayan zıtlardır ve amaçları, hiçbir eşi olmayan Bir'i göstermektir.

    ***Celâleyn*, 51:49 hakkında.** Çiftler "erkek ve dişi gibi iki türdür"; örnekleri arasında "gök ve yer, güneş ve ay" ve "aydınlık ve karanlık" vardır.

    **İbn Kesîr, 30:22 hakkında.** Bildiği dilleri sayar: "Kimi Arapça konuşur, Tatarların kendi dili vardır", Gürcüler, Rumlar, Frenkler, Berberiler, Habeşler, Hintliler, Farslar, Slavlar ve başkaları; ve ekler: "Âdemoğulları arasında konuşulan dillerin çeşitliliğini ancak Allah bilir." Renkler hakkında: "Burada anılan renklerinin farklılığı görünüşlerine işaret eder": "Allah'ın Âdem'i yarattığı zamandan Kıyamet kopana kadar", "her yüzün kendine has özellikleri vardır ve bir başkasına benzemez".

    ***Celâleyn*, 30:22 hakkında.** Son ifade "ya *li'l-âlemîne* ya da *li'l-âlimîne* olarak harekelenebilir"; bu da sırasıyla "ya akıl sahibi yaratıklar ya da ilim sahipleri" demektir.

    **Söylemedikleri.** Hiçbiri "çiftler"i bir fizik yasası olarak okumaz; hiçbiri renklerin çeşitliliğini halkların sıralanması olarak ele almaz. İbn Kesîr "renkler"i her yüzün farklı olması olarak okur.
  en: |-
    **Ibn Kathir on 51:49.** "all the created are in pairs, the heaven and earth, night and day, sun and moon, land and sea, light and darkness, faith and disbelief, death and life, misery and happiness, Paradise and Fire", "in addition to the animals and plants". And "that you may remember": "know that the Creator, Allah, is One without partners". For him the pairs are complementary opposites across all creation, and their purpose is to point to the One who has no pair.

    **Al-Jalālayn on 51:49.** The pairs are "two kinds such as male and female", with examples including "heaven and earth sun and moon" and "light and darkness".

    **Ibn Kathir on 30:22.** He lists the languages he knew: "some speak Arabic, and the Tatars have their own language", and the Georgians, Romans, Franks, Berbers, Ethiopians, Indians, Persians, Slavs and others, and adds: "Only Allah knows the variety of languages spoken among the sons of Adam." On colours: "the difference of their colors mentioned here refers to their appearance": "from the time that Allah created Adam, and until the Hour begins", "Each face has its own characteristics and does not look like another".

    **Al-Jalālayn on 30:22.** The final phrase "may be vocalised either as li'l-'ālamīna or li'l-'ālimīna", meaning "either rational creatures or people of knowledge respectively".

    **What they did not say.** Neither reads "pairs" as a law of physics; neither treats the variety of colours as a ranking of peoples. Ibn Kathir reads "colours" as every face being different.
howItWorks:
  tr: |-
    - **"Herşeyden iki çift": canlılarda çiftler.** [Established] Pek çok canlı iki cinsiyet yoluyla ürer, ama hepsi değil: Pek çok organizma bir eş olmadan ürer (örneğin bölünerek). Dolayısıyla biyolojik anlamda "çiftler" çok yaygındır, evrensel değildir. (Eşeysiz üreme hakkında adı belli bir kaynak okunmadı; bu ders kitabı biyolojisidir.)
    - **"Dillerinizin… farklı oluşu".** [Established] Ethnologue (27. baskı, 2024) "dünya çapında toplam 7.164 yaşayan dil" sayar.
    - **"Ve renklerinizin".** [Established] Jablonski ve Chaplin (2000), "deri yansıtıcılığının mutlak enlem ve UV radyasyonu düzeyleriyle güçlü biçimde ilişkili olduğunu" buldu. Açıklamaları: Koyu, "yüksek oranda melanin içeren deri, folatın UV'nin yol açtığı fotolizine karşı korur" (gebelikte gerekli bir vitaminin güneş ışığıyla parçalanması), tropiklerden uzakta ise daha açık deri "UVB'nin yol açtığı provitamin D3 sentezine" imkân verdi. İnsan deri renginin yelpazesi, "ışıktan korunma ile D vitamini sentezinin çatışan fizyolojik ihtiyaçları arasında bir uzlaşma çözümünü temsil eder".
  en: |-
    - **"Of all things… two mates": pairs in living things.** [Established] Many living things reproduce through two sexes, but not all: many organisms reproduce without a partner (for example, by dividing). So "pairs" in the biological sense is very common, not universal. (No named source on asexual reproduction was read; this is textbook biology.)
    - **"The diversity of your languages".** [Established] Ethnologue (27th edition, 2024) counts "a total of 7,164 living languages worldwide".
    - **"And your colors".** [Established] Jablonski and Chaplin (2000) found that "skin reflectance is strongly correlated with absolute latitude and UV radiation levels". Their explanation: dark, "highly melanized skin protected against UV-induced photolysis of folate" (the breakdown by sunlight of a vitamin needed in pregnancy), while lighter skin away from the tropics allowed "UVB-induced synthesis of previtamin D3". The range of human skin colour "represents a compromise solution to the conflicting physiological requirements of photoprotection and vitamin D synthesis".
reflection:
  tr: |-
    İki âyet, iki tür çeşitlilik. 51:49 dünyayı çiftler hâlinde kurulmuş görür. İbn Kesîr'in listesi gökten ruha uzanır: gök ve yer, gece ve gündüz, kara ve deniz, aydınlık ve karanlık, hayat ve ölüm, iman ve küfür. Her biri anlaşılmak için diğerine ihtiyaç duyar. Ve âyet bize bunun neden gösterildiğini söyler: "Umulur ki, iyice düşünürsünüz." (51:49). Çiftlerden oluşan bir dünyada yalnız Yaratıcının eşi yoktur.

    30:22 bize döner. Dillerimiz ve renklerimiz farklıdır ve âyet buna bir işaret der. İbn Kesîr, Âdem'den Kıyamet'e kadar hiçbir iki yüzün aynı olmadığını fark eder. Bir düzine dili adıyla biliyordu; bugün binlercesini sayıyoruz. "Çeşitliliği ancak Allah bilir."

    Sonra 49:13 bu çeşitliliğe bir amaç verir: "birbirinizle tanışmanız için". Farklılık sıralamak için değil, tanışmak içindir. Aynı âyet soy ya da renk gururuna giden her kapıyı kapatır: "Muhakkak ki Allah yanında en değerli ve en üstününüz O'ndan en çok korkanınızdır."

    Dolayısıyla okuyucudan iki şey istenir. Çiftlere bakmak ve Allah'ın Bir olduğunu hatırlamak. Ve başka insanların yüzlerine ve dillerine bakıp farklılıklarında bir tehdit değil, bir işaret ve onları tanımaya bir davet görmek.
  en: |-
    Two verses, two kinds of variety. 51:49 sees the world built in pairs. Ibn Kathir's list moves from the sky to the soul: heaven and earth, night and day, land and sea, light and darkness, life and death, faith and disbelief. Each needs the other to be understood. And the verse says why we are shown this: "perhaps you will remember" (51:49). In a world of pairs, the Creator alone has no pair.

    30:22 turns to us. Our languages and colours differ, and the verse calls that a sign. Ibn Kathir notices that no two faces, from Adam to the Hour, are the same. He knew a dozen languages by name; today we count thousands. "Only Allah knows the variety."

    Then 49:13 gives that variety a purpose: "that you may know one another". Difference is for meeting, not for ranking. The same verse closes every door to pride of birth or colour: "the most noble of you in the sight of Allah is the most righteous of you".

    So the reader is asked two things. To look at the pairs, and remember that God is One. And to look at the faces and tongues of other people, and see in their difference not a threat, but a sign and an invitation to know them.
honestNotes:
  - en: "**The popular claim.** Sultan Bashir Mahmood wrote that Paul Dirac showed \"all particles in the universe must exist in pairs\", and that the Quran's verse on pairs (36:36, not quoted from verified data here) \"may be considered relevant to Dirac's discoveries\", adding that it \"clearly shows that the Qur'an is referring to a law of nature\" (*The Fountain*, 2009). The article quotes 51:49 later but does not tie it to Dirac."
    tr: "**Popüler iddia.** Sultan Bashir Mahmood, Paul Dirac'ın \"evrendeki bütün parçacıkların çiftler hâlinde var olması gerektiğini\" gösterdiğini ve Kur'an'ın çiftler hakkındaki âyetinin (36:36, burada doğrulanmış veriden alıntı yapılmadı) \"Dirac'ın keşifleriyle ilgili sayılabileceğini\" yazdı ve bunun \"Kur'an'ın bir tabiat yasasından söz ettiğini açıkça gösterdiğini\" ekledi (*The Fountain*, 2009). Makale 51:49'u daha sonra aktarır ama onu Dirac'a bağlamaz."
  - en: |-
      **Weighing it.**
        - "Pairs" in the verses is a general word. Ibn Kathir's list is of complementary opposites (night and day, life and death, faith and disbelief), not of particles; al-Jalālayn's begins with "male and female".
        - Reading antimatter into the verse fits only if "pairs" is given a modern meaning the commentators read here did not give it. And not everything in physics or biology comes in pairs (see "How it works").
        - The fair statement: the verse invites reflection on pairing and complementarity in creation; it makes no antimatter "prediction".
    tr: |-
      **Değerlendirme.**
        - Âyetlerdeki "çiftler" genel bir kelimedir. İbn Kesîr'in listesi parçacıklardan değil, birbirini tamamlayan zıtlardan oluşur (gece ve gündüz, hayat ve ölüm, iman ve küfür); *Celâleyn*'inki "erkek ve dişi" ile başlar.
        - Antimaddeyi âyete okumak, ancak "çiftler"e burada okunan müfessirlerin vermediği modern bir anlam verilirse uyar. Ve fizikte ya da biyolojide her şey çiftler hâlinde gelmez (bkz. "Nasıl işler?").
        - Adil ifade: Âyet yaratılıştaki eşleşme ve tamamlayıcılık üzerine düşünmeye davet eder; hiçbir antimadde "kehaneti" yapmaz.
  - en: '**Colour is not race.** The verse speaks of "your colors" as a sign; it does not divide people into races, and 49:13 rules out ranking by birth. The science of skin colour describes adaptation to sunlight; it does not support ranking either.'
    tr: '**Renk ırk değildir.** Âyet "renkleriniz"den bir işaret olarak söz eder; insanları ırklara ayırmaz ve 49:13 soya göre sıralamayı dışlar. Deri renginin bilimi güneş ışığına uyumu anlatır; o da bir sıralamayı desteklemez.'
  - en: "**Language counts change.** \"7,164\" is Ethnologue's 2024 count; counts depend on how languages and dialects are distinguished."
    tr: "**Dil sayıları değişir.** \"7.164\", Ethnologue'un 2024 sayısıdır; sayılar dillerin ve lehçelerin nasıl ayırt edildiğine bağlıdır."
