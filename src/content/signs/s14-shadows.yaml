      tr: |
        - Bir gölgenin uzunluğu, cismin boyunun güneşin yükseklik açısının tanjantına bölümüne eşittir.
        - Gün doğumunda ve batımında gölgeler çok uzar; güneş en yüksekte olduğu anda (zeval) günün en kısa gölgesini verir.
        - Desen enleme ve mevsime göre değişir, çünkü Dünya'nın ekseni yaklaşık 23,4° eğiktir. Mekke'de yılda iki kez öğle güneşi tam tepeye gelir ve gölge neredeyse kaybolur.
