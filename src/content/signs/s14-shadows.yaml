verseNotes:
  en: |-
    "Have you not considered your Lord - how He extends the shadow, and if He willed, He could have made it stationary? Then We made the sun for it an indication. Then We hold it in hand for a brief grasp" (25:45–46). Sura al-Furqān is Meccan. Next: "And it is He who has made the night for you as clothing and sleep [a means for] rest and has made the day a resurrection" (25:47).

    - *Madda al-ẓill*: "extends the shadow".
    - *Sākinan*: "stationary", still.
    - *Dalīl*: "an indication", a guide.
    - *Qabḍan yasīran*: "a brief grasp" — drawn in gently, little by little.
legacyHonestNotes:
  - tr: |
      Âyet, herkesin gözlemleyebileceği bir şeyi anlatır. "Dünya'nın dönüşünü açıkladığı" iddiaları âyetin ifadesinin ötesine geçer. Klasik âlimler âyeti kendi kozmolojileri içinde okudu ve o okuma da gözleme uyar.
    en: The verse describes what anyone can observe. Claims that it "reveals Earth's rotation" go beyond the wording. Classical scholars read it within their own cosmology, and that reading also fits the observation.
followUps:
  - q:
      en: What is the "extended shadow"?
    a:
      en: Most commentators say the time between dawn and sunrise (al-Hasan and Qatada, in al-Qurtubi; Ibn ʿAbbas, Ibn ʿUmar, Mujahid and Qatada, in Ibn Kathir), when the light is spread out and there are no sharp shadows.
  - q:
      en: What does "He could have made it stationary" mean?
    a:
      en: 'Ibn ʿAbbas: it could have stayed so "until the Day of Resurrection"; another view: God could have kept the sun from rising (al-Qurtubi).'
  - q:
      en: How is the sun an "indication" of the shadow?
    a:
      en: "Shade is known by its opposite: the sun shows that shade is real by removing it and by setting its edge (al-Qurtubi)."
  - q:
      en: How do shadows tell the prayer times?
    a:
      en: In the hadith of Gabriel, the afternoon prayer began when an object's shadow equalled its length ({hadith:tirmidhi:149}); the schools differ on one length or two.
  - q:
      en: Does the verse describe the earth's rotation?
    a:
      en: No. It describes the shadow's movement as anyone sees it; the commentators did not read it as cosmology.
