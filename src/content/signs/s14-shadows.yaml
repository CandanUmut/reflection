      en: |
        - A shadow's length equals the object's height divided by the tangent of the sun's elevation angle.
        - At sunrise and sunset shadows stretch very long; at solar noon they reach their shortest length of the day.
        - The pattern changes with latitude and season, because Earth's axis is tilted about 23.4°. Twice a year in Mecca the noon sun stands directly overhead and shadows almost disappear.
        - In the majority view, ʿAṣr begins when the shadow equals the object's length plus its noon shadow; in the Ḥanafī view, twice the length plus the noon shadow.
        - The drawing is a side view: the shadow's direction is simplified to fall west in the morning and east in the afternoon.
