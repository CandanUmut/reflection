verseNotes:
  en: |-
    "Have you not considered your Lord - how He extends the shadow, and if He willed, He could have made it stationary? Then We made the sun for it an indication. Then We hold it in hand for a brief grasp" (25:45–46), Meccan, in Sura al-Furqān, followed by night as a covering and sleep as rest (25:47, not quoted from verified data).

    - **Key words.** *Madda al-ẓill*: "extends the shadow". *Sākinan*: "stationary". *Dalīlan*: "an indication", a guide. *Qabḍan yasīran*: "a brief grasp", a gentle drawing-in.
legacyHonestNotes:
  - tr: |
      Âyet, herkesin gözlemleyebileceği bir şeyi anlatır. "Dünya'nın dönüşünü açıkladığı" iddiaları âyetin ifadesinin ötesine geçer. Klasik âlimler âyeti kendi kozmolojileri içinde okudu ve o okuma da gözleme uyar.
    en: The verse describes what anyone can observe. Claims that it "reveals Earth's rotation" go beyond the wording. Classical scholars read it within their own cosmology, and that reading also fits the observation.
followUps:
  - q:
      en: What shadow is the verse about?
    a:
      en: 'Ibn Kathir and al-Jalālayn: the shade "from the beginning of the dawn until the sun rises".'
  - q:
      en: Why does it say God "could have made it stationary"?
    a:
      en: Because the shadow's movement is not necessary; it depends on the sun and the Earth's motion. A still shadow would mean an unchanging sky.
  - q:
      en: How are shadows used to time prayers?
    a:
      en: ʿAṣr begins when a shadow equals the object's length plus its noon shadow (Maliki, Shafiʿi, Hanbali), or twice the length plus the noon shadow (the dominant Hanafi view), based on the hadith of Jibril (al-Tirmidhi 149).
  - q:
      en: What does "a brief grasp" mean?
    a:
      en: The gentle, gradual drawing-in of the shadow as the sun rises; Ibn Kathir says it "refers to the shade".
