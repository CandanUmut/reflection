legacyHonestNotes:
  - tr: |
      - Çok yaygın bir iddiaya göre "Kur'an parmak izini 1.400 yıl önce bildirdi." Âyet izlerden değil parmak uçlarından söz eder ve hiçbir klasik âlim onu parmak iziyle ilgili okumadı. Parmak izini öngörü olarak değil, açıkça modern bir tefekkür olarak etiketleyerek sunmak gerekir.
      - Dünyadaki her parmak izinin benzersiz olduğunu kimse resmî olarak kanıtlamadı. Bu çok güçlü bir pratik kuraldır, matematiksel bir kesinlik değil.
    en: |-
      - A very popular claim says "the Quran revealed fingerprints 1,400 years ago." The verse mentions fingertips, not prints, and no classical scholar read it as being about fingerprints. Present fingerprints as a clearly labelled modern reflection, not a prediction.
      - Nobody has formally proven every fingerprint on Earth is unique. It is a very strong practical rule, not a mathematical certainty.
    important: true
followUps:
  - q:
      en: What does "proportion his fingertips" mean?
    a:
      en: Either that God can restore even the small finger-bones and make them even again (Ibn Qutayba, al-Zajjaj; preferred by al-Qurtubi and Ibn Kathir), or that God could have made the hand a single hoof (Ibn ʿAbbas, Mujahid, ʿIkrima, Qatada; "most commentators", according to al-Qurtubi).
  - q:
      en: Does the verse talk about fingerprints?
    a:
      en: No. It mentions fingertips, and no classical commentator connected it with prints. Fingerprints are a modern reflection that a reader may bring.
  - q:
      en: When do fingerprints form?
    a:
      en: Before birth, roughly between weeks 10 and 15 of pregnancy (Langenburg), as ridges spread in waves across the fingertip (Glover et al., 2023).
  - q:
      en: Do identical twins have the same fingerprints?
    a:
      en: No. They often share the general pattern type, but the detailed features differ (Langenburg).
  - q:
      en: Why does the sura say man "desires to continue in sin" (75:5)?
    a:
      en: Because doubt about the resurrection is often less about evidence than about not wanting to be answerable.
