legacyHonestNotes:
  - tr: |
      - Çok yaygın bir iddiaya göre "Kur'an parmak izini 1.400 yıl önce bildirdi." Âyet izlerden değil parmak uçlarından söz eder ve hiçbir klasik âlim onu parmak iziyle ilgili okumadı. Parmak izini öngörü olarak değil, açıkça modern bir tefekkür olarak etiketleyerek sunmak gerekir.
      - Dünyadaki her parmak izinin benzersiz olduğunu kimse resmî olarak kanıtlamadı. Bu çok güçlü bir pratik kuraldır, matematiksel bir kesinlik değil.
    en: |-
      - A very popular claim says "the Quran revealed fingerprints 1,400 years ago." The verse mentions fingertips, not prints, and no classical scholar read it as being about fingerprints. Present fingerprints as a clearly labelled modern reflection, not a prediction.
      - Nobody has formally proven every fingerprint on Earth is unique. It is a very strong practical rule, not a mathematical certainty.
    important: true
followUps:
  - q:
      en: Did the Quran reveal fingerprints?
    a:
      en: No. The verse speaks of fingertips; the classical readings are about God's power to rebuild the body, down to the fingers. Fingerprints are a modern reflection.
  - q:
      en: What did classical scholars think the verse meant?
    a:
      en: That God can rebuild even the fingers (al-Jalālayn, Ibn Kathir, *Tanwīr al-Miqbās*); Ibn Kathir and *Tanwīr* illustrate the power with fingers made "all equal" or hoof-like.
  - q:
      en: When do fingerprints form?
    a:
      en: Between about weeks 10 and 15 of pregnancy (Langenburg).
  - q:
      en: Do identical twins have the same fingerprints?
    a:
      en: No; they may share pattern types, but not identifying details (Langenburg).
