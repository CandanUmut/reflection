followUps:
  - q:
      en: Is this verse about fingerprints?
    a:
      en: No classical commentator read it that way; the honest notes explain why the modern claim is weak.
  - q:
      en: Why fingertips?
    a:
      en: They are among the smallest and finest parts of the body; restoring them shows power over every detail.
