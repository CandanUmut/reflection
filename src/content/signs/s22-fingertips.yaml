      - 6. haftadan 17. haftaya bir cenin eli canlandırması: yastıkçıklar şişer, çekilir ve sırtlar girdap, ilmek ya da kemer olarak belirir. Bir zamanlama kaydırıcısı deseni değiştirir.
      - Bir "ikizler" kartı: iki aynı yüz, iki farklı parmak izi.
    en: |-
      - A fetal-hand animation from week 6 to week 17: pads swell, shrink, and ridges emerge as whorl, loop or arch. A timing slider changes the pattern.
      - A "twins" card: two identical faces, two different fingerprints.
