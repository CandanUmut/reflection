id: S24
slugs:
  tr: duman-ve-ayrilis
  en: smoke-and-separation
order: 24
theme: cosmos
title:
  tr: Duman gibi bir başlangıç; bitişikken ayrılan gökler ve yer
  en: A smoke-like origin; heavens and earth joined then split
verses:
  - 41:11
  - 21:30
seeAlso:
  - 41:9-12
  - 79:27-30
summary:
  tr: Âyetler yaratılışı bir süreç olarak anlatır ve hepsi Allah'ın emrine cevap verir.
  en: The verses describe creation as a process, and all of it answers God's command.
verseNotes:
  tr: 41:11'de *duhân* (duman); 21:30'da *ratk* (bitişik) ve *fatk* (ayırmak).
  en: In 41:11, *dukhān* (smoke); in 21:30, *ratq* (joined) and *fatq* (split apart).
tafsir:
  tr: |
    [Scholarly]

    - 21:30 için İbn Abbâs'tan (Taberî ve İbn Kesîr aracılığıyla) bilinen bir okuma gelir: gök yağmur yağdırmıyor, yer bitki bitirmiyordu; sonra Allah göğü yağmurla, yeri bitkilerle "yardı". Başka bir okumaya göre ikisi Allah'ın ayırdığı tek bir kütleydi.
    - 41:11'deki *duhân*, sudan yükselen buhar olarak anlatılır (İbn Mes'ûd ve başkalarından gelen, Taberî'nin aktardığı rivayetler).
    - "İsteyerek" cevabı, bütün yaratılışın Allah'ın emrine itaati olarak okunur.
  en: |-
    [Scholarly]

    - On 21:30, Ibn ʿAbbās (via al-Ṭabarī and Ibn Kathīr) gives a well-known reading: the sky did not rain and the earth did not grow; then God "split" the sky with rain and the earth with plants. Another reading is that they were one mass that God separated.
    - On 41:11, *dukhān* is described as vapor rising from water (reports from Ibn Masʿūd and others, cited by al-Ṭabarī).
    - The "willingly" response is read as all creation obeying God's command.
howItWorks:
  tr: |
    [Established]

    - Erken evrende her şey sıcak ve yoğun bir plazmaydı. Genişleyip soğudukça atomlar oluştu (başlangıçtan yaklaşık 380.000 yıl sonra), ardından yıldızlar ve galaksiler.
    - Güneş Sistemi'miz yaklaşık 4,6 milyar yıl önce çöken bir gaz ve toz bulutundan (güneş bulutsusu) oluştu. Çoğu Güneş oldu; geri kalanı gezegenlerin büyüdüğü bir disk oluşturdu.
    - Dünya'daki hayat sıvı suya bağlıdır. Bilinen her canlı hücrenin büyük kısmı sudur.
  en: |-
    [Established]

    - In the early universe, everything was a hot, dense plasma. As it expanded and cooled, atoms formed (about 380,000 years after the start), then stars and galaxies.
    - Our solar system formed about 4.6 billion years ago from a cloud of gas and dust (a solar nebula) that collapsed. Most of it became the Sun; the rest formed a disk where planets grew.
    - Life on Earth depends on liquid water. Every known living cell is mostly water.
awe:
  tr: |
    - Dünya'daki ve bedenimizdeki atomlar bir zamanlar dağınık bir gaz ve toz bulutunun parçasıydı.
    - Güneş, Güneş Sistemi'nin kütlesinin yaklaşık %99,8'ini taşır; gezegenler artan kırıntılardan oluştu.
  en: |-
    - The atoms in the Earth and in our bodies were once part of a diffuse cloud of gas and dust.
    - The Sun holds about 99.8% of the solar system's mass; the planets formed from the leftover crumbs.
reflection:
  tr: |
    Âyetler yaratılışı bir süreç olarak anlatır: bir olan ayrılır, şekilsiz olan şekil alır ve hepsi Allah'ın emrine cevap verir. Göklerin ve yerin "isteyerek" itaati, reddetme imkânı olan tek varlık olan insana bir örnek olarak sunulur.
  en: "The verses describe creation as a process: what was one is separated, what was formless takes shape, and all of it answers God's command. The \"willing\" obedience of heavens and earth is offered as a model for the human being, who alone can refuse."
honestNotes:
  - tr: |
      - "Kur'an Büyük Patlama'yı anlattı" demek abartıdır. 21:30'un klasik okuması (göğü ve yeri yağmur ve bitkilerle yarmak) oldukça farklıdır ve erken evren duman değil, sıcak bir plazmaydı.
      - Bir gaz ve toz bulutsusuna "duman gibi" demek makul bir modern tefekkürdür [Debated], ama bir tefekkürdür ve öyle etiketlenir.
      - Ayrıca 41:9–12'nin verdiği sıra (önce yer, sonra gökler) müfessirlerin 79:27–30 ile birlikte uzun uzun tartıştığı bir konudur. Bu, gizlenecek bir şey değil, tefsirde eski bir tartışmadır.
    en: |-
      - "The Quran described the Big Bang" overstates. The classical reading of 21:30 (rain and plants splitting sky and earth) is quite different, and the early universe was a hot plasma, not smoke.
      - Calling a gas-and-dust nebula "smoke-like" is a reasonable modern reflection [Debated], but it is a reflection, and is labelled as one.
      - Also note 41:9–12 gives a sequence (earth, then heavens) that commentators discussed at length alongside 79:27–30. It is an old discussion in tafsir, not something to hide.
    important: true
visualizations:
  - id: ideas
    tr: |
      - "Buluttan sisteme" canlandırması: bir gaz bulutu çöker, dönerek bir diske dönüşür, Güneş tutuşur, gezegenler oluşur.
      - 21:30 için yan yana bir kart: İbn Abbâs'ın yağmur ve bitki okuması ile modern "ayrılan tek kütle" tefekkürü.
    en: |-
      - A "from cloud to system" animation: a gas cloud collapses, spins into a disk, the Sun ignites, planets form.
      - A side-by-side card of 21:30: Ibn ʿAbbās's rain-and-plants reading next to the modern "one mass separated" reflection.
