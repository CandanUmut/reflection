legacyHonestNotes:
  - tr: |
      - "Kur'an Büyük Patlama'yı anlattı" demek abartıdır. 21:30'un klasik okuması (göğü ve yeri yağmur ve bitkilerle yarmak) oldukça farklıdır ve erken evren duman değil, sıcak bir plazmaydı.
      - Bir gaz ve toz bulutsusuna "duman gibi" demek makul bir modern tefekkürdür [Debated], ama bir tefekkürdür ve öyle etiketlenir.
      - Ayrıca 41:9–12'nin verdiği sıra (önce yer, sonra gökler) müfessirlerin 79:27–30 ile birlikte uzun uzun tartıştığı bir konudur. Bu, gizlenecek bir şey değil, tefsirde eski bir tartışmadır.
    en: |-
      - "The Quran described the Big Bang" overstates. The classical reading of 21:30 (rain and plants splitting sky and earth) is quite different, and the early universe was a hot plasma, not smoke.
      - Calling a gas-and-dust nebula "smoke-like" is a reasonable modern reflection [Debated], but it is a reflection, and is labelled as one.
      - Also note 41:9–12 gives a sequence (earth, then heavens) that commentators discussed at length alongside 79:27–30. It is an old discussion in tafsir, not something to hide.
    important: true
followUps:
  - q:
      en: Does 21:30 describe the Big Bang?
    a:
      en: The verse speaks of heaven and earth "joined" and "separated". Al-Tabari, the earliest great commentator, read it as a sky without rain and an earth without plants, opened by God; others read it as one mass separated by air. Reading it as the Big Bang is a modern reflection, not a classical meaning.
  - q:
      en: What was the "smoke" in 41:11?
    a:
      en: Ibn Kathir and al-Jalālayn read it as vapour or steam rising as the earth was made. No classical commentator connected it with a cloud of gas and dust.
  - q:
      en: Was the earth created before the heavens?
    a:
      en: 41:9–12 mentions the earth first; 79:27–30 says the earth was spread "after that". Ibn ʿAbbas, as reported by Ibn Kathir, said the earth was created, then the heavens, and then the earth was spread out.
  - q:
      en: What does "willingly or by compulsion" mean?
    a:
      en: God commanded heaven and earth to bring forth what He placed in them, and they answered "We have come willingly" (41:11). Ibn ʿAbbas read "come" as "give" (al-Tabari).
  - q:
      en: How old is the solar system?
    a:
      en: Its first solid grains formed 4.567 billion years ago, measured in meteorites (Connelly et al., 2012).
