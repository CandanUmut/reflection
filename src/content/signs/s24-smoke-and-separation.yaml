legacyHonestNotes:
  - tr: |
      - "Kur'an Büyük Patlama'yı anlattı" demek abartıdır. 21:30'un klasik okuması (göğü ve yeri yağmur ve bitkilerle yarmak) oldukça farklıdır ve erken evren duman değil, sıcak bir plazmaydı.
      - Bir gaz ve toz bulutsusuna "duman gibi" demek makul bir modern tefekkürdür [Debated], ama bir tefekkürdür ve öyle etiketlenir.
      - Ayrıca 41:9–12'nin verdiği sıra (önce yer, sonra gökler) müfessirlerin 79:27–30 ile birlikte uzun uzun tartıştığı bir konudur. Bu, gizlenecek bir şey değil, tefsirde eski bir tartışmadır.
    en: |-
      - "The Quran described the Big Bang" overstates. The classical reading of 21:30 (rain and plants splitting sky and earth) is quite different, and the early universe was a hot plasma, not smoke.
      - Calling a gas-and-dust nebula "smoke-like" is a reasonable modern reflection [Debated], but it is a reflection, and is labelled as one.
      - Also note 41:9–12 gives a sequence (earth, then heavens) that commentators discussed at length alongside 79:27–30. It is an old discussion in tafsir, not something to hide.
    important: true
followUps:
  - q:
      en: What was the "smoke"?
    a:
      en: 'Ibn Kathir: "steam which arose from it when the earth was created"; al-Jalālayn: "rising vapours".'
  - q:
      en: Does 21:30 describe the Big Bang?
    a:
      en: The classical readings do not; it can be read in harmony with modern cosmology, but that is a modern reflection (run 9, Q12).
  - q:
      en: Which came first, earth or heaven?
    a:
      en: "Ibn Kathir reports Ibn ʿAbbas: the earth was created first, and spread out after the heavens."
