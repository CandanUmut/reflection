order: 19
theme: cosmos
title:
  tr: '"İndirilen" demir'
  en: Iron "sent down"
verses:
  - 57:25
seeAlso:
  - 39:6
  - 7:26
summary:
  tr: Tek bir element yıldızları, kanı ve medeniyeti birbirine bağlar. Âyet demirin gücünü adaletin yanına koyar.
  en: One element links stars, blood and civilization. The verse puts iron's power next to justice.
verseNotes:
  tr: Sûre, *el-Hadîd* ("Demir") adını taşır.
  en: The surah is named *al-Ḥadīd*, "Iron".
tafsir:
  tr: |
    [Scholarly]

    - *Enzelnâ* ("indirdik"), Kur'an'ın hayvanlar (39:6) ve elbise (7:26) için de kullandığı fiildir. Bu yüzden klasik âlimler onu çoğu zaman "yarattık ve lütfettik" diye okudu: mutlaka gökten değil, rütbe bakımından yukarıdan gelen bir ikram.
    - Bağlamda demirin "büyük gücü" silah ve savunmayla, "faydaları" ise alet ve zanaatlarla ilgilidir. Âyet demiri Kitap ve Mîzân'ın yanına koyar: adalete hizmet etmesi gereken güç.
  en: "**Power next to justice.** In 57:25, iron comes right after the messengers, the Book and \"the balance\", which Ibn Kathir explains as \"justice, according to Mujahid, Qatadah and others\". On iron's \"great military might\", he explains: God made iron \"a deterrent for those who refuse the truth and oppose it after the proof has been established against them\". Its benefits are everyday tools: \"coins, hammers, axes, saws chisels, shovels and various tools\" for farming, cooking and crafts. *Anzalna* (\"We sent down\") is the same verb used for livestock (39:6) and clothing (7:26), so classical scholars often read it as \"We created and granted\": a gift from above in rank, not necessarily from the sky."
howItWorks:
  tr: |
    [Established]

    - Demir, çekirdeği en sıkı bağlı elementtir. Büyük kütleli yıldızların enerji kazanarak füzyonla üretebileceği en ağır elementtir.
    - Büyük kütleli bir yıldızın çekirdeği demire dönüşünce füzyon artık enerji kazandırmaz; çekirdek çöker ve yıldız bir süpernova olarak patlar. Demirin büyük kısmı önce radyoaktif nikel-56 olarak oluşur; bu da kobalt üzerinden kararlı demir-56'ya bozunur.
    - Doğal demirin yaklaşık %92'si demir-56'dır.
    - Dünya'daki demirin tamamı, Güneş Sistemi oluşmadan önceki yıldızlarda ve süpernovalarda üretildi. Dünya oluşurken onu topladı; çoğu çekirdeğe battı.
    - Demir, kanımızda oksijeni taşıyan molekül olan hemoglobinin merkezindedir.
  en: |-
    [Established]

    - Iron has the most tightly bound nucleus. It is the heaviest element that massive stars can make by fusion while still gaining energy.
    - When a massive star's core turns to iron, fusion stops paying, the core collapses, and the star explodes as a supernova. Much of the iron is first made as radioactive nickel-56, which decays through cobalt into stable iron-56.
    - About 92% of natural iron is iron-56.
    - All of Earth's iron was made in earlier stars and supernovae before the solar system formed. Earth gathered it as it formed; most sank to the core.
    - Iron is at the heart of hemoglobin, the molecule that carries oxygen in our blood.
awe:
  tr: |
    - Kanınızdaki demir, Güneş var olmadan önce ölen yıldızlarda dövüldü.
    - Büyük tek bir süpernova, bir Güneş kütlesinin yalnızca küçük bir kısmı kadar demir üretir; yine de demir, Dünya'nın büyük kısmını oluşturan dört elementten biridir.
    - Demir, yıldız inşasının yıldız ölümüne dönüştüğü bitiş noktasıdır.
  en: |-
    - The iron in your blood was forged in stars that died before the Sun existed.
    - A single large supernova makes only a small fraction of a Sun's mass in iron, yet iron is one of the four elements that make up most of Earth.
    - Iron is the end point where star-building turns into star-death.
reflection:
  tr: |
    Tek bir element yıldızları, kanı ve medeniyeti birbirine bağlar. Âyet demirin gücünü adaletin yanına koyar: güç bize verilmiştir, imtihan onu nasıl kullandığımızdadır.
  en: "One element links stars, blood and civilization. The verse puts iron's power next to justice: strength is given to us, and the test is how we use it."
honestNotes:
  - tr: |
      - Yaygın bir iddiaya göre "Kur'an demirin uzaydan geldiğini bildirdi." İki uyarı:
        1. *Enzelnâ* hayvanlar ve elbise için de kullanılır. Klasik âlimler onu "gökten düştü" diye okumadı; dolayısıyla "uzaydan" okuması modern bir tefekkürdür, âyetin açık anlamı değil.
        2. Demir yıldızlarda üretildi; ama helyumdan ağır her element de öyle: sudaki oksijen, bedenimizdeki karbon, yüzüklerdeki altın. Demir, kozmik kökene sahip olmakta özel değildir.
      - Yıldız içi element sentezi (nükleosentez) gerçekleşmiş bir öngörü değil, tefekkürü zenginleştiren bir hayret konusudur.
    en: |-
      - A popular claim says "the Quran revealed that iron came from space". Two cautions:
        1. *Anzalnā* is also used for livestock and clothing. Classical scholars did not read it as "fell from the sky", so the "from space" reading is a modern reflection, not the verse's clear meaning.
        2. Iron was made in stars, but so was every element heavier than helium: the oxygen in water, the carbon in our bodies, the gold in rings. Iron is not special in having a cosmic origin.
      - Stellar nucleosynthesis is a wonder that enriches the reflection, not a fulfilled prediction.
    important: true
visualizations:
  - id: ideas
    tr: |
      - "Bir demir atomunun yolculuğu": bir yıldız hafif elementleri kaynaştırır, çekirdeği demirle dolar, çöker ve patlar, toz genç bir Dünya'da toplanır ve demir bir alyuvarda ve çelik bir alette son bulur.
      - Zirvesinde demirin olduğu, yıldızların neden orada durduğunu açıklayan bir bağlanma enerjisi eğrisi.
    en: |-
      - "Journey of an iron atom": a star fuses lighter elements, its core fills with iron, it collapses and explodes, the dust gathers into a young Earth, and the iron ends up in a red blood cell and a steel tool.
      - A binding-energy curve with iron at the peak, captioned to explain why stars stop there.
