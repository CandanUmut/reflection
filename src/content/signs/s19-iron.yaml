legacyHonestNotes:
  - tr: |
      - Yaygın bir iddiaya göre "Kur'an demirin uzaydan geldiğini bildirdi." İki uyarı:
        1. *Enzelnâ* hayvanlar ve elbise için de kullanılır. Klasik âlimler onu "gökten düştü" diye okumadı; dolayısıyla "uzaydan" okuması modern bir tefekkürdür, âyetin açık anlamı değil.
        2. Demir yıldızlarda üretildi; ama helyumdan ağır her element de öyle: sudaki oksijen, bedenimizdeki karbon, yüzüklerdeki altın. Demir, kozmik kökene sahip olmakta özel değildir.
      - Yıldız içi element sentezi (nükleosentez) gerçekleşmiş bir öngörü değil, tefekkürü zenginleştiren bir hayret konusudur.
    en: |-
      - A popular claim says "the Quran revealed that iron came from space". Two cautions:
        1. *Anzalnā* is also used for livestock and clothing. Classical scholars did not read it as "fell from the sky", so the "from space" reading is a modern reflection, not the verse's clear meaning.
        2. Iron was made in stars, but so was every element heavier than helium: the oxygen in water, the carbon in our bodies, the gold in rings. Iron is not special in having a cosmic origin.
      - Stellar nucleosynthesis is a wonder that enriches the reflection, not a fulfilled prediction.
    important: true
followUps:
  - q:
      en: Does "sent down" mean iron came from the sky?
    a:
      en: Not in the classical commentaries. Al-Hasan read it as "created", al-Jalālayn and "the people of meanings" as "brought out of the mines", and some reports speak of tools descending with Adam. The same verb is used for the Book in the same verse.
  - q:
      en: Why is iron mentioned next to the Book and the balance?
    a:
      en: Ibn Kathir explains the balance as justice and iron as "a deterrent" for those who oppose the truth after it is made clear. Guidance, the standard of justice and the power to uphold it belong together.
  - q:
      en: Is it true that Earth's iron was made in stars?
    a:
      en: Yes. Iron, like other heavier elements, was made in stars and supernovae; a 2021 study traces isotope anomalies in Earth's mantle to supernova processes (arXiv 2110.06045). That is true of oxygen and carbon too.
  - q:
      en: What are the "benefits for the people"?
    a:
      en: "The commentators name tools: hammers, axes, saws, shovels (Ibn Kathir), knives and needles (al-Qurtubi), and digging the earth (Ibn Zayd, in al-Tabari). Today one would add iron's role in our blood (NIH ODS)."
  - q:
      en: What is the test at the end of the verse?
    a:
      en: '"So that Allah may make evident those who support Him and His messengers unseen" (57:25) — whether people use strength to support justice when no one is watching.'
