summary:
  tr: Tek bir element yıldızları, kanı ve medeniyeti birbirine bağlar. Âyet demirin gücünü adaletin yanına koyar.
  en: '57:25 places iron next to the messengers, the Book and the balance: "We sent down iron, wherein is great military might and benefits for the people".'
verseNotes:
  tr: Sûre, *el-Hadîd* ("Demir") adını taşır.
  en: |-
    "We have already sent Our messengers with clear evidences and sent down with them the Scripture and the balance that the people may maintain [their affairs] in justice. And We sent down iron, wherein is great military might and benefits for the people, and so that Allah may make evident those who support Him and His messengers unseen…" (57:25), Medinan, in Sura al-Ḥadīd ("Iron").

    - **Key words.** *Anzalnā* ("We sent down"): the same verb is used for the Book in this very verse. *Baʾs shadīd*: "great military might". *Manāfiʿ*: "benefits".
    - **The structure.** Messengers, Book, balance, iron: guidance, the standard of justice, and the power to defend it.
tafsir:
  tr: |
    [Scholarly]

    - *Enzelnâ* ("indirdik"), Kur'an'ın hayvanlar (39:6) ve elbise (7:26) için de kullandığı fiildir. Bu yüzden klasik âlimler onu çoğu zaman "yarattık ve lütfettik" diye okudu: mutlaka gökten değil, rütbe bakımından yukarıdan gelen bir ikram.
    - Bağlamda demirin "büyük gücü" silah ve savunmayla, "faydaları" ise alet ve zanaatlarla ilgilidir. Âyet demiri Kitap ve Mîzân'ın yanına koyar: adalete hizmet etmesi gereken güç.
  en: |-
    **Ibn Kathir.** The balance is "justice, according to Mujahid, Qatadah and others". Iron is "a deterrent for those who refuse the truth and oppose it after the proof has been established against them". Its benefits include "coins, hammers, axes, saws chisels, shovels and various tools". He does not comment on the word "sent down".

    **Al-Jalālayn.** On "We sent down iron": "We caused it to be extracted from mineral ores."

    **Where they differ.** Al-Jalālayn explains "sent down" as God's making iron available from ores; Ibn Kathir passes over the word and focuses on iron's role beside justice. Neither says iron came from the sky.
howItWorks:
  tr: |
    [Established]

    - Demir, çekirdeği en sıkı bağlı elementtir. Büyük kütleli yıldızların enerji kazanarak füzyonla üretebileceği en ağır elementtir.
    - Büyük kütleli bir yıldızın çekirdeği demire dönüşünce füzyon artık enerji kazandırmaz; çekirdek çöker ve yıldız bir süpernova olarak patlar. Demirin büyük kısmı önce radyoaktif nikel-56 olarak oluşur; bu da kobalt üzerinden kararlı demir-56'ya bozunur.
    - Doğal demirin yaklaşık %92'si demir-56'dır.
    - Dünya'daki demirin tamamı, Güneş Sistemi oluşmadan önceki yıldızlarda ve süpernovalarda üretildi. Dünya oluşurken onu topladı; çoğu çekirdeğe battı.
    - Demir, kanımızda oksijeni taşıyan molekül olan hemoglobinin merkezindedir.
  en: |-
    - **Where iron is made.** [Established] Iron-56, "comprising about 91.754% of the iron on Earth", forms in massive stars: "Among the heavier elements formed is 56Ni, which subsequently decays to 56Co and then 56Fe" (*Wikipedia*). Because iron's nucleus is so tightly bound, "further nuclear reactions become energetically unfavorable" — fusion beyond iron absorbs energy rather than releasing it.
    - **Not only iron.** [Established] Every element heavier than hydrogen and helium, including the oxygen in water and the carbon in our bodies, was made in stars. (Standard astrophysics; no named source was read.)
    - **Iron in us.** [Established] Iron is at the centre of haemoglobin, which carries oxygen in our blood. (No named source was read.)
awe:
  tr: |
    - Kanınızdaki demir, Güneş var olmadan önce ölen yıldızlarda dövüldü.
    - Büyük tek bir süpernova, bir Güneş kütlesinin yalnızca küçük bir kısmı kadar demir üretir; yine de demir, Dünya'nın büyük kısmını oluşturan dört elementten biridir.
    - Demir, yıldız inşasının yıldız ölümüne dönüştüğü bitiş noktasıdır.
  en: |-
    - Most of Earth's iron is iron-56, made in massive stars from nickel-56 decaying through cobalt (*Wikipedia*).
    - Iron is the point where fusion in a star stops releasing energy (*Wikipedia*).
reflection:
  tr: |
    Tek bir element yıldızları, kanı ve medeniyeti birbirine bağlar. Âyet demirin gücünü adaletin yanına koyar: güç bize verilmiştir, imtihan onu nasıl kullandığımızdadır.
  en: |-
    The verse sets iron in surprising company. First come the messengers; then the Book; then "the balance", which Ibn Kathir explains as justice. And then: "We sent down iron, wherein is great military might and benefits for the people" (57:25).

    Iron is power. It makes ploughs and swords, nails and chains. The verse does not pretend that power is harmless; it calls it "great military might". But it places that power after the balance. Strength is meant to serve justice, not to replace it. Ibn Kathir calls iron "a deterrent" against those who oppose the truth after it has been made clear — and he also lists hammers, axes and saws: tools for ordinary work.

    The word "sent down" is the same word the verse uses for the Book. Al-Jalālayn says God "caused it to be extracted from mineral ores". Whatever the physical path, the verse treats iron as a gift, given with a purpose and a test: "so that Allah may make evident those who support Him and His messengers unseen".

    The question the verse leaves with us is about our own strength, whatever form it takes: is it serving the balance, or have we put it in the balance's place?
honestNotes:
  - en: '**The popular claim.** A popular article notes that "much of the iron found on Earth was not originally formed here" and that the wording "has prompted many readers to reflect on the correspondence" with modern astronomy, while saying the Quran "is not presenting a scientific explanation" (al-islaah.org, 2026). Stronger versions elsewhere say the Quran "revealed that iron came from space"; no named source for that stronger claim was read.'
  - en: '**Weighing it.** *Anzalnā* is used in the same verse for the Book; al-Jalālayn reads it as extraction from ores; Ibn Kathir does not read it as "from the sky". And iron is not special in having a cosmic origin: so do oxygen and carbon. Stellar nucleosynthesis enriches the reflection; it is not a fulfilled prediction.'
visualizations:
