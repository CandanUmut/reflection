    tr: |
      - "Bir demir atomunun yolculuğu": bir yıldız hafif elementleri kaynaştırır, çekirdeği demirle dolar, çöker ve patlar, toz genç bir Dünya'da toplanır ve demir bir alyuvarda ve çelik bir alette son bulur.
      - Zirvesinde demirin olduğu, yıldızların neden orada durduğunu açıklayan bir bağlanma enerjisi eğrisi.
    en: |-
      - "Journey of an iron atom": a star fuses lighter elements, its core fills with iron, it collapses and explodes, the dust gathers into a young Earth, and the iron ends up in a red blood cell and a steel tool.
      - A binding-energy curve with iron at the peak, captioned to explain why stars stop there.
