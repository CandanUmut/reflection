legacyHonestNotes:
  - tr: |
      - Yaygın bir iddiaya göre "Kur'an demirin uzaydan geldiğini bildirdi." İki uyarı:
        1. *Enzelnâ* hayvanlar ve elbise için de kullanılır. Klasik âlimler onu "gökten düştü" diye okumadı; dolayısıyla "uzaydan" okuması modern bir tefekkürdür, âyetin açık anlamı değil.
        2. Demir yıldızlarda üretildi; ama helyumdan ağır her element de öyle: sudaki oksijen, bedenimizdeki karbon, yüzüklerdeki altın. Demir, kozmik kökene sahip olmakta özel değildir.
      - Yıldız içi element sentezi (nükleosentez) gerçekleşmiş bir öngörü değil, tefekkürü zenginleştiren bir hayret konusudur.
    en: |-
      - A popular claim says "the Quran revealed that iron came from space". Two cautions:
        1. *Anzalnā* is also used for livestock and clothing. Classical scholars did not read it as "fell from the sky", so the "from space" reading is a modern reflection, not the verse's clear meaning.
        2. Iron was made in stars, but so was every element heavier than helium: the oxygen in water, the carbon in our bodies, the gold in rings. Iron is not special in having a cosmic origin.
      - Stellar nucleosynthesis is a wonder that enriches the reflection, not a fulfilled prediction.
    important: true
followUps:
  - q:
      en: Does "sent down" mean iron fell from the sky?
    a:
      en: 'Not in the commentaries read. Al-Jalālayn: God "caused it to be extracted from mineral ores". The same verb is used for the Book.'
  - q:
      en: Why is iron mentioned next to justice?
    a:
      en: Because, as Ibn Kathir reads it, iron is power to defend justice — "a deterrent" — as well as the material of everyday tools.
  - q:
      en: Is it true that Earth's iron was made in stars?
    a:
      en: "Yes: iron-56 forms in massive stars (*Wikipedia*). So do most other elements heavier than helium."
