followUps:
  - q:
      en: Does "sent down" mean iron came from meteorites or stars?
    a:
      en: Classical scholars read the verb as "created and granted", as with livestock and clothing. The modern astrophysics of iron is in "How it works", and the honest notes explain why the verse is not a prediction of it.
  - q:
      en: Why is iron in a verse about justice?
    a:
      en: "Ibn Kathir reads it as strength that should serve the balance: power to defend justice, and tools for daily life."
