fullAnswer:
  - kind: heart
    tr: |
      **Yas tutuyorsan.** Gözyaşı imanın eksikliği değildir. Küçük oğlu İbrahim can verirken Hz. Peygamber ağladı ve şöyle dedi: "Göz yaş döker, kalp hüzünlenir; ama Rabbimizin razı olacağından başka bir şey söylemeyiz. Ey İbrahim! Senin ayrılığınla gerçekten hüzünlüyüz" {hadith:bukhari:1303}. Peygamberler gibi kederini Allah'a ham sözlerle götürebilirsin: Yâkub, "Ben hüznümü, kederimi ancak Allah'a şikayet ederim" dedi (12:86); Eyyûb, "Başıma bir bela geldi, (sana sığındım), sen merhametlilerin en merhametlisisin" diye seslendi (21:83). "Biz Allah'a aidiz ve sonunda O'na döneceğiz" (2:156) cümlesi iyi hissetmeni şart koşmaz; üzerinde durabileceğin bir zemindir.

      **"Bu bir ceza mı?"** Bunu belirli bir kişi hakkında kimse bilemez. Kendisine en ağır imtihana kimin uğradığı sorulunca Hz. Peygamber şöyle dedi: "Peygamberler, sonra onlara en yakın olanlar, sonra onlara en yakın olanlar" {hadith:tirmidhi:2398}. Acıyı bir hüküm olarak değil, günahları silen bir şey olarak anlattı (aşağıya bakınız). Araştırmalar da aynı yönü gösteriyor: acısını merhametli bir imtihan olarak okuyan ve dinî destek arayan insanlar daha iyi baş etme eğiliminde, Allah'ın kendisini cezalandırdığını hissedenler ise daha kötü (Pargament, Koenig ve Perez, 2000); 49 çalışmada bu örüntü genel olarak doğrulandı (Ano ve Vasconcelles, 2005). Bu çalışmalar bir sebep değil bir ilişki gösterir — ve insanların baş etmesine yardım eden bir şey, tek başına bir inancın doğru olduğunun kanıtı değildir.

      **Biri sana zarar verdiyse.** Bir insanın sebep olduğu acı o insanın yanlışıdır; Allah'ın senin hakkındaki hükmü değildir. "Ey Peygamber! Sakın zalimlerin yaptıklarından Allah'ın gâfil olduğunu sanma! Ancak Allah, onların cezalarını, gözlerin dışa fırlayacağı güne erteler" (14:42). Önce senin güvenliğin gelir; bu sayfadaki destek yardımcı olabilir.

      **Acıyı hafifletmek cevabın parçasıdır.** "Merhamet edenlere Rahmân merhamet eder. Yeryüzündekilere merhamet edin ki gökte olan da size merhamet etsin" {hadith:tirmidhi:1924}. Birinin yanında oturmak, yemek götürmek, tedavi masrafını karşılamak ve cenazeden sonra da yanında kalmak küçük şeyler değildir.
    en: |-
      **If you are grieving.** Tears are not a failure of faith. When his infant son Ibrahim was dying, the Prophet wept and said: "The eyes are shedding tears and the heart is grieved, and we will not say except what pleases our Lord. O Ibrahim! Indeed we are grieved by your separation" {hadith:bukhari:1303}. You may bring your grief to God in raw words, as the prophets did: Jacob said, "I only complain of my suffering and my grief to Allah" (12:86); Job called out, "Indeed, adversity has touched me, and you are the Most Merciful of the merciful" (21:83). The sentence "Indeed we belong to Allah, and indeed to Him we will return" (2:156) is not a demand to feel fine; it is a place to stand.

      **"Is this a punishment?"** No one can know that about a particular person. Asked who is tried most severely, the Prophet said: "The Prophets, then those nearest to them, then those nearest to them" {hadith:tirmidhi:2398}. He spoke of pain as something that wipes sins away, not as a verdict (see below). Research points the same way: people who read their suffering as a merciful trial and seek religious support tend to cope better, and those who feel that God is punishing them tend to cope worse (Pargament, Koenig and Perez, 2000); across 49 studies, the pattern generally held (Ano and Vasconcelles, 2005). These studies show a link, not a cause — and what helps people cope is not, by itself, evidence that a belief is true.

      **If someone hurt you.** Suffering that a person causes is that person's wrong, not God's judgement on you. "Never think that Allah is unaware of what the wrongdoers do. He only delays them for a Day when eyes will stare [in horror]" (14:42). Your safety comes first, and the support on this page can help.

      **Relieving suffering is part of the answer.** "The merciful are shown mercy by the Most Merciful. Be merciful on the earth, and you will be shown mercy from the One above the heavens" {hadith:tirmidhi:1924}. Sitting with someone, bringing food, paying for treatment and staying after the funeral are not small things.
  - kind: quran
    tr: |
      **Hayat, zorlukta da bollukta da bir imtihandır.** Allah "hanginizin daha güzel iş yapacağınızı denemek için ölümü ve hayatı yarattı" (67:2). "Sizi bir imtihan olarak kötülük ve iyilikle deneyeceğiz. Hepiniz de sonunda bize döndürüleceksiniz" (21:35). İbn Kesîr ikinci âyeti şöyle açıklar: Allah insanları "bazen zorluklarla, bazen kolaylıkla" dener; kimin şükredip kimin nankörlük edeceğini, kimin sabredip kimin ümitsizliğe düşeceğini görmek için. İmtihan yalnızca acı değildir: servet ve rahatlık da bir imtihandır.

      **Kayıp beklenen bir şeydir ve bir cümleyle karşılanır.** "Çaresiz biz sizi biraz korku, biraz açlık, biraz da mallardan, canlardan ve ürünlerden eksiltme ile imtihan edeceğiz. Müjdele o sabredenleri! Onlar başlarına bir musibet geldiği zaman: 'Biz Allah'a aidiz ve sonunda O'na döneceğiz.' derler" (2:155–156). Allah onlara "Rablerinden, mağfiretler ve rahmet" vaat eder (2:157). "Allah hiç kimseye gücünün yeteceğinden başka yük yüklemez" (2:286) ve "zorlukla beraber bir kolaylık vardır" — iki kez söylenir (94:5–6).

      **Bazı sebepler gizlidir.** Kehf sûresinde (18:65–82) bir peygamber olan Mûsâ, Hızır ile yolculuk eder; Kur'an onu "kullarımızdan bir kul" diye anlatır, "biz ona katımızdan bir rahmet vermiş ve tarafımızdan bir ilim öğretmiştik" (18:65). Hızır bir gemiyi kusurlu kılar, bir çocuğu öldürür ve kendilerine yemek vermeyen bir şehirde bir duvarı onarır. Mûsâ her seferinde itiraz eder. Sonra sebepler gösterilir. Gemi yoksullara aitti ve ilerilerinde "her sağlam gemiye zorla el koyan bir hükümdar vardı" (18:79); kusur gemiyi kurtardı. Duvarın altında iki yetimin hazinesi vardı (18:82). Hızır şöyle bitirir: "Ve ben bunların hiçbirini kendiliğimden yapmadım" (18:82).

      **En zor kısım: çocuk.** Hızır şöyle der: "Oğlana gelince, onun anababası mümin kimselerdi. Çocuğun onları azgınlık ve inkâra sürüklemesinden korktuk. İstedik ki Rabbleri onun yerine kendilerine ondan temizlikçe daha hayırlı ve daha çok merhamet eden birini versin" (18:80–81). Hz. Peygamber o çocuğun "yaratılışı gereği kâfir olduğunu ve yaşasaydı anne babasını azgınlığa ve inkâra sürükleyeceğini" söyledi {hadith:muslim:2662}. İbn Kesîr'in aktardığı erken dönem müfessiri Katâde, anne babanın "o doğduğunda sevindiğini, öldürüldüğünde ise üzüldüğünü" söyler. Bu, kıssanın okunması en zor kısmıdır ve gizlenmemelidir. İki şey onun kötüye kullanılmasını önler. Kimseye izin vermez: Kur'an "haklı bir sebep olmadıkça, Allah'ın öldürülmesini haram kıldığı canı öldürmeyin" der (17:33) ve Hızır kendi başına değil, Allah'ın emriyle hareket etti. Dersi ise hiçbir insanın sahip olmadığı bir bilgiyle, bir hayatın neye dönüşeceğinin bilgisiyle ilgilidir. Olayların ortasında duran Mûsâ sebeplerini göremedi; kıssanın anlattığı budur. Bir çocuğunu kaybettiysen, bu kıssa senin çocuğunu anlatmaz: Allah'ın emriyle yapılmış, hiçbir insanın tekrarlayamayacağı ya da hükmedemeyeceği tek bir olayı anlatır.

      **Zor âyet: "kendi ellerinizle kazandıklarınız yüzünden".** "Başınıza gelen herhangi bir musibet kendi ellerinizle kazandıklarınız yüzündendir. Bununla beraber Allah yine de çoğunu affeder" (42:30). İbn Kesîr âyeti açıkça okur: musibetler günahlar yüzündendir ve Allah çoğunu affeder. Kurtubî, âlimlerin çoğuna göre âyetin müminlerle ilgili olduğunu, kâfirin cezasının ise âhirete ertelendiğini; azınlığın âyeti kâfirlere hitap olarak okuduğunu aktarır. Çocuklar hakkında iki görüş kaydeder. Kimine göre âyet yetişkinler için ceza demektir, çocuklar içinse acı bir mükâfattır (*mesûbe*). Kimine göre yetişkinler için kendi başlarına gelen bir cezadır, bir çocuğun acısı ise anne babası için bir cezadır. Bunlar âlimlerin genel bir âyete dair okumalarıdır; hiçbir anne baba ya da çocuk hakkında bir hüküm değildir: yukarıda dendiği gibi, bunu belirli bir kişi hakkında kimse bilemez. Kurtubî ayrıca erken dönemden şu sözü aktarır: "Eziyet saatleri, günah saatlerini götürür" (Sâbit el-Bünânî). Âyet acıdan genel olarak söz eder; kimseye, acı çeken belirli bir kişiyi yargılama hakkı vermez, çünkü Hz. Peygamber en ağır imtihana uğrayanların peygamberler olduğunu söyledi.

      **Hayvanlar unutulmaz.** "Yeryüzünde yürüyen hiçbir hayvan ve iki kanadıyla uçan hiçbir kuş yoktur ki, sizin gibi birer ümmet olmasınlar… sonra hepsi Rablerinin huzurunda toplanırlar" (6:38).
    en: |-
      **Life is a test, in hardship and in ease.** God "created death and life to test you [as to] which of you is best in deed" (67:2). "We test you with evil and with good as trial; and to Us you will be returned" (21:35). Ibn Kathir explains the second verse: God tests people "sometimes with difficulties and sometimes with ease, to see who will give thanks and who will be ungrateful, who will have patience and who will despair." The test is not only pain: wealth and comfort are a test too.

      **Loss is expected, and it is met with a sentence.** "And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient, who, when disaster strikes them, say, 'Indeed we belong to Allah, and indeed to Him we will return.'" (2:155–156). God promises them "blessings from their Lord and mercy" (2:157). "Allah does not charge a soul except [with that within] its capacity" (2:286), and "indeed, with hardship [will be] ease" — said twice (94:5–6).

      **Some reasons are hidden.** In Sura al-Kahf (18:65–82), Moses — a prophet — travels with al-Khidr, "a servant from among Our servants to whom we had given mercy from us and had taught him from Us a [certain] knowledge" (18:65). Al-Khidr damages a boat, kills a boy and repairs a wall in a town that refused them food. Moses protests each time. Then the reasons are shown. The boat belonged to poor people, and a king ahead "seized every [good] ship by force" (18:79); the damage saved it. The wall hid a treasure belonging to two orphans (18:82). Al-Khidr ends: "I did it not of my own accord" (18:82).

      **The hardest part: the boy.** Al-Khidr says: "As for the boy, his parents were believers, and we feared that he would overburden them by transgression and disbelief. So we intended that their Lord should substitute for them one better than him in purity and nearer to mercy" (18:80–81). The Prophet said the boy "was a non-believer by his very nature and had he survived he would have involved his parents in defiance and unbelief" {hadith:muslim:2662}. The early commentator Qatada, quoted by Ibn Kathir, said the parents "rejoiced when he was born and grieved for him when he was killed". This is the hardest part of the story to read, and it should not be hidden. Two things keep it from being misused. It gives no one else permission: the Quran forbids killing any soul "except by right" (17:33), and al-Khidr acted by God's command, not his own. And its lesson is about knowledge no human has — what a life will become. Moses, standing in the middle of the events, could not see their reasons; that is the story's point. If you have lost a child, this story is not about your child: it tells of one event, done by God's command, that no human can repeat or judge.

      **The hard verse: "for what your hands have earned".** "And whatever strikes you of disaster — it is for what your hands have earned; but He pardons much" (42:30). Ibn Kathir reads it plainly: disasters come because of sins, and God forgives much. Al-Qurtubi reports that, for most scholars, the verse concerns believers, while the disbeliever's punishment is deferred to the hereafter; a minority read it as addressed to the disbelievers. On children, he records two views. Some said the verse means punishment for adults, while for children suffering is a reward (*mathuba*). Others said it is a punishment for adults in themselves, while a child's suffering is a punishment for the child's parents. These are scholars' readings of a general verse, not a judgement on any parent or child: as above, no one can know that about a particular person. He also quotes an early saying, "hours of pain take away hours of sins" (Thabit al-Bunani). The verse speaks of suffering in general; it does not let anyone judge a particular sufferer, since the Prophet said the people tried most severely are the prophets.

      **Animals are not forgotten.** "There is no creature on [or within] the earth or bird that flies with its wings except [that they are] communities like you… Then unto their Lord they will be gathered" (6:38).
  - kind: sunnah
    tr: |
      Aşağıdaki her hadis, adı geçen hadis âlimlerinin verdiği dereceyi gösterir: *sahih* ve *hasen* delil olarak kabul edilir; zayıf bir rivayet bu sitede asla delil olarak kullanılmaz.

      **İmtihan, Allah'ın hoşnutsuzluğunun işareti değildir.** "Allah kime hayır dilerse, onu musibetlerle dener" {hadith:bukhari:5645}. Bu söz, zorluğun Allah'ın yüz çevirdiği anlamına geldiğinden korkan birine söylenir; acıyı kendi başına iyi kılmaz.

      **Acı boşa gitmez.** "Müslümanın başına gelen hiçbir yorgunluk, hastalık, keder, hüzün, eziyet ve sıkıntı yoktur ki — kendisine batan bir diken bile — Allah onunla günahlarından bir kısmını silmesin" {hadith:bukhari:5641}. "Müminin işi ne şaşılacak iştir; her işi onun için hayırdır": bollukta şükreder, darlıkta sabreder ve ikisi de onun için hayırdır {hadith:muslim:2999}.

      **Allah'ın rahmeti bir anneninkinden büyüktür.** Esirler arasında kaybettiği bebeğini bulup bağrına basan bir kadını gören Hz. Peygamber, bu kadının çocuğunu ateşe atıp atmayacağını sordu ve şöyle dedi: "Allah kullarına, bu kadının çocuğuna olduğundan daha merhametlidir" {hadith:bukhari:5999}. Allah rahmeti yüz parça yaptı; bir parçasını yeryüzüne indirdi — bir hayvanın yavrusuna basmamak için ayağını kaldırması o parçadandır — doksan dokuzunu ise kıyamet günü için sakladı {hadith:muslim:2752}.

      **Adalet hayvanlara bile ulaşır.** "Kıyamet günü haklar mutlaka sahiplerine verilecektir; boynuzsuz koyunun boynuzlu koyundan hakkı bile alınacaktır" {hadith:muslim:2582}.

      **Öteki hayatın ölçüsü.** Cennet ehlinden olup dünyada en sıkıntılı hayatı yaşamış kişi, cennete bir kez daldırılır ve kendisine hiç sıkıntı görüp görmediği sorulur. "Hayır, Allah'a yemin olsun ki ey Rabbim, hiç sıkıntı görmedim, hiç darlık çekmedim" der {hadith:muslim:2807}.

      **Kötülük Allah'a nispet edilmez.** Hz. Peygamber namazın başındaki duasında şöyle derdi: "Hayrın hepsi Senin elindedir, şer ise Sana değildir" (*ve'ş-şerru leyse ileyk*) {hadith:muslim:771}. Bir İngilizce çeviri bu sözü "kötülükle Sana yaklaşılmaz" diye anlar; âlimler onu birden fazla şekilde açıkladı.
    en: |-
      Each hadith below shows its grade from the hadith scholars named: *ṣaḥīḥ* (sound) and *ḥasan* (good) are accepted as evidence; a weak (*ḍaʿīf*) report is never used as evidence on this site.

      **Trial is not a sign of God's displeasure.** "If Allah wants to do good to somebody, He afflicts him with trials" {hadith:bukhari:5645}. This is said to someone afraid that hardship means God has turned away; it does not make pain good in itself.

      **Pain is not wasted.** "No fatigue, nor disease, nor sorrow, nor sadness, nor hurt, nor distress befalls a Muslim, even if it were the prick he receives from a thorn, but that Allah expiates some of his sins for that" {hadith:bukhari:5641}. "Strange are the ways of a believer, for there is good in every affair of his": in ease he gives thanks, in hardship he is patient, and both are good for him {hadith:muslim:2999}.

      **God's mercy is greater than a mother's.** Seeing a captive woman who had found her lost baby and pressed it to her breast, the Prophet asked whether she would throw her child into a fire, and said: "Allah is more merciful to His slaves than this lady to her son" {hadith:bukhari:5999}. God made mercy in a hundred parts, sent one into the world — from it, an animal lifts its hoof from its young — and kept ninety-nine for the Day of Resurrection {hadith:muslim:2752}.

      **Justice reaches even animals.** "Rights will certainly be restored to those entitled to them on the Day of Resurrection, even the hornless sheep will lay claim upon the horned one" {hadith:muslim:2582}.

      **The scale of the next life.** The person who had the most miserable life in the world, of the people of Paradise, is dipped once in Paradise and asked whether he ever faced hardship. He says: "By Allah, no, my Lord, never did I face any hardship or experience any distress" {hadith:muslim:2807}.

      **Evil is not attributed to God.** In the opening supplication of his prayer, the Prophet said: "All good is in Your hands, and evil is not to You" (*wa-l-sharru laysa ilayk*) {hadith:muslim:771}. One English translation renders the words "one cannot get nearest to You through evil"; scholars explained them in more than one way.
  - kind: scholars
    tr: |
      **Burada kimler aktarılıyor.** İslam düşüncesi tarihçisi Eric Ormsby bu tartışmanın temel incelemesini yazdı (*Theodicy in Islamic Thought*, Princeton, 1984). Aşağıdakilerin çoğu onun anlatımından ve âlimlerin kendi sözlerindendir.

      **Kelam mezhepleri Allah'ın sebepleri konusunda ayrıştı.** İslam'ın kelam mezhepleri farklı cevaplar verdi: erken dönem bir mezhep olan **Mutezile** ile iki büyük Sünnî kelam mezhebi **Eş'arîlik** ve **Mâtürîdîlik**. Mutezile, Allah'ın kulları için en iyi olanı yapmakla yükümlü olduğunu savundu (*el-aslah*, "en uygun olan"); Sünnî kelamcıların çoğu Allah'a herhangi bir yükümlülük yüklenmesini reddetti. Pek çok Eş'arî, Ormsby'nin deyişiyle Allah'ın "egemen hesap vermezliğine" bağlı kaldı: Allah bize sebep borçlu değildir, O'nun fiilleri bizim denetleyebileceğimiz sebeplerle açıklanmaz ve onları akılla gerekçelendirme girişimleri şüpheyle karşılandı. Mâtürîdî mezhebinin kurucusu **Mâtürîdî** (ö. 944) Allah'ın hikmetini her şeyi yerli yerine koymak diye tanımladı. Gazzâlî'den iki yüzyıl sonra Hanbelî âlim **İbn Teymiyye** (ö. 1328), Eş'arîleri "hikmetsiz irade, merhametsiz, sevgisiz ve rızasız dileme" kabul etmekle eleştirdi.

      **Gazzâlî (ö. 1111): Daha mükemmeli mümkün değil.** Gazzâlî *İhyâ*'da, tevekkül bahsinde, Allah'ın taksim ettiği her şeyin — "rızık, ömür, lezzet ve elem" — "zulümden hiçbir şey taşımayan saf adalet" olduğunu ve "mümkünler arasında bundan daha güzel, daha mükemmel ve daha tam bir şey bulunmadığını" yazdı. Gerekçeleri kısmen karşıtlıkla ilgilidir — "Gece olmasaydı gündüzün değeri bilinmezdi. Hastalık olmasaydı sağlıklı olan sağlığın tadını bilmezdi" — kısmen de bedelle: bir hayatı kurtarmak için kangren olmuş bir eli kesmek zulüm değil adalettir. Konuyu "geniş ve derin bir deniz" diye anar; "nice beceriksiz topluluk" onda boğulur. Ormsby, bu pasajın bir ispat değil, tevekküle bir teşvik olduğunu belirtir: 18. yüzyıl şârihi Zebîdî, amacın insanın "başına gelen bir kötülük yüzünden ümitsizliğe düşmemesi" olduğunu açıklar. Cümle yüzyıllarca şiddetle tartışıldı, çünkü eleştirmenler onun Allah'ın kudretini sınırladığını düşündü.

      **İbnü'l-Kayyim (ö. 1350): Kötülük bazı yaratılmışlardadır, Allah'ın fiilinde değil.** İbnü'l-Kayyim *Şifâü'l-Alîl*'de (21. bab), Hz. Peygamber'in "şer Sana değildir" sözünü şerh eder. Allah'ın "hayrın da şerrin de yaratıcısı olduğunu; şerrin O'nun yarattığı bazı şeylerde olduğunu, O'nun yaratmasında ve fiilinde olmadığını; O'nun yaratmasının, fiilinin, kazasının ve kaderinin tamamen hayır olduğunu" yazar. Zulmün "bir şeyi ait olmadığı yere koymak" olduğunu açıklar; Allah bunu asla yapmaz; dolayısıyla O'nun koyduğu her şey yerli yerindedir ve O'na nispetle şer değildir.
    en: |-
      **Who is quoted here.** The historian of Islamic thought Eric Ormsby wrote the main study of this debate (*Theodicy in Islamic Thought*, Princeton, 1984). Much of what follows is from his account and from the scholars' own words.

      **The schools of theology disagreed about God's reasons.** Islam's schools of theology (*kalam*) gave different answers: the **Mu'tazila**, an early school, and the **Ash'aris** and **Maturidis**, the two main Sunni schools. The Mu'tazila held that God is obliged to do what is best for His creatures (*al-aslah*, "the optimum"); most Sunni theologians rejected any obligation on God. Many Ash'aris held to what Ormsby calls God's "sovereign unaccountability": God does not owe us reasons, His acts are not to be explained by reasons we can check, and attempts to rationalise them were suspect. **Al-Maturidi** (d. 944), founder of the Maturidi school, defined God's wisdom as putting each thing in its proper place. Two centuries after al-Ghazali, the Hanbali scholar **Ibn Taymiyya** (d. 1328) criticised the Ash'aris for affirming "will without wisdom, and volition without mercy, love, and approval".

      **Al-Ghazali (d. 1111): nothing more perfect is possible.** In the *Ihya'*, in the book on trust in God, al-Ghazali wrote that everything God apportions — "sustenance, life-span, pleasure and pain" — is "sheer justice, with no injustice in it", and that "there is not in possibility anything whatever more excellent, more perfect, and more complete than it". His reasons are partly about contrast — "For were it not for night, the value of day would be unknown. Were it not for illness, the healthy would not enjoy health" — and partly about cost: amputating a gangrenous hand to save a life is justice, not cruelty. He ends by calling the matter "a vast and deep sea" in which "whole groups of the inept drown". Ormsby notes that the passage is an exhortation to trust in God, not a proof: an 18th-century commentator, al-Zabidi, explained that its purpose is that a person "may not despair over an evil which befalls him". The sentence was fiercely disputed for centuries, because critics thought it limited God's power.

      **Ibn al-Qayyim (d. 1350): evil is in some created things, not in God's act.** Ibn al-Qayyim comments in *Shifa' al-'Alil* (ch. 21) on the Prophet's words "evil is not to You". He writes that God "is the Creator of good and evil; the evil lies in some of the things He created, not in His creating or His act. His creating, His act, His decree and His measuring-out are all good." Injustice, he explains, is "putting a thing where it does not belong"; God never does that, so whatever He places is in its right place, and in relation to Him it is not evil.
  - kind: reasoning
    title:
      tr: Filozoflar bu konuyu nasıl tartışır
      en: How philosophers argue about it
    tr: |
      **Problemin iki hâli.** *Mantıksal* hâl (J. L. Mackie, 1955), Allah ile kötülüğün mantıken bağdaşmadığını iddia eder. Alvin Plantinga'nın çalışmaları bu hâle odaklandı. Cevap yollarından biri özgür irade yaklaşımıdır: iyi bir Allah'ın kötülüğe izin vermek için bir sebebi olabiliyorsa — örneğin varlıklara kötüye kullanabilecekleri gerçek bir özgürlük vermek — Allah ile kötülük çelişmez. *Delile dayalı* hâl (William Rowe, 1979'dan itibaren) daha mütevazı bir şey söyler: yangındaki yavru geyik gibi bazı gerçek kötülükler Allah'ın varlığını olasılık dışı kılar.

      **Başlıca cevaplar.** Stanford Felsefe Ansiklopedisi'nin kötülük problemi maddesini yazan filozof Michael Tooley dört tür "teodise" (Allah'ın kötülüğe neden izin verdiğine dair açıklama) sayar: zorluk içinde karakterin olgunlaşması (John Hick'in "ruhun olgunlaşması"); genel olarak özgür irade; özel olarak başkalarına gerçek zarar verme özgürlüğü; ve eylemi mümkün kılan ama zaman zaman zarar veren istikrarlı tabiat kanunlarıyla işleyen bir dünya. Kur'an'ın hayatı bir imtihan olarak anlatması (67:2; 21:35) bunların ilkine yakındır.

      **İnananlar bile sebeplerin kısmi olduğunu söyler.** Richard Swinburne gibi bazı filozoflar eksiksiz bir teodisenin verilebileceğini düşünür. Başkaları çok daha az umutludur — Plantinga da dâhil; o, "Allah'ın kötülüğe neden izin verdiğini açıklama girişimlerinin çoğu bana cılız, sığ ve nihayetinde hafif geliyor" diye yazdı (1985). Bu, İslam'ın sınırlara yaptığı vurguyla örtüşür: Mûsâ Hızır'ın sebeplerini göremedi; Gazzâlî meseleye derin bir deniz dedi.
    en: |-
      **Two versions of the problem.** The *logical* version (J. L. Mackie, 1955) claims that God and evil are logically incompatible. Alvin Plantinga's work focused on this version. One line of reply is the free-will approach: if a good God could have a reason to permit evil — such as giving creatures real freedom, which they can misuse — then God and evil are not contradictory. The *evidential* version (William Rowe, from 1979) claims something more modest: that some actual evils, like the fawn in the fire, make God unlikely.

      **The main replies.** Michael Tooley, a philosopher who wrote the Stanford Encyclopedia of Philosophy's entry on the problem of evil, lists four kinds of "theodicy" (explanations of why God permits evil): growing in character through hardship (John Hick's "soul-making"); free will in general; in particular, the freedom to do real harm to others; and a world run by stable natural laws, which make action possible but sometimes harm. The Quran's picture of life as a test (67:2; 21:35) is close to the first.

      **Even believers say the reasons are partial.** Some philosophers, such as Richard Swinburne, think a full theodicy can be given. Others are far less hopeful — including Plantinga, who wrote that "most attempts to explain why God permits evil… strike me as tepid, shallow and ultimately frivolous" (1985). This matches the Islamic emphasis on limits: Moses could not see al-Khidr's reasons; al-Ghazali called the question a deep sea.
  - kind: objection
    title:
      tr: En güçlü itirazlar ve cevapları
      en: The strongest objections, and the replies
    tr: |
      **"Bir cinayeti önleyebilecek iyi bir insan önlerdi."** Tooley: özgür irade değerlidir, ama bu "hiçbir zaman müdahale edilmemesi gerektiği sonucunu doğurmaz"; neredeyse herkes, önleyebileceği büyük bir kötülüğü önlememeyi ciddi bir yanlış sayar. *Cevap.* Bu karşılaştırma Allah'ı, gücü suçla birlikte sona eren bir seyirci gibi düşünür. Kur'an'da öyle değildir: zalimlere süre verilir, unutulmazlar (14:42, yukarıda) ve her haksızlığın, boynuzsuz koyununki dâhil, hesabı sorulur (yukarıya bakınız). Allah her haksızlığı başlarken durdursaydı insanın seçimi gerçek olmaktan çıkar, Kur'an'ın imtihan dediği hayat (67:2) imtihan olmazdı. *Sınırı.* Bu cevap âhirete dayanır. Âhiretten şüphe eden bir okur Tooley'nin itirazını hâlâ ayakta bulacaktır.

      **"Depremler ve hayvan acısı kimsenin seçiminden gelmez."** Özgür irade bunları açıklamaz. Tabiat kanunları cevabı, her türlü etkili eylem için düzenli kanunların gerektiğini ve düzenli kanunların zaman zaman zarar verdiğini söyler. Tooley buna, nadir mucizelerin eylemi imkânsız kılmayacağı ve birçok büyük kötülüğün kimse fark etmeden önlenebileceği cevabını verir. *Cevap.* Kur'an "canlardan ve ürünlerden eksiltme"yi imtihanlar arasında sayar (2:155); hayvanların da "toplan"acağını (6:38) ve haklarının sorulacağını bildirir. Depremler için ayrıca afetlerin ceza olup olmadığı sorusuna bakınız. *Sınırı.* Bu, İslam'da da başka yerde de her teodisenin en zayıf noktasıdır; dürüst cevap kısmidir.

      **"Her şeyi Allah yaratıyorsa seçimlerimiz gerçek mi?"** Sayfa yukarıda özgür iradeyi kullanıyor ve İbnü'l-Kayyim'in Allah'ın "hayrın da şerrin de yaratıcısı" olduğu sözünü aktarıyor. Kur'an ikisini birlikte tutar: "Artık dileyen iman etsin, dileyen inkâr etsin" (18:29) ve "Allah dilemedikçe siz dileyemezsiniz" (76:30). İkisinin nasıl bağdaştığı ayrı bir sorudur ve "Her şey yazılıysa ben nasıl özgürüm?" sayfasında cevaplanır. *Sınırı.* Burada şu kadarını söylemek yeter: İslam kelamı insanın seçimini hiçbir zaman gerçek dışı saymadı; bunun nasıl olduğunu açıklama işi o sayfada yapılır.

      **"Allah'ın sebepleri gizliyse O'na nasıl iyi diyebilirsiniz?"** *Cevap.* Müslümanlar Allah'a boş bir güvenle iyi demez: görülebilene işaret eder — yaratılıştaki rahmete, bir hayvanın yavrusuna basmamak için ayağını kaldırmasını sağlayan o yüzde bir parçaya (yukarıya bakınız). Sonra gerisine, Mûsâ'nın yapmak zorunda kaldığı gibi güvenir. Mezheplerin ayrıştığı yer tam da burasıdır: katı Eş'arî görüş Allah'ın egemenliğini vurgular; Mâtürîdî ve İbn Teymiyye Allah'ın hikmetle iş gördüğünü vurgular. *Sınırı.* Görülebileni aşan güven yine de güvendir.
    en: |-
      **"A good person who could stop a murder would."** Tooley: free will is valuable, but that "does not entail that one should never intervene"; almost everyone thinks failing to prevent heinous evil when one can is seriously wrong. *Reply.* The comparison treats God as a bystander whose power ends when the crime ends. In the Quran it does not: wrongdoers are delayed, not ignored (14:42, quoted above), and every wrong is answered, down to the hornless sheep (see above). If God stopped every wrong as it began, human choice would no longer be real, and the life the Quran calls a test (67:2) would not be one. *Limit.* This reply leans on the hereafter. A reader who doubts the hereafter will find Tooley's point still standing.

      **"Earthquakes and animal pain come from no one's choice."** Free will does not explain them. The natural-law reply says regular laws are needed for any effective action, and regular laws sometimes harm. Tooley answers that rare miracles would not make action impossible, and that many great evils could have been prevented without anyone noticing. *Reply.* The Quran counts loss of "lives and fruits" among the trials (2:155), and promises that animals too "will be gathered" (6:38) and that their wrongs are answered. On earthquakes in particular, see the question on whether disasters are punishment. *Limit.* This is the weakest point of every theodicy, Islamic or not; the honest answer is partial.

      **"If God creates everything, are our choices real?"** The page uses free will above, and also quotes Ibn al-Qayyim that God is "the Creator of good and evil". The Quran holds both together: "whoever wills — let him believe; and whoever wills — let him disbelieve" (18:29), and "you do not will except that Allah wills" (76:30). How the two fit is a question of its own, answered on the page "If everything is written, how am I free?". *Limit.* Here it is enough to say that Muslim theology never treated human choice as unreal; the hard work of explaining how is done there.

      **"If God's reasons are hidden, how can you call Him good?"** *Reply.* Muslims do not call God good from blank trust: they point to what can be seen — the mercy in creation, the one part of a hundred that makes an animal lift its hoof from its young (see above). They then trust the rest, as Moses had to. This is exactly where the schools differed: the strict Ash'ari view stresses God's sovereignty; al-Maturidi and Ibn Taymiyya stress that God acts with wisdom. *Limit.* Trust that goes beyond what can be seen is still trust.
  - kind: views
    tr: |
      - **Mutezile** — Allah kulları için en iyi olanı yapmakla yükümlüdür (*el-aslah*, "en uygun olan") (Ormsby).
      - **Eş'arîler** — Allah'ın fiilleri, insanların denetleyebileceği sebeplerle açıklanmaz ("egemen hesap vermezlik", Ormsby).
      - **Mâtürîdî** — Allah'ın hikmeti her şeyi yerli yerine koymaktır (Ormsby).
      - **Gazzâlî** — bu düzen mümkünlerin en iyisidir; doğru karşılık tevekküldür (*İhyâ*; Ormsby).
      - **İbn Teymiyye** — Allah hikmetle iş görür; Eş'arîler "hikmetsiz irade" kabul eder (Ormsby).
      - **İbnü'l-Kayyim** — şer bazı yaratılmışlardadır, asla Allah'ın fiilinde değil (*Şifâü'l-Alîl*, 21. bab).
      - **Felsefî eleştirmenler (Tooley; Rowe)** — acının miktarı ve türü Allah'ın varlığını olasılık dışı kılar.
    en: |-
      - **Mu'tazila** — God is bound to do what is best for His creatures (*al-aslah*, "the optimum") (Ormsby).
      - **Ash'aris** — God's acts are not to be explained by reasons human beings can audit ("sovereign unaccountability", Ormsby).
      - **Al-Maturidi** — God's wisdom is the proper placement of things (Ormsby).
      - **Al-Ghazali** — this order is the best possible; trust is the right response (*Ihya'*; Ormsby).
      - **Ibn Taymiyya** — God acts with wisdom; the Ash'aris "affirm will without wisdom" (Ormsby).
      - **Ibn al-Qayyim** — evil is in some created things, never in God's act (*Shifa' al-'Alil*, ch. 21).
      - **Philosophical critics (Tooley; Rowe)** — the amount and kind of suffering make God unlikely.
followUps:
  - q:
      tr: '"Mantıksal" problem ile "delile dayalı" problem arasındaki fark nedir?'
      en: What is the difference between the "logical" and the "evidential" problem?
    a:
      tr: |
        Mantıksal problem, Allah ile kötülüğün bir arada var olamayacağını söyler; delile dayalı problem ise gördüğümüz kötülüklerin Allah'ın varlığını olasılık dışı kıldığını söyler. "Filozoflar bu konuyu nasıl tartışır" bölümüne bakınız.
      en: The logical problem says God and evil cannot both exist; the evidential problem says that the evils we see make God unlikely. See "How philosophers argue about it".
  - q:
      tr: Bebekler ve hayvanlar imtihan edilemiyorsa neden acı çekiyor?
      en: Why would infants and animals suffer, if they cannot be tested?
    a:
      tr: |
        Gelenek onların aynı şekilde imtihan edildiğini söylemez. Kurtubî, çocuklar için acının bir mükâfat olduğu görüşünü kaydeder. Hayvanlar için Hz. Peygamber, haklarının aralarında bile yerine getirileceğini söyledi; Kur'an da onların "toplan"acağını söyler (6:38). Bu, şimdiki her olayın açıklaması değil, sonrası hakkında bir vaattir.
      en: The tradition does not say they are being tested in the same way. Al-Qurtubi records the view that for children suffering is a reward. For animals, the Prophet said wrongs will be set right even between them, and the Quran says they too "will be gathered" (6:38). This is a promise about what comes after, not an explanation of every case now.
  - q:
      tr: Bir kayıptan sonra Allah'a öfkelenmek zayıf iman mıdır?
      en: Is it weak faith to be angry with God after a loss?
    a:
      tr: |
        Peygamberler acılarını Allah'a dile getirdi (12:86; 21:83); Hz. Peygamber ağladı ve "kalp hüzünlenir" dedi. Geleneğin sakındırdığı şey Allah'tan yüz çevirmektir; O'nun huzurunda acı duymak değil.
      en: The prophets voiced their pain to God (12:86; 21:83), and the Prophet wept and said "the heart is grieved". What the tradition guards against is turning away from God, not feeling pain in front of Him.
  - q:
      tr: Gazzâlî gerçekten bunun mümkün dünyaların en iyisi olduğunu mu söyledi? Kimler karşı çıktı?
      en: Did al-Ghazali really say this is the best possible world? Who disagreed?
    a:
      tr: |
        Evet: *İhyâ*'da, tevekkül bahsinde (Ormsby, 1. bölüm). Yüzyıllar boyunca eleştirmenler bunun Allah'ın daha iyisini yaratma kudretini sınırlıyor gibi göründüğünü ve Mutezile'nin "en uygun olan" görüşünü andırdığını söyledi; savunucuları ise pasajın Allah'ı sınırlamak değil, tevekküle davet olduğunu söyledi.
      en: "Yes: in the *Ihya'*, in the book on trust in God (Ormsby, ch. 1). Critics over several centuries objected that it seemed to limit God's power to create something better, and that it echoed the Mu'tazili \"optimum\"; his defenders replied that the passage is a call to trust, not a limit on God."
  - q:
      tr: Allah ne yaparsa tanımı gereği iyiyse, "iyi" sıradan anlamını yitirmez mi?
      en: Has "good" lost its ordinary meaning if whatever God does is good by definition?
    a:
      tr: |
        Ormsby, Hanbelîler de dâhil başka mezheplerin Eş'arîleri Allah'ın hikmetini ihmal etmekle eleştirdiğini aktarır; İbn Teymiyye onların "hikmetsiz irade" kabul ettiğini söyledi. Mâtürîdî ve İbn Teymiyye'ye göre Allah hikmetle iş görür; böylece "iyi", göremediğimiz yerde bile sebeplere bağlı kalır.
      en: Ormsby reports that other schools, the Hanbalis among them, criticised the Ash'aris for neglecting God's wisdom; Ibn Taymiyya said they "affirm will without wisdom". For al-Maturidi and Ibn Taymiyya, God acts with wisdom, so "good" stays tied to reasons, even where we cannot see them.
