order: 1
theme: evil
title:
  tr: Allah her şeye gücü yeten ve iyiyse, neden acı var?
  en: Why is there suffering if God is all-good and all-powerful?
sensitivity: normal
helpCard: suffering
verses:
  - 67:2
  - 94:5-6
steelman:
  tr: |
    Her şeye gücü yeten bir Allah acıyı önleyebilir; iyi bir Allah da önlemek ister. Oysa acı muazzamdır ve çoğu zaman anlamsız görünür: çocuk kanserleri, derin zaman boyunca hayvanların acısı, depremler.
  en: "An omnipotent God could prevent suffering and a good God would want to. Yet suffering is vast and often seems pointless: children's cancer, animal pain across deep time, earthquakes."
whyAsked:
  tr: |
    - Ateizmin en güçlü argümanıdır.
    - Çoğu zaman yas yoluyla gelir.
    - Türk öğretmenler onu ilk sırada sayar; Allah'ın "sessizliği" olarak dile getirilir.
  en: |-
    - It is the strongest atheist argument.
    - It usually arrives through grief.
    - Turkish teachers rank it first, framed as God being "silent".
shortAnswer:
  tr: |
    İslam hayatı gerçek bir imtihan olarak görür (67:2; 21:35); bu imtihanda yas meşrudur ve nihai adalet ölümden sonradır. Filozofların çoğu "mantıksal" problemi cevaplanmış sayar. "Delile dayalı" problem ise ciddi olmaya devam eder. Dürüst bir cevap kısmi sebepler verir, geri kalanı için güvene davet eder ve şimdi dayanışmaya çağırır.
  en: Islam calls life a real test (67:2; 21:35) in which grief is legitimate and final justice comes after death. Philosophers widely regard the "logical" problem as answered. The "evidential" problem remains serious. An honest answer gives partial reasons, invites trust about the rest, and calls for solidarity now.
layers:
  - kind: religious
    tr: |
      - Kur'an: zorlukla beraber kolaylık (94:5–6); Hızır'ın gizli hikmeti (18:60–82); Eyüp'ün övülen sabrı (38:41–44); her şeyi kuşatan rahmet (7:156).
      - Hadis: müminin bütün işi hayırdır; ya şükür ya sabır (Müslim 2999). Hz. Peygamber oğlu İbrahim için ağladı (Buhârî 1303).
      - Gazzâlî "olandan daha mükemmeli yoktur" görüşündeydi. [Debated]
      - Eş'arîler Allah'ın adaletini O'nun egemenliğine dayandırır; Mâtürîdîler aklın kısmen kavrayabileceği hikmeti (*hikmet*) vurgular. [Scholarly]
      - İbn Teymiyye: kötülük Allah tarafından hiçbir zaman saf kötülük değildir.
      - Said Nursî: kötülüğü yaratmak kötü değildir, onu seçmek kötüdür.
    en: |-
      - Quran: hardship with ease (94:5–6); Khidr's hidden wisdom (18:60–82); Job's praised patience (38:41–44); mercy encompassing all things (7:156).
      - Hadith: the believer's affair is all good, gratitude or patience (Muslim 2999). The Prophet wept for his son Ibrahim (Bukhari 1303).
      - Al-Ghazali held there is "nothing more wonderful than what is". [Debated]
      - Ash'aris ground God's justice in His sovereignty; Maturidis stress wisdom (ḥikma) that reason can partly grasp. [Scholarly]
      - Ibn Taymiyya: evil is never purely evil from God's side.
      - Said Nursi: creating evil is not evil, choosing it is.
  - kind: philosophical
    tr: |
      - Savunmalar: özgür irade, ruhun olgunlaşması, doğal düzenlilik ve şüpheci teizm.
      - En güçlü itiraz: hayvanlar dâhil acının miktarı ve dağılımı.
      - Cevaplar: hayvanlar için karşılık (Müslim 2582), âhiret ve bilginin sınırları. Bunlar problemi küçültür ama ortadan kaldırmaz.
    en: |-
      - Defences: free will, soul-making, natural regularity and sceptical theism.
      - Strongest objection: the amount and distribution of suffering, including animals.
      - Responses: animal recompense (Muslim 2582), eschatology and epistemic limits. These reduce the problem but do not dissolve it.
  - kind: scientific
    tr: |
      Levha tektoniği depremlere yol açar, ama aynı zamanda karbonu geri dönüştürür ve uzun vadede iklimi dengelemeye yardım eder. [Established] jeofizik; teodise için kullanılması ise [Debated]
    en: Plate tectonics causes earthquakes but also recycles carbon and helps stabilize long-term climate. [Established geophysics; the theodicy use is Debated]
  - kind: psychological
    tr: |
      Olumlu dinî başa çıkma (Allah'ı bir ortak görmek), olumsuz başa çıkmadan (cezalandırıldığını hissetmek) daha iyi sonuçları yordar. Yas, argümandan önce yanında olmayı ister.
    en: Positive religious coping (God as partner) predicts better outcomes than negative coping (feeling punished). Grief needs presence before argument.
honestLimits:
  tr: |
    Hiçbir teodise tek tek olayları açıklamaz.
  en: No theodicy explains individual cases.
visualizations:
  - id: ideas
    tr: |
      - Tek bir olaydan bütün bir hayata uzanan "iki mercek" yakınlaştırması.
      - Üç panelli bir Hızır kıssası.
      - Tehlikeyi ve hayatı birlikte gösteren bir levha tektoniği küresi.
    en: |-
      - A "two lenses" zoom from one event to a whole life.
      - A three-panel Khidr story.
      - A tectonics globe showing hazard and life together.
