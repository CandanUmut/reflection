steelman:
  tr: |
    Allah her şeye gücü yetiyorsa acıyı önleyebilir. Mutlak iyiyse önlemek ister. Oysa acı her yerdedir ve çoğu, kimsenin görebildiği bir amaca hizmet etmiyor gibidir: kanserden ölen bir çocuk; bir orman yangınına yakalanıp yavaş ve korkunç biçimde ölen bir yavru geyik (filozof William Rowe'un örneği); milyonlarca yıl süren hayvan acısı; bir dakikada binlerce insanı öldüren bir deprem. Bir cinayeti kolayca önleyebilecekken önlemeyen iyi bir insan yanlış yapmış olur — öyleyse Allah neden önlemiyor? Argüman en güçlü bugünkü hâliyle, Allah ile acının mantıken bir arada olamayacağını söylemez. Bu kadar çok acının, ve bu türden acının, iyi ve her şeye gücü yeten bir Allah'ın varlığını olasılık dışı kıldığını söyler.
  en: "If God can do anything, He could prevent suffering. If God is perfectly good, He would want to. Yet suffering is everywhere, and much of it seems to serve no purpose anyone can see: a child dying of cancer; a fawn caught in a forest fire, dying slowly and terribly (the philosopher William Rowe's example); millions of years of animal pain; an earthquake that kills thousands in a minute. A good person who could easily stop a murder and did not would be doing wrong — so why does God not stop it? In its strongest modern form, the argument does not say that God and suffering are logically impossible together. It says that this much suffering, and suffering of this kind, makes a good and all-powerful God unlikely."
whyAsked:
  tr: |
    Filozoflar bunu Allah'a imana karşı ciddi olabilecek bir argüman olarak ele alır. Ama çoğu insana bir argüman olarak gelmez. Bir hastane yatağının başında, bir mezarın yanında ya da bir afetin ardından haberlerde gelir.
  en: Philosophers treat it as a potentially serious argument against belief in God. But for most people it does not arrive as an argument. It arrives at a hospital bed, at a grave, or in the news after a disaster.
shortAnswer:
  tr: |
    İslam acının gerçek olduğunu ya da acıttığını inkâr etmez: Hz. Peygamber küçük oğlu öldüğünde ağladı. Kur'an bu hayatı zorlukta da bollukta da bir imtihan olarak anlatır (67:2; 21:35) ve hesabın ölümle kapanmadığını bildirir: zalimlere süre verilir, unutulmazlar (14:42); adalet ölümden sonra, hayvanlar arasında bile tamamlanır. Müslüman âlimler acı için gerçek ama kısmi sebepler gösterir: günahları siler; bolluk şükrü sınadığı gibi acı da sabrı sınar; ve acı çeken birinin başkalarından daha kötü olduğunun işareti asla değildir. Allah'ın hikmetinin çoğu bizden gizlidir; Mûsâ ile Hızır kıssası bunu gösterir (18:65–82). Bu sebepler "Allah ile acı bir arada olamaz" iddiasına cevap verir; her bir olayı tek tek açıklamaz. Geri kalan için Kur'an, Hz. Peygamber'in bir anneden daha merhametli diye anlattığı Allah'a güvenmeye çağırır — ve acıyı yalnızca açıklamaya değil, hafifletmeye de çağırır.
  en: "Islam does not deny that suffering is real or that it hurts: the Prophet wept when his young son died. The Quran calls this life a test, in hardship and in ease (67:2; 21:35), and it promises that the account is not closed at death: wrongdoers are given time, not ignored (14:42), and justice is completed after death, even between animals. Muslim scholars give real but partial reasons for suffering: it can wipe away sins, it tests patience as ease tests gratitude, and it is never a sign that the sufferer is worse than others. Much of God's wisdom is hidden from us, as the story of Moses and al-Khidr shows (18:65–82). These reasons answer the claim that God and suffering cannot both exist; they do not explain every single case. For what remains, the Quran asks for trust in a God the Prophet described as more merciful than a mother to her child — and it asks us to relieve suffering, not only to explain it."
