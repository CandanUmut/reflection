steelman:
  tr: |
    Allah ne zaman yemek yediğimi neden önemsesin?
  en: "\"Why would the Creator of galaxies care whether I eat at 2 p.m.? If God needs nothing, my fasting does nothing for Him. If it is for my health, a doctor could prescribe something better. And fasting is only the start: there are rules for washing, eating, praying, dressing, inheriting. Some have obvious purposes; many seem arbitrary. Following rules I can't understand looks like blind obedience.\""
whyAsked:
  tr: |
    Kurallar amaçsız hissettirebilir.
  en: 'Ramadan is the most widely kept practice in the Muslim world, and also where many young Muslims first ask "why?". The question has two halves: why would God care, and why so many rules.'
shortAnswer:
  tr: |
    Bazı kuralların açık amaçları vardır; bazıları ise saf kulluk ibadetleridir (*taabbüdî*). Oruç nefse hâkimiyeti ve empatiyi geliştirir. Sağlığa etkileri mütevazıdır.
  en: "God does not need the fast: \"O mankind, you are those in need of Allah, while Allah is the Free of need, the Praiseworthy\" (35:15). The Prophet (pbuh) said that if a person does not give up false speech and evil actions, \"Allah is not in need of his leaving his food and drink\" ({hadith:bukhari:1903}). The Quran gives the fast's purpose: \"that you may become righteous\" (2:183) — *taqwā*, a constant awareness of God. Fasting is from dawn to sunset, with no food, drink or sexual relations (2:187); the ill and travellers make up the days later, and those who can fast only with great hardship feed a poor person instead (2:184–185). As for rules, al-Shatibi held that the Sharia as a whole serves five purposes — religion, life, intellect, family and wealth. That acts of worship keep their fixed form even where their full reason is not stated is a common framing, but no named source for it was read for this run. Health effects of Ramadan fasting are real but modest and temporary, and they are not its reason."
layers:
  - kind: religious
    tr: |
      "Takvaya eresiniz diye" (2:183). Yalan sözü durdurmayan bir orucun değeri yoktur (Buhârî 1903). Şâtıbî: ibadetlerde asıl olan teabbüddür.
    en: '"So that you may attain *taqwā*" (2:183). A fast that does not stop false speech is worthless (Bukhārī 1903). Al-Shāṭibī: in acts of worship, devotion is the default.'
  - kind: philosophical
    tr: |
      Pratik karakteri şekillendirir.
    en: Practice shapes character.
  - kind: scientific
    tr: |
      11 meta-analizin bir şemsiye derlemesi ([*Nutrition Reviews* 2025](https://academic.oup.com/nutritionreviews/article-abstract/83/2/e711/7604369)) faydalar buldu. Kilo, Ramazan sonunda 1,24 kg azalır, ama kayıp 2–6 hafta içinde 0,27 kg'a iner (*Nutrients* 2019).
    en: An umbrella review of 11 meta-analyses ([*Nutrition Reviews* 2025](https://academic.oup.com/nutritionreviews/article-abstract/83/2/e711/7604369)) found benefits. Weight drops 1.24 kg by the end of Ramadan, but the loss shrinks to 0.27 kg within 2–6 weeks (*Nutrients* 2019).
  - kind: psychological
    tr: |
      Yeme bozukluğu ya da diyabeti olanlar tıbbi tavsiye almalıdır; muafiyetler bir rahmettir.
    en: People with eating disorders or diabetes should take medical advice; the exemptions are a mercy.
honestLimits:
  tr: |
    Sağlık orucun "sebebi" değildir.
  en: Al-Shatibi's own text, and any statement of his on worship being devotional by default, were not read. The Maliki position on pregnant and breastfeeding women was not covered. The umbrella review was read through its abstract (Mainz university bibliography record), not its full text. No study of self-control or empathy during Ramadan, and no clinical guideline on fasting risks, was read.
