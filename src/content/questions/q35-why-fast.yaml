fullAnswer:
  - kind: quran
    en: |-
      **The command and its purpose (2:183).** "O you who have believed, decreed upon you is fasting as it was decreed upon those before you that you may become righteous -" (2:183), Medinan. The fast is not new; it was "decreed upon those before you". Its stated purpose is *laʿallakum tattaqūn*, "that you may become righteous": *taqwā*, from a root meaning to guard oneself — living aware of God, and guarding against what displeases Him.

      **Who fasts, and who is excused (2:184–185).** "[Fasting for] a limited number of days. So whoever among you is ill or on a journey [during them] - then an equal number of days [are to be made up]. And upon those who are able [to fast, but with hardship] - a ransom [as substitute] of feeding a poor person [each day]" (2:184). Then: "The month of Ramadhan [is that] in which was revealed the Qur'an… So whoever sights [the new moon of] the month, let him fast it; and whoever is ill or on a journey - then an equal number of other days. Allah intends for you ease and does not intend for you hardship" (2:185).

      **What the fast is (2:187).** "And eat and drink until the white thread of dawn becomes distinct to you from the black thread [of night]. Then complete the fast until the sunset" (2:187). The same verse permits sexual relations during the nights of Ramadan, so the fast is from food, drink and sexual relations from dawn to sunset.
    tr: |-
      **Emir ve amacı (2:183).** "Ey iman edenler! Oruç, sizden öncekilere farz kılındığı gibi size de farz kılındı. Umulur ki korunursunuz." (2:183), Medenî. Oruç yeni değildir; "sizden öncekilere farz kılındı". Bildirilen amacı *le'allekum tettekûn*, "umulur ki korunursunuz"dur: kendini korumak anlamına gelen bir kökten gelen *takvâ* — Allah'ın bilincinde yaşamak ve O'nun hoşnut olmadığı şeylerden sakınmak.

      **Kim oruç tutar, kim muaf tutulur (2:184–185).** "(Size farz kılınan oruç), sayılı günlerdedir. İçinizden hasta olan veya yolculukta bulunan ise, diğer günlerde, tutamadığı günler sayısınca tutar. Ona dayanıp kalacaklar üzerine de bir yoksulu doyuracak kadar fidye gerekir." (2:184). Sonra: "O Ramazan ayı ki, … Kur'ân onda indirildi. Onun için sizden her kim bu aya şahit olursa onda oruç tutsun. Kim de hasta, yahut yolculukta ise tutamadığı günler sayısınca diğer günlerde kaza etsin. Allah size kolaylık diler zorluk dilemez." (2:185).

      **Oruç nedir (2:187).** "Ta fecrin beyaz ipliği siyah iplikden size seçilinceye kadar yiyin, için. Sonra da ertesi geceye kadar orucu tam tutun." (2:187). Aynı âyet Ramazan gecelerinde cinsel ilişkiye izin verir; dolayısıyla oruç, şafaktan güneş batana kadar yemekten, içmekten ve cinsel ilişkiden uzak durmaktır.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: |-
      **God does not need it.** "Whoever does not give up forged speech and evil actions, Allah is not in need of his leaving his food and drink" ({hadith:bukhari:1903}, Abu Hurayra). Hunger alone is not the point.

      **"Fasting is for Me."** In a hadith qudsi (a saying the Prophet (pbuh) attributes to God, in his own words): "All the deeds of Adam's sons (people) are for them, except fasting which is for Me". The same report calls fasting "a shield or protection from the fire and from committing sins", and tells the fasting person, if insulted, to say: "I am fasting" ({hadith:bukhari:1904}, Abu Hurayra).

      **God gains nothing from any worship.** In another hadith qudsi: "you will not attain harming Me so as to harm Me, and you will not attain benefiting Me so as to benefit Me"; if every heart were as pious as the most pious, "this would not increase My Kingdom an iota"; "it is but your deeds that I account for you, and then recompense you for" (in the sunnah.com translation of al-Nawawi's Forty, no. 24, which cites Muslim; this is {hadith:muslim:2577}, where sunnah.com's Muslim translation reads "that would not increase My dominion in anything" and "it is but your deeds that I record for you").
    tr: |-
      **Allah'ın ona ihtiyacı yoktur.** "Kim yalan sözü ve kötü işleri bırakmazsa, Allah'ın onun yemesini ve içmesini bırakmasına ihtiyacı yoktur" ({hadith:bukhari:1903}, Ebû Hüreyre). Yalnızca açlık amaç değildir.

      **"Oruç benim içindir."** Bir kudsî hadiste (Hz. Peygamber'in (s.a.v.) kendi sözleriyle Allah'a nispet ettiği bir söz): "Âdemoğlunun (insanların) bütün amelleri kendileri içindir, oruç hariç; o benim içindir." Aynı rivayet orucu "ateşten ve günah işlemekten bir kalkan ya da koruma" olarak niteler ve oruçlu kişiye, kendisine hakaret edilirse şöyle demesini söyler: "Ben oruçluyum" ({hadith:bukhari:1904}, Ebû Hüreyre).

      **Allah hiçbir ibadetten bir şey kazanmaz.** Başka bir kudsî hadiste: "Bana zarar vermeye güç yetiremezsiniz ki bana zarar veresiniz, bana fayda vermeye güç yetiremezsiniz ki bana fayda veresiniz"; bütün kalpler en takvalı olanın kalbi gibi olsa bile, "bu benim mülkümden zerre kadar artırmaz"; "bunlar ancak sizin amellerinizdir; onları sizin için sayarım, sonra size karşılığını veririm" (Nevevî'nin Kırk Hadis'inin 24. hadisinin sunnah.com çevirisinde; Müslim'e atıfta bulunur; bu {hadith:muslim:2577}'dir; sunnah.com'un Müslim çevirisinde "bu benim mülkümden hiçbir şey artırmaz" ve "bunlar ancak sizin için kaydettiğim amellerinizdir" şeklinde geçer).
    title:
      en: Hz. Peygamber (s.a.v.) ne öğretti?
      tr: Hz. Peygamber (s.a.v.) ne öğretti?
  - kind: fiqh
    en: |-
      **The ill and travellers.** Make up the days later (2:184–185). Ibn Kathir: "the same number ( should be made up ) from other days."

      **The very old and chronically ill.** The early permission to feed a poor person instead of fasting was, according to Muʿadh and Salama ibn al-Akwaʿ, later replaced by the command of 2:185 ("this abrogated the previous Ayah", Ibn Kathir). But Ibn ʿAbbas held that it "was not abrogated, it is for the old man and the old woman" who can fast only with difficulty (Ibn Kathir). So those who can never fast pay *fidya* — feeding a poor person for each day — and do not make up (Kutty, IslamOnline).

      **Pregnant and breastfeeding women.** Ibn Kathir: "The same ruling applies for the pregnant and breast-feeding women if they fear for themselves or their children or fetuses." The schools differ on what they owe afterwards (Kutty, IslamOnline):
      - **Hanafi:** make up the days only, no *fidya*.
      - **Shafiʿi and Hanbali:** if they did not fast out of fear for the child only, make up *and* pay *fidya* for each day; if out of fear for themselves (or both), make up only.
      - **Maliki:** not covered in the source read.
      - A third view, reported from Ibn ʿAbbas and Ibn ʿUmar, treats them like the elderly: *fidya* only.
    tr: |-
      **Hastalar ve yolcular.** Günleri sonra kaza ederler (2:184–185). İbn Kesîr: "Aynı sayı başka günlerden (kaza edilmelidir)."

      **Çok yaşlılar ve kronik hastalar.** Oruç yerine bir yoksulu doyurmaya ilişkin erken dönem izni, Muâz'a ve Seleme b. Ekva'a göre, daha sonra 2:185'in emriyle kaldırıldı ("bu önceki âyeti neshetti", İbn Kesîr). Ama İbn Abbâs onun "neshedilmediğini, oruca ancak güçlükle dayanabilen yaşlı erkek ve yaşlı kadın için olduğunu" savundu (İbn Kesîr). Dolayısıyla hiç oruç tutamayanlar *fidye* öder — her gün için bir yoksulu doyurur — ve kaza etmez (Kutty, IslamOnline).

      **Hamile ve emziren kadınlar.** İbn Kesîr: "Aynı hüküm, kendileri ya da çocukları veya ceninleri için korkarlarsa hamile ve emziren kadınlar için de geçerlidir." Mezhepler sonradan neyi borçlu olduklarında ayrılır (Kutty, IslamOnline):
      - **Hanefî:** yalnızca günleri kaza ederler, *fidye* yok.
      - **Şâfiî ve Hanbelî:** yalnızca çocuk için korktukları için oruç tutmadılarsa, kaza ederler *ve* her gün için *fidye* öderler; kendileri için (ya da ikisi için) korktularsa, yalnızca kaza ederler.
      - **Mâlikî:** okunan kaynakta ele alınmadı.
      - İbn Abbâs ve İbn Ömer'den aktarılan üçüncü bir görüş onları yaşlılar gibi görür: yalnızca *fidye*.
    title:
      en: Dört mezhepte muafiyetler
      tr: Dört mezhepte muafiyetler
  - kind: scholars
    en: |-
      **The purposes of the Sharia.** Al-Shatibi (an Andalusian jurist), in *al-Muwāfaqāt*, organised the law around "the Five Universals (al-Kulliyyat al-Khams)", each "a fundamental human interest that the Shariah is designed to protect, promote, and balance": religion, life, intellect, lineage and family, and wealth (islam.wiki's explanatory chapter). Many rules can be understood this way: the ban on intoxicants protects the intellect; inheritance rules protect family and wealth.

      **Reasoned and devotional rules.** Jurists commonly distinguish rules whose reasons can be understood and extended (*maʿqūl al-maʿnā*) from rules accepted as acts of devotion (*taʿabbudī*) (a standard distinction; no named source for it was read), where the form is fixed even if its full reason is not stated — the number of units in each prayer, for example.

      **How to tell which is which.** A practical rule of thumb (this page's, not a named scholar's): where a text gives a reason (2:183's *taqwā*; 2:185's "ease"), the rule is reasoned at least in part; where the form of a worship act is fixed without a stated reason (times, numbers, directions), it is devotional. Most acts of worship have both: a stated purpose and a fixed form.
    tr: |-
      **Şeriatın amaçları.** Endülüslü fakih Şâtıbî, *el-Muvâfakât*'ta hukuku "Beş Külliye (el-Külliyyâtü'l-Hams)" etrafında düzenledi; her biri "şeriatın korumak, geliştirmek ve dengelemek için tasarlandığı temel bir insan yararıdır": din, can, akıl, nesil ve aile, ve mal (islam.wiki'nin açıklayıcı bölümü). Pek çok kural bu şekilde anlaşılabilir: Sarhoş edicilerin yasaklanması aklı korur; miras kuralları aileyi ve malı korur.

      **Akli ve teabbüdî kurallar.** Fakihler genellikle sebepleri anlaşılabilen ve genişletilebilen kuralları (*ma'kûlü'l-ma'nâ*), tam sebebi bildirilmese bile biçimi sabit olan, ibadet olarak kabul edilen kurallardan (*teabbüdî*) ayırır (standart bir ayrım; onun için adı belli hiçbir kaynak okunmadı) — örneğin her namazdaki rekât sayısı.

      **Hangisinin hangisi olduğu nasıl anlaşılır?** Pratik bir kural (bu sayfanın, adı belli bir âlimin değil): Bir metnin sebep verdiği yerde (2:183'ün *takvâ*sı; 2:185'in "kolaylık"ı) kural en azından kısmen akli sebebe dayanır; bir ibadetin biçiminin bildirilmiş bir sebep olmadan sabitlendiği yerde (vakitler, sayılar, yönler) teabbüdîdir. İbadetlerin çoğunda ikisi de vardır: bildirilmiş bir amaç ve sabit bir biçim.
    title:
      en: Neden bu kadar çok kural? Amaçlar ve teabbüd
      tr: Neden bu kadar çok kural? Amaçlar ve teabbüd
  - kind: reasoning
    en: |-
      **God's care is for us.** The Quran and hadith are clear that God gains nothing (35:15; Muslim 2577). If He commands something, it is not because He lacks it. The command is for the worshipper — "that you may become righteous". Like a parent who tells a child to sleep, the instruction serves the one instructed.

      **What fasting does.** It interrupts the most basic habits — eating and drinking — for a month, by choice, for God. A person who can say no to food at noon learns that they can say no to other things. That is what Bukhari 1904's "shield… from committing sins" points to. The fast is also shared: everyone in a community is hungry at the same time, and breaks the fast together.

      **Following a rule you don't fully understand is not blind.** A patient follows a doctor's exact dose without knowing the pharmacology, because they have reasons to trust the doctor. Obedience is blind when it has no reason to trust; it is reasoned when the one commanding has shown wisdom and care elsewhere. For a Muslim, many rules show their purpose openly, and that grounds trust in the ones that don't.

      *Limit:* this works only for someone who already has reason to trust the source. For someone who doubts revelation itself, the question becomes the earlier one ("Why believe Muhammad was a prophet?").
    tr: |-
      **Allah'ın ilgisi bizim içindir.** Kur'an ve hadis Allah'ın hiçbir şey kazanmadığı konusunda açıktır (35:15; Müslim 2577). Bir şeyi emrediyorsa, O'nun ona ihtiyacı olduğu için değildir. Emir ibadet eden içindir — "umulur ki korunursunuz". Çocuğuna uyumasını söyleyen bir anne baba gibi, talimat kendisine talimat verilene hizmet eder.

      **Oruç ne yapar?** En temel alışkanlıkları — yemeyi ve içmeyi — bir ay boyunca, isteyerek, Allah için keser. Öğle vakti yemeğe hayır diyebilen biri başka şeylere de hayır diyebileceğini öğrenir. Buhârî 1904'teki "günah işlemekten… kalkan" ifadesinin işaret ettiği budur. Oruç aynı zamanda ortaktır: Bir topluluktaki herkes aynı anda açtır ve orucu birlikte açar.

      **Tam anlamadığın bir kurala uymak körü körüne değildir.** Bir hasta, farmakolojiyi bilmeden bir doktorun verdiği dozu tam olarak uygular, çünkü doktora güvenmek için sebepleri vardır. İtaat, güvenmek için hiçbir sebebi olmadığında körü körünedir; emredenin başka yerlerde hikmet ve özen gösterdiği yerde ise akla dayanır. Bir Müslüman için pek çok kural amacını açıkça gösterir ve bu, göstermeyenlere duyulan güvenin temelidir.

      *Sınır:* Bu yalnızca kaynağa güvenmek için zaten sebebi olan biri için işler. Vahyin kendisinden şüphe eden biri için soru daha önceki soruya dönüşür ("Muhammed'in peygamber olduğuna neden inanmalı?").
    title:
      en: '"Allah neden umursasın?" ve "Bu körü körüne itaat değil mi?"'
      tr: '"Allah neden umursasın?" ve "Bu körü körüne itaat değil mi?"'
  - kind: science
    en: |-
      **Weight and body fat.** [Moderate] In a 2019 meta-analysis (Fernando et al., *Nutrients*; 70 publications, 90 comparison groups, 2,947 participants), weight fell by 1.34 kg (95% CI −1.61 to −1.07) by the end of Ramadan, and was still 0.59 kg lower (−0.99 to −0.20) two to five weeks later. Fat mass fell by 0.98 kg. At follow-up the paper is not consistent with itself: its Discussion says fat measures were back to baseline, but its results section (3.2.1) reports a small remaining fall in fat percentage (−0.94%, 95% CI −1.73 to −0.15). The authors describe "Consistent—albeit transient—reductions in weight and fat mass", especially in people with overweight or obesity.

      **Metabolic markers.** [Low-quality evidence] An umbrella review of eleven meta-analyses (Jahrami, Ammar, Glenn, Saif, Chtourou & Trabelsi, *Nutrition Reviews*, 2024, doi:10.1093/nutrit/nuae001) found small changes after Ramadan fasting, given as standardised mean differences (SMD; about 0.2 is conventionally called "small"): waist circumference −0.30 (95% CI −0.33 to −0.27), body weight −0.34 (−0.39 to −0.29), HDL +0.20 (0.10 to 0.30), LDL −0.10 (−0.13 to −0.07), total cholesterol −0.15 (−0.21 to −0.09), triglycerides −0.16 (−0.24 to −0.08), systolic and diastolic blood pressure −0.20 each, fasting glucose −0.10 (−0.12 to −0.08). The authors warn that "the methodological quality of the included reviews ranged from low to critically low", "necessitating cautious interpretation of conclusions drawn from these data". Non-English studies were excluded (2 Minute Medicine summary).

      **Risks.** No clinical guideline on fasting risks was read. The Quran's exemption for the ill (2:184) covers anyone for whom fasting would cause harm.

      **Self-mastery and empathy.** No study measuring changes in self-control or empathy during Ramadan was read. These are the tradition's claims (Bukhari 1904) and a common experience, not measured findings here.
    tr: |-
      **Kilo ve vücut yağı.** [Orta] 2019 tarihli bir meta-analizde (Fernando ve ark., *Nutrients*; 70 yayın, 90 karşılaştırma grubu, 2.947 katılımcı), kilo Ramazan sonunda 1,34 kg azaldı (%95 GA −1,61 ile −1,07) ve iki ila beş hafta sonra hâlâ 0,59 kg daha düşüktü (−0,99 ile −0,20). Yağ kütlesi 0,98 kg azaldı. Takipte makale kendi içinde tutarlı değil: Tartışma bölümü yağ ölçümlerinin başlangıç değerlerine döndüğünü söylüyor, ama bulgular bölümü (3.2.1) yağ yüzdesinde küçük, kalıcı bir düşüş bildiriyor (−%0,94, %95 GA −1,73 ile −0,15). Yazarlar, özellikle fazla kilolu ya da obez kişilerde, "kiloda ve yağ kütlesinde tutarlı — geçici de olsa — azalmalar" tarif ediyor.

      **Metabolik göstergeler.** [Düşük kaliteli delil] On bir meta-analizi kapsayan bir şemsiye derleme (Jahrami, Ammar, Glenn, Saif, Chtourou ve Trabelsi, *Nutrition Reviews*, 2024, doi:10.1093/nutrit/nuae001), Ramazan orucundan sonra küçük değişiklikler buldu; standartlaştırılmış ortalama farklar (SOF; yaklaşık 0,2 geleneksel olarak "küçük" sayılır) olarak verilmiştir: bel çevresi −0,30 (%95 GA −0,33 ile −0,27), vücut ağırlığı −0,34 (−0,39 ile −0,29), HDL +0,20 (0,10 ile 0,30), LDL −0,10 (−0,13 ile −0,07), toplam kolesterol −0,15 (−0,21 ile −0,09), trigliseritler −0,16 (−0,24 ile −0,08), sistolik ve diyastolik kan basıncı her biri −0,20, açlık kan şekeri −0,10 (−0,12 ile −0,08). Yazarlar "dahil edilen derlemelerin yöntemsel kalitesinin düşükten kritik derecede düşüğe kadar değiştiği" ve bunun "bu verilerden çıkarılan sonuçların ihtiyatla yorumlanmasını gerektirdiği" konusunda uyarıyor. İngilizce olmayan çalışmalar dışarıda bırakıldı (2 Minute Medicine özeti).

      **Riskler.** Oruç riskleri üzerine hiçbir klinik kılavuz okunmadı. Kur'an'ın hastalar için muafiyeti (2:184), orucun zarar vereceği herkesi kapsar.

      **Nefse hâkimiyet ve empati.** Ramazan sırasında öz denetimdeki ya da empatideki değişiklikleri ölçen hiçbir çalışma okunmadı. Bunlar geleneğin iddiaları (Buhârî 1904) ve yaygın bir tecrübedir, burada ölçülmüş bulgular değil.
    title:
      en: Araştırmalar ne gösteriyor?
      tr: Araştırmalar ne gösteriyor?
  - kind: objection
    en: |-
      **"If God needs nothing, my fast is pointless."** *Reply:* it is pointless for God; it is not pointless for you. That is the Quran's own claim (2:183; 35:15). *Limit:* if one doubts that the fast does anything for the soul, the reply rests on experience and trust, not proof.

      **"If it's for health, a doctor could prescribe something better."** *Reply:* health is not its stated purpose; *taqwā* is. The health effects are modest and temporary (Fernando et al. 2019). *Limit:* someone who values only measurable outcomes will not be persuaded by an inner purpose.

      **"The rules are arbitrary."** *Reply:* many rules serve stated or obvious purposes (al-Shatibi's five universals); others are fixed forms of devotion, which give a shared shape to worship across the world. *Limit:* the exact reason for some details is not known, and Muslims accept them on trust.
    tr: |-
      **"Allah hiçbir şeye muhtaç değilse orucum anlamsızdır."** *Cevap:* Allah için anlamsızdır; senin için anlamsız değildir. Bu Kur'an'ın kendi iddiasıdır (2:183; 35:15). *Sınır:* Orucun ruh için bir şey yaptığından şüphe ediliyorsa, cevap ispata değil, tecrübeye ve güvene dayanır.

      **"Sağlık içinse, bir doktor daha iyi bir şey önerebilir."** *Cevap:* Bildirilen amacı sağlık değil, *takvâ*dır. Sağlık etkileri mütevazı ve geçicidir (Fernando ve ark. 2019). *Sınır:* Yalnızca ölçülebilir sonuçlara değer veren biri iç bir amaçla ikna olmayacaktır.

      **"Kurallar keyfî."** *Cevap:* Pek çok kural bildirilmiş ya da açık amaçlara hizmet eder (Şâtıbî'nin beş külliyesi); diğerleri, dünya genelinde ibadete ortak bir biçim veren sabit ibadet biçimleridir. *Sınır:* Bazı ayrıntıların tam sebebi bilinmez ve Müslümanlar onları güvenle kabul eder.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **Classical jurists** — fasting is obligatory for every adult Muslim able to fast; exemptions as in 2:184–185, with the schools' differences on *fidya*.
      - **Al-Shatibi and the *maqāṣid* tradition** — the law serves five universal interests. (That worship keeps its fixed form is a common framing; no named source for it was read.)
      - **Some modern writers** — emphasise health benefits (which the evidence supports only modestly).
    tr: |-
      - **Klasik fakihler** — oruç, tutmaya gücü yeten her ergin Müslümana farzdır; muafiyetler 2:184–185'teki gibidir, mezheplerin *fidye* konusundaki farklarıyla.
      - **Şâtıbî ve *makâsıd* geleneği** — hukuk beş evrensel yarara hizmet eder. (İbadetin sabit biçimini koruduğu yaygın bir çerçevedir; onun için adı belli hiçbir kaynak okunmadı.)
      - **Bazı modern yazarlar** — sağlık faydalarını vurgular (deliller bunları yalnızca mütevazı ölçüde destekliyor).
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: Does God need my fasting, or is it purely for me?
      tr: Allah'ın orucuma ihtiyacı var mı, yoksa tamamen benim için mi?
    a:
      en: 'God does not need it (35:15; Bukhari 1903). It is for you: "that you may become righteous" (2:183).'
      tr: "Allah'ın ona ihtiyacı yoktur (35:15; Buhârî 1903). Senin içindir: \"Umulur ki korunursunuz.\" (2:183)."
  - q:
      en: How do I tell which rules have clear purposes and which are "pure devotion"?
      tr: Hangi kuralların açık amaçları olduğunu, hangilerinin "saf ibadet" olduğunu nasıl anlarım?
    a:
      en: Where a text states a reason, the rule is at least partly reasoned. Where a worship act has a fixed form without a stated reason (numbers, times), it is devotional.
      tr: Bir metnin sebep bildirdiği yerde kural en azından kısmen akli sebebe dayanır. Bir ibadetin bildirilmiş bir sebep olmadan sabit bir biçimi olduğu yerde (sayılar, vakitler) teabbüdîdir.
  - q:
      en: If a rule has no reason I can see, why is following it not blind obedience?
      tr: Bir kuralın göremediğim bir sebebi yoksa, ona uymak neden körü körüne itaat değildir?
    a:
      en: "Because trust can be reasoned: when a source has shown wisdom and care in what you can understand, it is reasonable to follow it in what you cannot."
      tr: "Çünkü güven akla dayanabilir: Bir kaynak anlayabildiğin şeylerde hikmet ve özen göstermişse, anlayamadığın şeylerde de onu izlemek makuldür."
  - q:
      en: What does Ramadan fasting involve, and who must do it?
      tr: Ramazan orucu neyi içerir ve kim tutmalıdır?
    a:
      en: No food, drink or sexual relations from dawn to sunset (2:187), for the month of Ramadan (2:185), for adult Muslims who are able.
      tr: Ramazan ayı boyunca (2:185), şafaktan güneş batana kadar yemek, içmek ve cinsel ilişki olmaz (2:187); gücü yeten ergin Müslümanlar için.
  - q:
      en: What is *taqwā*?
      tr: "*Takvâ* nedir?"
    a:
      en: Awareness of God that guards a person from what displeases Him; the stated purpose of the fast (2:183).
      tr: Kişiyi Allah'ın hoşnut olmadığı şeylerden koruyan Allah bilinci; orucun bildirilen amacı (2:183).
  - q:
      en: Who is exempt, and what do they do instead?
      tr: Kimler muaftır ve bunun yerine ne yaparlar?
    a:
      en: The ill and travellers make up the days. The very old and chronically ill pay *fidya* (feeding a poor person each day). Pregnant and breastfeeding women may not fast if they fear harm; the schools differ on whether they make up, pay *fidya*, or both.
      tr: Hastalar ve yolcular günleri kaza eder. Çok yaşlılar ve kronik hastalar *fidye* öder (her gün bir yoksulu doyurmak). Hamile ve emziren kadınlar zarardan korkarlarsa oruç tutmayabilir; mezhepler kaza mı edecekleri, *fidye* mi ödeyecekleri, yoksa ikisini birden mi yapacakları konusunda ayrılır.
