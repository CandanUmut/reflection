title:
  tr: Neden oruç? Neden bu kadar çok kural?
  en: Why fast? Why so many rules?
sensitivity: normal
helpCard: false
verses:
  - 2:183
steelman:
  tr: "\"Galaksilerin Yaratıcısı benim öğleden sonra saat ikide yemek yiyip yemediğimi neden umursasın? Allah hiçbir şeye muhtaç değilse, orucum O'na hiçbir şey kazandırmaz. Sağlığım içinse, bir doktor daha iyi bir şey önerebilir. Ve oruç sadece başlangıç: Yıkanmak, yemek, namaz kılmak, giyinmek, miras için kurallar var. Bazılarının amacı açık; pek çoğu keyfî görünüyor. Anlamadığım kurallara uymak körü körüne itaat gibi görünüyor.\""
  en: "\"Why would the Creator of galaxies care whether I eat at 2 p.m.? If God needs nothing, my fasting does nothing for Him. If it is for my health, a doctor could prescribe something better. And fasting is only the start: there are rules for washing, eating, praying, dressing, inheriting. Some have obvious purposes; many seem arbitrary. Following rules I can't understand looks like blind obedience.\""
whyAsked:
  tr: 'Ramazan, Müslüman dünyasında en yaygın uygulanan ibadettir ve aynı zamanda pek çok genç Müslümanın ilk kez "neden?" diye sorduğu yerdir. Sorunun iki yarısı vardır: Allah neden umursasın ve neden bu kadar çok kural var.'
  en: 'Ramadan is the most widely kept practice in the Muslim world, and also where many young Muslims first ask "why?". The question has two halves: why would God care, and why so many rules.'
shortAnswer:
  tr: "Allah'ın oruca ihtiyacı yoktur: \"Ey insanlar! Siz Allah'a muhtaçsınız. Allah ise zengin ve her hamde lâyıktır.\" (35:15). Hz. Peygamber (s.a.v.), bir kişi yalan sözü ve kötü işleri bırakmazsa, \"Allah'ın onun yemesini ve içmesini bırakmasına ihtiyacı olmadığını\" söyledi ({hadith:bukhari:1903}). Kur'an orucun amacını verir: \"Umulur ki korunursunuz.\" (2:183) — *takvâ*, Allah'ın sürekli bilincinde olmak. Oruç, şafaktan güneş batana kadar yemek, içmek ve cinsel ilişki olmadan tutulur (2:187); hastalar ve yolcular günleri sonra kaza eder, oruca ancak büyük bir güçlükle dayanabilenler ise bunun yerine bir yoksulu doyurur (2:184–185). Kurallara gelince, Şâtıbî şeriatın bir bütün olarak beş amaca hizmet ettiğini savundu — din, can, akıl, aile ve mal. İbadetlerin, tam sebepleri bildirilmediği yerde bile sabit biçimlerini korudukları yaygın bir çerçevedir, ama bunun için adı belli bir kaynak okunmadı. Ramazan orucunun sağlık etkileri gerçektir ama mütevazı ve geçicidir ve orucun sebebi bunlar değildir."
  en: "God does not need the fast: \"O mankind, you are those in need of Allah, while Allah is the Free of need, the Praiseworthy\" (35:15). The Prophet (pbuh) said that if a person does not give up false speech and evil actions, \"Allah is not in need of his leaving his food and drink\" ({hadith:bukhari:1903}). The Quran gives the fast's purpose: \"that you may become righteous\" (2:183) — *taqwā*, a constant awareness of God. Fasting is from dawn to sunset, with no food, drink or sexual relations (2:187); the ill and travellers make up the days later, and those who can fast only with great hardship feed a poor person instead (2:184–185). As for rules, al-Shatibi held that the Sharia as a whole serves five purposes — religion, life, intellect, family and wealth. That acts of worship keep their fixed form even where their full reason is not stated is a common framing, but no named source for it was read. Health effects of Ramadan fasting are real but modest and temporary, and they are not its reason."
layers:
  - kind: religious
    tr: |
      "Takvaya eresiniz diye" (2:183). Yalan sözü durdurmayan bir orucun değeri yoktur (Buhârî 1903). Şâtıbî: ibadetlerde asıl olan teabbüddür.
    en: '"So that you may attain *taqwā*" (2:183). A fast that does not stop false speech is worthless (Bukhārī 1903). Al-Shāṭibī: in acts of worship, devotion is the default.'
  - kind: philosophical
    tr: |
      Pratik karakteri şekillendirir.
    en: Practice shapes character.
  - kind: scientific
    tr: |
      11 meta-analizin bir şemsiye derlemesi ([*Nutrition Reviews* 2025](https://academic.oup.com/nutritionreviews/article-abstract/83/2/e711/7604369)) faydalar buldu. Kilo, Ramazan sonunda 1,24 kg azalır, ama kayıp 2–6 hafta içinde 0,27 kg'a iner (*Nutrients* 2019).
    en: An umbrella review of 11 meta-analyses ([*Nutrition Reviews* 2025](https://academic.oup.com/nutritionreviews/article-abstract/83/2/e711/7604369)) found benefits. Weight drops 1.24 kg by the end of Ramadan, but the loss shrinks to 0.27 kg within 2–6 weeks (*Nutrients* 2019).
  - kind: psychological
    tr: |
      Yeme bozukluğu ya da diyabeti olanlar tıbbi tavsiye almalıdır; muafiyetler bir rahmettir.
    en: People with eating disorders or diabetes should take medical advice; the exemptions are a mercy.
honestLimits:
  tr: Şâtıbî'nin kendi metnine ve ibadetin aslen teabbüdî olduğuna dair herhangi bir ifadesine henüz başvurulmadı. Hamile ve emziren kadınlarla ilgili Mâlikî görüşü ele alınmadı. Şemsiye derleme tam metninden değil, özetinden (Mainz Üniversitesi bibliyografya kaydı) okundu. Ramazan sırasında öz denetim ya da empati üzerine hiçbir çalışma ve oruç riskleri üzerine hiçbir klinik kılavuz okunmadı.
  en: Al-Shatibi's own text, and any statement of his on worship being devotional by default, have not yet been consulted. The Maliki position on pregnant and breastfeeding women was not covered. The umbrella review was read through its abstract (Mainz university bibliography record), not its full text. No study of self-control or empathy during Ramadan, and no clinical guideline on fasting risks, was read.
