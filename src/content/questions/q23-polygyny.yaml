steelman:
  tr: "\"Bir erkek dört kadına kadar evlenebilir; bir kadının ise yalnızca bir kocası olabilir. Kur'an bunu adalet şartına bağlıyor, sonra da erkeklerin eşler arasında adaletli davranmaya 'güç yetiremeyeceğini' söylüyor (4:129) — yine de hukuk bunu korudu. Peygamber'in kendisinin dörtten fazla eşi vardı. Araştırmalar kumalar arasında daha fazla depresyon ve kaygı buluyor. Ve uygulamada ikinci eş çoğu zaman gizlice, tescil edilmemiş dinî bir törenle alınıyor ve bu da onu ve çocuklarını yasal haklardan yoksun bırakıyor.\""
  en: "\"A man may marry up to four wives; a woman may have only one husband. The Quran makes it conditional on justice and then says men 'will never be able to be equal' between wives (4:129) — yet the law kept it. The Prophet himself had more than four. Studies find more depression and anxiety among co-wives. And in practice, a second wife is often taken in secret, through an unregistered religious ceremony, leaving her and her children without legal rights.\""
whyAsked:
  tr: Kadınlar bundan korkuyor ve bazıları bununla yaşıyor. Türkiye dahil birkaç ülkede yalnızca dinî nikâh, kadınları yasal korumadan yoksun bırakıyor. Erkekler bunun bir hak mı yoksa bir yük mü olduğunu soruyor.
  en: Women fear it, and some live with it. In several countries, including Türkiye, religious-only marriages leave women without legal protection. Men ask whether it is a right or a burden.
shortAnswer:
  tr: "Kur'an bir erkeğe katı bir şartla dört eşe kadar izin verir — \"Eğer adaleti gözetmemekten korkarsanız, o zaman bir tane ile… yetinin\" (4:3) — ve sonra eşler arasında tam adaletin imkânsız olduğunu söyler (4:129). Pek çokları 4:129'u erkeğin kontrol edemediği sevgiyle, 4:3'ü ise kontrol edebildiği adil davranışla ilgili olarak okudu ve böylece çok eşliliği şarta bağlı bir izin olarak korudu (Saheeh International'ın İngilizce çevirisindeki \"[in feeling]\" (\"[duygularda]\") köşeli parantezi bu okumayı yansıtır; bunun için adı belli bir klasik kaynağa burada henüz başvurulmadı). Muhammed Abduh gibi modern reformcular iki âyeti birlikte, devletin uygulayabileceği güçlü bir kısıtlama olarak okudu; Tunus 1956'da bu temelde çok eşliliği yasakladı. Hanbelî mezhebinde kadın, tek eşliliği nikâh akdinin bağlayıcı bir şartı yapabilir. Çok eşlilik nadirdir: Dünya nüfusunun yaklaşık %2'si çok eşli hanelerde yaşıyor; Pakistan ve Mısır gibi ülkelerde Müslüman erkeklerin %1'inden azı. Araştırmalar bunu kadınların ruh sağlığının daha kötü olmasıyla ilişkilendiriyor. Medeni kanunu atlayan yalnızca dinî nikâhlar kadınları ciddi bir risk altına sokuyor."
  en: "The Quran permits a man up to four wives, on a strict condition — \"if you fear that you will not be just, then [marry only] one\" (4:3) — and then says full equality between wives is impossible (4:129). Many read 4:129 as being about love, which a man cannot control, and 4:3 as being about fair treatment, which he can, and so kept polygyny as a conditional permission (Saheeh's bracket \"[in feeling]\" reflects this reading; a named classical source for it has not yet been consulted here). Modern reformers such as Muhammad ʿAbduh read the two verses together as a strong restriction that the state may enforce; Tunisia banned polygyny in 1956 on that basis. In the Hanbali school, a wife may make monogamy a binding condition of her marriage contract. Polygyny is rare: about 2% of the world's population lives in polygamous households, and fewer than 1% of Muslim men in countries like Pakistan and Egypt. Research links it to worse mental health for women. Religious-only marriages that bypass the civil law put women at serious risk."
layers:
  - kind: religious
    tr: |
      Temel âyetler 4:3 (yetimlerin hakları bağlamında indi) ve 4:129'dur. Bir eşini kayıran adam Kıyamet günü "bir yanı sarkık olarak" gelir (Ebû Dâvûd 2133). Hz. Peygamber Ali'nin ikinci bir eş almasına itiraz etti (Buhârî 5230). Yorumlar:
      - **Çoğunluk:** 4:129 sevgiyle, 4:3 nafakayla ilgilidir.
      - **Abduh ve Rızâ:** birlikte okunduğunda âyetler, devletin uygulayabileceği bir sınırlamadır.
      - **Tunus (1956):** çok eşliliği Kur'anî gerekçelerle yasakladı.
      - **Mevdûdî (Urduca):** âyet çok eşliliği adalet şartına bağlar.
      - **Endonezya:** ilke olarak tek eşlidir, ama mahkeme izniyle çok eşliliğe izin verir.
    en: |-
      The key verses are 4:3 (revealed in the context of orphans' rights) and 4:129. A man who favours one wife will come on Judgement Day "with one side drooping" (Abū Dāwūd 2133). The Prophet objected to ʿAlī taking a second wife (Bukhārī 5230). Interpretations:
      - **Majority:** 4:129 is about love; 4:3 is about maintenance.
      - **ʿAbduh and Riḍā:** read together, the verses are a restriction the state may enforce.
      - **Tunisia (1956):** banned polygyny on Quranic grounds.
      - **Mawdūdī (Urdu):** the verse makes polygyny conditional on justice.
      - **Indonesia:** monogamous in principle but allows polygamy with court permission.
  - kind: philosophical
    tr: |
      Savunucular dulları koruduğunu söyler. Eleştirmenler asimetriye dikkat çeker. Kısmi bir cevap: Hanbelî mezhebinde (İbn Teymiyye) kadın, evlilik sözleşmesine tek eşliliği şart koyabilir.
    en: "Defenders say it protects widows. Critics point to the asymmetry. A partial reply: in the Ḥanbalī school (Ibn Taymiyya), a wife can make monogamy a condition of her marriage contract."
  - kind: scientific
    tr: |
      Dünya nüfusunun yalnızca yaklaşık %2'si çok eşli hanelerde yaşıyor ve çoğu ülkede bu oran %0,5'in altında (Pew Araştırma Merkezi, 7 Aralık 2020).
    en: Only about 2% of the world's population lives in polygamous households, and in most countries the share is under 0.5% (Pew Research Center, 7 December 2020).
  - kind: psychological
    tr: |
      Kadınlar haklarını bilmelidir: zarar (*darar*) sebebiyle boşanma ve danışmanlığa erişim.
    en: "Women should know their rights: divorce for harm (*ḍarar*) and access to counselling."
honestLimits:
  tr: "\"Kur'an çok eşliliği yasaklar\" ve \"Kur'an çok eşliliği teşvik eder\" sözlerinin ikisi de metni çarpıtır. Asimetrinin klasik bir açıklaması (neseb) vardır, ama her okuyucuyu tatmin edecek bir cevabı yoktur. Onu kısıtlamak meşru bir *içtihat*tır, ama modern bir içtihattır. *Tefsîrü'l-Menâr*'a, Mevdûdî'ye ve Endonezya çalışmasına henüz başvurulmadı."
  en: '"The Quran bans polygyny" and "the Quran encourages polygyny" both distort the text. The asymmetry has a classical explanation (lineage) but no answer that will satisfy every reader. Restricting it is a legitimate *ijtihād*, but it is a modern one. *Tafsir al-Manar*, Mawdudi and the Indonesian study have not yet been consulted.'
