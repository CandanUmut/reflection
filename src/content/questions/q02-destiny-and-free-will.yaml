steelman:
  tr: |
    Allah her fiili ezelden takdir ettiyse, başka türlü davranamazdım. O zaman ceza adaletsiz, çaba anlamsız görünür.
  en: "\"The Quran says God created 'all things with predestination' (54:49), that every disaster is 'in a register before We bring it into being' (57:22), and that 'you do not will except that Allah wills' (81:29). Muslim theologians go further: God does not only *know* what I will do; He *creates* my acts. If God creates my act, and wrote it before I was born, in what sense is it mine? I could not have done otherwise. Then punishing me looks unjust, and my effort looks pointless. The usual answer — 'knowing is not causing' — only answers the easy half of the problem.\""
whyAsked:
  tr: |
    Cehennemlik "yazılmış" olma korkusu, felç olma hâli, suçluluk. Kader, Türkiye'de başlıca kırılma noktalarından biridir.
  en: Because the doctrine of *qadar* (divine decree) is part of the creed, and because ordinary people meet it at hard moments. Some fear they are "written" for Hell whatever they do. Some use "it is written" to excuse themselves. Some freeze. For a person with religious OCD, the question can become a loop of fear.
shortAnswer:
  tr: |
    Bilmek, sebep olmak değildir. İslam hem takdiri hem gerçek seçimi (kesb, cüz'î irade) kabul eder ve insanları yalnızca güçleri ölçüsünde sorumlu tutar (2:286). "Öyleyse niçin amel edelim?" diye sorulduğunda Hz. Peygamber şöyle cevap verdi: amel edin, herkes ne için yaratıldıysa ona kolaylaştırılır (Buhârî 4949).
  en: "Islam affirms two things at once: God's decree covers everything, and human beings really choose and are really answerable — but only within their capacity: \"Allah does not charge a soul except [with that within] its capacity\" (2:286). There are two problems here, not one. The first — God *knows* what I will do — is the easier: knowing is not forcing. The second — God *creates* what I do — is the hard one, and Muslim theologians answered it in different ways. The Ashʿaris said God creates the act and the human \"acquires\" (*kasb*) it; the Maturidis said the human really chooses, with a will God created, and is the real doer. *Encyclopaedia Britannica* notes that *kasb* \"remained one of the most vague theories in Islāmic theology\". When the Companions asked the Prophet (pbuh), \"Shall we not depend upon what has been written for us and give up deeds?\", he answered: \"Carry on doing (good) deeds, for everybody will find easy to do such deeds as will lead him to his destined place\" ({hadith:bukhari:4949}). No one knows what is written for them; what they know is the choice in front of them."
