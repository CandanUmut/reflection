honestLimits:
  tr: |
    Gelenek kadere bir sır (*sirr*) der.
  en: The hardest version of the problem — that God creates acts, not only knows them — has answers, but no answer that removes all difficulty; Britannica calls *kasb* "one of the most vague theories in Islāmic theology". Al-Maturidi's *Kitāb al-Tawḥīd*, al-Ghazali's *al-Iqtiṣād*, the TDV articles "Kader" and "Cebriyye", and Elmalılı have not yet been consulted directly. The neuroscience shows that Libet's experiments do not settle free will; it does not show that free will exists.
