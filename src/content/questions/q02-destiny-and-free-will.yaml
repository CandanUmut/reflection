id: Q2
slugs:
  tr: kader-ve-ozgurluk
  en: destiny-and-free-will
order: 2
theme: destiny
title:
  tr: Her şey yazılmışsa, nasıl özgürüm?
  en: If everything is written, how am I free?
sensitivity: normal
helpCard: false
verses:
  - 2:286
  - 18:29
  - 81:29
steelman:
  tr: |
    Allah her fiili ezelden takdir ettiyse, başka türlü davranamazdım. O zaman ceza adaletsiz, çaba anlamsız görünür.
  en: If God decreed every act from eternity, I could not have done otherwise. Punishment then looks unjust and effort pointless.
whyAsked:
  tr: |
    Cehennemlik "yazılmış" olma korkusu, felç olma hâli, suçluluk. Kader, Türkiye'de başlıca kırılma noktalarından biridir.
  en: Fear of being "written" for Hell, paralysis, guilt. Kader is a top Turkish fracture point.
shortAnswer:
  tr: |
    Bilmek, sebep olmak değildir. İslam hem takdiri hem gerçek seçimi (kesb, cüz'î irade) kabul eder ve insanları yalnızca güçleri ölçüsünde sorumlu tutar (2:286). "Öyleyse niçin amel edelim?" diye sorulduğunda Hz. Peygamber şöyle cevap verdi: amel edin, herkes ne için yaratıldıysa ona kolaylaştırılır (Buhârî 4949).
  en: "Knowing something is not causing it. Islam affirms both decree and real choice (kasb, cüz'î irade), and holds people accountable only within their capacity (2:286). Asked \"why act?\", the Prophet answered: act, each is eased toward what they were created for (Bukhari 4949)."
layers:
  - kind: religious
    tr: |
      - Kur'an: 18:29 ("dileyen iman etsin"); 81:29 ("Allah dilemedikçe siz dileyemezsiniz").
      - Eş'arîler: fiilleri Allah yaratır, insanlar onları "kesbeder". Mâtürîdîler seçime daha güçlü bir rol verir; Elmalılı gibi Türk kelâmcıların tercih ettiği görüş budur. [Scholarly]
      - Nursî: cüz'î irade küçüktür ama belirleyicidir.
    en: |-
      - Quran: 18:29 ("whoever wills, let him believe"); 81:29 ("you do not will unless God wills").
      - Ash'aris: God creates acts and humans "acquire" them. Maturidis give choice a stronger role, the view favoured by Turkish theologians such as Elmalılı. [Scholarly]
      - Nursi: partial will is small but decisive.
  - kind: philosophical
    tr: |
      - Cevaplar: zamanın dışındaki bilgi, uyumculuk (compatibilizm) ve Frankfurt örnekleri.
      - En güçlü itiraz: Allah'ın fiilleri yalnızca bilmesi değil, yaratması. Müslüman kelâmcıların kendileri de kesbi kapalı bir kavram olarak nitelendirdi. [Debated]
    en: |-
      - Responses: atemporal knowledge, compatibilism and Frankfurt cases.
      - Strongest objection: God creating acts, not merely knowing them. Muslim theologians themselves have called kasb obscure. [Debated]
  - kind: scientific
    tr: |
      Libet deneyleri özgür irade meselesini çözmez. [Scholarly]
    en: The Libet experiments do not settle free will. [Scholarly]
  - kind: psychological
    tr: |
      Kaderci okumalar depresyonu ve dinî titizliği (vesvese) besleyebilir.
    en: Fatalistic readings can feed depression and scrupulosity.
honestLimits:
  tr: |
    Gelenek kadere bir sır (*sır*) der.
  en: The tradition calls qadar a mystery (sirr).
