honestLimits:
  tr: |
    Bir miktar sır kalır.
  en: The classical schools agree that God creates without need, but they explain His reasons differently, and none claims to know them fully. The answer to suffering and Hell relies partly on trusting God's knowledge, which will not persuade someone who does not already trust Him. Ibn al-Qayyim's *Shifāʾ al-ʿAlīl* and al-Tabari's tafsir of 51:56 have not yet been consulted.
