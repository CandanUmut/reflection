id: Q29
slugs:
  tr: neden-yaratti
  en: why-create
order: 29
theme: meaning
title:
  tr: Kendine yeterli bir Allah neden yaratsın?
  en: Why would a self-sufficient God create?
sensitivity: normal
helpCard: false
verses:
  - 51:56
steelman:
  tr: |
    Allah hiçbir şeye muhtaç değilse, yaratmak keyfî görünür ve "bana ibadet etsinler diye" (51:56) övgüye ihtiyaç gibi geliyor.
  en: If God needs nothing, creating seems arbitrary, and "to worship Me" (51:56) sounds like a need for praise.
whyAsked:
  tr: |
    Anlam krizleri.
  en: Crises of meaning.
shortAnswer:
  tr: |
    Allah ihtiyaçtan değil, cömertlik ve hikmetten yaratır. 51:56'daki *ibadet*, Allah'ı tanımak olarak okunur; bu da bizim gelişip serpilmemizdir.
  en: God creates from generosity and wisdom, not need. *ʿIbāda* (worship) in 51:56 is read as coming to know God, which is our flourishing.
layers:
  - kind: religious
    tr: |
      Mücâhid 51:56'yı "beni tanısınlar diye" okudu. İbn Teymiyye'ye göre "Gizli bir hazineydim" sözünün senedi yoktur [Debated]. Eş'arîler Allah'ın amaçlar için iş yaptığını reddeder; Mâtürîdîler ve İbn Kayyim Allah'ın hikmetle (*hikmet*) iş yaptığını kabul eder.
    en: Mujāhid read 51:56 as "to know Me." According to Ibn Taymiyya, "I was a hidden treasure" has no chain [Debated]. Ashʿarīs deny that God acts for purposes; Māturīdīs and Ibn al-Qayyim affirm that God acts with wisdom (*ḥikma*).
  - kind: philosophical
    tr: |
      İyilik doğası gereği kendini paylaşır.
    en: Goodness naturally shares itself.
  - kind: scientific
    tr: |
      Anlam duygusu iyi oluşu yordar (Steger; Frankl).
    en: A sense of meaning predicts well-being (Steger; Frankl).
  - kind: psychological
    tr: |
      Anlam soruları umutsuzlukla birlikte geliyorsa, profesyonel destek alınmalıdır.
    en: If questions of meaning come with hopelessness, seek professional care.
honestLimits:
  tr: |
    Bir miktar sır kalır.
  en: Some mystery remains.
visualizations:
  - id: ideas
    tr: |
      Işık saçan bir kaynak. Bir 51:56 kartı. Bir tefekkür alıştırması.
    en: A radiating light. A 51:56 card. A reflection exercise.
