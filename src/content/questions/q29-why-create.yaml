    tr: |
      Mücâhid 51:56'yı "beni tanısınlar diye" okudu. İbn Teymiyye'ye göre "Gizli bir hazineydim" sözünün senedi yoktur [Debated]. Eş'arîler Allah'ın amaçlar için iş yaptığını reddeder; Mâtürîdîler ve İbn Kayyim Allah'ın hikmetle (*hikmet*) iş yaptığını kabul eder.
    en: Mujāhid read 51:56 as "to know Me." According to Ibn Taymiyya, "I was a hidden treasure" has no chain [Debated]. Ashʿarīs deny that God acts for purposes; Māturīdīs and Ibn al-Qayyim affirm that God acts with wisdom (*ḥikma*).
