  en: prayer-and-dryness
order: 10
theme: worship
title:
  tr: Neden günde beş vakit namaz, ve neden hiçbir şey hissetmiyorum?
  en: Why five daily prayers, and why do I feel nothing?
sensitivity: normal
helpCard: false
verses:
  - 20:14
  - 23:1-2
steelman:
  tr: |
    Yabancı bir dilde, belirli beş namaz mekanik hissettirebilir. Hiçbir şey hissetmiyorsam, bu boş bir ritüel, hatta ikiyüzlülük değil mi?
  en: Five fixed prayers in a foreign language can feel mechanical. If I feel nothing, isn't it hollow ritual, even hypocrisy?
whyAsked:
  tr: |
    Ritüelin akıl dışı görülmesi; manevî kuruluk ve suçluluk; anlamı öğretilmeden bir görev olarak öğretilen namaz. TİDA'ya göre Türkiye'de 25 yaş altındakilerin yalnızca yaklaşık beşte biri namaz kılıyor.
  en: Ritual seen as anti-rational; spiritual dryness and guilt; prayer taught as duty without meaning. TİDA finds only about one in five under-25s in Türkiye pray.
shortAnswer:
  tr: |
    Hiçbir şey hissetmemek yaygındır ve bin yıldır tartışılır; namazın boş olduğunu kanıtlamaz. Namaz önce, duyguyla ya da duygusuz, Allah'a dönmenin bir ritmidir (20:14). Kalp huzuru (*huşû*), kelimeleri anlamakla, yavaşlamakla ve sabırla büyür. Kuraklık dönemlerinde ritmi sürdürmek ikiyüzlülük değil, vefadır.
  en: Feeling nothing is common and has been discussed for a thousand years; it doesn't prove prayer empty. Prayer is first a rhythm of returning to God (20:14), with or without emotion. Presence of heart (khushūʿ) grows with understanding the words, slowing down and patience. Keeping the rhythm while dry is fidelity, not hypocrisy.
layers:
  - kind: religious
    tr: |
      - *Âyetler:* 20:14; 29:45; 23:1–2; 107:4–5.
      - *Beş vakit:* sayı Mi'rac hadisinden gelir (Buhârî 349; Müslim 162); Kur'an vakitlere işaret eder (11:114; 17:78; 30:17–18). Bazı Türk Kur'ancılar üç vakit savunur [Debated].
      - *Klasik:* Gazzâlî (*Esrârü's-Salât*) altı iç anlam sayar: huzur, anlama, tazim, heybet, ümit, hayâ; kalp huzuru olmadan kılınan namaz fıkhî borcu yerine getirir ama manevî olarak zayıftır. İbn Kayyim namaz kılanların beş derecesini anlatır.
      - *Tasavvuf:* Kuşeyrî'nin kabz ve bast anlatımı, kuru dönemleri olağan sayar.
    en: |-
      - *Verses:* 20:14; 29:45; 23:1–2; 107:4–5.
      - *Five times:* the number comes from the Miʿrāj hadith (Bukhārī 349; Muslim 162); the Quran indicates times (11:114; 17:78; 30:17–18). Some Turkish Quranists argue for three [Debated].
      - *Classical:* al-Ghazālī (Asrār al-Ṣalāt) lists six inner meanings: presence, understanding, reverence, awe, hope, shame; a prayer without presence fulfils the legal duty but is spiritually thin. Ibn al-Qayyim describes five grades of praying people.
      - *Sufi:* al-Qushayrī on qabḍ and basṭ normalizes dry phases.
  - kind: philosophical
    tr: |
      Alışkanlık teorisi (Aristoteles; Miskeveyh): erdemler, hissedilmeden önce tekrarlanan davranışlarla oluşur. İtiraz: duygusuz ritüel sahicilikten yoksundur. Cevap: sahicilik, evlilikte olduğu gibi uzun soluklu bağlılıktır.
    en: "Habit theory (Aristotle; Miskawayh): virtues form by repeated acts before they are felt. Objection: ritual without feeling is inauthentic. Response: authenticity is long commitment, as in marriage."
  - kind: scientific
    tr: |
      [Debated] Yapılandırılmış ritüel belirsizlik altında kaygıyı azaltabilir; Müslüman namazı üzerine çalışmalar küçük örneklemlerde fizyolojik değişiklikler gösterir.
    en: "[Debated] Structured ritual can lower anxiety under uncertainty; studies of Muslim prayer show physiological changes in small samples."
  - kind: psychological
    tr: |
      "Hiçbir şey hissetmemek" her şeyi kapsıyorsa (yemek, arkadaşlar), bir ruh sağlığı kontrolü önerilmelidir. Abdesti tekrarlamak ya da namazın geçersiz olmasından korkmak klasik vesvesedir; klasik kural, bitirdikten sonraki aşırı şüpheyi dikkate almamaktır.
    en: If "feeling nothing" covers everything (food, friends), suggest a mental-health check. Repeating ablution or fearing invalid prayer is classic vesvese; the classical rule ignores excessive doubt after finishing.
honestLimits:
  tr: |
    Beş sayısı, açık bir Kur'an sayısına değil, hadise ve uygulamaya dayanır. Hiçbir teknik duyguyu garanti etmez.
  en: The five-count rests on hadith and practice, not an explicit Quranic number. No technique guarantees feeling.
