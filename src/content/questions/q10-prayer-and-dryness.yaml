      - *Beş vakit:* sayı Mi'rac hadisinden gelir (Buhârî 349; Müslim 162); Kur'an vakitlere işaret eder (11:114; 17:78; 30:17–18). Bazı Türk Kur'ancılar üç vakit savunur [Debated].
      - *Klasik:* Gazzâlî (*Esrârü's-Salât*) altı iç anlam sayar: huzur, anlama, tazim, heybet, ümit, hayâ; kalp huzuru olmadan kılınan namaz fıkhî borcu yerine getirir ama manevî olarak zayıftır. İbn Kayyim namaz kılanların beş derecesini anlatır.
      - *Tasavvuf:* Kuşeyrî'nin kabz ve bast anlatımı, kuru dönemleri olağan sayar.
    en: |-
      - *Verses:* 20:14; 29:45; 23:1–2; 107:4–5.
      - *Five times:* the number comes from the Miʿrāj hadith (Bukhārī 349; Muslim 162); the Quran indicates times (11:114; 17:78; 30:17–18). Some Turkish Quranists argue for three [Debated].
      - *Classical:* al-Ghazālī (Asrār al-Ṣalāt) lists six inner meanings: presence, understanding, reverence, awe, hope, shame; a prayer without presence fulfils the legal duty but is spiritually thin. Ibn al-Qayyim describes five grades of praying people.
      - *Sufi:* al-Qushayrī on qabḍ and basṭ normalizes dry phases.
  - kind: philosophical
    tr: |
      Alışkanlık teorisi (Aristoteles; Miskeveyh): erdemler, hissedilmeden önce tekrarlanan davranışlarla oluşur. İtiraz: duygusuz ritüel sahicilikten yoksundur. Cevap: sahicilik, evlilikte olduğu gibi uzun soluklu bağlılıktır.
    en: "Habit theory (Aristotle; Miskawayh): virtues form by repeated acts before they are felt. Objection: ritual without feeling is inauthentic. Response: authenticity is long commitment, as in marriage."
  - kind: scientific
    tr: |
      [Debated] Yapılandırılmış ritüel belirsizlik altında kaygıyı azaltabilir; Müslüman namazı üzerine çalışmalar küçük örneklemlerde fizyolojik değişiklikler gösterir.
    en: "[Debated] Structured ritual can lower anxiety under uncertainty; studies of Muslim prayer show physiological changes in small samples."
  - kind: psychological
    tr: |
      "Hiçbir şey hissetmemek" her şeyi kapsıyorsa (yemek, arkadaşlar), bir ruh sağlığı kontrolü yardımcı olabilir. Abdesti tekrarlamak ya da namazın geçersiz olmasından korkmak klasik vesvesedir; klasik kural, bitirdikten sonraki aşırı şüpheyi dikkate almamaktır.
    en: If "feeling nothing" covers everything (food, friends), a mental-health check can help. Repeating ablution or fearing invalid prayer is classic vesvese; the classical rule ignores excessive doubt after finishing.
honestLimits:
  tr: |
    Beş sayısı, açık bir Kur'an sayısına değil, hadise ve uygulamaya dayanır. Hiçbir teknik duyguyu garanti etmez.
  en: No technique guarantees feeling. Al-Ghazali's *Asrār al-Ṣalāt*, al-Qushayri's own text, the Quran's prayer-time verses (11:114; 17:78) in verified text, and any study of prayer's physiological effects have not yet been consulted. The practical steps beyond Rabbani's are general teaching, not sourced here.
