title:
  tr: Neden günde beş vakit namaz, ve neden hiçbir şey hissetmiyorum?
  en: Why five daily prayers, and why do I feel nothing?
sensitivity: normal
helpCard: general
verses:
  - 20:14
  - 23:1-2
steelman:
  tr: |
    Yabancı bir dilde, belirli beş namaz mekanik hissettirebilir. Hiçbir şey hissetmiyorsam, bu boş bir ritüel, hatta ikiyüzlülük değil mi?
  en: "\"Five times a day, in a language I barely understand, with fixed words and movements. I do it, and I feel nothing. If prayer is supposed to be a conversation with God and my heart isn't in it, isn't it hollow — even hypocrisy? And why five? The Quran never says 'five'. Some people say the Quran mentions only three prayer times.\""
whyAsked:
  tr: |
    Ritüelin akıl dışı görülmesi; manevî kuruluk ve suçluluk; anlamı öğretilmeden bir görev olarak öğretilen namaz. TİDA'ya göre Türkiye'de 25 yaş altındakilerin yalnızca yaklaşık beşte biri namaz kılıyor.
  en: Because almost everyone who prays regularly has dry periods. And because the number five is taught early, while the Quran's verses on prayer times are not, so a reader who opens the Quran looking for "five" is surprised.
shortAnswer:
  tr: |
    Hiçbir şey hissetmemek yaygındır ve bin yıldır tartışılır; namazın boş olduğunu kanıtlamaz. Namaz önce, duyguyla ya da duygusuz, Allah'a dönmenin bir ritmidir (20:14). Kalp huzuru (*huşû*), kelimeleri anlamakla, yavaşlamakla ve sabırla büyür. Kuraklık dönemlerinde ritmi sürdürmek ikiyüzlülük değil, vefadır.
  en: "Feeling nothing in prayer is common, has been discussed for a thousand years, and does not make the prayer worthless. The Quran's first purpose for prayer is remembrance: \"establish prayer for My remembrance\" (20:14). Ibn al-Qayyim described five grades of people in prayer, from the careless to those whose heart is fully before God; the one who keeps praying while struggling with distraction is not the lowest but in the middle, and the one who resists distraction is \"redeemed\". The Prophet (pbuh) said that the one who recites the Quran with difficulty gets a double reward ({hadith:bukhari:4937}). Presence of heart (*khushūʿ*) grows with understanding the words, slowing down and preparation. The number five comes from the report of the Miʿrāj in Bukhari and Muslim and from unbroken practice; the Quran names prayer times without counting them."
layers:
