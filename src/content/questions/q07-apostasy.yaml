title:
  tr: İslam'dan çıkmanın cezası ölüm mü?
  en: Is leaving Islam punishable by death?
sensitivity: high
helpCard: general
verses:
  - 2:256
  - 2:217
steelman:
  tr: "\"En güvendiğiniz hadis kitabı Peygamber'in şöyle dediğini bildiriyor: 'Dinini değiştireni öldürün.' 'Devlete ihanet edeni' demiyor. Bütün Sünnî mezhepler bunu hukuk hâline getirdi ve fakihler buna icmâ dedi. İnsanlar hâlâ bu tür kanunlarla mahkûm ediliyor ve Pew'in 2013 anketinde şeriatı destekleyen Mısırlı Müslümanların %86'sı mürtedlerin idamını destekledi. 'İhanet' okuması, Batı baskısı altında yapılmış yeni bir icat gibi görünüyor. İslam doğruysa, Allah onun doğru olmadığı sonucuna dürüstçe vardığım için neden hayatımı tehdit etsin?\""
  en: "\"Your most trusted hadith book reports the Prophet saying, 'Whoever changes his religion, kill him.' It does not say 'whoever betrays the state.' Every Sunni school made that law, and jurists called it consensus. People are still sentenced under such laws, and in Pew's 2013 survey 86% of Egyptian Muslims who back sharia supported executing apostates. The 'treason' reading looks like a recent invention made under Western pressure. If Islam is true, why would God threaten my life for honestly concluding it is not?\""
whyAsked:
  tr: Şüphe edenler bunu, kendi güvenlikleri ve aile ilişkileri cevaba bağlı olabileceği için sorar. Dışarıdan bakanlar bunu, İslam'ın vicdan özgürlüğünü kabul edip etmediğinin en açık sınavı olarak görür. Öğrenciler, klasik hükmün metne dayalı savunması güçlü olduğu için bunu sorar ve reformcu savunmanın dürüst bir ilmî çalışma olup olmadığını bilmek ister.
  en: People who doubt ask because their own safety and their family relationships may depend on the answer. Outsiders see this as the clearest test of whether Islam accepts freedom of conscience. Students ask because the textual case for the classical ruling is strong, and they want to know whether the reformist case is honest scholarship.
shortAnswer:
  tr: "Dört Sünnî mezhebin hepsi, İslam'dan çıkan ve geri dönmeyi reddeden ergin ve akıllı bir erkeğin, tövbeye davet edildikten sonra idam edileceğini kabul etti. Bunu sahih hadislere dayandırırlar; dolayısıyla hüküm geç dönem bir icat değildir. Üç mezhep bunu kadınlara da uygular; Hanefîler ise kadınları bunun yerine hapseder. Rivayete göre erken dönemden bir azınlık idamı desteklemedi: Hz. Ömer, İbrâhim en-Nehaî ve Süfyân es-Sevrî. Bazı modern âlimler, Hz. Peygamber'in (s.a.v.) hiç kimseyi yalnızca inancını değiştirdiği için idam etmediğini ve hadisin topluma düşmanlıkla birleşen irtidadı hedef aldığını savunur; Tâhâ Câbir el-Ulvânî bu görüştedir, Ali Cuma da 2007'de bu görüşteydi, ancak sözlerinin ifadesi daha sonra tartışma konusu oldu. Bu okuma ciddidir ama tartışmalıdır, çünkü hadisin sözleri geneldir. Şüphe etmek suç değildir ve şüphe eden biri İslam'dan çıkmış değildir."
  en: "All four Sunni schools held that an adult, sane man who leaves Islam and refuses to return is to be executed after being asked to repent. They base this on authentic hadith, so the ruling is not a late invention. Three schools apply it to women too; the Hanafis imprison women instead. A minority of early figures reportedly did not support execution: ʿUmar, Ibrahim al-Nakhaʿi and Sufyan al-Thawri. Some modern scholars argue that the Prophet (pbuh) never executed anyone only for changing belief, and that the hadith targeted apostasy joined with hostility to the community; Taha Jabir Alalwani holds this view, and so did Ali Gomaa in 2007, though his wording was later disputed. That reading is serious but contested, because the words of the hadith are general. Doubting is not a crime, and someone who doubts has not left Islam."
