id: Q7
slugs:
  tr: dinden-donme
  en: apostasy
order: 7
theme: apostasy
title:
  tr: İslam'dan çıkmanın cezası ölüm mü?
  en: Is leaving Islam punishable by death?
sensitivity: high
helpCard: general
verses:
  - 2:256
  - 2:217
steelman:
  tr: |
    Klasik hukuk, "dinini değiştireni öldürün" rivayetine dayanarak (Buhârî 3017) dinden dönen erkeğe ölüm cezası öngördü. Eğer öyleyse, inanç özgür değildir.
  en: Classical law prescribed death for the male apostate, citing "whoever changes his religion, kill him" (Bukhari 3017). If so, faith is not free.
whyAsked:
  tr: |
    Şüphe yaşayanlar güvenlikleri için korkar ve bu hüküm 2:256'yı ("dinde zorlama yoktur") boşa çıkarıyor gibi görünür.
  en: Doubters fear for their safety, and the rule seems to undercut 2:256 ("no compulsion in religion").
shortAnswer:
  tr: |
    Kur'an dinden dönmeyi anar (2:217; 5:54), ama dünyevi bir ceza belirtmez ve dinde zorlama olmadığını ilan eder (2:256). Klasik fakihler idam öngördü. Türk âlimler dâhil pek çok modern âlim, cezanın inancı değil vatana ihaneti hedeflediğini savunur. [Debated] — ama bugün yaygın kabul görüyor.
  en: The Quran mentions apostasy (2:217; 5:54) with no worldly penalty, and declares no compulsion in religion (2:256). Classical jurists did prescribe execution. Many modern scholars, including Turkish scholars, argue the penalty targeted treason, not belief. [Debated, but widely held today]
layers:
  - kind: religious
    tr: |
      - Hanefîler dinden dönen kadınları idam etmek yerine hapsetti; bu da cezanın savaşan olmakla bağlantılı olduğunu düşündürür.
      - Süfyân es-Sevrî'nin, dinden dönen kadınların idamına karşı çıktığı nakledilir.
      - Nihat Dalgın (İSAM, 1998–99), yalnızca dinden dönmenin ölümü gerektiremeyeceği sonucuna varır.
      - Diyanet Haber, tarihteki idamları düşman saflarına katılmaya bağlar.
    en: |-
      - Hanafis imprisoned rather than executed female apostates, which suggests the penalty was linked to being a combatant.
      - Sufyan al-Thawri is reported to have opposed executing apostate women.
      - Nihat Dalgın (İSAM, 1998–99) concludes apostasy alone cannot warrant death.
      - Diyanet Haber links historical executions to joining enemy ranks.
  - kind: philosophical
    tr: |
      Zorla iman nifaktır (ikiyüzlülük).
    en: Coerced belief is nifāq (hypocrisy).
  - kind: psychological
    tr: |
      Pew Araştırma Merkezi'nin "The World's Muslims" (2013) çalışmasında Mısırlı Müslümanların %88'i İslam'dan çıkmanın ölümle cezalandırılması gerektiğini söyledi; sorunun sorulduğu 37 ülkede medyan %28'di. İdeal ile tutumlar arasındaki bu mesafe kabul edilmelidir.
    en: In Pew Research Center's "The World's Muslims" (2013), 88% of Egyptian Muslims said leaving Islam should be punishable by death; the median across the 37 countries where the question was asked was 28%. The gap between ideal and attitudes must be acknowledged.
honestLimits:
  tr: |
    Reformcu okuma bir argümandır; tarih boyunca tek tip bir görüş değildir.
  en: The reformist reading is an argument, not the uniform historical view.
