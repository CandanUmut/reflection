honestLimits:
  tr: Klasik hükmün metne dayalı savunması güçlüdür. Reformcu savunma bağlama ve kaydedilmiş idamların yokluğuna dayanır. Erken dönem muhalif görüşler esas olarak sonraki rivayetlerden bilinir ve anket verileri eskidir ve tutarsız şekilde aktarılmıştır.
  en: The textual case for the classical ruling is strong. The reformist case depends on context and on the absence of recorded executions. The early dissents are known mainly from later reports, and the polling data are old and inconsistently reported.
