id: Q15
slugs:
  tr: kabul-olmayan-dua
  en: unanswered-prayer
order: 15
theme: suffering
title:
  tr: Dualar neden kabul olmuyor?
  en: Why are prayers (du'a) unanswered?
sensitivity: normal
helpCard: suffering
verses:
  - 40:60
  - 2:186
  - 12:86
steelman:
  tr: |
    "Bana dua edin, size icabet edeyim" (40:60). Annemin iyileşmesi için dua ettim ve o öldü. Ya vaat yanlış, ya Allah umursamıyor, ya da kimse dinlemiyor.
  en: "\"Call on Me, I will answer you\" (40:60). I prayed for my mother's recovery and she died. Either the promise is false, God doesn't care, or no one is listening."
whyAsked:
  tr: |
    Kişisel travma; Yaqeen, bir yakının ölümünü tetikleyiciler arasında sayar ve travmayı belki de en yaygın yol olarak görür.
  en: Personal trauma; Yaqeen lists a loved one's death among triggers and trauma as possibly the most common pathway.
shortAnswer:
  tr: |
    Hz. Peygamber hiçbir samimi duanın boşa gitmediğini öğretti: Allah ya onu çabucak verir, ya karşılığını âhiret için saklar, ya da ona denk bir kötülüğü uzaklaştırır. Sahâbe daha çok dua edeceklerini söylediğinde, Allah'ın daha da fazlasını verdiğini söyledi. "İcabet", "her zaman istendiği gibi vermek" değil, "karşılık vermek" demektir. Bu, yası silmeden duayı bir otomat değil, bir ilişki olarak yeniden çerçeveler.
  en: "The Prophet taught that no sincere du'a is wasted: God grants it soon, stores its reward for the Hereafter, or turns away an equal harm. When companions said they would pray more, he replied God gives even more. \"Answer\" means \"respond\", not \"always grant as asked\". This reframes du'a as relationship, not vending machine, without erasing grief."
layers:
  - kind: religious
    tr: |
      Âyetler: 2:186; 40:60; 2:216. Hadis: Müsned, Ahmed 11133 (Ebû Saîd el-Hudrî), Arnaût tarafından ceyyid sayılmış, Tirmizî 3573 ve el-Edebü'l-Müfred 710'da da rivayet edilmiştir; Buhârî ve Müslim: "acele etmediği sürece" icabet olunur. Klasik: İbn Kayyim (*ed-Dâ' ve'd-Devâ'*) duayı kaderin içindeki bir sebep olarak görür; İbn Atâullah (*Hikem*): gecikme ümitsizlik sebebi değildir, Allah dilediği gibi karşılık verir.
    en: "Verses: 2:186; 40:60; 2:216. Hadith: Musnad Aḥmad 11133 (Abū Saʿīd al-Khudrī), graded jayyid by al-Arnaʾūṭ, related in Tirmidhī 3573 and al-Adab al-Mufrad 710; Bukhārī and Muslim: answered \"as long as one is not hasty\". Classical: Ibn al-Qayyim (al-Dāʾ wa-l-Dawāʾ) on du'a as a cause within the decree; Ibn ʿAṭāʾillāh (Ḥikam): delay is no reason for despair, God responds as He chooses."
  - kind: philosophical
    tr: |
      İtiraz: "üç sonuç" yanlışlanamaz. Cevap: bu, hikmet sahibi bir Allah'a inanıldığında tutarlı olan, ilahi hikmete dair teolojik bir iddiadır. Dilekte bulunan dua yine de bağımlılığı ve ilişkiyi ifade eder.
    en: 'Objection: "three outcomes" is unfalsifiable. Response: it is a theological claim about divine wisdom, coherent given belief in a wise God. Petitionary prayer still expresses dependence and relationship.'
  - kind: scientific
    tr: |
      [Established] STEP çalışması (Benson ve ark., American Heart Journal 2006; 6 ABD hastanesinde 1.802 bypass hastası), şefaat duası edilen hastalarda %52 (315/604), dua edilmeyenlerde %51 (304/597) ve kendileri için dua edildiği söylenen hastalarda %59 komplikasyon buldu; yani ölçülebilir bir fayda görülmedi. İslam teolojisi duanın bir ilaç gibi işleyeceğini öngörmez.
    en: "[Established] The STEP trial (Benson et al., American Heart Journal 2006; 1,802 bypass patients at 6 US hospitals) found complications in 52% (315/604) of patients who received intercessory prayer versus 51% (304/597) of those who did not, and 59% among patients told they were being prayed for, so no benefit was measured. Islamic theology does not predict du'a works like a drug."
  - kind: psychological
    tr: |
      Yas içinde Allah'a öfke, dinî başa çıkma araştırmalarında yaygındır. Kur'an Yakub'un yakarışını korur: "Ben derdimi ve hüznümü yalnız Allah'a arz ediyorum" (12:86). Yakarışı iman olarak kabul etmek gerekir.
    en: "Anger at God in grief is common in religious-coping research. The Quran preserves Jacob's lament: \"I complain of my grief to God\" (12:86). Validate lament as faith."
honestLimits:
  tr: |
    Üç sonuç hadisi teselli verir ama sınanamaz; onu güvenilecek bir vaat olarak sunmak gerekir.
  en: The three-outcomes hadith comforts but cannot be tested; present it as a promise to trust.
visualizations:
  - id: ideas
    tr: |
      - Üç dallı bir dua yolu: verildi, saklandı, kötülük uzaklaştırıldı.
      - Yakub'un yakarışı kartı.
      - Bir günlük sorusu: "Allah, hiç görmediğin hangi şeyi senden uzaklaştırdı?"
    en: "(a) Three-branch du'a path: granted, stored, harm averted. (b) Jacob's lament card. (c) Journal prompt: \"What has God turned away that you never saw?\""
