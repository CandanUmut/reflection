    en: "Verses: 2:186; 40:60; 2:216. Hadith: Musnad Aḥmad 11133 (Abū Saʿīd al-Khudrī), graded jayyid by al-Arnaʾūṭ, related in Tirmidhī 3573 and al-Adab al-Mufrad 710; Bukhārī and Muslim: answered \"as long as one is not hasty\". Classical: Ibn al-Qayyim (al-Dāʾ wa-l-Dawāʾ) on du'a as a cause within the decree; Ibn ʿAṭāʾillāh (Ḥikam): delay is no reason for despair, God responds as He chooses."
