    en: "Anger at God in grief is common in religious-coping research. The Quran preserves Jacob's lament: \"I complain of my grief to God\" (12:86). Validate lament as faith."
honestLimits:
  tr: |
    Üç sonuç hadisi teselli verir ama sınanamaz; onu güvenilecek bir vaat olarak sunmak gerekir.
  en: The three-outcome hadith comforts, but it cannot be tested; it is a promise to be trusted. The scientific trials say nothing about God's existence one way or the other. Pargament's work on religious coping and the Yaqeen "Modern Pathways" report, cited on the current page, were not read for this run.
