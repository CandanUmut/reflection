steelman:
  tr: "\"Kur'an, 'Bana yalvarın, dua edin ki size karşılık vereyim' diyor (40:60). Her gece annemin iyileşmesi için dua ettim. Oruç tuttum, sadaka verdim, yalvardım. Öldü. Şimdi bana Allah'ın yine de 'karşılık verdiği' söyleniyor — benim için bir mükâfat saklayarak ya da hiç göremeyeceğim başka bir zararı uzaklaştırarak. Ama her sonuç bir karşılık sayılıyorsa, vaat asla boşa çıkamaz ve asla boşa çıkamayacak bir vaat bana hiçbir şey söylemez. Ya Allah sözünü tutmuyor, ya umursamıyor, ya da dinleyen kimse yoktu.\""
  en: "\"The Quran says, 'Call upon Me; I will respond to you' (40:60). I prayed every night for my mother to recover. I fasted, I gave charity, I begged. She died. Now I'm told that God 'answered' anyway — by storing a reward for me, or by turning away some other harm I'll never see. But if every outcome counts as an answer, then the promise can never fail, and a promise that can never fail tells me nothing. Either God doesn't keep His word, or He doesn't care, or no one was listening.\""
whyAsked:
  tr: "Genellikle bir kayıp yüzünden: Ölen bir sevdik, sona eren bir evlilik, gelmeyen bir çocuk. Kaybın acısına, Allah tarafından duyulmadığını hissetmenin acısı eklenir."
  en: "Usually because of a loss: a loved one who died, a marriage that ended, a child who did not come. The pain of the loss is joined by the pain of feeling unheard by God."
shortAnswer:
  tr: "Kur'an Allah'ın *karşılık verdiğini* (*ecâbe*/*istecâbe*) vaat eder ve Hz. Peygamber (s.a.v.), samimi her duaya üç yoldan biriyle karşılık verildiğini açıkladı: istediğin şey, ahiret için saklanan bir mükâfat ya da ona denk bir zararın uzaklaştırılması. Taberî'den Râzî'ye klasik âlimler tam olarak senin itirazınla karşılaştı ve pek çoğu vaadin, her isteği istendiği gibi yerine getirmenin değil, bir karşılığın vaadi olduğu sonucuna vardı. Bu vaadi boş kılmaz: O, Allah'ın ilgisi hakkında bir vaattir; ona güvenebilir ya da güvenmeyebilirsin, ama o hiçbir zaman bir ilaç gibi kontrol edebileceğin bir öngörü değildi. Annen için ettiğin dualar boşa gitmedi ve çok zayıf değildi; onun ölümü de senin suçun değildi. Keder, hatta öfke bile Allah'a getirilebilir; Kur'an, Hz. Yâkûb'un kederi içinde Allah'a şikâyetini korur."
  en: "The Quran promises that God *responds* (*ajāba*/*istajāba*), and the Prophet (pbuh) explained that every sincere du'a is answered in one of three ways: what you asked for, a reward stored for the Hereafter, or the turning away of an equal harm. Classical scholars from al-Tabari to al-Razi faced exactly your objection, and many concluded that the promise is of a response, not of granting every request as asked. That does not make the promise empty: it is a promise about God's care, which you can trust or not, but which was never a prediction you could check like a medicine. Your prayers for your mother were not wasted and were not too weak, and her death was not your fault. Grief and even anger can be brought to God; the Quran preserves the prophet Jacob's complaint to God in his grief."
layers:
  - kind: religious
    tr: |
      Âyetler: 2:186; 40:60; 2:216. Hadis: Müsned, Ahmed 11133 (Ebû Saîd el-Hudrî), Arnaût tarafından ceyyid sayılmış, Tirmizî 3573 ve el-Edebü'l-Müfred 710'da da rivayet edilmiştir; Buhârî ve Müslim: "acele etmediği sürece" icabet olunur. Klasik: İbn Kayyim (*ed-Dâ' ve'd-Devâ'*) duayı kaderin içindeki bir sebep olarak görür; İbn Atâullah (*Hikem*): gecikme ümitsizlik sebebi değildir, Allah dilediği gibi karşılık verir.
    en: "Verses: 2:186; 40:60; 2:216. Hadith: Musnad Aḥmad 11133 (Abū Saʿīd al-Khudrī), graded jayyid by al-Arnaʾūṭ, related in Tirmidhī 3573 and al-Adab al-Mufrad 710; Bukhārī and Muslim: answered \"as long as one is not hasty\". Classical: Ibn al-Qayyim (al-Dāʾ wa-l-Dawāʾ) on du'a as a cause within the decree; Ibn ʿAṭāʾillāh (Ḥikam): delay is no reason for despair, God responds as He chooses."
  - kind: philosophical
    tr: |
      İtiraz: "üç sonuç" yanlışlanamaz. Cevap: bu, hikmet sahibi bir Allah'a inanıldığında tutarlı olan, ilahi hikmete dair teolojik bir iddiadır. Dilekte bulunan dua yine de bağımlılığı ve ilişkiyi ifade eder.
    en: 'Objection: "three outcomes" is unfalsifiable. Response: it is a theological claim about divine wisdom, coherent given belief in a wise God. Petitionary prayer still expresses dependence and relationship.'
  - kind: scientific
    tr: |
      [Established] STEP çalışması (Benson ve ark., American Heart Journal 2006; 6 ABD hastanesinde 1.802 bypass hastası), şefaat duası edilen hastalarda %52 (315/604), dua edilmeyenlerde %51 (304/597) ve kendileri için dua edildiği söylenen hastalarda %59 komplikasyon buldu; yani ölçülebilir bir fayda görülmedi. İslam teolojisi duanın bir ilaç gibi işleyeceğini öngörmez.
    en: "[Established] The STEP trial (Benson et al., American Heart Journal 2006; 1,802 bypass patients at 6 US hospitals) found complications in 52% (315/604) of patients who received intercessory prayer versus 51% (304/597) of those who did not, and 59% among patients told they were being prayed for, so no benefit was measured. Islamic theology does not predict du'a works like a drug."
  - kind: psychological
    tr: |
      Yas içinde Allah'a öfke, dinî başa çıkma araştırmalarında yaygındır. Kur'an Yakub'un yakarışını korur: "Ben derdimi ve hüznümü yalnız Allah'a arz ediyorum" (12:86). Yakarışı iman olarak kabul etmek gerekir.
    en: "Anger at God in grief is common in religious-coping research. The Quran preserves Jacob's lament: \"I complain of my grief to God\" (12:86). Validate lament as faith."
honestLimits:
  tr: Üç sonuç hadisi teselli eder, ama sınanamaz; güvenilecek bir vaattir. Bilimsel deneyler Allah'ın varlığı hakkında ne lehte ne aleyhte hiçbir şey söylemez. Pargament'in dinî başa çıkma üzerine çalışmalarına ve Yaqeen'in "Modern Pathways" raporuna henüz başvurulmadı.
  en: The three-outcome hadith comforts, but it cannot be tested; it is a promise to be trusted. The scientific trials say nothing about God's existence one way or the other. Pargament's work on religious coping and the Yaqeen "Modern Pathways" report have not yet been consulted.
