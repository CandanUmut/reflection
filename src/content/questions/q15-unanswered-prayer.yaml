steelman:
  tr: |
    "Bana dua edin, size icabet edeyim" (40:60). Annemin iyileşmesi için dua ettim ve o öldü. Ya vaat yanlış, ya Allah umursamıyor, ya da kimse dinlemiyor.
  en: "\"The Quran says, 'Call upon Me; I will respond to you' (40:60). I prayed every night for my mother to recover. I fasted, I gave charity, I begged. She died. Now I'm told that God 'answered' anyway — by storing a reward for me, or by turning away some other harm I'll never see. But if every outcome counts as an answer, then the promise can never fail, and a promise that can never fail tells me nothing. Either God doesn't keep His word, or He doesn't care, or no one was listening.\""
whyAsked:
  tr: |
    Kişisel travma; Yaqeen, bir yakının ölümünü tetikleyiciler arasında sayar ve travmayı belki de en yaygın yol olarak görür.
  en: "Usually because of a loss: a loved one who died, a marriage that ended, a child who did not come. The pain of the loss is joined by the pain of feeling unheard by God."
shortAnswer:
  tr: |
    Hz. Peygamber hiçbir samimi duanın boşa gitmediğini öğretti: Allah ya onu çabucak verir, ya karşılığını âhiret için saklar, ya da ona denk bir kötülüğü uzaklaştırır. Sahâbe daha çok dua edeceklerini söylediğinde, Allah'ın daha da fazlasını verdiğini söyledi. "İcabet", "her zaman istendiği gibi vermek" değil, "karşılık vermek" demektir. Bu, yası silmeden duayı bir otomat değil, bir ilişki olarak yeniden çerçeveler.
  en: "The Quran promises that God *responds* (*ajāba*/*istajāba*), and the Prophet (pbuh) explained that every sincere du'a is answered in one of three ways: what you asked for, a reward stored for the Hereafter, or the turning away of an equal harm. Classical scholars from al-Tabari to al-Razi faced exactly your objection, and many concluded that the promise is of a response, not of granting every request as asked. That does not make the promise empty: it is a promise about God's care, which you can trust or not, but which was never a prediction you could check like a medicine. Your prayers for your mother were not wasted and were not too weak, and her death was not your fault. Grief and even anger can be brought to God; the Quran preserves the prophet Jacob's complaint to God in his grief."
