fullAnswer:
  - kind: quran
    en: |-
      **Obey God and the Messenger (4:59).** "O you who have believed, obey Allah and obey the Messenger and those in authority among you. And if you disagree over anything, refer it to Allah and the Messenger" (4:59), Medinan. The verse distinguishes obedience to God from obedience to the Messenger and names both.

      **"Whatever the Messenger has given you — take" (59:7).** "And whatever the Messenger has given you — take; and what he has forbidden you — refrain from" (59:7). The verse's setting is the distribution of *fayʾ* (property gained without fighting); Akram Nadwi, among many others, treats it as general evidence for the Prophet's (pbuh) authority. That general use is a scholarly extension of a verse about a specific distribution.

      **To make clear what was sent down (16:44).** "And We revealed to you the message that you may make clear to the people what was sent down to them and that they might give thought" (16:44), Meccan. The Prophet's (pbuh) role includes explaining the Quran.
    tr: |-
      **Allah'a ve Peygamber'e itaat edin (4:59).** "Ey iman edenler! Allah'a itaat edin, Peygambere de itaat edin ve sizden olan emir sahibine de itaat edin. Eğer herhangi bir şeyde anlaşmazlığa düşerseniz; Allah'a ve ahiret gününe gerçekten inanıyorsanız, onu Allah ve Resulüne arz edin." (4:59), Medenî. Âyet Allah'a itaati Peygamber'e itaatten ayırır ve ikisini de anar.

      **"Peygamber size ne verdiyse onu alın" (59:7).** "Peygamber size ne verdiyse onu alın. … yasakladıysa ondan sakının" (59:7). Âyetin bağlamı *fey*in (savaşmadan elde edilen mal) dağıtımıdır; Ekrem Nedvî, diğer pek çokları gibi, onu Hz. Peygamber'in (s.a.v.) otoritesine genel bir delil olarak ele alır. Bu genel kullanım, belirli bir dağıtımla ilgili bir âyetin âlimlerce yapılmış bir genişletmesidir.

      **İndirileni açıklamak için (16:44).** "Sana da Kur'ân'ı indirdik ki, insanlara vahyedileni açıklayasın. Belki onlar da düşünürler." (16:44), Mekkî. Hz. Peygamber'in (s.a.v.) görevi Kur'an'ı açıklamayı da içerir.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: '**Writing hadith in his lifetime.** ʿAbdullah ibn ʿAmr (ra) said he "used to write everything" he heard from the Prophet (pbuh), "to memorise it". The Quraysh objected that the Prophet (pbuh) "is a human being: he speaks in anger and pleasure", so he stopped and told the Prophet (pbuh), who pointed to his mouth and said: "Write, by Him in Whose hand my soul lies, only right comes out from it" ({hadith:abudawud:3646}; al-Albani: *ṣaḥīḥ*). Other reports discourage writing hadith early on; scholars reconcile them in different ways (not covered here).'
    tr: "**Onun hayatında hadis yazmak.** Abdullah b. Amr (r.a.), Hz. Peygamber'den (s.a.v.) duyduğu \"her şeyi ezberlemek için yazdığını\" söyledi. Kureyş, Hz. Peygamber'in (s.a.v.) \"bir insan olduğunu: öfkeyle de hoşnutlukla da konuştuğunu\" söyleyerek itiraz etti; o da yazmayı bıraktı ve bunu Hz. Peygamber'e (s.a.v.) anlattı; Hz. Peygamber ağzını göstererek şöyle buyurdu: \"Yaz; canım elinde olana yemin ederim ki, ondan haktan başka bir şey çıkmaz\" ({hadith:abudawud:3646}; Elbânî: *sahih*). Başka rivayetler erken dönemde hadis yazmaktan sakındırır; âlimler bunları farklı şekillerde bağdaştırır (burada ele alınmadı)."
    title:
      en: Hz. Peygamber (s.a.v.) ne öğretti?
      tr: Hz. Peygamber (s.a.v.) ne öğretti?
  - kind: scholars
    en: |-
      **Terms.** An *isnād* is "the chain of narration" — who heard it from whom; the *matn* is the text. A *ṣaḥīḥ* (sound) hadith has an unbroken chain in which "every narrator is known to be upright and precise in their transmission", with a text "free from hidden defects or irregularities". A *ḥasan* (good) hadith meets most criteria, but a narrator "may have slightly less precise memory". A *ḍaʿīf* (weak) hadith fails them, "typically because of a break in the chain, an unreliable narrator, or a textual irregularity". A *mawḍūʿ* (fabricated) hadith is "invented and falsely attributed to the Prophet" (ParallelQuran's summary). Scholars judged narrators using biographical dictionaries that recorded each person's teachers, students, reliability and memory.

      **Bukhari and Muslim.** Al-Bukhari and Muslim each compiled a collection limited to reports they judged sound. How later scholars ranked these collections, and where they criticised particular reports in them, was not covered here.

      **A worked example of grading.** In run 6, the hadith "Tie it and rely (upon Allah)" (al-Tirmidhi 2517) was called *gharīb* by al-Tirmidhi: he knew it from Anas only by this one route, and he noted a similar report from ʿAmr b. Umayya al-Damri. Yahya al-Qattan called it *munkar* (rejected); Zubair ʿAli Zaʾi graded it *ḥasan* (good); and Ibn Hibban (no. 731) has a version graded *ḥasan li-ghayrihi* ("good because of support from other routes") by al-Arnaʾut. So a familiar saying can rest on a disputed chain. By contrast, the three-outcomes hadith on du'a (Musnad Ahmad 11133) has a chain al-Arnaʾut called *jayyid* (good), al-Hakim authenticated, and a parallel in al-Adab al-Mufrad (no. 710; *Ṣaḥīḥ al-Adab al-Mufrad* 547) graded *ṣaḥīḥ* by al-Albani. Grading is done chain by chain, and agreement between independent chains strengthens a report.
    tr: |-
      **Terimler.** *İsnâd*, "rivayet zinciri"dir — kimin kimden duyduğu; *metn* ise metindir. *Sahih* bir hadisin senedi kesintisizdir ve "her râvinin adaletli ve aktarımında zabt sahibi olduğu bilinir"; metni de "gizli kusurlardan ya da tuhaflıklardan uzaktır". *Hasen* (iyi) bir hadis ölçütlerin çoğunu karşılar, ama bir râvinin "hafızası biraz daha az zabtlı olabilir". *Zayıf* bir hadis bu ölçütleri karşılamaz, "genellikle senetteki bir kopukluk, güvenilmez bir râvi ya da metindeki bir tuhaflık yüzünden". *Mevzû* (uydurma) bir hadis "uydurulmuş ve yalan yere Hz. Peygamber'e nispet edilmiştir" (ParallelQuran'ın özeti). Âlimler râvileri, her kişinin hocalarını, öğrencilerini, güvenilirliğini ve hafızasını kaydeden biyografik sözlükleri kullanarak değerlendirdi.

      **Buhârî ve Müslim.** Buhârî ve Müslim'in her biri yalnızca sahih saydıkları rivayetlerle sınırlı bir külliyat derledi. Sonraki âlimlerin bu külliyatları nasıl sıraladığı ve içlerindeki belirli rivayetleri nerede eleştirdiği burada ele alınmadı.

      **Derecelendirmeye işlenmiş bir örnek.** 6. çalışmada, "Onu bağla ve (Allah'a) tevekkül et" hadisi (Tirmizî 2517), Tirmizî tarafından *garîb* olarak nitelendirildi: Onu Enes'ten yalnızca bu tek yoldan biliyordu ve Amr b. Ümeyye ed-Damrî'den benzer bir rivayeti not etti. Yahyâ el-Kattân ona *münker* (reddedilen) dedi; Zübeyr Ali Zeî onu *hasen* (iyi) olarak derecelendirdi; ve İbn Hibbân'da (no. 731) Arnaût'un *hasen li-gayrihî* ("başka yollardan gelen destek sebebiyle iyi") olarak derecelendirdiği bir versiyonu var. Yani bilinen bir söz tartışmalı bir senede dayanabilir. Buna karşılık dua hakkındaki üç sonuç hadisinin (Müsned-i Ahmed 11133) senedini Arnaût *ceyyid* (iyi) olarak niteledi, Hâkim sahih saydı ve *el-Edebü'l-Müfred*'de (no. 710; *Sahîhu'l-Edebi'l-Müfred* 547) Elbânî'nin *sahih* olarak derecelendirdiği bir paraleli var. Derecelendirme sened sened yapılır ve bağımsız senetler arasındaki uyum bir rivayeti güçlendirir.
    title:
      en: Sistem nasıl işliyor?
      tr: Sistem nasıl işliyor?
  - kind: history
    en: |-
      **Schacht's argument (outline only).** Joseph Schacht (*The Origins of Muhammadan Jurisprudence*, 1950) is the best-known Western critic of hadith chains. Neither his book nor a summary of it was read, so his thesis is given here only as the question above states it: that many legal hadith arose later and their chains were extended back to the Prophet (pbuh). Mansur Ali's review discusses the "common link" theory of G. H. A. Juynboll, the method Little (2022) also uses: the narrator on whom many chains of one hadith converge is treated as its likely originator.

      **Motzki's response.** Harald Motzki developed the *isnād-cum-matn* method — "the chain of narrators should be studied in tandem with the text of a hadith" — first in his study of the *Muṣannaf* of ʿAbd al-Razzaq al-Sanʿani. Mansur Ali's review says Motzki's critique shows that Juynboll's common-link theory "nevertheless suffers from many methodological and epistemological flaws", while noting that accepting Motzki's conclusions "will depend on how much reliance one is willing to place on the chain of narrators". Motzki's own dating results have not yet been consulted.

      **A live example: Aisha's age.** Joshua Little (2022) used the common-link method to argue that the report of Aisha's age at marriage "appears to have been created and disseminated" by Hisham ibn ʿUrwa in Iraq; Cheema (2024) replied that it is corroborated by chains not through Hisham, including al-Zuhri's in Muslim 1422c (see "Aisha's age at marriage"). The case shows both methods at work on one hadith.
    tr: |-
      **Schacht'ın argümanı (yalnızca ana hatları).** Joseph Schacht (*The Origins of Muhammadan Jurisprudence*, 1950), hadis senetlerinin en bilinen Batılı eleştirmenidir. Ne kitabı ne de bir özeti okundu, dolayısıyla tezi burada yalnızca yukarıdaki sorunun ifade ettiği şekliyle veriliyor: pek çok hukuki hadisin sonradan ortaya çıktığı ve senetlerinin Hz. Peygamber'e (s.a.v.) kadar geriye uzatıldığı. Mansur Ali'nin incelemesi, Little'ın (2022) da kullandığı yöntem olan G. H. A. Juynboll'un "ortak halka" teorisini ele alır: Bir hadisin pek çok senedinin üzerinde birleştiği râvi, onun muhtemel kaynağı sayılır.

      **Motzki'nin cevabı.** Harald Motzki, *isnâd-metin* yöntemini — "râviler zinciri bir hadisin metniyle birlikte incelenmelidir" — ilk olarak Abdürrezzâk es-San'ânî'nin *Musannef*'i üzerine yaptığı çalışmada geliştirdi. Mansur Ali'nin incelemesi, Motzki'nin eleştirisinin Juynboll'un ortak halka teorisinin "yine de pek çok yöntemsel ve epistemolojik kusurdan mustarip olduğunu" gösterdiğini söyler; ancak Motzki'nin sonuçlarını kabul etmenin "kişinin râviler zincirine ne kadar güvenmeye istekli olduğuna bağlı olacağını" da not eder. Motzki'nin kendi tarihlendirme sonuçlarına henüz başvurulmadı.

      **Canlı bir örnek: Hz. Âişe'nin yaşı.** Joshua Little (2022), ortak halka yöntemini kullanarak Hz. Âişe'nin evlilik yaşıyla ilgili rivayetin Irak'ta Hişâm b. Urve tarafından "üretilmiş ve yayılmış gibi göründüğünü" savundu; Cheema (2024), rivayetin Hişâm'dan geçmeyen, Müslim 1422c'deki Zührî senedi dahil senetlerle desteklendiği cevabını verdi (bkz. "Hz. Âişe'nin evlilik yaşı"). Bu örnek iki yöntemin tek bir hadis üzerinde nasıl işlediğini gösterir.
    title:
      en: Batılı akademi
      tr: Batılı akademi
  - kind: reasoning
    en: |-
      **What the Quran-centred view holds.** The Hitit University study (2024) describes it as the belief that the Quran is complete, clear and self-sufficient — "the sole source of Islamic teaching" — so that other sources are unnecessary.

      **The mainstream reply.** Nadwi argues that revelation includes the Prophet's (pbuh) guided words and acts; that the Quran commands obedience to him (4:59; 59:7); and that the Quran states general duties — prayer, zakāh, legal penalties — without the details, which the Sunna supplies; in his words, "Without the Sunnah, Islamic practice becomes unmoored from its interpretive anchor and is rendered vulnerable to personal reinterpretation, relativism, and sectarianism." An example of this page's own (it is not in Nadwi's article): the Quran commands prayer many times but does not describe how to perform it; the number of daily prayers and their form come from the Prophet's (pbuh) practice as transmitted by the community.

      **Two different arguments.** The reliability of the *practice* (how Muslims pray, fast and give zakāh) rests on continuous transmission by whole communities, not on individual chains. The reliability of the *corpus* of individual hadith reports rests on the grading system. One can be more confident in the first than in every item of the second.

      *Limit:* Quran-centred Muslims reply that 4:59 and 59:7 refer to the Prophet's (pbuh) authority in his lifetime, not to reports collected later. This is a real disagreement about how the Prophet's (pbuh) authority reaches later generations.
    tr: |-
      **Kur'an merkezli görüş neyi savunur?** Hitit Üniversitesi çalışması (2024) onu Kur'an'ın eksiksiz, açık ve kendi kendine yeterli olduğu — "İslam öğretisinin tek kaynağı" — dolayısıyla başka kaynakların gereksiz olduğu inancı olarak tarif eder.

      **Ana akımın cevabı.** Nedvî, vahyin Hz. Peygamber'in (s.a.v.) hidayete erdirilmiş sözlerini ve fiillerini de içerdiğini; Kur'an'ın ona itaati emrettiğini (4:59; 59:7); ve Kur'an'ın genel görevleri — namaz, zekât, hadler — ayrıntılar olmadan bildirdiğini, ayrıntıları ise Sünnet'in sağladığını savunur; onun sözleriyle: "Sünnet olmadan İslami uygulama yorumlayıcı çapasından kopar ve kişisel yeniden yorumlamaya, göreceliğe ve mezhepçiliğe açık hâle gelir." Bu sayfanın kendi örneği (Nedvî'nin makalesinde yok): Kur'an namazı pek çok kez emreder, ama nasıl kılınacağını tarif etmez; günlük namazların sayısı ve biçimi, toplumun aktardığı şekliyle Hz. Peygamber'in (s.a.v.) uygulamasından gelir.

      **İki farklı argüman.** *Uygulamanın* (Müslümanların nasıl namaz kıldığı, oruç tuttuğu ve zekât verdiği) güvenilirliği tek tek senetlere değil, bütün toplulukların kesintisiz aktarımına dayanır. Tek tek hadis rivayetlerinden oluşan *külliyatın* güvenilirliği ise derecelendirme sistemine dayanır. Kişi birincisine, ikincisinin her bir öğesinden daha fazla güvenebilir.

      *Sınır:* Kur'an merkezli Müslümanlar, 4:59 ve 59:7'nin sonradan toplanan rivayetlere değil, Hz. Peygamber'in (s.a.v.) hayatındaki otoritesine işaret ettiği cevabını verir. Bu, Hz. Peygamber'in (s.a.v.) otoritesinin sonraki nesillere nasıl ulaştığı konusunda gerçek bir anlaşmazlıktır.
    title:
      en: Yalnızca Kur'an argümanı
      tr: Yalnızca Kur'an argümanı
  - kind: objection
    en: |-
      **"Compiled two centuries later."** *Reply:* the great collections are from the third Islamic century, but they drew on earlier written collections and on chains of teachers; writing began in the Prophet's (pbuh) lifetime ({hadith:abudawud:3646}). *Limit:* how much early writing survived into the collections is debated.

      **"Thousands of fabrications exist."** *Reply:* yes, and Muslim scholars themselves identified and catalogued them; that is what the grading system is for. *Limit:* a system can catch many fabrications and still miss some.

      **"What do I do with a *ṣaḥīḥ* hadith that seems morally wrong?"** *Reply:* first, check the text, context and translation — many difficulties dissolve. Second, ask whether the report describes a particular situation rather than a rule for all times (see the discussion of al-Qarafi and Ibn ʿAshur on "Aisha's age at marriage"). Third, scholars have sometimes judged a report's text problematic despite a strong chain; that is a recognised, though cautious, part of the tradition. *Limit:* where the tradition has accepted a report and its meaning, a reader may still find it hard, and the honest answer is to say so.
    tr: |-
      **"İki yüzyıl sonra derlendi."** *Cevap:* Büyük külliyatlar hicrî üçüncü yüzyıla aittir, ama daha önceki yazılı derlemelerden ve hocalar zincirlerinden yararlandılar; yazım Hz. Peygamber'in (s.a.v.) hayatında başladı ({hadith:abudawud:3646}). *Sınır:* Erken dönem yazılarının ne kadarının külliyatlara ulaştığı tartışmalıdır.

      **"Binlerce uydurma var."** *Cevap:* Evet ve onları Müslüman âlimlerin kendileri tespit edip katalogladı; derecelendirme sistemi bunun içindir. *Sınır:* Bir sistem pek çok uydurmayı yakalayıp yine de bazılarını kaçırabilir.

      **"Ahlaken yanlış görünen *sahih* bir hadisle ne yapmalıyım?"** *Cevap:* Önce metni, bağlamı ve çeviriyi kontrol et — pek çok güçlük ortadan kalkar. İkincisi, rivayetin bütün zamanlar için bir kural yerine belirli bir durumu anlatıp anlatmadığını sor (bkz. "Hz. Âişe'nin evlilik yaşı" sayfasında Karâfî ve İbn Âşûr tartışması). Üçüncüsü, âlimler güçlü bir senede rağmen bir rivayetin metnini bazen sorunlu buldu; bu, geleneğin tanınmış, ama ihtiyatlı bir parçasıdır. *Sınır:* Geleneğin bir rivayeti ve anlamını kabul ettiği yerde okuyucu onu yine de zor bulabilir ve dürüst cevap bunu söylemektir.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **Mainstream Sunni scholarship** — the Sunna is binding; graded hadith are its main record; *ṣaḥīḥ* collections are highly reliable.
      - **Schacht, Juynboll** — many hadith, especially legal ones, arose in the second century.
      - **Motzki** — chains and texts must be studied together; the common-link theory is methodologically flawed (as reported by Mansur Ali; Motzki's own dating results have not yet been consulted).
      - **Quran-centred Muslims (e.g. *Kur'an Müslümanlığı* in Türkiye)** — the Quran alone is the source; hadith are not binding.
    tr: |-
      - **Ana akım Sünnî ilim** — Sünnet bağlayıcıdır; derecelendirilmiş hadisler onun başlıca kaydıdır; *sahih* külliyatlar son derece güvenilirdir.
      - **Schacht, Juynboll** — pek çok hadis, özellikle hukuki olanlar, ikinci yüzyılda ortaya çıktı.
      - **Motzki** — senetler ve metinler birlikte incelenmelidir; ortak halka teorisi yöntemsel olarak kusurludur (Mansur Ali'nin aktardığına göre; Motzki'nin kendi tarihlendirme sonuçlarına henüz başvurulmadı).
      - **Kur'an merkezli Müslümanlar (ör. Türkiye'de *Kur'an Müslümanlığı*)** — tek kaynak Kur'an'dır; hadisler bağlayıcı değildir.
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: Is the Aisha marital-age hadith authentic?
      tr: Hz. Âişe'nin evlilik yaşıyla ilgili hadis sahih mi?
    a:
      en: By classical standards, yes; Little's thesis argues it originated with one narrator in Iraq, and Cheema replies with corroborating chains. See "Aisha's age at marriage".
      tr: Klasik ölçütlere göre evet; Little'ın tezi onun Irak'ta tek bir râviyle başladığını savunur, Cheema ise destekleyici senetlerle cevap verir. Bkz. "Hz. Âişe'nin evlilik yaşı".
  - q:
      en: How did the testing system work?
      tr: Sınama sistemi nasıl işliyordu?
    a:
      en: Scholars examined every narrator's reliability and memory using biographical records, checked that the chain was connected, and compared versions of the text.
      tr: Âlimler biyografik kayıtları kullanarak her râvinin güvenilirliğini ve hafızasını inceledi, senedin bağlantılı olup olmadığını kontrol etti ve metnin versiyonlarını karşılaştırdı.
  - q:
      en: What do I do with a *ṣaḥīḥ* hadith that seems morally wrong?
      tr: Ahlaken yanlış görünen *sahih* bir hadisle ne yapmalıyım?
    a:
      en: Check text and context; ask whether it is situational; study how scholars have read it; and be honest if it remains hard.
      tr: Metni ve bağlamı kontrol et; duruma özgü olup olmadığını sor; âlimlerin onu nasıl okuduğunu incele; ve zor kalırsa bunu dürüstçe söyle.
  - q:
      en: What is a hadith, and how is it different from the Quran?
      tr: Hadis nedir ve Kur'an'dan farkı ne?
    a:
      en: A hadith is a report about the Prophet (pbuh); the Quran is, for Muslims, God's own word. Hadith are graded; the Quran is not.
      tr: Hadis, Hz. Peygamber (s.a.v.) hakkında bir rivayettir; Kur'an ise Müslümanlar için Allah'ın kendi sözüdür. Hadisler derecelendirilir; Kur'an derecelendirilmez.
  - q:
      en: What are Bukhari and Muslim?
      tr: Buhârî ve Müslim nedir?
    a:
      en: Two hadith collections, each limited to reports its compiler judged sound.
      tr: Her biri derleyicisinin sahih saydığı rivayetlerle sınırlı iki hadis külliyatı.
  - q:
      en: What is the Sunna?
      tr: Sünnet nedir?
    a:
      en: "The Prophet's (pbuh) way: his words, acts and approvals, known through hadith and community practice."
      tr: "Hz. Peygamber'in (s.a.v.) yolu: hadisler ve toplumun uygulaması aracılığıyla bilinen sözleri, fiilleri ve onayları."
