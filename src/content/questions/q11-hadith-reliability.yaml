id: Q11
slugs:
  tr: hadislerin-guvenilirligi
  en: hadith-reliability
order: 11
theme: sources
title:
  tr: Hadisler güvenilir mi? ("Kur'an İslamı" dâhil)
  en: Are hadith reliable? (including "Kuran İslamı")
sensitivity: normal
helpCard: false
verses:
  - 4:59
  - 59:7
  - 16:44
steelman:
  tr: |
    Kanonik derlemeler Hz. Peygamber'den iki asır sonra oluşturuldu; klasik âlimlerin de kabul ettiği gibi uydurma oldu. Âişe'nin evlilik yaşı gibi sahih bir rivayetin, Oxford'daki bir doktora tezinde 8. yüzyılın bir ifadesi olduğu savunulabiliyorsa, hangisine güvenilir? "Yalnızca Kur'an" daha sadık değil mi?
  en: Canonical collections came two centuries after the Prophet; fabrication happened, as classical scholars admit. If a ṣaḥīḥ report like Aisha's marital age can be argued by an Oxford thesis to be an 8th-century formulation, why trust any? Isn't "Quran alone" more faithful?
whyAsked:
  tr: |
    Batılı kaynak eleştirisi (Goldziher, Schacht, Juynboll) ve Kur'ancı medya; ahlâken rahatsız edici hadisler; Türkiye'de "Kur'an İslamı", akılcı görünen bir İslam ve geleneksel otoritelerden bir sığınak sunar.
  en: Western source-criticism (Goldziher, Schacht, Juynboll) and Quranist media; morally troubling hadith; in Türkiye, "Kuran İslamı" offers a rational-seeming Islam and refuge from traditional authorities.
shortAnswer:
  tr: |
    Hadislerin ne hepsi güvenilirdir ne hepsi uydurmadır. Müslüman âlimler ayrıntılı bir sınama sistemi kurdu ve binlerce rivayeti reddetti. Modern yöntemler pek çok hadisi hicrî 1. asra tarihlendirdi ve bazılarını sorguladı. Kur'an Peygamber'e itaati emreder (4:59, 59:7) ve namazın nasıl kılınacağı uygulamaya bağlıdır; bu yüzden "yalnızca Kur'an" görüşünün ciddi sorunları vardır. Dürüst tutum: derecelendirilmiş, eleştirel olarak incelenmiş bir delil bütünü.
  en: 'Hadith are neither all reliable nor all fabricated. Muslim scholars built an elaborate testing system and rejected thousands of reports. Modern methods have dated many hadith to the 1st Islamic century and challenged particular ones. The Quran commands obeying the Messenger (4:59, 59:7), and how to pray depends on practice, so "Quran alone" has serious problems. Honest position: a graded, critically examined body of evidence.'
layers:
  - kind: religious
    tr: |
      - *Kur'an:* 4:59; 59:7; 16:44.
      - *Klasik yöntem:* isnad tenkidi ile metin tenkidi; İbn Kayyim'in *el-Menârü'l-Münîf*'i uydurmanın metindeki işaretlerini sayar.
      - *Mezhepler:* Hanefîler haber-i vâhidi ilkelere göre tarttı; Mâtürîdîler haber-i vâhidi itikadda kesin saymaz; Eserîler hadise daha geniş yer verir. Şiîlerin kendi derecelendirmesiyle paralel bir külliyatı (*el-Kâfî*) vardır.
      - *Türk akademisi:* DergiPark çalışmaları "yalnızca Kur'an" görüşlerini bazı Mu'tezilî görüşlere ve modern "Ehl-i Kur'an"a dayandırır; Peygamber'i bir "postacıya" indirgemenin Kur'an'la çeliştiğini savunur; Türk ilahiyat fakülteleri de metin tenkidini geliştiriyor.
    en: |-
      - *Quran:* 4:59; 59:7; 16:44.
      - *Classical method:* isnād criticism plus matn criticism; Ibn al-Qayyim's al-Manār al-Munīf lists content signs of fabrication.
      - *Schools:* Ḥanafīs weighed solitary (āḥād) reports against principles; Māturīdīs do not treat āḥād as certain in creed; Atharīs give hadith wider scope. Shiʿis have a parallel corpus (al-Kāfī) with its own grading.
      - *Turkish academy:* DergiPark studies trace Quran-alone views to some Muʿtazila positions and modern "Ahl al-Qurʾān", arguing that reducing the Prophet to a "postman" contradicts the Quran, while Turkish faculties also develop matn criticism.
  - kind: philosophical
    tr: |
      Şüpheci: uzun sözlü aktarım artı siyaset, düşük güvenilirlik demektir. Cevap: erken yazılı derlemeler (Hemmâm'ın sahifesi, *Muvatta*), çoklu senetler ve Motzki'nin malzemeyi hicrî 1. asrın sonuna tarihlendiren isnad-metin analizi (ICMA). Karşı görüş: Joshua Little'ın Oxford doktorası (2022/23), Hişâm b. Urve'nin Âişe'nin evlilik yaşına dair ifadeyi 8. yüzyılın ortasında Irak'ta formüle ettiğini savunmak için ICMA'yı kullandı; Müslüman cevaplar (ICRAA) adımlarına itiraz ediyor ve sempatik eleştirmenler bile Zührî'nin destekleyici bir rivayetini gözden kaçırdığını söylüyor. Tartışma *belirli rivayetlerle* ilgilidir.
    en: "Skeptic: long oral transmission plus politics means low reliability. Response: early written collections (Hammām's ṣaḥīfa, the Muwaṭṭaʾ), multiple chains, and Motzki's isnād-cum-matn analysis (ICMA) dating material to the late 1st century AH. Counter: Joshua Little's Oxford DPhil (2022/23) used ICMA to argue Hishām b. ʿUrwa formulated the Aisha marital-age wording in Iraq in the mid-8th century; Muslim respondents (ICRAA) contest his steps, and even sympathetic critics say he missed a corroborating al-Zuhrī transmission. The debate concerns *specific reports*."
  - kind: scientific
    tr: |
      Hafıza araştırması: resmî ezber kültürleri yüksek sadakatle aktarır; gündelik anekdot ise kayar.
    en: "Memory research: formal recitation cultures transmit with high fidelity; casual anecdote drifts."
  - kind: psychological
    tr: |
      Kur'ancılık çoğu zaman rahatsız edici metinlerden bir kurtuluştur. Bu rahatlama gerçektir; klasik araçlar (derecelendirme, bağlam, delil hiyerarşisi) ise Sünnet'i koruyan başka bir yol sunar.
    en: Quranism is often relief from troubling texts. That relief is real; the classical tools (grading, context, the hierarchy of evidence) offer another way, one that keeps the Sunna.
honestLimits:
  tr: |
    Bazı sahih hadisler ciddi akademisyenlerce tartışılmaktadır; klasik derecelendirme güçlüdür ama yanılmaz değildir. "Buhârî'deki her rivayet kesindir" de, "bütün hadisler uydurmadır" da denmemelidir.
  en: 'Some ṣaḥīḥ hadith are contested by serious academics; classical grading is strong, not infallible. Neither extreme holds: not "every Bukhārī report is certain", and not "all hadith are fabricated".'
visualizations:
  - id: ideas
    tr: |
      - Klasik ve ICMA görüşleri arasında geçiş yapan, bir "ortak halka"da birleşen etkileşimli bir isnad ağacı.
      - Mütevatirden mevzuya bir derecelendirme yelpazesi kartı.
      - Hz. Peygamber'den Buhârî'ye, erken sahifelerle bir zaman çizelgesi.
    en: (a) Interactive isnād tree converging on a "common link", toggling classical vs ICMA views. (b) Grading spectrum card, mutawātir to mawḍūʿ. (c) Timeline from the Prophet to Bukhārī with early ṣaḥīfas.
