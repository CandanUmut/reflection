honestLimits:
  tr: |
    Azınlık görüşü klasiktir ama azınlıkta kalır ve yaygın biçimde kınanmıştır; gizli "gerçek" İslam değildir.
  en: The minority view is classical but remains a minority and was widely condemned; it is not the hidden "real" Islam.
