id: Q13
slugs:
  tr: ebedi-cehennem
  en: eternal-hell
order: 13
theme: salvation
title:
  tr: Sonlu günahlar için ebedî cehennem adil mi?
  en: Is eternal Hell just for finite sins?
sensitivity: normal
helpCard: false
verses:
  - 4:40
  - 11:106-108
steelman:
  tr: |
    En kötü hayat bile sonlu yanlışlar içerir. Sonsuz ceza orantısız görünür. Rahmeti en geniş olan, birine nasıl sonsuza dek azap eder?
  en: Even the worst life involves finite wrongs. Infinite punishment seems disproportionate. How can the Most Merciful torment anyone forever?
whyAsked:
  tr: |
    Orantılılık sezgileri, gayrimüslim arkadaşlara duyulan sevgi, korkuya dayalı çocukluk eğitimi.
  en: Proportionality intuitions, love for non-Muslim friends, fear-based childhood teaching.
shortAnswer:
  tr: |
    Çoğunluk, Allah'ı bilerek ve ısrarla reddedenler için cehennemin ebedî olduğunu kabul eder; bu, amellerin sayısıyla değil, değişmeyen bir iç hâlin sonucu olarak açıklanır. Aralarında İbn Teymiyye'nin son risalesinde ve İbn Kayyim'in de bulunduğu büyük klasik âlimlerden bir azınlık, kâfirlerin cezasının sona ereceğini savundu. Kur'an kimseye zerre kadar haksızlık edilmeyeceğini vurgular (4:40) ve gerçekte kimin sorumlu olduğunu yalnızca Allah bilir.
  en: The majority hold Hell is eternal for those who knowingly and persistently reject God, explained as the outcome of a fixed inner state rather than an act-count. A minority of major classical scholars, including Ibn Taymiyya in his last treatise and Ibn al-Qayyim, argued the punishment of unbelievers will end. The Quran stresses no one is wronged even slightly (4:40), and God alone knows who is truly culpable.
layers:
  - kind: religious
    tr: |
      - *Âyetler:* "orada ebedî kalacaklar" (4:169; 72:23); "Rabbinin dilemesi müstesna, gökler ve yer durdukça" (11:106–107); "çağlar boyu" (78:23).
      - *Çoğunluk (Eş'arî, Mâtürîdî, Eserîlerin çoğu):* kâfirler için ebedîdir; günahkâr müminler çıkar. Sübkî, İbn Teymiyye'ye sert bir reddiye yazdı.
      - *Azınlık:* Jon Hoover'a göre İbn Teymiyye'nin *Fenâü'n-nâr*'ı, ebedîliğe dair bir icma olmadığını ve azabın bir amaca yönelik olduğunu savunur, ama cezanın bittiğini kesin olarak söylemez; İbn Kayyim cehennemi iyileştirici ve ıslah edici olarak geliştirir. İbn Vezîr hüküm vermekten kaçındı; Reşîd Rızâ temkinli bir evrenselciliğe meyletti.
      - *Tasavvuf:* İbn Arabî: ehli için ateşin azabı (*azâb*) "tatlılığa" (*azb*) dönüşür [Debated].
    en: |-
      - *Verses:* "abiding therein forever" (4:169; 72:23); "as long as heavens and earth endure, except as your Lord wills" (11:106–107); "for ages" (78:23).
      - *Majority (Ashʿarī, Māturīdī, most Atharīs):* eternal for disbelievers; sinning believers leave. Al-Subkī refuted Ibn Taymiyya sharply.
      - *Minority:* per Jon Hoover, Ibn Taymiyya's Fanāʾ al-nār argues there is no consensus on eternity and that chastisement is purposive, though he never states categorically that it ends; Ibn al-Qayyim develops Hell as therapeutic and reformative. Ibn al-Wazīr withheld judgment; Rashīd Riḍā leaned toward cautious universalism.
      - *Sufi:* Ibn ʿArabī: for its people, the Fire's torment (ʿadhāb) becomes "sweetness" (ʿadhb) [Debated].
  - kind: philosophical
    tr: |
      Cevaplar: (a) sabitleşmiş karakter: ceza süregiden reddi izler (6:28); (b) suç, kendisine karşı işlenenin yüceliğiyle büyür (modern okurlar için en zayıfı); (c) evrenselci azınlık.
    en: "Responses: (a) fixed character: punishment tracks enduring rejection (6:28); (b) offence scales with the dignity of the one wronged (weakest for modern readers); (c) the universalist minority."
  - kind: psychological
    tr: |
      Cehennem kaygısı dinî titizlikte (vesvese) yaygındır. Kaygılı bir okura ürkütücü imgeler yardımcı olmaz. Adalet rahmetle birlikte düşünülür: hadiste Allah'ın rahmeti yüz parçadır ve doksan dokuzu âhiret için saklanmıştır (Müslim 2752).
    en: "Hell-anxiety is common in scrupulosity. For an anxious reader, graphic imagery does not help. Justice is held together with mercy: in the hadith, God's mercy has 100 parts, 99 of them kept for the Hereafter (Muslim 2752)."
