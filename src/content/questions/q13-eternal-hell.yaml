title:
  tr: Sonlu günahlar için ebedî cehennem adil mi?
  en: Is eternal Hell just for finite sins?
sensitivity: normal
helpCard: false
verses:
  - 4:40
  - 11:106-108
steelman:
  tr: "\"Bir hayat yetmiş yıl sürer. Her insan günahı fiil ve zarar bakımından sonludur. Sonlu yanlışlar için sonsuz azap, her türlü orantının dışındadır. 'Sonsuz bir Allah'a karşı işlendi' demek fazlasını ispat eder, çünkü o zaman her günah sonsuzluğu hak ederdi. 'Yine dönerlerdi' (6:28) demek, hiç işlenmemiş suçları cezalandırır ve tartışılan şeyi baştan varsayar. İbn Teymiyye bile görünüşe göre cezanın sona erdiği sonucuna vardı. Merhametli bir Allah'ın insanlığın çoğuna sonsuza dek azap ettiğine neden inanayım?\""
  en: "\"A life lasts seventy years. Every human sin is finite in act and in harm. Infinite torment for finite wrongs is out of all proportion. 'It was against an infinite God' proves too much, because then every sin would merit infinity. 'They would have kept sinning' (6:28) punishes crimes that were never committed, and it assumes the very thing in question. Even Ibn Taymiyya apparently concluded that the punishment ends. Why should I believe a merciful God torments most of humanity for ever?\""
whyAsked:
  tr: Bu, İslam'ın ahiret öğretisine yöneltilen en doğrudan ahlaki itirazdır. En çok, gayrimüslim sevdiklerini kaybetmiş olanlara ve dinî kaygı yaşayanlara ağır gelir.
  en: It is the most direct moral challenge to Islamic teaching about the afterlife. It weighs most heavily on those who have lost non-Muslim loved ones and on those with religious anxiety.
shortAnswer:
  tr: Sünnî âlimlerin çoğu, cehennemin Allah'ı bilerek ve ısrarla reddedenler için ebedî olduğunu kabul eder. 14. yüzyıl Şam'ının önde gelen Şâfiî kadısı Sübkî, aksi görüşü küfür ilan etti. Ama İbn Teymiyye'nin son risalesi, cennet ebedî olsa da kâfirlerin azabının sona ereceğini savundu. Öğrencisi İbn Kayyim iki kitabında bu konuda kesin bir hüküm vermedi, üçüncüsünde ise nihai rahmete meyletti. İslam ayrıca mesaj kendisine gerçekten ulaşmadıkça hiç kimsenin azaba uğratılmadığını kabul eder; dolayısıyla "ebedî cehennem", "Müslüman olmayan herkes" demek değildir. Orantılılık itirazının gerçek cevapları vardır, ama hiçbiri onun bütün gücünü ortadan kaldırmaz. Bu konuda geleneğin kendisi, büyük isimlerden oluşan bir azınlığı barındırır.
  en: Most Sunni scholars hold that Hell is eternal for those who knowingly and persistently reject God. Al-Subki, the leading Shafiʿi judge of 14th-century Damascus, declared the contrary view unbelief. But Ibn Taymiyya's last treatise argued that while the Garden is eternal, the punishment of unbelievers will end. His student Ibn al-Qayyim was agnostic in two books and leaned toward ultimate mercy in a third. Islam also holds that no one is punished until the message has truly reached them, so "eternal Hell" does not mean "everyone who was not Muslim." The proportionality objection has real replies, but none removes all of its force. On this question the tradition itself contains a minority of great names.
layers:
  - kind: religious
    tr: |
      - *Âyetler:* "orada ebedî kalacaklar" (4:169; 72:23); "Rabbinin dilemesi müstesna, gökler ve yer durdukça" (11:106–107); "çağlar boyu" (78:23).
      - *Çoğunluk (Eş'arî, Mâtürîdî, Eserîlerin çoğu):* kâfirler için ebedîdir; günahkâr müminler çıkar. Sübkî, İbn Teymiyye'ye sert bir reddiye yazdı.
      - *Azınlık:* Jon Hoover'a göre İbn Teymiyye'nin *Fenâü'n-nâr*'ı, ebedîliğe dair bir icma olmadığını ve azabın bir amaca yönelik olduğunu savunur, ama cezanın bittiğini kesin olarak söylemez; İbn Kayyim cehennemi iyileştirici ve ıslah edici olarak geliştirir. İbn Vezîr hüküm vermekten kaçındı; Reşîd Rızâ temkinli bir evrenselciliğe meyletti.
      - *Tasavvuf:* İbn Arabî: ehli için ateşin azabı (*azâb*) "tatlılığa" (*azb*) dönüşür [Debated].
    en: |-
      - *Verses:* "abiding therein forever" (4:169; 72:23); "as long as heavens and earth endure, except as your Lord wills" (11:106–107); "for ages" (78:23).
      - *Majority (Ashʿarī, Māturīdī, most Atharīs):* eternal for disbelievers; sinning believers leave. Al-Subkī refuted Ibn Taymiyya sharply.
      - *Minority:* per Jon Hoover, Ibn Taymiyya's Fanāʾ al-nār argues there is no consensus on eternity and that chastisement is purposive, though he never states categorically that it ends; Ibn al-Qayyim develops Hell as therapeutic and reformative. Ibn al-Wazīr withheld judgment; Rashīd Riḍā leaned toward cautious universalism.
      - *Sufi:* Ibn ʿArabī: for its people, the Fire's torment (ʿadhāb) becomes "sweetness" (ʿadhb) [Debated].
  - kind: philosophical
    tr: |
      Cevaplar: (a) sabitleşmiş karakter: ceza süregiden reddi izler (6:28); (b) suç, kendisine karşı işlenenin yüceliğiyle büyür (modern okurlar için en zayıfı); (c) evrenselci azınlık.
    en: "Responses: (a) fixed character: punishment tracks enduring rejection (6:28); (b) offence scales with the dignity of the one wronged (weakest for modern readers); (c) the universalist minority."
  - kind: psychological
    tr: |
      Cehennem kaygısı dinî titizlikte (vesvese) yaygındır. Kaygılı bir okura ürkütücü imgeler yardımcı olmaz. Adalet rahmetle birlikte düşünülür: hadiste Allah'ın rahmeti yüz parçadır ve doksan dokuzu âhiret için saklanmıştır (Müslim 2752).
    en: "Hell-anxiety is common in scrupulosity. For an anxious reader, graphic imagery does not help. Justice is held together with mercy: in the hadith, God's mercy has 100 parts, 99 of them kept for the Hereafter (Muslim 2752)."
