steelman:
  tr: "\"Kur'an 'ellerinizin altında bulunanlar'dan söz eder ve erkeklerin sahip oldukları kadınlarla cinsel ilişkiye girmesine izin verir. Köleliği düzenler, ama hiçbir zaman kaldırmaz. Peygamber'in kendisi köle sahibiydi ve bir cariyesi vardı. Müslüman toplumlar on iki yüzyıl boyunca köle tuttu ve köleliğin kaldırılması Avrupa baskısıyla geldi; bazı Müslüman âlimler buna direndi. 2014'te IŞİD Ezidi kadınları köleleştirdi ve klasik metinleri alıntıladı. Adil bir Allah'ın son hukuku buna nasıl izin vermiş olabilir ve birinin bunu geri getirmesini ne engelliyor?\""
  en: "\"The Quran speaks of 'those your right hands possess' and permits men to have sex with women they own. It regulates slavery but never abolishes it. The Prophet himself owned slaves and had a concubine. Muslim societies held slaves for twelve centuries, and abolition came under European pressure, with some Muslim scholars resisting it. In 2014, ISIS enslaved Yazidi women and quoted the classical texts. How can a just God's final law have allowed this, and what stops someone from bringing it back?\""
whyAsked:
  tr: IŞİD'in 2014'te Ezidi kadınları köleleştirmesi soruyu acil hâle getirdi. Modern okuyucular köleliği haklı olarak tarihin büyük haksızlıklarından biri olarak görür ve metinleri sarsıcı bulur. Afrika'da, Orta Doğu'da ve başka yerlerde köleleştirilmiş insanların torunları bu soruyu kendi tarihleri hakkında sorar.
  en: ISIS's enslavement of Yazidi women in 2014 made the question urgent. Modern readers rightly see slavery as one of history's great wrongs, and find the texts jarring. Descendants of enslaved people, in Africa, the Middle East and elsewhere, ask it about their own history.
shortAnswer:
  tr: Kur'an köleliği kaldırmadı. Köle azat etmeyi yüksek bir fazilet ve birkaç günah için zorunlu bir kefaret yaptı, kölelere hürriyetlerini satın alma hakkı tanıdı ve insanların köleleştirilebileceği yolları sınırladı. Klasik hukuk, efendinin cariyesiyle onun rızası olmadan cinsel ilişkiye girmesine izin verdi ve Hz. Peygamber'in (s.a.v.) kendisinin köleleri ve en az bir cariyesi vardı. Müslümanların öncülük ettiği kölelik karşıtlığı geç geldi; on dokuzuncu ve yirminci yüzyıllarda ve büyük ölçüde dış baskıyla. Bugün Müslüman âlimler, âlimlerin icmâı, bağlayıcı antlaşmalar ve Şerîat'ın hürriyet amacı gerekçesiyle köleliğin haram olduğunu ezici çoğunlukla kabul ediyor. Bu modern tutum gerçektir ve geniş çapta paylaşılır, ama klasik tutum değildir ve dürüstlük ikisini de söylemeyi gerektirir.
  en: The Quran did not abolish slavery. It made freeing slaves an act of high virtue and a required atonement for several sins, gave slaves a right to buy their freedom, and limited the ways people could be enslaved. Classical law allowed a master to have sex with his female slave without her consent, and the Prophet (pbuh) himself had slaves and at least one concubine. Muslim-led abolition came late, in the nineteenth and twentieth centuries, largely under outside pressure. Today, Muslim scholars overwhelmingly hold slavery to be forbidden, on the grounds of scholarly consensus, binding treaties, and the Sharia's aim of freedom. That modern position is real and widely shared, but it is not the classical one, and honesty requires saying both.
layers:
  - kind: religious
    tr: |
      - Köle azat etmek "sarp yokuştur" (90:13) ve bir keffarettir (4:92; 5:89; 58:3).
      - Zekât esirlerin hürriyetine harcanabilir (9:60).
      - Köleler sözleşmeyle (*mükâtebe*) hürriyetlerini satın alabilir (24:33).
      - "Köleleriniz kardeşlerinizdir" (Buhârî 30).
      - Cariyenin çocuğu hür doğardı ve anne (*ümmü veled*) efendisinin ölümüyle hür olurdu.

      Kecia Ali (2010), klasik evlilik hukukunun mülkiyetle bir kıyastan beslendiğini gösterir. Jonathan Brown (2019) köleliğin kaldırılmasının "İslam'ın kendi içinden doğmadığını" yazar, ama âlimlerin icmaının ve *makâsıd*ın bugün bunu desteklediğini savunur.
    en: |-
      - Freeing a slave is the "steep path" (90:13) and an atonement (4:92; 5:89; 58:3).
      - Zakat can fund freeing captives (9:60).
      - Slaves can buy their freedom by contract (*mukātaba*) (24:33).
      - "Your slaves are your brothers" (Bukhārī 30).
      - A concubine's child was born free, and the mother (*umm walad*) was freed at her master's death.

      Kecia Ali (2010) shows that classical marriage law drew on an analogy with ownership. Jonathan Brown (2019) writes that "abolition is not indigenous to Islam," but argues that scholarly consensus and the *maqāṣid* now support it.
  - kind: philosophical
    tr: |
      Reformcular (Abduh, Rızâ, İbn Âşûr) şeriatın hürriyeti amaçladığını söyler. İtiraz şudur: bu kademeli yol 1.200 yıl boyunca durdu. Rıza olmadan cariyelik en zor nokta olarak kalıyor ve tam tatmin edici bir cevap yok.
    en: Reformists (ʿAbduh, Riḍā, Ibn ʿĀshūr) say the Sharia aims at freedom. The objection is that this gradual path stalled for 1,200 years. Concubinage without consent remains the hardest point, and no fully satisfying answer exists.
  - kind: history
    tr: |
      Osmanlı adımları:
      - 1847: İstanbul esir pazarı kapatıldı.
      - 1854–55: Çerkes ticareti yasaklandı; bu Hicaz'da bir isyana yol açtı ve Hicaz daha sonra muaf tutuldu.
      - 1857: siyahi köle ticareti yasaklandı.

      Suudi Arabistan köleliği 1962'de, Moritanya 1981'de kaldırdı. Pérouse de Montclos (2002): Hristiyan dünyasından farklı olarak İslam bir kölelik karşıtı hareket üretmedi.
    en: |-
      Ottoman steps:
      - 1847: the Istanbul slave market closed.
      - 1854–55: the Circassian trade was banned, which sparked a revolt in the Hijaz; the Hijaz was then exempted.
      - 1857: the Black slave trade was banned.

      Saudi Arabia abolished slavery in 1962 and Mauritania in 1981. Pérouse de Montclos (2002): unlike Christendom, Islam produced no abolitionist movement.
  - kind: psychological
    tr: |
      Köleleştirilmiş insanların torunları, örneğin Afro-Türkler, bunu kişisel olarak hissedebilir. Dürüstlük onlara saygıdır.
    en: Descendants of enslaved people, such as Afro-Turks, may feel this personally. Honesty respects them.
honestLimits:
  tr: "\"İslam köleliği kaldırdı\" sözü yanlıştır. \"İslam'daki kölelik yumuşaktı\" sözü dürüst değildir. Rıza olmadan cinsel ilişkiye klasik iznin tam olarak tatmin edici bir cevabı yoktur ve Müslüman âlimler onu nasıl değerlendirecekleri konusunda ayrılır. Modern yasak gerçektir ve güçlü temellere dayanır, ama modern bir gelişmedir. Brown'ın kitabı yalnızca iki inceleme aracılığıyla okundu; ticaret yollarına ilişkin sayılar belirsizliğini koruyor."
  en: "\"Islam abolished slavery\" is false. \"Islamic slavery was gentle\" is not honest. The classical permission of sex without consent has no fully satisfying answer, and Muslim scholars disagree on how to judge it. The modern prohibition is real and strongly grounded, but it is a modern development. Brown's book was read only through two reviews; numbers for the trades remain uncertain."
