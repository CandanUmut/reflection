fullAnswer:
  - kind: heart
    en: |-
      **Your grief is a measure of your love, and it does not mean your faith is weak.** The question "Is there anything after?" is often not abstract; it is about one person. The Quran's answer is not only an argument. It is a promise that the person you lost is not lost to God, and that justice and mercy have the last word.

      **What helps.** Grief comes in waves, and there is no correct timetable. Talk about the person; pray for them; let others carry some of the weight. If, months later, grief still stops you from living, or you feel you cannot go on, please talk to a doctor or counsellor. That is care, not a lack of trust in God.

      > **Where to find help.** Find A Helpline (findahelpline.com) lists "free, anonymous and confidential" support lines in many countries, including for grief and loss. If you are in danger, contact your local emergency number.
    tr: |-
      **Kederin sevginin ölçüsüdür ve imanının zayıf olduğu anlamına gelmez.** "Sonrasında bir şey var mı?" sorusu çoğu zaman soyut değildir; tek bir kişi hakkındadır. Kur'an'ın cevabı yalnızca bir argüman değildir. Kaybettiğin kişinin Allah için kaybolmadığına ve son sözün adalete ve rahmete ait olduğuna dair bir vaattir.

      **Ne yardımcı olur?** Keder dalgalar hâlinde gelir ve doğru bir takvimi yoktur. O kişi hakkında konuş; onun için dua et; yükün bir kısmını başkalarının taşımasına izin ver. Aylar sonra keder hâlâ yaşamanı engelliyorsa ya da devam edemeyeceğini hissediyorsan, lütfen bir doktorla ya da danışmanla konuş. Bu Allah'a güvensizlik değil, kendine özen göstermektir.

      > **Yardım nerede bulunur?** Find A Helpline (findahelpline.com), keder ve kayıp için olanlar dahil, pek çok ülkede "ücretsiz, anonim ve gizli" destek hatlarını listeler. Tehlikedeysen bulunduğun yerdeki acil yardım numarasını ara.
    title:
      en: Yas tutan kişi için
      tr: Yas tutan kişi için
  - kind: quran
    en: |-
      **1. From the first creation (36:78–79).** "And he presents for Us an example and forgets his [own] creation. He says, 'Who will give life to bones while they are disintegrated?' Say, 'He will give them life who produced them the first time; and He is, of all creation, Knowing'" (36:78–79), Meccan. *Occasion:* Mujahid, ʿIkrima and others say "Ubayy bin Khalaf… came to the Messenger of Allah… with a dry bone in his hand"; Ibn ʿAbbas names "Al-'As bin Wa'il", who "took a bone from the bed of a valley and crumbled it in his hand"; Ibn Kathir concludes that the verses "apply to all those who deny the resurrection after death". *The argument spelled out:* you exist now, made from what was not you; making something the first time is not easier than remaking it. Ibn Kathir: "Man forgets about himself, that Allah created him from nothing and brought him into existence."

      **2. From fire in the green tree (36:80).** "[It is] He who made for you from the green tree, fire, and then from it you ignite" (36:80). Qatada, quoted by Ibn Kathir: "the One Who brought forth this fire from this tree is able to resurrect him." The point: God brings opposites out of each other — fire from moist wood, life from dry bones.

      **3. From precision (75:3–4).** "Does man think that We will not assemble his bones? Yes. [We are] Able [even] to proportion his fingertips" (75:3–4), Meccan.

      **4. From justice and purpose (38:28).** "Or should we treat those who believe and do righteous deeds like corrupters in the land? Or should We treat those who fear Allah like the wicked?" (38:28), Meccan, after 38:27, which Ibn Kathir's translator renders: "And We created not the heaven and the earth and all that is between them without purpose!" (not Saheeh; 38:27 was not available in verified data). Ibn Kathir: "There must inevitably be another realm in which those who obey Allah will be rewarded and the wicked will be punished", since in this world the wicked often prosper. Al-Jalālayn says the verse answered Meccan disbelievers who claimed they would fare as well as the believers in the Hereafter.

      The Quran promises that believers will be joined by their believing descendants (52:21), and that the righteous among their "fathers, their spouses and their descendants" will enter the Gardens with them (13:23; also the angels' prayer in 40:8). The condition is stated: righteousness, or following "in faith".
    tr: |-
      **1. İlk yaratılıştan (36:78–79).** "Yaratılışını unutarak bize bir de mesel fırlattı: "Kim diriltecekmiş o çürümüş kemikleri?" dedi. De ki: "Onları ilk defa yaratan diriltecek ve o her yaratmayı bilir."" (36:78–79), Mekkî. *İniş sebebi:* Mücâhid, İkrime ve diğerleri, "Übey b. Halef'in… elinde kuru bir kemikle Allah'ın Resulü'ne… geldiğini" söyler; İbn Abbâs ise "Âs b. Vâil"in adını verir; o "bir vadinin yatağından bir kemik aldı ve onu elinde ufaladı"; İbn Kesîr, âyetlerin "ölümden sonra dirilişi inkâr eden herkese uygulandığı" sonucuna varır. *Argümanın açılımı:* Şimdi varsın, sen olmayan şeylerden yapılmış olarak; bir şeyi ilk defa yapmak, onu yeniden yapmaktan daha kolay değildir. İbn Kesîr: "İnsan kendisini, Allah'ın onu yoktan yarattığını ve var ettiğini unutur."

      **2. Yeşil ağaçtaki ateşten (36:80).** "Size o yeşil ağaçtan bir ateş yapan O'dur. Şimdi siz ondan tutuşturmaktasınız." (36:80). İbn Kesîr'in aktardığı Katâde: "Bu ateşi bu ağaçtan çıkaran, onu diriltmeye kâdirdir." Nokta şu: Allah zıtları birbirinden çıkarır — nemli odundan ateş, kuru kemiklerden hayat.

      **3. İncelikten (75:3–4).** "İnsan, kendisinin kemiklerini bir araya toplayamayacağımızı mı sanıyor? Evet, bizim onun parmak uçlarını bile aynen eski haline getirmeye gücümüz yeter." (75:3–4), Mekkî.

      **4. Adaletten ve amaçtan (38:28).** "Yoksa, iman edip de salih amel işleyenleri biz, o yeryüzündeki bozguncular gibi yapar mıyız? Yoksa o takva sahiplerini azgın günahkarlar gibi yapar mıyız?" (38:28), Mekkî; şu âyetten sonra: "Hem o göğü, yeri ve aralarındakileri biz boşuna yaratmadık." (38:27). İbn Kesîr: "Allah'a itaat edenlerin ödüllendirileceği ve kötülerin cezalandırılacağı başka bir âlemin mutlaka olması gerekir", çünkü bu dünyada kötüler çoğu zaman refah içindedir. *Celâleyn*, âyetin, ahirette müminler kadar iyi durumda olacaklarını iddia eden Mekkeli kâfirlere cevap verdiğini söyler.
    title:
      en: Kur'an'ın diriliş lehindeki argümanları
      tr: Kur'an'ın diriliş lehindeki argümanları
  - kind: sunnah
    en: |-
      **The barzakh.** When a dying person asks to be sent back, the answer is: "No! It is only a word he is saying; and behind them is a barrier until the Day they are resurrected" (23:100). *Barzakh* ("barrier") is the name for the state between death and resurrection.

      **The grave.** Anas (ra) reports the Prophet (pbuh): "When a human being is laid in his grave and his companions return and he even hears their foot steps", "two angels come to him and make him sit and ask him", "What did you use to say about this man, Muhammad?" The believer answers, "I testify that he is Allah's slave and His Apostle", and is told: "Look at your place in the Hell-Fire. Allah has given you a place in Paradise instead of it." The one who says "I do not know, but I used to say what the people used to say!" fares otherwise ({hadith:bukhari:1338}).

      **Resurrection, judgement, reunion.** The Quran and Sunna teach a bodily resurrection on the Last Day, a judgement in which each person sees their deeds, and then Paradise or Hell.

      **The soul.** "And they ask you, [O Muhammad], about the soul. Say, 'The soul is of the affair of my Lord. And mankind have not been given of knowledge except a little'" (17:85). And: "Allah takes the souls at the time of their death, and those that do not die [He takes] during their sleep" (39:42). The Quran treats the soul as real and as God's to take and return, while saying little about its nature.
    tr: |-
      **Berzah.** Ölmek üzere olan biri geri gönderilmeyi istediğinde cevap şudur: "Hayır! Onun söylediği bu söz (boş) laftan ibarettir. Onların gerisinde ise, yeniden dirilecekleri güne kadar (süren) bir berzah vardır" (23:100). *Berzah* ("perde, engel"), ölüm ile diriliş arasındaki hâlin adıdır.

      **Kabir.** Enes (r.a.), Hz. Peygamber'in (s.a.v.) şöyle buyurduğunu aktarır: "Bir insan kabrine konduğunda ve arkadaşları dönüp o onların ayak seslerini bile duyduğunda", "iki melek ona gelir, onu oturtur ve sorarlar": "Bu adam, Muhammed hakkında ne derdin?" Mümin, "Onun Allah'ın kulu ve Resulü olduğuna şahitlik ederim" diye cevap verir ve ona şöyle denir: "Cehennemdeki yerine bak. Allah sana onun yerine cennette bir yer verdi." "Bilmiyorum, ama insanların dediğini derdim!" diyenin durumu ise farklıdır ({hadith:bukhari:1338}).

      **Diriliş, hesap, kavuşma.** Kur'an ve Sünnet, Son Gün'de bedenen dirilişi, herkesin amellerini gördüğü bir hesabı ve ardından cenneti ya da cehennemi öğretir.

      **Ruh.** "Ey Muhammed! Sana ruhtan soruyorlar. De ki: "Ruh Rabbimin bildiği bir iştir ve size ilimden ancak az bir şey verilmiştir."" (17:85). Ve: "Allah, o canları öldükleri zaman, ölmeyenleri de uyuduklarında alır." (39:42). Kur'an ruhu gerçek ve almak ve geri vermek Allah'a ait olan bir şey olarak ele alır, ama mahiyeti hakkında az şey söyler.
    title:
      en: İslam öğretisinde ölümden sonra ne olur?
      tr: İslam öğretisinde ölümden sonra ne olur?
  - kind: scholars
    en: |-
      **Al-Ghazali: bodily resurrection.** In the conclusion of *The Incoherence of the Philosophers*, al-Ghazali names three theses that make the philosophers unbelievers; one is "their denial of the resurrection of bodies" (trans. Kamali). His target was above all Ibn Sina. In the *Tahāfut*, to refute the philosophers on their own premises, he argued that even if the soul survives, God could return it to a body, "ister bu beden insan bedeninin aynısı isterse de gayrısı olsun" — whether the same human body or another. But in *al-Iqtiṣād fī al-iʿtiqād* he says that this concession "bizim inancımıza uygun değildir" — "is not in accordance with our belief" — because that book was written to refute, not to prove (Yılmaz's Turkish rendering). Yılmaz judges that al-Ghazali stayed deliberately ambiguous about the soul's nature. For him, bodily resurrection is a matter "vahiyle vurgulanmış ve gerçekleşmesi imkânsız olmayan" — stressed by revelation and not impossible (Yılmaz). His point against the philosophers was that they had not *proved* it impossible.

      **Nursi: twelve "gates".** In the Tenth Word (*The Resurrection and the Hereafter*), Said Nursi argues from God's names. The "SECOND TRUTH: The gate of Munificence and Mercy" rests on an observation, which the "THIRD TRUTH: The gate of Wisdom and Justice" develops: "This world's oppressors die with their oppressive power intact, while the oppressed die still subjected to humiliation." A just and merciful God would not leave it there. In the "Ninth Truth", spring is a daily sample of resurrection: "Each spring we see countless animal and plant species assembled in a few days and then scattered" ("Twelve Truths"). The Tenth Word opens with the verse "Look, then, to the signs of God's mercy - how He restores life to the earth after its death" (tr. Algar).

      **Mutahhari.** His work has not yet been consulted.
    tr: |-
      **Gazzâlî: bedenen diriliş.** Gazzâlî *Tehâfütü'l-Felâsife*'de, filozofların "ahirette bedenen diriliş olmayacak" tezini küfür saydı (*Wikipedia*). Hedefi en başta İbn Sînâ'ydı. *Tehâfüt*'te, filozofları kendi öncülleriyle çürütmek için, ruh varlığını sürdürse bile Allah'ın onu bir bedene geri verebileceğini savundu, "ister bu beden insan bedeninin aynısı isterse de gayrısı olsun". Ama *el-İktisâd fi'l-İ'tikâd*'da bu tavizin "bizim inancımıza uygun değildir" dediğini söyler, çünkü o kitap ispat etmek için değil, çürütmek için yazılmıştı (Yılmaz'ın Türkçe aktarımı). Yılmaz, Gazzâlî'nin ruhun mahiyeti konusunda bilerek belirsiz kaldığı kanaatindedir. Onun için bedenen diriliş, "vahiyle vurgulanmış ve gerçekleşmesi imkânsız olmayan" bir meseledir (Yılmaz). Filozoflara karşı noktası, onların bunun imkânsız olduğunu *ispat etmemiş* olmalarıydı.

      **Nursî: on iki "kapı".** Onuncu Söz'de (*Haşir Risalesi*), Said Nursî Allah'ın isimlerinden yola çıkarak argüman getirir. "İKİNCİ HAKİKAT: Kerem ve Rahmet kapısı" bir gözleme dayanır ve "ÜÇÜNCÜ HAKİKAT: Hikmet ve Adalet kapısı" onu geliştirir: "Bu dünyanın zalimleri zulüm güçleri yerinde iken ölürler, mazlumlar ise hâlâ zillete maruz kalmışken ölürler." Adil ve merhametli bir Allah meseleyi orada bırakmaz. "Dokuzuncu Hakikat"te bahar, dirilişin her gün görülen bir örneğidir: "Her baharda sayısız hayvan ve bitki türünün birkaç gün içinde toplanıp sonra dağıldığını görürüz" ("On İki Hakikat"). Onuncu Söz şu âyetle açılır: "Şimdi bak Allah'ın rahmetinin eserlerine! yeryüzünü ölümünden sonra nasıl diriltiyor?" (30:50; Algar'ın çevirisinden).

      **Mutahharî.** Eserine henüz başvurulmadı.
    title:
      en: Müslüman âlimler neyi savundu?
      tr: Müslüman âlimler neyi savundu?
  - kind: reasoning
    en: |-
      **What the objection gets right.** The mind depends on the brain in this life: injuries, drugs and illness change memory, mood and personality. Any honest answer must accept this.

      **What it does not show.** Dependence is not identity. The "hard problem" is "the problem of explaining why any physical state is conscious rather than nonconscious": after a complete account of what the brain does, one can still ask, with Chalmers, "Why is the performance of these functions accompanied by experience?" Joseph Levine "argues that there is a special 'explanatory gap' between consciousness and the physical" (IEP). Philosophers divide: some say consciousness will be explained physically; some (dualists) that it is distinct from the physical; some that it is a basic feature of reality. The IEP article itself does not discuss survival after death — the hard problem does not prove the mind survives; it shows that "the mind is just the brain" is not established either.

      **An analogy, with its limit.** A radio's sound changes when the radio is damaged; that does not by itself show whether the sound is made in the radio or received by it. (This analogy is often used in these debates; no named source for it was read.) *Limit:* it is only an analogy; it shows that the evidence of dependence is compatible with survival, not that survival is true.

      **The Islamic picture is not only "a soul floating free".** Islam teaches bodily resurrection: what continues is the person, whom God raises with a body. The afterlife, on this teaching, does not rest on the soul being independent of all bodies.

      **Kant's moral argument, in a few sentences.** Kant held that morality commands us to pursue the "highest good": a world in which happiness is "in conformity with the purest morality", proportioned to "the worthiness of a subject". We cannot see how that is possible in nature alone, so practical reason "postulates" God, who can bring virtue and happiness together, and a future life in which this is realised. Kant insisted this is not a theoretical proof: "I must not even say 'It is morally certain that there is a God', but rather 'I am morally certain'" (SEP). *Limit:* critics answer that the demand for cosmic justice may simply go unmet.

      **Is there any reason beyond "justice seems to require it"?** Yes, three, of different strengths: the argument from the first creation (if you exist once, you can exist again), the unsolved hard problem (which leaves room for more than the brain), and — for believers — trust in the One who promised it. None is a proof; together they make the hope reasonable rather than wishful.
    tr: |-
      **İtirazın haklı olduğu nokta.** Zihin bu hayatta beyne bağlıdır: Yaralanmalar, ilaçlar ve hastalıklar hafızayı, ruh hâlini ve kişiliği değiştirir. Her dürüst cevap bunu kabul etmelidir.

      **Neyi göstermez?** Bağımlılık özdeşlik değildir. "Zor problem", "herhangi bir fiziksel durumun neden bilinçsiz değil de bilinçli olduğunu açıklama problemidir": Beynin ne yaptığına dair eksiksiz bir açıklamadan sonra bile, Chalmers ile birlikte sorulabilir: "Bu işlevlerin yerine getirilmesine neden bir tecrübe eşlik ediyor?" Joseph Levine, "bilinç ile fiziksel olan arasında özel bir 'açıklama boşluğu' olduğunu savunur" (IEP). Filozoflar ayrılır: Bazıları bilincin fiziksel olarak açıklanacağını söyler; bazıları (düalistler) onun fiziksel olandan farklı olduğunu; bazıları da onun gerçekliğin temel bir özelliği olduğunu. IEP makalesinin kendisi ölümden sonra varlığın sürmesini tartışmaz — zor problem zihnin varlığını sürdürdüğünü ispat etmez; "zihin yalnızca beyindir" iddiasının da kanıtlanmadığını gösterir.

      **Sınırıyla birlikte bir benzetme.** Bir radyonun sesi radyo hasar gördüğünde değişir; bu tek başına sesin radyoda mı üretildiğini yoksa onun tarafından mı alındığını göstermez. (Bu benzetme bu tartışmalarda sıkça kullanılır; onun için adı belli hiçbir kaynak okunmadı.) *Sınır:* Bu yalnızca bir benzetmedir; bağımlılık delilinin varlığın sürmesiyle bağdaştığını gösterir, varlığın sürdüğünün doğru olduğunu değil.

      **İslami tablo yalnızca "serbestçe süzülen bir ruh" değildir.** İslam bedenen dirilişi öğretir: Devam eden, Allah'ın bir bedenle dirilttiği kişidir. Bu öğretiye göre ahiret, ruhun bütün bedenlerden bağımsız olmasına dayanmaz.

      **Birkaç cümleyle Kant'ın ahlaki argümanı.** Kant, ahlakın bize "en yüksek iyiyi" aramayı emrettiğini savundu: mutluluğun "en saf ahlaka uygun olduğu", "bir öznenin layık olmasıyla" orantılı olduğu bir dünya. Bunun yalnızca doğa içinde nasıl mümkün olduğunu göremeyiz; dolayısıyla pratik akıl, erdemi ve mutluluğu bir araya getirebilecek Allah'ı ve bunun gerçekleşeceği gelecek bir hayatı "postüla eder". Kant bunun teorik bir ispat olmadığında ısrar etti: "'Bir Allah'ın var olduğu ahlaken kesindir' bile dememeliyim, aksine 'Ben ahlaken eminim' demeliyim" (SEP). *Sınır:* Eleştirmenler kozmik adalet talebinin basitçe karşılıksız kalabileceği cevabını verir.

      **"Adalet bunu gerektiriyor gibi görünüyor"un ötesinde bir gerekçe var mı?** Evet, farklı güçlerde üç tane: ilk yaratılıştan argüman (bir kez var olduysan, yeniden var olabilirsin), çözülmemiş zor problem (beyinden fazlası için yer bırakır) ve — müminler için — onu vaat edene güven. Hiçbiri bir ispat değildir; birlikte umudu bir dilek olmaktan çıkarıp makul kılarlar.
    title:
      en: Zihin–beyin itirazı ve cevabı
      tr: Zihin–beyin itirazı ve cevabı
  - kind: science
    en: |-
      **AWARE I (2014).** Of 2,060 cardiac arrests, 140 survivors completed a first interview and 101 a second; 46% had memories, 9% near-death experiences (NDEs), and 2% explicit awareness of "'seeing' and 'hearing' actual events" related to resuscitation. "One had a verifiable period of conscious awareness during which time cerebral function was not expected" (Parnia et al., *Resuscitation* 85, 2014). [Moderate, for the frequency; Debated, for interpretation]

      **AWARE II (2023).** Of 567 in-hospital cardiac arrests at 25 sites, 53 patients survived (9.3%) and 28 were interviewed (52.8%). Of these 28, 11 (39.3%) reported memories or perceptions suggesting consciousness: CPR-induced consciousness 2/28 (7.1%), post-resuscitation 2/28 (7.1%), dream-like experiences 3/28 (10.7%), and a "transcendent recalled experience of death" 6/28 (21.4%). Nobody identified the hidden visual image; 1/28 (3.5%) identified the auditory stimulus. Despite severe lack of oxygen (mean rSO₂ 43%), in monitored patients, normal EEG activity consistent with consciousness appeared as late as 35–60 minutes into CPR (the abstract gives no count of patients with EEG). The authors conclude that "Consciousness. awareness and cognitive processes may occur during CA" (cardiac arrest) (Parnia et al., *Resuscitation* 191, 2023). *Denominators matter:* the 21% is of 28 interviewed survivors, not of 567 patients.

      **The dying-brain account.** In a University of Michigan study (Xu, Borjigin et al., *PNAS*, 2023), four comatose patients were monitored by EEG as life support was withdrawn; in two of the four, gamma-wave activity surged in the junction of the temporal, parietal and occipital lobes, an area linked in other studies to dreaming and altered states. The researchers stress the small sample: "it's impossible to know in this study what the patients experienced because they did not survive." This supports the idea that a dying brain can produce intense activity, which could underlie NDEs. [Mixed]

      **What the research shows.** It shows that experiences during cardiac arrest are more common, and brain activity more persistent, than once thought. It does not show that the mind leaves the body: the key test — identifying a hidden image — has not been passed.
    tr: |-
      **AWARE I (2014).** 2.060 kalp durmasından 140 hayatta kalan ilk görüşmeyi, 101'i ikinci görüşmeyi tamamladı; %46'sının anıları, %9'unun ölüme yakın deneyimleri (ÖYD) ve %2'sinin canlandırmayla ilgili "gerçek olayları 'görme' ve 'duyma'" şeklinde açık bir farkındalığı vardı. "Birinin, beyin işlevinin beklenmediği bir sırada doğrulanabilir bir bilinçli farkındalık dönemi vardı" (Parnia ve ark., *Resuscitation* 85, 2014). [Orta, sıklık için; Debated, yorum için]

      **AWARE II (2023).** 25 merkezdeki 567 hastane içi kalp durmasından 53 hasta hayatta kaldı (%9,3) ve 28'iyle görüşüldü (%52,8). Bu 28 kişiden 11'i (%39,3) bilinci düşündüren anılar ya da algılar bildirdi: KPR'nin yol açtığı bilinç 2/28 (%7,1), canlandırma sonrası 2/28 (%7,1), rüya benzeri deneyimler 3/28 (%10,7) ve "ölüme dair aşkın bir hatırlanan tecrübe" 6/28 (%21,4). Hiç kimse gizlenmiş görüntüyü tanımlayamadı; 1/28 (%3,5) işitsel uyaranı tanımladı. Ağır oksijen eksikliğine rağmen (ortalama rSO₂ %43), izlenen hastalarda bilinçle tutarlı normal EEG faaliyeti KPR'nin 35–60. dakikasına kadar görüldü (özet EEG'si olan hasta sayısını vermiyor). Yazarlar "Kalp durması sırasında bilinç. farkındalık ve bilişsel süreçler gerçekleşebilir" sonucuna varıyor (Parnia ve ark., *Resuscitation* 191, 2023). *Paydalar önemlidir:* %21, 567 hastanın değil, görüşülen 28 hayatta kalanın yüzdesidir.

      **Ölmekte olan beyin açıklaması.** Michigan Üniversitesi'ndeki bir çalışmada (Xu, Borjigin ve ark., *PNAS*, 2023), yaşam desteği kesilirken dört koma hastası EEG ile izlendi; dört hastadan ikisinde, başka çalışmalarda rüya görmeye ve değişmiş bilinç hâllerine bağlanan bir bölge olan şakak, yan ve art kafa loblarının birleşim yerinde gama dalgası faaliyeti yükseldi. Araştırmacılar örneklemin küçüklüğünü vurguluyor: "Bu çalışmada hastaların ne yaşadığını bilmek imkânsız, çünkü hayatta kalmadılar." Bu, ölmekte olan bir beynin ÖYD'lerin altında yatabilecek yoğun bir faaliyet üretebileceği fikrini destekler. [Karışık]

      **Araştırma ne gösteriyor?** Kalp durması sırasındaki deneyimlerin bir zamanlar düşünülenden daha yaygın, beyin faaliyetinin de daha kalıcı olduğunu gösteriyor. Zihnin bedeni terk ettiğini göstermiyor: Anahtar sınav — gizlenmiş bir görüntüyü tanımlamak — geçilmiş değil.
    title:
      en: Ölüme yakın deneyim araştırmaları
      tr: Ölüme yakın deneyim araştırmaları
  - kind: objection
    en: |-
      **"The mind depends on the brain, so it dies with the brain."** *Reply:* dependence in this life does not establish identity, and the hard problem remains unsolved; in any case, Islam's hope rests on resurrection by God, not on the brain. *Limit:* to someone who is a physicalist, the reply will look like an appeal to a gap.

      **"NDEs are just the dying brain."** *Reply:* that may be so; the page does not rest the case for an afterlife on NDEs. *Limit:* NDEs neither prove nor disprove an afterlife.

      **"Justice is a wish, not evidence."** *Reply:* Kant's point is that we cannot act morally without treating justice as real; the Quran's point is that a purposeless creation would contradict its Creator (38:27–28). *Limit:* both arguments assume something — the authority of morality, or a purposeful Creator — that the sceptic may deny.
    tr: |-
      **"Zihin beyne bağlıdır, dolayısıyla beyinle birlikte ölür."** *Cevap:* Bu hayattaki bağımlılık özdeşliği kanıtlamaz ve zor problem çözülmüş değildir; her hâlükârda İslam'ın umudu beyne değil, Allah'ın diriltmesine dayanır. *Sınır:* Fizikalist biri için bu cevap bir boşluğa başvurmak gibi görünecektir.

      **"ÖYD'ler sadece ölmekte olan beyindir."** *Cevap:* Öyle olabilir; bu sayfa ahiret lehindeki delili ÖYD'lere dayandırmıyor. *Sınır:* ÖYD'ler bir ahireti ne ispat eder ne de çürütür.

      **"Adalet bir dilektir, delil değil."** *Cevap:* Kant'ın noktası, adaleti gerçek kabul etmeden ahlaki davranamayacağımızdır; Kur'an'ın noktası ise amaçsız bir yaratılışın Yaratıcısıyla çelişeceğidir (38:27–28). *Sınır:* İki argüman da şüphecinin reddedebileceği bir şeyi — ahlakın otoritesini ya da amaçlı bir Yaratıcıyı — varsayar.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **Islamic teaching** — barzakh, bodily resurrection, judgement, Paradise and Hell.
      - **Ibn Sina (as al-Ghazali read him)** — the soul survives; bodily resurrection rejected — counted unbelief by al-Ghazali.
      - **Al-Ghazali** — bodily resurrection is "stressed by revelation and not impossible"; the philosophers did not prove otherwise.
      - **Kant** — immortality is a postulate of practical reason, not a theoretical proof.
      - **Physicalist philosophers** — the mind ends with the brain.
      - **NDE researchers** — divided between those who see evidence of consciousness beyond the brain and those who see a dying-brain process.
    tr: |-
      - **İslam öğretisi** — berzah, bedenen diriliş, hesap, cennet ve cehennem.
      - **İbn Sînâ (Gazzâlî'nin okuduğu şekliyle)** — ruh varlığını sürdürür; bedenen diriliş reddedilir — Gazzâlî tarafından küfür sayıldı.
      - **Gazzâlî** — bedenen diriliş "vahiyle vurgulanmış ve gerçekleşmesi imkânsız olmayan" bir meseledir; filozoflar aksini ispat etmedi.
      - **Kant** — ölümsüzlük teorik bir ispat değil, pratik aklın bir postülasıdır.
      - **Fizikalist filozoflar** — zihin beyinle sona erer.
      - **ÖYD araştırmacıları** — beynin ötesinde bilinç delili görenler ile ölmekte olan bir beynin sürecini görenler arasında ayrılıyor.
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: If brain damage changes personality, what survives death?
      tr: Beyin hasarı kişiliği değiştiriyorsa, ölümden sonra ne kalır?
    a:
      en: In this life, the person's mind works through the brain, and damage changes how it shows itself. Islamic teaching is that the person — the soul, which God takes at death (39:42) — continues in the barzakh and is re-embodied at the resurrection. Whether the hard problem points to a non-physical mind is debated.
      tr: Bu hayatta kişinin zihni beyin aracılığıyla işler ve hasar onun kendini gösterme biçimini değiştirir. İslam öğretisi, kişinin — Allah'ın ölümde aldığı ruhun (39:42) — berzahta devam ettiği ve dirilişte yeniden bedenlendiğidir. Zor problemin fiziksel olmayan bir zihne işaret edip etmediği tartışmalıdır.
  - q:
      en: What is the Quran's argument from the first creation, spelled out?
      tr: Kur'an'ın ilk yaratılıştan argümanı açık hâliyle nedir?
    a:
      en: 'You exist, made from what was not you. The One who did that can do it again: "He will give them life who produced them the first time" (36:79).'
      tr: 'Varsın, sen olmayan şeylerden yapılmış olarak. Bunu yapan onu yeniden yapabilir: "Onları ilk defa yaratan diriltecek" (36:79).'
  - q:
      en: Is there any reason to believe beyond "justice seems to require it"?
      tr: '"Adalet bunu gerektiriyor gibi görünüyor"un ötesinde inanmak için bir gerekçe var mı?'
    a:
      en: "Yes: the argument from first creation, the unsolved hard problem of consciousness, and trust in the promise. None is a proof."
      tr: "Evet: ilk yaratılıştan argüman, bilincin çözülmemiş zor problemi ve vaade güven. Hiçbiri bir ispat değildir."
  - q:
      en: What exactly do Muslims believe happens after death?
      tr: Müslümanlar ölümden sonra tam olarak ne olduğuna inanır?
    a:
      en: The questioning in the grave ({hadith:bukhari:1338}); the barzakh until the Day of Resurrection (23:100); bodily resurrection; judgement; Paradise or Hell.
      tr: Kabirde sorgu ({hadith:bukhari:1338}); Diriliş Günü'ne kadar berzah (23:100); bedenen diriliş; hesap; cennet ya da cehennem.
  - q:
      en: What does "bodily resurrection" mean, and what did al-Ghazali argue?
      tr: '"Bedenen diriliş" ne demek ve Gazzâlî neyi savundu?'
    a:
      en: That the dead will be raised with bodies, not only as souls. Al-Ghazali held that bodily resurrection is taught by revelation and that the philosophers had not shown it impossible. His argument that the soul might return to "the same human body or another" was a concession for argument's sake, which he said "is not in accordance with our belief" (Yılmaz).
      tr: Ölülerin yalnızca ruh olarak değil, bedenleriyle diriltileceği. Gazzâlî bedenen dirilişin vahiyle öğretildiğini ve filozofların onun imkânsız olduğunu göstermediğini savundu. Ruhun "insan bedeninin aynısına ya da gayrısına" dönebileceği argümanı tartışma uğruna yapılmış bir tavizdi; o bunun "bizim inancımıza uygun değildir" dedi (Yılmaz).
  - q:
      en: What is Kant's moral argument, in a few sentences?
      tr: Birkaç cümleyle Kant'ın ahlaki argümanı nedir?
    a:
      en: Morality commands us to seek a world where happiness matches goodness; that is not possible in nature alone; so we must postulate God and a future life — as a practical commitment, not a proof.
      tr: Ahlak bize mutluluğun iyiliğe denk düştüğü bir dünyayı aramayı emreder; bu yalnızca doğa içinde mümkün değildir; dolayısıyla Allah'ı ve gelecek bir hayatı — bir ispat olarak değil, pratik bir bağlılık olarak — postüla etmeliyiz.
