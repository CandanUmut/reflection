id: Q30
slugs:
  tr: ahiret-delili
  en: afterlife
order: 30
theme: afterlife
title:
  tr: Âhirete dair delil
  en: Evidence for an afterlife
sensitivity: normal
helpCard: suffering
verses:
  - 36:78-79
  - 38:28
steelman:
  tr: |
    Zihin beyne bağlıdır ve ölüme yakın deneyimler (ÖYD) ölmekte olan bir beyin tarafından üretiliyor olabilir.
  en: The mind depends on the brain, and near-death experiences (NDEs) may be produced by a dying brain.
whyAsked:
  tr: |
    Yas ve adaletsizlik.
  en: Grief and injustice.
shortAnswer:
  tr: |
    Kur'an ilk yaratılıştan ve adaletten delil getirir. ÖYD araştırmaları ilgi çekicidir ama kanıt değildir.
  en: The Quran argues from the first creation and from justice. NDE research is intriguing but not proof.
layers:
  - kind: religious
    tr: |
      36:78–79; 38:28. Gazzâlî bedensel dirilişi savundu. Mutahhari ve Nursî adaletten delil getirir.
    en: 36:78–79; 38:28. Al-Ghazālī defended bodily resurrection. Muṭahharī and Nursi argue from justice.
  - kind: philosophical
    tr: |
      Ahlâkî argüman (Kant): adalet bu hayattan fazlasını gerektiriyor gibi görünür.
    en: "The moral argument (Kant): justice seems to require more than this life."
  - kind: scientific
    tr: |
      - **AWARE I (2014):** 2.060 kalp durması; görüşülen 101 hayatta kalandan 9'u ÖYD yaşadı.
      - **AWARE II (*Resuscitation* 2023):** 567 kalp durması ve 53 hayatta kalan. Yaklaşık %40'ı farkındalık, yaklaşık %20'si "hatırlanan bir ölüm deneyimi" bildirdi.

      Yazarlar, bunun deneyimlerin gerçek olduğunu ne kanıtladığını ne de çürüttüğünü söylüyor.
    en: |-
      - **AWARE I (2014):** 2,060 cardiac arrests; 9 of 101 interviewed survivors had NDEs.
      - **AWARE II (*Resuscitation* 2023):** 567 cardiac arrests and 53 survivors. About 40% reported awareness and about 20% a "recalled experience of death."

      The authors say this neither proved nor disproved that the experiences are real.
  - kind: psychological
    tr: |
      Karmaşık yas bir klinisyen gerektirir.
    en: Complicated grief needs a clinician.
honestLimits:
  tr: |
    ÖYD'ler kanıt değildir. Hiçbir hasta gizli bir görsel hedefi tanımlayamadı.
  en: NDEs are not proof. No patient identified a hidden visual target.
visualizations:
  - id: ideas
    tr: |
      Ağaca dönüşen bir tohum. Bir AWARE grafiği. Bir adalet terazisi.
    en: A seed growing into a tree. An AWARE chart. A justice scale.
