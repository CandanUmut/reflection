title:
  tr: Âhirete dair delil
  en: Evidence for an afterlife
sensitivity: normal
helpCard: suffering
verses:
  - 36:78-79
  - 38:28
steelman:
  tr: "\"Zihin hakkında bildiğimiz her şey onun beyne bağlı olduğunu söylüyor. Beyne zarar verin, hafıza gider, kişilik değişir, anestezi altında bilinç kapanır. Beyin öldüğünde geriye ne kalabilir? Ölüme yakın deneyimler, oksijensiz kalan, ölmekte olan bir beynin üreteceği şeylere benziyor. Ve ahlaki argüman — 'adalet başka bir hayatı gerektirir' — bir delil değil, bir dilektir: Evren adil olmak zorunda değil.\""
  en: "\"Everything we know about the mind says it depends on the brain. Damage the brain and memory goes, personality changes, consciousness switches off under anaesthesia. When the brain dies, what could be left? Near-death experiences look like what a starved, dying brain would produce. And the moral argument — 'justice requires another life' — is a wish, not evidence: the universe is not obliged to be fair.\""
whyAsked:
  tr: "Genellikle sevdikleri biri öldüğü için. Bazen haksızlık yüzünden: Zalimler refah içinde yaşıyor, masumlar acı çekiyor ve bu hayattaki hiçbir şey bunu düzeltmiyor. Bazen de fen dersleri ruhu eski bir batıl inanç gibi gösterdiği için."
  en: "Usually because someone they love has died. Sometimes because of injustice: the cruel prosper, the innocent suffer, and nothing in this life sets it right. Sometimes because science classes make the soul sound like an old superstition."
shortAnswer:
  tr: Bir şüpheciyi tatmin edecek bir ahiret ispatı yoktur ve bu sayfa böyle bir iddiada bulunmuyor. Farklı türlerden gerekçeler vardır. Kur'an, sizi ilk defa yaratanın sizi yeniden yaratabileceğini (36:78–79) ve salih olanlarla bozguncuların aynı şekilde son bulduğu bir dünyanın anlamsız olacağını (38:28) savunur. Filozoflar, beyin faaliyetine neden bir tecrübenin eşlik ettiğini hiç kimsenin açıklayamadığını — "zor problem" — not eder; dolayısıyla zihnin beyne bağlı olması, gerçek olsa da, zihnin beyinden başka bir şey *olmadığını* göstermez. Kant ahlakın kendisinin bu hayatın ötesine işaret ettiğini savundu. Ölüme yakın deneyimler üzerine araştırmalar ilgi çekicidir — AWARE II'de görüşülen 28 hayatta kalandan 6'sı (%21) "ölüme dair aşkın bir hatırlanan tecrübe" bildirdi ve bilinçle tutarlı normal EEG faaliyeti canlandırmanın 35–60. dakikasına kadar görüldü — ama henüz hiç kimse gizlenmiş bir görsel hedefi tanımlayamadı ve ölmekte olan beyin açıklaması açık kalıyor. İslam ölümden sonra *berzah*ın (bir ara hâl), sonra bedenen dirilişin, hesabın ve kavuşmanın geldiğini öğretir.
  en: There is no proof of an afterlife that would satisfy a sceptic, and this page does not claim one. There are reasons, of different kinds. The Quran argues that the One who created you the first time can create you again (36:78–79), and that a world in which the righteous and the corrupt end the same would be pointless (38:28). Philosophers note that no one has explained why brain activity is accompanied by experience at all — the "hard problem" — so the dependence of mind on brain, though real, does not show that the mind *is* nothing but the brain. Kant argued that morality itself points beyond this life. Near-death research is intriguing — in AWARE II, 6 of 28 interviewed survivors (21%) reported a "transcendent recalled experience of death", and normal EEG activity consistent with consciousness appeared as late as 35–60 minutes into resuscitation — but no one has yet identified a hidden visual target, and a dying-brain explanation remains open. Islam teaches that after death comes the *barzakh* (an intermediate state), then bodily resurrection, judgement, and reunion.
layers:
  - kind: religious
    tr: |
      36:78–79; 38:28. Gazzâlî bedensel dirilişi savundu. Mutahhari ve Nursî adaletten delil getirir.
    en: 36:78–79; 38:28. Al-Ghazālī defended bodily resurrection. Muṭahharī and Nursi argue from justice.
  - kind: philosophical
    tr: |
      Ahlâkî argüman (Kant): adalet bu hayattan fazlasını gerektiriyor gibi görünür.
    en: "The moral argument (Kant): justice seems to require more than this life."
  - kind: scientific
    tr: |
      - **AWARE I (2014):** 2.060 kalp durması; görüşülen 101 hayatta kalandan 9'u ÖYD yaşadı.
      - **AWARE II (*Resuscitation* 2023):** 567 kalp durması ve 53 hayatta kalan. Yaklaşık %40'ı farkındalık, yaklaşık %20'si "hatırlanan bir ölüm deneyimi" bildirdi.

      Yazarlar, bunun deneyimlerin gerçek olduğunu ne kanıtladığını ne de çürüttüğünü söylüyor.
    en: |-
      - **AWARE I (2014):** 2,060 cardiac arrests; 9 of 101 interviewed survivors had NDEs.
      - **AWARE II (*Resuscitation* 2023):** 567 cardiac arrests and 53 survivors. About 40% reported awareness and about 20% a "recalled experience of death."

      The authors say this neither proved nor disproved that the experiences are real.
  - kind: psychological
    tr: |
      Karmaşık yas bir klinisyen gerektirir.
    en: Complicated grief needs a clinician.
honestLimits:
  tr: Bu argümanların hiçbiri bir ispat değildir ve sayfa onları ispat gibi sunmamalıdır. Mutahharî'ye, Gazzâlî'nin *Tehâfüt*'ünün kendisine (20. mesele) ve Kur'an'ın cennette kavuşmaya dair âyetlerine henüz başvurulmadı. AWARE çalışmaları ve 2023 tarihli ölmekte olan beyin çalışması tam makalelerden değil, özetler ve bir basın bülteni aracılığıyla okundu.
  en: None of these arguments is a proof, and the page should not present them as one. Mutahhari, al-Ghazali's *Tahāfut* itself (20th discussion), and the Quran's verses on reunion in Paradise have not yet been consulted. The AWARE studies and the 2023 dying-brain study were read through abstracts and a news release, not the full papers.
