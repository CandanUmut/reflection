      Eşitlik ve aynılık. İtiraz: hükümler kendi ataerkil bağlamlarını yansıtıyor olabilir.
    en: "Equality vs. sameness. Objection: the rulings may encode their patriarchal context."
honestLimits:
  tr: Bazı hükümler erkeklere ve kadınlara gerçekten farklı davranır ve klasik gelenek kocaların sınırlar içinde vurmasına izin verdi. Bu hükümlerin bugün nasıl uygulanacağı Müslüman âlimler arasında tartışmalıdır. Birkaç esere (Kecia Ali, Tuksal, Barlas, Nedvî) burada yalnızca incelemeler ya da özetler aracılığıyla başvuruldu. Boşanma hukuku ele alınmadı.
  en: Some rulings do treat men and women differently, and the classical tradition allowed husbands to hit within limits. How those rulings apply today is contested among Muslim scholars. Several works (Kecia Ali, Tuksal, Barlas, Nadwi) were read here only through reviews or summaries. Divorce law was not covered.
