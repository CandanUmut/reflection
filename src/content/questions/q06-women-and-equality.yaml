id: Q6
slugs:
  tr: kadin-ve-esitlik
  en: women-and-equality
order: 6
theme: women
title:
  tr: İslam kadına eşitsiz mi davranıyor?
  en: Does Islam treat women unequally?
sensitivity: high
helpCard: urgent
verses:
  - 33:35
  - 4:1
  - 4:34
steelman:
  tr: |
    Miras (4:11), şahitlik (2:282), 4:34 ve erkeğin önderliği yapısal olarak eşitsiz görünür.
  en: Inheritance (4:11), testimony (2:282), 4:34 and male leadership look structurally unequal.
whyAsked:
  tr: |
    Türk gençlerinin dört ana kaygısından biridir ve ataerkilliğin yaşanmış deneyimine bağlıdır.
  en: It is among the top four Turkish youth concerns, and tied to lived experience of patriarchy.
shortAnswer:
  tr: |
    Kur'an eşit manevî değeri (33:35; 16:97) ve tek bir nefisten yaratılışı (4:1) kabul eder. Bazı hükümler kocanın tam nafaka yükümlülüğüne bağlıdır. Pek çok âlim 4:34'ü sıkı biçimde sınırlar. Bazı haksızlıklar metinden değil örften gelir ve bazı sorular tartışmalı olmaya devam eder.
  en: The Quran affirms equal spiritual worth (33:35; 16:97) and creation from one soul (4:1). Several rulings are tied to the husband's full duty of maintenance. Many scholars restrict 4:34 sharply. Some injustices are custom, not text, and some questions remain contested.
layers:
  - kind: religious
    tr: |
      - İbn Teymiyye ve İbn Kayyim 2:282'yi mali sözleşmeler bağlamıyla sınırladı.
      - 4:34 konusunda pek çok fakih "darb"ın sembolik olmasını şart koştu. Hz. Peygamber hiçbir kadına vurmadı (Müslim 2328). [Debated]
    en: |-
      - Ibn Taymiyya and Ibn al-Qayyim limited 2:282 to the context of financial contracts.
      - On 4:34, many jurists required "ḍarb" to be symbolic. The Prophet never struck a woman (Muslim 2328). [Debated]
  - kind: philosophical
    tr: |
      Eşitlik ve aynılık. İtiraz: hükümler kendi ataerkil bağlamlarını yansıtıyor olabilir.
    en: "Equality vs. sameness. Objection: the rulings may encode their patriarchal context."
honestLimits:
  tr: |
    Mirasla ilgili reform önerileri tartışmalıdır.
  en: Reform proposals on inheritance are contested.
visualizations:
  - id: ideas
    tr: |
      - Bağlamı içinde âyet gezgini.
      - Kadın hadis âlimlerinin zaman çizelgesi.
      - Ev içi hak akışlarını gösteren bir şema.
    en: |-
      - A verse-in-context explorer.
      - A timeline of women hadith scholars.
      - A diagram of household rights flows.
