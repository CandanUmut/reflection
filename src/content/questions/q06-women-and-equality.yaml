title:
  tr: İslam kadına eşitsiz mi davranıyor?
  en: Does Islam treat women unequally?
sensitivity: high
helpCard: urgent
verses:
  - 33:35
  - 4:1
  - 4:34
steelman:
  tr: "\"Kur'an mirasta oğula kızın iki katı pay veriyor (4:11). Bir borç sözleşmesinde, bir erkeğin yeteceği yerde iki kadın şahit istiyor (2:282). 'Erkekler, kadın üzerine idareci ve hakimdirler' diyor ve kadın serkeşlik ederse kocasına onu 'dövme' izni veriyor (4:34). Bir erkek dört kadınla evlenebilir; bir kadın tek bir kocayla. Bir erkek sözüyle boşayabilir; bir kadının genellikle mahkemeye gitmesi gerekir. 'Değerde eşit ama rollerde farklı' demek, her eşitsiz sistemin kendisi hakkında söylediği şeye benziyor. Ve bu hükümler hâlâ milyonlarca kadının hayatını şekillendiriyor.\""
  en: "\"The Quran gives a son twice a daughter's share of inheritance (4:11). In a debt contract, it asks for two women witnesses where one man would do (2:282). It says 'men are in charge of women' and, if a wife is defiant, allows her husband to 'strike' her (4:34). A man may marry four wives; a woman, one husband. A man can divorce by his word; a woman usually needs a court. Saying 'equal in worth but different in roles' sounds like what every unequal system says about itself. And these rules still shape the lives of millions of women.\""
whyAsked:
  tr: Pek çok kadın ve pek çok erkek bu âyetlerle kendi ataerkillik tecrübeleri aracılığıyla — ailelerde, mahkemelerde ve camilerde — karşılaşır ve sebebin dinin kendisi olup olmadığını sorar. Başkaları onlarla, onları bağlamından kopararak alıntılayan eleştirmenler aracılığıyla karşılaşır.
  en: Many women, and many men, meet these verses through their own experience of patriarchy — in families, courts and mosques — and ask whether the religion itself is the cause. Others meet them through critics who quote them without context.
shortAnswer:
  tr: "Kur'an, erkeklerin ve kadınların \"bir tek nefisten\" yaratıldığını (4:1), aynı manevi görevlere ve mükâfatlara sahip olduklarını (33:35; 16:97) ve kadınların \"üzerlerindeki meşru hak gibi, kendilerinin de hakları\" olduğunu (2:228) teyit eder. Erkeklere ve kadınlara farklı davranan hükümler de içerir: Çoğu durumda miras, mali sözleşmelerde şahitlik, kocanın liderliği ve nafaka yükümlülüğü (*kıvâme*) ve 4:34'te kocaya verilen \"dövme\" izni. Klasik âlimler bu farkları kocanın geçim sağlama yükümlülüğüne bağladı ve onları çeşitli şekillerde sınırladı; ancak modern öncesi bütün fakihler bir tür vurmaya izin verdi ve modern Müslüman âlimler bu âyetin bugün nasıl okunacağı konusunda ayrılıyor. Kadınların uğradığı bazı haksızlıklar metinden değil örften gelir; diğerleri klasik hukukun gerçek özellikleridir. Aile içi şiddet yanlıştır ve yardım kaynakları aşağıda listeleniyor."
  en: "The Quran affirms that men and women were created \"from one soul\" (4:1), that they have the same spiritual duties and rewards (33:35; 16:97), and that wives have rights \"similar to what is expected of them\" (2:228). It also contains rulings that treat men and women differently: inheritance in most cases, testimony in financial contracts, the husband's leadership and maintenance duty (*qiwāma*), and a husband's permission to \"strike\" in 4:34. Classical scholars tied these differences to the husband's duty to provide, and limited them in various ways; all pre-modern jurists, however, allowed some form of hitting, and modern Muslim scholars disagree on how to read that verse today. Some injustices that women suffer come from custom rather than text; others are real features of classical law. Domestic violence is wrong, and help is listed below."
layers:
