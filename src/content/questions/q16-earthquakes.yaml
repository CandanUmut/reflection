title:
  tr: Depremler ve afetler ceza mı? (Türkiye, Şubat 2023)
  en: "Earthquakes and disasters: are they punishment? (Türkiye, February 2023)"
sensitivity: normal
helpCard: disaster
verses:
  - 30:41
  - 2:155-156
  - 64:11
steelman:
  tr: "\"6 Şubat 2023'te iki deprem Türkiye'nin güneydoğusunu ve Suriye'nin kuzeyini vurdu ve çoğu çocuk olan on binlerce insanı uykularında öldürdü. Kur'an, 'Allah'ın izni olmayınca hiç bir musibet isabet etmez' (64:11) ve 'Başınıza gelen herhangi bir musibet kendi ellerinizle kazandıklarınız yüzündendir' (42:30) diyor. Öyleyse ya bu bir cezaydı — o zaman çocukların suçu neydi? — ya da Allah'ın takdiriydi — o zaman müteahhitleri neden yargılıyoruz? Ve Allah bunu durdurabilecekken durdurmadıysa, nasıl adildir?\""
  en: "\"On 6 February 2023 two earthquakes struck south-eastern Türkiye and northern Syria and killed tens of thousands of people, many of them children, in their sleep. The Quran says, 'No disaster strikes except by permission of Allah' (64:11) and 'whatever strikes you of disaster — it is for what your hands have earned' (42:30). So either this was punishment — and then what was the children's crime? — or it was God's decree, and then why do we put contractors on trial? And if God could have stopped it and did not, how is He just?\""
whyAsked:
  tr: Hayatta kalanlar ve aileleri ve olanları izleyen herkes bunu sordu. Türkiye'de ölümlerin kader olarak çerçevelenmesi, ülkenin dinî otoritesinin eski bir başkanı da dahil olmak üzere teolojik itirazlara yol açtı ("kader planı" ifadesini ilk kimin kullandığına ilişkin kaynak henüz kontrol edilmedi). Aynı soru, 1755 Lizbon depreminden 2004 tsunamisine kadar her büyük afetin ardından gelir.
  en: Survivors and their families, and everyone who watched, asked it. In Türkiye, the framing of the deaths as fate (*kader*) provoked theological pushback, including from a former head of the country's religious authority (the source for who first used the phrase "kader planı" has not yet been checked). The same question follows every great disaster, from the 1755 Lisbon earthquake to the 2004 tsunami.
shortAnswer:
  tr: "Kur'an, Allah'ın izni olmadan hiçbir şeyin olmadığını ve bazı acıların insanların yanlışlarının ardından geldiğini söyler. Her afetin, isabet ettiği insanların cezası olduğunu söylemez ve Hz. Peygamber (s.a.v.) kurbanlar hakkında bunun tersini söyledi: Çöken bir binanın altında ölenler şehit sayılır. İbn Kesîr 42:30'u, afetlerin çoğunu Allah'ın affettiği geçmiş günahlar yüzünden geldiğini söyleyen bir âyet olarak okur, ardından sıkıntının bir müminin günahlarını sildiğini bildiren hadisleri zikreder; ne âyet ne de onun okuması belirli kurbanları bunu hak etmiş olarak gösterir. Depremler Allah'ın yaratılışa koyduğu tabiat düzenini izler; bir binanın ayakta kalıp kalmaması ise insanların onu nasıl inşa ettiğine de bağlıdır — ve 2023'ten gelen deliller, çöken binaların çoğunun kendi dönemlerinin yönetmeliklerine uymadığını gösteriyor. Yani Allah'ın takdiri ile insanın sorumluluğu birbirini iptal etmez. Allah'ın böyle bir acıya, özellikle çocuklar için, neden izin verdiği en zor sorudur ve dürüst cevap şudur: İslam tam bir açıklama değil, güven ve gerekçeler sunar."
  en: "The Quran says that nothing happens without God's permission, and that some suffering follows human wrongdoing. It does not say that every disaster is a punishment of the people it strikes, and the Prophet (pbuh) said the opposite of the victims: those who die under a collapsed building are counted as martyrs. Ibn Kathir reads 42:30 as saying that disasters come because of past sins, most of which God pardons, and then cites hadith that hardship wipes away a believer's sins; neither the verse nor his reading names any particular victims as deserving. Earthquakes follow the natural order God placed in creation; whether a building stands or falls also depends on how people built it — and the evidence from 2023 shows that many collapsed buildings did not meet the codes of their time. So God's decree and human responsibility do not cancel each other. Why God permits such suffering at all, especially for children, is the hardest question, and the honest answer is that Islam offers trust and reasons, not a full explanation."
layers:
  - kind: religious
    tr: |
      - *Âyetler:* 30:41; 2:155–156; 42:30; 64:11.
      - *Hadis:* şehitler arasında yıkılan bina altında ölen de vardır (Buhârî 2829; Müslim 1914); veba, müminler için rahmet ve şehitliktir (Buhârî 5734); "deveni bağla ve tevekkül et" (Tirmizî 2517).
      - *Türkiye 2023:* eski Diyanet İşleri Başkanı Mehmet Görmez, her afeti yalnızca ilahi ceza olarak görmenin, salt mekanik açıklama kadar "sığ, yanlış ve eksik" olduğunu söyledi; depremlere pek çok hikmeti olan "âyet" dedi ve ceza çerçevesinin ilahi adaleti sorgulattığı konusunda uyardı, "çünkü masum çocuklar var". Medya, Diyanet'in kararının kaderci bir çerçevenin "inancımızla bağdaşmadığını" söylediğini aktardı.
      - *Klasik:* eski literatür depremleri bazen uyarı olarak okudu (Süyûtî, *Keşfü's-Salsale*); Görmez bunu sınırlı doğa bilgisine bağlar. Nursî'nin teodisesi musibeti arınma ve şehitlik olarak ele alır.
    en: |-
      - *Verses:* 30:41; 2:155–156; 42:30; 64:11.
      - *Hadith:* martyrs include one killed under a collapsed building (Bukhārī 2829; Muslim 1914); plague as mercy and martyrdom for believers (Bukhārī 5734); "tie your camel and trust" (Tirmidhī 2517).
      - *Turkey 2023:* former Diyanet president Mehmet Görmez said seeing every disaster as only divine punishment is as "shallow, wrong and incomplete" as purely mechanical explanation, called earthquakes "âyet" with many wisdoms, and warned that punishment framing questions divine justice "because there are innocent children". Media reported Diyanet's ruling as saying a fatalistic framing was "not consistent with our faith".
      - *Classical:* older literature sometimes read earthquakes as warnings (al-Suyūṭī, Kashf al-Ṣalṣala); Görmez attributes this to limited natural knowledge. Nursi's theodicy treats musibet as purification and martyrdom.
  - kind: philosophical
    tr: |
      Bkz. Q1 (acı ve kötülük). Burada: levha tektoniğinin karbonu geri dönüştürdüğü ve kıtaları inşa ettiği, kanunlara bağlı, istikrarlı bir dünya tehlikeleri de beraberinde getirir; yapı yönetmelikleri insanın sorumluluğudur. İtiraz: Allah ölümcül depremleri olmayan bir dünya yaratabilirdi. Cevap: dürüst sınırlarıyla, Q1'deki ruhun olgunlaşması ve istikrarlı yasalar savunmaları.
    en: |
      See Q1 (suffering). Here: a lawful, stable world in which plate tectonics recycles carbon and builds continents entails hazards; building codes are human responsibility. Objection: God could have made a world without lethal quakes. Response: Q1's soul-making and stable-law defences, with honest limits.
  - kind: scientific
    tr: |
      [Established] Deprem dizisi, Doğu Anadolu Fayı üzerinde Mw 7,8 (Pazarcık) ve Mw 7,5 (Elbistan) büyüklüğündeydi. Hasar, yapı kalitesi ve yönetmeliklere uyulmasıyla güçlü biçimde ilişkiliydi: 30:41'in işaret ettiği insan boyutu.
    en: "[Established] The sequence was Mw 7.8 (Pazarcık) and Mw 7.5 (Elbistan) on the East Anatolian Fault. Damage correlated strongly with construction quality and code enforcement: the human dimension 30:41 points to."
  - kind: psychological
    tr: |
      Hayatta kalanlar suçluluk, travma ve Allah'a öfke yaşar; ceza anlatıları utancı derinleştirir. AFAD psikososyal desteği ve profesyonel travma bakımı yardımcı olabilir.
    en: Survivors face guilt, trauma and anger at God; punishment narratives deepen shame. AFAD psychosocial support and professional trauma care can help.
honestLimits:
  tr: Allah'ın afetlere neden izin verdiği sorusunun İslam'da ya da başka herhangi bir gelenekte tam bir cevabı yoktur; bu sayfa gerekçeler ve güven sunar. Mühendislik bulguları tek bir çalışmanın özetinden geliyor. Diyanet'in 2023 kararı, Suyûtî, Nursî ve ölü sayısı rakamları henüz kontrol edilmedi.
  en: The question of why God permits disasters has no complete answer in Islam or any other tradition; this page offers reasons and trust. The engineering findings come from one study's abstract. Diyanet's 2023 ruling, al-Suyuti, Nursi and the death-toll figures have not yet been checked.
