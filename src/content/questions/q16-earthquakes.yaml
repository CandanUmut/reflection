title:
  tr: Depremler ve afetler ceza mı? (Türkiye, Şubat 2023)
  en: "Earthquakes and disasters: are they punishment? (Türkiye, February 2023)"
sensitivity: normal
helpCard: disaster
verses:
  - 30:41
  - 2:155-156
  - 64:11
steelman:
  tr: |
    6 Şubat 2023'te depremler Türkiye'de 53.537 kişiyi öldürdü ve 107.213 kişiyi yaraladı (İçişleri Bakanı Ali Yerlikaya, AFAD basın toplantısı, Şubat 2024); aralarında sayısız çocuk vardı. Bu bir cezaysa, çocukların suçu neydi? "Kader"se, neden müteahhitler suçlanıyor? Allah durdurabilecekken, nasıl adil?
  en: On 6 February 2023 earthquakes killed 53,537 people in Türkiye and injured 107,213 (Interior Minister Ali Yerlikaya, AFAD press conference, February 2024), including countless children. If punishment, what was the children's crime? If "kader", why blame contractors? If God could stop it, how is He just?
whyAsked:
  tr: |
    Kaybın büyüklüğü ve ölümlerin kamuoyunda "kader planı" olarak çerçevelenmesi (Cumhurbaşkanı Erdoğan); bu, teolojik itirazlara yol açtı. Deprem 2023 aramalarına damga vurdu ve "İstanbul Depremi" 2025'in en çok yükselen ikinci aramasıydı.
  en: The scale of loss and public framing of deaths as "kader planı" (President Erdoğan), which provoked theological pushback; the earthquake dominated 2023 searches, and "İstanbul Depremi" was 2025's second rising search.
shortAnswer:
  tr: |
    Ana akım ilim, her afetin kurbanlarını cezalandırdığını öğretmez. Hz. Peygamber, çöken binaların altında ölen müminlere şehit dedi; bu, cezanın tam tersidir. Depremler Allah'ın yaratılışa koyduğu doğal yasaları (sünnetullah) izler ve insanlar nasıl inşa ettiklerinden sorumludur. 2023'ten sonra Diyanet'in ilmî kurulu ve eski bir Diyanet İşleri Başkanı kaderci ve yalnızca ceza odaklı okumaları reddetti.
  en: Mainstream scholarship does not teach every disaster punishes its victims. The Prophet called believers dying under collapsed buildings martyrs, the opposite of punishment. Earthquakes follow the natural laws (sunnatullāh) God placed in creation, and humans answer for how they build. Diyanet's scholarly body and a former Diyanet president rejected fatalistic and punishment-only readings after 2023.
layers:
  - kind: religious
    tr: |
      - *Âyetler:* 30:41; 2:155–156; 42:30; 64:11.
      - *Hadis:* şehitler arasında yıkılan bina altında ölen de vardır (Buhârî 2829; Müslim 1914); veba, müminler için rahmet ve şehitliktir (Buhârî 5734); "deveni bağla ve tevekkül et" (Tirmizî 2517).
      - *Türkiye 2023:* eski Diyanet İşleri Başkanı Mehmet Görmez, her afeti yalnızca ilahi ceza olarak görmenin, salt mekanik açıklama kadar "sığ, yanlış ve eksik" olduğunu söyledi; depremlere pek çok hikmeti olan "âyet" dedi ve ceza çerçevesinin ilahi adaleti sorgulattığı konusunda uyardı, "çünkü masum çocuklar var". Medya, Diyanet'in kararının kaderci bir çerçevenin "inancımızla bağdaşmadığını" söylediğini aktardı.
      - *Klasik:* eski literatür depremleri bazen uyarı olarak okudu (Süyûtî, *Keşfü's-Salsale*); Görmez bunu sınırlı doğa bilgisine bağlar. Nursî'nin teodisesi musibeti arınma ve şehitlik olarak ele alır.
    en: |-
      - *Verses:* 30:41; 2:155–156; 42:30; 64:11.
      - *Hadith:* martyrs include one killed under a collapsed building (Bukhārī 2829; Muslim 1914); plague as mercy and martyrdom for believers (Bukhārī 5734); "tie your camel and trust" (Tirmidhī 2517).
      - *Turkey 2023:* former Diyanet president Mehmet Görmez said seeing every disaster as only divine punishment is as "shallow, wrong and incomplete" as purely mechanical explanation, called earthquakes "âyet" with many wisdoms, and warned that punishment framing questions divine justice "because there are innocent children". Media reported Diyanet's ruling as saying a fatalistic framing was "not consistent with our faith".
      - *Classical:* older literature sometimes read earthquakes as warnings (al-Suyūṭī, Kashf al-Ṣalṣala); Görmez attributes this to limited natural knowledge. Nursi's theodicy treats musibet as purification and martyrdom.
  - kind: philosophical
    tr: |
      Bkz. Q1 (acı ve kötülük). Burada: levha tektoniğinin karbonu geri dönüştürdüğü ve kıtaları inşa ettiği, kanunlara bağlı, istikrarlı bir dünya tehlikeleri de beraberinde getirir; yapı yönetmelikleri insanın sorumluluğudur. İtiraz: Allah ölümcül depremleri olmayan bir dünya yaratabilirdi. Cevap: dürüst sınırlarıyla, Q1'deki ruhun olgunlaşması ve istikrarlı yasalar savunmaları.
    en: |
      See Q1 (suffering). Here: a lawful, stable world in which plate tectonics recycles carbon and builds continents entails hazards; building codes are human responsibility. Objection: God could have made a world without lethal quakes. Response: Q1's soul-making and stable-law defences, with honest limits.
  - kind: scientific
    tr: |
      [Established] Deprem dizisi, Doğu Anadolu Fayı üzerinde Mw 7,8 (Pazarcık) ve Mw 7,5 (Elbistan) büyüklüğündeydi. Hasar, yapı kalitesi ve yönetmeliklere uyulmasıyla güçlü biçimde ilişkiliydi: 30:41'in işaret ettiği insan boyutu.
    en: "[Established] The sequence was Mw 7.8 (Pazarcık) and Mw 7.5 (Elbistan) on the East Anatolian Fault. Damage correlated strongly with construction quality and code enforcement: the human dimension 30:41 points to."
  - kind: psychological
    tr: |
      Hayatta kalanlar suçluluk, travma ve Allah'a öfke yaşar; ceza anlatıları utancı derinleştirir. AFAD psikososyal desteğine ve profesyonel travma bakımına yönlendirmek gerekir.
    en: Survivors face guilt, trauma and anger at God; punishment narratives deepen shame. Link to AFAD psychosocial support and professional trauma care.
honestLimits:
  tr: |
    Bazı âyetler belirli kavimlerin (Âd, Semûd) cezalandırılmasını anlatır; âlimler bunları peygamberin uyarısı ve reddi bağlamıyla sınırlar. Bunları inkâr etmeden, neden 2023'ün kurbanlarına uygulanamayacaklarını açıklamak gerekir.
  en: Some verses describe punishments of specific peoples (ʿĀd, Thamūd); scholars restrict these to prophetic warning and rejection. Don't deny them; explain why they cannot apply to 2023's victims.
