steelman:
  tr: |
    Bazı devletler kadınları örtünmeye zorluyor (İran). Diğerleri yasakladı (2010–13'e kadar Türkiye, okullarda Fransa). Bazı aileler kızlarına baskı yapıyor. Bütün bunların içinde kadının kendi vicdanı nerede?
  en: "\"One state forces women to cover and arrests them on the street; Mahsa Amini died in the custody of Iran's morality police in 2022. Another state banned the headscarf from universities and public jobs, as Türkiye did for decades, and France still bans it in schools. Some families force their daughters to wear it; others force them to take it off. In every case, someone else decides what a woman wears. And if the Quran never says 'cover your hair' in so many words, why do scholars say it is obligatory?\""
whyAsked:
  tr: |
    Türkiye'deki yasaklar ve aile baskısı, her iki taraftaki kadınları da yaraladı.
  en: Women have been hurt by coercion in both directions — by bans and by mandates, by states and by families. Young Muslim women ask whether covering is really required, and what to do when the pressure is at home.
shortAnswer:
  tr: |
    "Dinde zorlama yoktur" (2:256). Zorla örtünme ibadet olarak değerini kaybeder ve yasaklar vicdanı çiğner. Sünnî ve Şiî âlimlerin büyük çoğunluğu saçı örtmenin farz olduğunu kabul eder; modern bir azınlık katılmaz. Kadınlar iki görüşü de duymayı ve özgürce seçmeyi hak eder.
  en: "The four Sunni schools hold that a free woman must cover all her body except her face and hands before men outside her close family, which includes the hair. They base this on 24:31, which tells believing women to draw their *khimār* — a word that in Arabic meant a head covering — over their chests, on 33:59, and on the hadith. A modern minority (for example Muhammad Shahrur) disagrees. Whether to wear it is a question of conscience before God; who may enforce it is a separate question. The Quran says \"there shall be no compulsion in [acceptance of] the religion\" (2:256); Egypt's Dar al-Iftaʾ says a father must advise but must not force, beat or harm his daughter, because \"any compulsion will lead her to be hypocritical\". Bans harm women too: France's 2004 school ban reduced Muslim girls' secondary education. This site's firm line is against coercion in either direction."
layers:
  - kind: religious
    tr: |
      Âyetler 24:31 ve 33:59'dur. Dört Sünnî mezhep ve Ca'ferî mezhep örtünmeyi farz sayar. H. Yunus Apaydın (TDV, "Tesettür"), modern döneme kadar bundan şüphe edilmediğini belirtir. Hayrettin Karaman, hiçbir fakihin başı açmaya izin vermediğini söyler. Bir azınlık (Hüseyin Atay, Şahrûr) *hımâr*ın yalnızca "bir örtü" anlamına geldiğini savunur [Debated].
    en: The verses are 24:31 and 33:59. The four Sunni schools and the Jaʿfarī school all require covering. H. Yunus Apaydın (TDV, "Tesettür") notes that this was not doubted before the modern era. Hayrettin Karaman says no jurist ever permitted uncovering the head. A minority (Hüseyin Atay, Shaḥrūr) argues that *khimār* simply means "a cover" [Debated].
  - kind: philosophical
    tr: |
      Üç ayrı soru:
      - Allah ne istiyor? Çoğunluk görüşü güçlüdür.
      - Onu kim uygulatabilir? 2:256 geçerlidir.
      - Örtünmemek ne anlama gelir? Bir günah, küfür değil.
    en: |-
      Three separate questions:
      - What does God require? The majority view is strong.
      - Who may enforce it? 2:256 applies.
      - What does not covering mean? A sin, not unbelief.
  - kind: history
    tr: |
      Örtünme İslam'dan önce de vardı. İran, Humeynî'nin 7 Mart 1979 tarihli fermanıyla iş yerlerinde başörtüsünü zorunlu kıldı ve Nisan 1983'te bütün kadınlar için kanun hâline getirdi. Türkiye yasaklarını 2010–2013'te kaldırdı.
    en: Veiling predates Islam. Iran required hijab in workplaces by Khomeini's decree of 7 March 1979 and made it law for all women in April 1983. Türkiye lifted its bans in 2010–2013.
  - kind: psychological
    tr: |
      Her iki yöndeki zorlama da kırgınlık ve iman kaybı doğurur.
    en: Coercion in either direction breeds resentment and loss of faith.
honestLimits:
  tr: |
    Azınlık görüşünü eşit ağırlıkta sunmak yanıltıcıdır. Sitenin kesin çizgisi zorlamaya karşıdır.
  en: The majority view that covering the hair is obligatory is strong and old; presenting the minority as equal would mislead. Applying 2:256 to enforcement among Muslims is an extension, supported by modern scholars but not by every classical one. The research on coercion and faith is suggestive, not conclusive. Atay's own text, Apaydın's and Karaman's articles, al-Qurtubi and Leila Ahmed have not yet been consulted.
