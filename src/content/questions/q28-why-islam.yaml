theme: diversity
title:
  tr: Neden başka bir din değil de İslam?
  en: Why Islam and not another religion?
sensitivity: normal
helpCard: false
verses:
  - 2:285
  - 29:46
steelman:
  tr: |
    Her inancın velileri var ve her biri doğru olduğunu iddia ediyor.
  en: Every faith has saints, and each claims to be true.
whyAsked:
  tr: |
    Başka inançlardan insanlarla kurulan dostluklar.
  en: Friendships with people of other faiths.
shortAnswer:
  tr: |
    İslam kendini önceki bütün peygamberlerin devamı olarak sunar. Gerekçesi katı tevhide, iyi korunmuş bir kitaba ve tarihî olarak izlenebilen bir peygambere dayanır. İnanç ve saygı bir arada var olabilir.
  en: Islam presents itself as the continuation of all the earlier prophets. Its case rests on strict monotheism, a well-preserved scripture and a historically traceable prophet. Conviction can coexist with respect.
layers:
  - kind: religious
    tr: |
      2:285; 5:48; 2:62 (âlimlerce farklı okunur); 29:46; 3:85. Nasr ve Winter İslam'ı *dînü'l-fıtrat*a, insan tabiatının dinine bir dönüş olarak tarif eder.
    en: 2:285; 5:48; 2:62 (read differently by different scholars); 29:46; 3:85. Nasr and Winter describe Islam as a return to *dīn al-fiṭra*, the religion of human nature.
  - kind: philosophical
    tr: |
      Başka inançlara uyguladığın ölçütleri İslam'ın zayıf noktalarına da uygula.
    en: Apply the same criteria to Islam's weaknesses as to other faiths.
  - kind: history
    tr: |
      Kur'an'ın aktarımı iyi belgelenmiştir.
    en: The Quran's transmission is well documented.
  - kind: psychological
    tr: |
      Tevazu, inançla bağdaşır.
    en: Humility is compatible with conviction.
honestLimits:
  tr: |
    Gerekçe güçlüdür ama zorlamaz.
  en: The case is strong, but it does not compel.
visualizations:
  - id: ideas
    tr: |
      Bir peygamberler zinciri. Bir ölçüt pusulası. Bir âyetler kartı.
    en: A chain of prophets. A criteria compass. A verses card.
