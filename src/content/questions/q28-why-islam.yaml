fullAnswer:
  - kind: heart
    en: "**If your closest friend follows another faith, you do not have to choose between your conviction and your friendship.** The Quran tells Muslims how to speak with Jews and Christians: \"do not argue with the People of the Scripture except in a way that is best… and say, 'We believe in that which has been revealed to us and revealed to you. And our God and your God is one'\" (29:46). Begin there: with what you share, said with courtesy. For the question of whether your friend will be saved, see the page \"Are good people of other faiths saved?\""
    tr: "**En yakın arkadaşın başka bir inanca bağlıysa, inancınla arkadaşlığın arasında seçim yapmak zorunda değilsin.** Kur'an Müslümanlara Yahudiler ve Hristiyanlarla nasıl konuşacaklarını söyler: \"…ehli kitapla ancak, en güzel yoldan mücadele edin ve deyin ki: \"Bize indirilene de, size indirilene de iman ettik. Bizim ilâhımız da, sizin ilâhınız da birdir…\" (29:46). Oradan başla: ortak olandan, nezaketle söylenmiş olarak. Arkadaşının kurtulup kurtulmayacağı sorusu için \"Başka dinlerden iyi insanlar kurtulur mu?\" sayfasına bak."
    title:
      en: Kalp ve akıl için
      tr: Kalp ve akıl için
  - kind: quran
    en: |-
      **Islam presents itself as the confirmation of earlier revelation.** "And We have revealed to you, [O Muhammad], the Book in truth, confirming that which preceded it of the Scripture and as a criterion over it" (5:48). This is Medinan, in Sura al-Maʾida, addressed to the Prophet (pbuh) about judging between communities. The same verse adds: "To each of you We prescribed a law and a method. Had Allah willed, He would have made you one nation [united in religion], but [He intended] to test you in what He has given you; so race to [all that is] good." So the Quran both claims authority over earlier scripture ("criterion over it") and accepts that communities have had different laws.

      **It asks belief in all the prophets.** "The Messenger has believed in what was revealed to him from his Lord, and [so have] the believers. All of them have believed in Allah and His angels and His books and His messengers, [saying], 'We make no distinction between any of His messengers'" (2:285). In practice this means a Muslim affirms Abraham, Moses, David and Jesus (pbuh) as prophets of the same God.

      **It differs sharply on who God is.** "Say, 'He is Allah, [who is] One'" (112:1). Islam rejects the Christian doctrines that Jesus (pbuh) is God or God's son; this is the main point of difference with Christianity, not a detail.

      **It makes an exclusive claim, and a broader one.** "And whoever desires other than Islam as religion – never will it be accepted from him" (3:85). Yet an earlier verse promises reward to "those who believed and those who were Jews or Christians or Sabeans [before Prophet Muhammad] – those [among them] who believed in Allah and the Last Day and did righteousness" (2:62). How the two fit is discussed on the salvation page; Ibn Kathir reports Ibn ʿAbbas's view that 3:85 came later and governs after the Prophet's (pbuh) mission. The Prophet (pbuh) said: "he who amongst the community of Jews or Christians hears about me, but does not affirm his belief in that with which I have been sent and dies in this state (of disbelief), he shall be but one of the denizens of Hell-Fire" ({hadith:muslim:153}). This is the hard side of Islam's claim, and it should be stated plainly.

      **It invites a test of its text.** "And if you are in doubt about what We have sent down upon Our Servant [Muhammad], then produce a surah the like thereof" (2:23). And it promises preservation: "Indeed, it is We who sent down the Qur'an and indeed, We will be its guardian" (15:9), from Sura al-Hijr, Meccan.
    tr: |-
      **İslam kendini önceki vahyin tasdiki olarak sunar.** "Sana da (ey Muhammed) geçmiş kitapları tasdik eden ve onları kollayıp koruyan Kitab (Kur'ân)ı hak ile indirdik." (5:48). Âyet Medenîdir, Mâide Sûresi'ndedir ve topluluklar arasında hüküm vermek konusunda Hz. Peygamber'e (s.a.v.) hitap eder. Aynı âyet şunu ekler: "Biz, herbiriniz için bir şeriat ve yol belirledik. Eğer Allah dileseydi sizi tek bir ümmet yapardı, fakat size verdiklerinde sizi denemek istedi. Öyleyse iyiliklere koşun." (5:48). Böylece Kur'an hem önceki kitaplar üzerinde yetki iddia eder ("onları kollayıp koruyan") hem de toplulukların farklı şeriatları olduğunu kabul eder.

      **Bütün peygamberlere inanmayı ister.** "Peygamber, Rabbi'nden kendisine ne indirildiyse ona iman etti. Müminlerin de hepsi Allah'a, meleklerine, kitaplarına ve peygamberlerine iman ettiler. "Biz Allah'ın peygamberleri arasında ayırım yapmayız…" (2:285). Pratikte bu, bir Müslümanın İbrâhîm'i, Mûsâ'yı, Dâvûd'u ve Îsâ'yı (a.s.) aynı Allah'ın peygamberleri olarak kabul etmesi demektir.

      **Allah'ın kim olduğu konusunda keskin biçimde ayrılır.** "De ki; O Allah bir tektir." (112:1). İslam, Îsâ'nın (a.s.) Allah ya da Allah'ın oğlu olduğu yönündeki Hristiyan öğretilerini reddeder; bu Hristiyanlıkla temel ayrılık noktasıdır, bir ayrıntı değil.

      **Hem dışlayıcı hem de daha geniş bir iddiada bulunur.** "Kim İslâm'dan başka bir din ararsa ondan asla kabul edilmeyecek…" (3:85). Oysa daha önceki bir âyet, "iman edenler, yahudiler, hıristiyanlar ve sabiîler, bunlardan her kim Allah'a ve ahiret gününe gerçekten iman eder ve salih amel işlerse" onlara ecir vaat eder (2:62). İkisinin nasıl bağdaştığı kurtuluş sayfasında ele alınıyor; İbn Kesîr, 3:85'in daha sonra indiği ve Hz. Peygamber'in (s.a.v.) gönderilmesinden sonrası için hüküm koyduğu yönündeki İbn Abbâs görüşünü aktarır. Hz. Peygamber (s.a.v.) şöyle buyurdu: "Yahudi ya da Hristiyan topluluğundan kim benden haberdar olur da benimle gönderilene iman etmeden bu (inkâr) hâli üzere ölürse, o ancak cehennem ehlinden biri olur." ({hadith:muslim:153}). Bu, İslam'ın iddiasının zor yüzüdür ve açıkça söylenmelidir.

      **Metninin sınanmasını ister.** "Eğer kulumuz (Muhammed)a indirdiğimiz (Kur'ân)den şüphe içinde iseniz, haydi onun gibi bir sûre getirin…" (2:23). Korunmayı da vaat eder: "Hiç şüphe yok ki, Kur'ân'ı biz indirdik, elbette onu yine biz koruyacağız." (15:9); Mekkî Hicr Sûresi'nden.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: history
    en: |-
      **The text was standardised early, and the tradition says so openly.** Anas ibn Malik (ra) reports that Hudhayfa urged the caliph ʿUthman: "Save this nation before they differ about the Book (Qur'an) as Jews and the Christians did before." ʿUthman obtained the sheets kept by Hafsa (ra); Zayd ibn Thabit and three others made copies; where they differed, ʿUthman told them to "write it in the dialect of Quraish, the Qur'an was revealed in their tongue"; copies were sent to each province, and other Quranic materials were ordered "burnt" ({hadith:bukhari:4987}). This shows both a strong concern for one text and that other written forms existed.

      **Early manuscripts are close to the Prophet's lifetime.** [Established for the dates.] A Quran fragment in Tübingen University Library, Ma VI 165, was dated by radiocarbon analysis at a Zürich laboratory to "AD 649–675" with "95.4% statistical probability" (*Medieval.eu*, 2014). The Sanaa palimpsest — a manuscript whose first ("lower") text was erased and overwritten — has a parchment that Sadeghi and Bergmann (2010) dated to before 669 CE with 95% probability, and "75% probability from before 646 CE" (*Wikipedia*, summarising them). The Birmingham folios, discussed on the page "Was the Quran preserved?", are dated to 568–645 CE (not yet checked again).

      **The earliest text shows variants.** [Established that variants exist; Debated what they mean.] The Sanaa lower text has a sura order that "corresponds to no known Quranic order", and many variant wordings, which, the summary says, "rarely diverge from the fundamental meaning". Within suras the verse order mostly matches the standard text, with exceptions (in sura 20 two verses are swapped; in sura 9 a verse is missing, which Sadeghi and Goudarzi attribute to a copyist's eye-skip). Sadeghi and Goudarzi (2012) report some overlap with variants attributed to the Companion Ibn Masʿud but more differences; Elisabeth Puin and Asma Hilali report little or no correspondence; Hilali argues the texts may be schoolroom writing exercises, which Nicolai Sinai has criticised (*Wikipedia*).

      **What this does and does not show.** The manuscripts show that the Quran's text was fixed very early and that the standard text was not a late invention. They also show that, before ʿUthman's standardisation, copies differed in order and wording. A skeptic will say this is ordinary textual history; a Muslim will say the variants are minor and the standardisation preserved the revealed text. Both are describing the same evidence.
    tr: |-
      **Metin erken dönemde standart hâle getirildi ve gelenek bunu açıkça söyler.** Enes b. Mâlik (r.a.), Huzeyfe'nin halife Osman'ı şöyle uyardığını aktarır: "Yahudilerin ve Hristiyanların daha önce yaptığı gibi Kitap (Kur'an) hakkında ihtilafa düşmeden önce bu ümmeti kurtar." Osman, Hafsa'nın (r.a.) yanında saklanan sayfaları aldı; Zeyd b. Sâbit ve üç kişi daha bunları çoğalttı; farklılaştıkları yerde Osman onlara, "Kureyş lehçesiyle yazın, Kur'an onların diliyle indi" dedi; nüshalar her bölgeye gönderildi, diğer Kur'an malzemelerinin de "yakılması" emredildi ({hadith:bukhari:4987}). Bu, hem tek bir metin konusundaki güçlü kaygıyı hem de başka yazılı biçimlerin var olduğunu gösterir.

      **İlk yazmalar Hz. Peygamber'in hayatına yakındır.** [Established, tarihler için.] Tübingen Üniversitesi Kütüphanesi'ndeki Ma VI 165 numaralı bir Kur'an parçası, Zürih'teki bir laboratuvarda radyokarbon analiziyle "%95,4 istatistiksel olasılıkla" "MS 649–675" yıllarına tarihlendi (*Medieval.eu*, 2014). San'a palimpsesti — ilk ("alt") metni silinip üzerine yeniden yazılmış bir yazma — Sadeghi ve Bergmann'ın (2010) %95 olasılıkla MS 669'dan önceye tarihlediği bir parşömene sahiptir ve "%75 olasılıkla MS 646'dan öncedir" (*Wikipedia*, onları özetleyerek). "Kur'an korundu mu?" sayfasında ele alınan Birmingham yaprakları MS 568–645'e tarihlenir (henüz yeniden kontrol edilmedi).

      **En eski metin farklılıklar gösterir.** [Established, farklılıkların varlığı için; Debated, ne anlama geldikleri konusunda.] San'a alt metninin sûre sıralaması "bilinen hiçbir Kur'an sıralamasına karşılık gelmez" ve özetin dediğine göre "temel anlamdan nadiren sapan" birçok farklı ifade içerir. Sûrelerin içinde âyet sırası çoğunlukla standart metinle örtüşür, istisnalar vardır (20. sûrede iki âyetin yeri değişmiştir; 9. sûrede bir âyet eksiktir, Sadeghi ve Goudarzi bunu bir müstensihin gözünün kaymasına bağlar). Sadeghi ve Goudarzi (2012), Sahâbî İbn Mes'ûd'a atfedilen farklılıklarla bazı örtüşmeler, ama daha fazla ayrılık bildirir; Elisabeth Puin ve Asma Hilali çok az ya da hiç örtüşme bulmaz; Hilali metinlerin okul yazı alıştırmaları olabileceğini savunur, Nicolai Sinai ise bunu eleştirmiştir (*Wikipedia*).

      **Bu neyi gösterir, neyi göstermez?** Yazmalar, Kur'an metninin çok erken sabitlendiğini ve standart metnin geç bir icat olmadığını gösterir. Osman'ın standartlaştırmasından önce nüshaların sıra ve ifade bakımından farklı olduğunu da gösterir. Bir şüpheci bunun sıradan bir metin tarihi olduğunu söyleyecektir; bir Müslüman farklılıkların küçük olduğunu ve standartlaştırmanın vahyedilen metni koruduğunu söyleyecektir. İkisi de aynı delili tarif ediyor.
    title:
      en: "Tarih: Kur'an iyi korunmuş mu?"
      tr: "Tarih: Kur'an iyi korunmuş mu?"
  - kind: scholars
    en: |-
      **Philosophers of religion describe the options.** David Basinger's SEP entry defines exclusivism as believing that one's perspective "is the truth or at least closer to the truth than any other competing religious perspective", and pluralism as denying "the primacy of any one religion". It summarises John Hick's view that each major religion "constitutes a valid context of salvation/liberation; but none constitutes the one and only such context". Islam in its mainstream forms is exclusivist about truth while, in many scholars' views, generous about who may be excused (see the salvation page).

      **Muslim thinkers who compared religions.** Readers asked for Ibn Taymiyya's *al-Jawāb al-Ṣaḥīḥ*, Ibn Ḥazm's *al-Fiṣal*, Seyyed Hossein Nasr, Tim Winter (Abdal Hakim Murad), Abdulaziz Sachedina and Mohammad Hassan Khalil. Their works have not yet been consulted, so their arguments are not summarised here. Khalil's study of how al-Ghazali, Ibn ʿArabi, Ibn Taymiyya and Rashid Rida thought about the fate of non-Muslims is summarised on the salvation page.
    tr: |-
      **Din felsefecileri seçenekleri tarif eder.** David Basinger'ın SEP maddesi dışlayıcılığı (exclusivism), kişinin kendi bakış açısının "hakikat olduğuna ya da en azından rakip herhangi bir dinî bakış açısından hakikate daha yakın olduğuna" inanmak, çoğulculuğu (pluralism) ise "herhangi bir dinin önceliğini" reddetmek olarak tanımlar. John Hick'in görüşünü, her büyük dinin "kurtuluş/özgürleşme için geçerli bir bağlam oluşturduğu, ama hiçbirinin bu türden tek bağlam olmadığı" şeklinde özetler. Ana akım biçimleriyle İslam hakikat konusunda dışlayıcıdır; ama pek çok âlimin görüşüne göre kimin mazur sayılabileceği konusunda cömerttir (bkz. kurtuluş sayfası).

      **Dinleri karşılaştıran Müslüman düşünürler.** Okurlar İbn Teymiyye'nin *el-Cevâbü's-Sahîh*'ini, İbn Hazm'ın *el-Fisal*'ını, Seyyid Hüseyin Nasr'ı, Tim Winter'ı (Abdülhakim Murad), Abdülaziz Sachedina'yı ve Mohammad Hassan Khalil'i istedi. Bu eserlere henüz başvurulmadı; bu yüzden argümanları burada özetlenmiyor. Khalil'in Gazzâlî, İbnü'l-Arabî, İbn Teymiyye ve Reşîd Rızâ'nın gayrimüslimlerin akıbeti hakkında nasıl düşündüğüne dair çalışması kurtuluş sayfasında özetleniyor.
    title:
      en: Âlimler bunu nasıl anladı?
      tr: Âlimler bunu nasıl anladı?
  - kind: reasoning
    en: |-
      **Criteria that can count as evidence for one religion over another.** Stated so they can be applied to every faith, including Islam:
      1. **Coherence of its idea of God** — is the account of God consistent with itself and with the existence of a single Creator?
      2. **The messenger** — what is known of his life, character and claims, from early sources, including hostile ones?
      3. **The text and its transmission** — how early, how stable, how openly its history is recorded?
      4. **Moral and spiritual fruit** — what does the teaching do to people who live by it, over time?
      5. **Fit with human nature and reason** — does it make sense of what we know about ourselves?

      **Applying them to Islam fairly.** *Strong points:* a strict monotheism (112:1) that many find coherent; a messenger whose life is recorded in detail; a text with very early manuscripts. *Weak points a skeptic will press:* the earliest manuscripts show variants and a different sura order; the non-Uthmanic copies were destroyed, so we cannot compare them fully; many detailed accounts of the Prophet's (pbuh) life were written down a century or more after him; and the moral record of Muslim societies, like every society's, is mixed. A fair reader will weigh both.

      **The "born elsewhere" objection.** Al-Ghazali raised it himself: "Christian youths always grew up to be Christians, Jewish youths to be Jews and Muslim youths to be Muslims" (*al-Munqidh*, Watt, section I) — and it drove him to test his inherited belief, not to abandon belief. Philosophers call this the problem of "religious luck"; the philosopher Guy Axtell argues that exclusivists' beliefs suffer from "a malignant strand of epistemic luck", and critics reply that the same luck affects atheism and moral beliefs (Liz Jackson's review of Axtell, *Notre Dame Philosophical Reviews*, 2019). See "Is claiming one religion is true arrogant?".
    tr: |-
      **Bir dini diğerine tercih etmek için delil sayılabilecek ölçütler.** İslam dahil her inanca uygulanabilecek şekilde ifade edildiğinde:
      1. **Allah tasavvurunun tutarlılığı** — Allah hakkındaki anlatım kendi içinde ve tek bir Yaratıcının varlığıyla tutarlı mı?
      2. **Elçi** — Düşmanca olanlar dahil erken kaynaklardan onun hayatı, karakteri ve iddiaları hakkında ne biliniyor?
      3. **Metin ve aktarımı** — Ne kadar erken, ne kadar istikrarlı, tarihi ne kadar açık biçimde kayda geçmiş?
      4. **Ahlaki ve manevi meyve** — Öğreti, onunla yaşayan insanlara zaman içinde ne yapıyor?
      5. **İnsan fıtratına ve akla uygunluk** — Kendimiz hakkında bildiklerimizi anlamlı kılıyor mu?

      **Bunları İslam'a adilce uygulamak.** *Güçlü yanlar:* pek çok kişinin tutarlı bulduğu katı bir tevhid (112:1); hayatı ayrıntılı biçimde kayda geçmiş bir elçi; çok erken yazmaları olan bir metin. *Bir şüphecinin üzerine gideceği zayıf yanlar:* En eski yazmalar farklılıklar ve farklı bir sûre sıralaması gösteriyor; Osman nüshası dışındaki nüshalar yok edildiği için onları tam olarak karşılaştıramıyoruz; Hz. Peygamber'in (s.a.v.) hayatına dair pek çok ayrıntılı anlatı ondan bir asır ya da daha sonra yazıya geçirildi; Müslüman toplumların ahlaki sicili de her toplumunki gibi karışık. Adil bir okur ikisini de tartar.

      **"Başka yerde doğsaydın" itirazı.** Gazzâlî bunu kendisi dile getirdi: "Hristiyan çocukların hep Hristiyan, Yahudi çocukların Yahudi, Müslüman çocukların Müslüman olarak büyüdüğünü gördüm" (*el-Munkız*, Watt, I. bölüm) — ve bu onu inancını terk etmeye değil, devraldığı inancını sınamaya yöneltti. Filozoflar buna "dinî şans" sorunu der; filozof Guy Axtell dışlayıcıların inançlarının "epistemik şansın kötü huylu bir türünden" muzdarip olduğunu savunur; eleştirmenler ise aynı şansın ateizmi ve ahlaki inançları da etkilediğini söyler (Liz Jackson'ın Axtell incelemesi, *Notre Dame Philosophical Reviews*, 2019). Bkz. "Tek bir dinin doğru olduğunu iddia etmek kibir mi?".
    title:
      en: Filozoflar bu konuda nasıl akıl yürütür?
      tr: Filozoflar bu konuda nasıl akıl yürütür?
  - kind: objection
    en: |-
      **"Every religion calls itself the fulfilment of the ones before."** *Reply:* that is true; the claim alone proves nothing. It has to be tested by the criteria above. *Limit:* the criteria themselves are weighed differently by different people.

      **"Christians also have early manuscripts and a historical founder."** *Reply:* yes. The disagreement is not about whether Jesus (pbuh) existed, but about who he was and whether the doctrines about him are original. Islam's case is that the earliest message of all prophets was the oneness of God. *Limit:* historians of Christianity and Islam disagree on how to read the earliest sources of both, and this page cannot settle that.

      **"The Uthmanic standardisation hid a messier text."** *Reply:* the tradition itself records the standardisation openly (Bukhari 4987), and the Sanaa lower text, which escaped it, differs mainly in order and in wordings that rarely change the meaning. *Limit:* we cannot compare every pre-Uthmanic copy, because most were destroyed.
    tr: |-
      **"Her din kendinden öncekilerin tamamlayıcısı olduğunu söyler."** *Cevap:* Bu doğrudur; iddia tek başına hiçbir şey ispat etmez. Yukarıdaki ölçütlerle sınanmalıdır. *Sınır:* Ölçütlerin kendisi farklı insanlar tarafından farklı tartılır.

      **"Hristiyanların da erken yazmaları ve tarihî bir kurucusu var."** *Cevap:* Evet. Anlaşmazlık Îsâ'nın (a.s.) var olup olmadığı üzerine değil, kim olduğu ve onun hakkındaki öğretilerin asıl olup olmadığı üzerinedir. İslam'ın gerekçesi, bütün peygamberlerin en eski mesajının Allah'ın birliği olduğudur. *Sınır:* Hristiyanlık ve İslam tarihçileri, her ikisinin en eski kaynaklarını nasıl okuyacakları konusunda ayrılır; bu sayfa bu meseleyi çözemez.

      **"Osman'ın standartlaştırması daha dağınık bir metni gizledi."** *Cevap:* Geleneğin kendisi standartlaştırmayı açıkça kaydeder (Buhârî 4987); ondan kurtulmuş olan San'a alt metni de esas olarak sıralamada ve anlamı nadiren değiştiren ifadelerde farklılaşır. *Sınır:* Osman öncesi her nüshayı karşılaştıramayız, çünkü çoğu yok edildi.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **Mainstream Sunni and Shiʿi** — Islam is the final, true religion; earlier scriptures were genuine but changed; individuals the message did not truly reach may be excused (salvation page).
      - **Hick's pluralism** — all major religions are valid paths; criticised in turn as "inclusivists in disguise" (Mark Heim) and as arbitrary in deciding which religions count (Basinger, SEP).
      - **Critical historians** — the Quran's text was fixed early; the pre-Uthmanic text had variants (Sadeghi & Goudarzi; Hilali; Puin).
    tr: |-
      - **Ana akım Sünnî ve Şiî** — İslam son ve hak dindir; önceki kitaplar hakikiydi ama değiştirildi; mesajın gerçekten ulaşmadığı kişiler mazur sayılabilir (kurtuluş sayfası).
      - **Hick'in çoğulculuğu** — bütün büyük dinler geçerli yollardır; bu görüş de "kılık değiştirmiş kapsayıcılar" (Mark Heim) olarak ve hangi dinlerin sayılacağına keyfî karar verdiği gerekçesiyle eleştirilir (Basinger, SEP).
      - **Eleştirel tarihçiler** — Kur'an metni erken sabitlendi; Osman öncesi metinde farklılıklar vardı (Sadeghi ve Goudarzi; Hilali; Puin).
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: What does Islam say about Jesus?
      tr: İslam Îsâ hakkında ne der?
    a:
      en: He is a prophet and messenger of God, born of Mary; Muslims honour him. Islam denies that he is God or the son of God (112:1).
      tr: O, Meryem'den doğmuş, Allah'ın bir peygamberi ve elçisidir; Müslümanlar onu onurlandırır. İslam onun Allah ya da Allah'ın oğlu olduğunu reddeder (112:1).
  - q:
      en: What does "continuation of the earlier prophets" mean in practice?
      tr: '"Önceki peygamberlerin devamı" pratikte ne demek?'
    a:
      en: A Muslim believes in all of them "We make no distinction between any of His messengers" (2:285) and sees Islam as their shared message in its final form (5:48).
      tr: Bir Müslüman hepsine inanır — "Biz Allah'ın peygamberleri arasında ayırım yapmayız" (2:285) — ve İslam'ı onların ortak mesajının son biçimi olarak görür (5:48).
  - q:
      en: Didn't ʿUthman burn other Qurans?
      tr: Osman başka Kur'anları yaktırmadı mı?
    a:
      en: Yes. Bukhari 4987 records it, with the aim of preventing disputes over the text. That is why the earliest independent witness, the Sanaa lower text, matters so much to historians.
      tr: Evet. Buhârî 4987 bunu, metin üzerindeki anlaşmazlıkları önleme amacıyla birlikte kaydeder. Bu yüzden en eski bağımsız tanık olan San'a alt metni tarihçiler için bu kadar önemlidir.
  - q:
      en: How old are the oldest Qurans?
      tr: En eski Kur'anlar ne kadar eski?
    a:
      en: "Several fragments are radiocarbon-dated to within a few decades of the Prophet's (pbuh) death: Tübingen Ma VI 165, AD 649–675 (95.4% probability); the Sanaa parchment, before 669 CE (95%)."
      tr: "Birkaç parça, radyokarbonla Hz. Peygamber'in (s.a.v.) vefatından sonraki birkaç on yıl içine tarihlendirilmiştir: Tübingen Ma VI 165, MS 649–675 (%95,4 olasılık); San'a parşömeni, MS 669'dan önce (%95)."
  - q:
      en: If I'd been born elsewhere, wouldn't I believe something else?
      tr: Başka bir yerde doğsaydım başka bir şeye inanmaz mıydım?
    a:
      en: Probably, at first. Al-Ghazali noticed exactly that and tested his belief. Where a belief comes from does not settle whether it is true; the reasons for it do.
      tr: Muhtemelen, başlangıçta. Gazzâlî tam olarak bunu fark etti ve inancını sınadı. Bir inancın nereden geldiği doğru olup olmadığını belirlemez; onun lehindeki sebepler belirler.
  - q:
      en: Is my Christian friend wrong?
      tr: Hristiyan arkadaşım yanılıyor mu?
    a:
      en: On the points where Islam and Christianity disagree, a Muslim believes so. That is compatible with deep respect and friendship (29:46).
      tr: İslam ile Hristiyanlığın ayrıldığı noktalarda, bir Müslüman öyle olduğuna inanır. Bu, derin bir saygı ve dostlukla bağdaşır (29:46).
