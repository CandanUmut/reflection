honestLimits:
  tr: |
    Gerekçe güçlüdür ama zorlamaz.
  en: The comparison cannot be finished on one page, and the criteria are weighed differently by different people. The early manuscripts support an early fixed text but also show pre-Uthmanic variants whose meaning scholars dispute. The classical Muslim arguments against other religions (Ibn Taymiyya, Ibn Ḥazm) and the modern ones (Nasr, Winter, Sachedina) could not be read for this page. The case for Islam is strong for many people; it does not compel.
