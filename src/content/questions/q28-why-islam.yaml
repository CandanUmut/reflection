steelman:
  tr: "\"Her dinin kutsal insanları, kutsal metinleri, takipçilerinin anlattığı mucizeleri ve emin olan inananları var. Hristiyanlar da kendi kutsal kitaplarının korunduğunu ve kurucularının tarihî bir şahsiyet olduğunu söylüyor. Müslümanlar Kitab-ı Mukaddes'in değiştirildiğini söylüyor — ama ilk Kur'an nüshaları da farklılıklar gösteriyor ve Osman diğer nüshaları yaktırdı. 'İslam bütün peygamberlerin devamıdır' sözü, İslam'ın kendisi hakkında söylediğidir; her yeni din bunu söyler. Hepsine aynı ölçütleri uygularsam İslam neden öne çıksın — Chennai'de doğmuş olsaydım, aynısını Hinduizm için söylemez miydim?\""
  en: "\"Every religion has holy people, sacred texts, miracles reported by followers, and believers who are sure. Christians say their scripture is preserved and their founder is historical too. Muslims say the Bible was changed — but early Qurans also show variants, and Uthman burned the other copies. 'Islam is the continuation of all the prophets' is what Islam says about itself; every newer religion says that. If I apply the same standards to all of them, why would Islam come out on top — and if I had been born in Chennai, wouldn't I be saying the same about Hinduism?\""
whyAsked:
  tr: İnsanlar başka inançlardan arkadaşlarla tanışıyor, internette eleştirel içerikler okuyor ya da kendi inançlarının aileleriyle birlikte geldiğini fark ediyor. Öğrenciler slogan değil, gerçek argümanlar istiyor. Dışarıdan bakanlar ise İslam'ın diğer dinler hakkında somut olarak ne iddia ettiğini bilmek istiyor.
  en: People meet friends of other faiths, read critical material online, or notice that their own belief came with their family. Students want the actual arguments, not slogans. Outsiders want to know what Islam claims about other religions, concretely.
shortAnswer:
  tr: "İslam yeni bir din olduğunu iddia etmez. Bütün önceki peygamberlerin getirdiği aynı mesaj — tek Allah'a ibadet ve doğru amel — olduğunu, bu kez son ve korunmuş bir biçimde verildiğini iddia eder (2:285; 5:48). Somut olarak, Hz. Mûsâ'yı ve Hz. Îsâ'yı (a.s.) peygamber olarak onurlandırır; ama Îsâ'nın ilah olduğunu reddeder ve önceki kitapların aktarım sırasında değiştiğini kabul eder. İslam'ın diğer inançlara karşı gerekçesi, açıkça ifade edilebilecek ölçütlere dayanır: Allah tasavvurunun tutarlılığı; elçisinin karakteri ve etkisi; metninin aktarımı; insan fıtratına uygunluğu. Her ölçütün güçlü yanları ve gerçek zorlukları vardır — en eski yazmalardaki farklılıklar ve Osman nüshası dışındaki nüshaların yakılması dahil. Ölçütleri adilce uygulamak güçlü bir gerekçe bırakır, bir ispat değil. İnanç ile başka inançlardan insanlara saygı birlikte yürür."
  en: "Islam does not claim to be a new religion. It claims to be the same message — the worship of one God and right action — that all earlier prophets brought, now given in a final, preserved form (2:285; 5:48). Concretely, it honours Moses and Jesus (pbuh) as prophets, but denies that Jesus is divine and holds that earlier scriptures were changed in transmission. The case for Islam over other faiths rests on criteria that can be stated: the coherence of its idea of God; the character and impact of its messenger; the transmission of its text; and its fit with human nature. Each criterion has strong points and real difficulties — including variants in the earliest manuscripts and the burning of non-Uthmanic copies. Applying the criteria fairly leaves a strong case, not a proof. Conviction and respect for people of other faiths go together."
