honestLimits:
  tr: Karşılaştırma tek bir sayfada tamamlanamaz ve ölçütler farklı insanlar tarafından farklı tartılır. Erken yazmalar erken sabitlenmiş bir metni destekler, ama anlamı âlimler arasında tartışmalı olan Osman öncesi farklılıkları da gösterir. Diğer dinlere karşı klasik Müslüman argümanlarına (İbn Teymiyye, İbn Hazm) ve modern argümanlara (Nasr, Winter, Sachedina) henüz başvurulmadı. İslam lehindeki gerekçe pek çok insan için güçlüdür; zorlayıcı değildir.
  en: The comparison cannot be finished on one page, and the criteria are weighed differently by different people. The early manuscripts support an early fixed text but also show pre-Uthmanic variants whose meaning scholars dispute. The classical Muslim arguments against other religions (Ibn Taymiyya, Ibn Ḥazm) and the modern ones (Nasr, Winter, Sachedina) have not yet been consulted. The case for Islam is strong for many people; it does not compel.
