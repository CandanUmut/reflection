steelman:
  tr: "\"Peygamber'e 'âlemlere rahmet' deniyor (21:107), ama pek çok askerî sefere komuta etti. 627'deki Hendek Savaşı'ndan sonra Yahudi Kurayza kabilesi teslim oldu ve kaynaklara göre bütün yetişkin erkekleri — yüzlercesi — başları kesilerek öldürüldü, kadınları ve çocukları köleleştirildi. Kur'an'ın kendisi bundan söz ediyor: 'siz onların bir kısmını katlediyordunuz, bir kısmını da esir alıyordunuz' (33:26). Ve Kur'an şunu emrediyor: 'o müşrikleri nerede bulursanız öldürün' (9:5) ve 'Allah'a… inanmayan… kimselere alçalmış oldukları halde elden cizye verecekleri hale gelinceye kadar savaş yapın' (9:29). Bu nasıl bir rahmet örneği?\""
  en: "\"The Prophet is called 'a mercy to the worlds' (21:107), yet he led many military campaigns. After the Battle of the Trench in 627, the Jewish tribe of Qurayza surrendered, and according to the sources all their adult men — hundreds of them — were beheaded, and their women and children enslaved. The Quran itself mentions it: 'a party you killed, and you took captive a party' (33:26). And the Quran commands: 'kill the polytheists wherever you find them' (9:5) and 'fight those who do not believe… until they give the jizyah… while they are humbled' (9:29). How is this a model of mercy?\""
whyAsked:
  tr: İslam eleştirmenleri bunu belirleyici bir delil olarak öne sürer ve Yahudi–Müslüman ilişkilerini önemseyen Müslümanlar bunun ağırlığını hisseder. Yahudi okuyucular bunu kendi tarihlerinin bir parçası olarak sorar.
  en: It is cited as decisive by critics of Islam, and Muslims who care about Jewish–Muslim relations feel its weight. Jewish readers ask about it as part of their own history.
shortAnswer:
  tr: "Kaynaklar şunu bildirir: Kurayza, Medine'yi yok olmakla tehdit eden bir kuşatma sırasında saldıran orduyla müzakerelere girdi; kuşatmadan sonra teslim oldu ve eski müttefiklerinin lideri Sa'd b. Muâz'ın hükmünü kabul etti; Sa'd da savaşan erkeklerin ölümüne, kadınların ve çocukların esir alınmasına hükmetti ve Hz. Peygamber (s.a.v.) bu hükmü onayladı ({hadith:bukhari:4121}). Sonraki tarih kaynaklarındaki sayılar — İbn İshâk ve Taberî'de 600 ile 900 arası, İbn Kesîr'de 700 ile 800 arası — belirsizdir ve bazı âlimler bunların şişirildiğini düşünür. M. J. Kister (1986) olayın özünü tarihî olarak savundu. Bu, modern insancıl hukukun yasakladığı bir toplu cezaydı. Müslümanlar bunu Yahudilere karşı bir kural olarak değil, ihanet için verilmiş bir savaş zamanı hükmü olarak açıklar; Kur'an'ın savaşla ilgili genel kuralları savunmaya dayalıdır ve kadınların ve çocukların öldürülmesini yasaklar. 9:5 ve 9:29 âyetlerinin belirli bağlamları vardır ve klasik okumaları bazen modern okumalardan daha geniş kapsamlıydı. Hiçbir okuma Kurayza'nın ahlaki ağırlığını ortadan kaldırmaz ve onda Yahudilere karşı nefreti destekleyen hiçbir şey yoktur."
  en: The sources report that Qurayza, during a siege that threatened Medina with destruction, entered negotiations with the attacking army; that after the siege they surrendered and accepted the judgment of Saʿd ibn Muʿadh, leader of their former allies; and that he sentenced the fighting men to death and the women and children to captivity, a verdict the Prophet (pbuh) approved ({hadith:bukhari:4121}). The numbers in the later historical sources — 600 to 900 in Ibn Ishaq and al-Tabari, 700 to 800 in Ibn Kathir — are uncertain, and some scholars think they are inflated. M. J. Kister (1986) defended the core account as historical. It was a collective punishment that modern humanitarian law forbids. Muslims explain it as a wartime judgment for treason, not a rule against Jews; the Quran's general rules on war are defensive and forbid killing women and children. Verses 9:5 and 9:29 have specific settings, and their classical readings were sometimes broader than modern ones. No reading removes the moral weight of Qurayza, and nothing in it supports hatred of Jews.
layers:
  - kind: religious
    tr: |
      Savaşmaya meşru müdafaa için (22:39–40), haddi aşmadan (2:190) izin verilir. Kadınları ve çocukları öldürmek yasaktır (Buhârî 3015; Müslim 1744). Kur'an 33:26'da olaya değinir. Sa'd'ın hükmü Buhârî 4121'dedir; rakamlar İbn İshak'tan gelir. Fakihler bunu bozulan bir antlaşma (*nakzu'l-ahd*) üzerine hakemlik olarak ele aldı.
    en: Fighting is permitted in self-defence (22:39–40), without transgression (2:190). Killing women and children is forbidden (Bukhārī 3015; Muslim 1744). The Quran alludes to the episode in 33:26. Saʿd's verdict is in Bukhārī 4121; the numbers come from Ibn Isḥāq. Jurists treated it as arbitration over a broken treaty (*naqḍ al-ʿahd*).
  - kind: philosophical
    tr: |
      W.N. Arafat (*JRAS* 1976), 600–900 rakamının doğru olamayacağını savundu. Geç kaynakları ve Masada'nın olası bir yankısını gösterdi. M.J. Kister (*JSAI* 1986) ona madde madde cevap verdi ve tarihçilerin çoğu olayın özünde Kister'i izler. Toplu idam modern insancıl hukuku ihlal eder. Savunucular, şehrin varlığını tehdit eden bir kuşatma sırasındaki ihaneti gösterir. Eleştirmenler, bağlamın açıkladığını ama haklı çıkarmadığını söyler.
    en: W.N. Arafat (*JRAS* 1976) argued that the figure of 600–900 cannot be true. He cited the late sources and a possible echo of Masada. M.J. Kister (*JSAI* 1986) answered him point by point, and most historians follow Kister on the core event. Collective execution violates modern humanitarian law. Defenders cite treason during a siege that threatened the city's existence. Critics reply that context explains but does not justify.
  - kind: history
    tr: |
      Aktarılan rakamlar yaklaşık 40 ile 900 arasında değişir [Debated].
    en: Reported numbers range from about 40 to 900 [Debated].
  - kind: psychological
    tr: |
      Peygamber sevgisi ile ahlâkî huzursuzluk bir arada var olabilir. Bu olay hiçbir toplu suçlamayı ya da antisemitizmi haklı çıkarmaz.
    en: Love for the Prophet and moral unease can coexist. Nothing in this episode supports collective guilt or antisemitism.
honestLimits:
  tr: Hiçbir cevap Kurayza'nın ahlaki ağırlığını ortadan kaldırmaz. Olayın özü muhtemelen tarihîdir; sayılar belirsizdir. 9:5 ve 9:29'un klasik okumaları bazen modern bağlamsal okumalardan daha geniş kapsamlıydı. Arafat'ın ve Kister'in makalelerine henüz doğrudan başvurulmadı ve vardıkları sonuçların gerekçeleri ikinci elden veriliyor.
  en: No answer removes the moral weight of Qurayza. The core event is probably historical; the numbers are uncertain. Classical readings of 9:5 and 9:29 were sometimes broader than modern contextual ones. Arafat's and Kister's articles have not yet been consulted directly, and the reasons for their conclusions are given second-hand.
