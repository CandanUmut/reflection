theme: ethics
title:
  tr: Hz. Peygamber'in savaşları ve Benî Kurayza
  en: The Prophet's wars and Banu Qurayza
sensitivity: high
helpCard: general
verses:
  - 22:39-40
  - 2:190
  - 33:26
steelman:
  tr: |
    "Âlemlere rahmet" (21:107) olan biri pek çok sefere komuta etti. Hendek Savaşı'ndan (627) sonra kaynaklar, Kurayza kabilesinin bütün yetişkin erkeklerinin (400–900) idam edildiğini, kadınların ve çocukların köleleştirildiğini aktarır.
  en: A "mercy to the worlds" (21:107) led many campaigns. After the Battle of the Trench (627), the sources report that all adult males of the Qurayẓa tribe (400–900) were executed and the women and children enslaved.
whyAsked:
  tr: |
    Polemikçiler onu belirleyici sayar ve Yahudi–Müslüman ilişkilerine önem veren Müslümanlar rahatsızlık duyar.
  en: Polemicists treat it as decisive, and Muslims who care about Jewish–Muslim relations feel the discomfort.
shortAnswer:
  tr: |
    Kaynaklara göre Kurayza, Medine'nin varlığını tehdit eden bir kuşatma sırasında bir savunma antlaşmasını bozdu. Eski müttefikleri Sa'd b. Muâz'ın hakemliğine teslim oldular; onun hükmü dönemin savaş normlarına uyuyordu (bkz. Tesniye 20). Rakamlar tartışmalıdır. Anlatı kabul edilse bile ahlâkî ağırlığı büyüktür ve bu kabul edilmelidir.
  en: According to the sources, Qurayẓa broke a defence treaty during a siege that threatened Medina's survival. They surrendered to the judgement of their former ally Saʿd b. Muʿādh, whose verdict matched the war norms of the time (cf. Deuteronomy 20). The numbers are disputed. Even if the account is accepted, its moral weight is heavy and should be acknowledged.
layers:
  - kind: religious
    tr: |
      Savaşmaya meşru müdafaa için (22:39–40), haddi aşmadan (2:190) izin verilir. Kadınları ve çocukları öldürmek yasaktır (Buhârî 3015; Müslim 1744). Kur'an 33:26'da olaya değinir. Sa'd'ın hükmü Buhârî 4121'dedir; rakamlar İbn İshak'tan gelir. Fakihler bunu bozulan bir antlaşma (*nakzu'l-ahd*) üzerine hakemlik olarak ele aldı.
    en: Fighting is permitted in self-defence (22:39–40), without transgression (2:190). Killing women and children is forbidden (Bukhārī 3015; Muslim 1744). The Quran alludes to the episode in 33:26. Saʿd's verdict is in Bukhārī 4121; the numbers come from Ibn Isḥāq. Jurists treated it as arbitration over a broken treaty (*naqḍ al-ʿahd*).
  - kind: philosophical
    tr: |
      W.N. Arafat (*JRAS* 1976), 600–900 rakamının doğru olamayacağını savundu. Geç kaynakları ve Masada'nın olası bir yankısını gösterdi. M.J. Kister (*JSAI* 1986) ona madde madde cevap verdi ve tarihçilerin çoğu olayın özünde Kister'i izler. Toplu idam modern insancıl hukuku ihlal eder. Savunucular, şehrin varlığını tehdit eden bir kuşatma sırasındaki ihaneti gösterir. Eleştirmenler, bağlamın açıkladığını ama haklı çıkarmadığını söyler.
    en: W.N. Arafat (*JRAS* 1976) argued that the figure of 600–900 cannot be true. He cited the late sources and a possible echo of Masada. M.J. Kister (*JSAI* 1986) answered him point by point, and most historians follow Kister on the core event. Collective execution violates modern humanitarian law. Defenders cite treason during a siege that threatened the city's existence. Critics reply that context explains but does not justify.
  - kind: history
    tr: |
      Aktarılan rakamlar yaklaşık 40 ile 900 arasında değişir [Debated].
    en: Reported numbers range from about 40 to 900 [Debated].
  - kind: psychological
    tr: |
      Peygamber sevgisi ile ahlâkî huzursuzluk bir arada var olabilir. Olay, hiçbir toplu suçlama ve hiçbir antisemitizm olmadan öğretilmelidir.
    en: Love for the Prophet and moral unease can coexist. The episode must be taught with no collective guilt and no antisemitism.
honestLimits:
  tr: |
    Hiçbir cevap ahlâkî ağırlığı ortadan kaldırmaz. Olayın özü muhtemelen tarihîdir; rakamlar belirsizdir. Bugün Yahudilere karşı asla kullanılmamalıdır.
  en: No answer removes the moral weight. The core event is probably historical; the numbers are uncertain. It must never be used against Jews today.
