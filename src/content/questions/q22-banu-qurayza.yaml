fullAnswer:
  - kind: heart
    en: |-
      **If you are Jewish and reading this,** this is part of your people's history, told here as the sources tell it, with its weight acknowledged. It gives no one any right to hostility toward Jews today. The Quran itself defends synagogues by name among the places of worship God protects (22:40).

      **If you are Muslim and feel uneasy,** love for the Prophet (pbuh) and moral unease can live together. Trying to make the account painless by changing the facts would cost more trust than it gains.
    tr: |-
      **Yahudiysen ve bunu okuyorsan,** bu senin halkının tarihinin bir parçasıdır; burada kaynakların anlattığı şekliyle ve ağırlığı kabul edilerek anlatılıyor. Bu, hiç kimseye bugün Yahudilere karşı düşmanlık hakkı vermez. Kur'an'ın kendisi, Allah'ın koruduğu ibadet yerleri arasında havraları adıyla anarak savunur (22:40).

      **Müslümansan ve huzursuz hissediyorsan,** Hz. Peygamber'e (s.a.v.) sevgi ile ahlaki huzursuzluk bir arada yaşayabilir. Olguları değiştirerek anlatıyı acısız hâle getirmeye çalışmak, kazandırdığından daha fazla güvene mal olur.
    title:
      en: Kalp ve akıl için
      tr: Kalp ve akıl için
  - kind: quran
    en: |-
      **The permission to fight was defensive.** "Permission [to fight] has been given to those who are being fought, because they were wronged" (22:39); they were "evicted from their homes without right - only because they say, 'Our Lord is Allah.' And were it not that Allah checks the people, some by means of others, there would have been demolished monasteries, churches, synagogues, and mosques" (22:40). These are the first verses permitting fighting, revealed around the emigration to Medina. "Fight in the way of Allah those who fight you but do not transgress" (2:190), Medinan.

      **The Qurayza verse.** "And He brought down those who supported them among the People of the Scripture from their fortresses and cast terror into their hearts [so that] a party you killed, and you took captive a party" (33:26), in Sura al-Ahzab, Medinan, after the Battle of the Trench. "Those who supported them" means those who supported the besieging coalition. The verse confirms the outcome but gives no numbers and no details.

      **9:5 in its setting.** "And when the sacred months have passed, then kill the polytheists wherever you find them and capture them and besiege them and sit in wait for them at every place of ambush. But if they should repent, establish prayer, and give zakah, let them [go] on their way" (9:5). The next verses say: "And if any one of the polytheists seeks your protection, then grant him protection so that he may hear the words of Allah. Then deliver him to his place of safety" (9:6), and "So as long as they are upright toward you, be upright toward them" (9:7). The passage, in Sura al-Tawba (one of the last Medinan suras), concerns Arab polytheists who had broken treaties; 9:4 and 9:7 exempt those who kept them.

      **9:29 in its setting.** "Fight those who do not believe in Allah or in the Last Day and who do not consider unlawful what Allah and His Messenger have made unlawful and who do not adopt the religion of truth from those who were given the Scripture - [fight] until they give the jizyah willingly while they are humbled" (9:29). Ibn Kathir connects it with the campaign of Tabuk, when the Prophet (pbuh) marched "towards Ash-Sham to fight the Romans".
    tr: |-
      **Savaş izni savunmaya yönelikti.** "Kendilerine savaş açılan kimselere (kâfirlere karşı koymak için) izin verildi. Çünkü onlar zulme uğradılar." (22:39); onlar ""Rabbimiz Allah'tır" demelerinden başka bir sebep olmaksızın haksız yere yurtlarından çıkarıldılar. Eğer Allah insanların bir kısmını bir kısmı ile defetmeseydi manastırlar, kiliseler, havralar ve içinde Allah'ın adı çok anılan mescidler elbette yıkılırdı" (22:40). Bunlar savaşa izin veren ilk âyetlerdir ve Medine'ye hicret sıralarında indi. "Size savaş açanlarla Allah yolunda çarpışın. Fakat haksız saldırıda bulunmayın." (2:190), Medenî.

      **Kurayza âyeti.** "Hem de kitap ehlinden onlara yardım edenleri kalplerine korku düşürerek kalelerinden indirdi, siz onların bir kısmını katlediyordunuz, bir kısmını da esir alıyordunuz." (33:26), Ahzâb Sûresi'nde, Medenî, Hendek Savaşı'ndan sonra. "Onlara yardım edenler", kuşatan koalisyonu destekleyenler demektir. Âyet sonucu teyit eder, ama hiçbir sayı ve ayrıntı vermez.

      **9:5 kendi bağlamında.** "Şu haram aylar bir çıktı mı artık o müşrikleri nerede bulursanız öldürün, yakalayın, hapsedin ve bütün geçit başlarını tutun. Eğer tevbe ederler ve namaz kılıp zekatı verirlerse onları serbest bırakın." (9:5). Sonraki âyetler şöyle der: "Eğer müşriklerden biri aman dilerse, ona aman ver. Ta ki, Allah'ın kelâmını dinlesin. Sonra onu güvenlik içinde olduğu yere kadar gönder." (9:6) ve "…bunlar size karşı doğru durdukça siz de onlara doğru olun." (9:7). Tevbe Sûresi'ndeki (son Medenî sûrelerden biri) bu pasaj antlaşmaları bozmuş Arap müşrikler hakkındadır; 9:4 ve 9:7 antlaşmalarına bağlı kalanları bunun dışında tutar.

      **9:29 kendi bağlamında.** "Kendilerine kitap verilenlerden oldukları halde ne Allah'a, ne ahiret gününe inanmayan, Allah'ın ve Resulünün haram kıldığını haram tanımayan ve hak dini din edinmeyen kimselere alçalmış oldukları halde elden cizye verecekleri hale gelinceye kadar savaş yapın" (9:29). İbn Kesîr bunu, Hz. Peygamber'in (s.a.v.) "Rumlarla savaşmak için Şam'a doğru" yürüdüğü Tebük seferiyle ilişkilendirir.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: |-
      **Women and children are not to be killed.** Ibn ʿUmar (ra) reports that in one campaign "a woman was found killed", and the Prophet (pbuh) "forbade the killing of women and children" ({hadith:bukhari:3015}).

      **Saʿd's verdict.** Abu Saʿid al-Khudri (ra) reports: "The people of (Banu) Quraiza agreed to accept the verdict of Saʿd bin Muʿadh." The Prophet (pbuh) sent for him and told the Ansar, "Get up for your chief or for the best among you." Saʿd said: "Kill their (men) warriors and take their offspring as captives", and the Prophet (pbuh) said: "You have judged according to Allah's Judgment," or "according to the King's judgment" ({hadith:bukhari:4121}).

      **How "adults" were identified.** ʿAtiyya al-Qurazi said: "I was among the captives of Banu Qurayzah", and "those who had begun to grow hair (pubes) were killed"; he was spared because he had not ({hadith:abudawud:4404}; al-Albani: *ṣaḥīḥ*). So yes, this report exists and is graded authentic. It shows that puberty was used as the line between "fighting man" and "child".
    tr: |-
      **Kadınlar ve çocuklar öldürülmez.** İbn Ömer (r.a.), bir seferde "öldürülmüş bir kadın bulunduğunu" ve Hz. Peygamber'in (s.a.v.) "kadınların ve çocukların öldürülmesini yasakladığını" aktarır ({hadith:bukhari:3015}).

      **Sa'd'ın hükmü.** Ebû Saîd el-Hudrî (r.a.) şöyle aktarır: "(Benî) Kurayza halkı Sa'd b. Muâz'ın hükmünü kabul etmeye razı oldu." Hz. Peygamber (s.a.v.) onu çağırttı ve Ensâr'a, "Efendiniz için — ya da en hayırlınız için — ayağa kalkın" dedi. Sa'd şöyle dedi: "Onların savaşçılarını (erkeklerini) öldürün ve çocuklarını esir alın"; Hz. Peygamber (s.a.v.) de şöyle buyurdu: "Allah'ın hükmüyle hükmettin" ya da "Melik'in hükmüyle" ({hadith:bukhari:4121}).

      **"Yetişkinler" nasıl belirlendi?** Atıyye el-Kurazî şöyle dedi: "Benî Kurayza esirleri arasındaydım" ve "kılları (kasık kılları) çıkmaya başlamış olanlar öldürüldü"; kendisi henüz çıkmadığı için bağışlandı ({hadith:abudawud:4404}; Elbânî: *sahih*). Yani evet, bu rivayet vardır ve sahih olarak derecelendirilmiştir. "Savaşan erkek" ile "çocuk" arasındaki çizginin ergenlik olarak çekildiğini gösterir.
    title:
      en: Hz. Peygamber (s.a.v.) ne öğretti?
      tr: Hz. Peygamber (s.a.v.) ne öğretti?
  - kind: history
    en: |-
      **The setting.** Medina had three main Jewish tribes: Qaynuqaʿ, al-Nadir and Qurayza. Qaynuqaʿ were besieged and expelled in 624 after a dispute that escalated into killings; al-Nadir were besieged and expelled in 625 after the Prophet (pbuh) was told they were plotting to kill him; both left (Qaynuqaʿ toward Syria, al-Nadir to Khaybar) (Wikipedia, "Military career of Muhammad"). Leaders of al-Nadir then helped assemble the coalition that besieged Medina in 626–627 — about 10,000 men — at the Battle of the Trench.

      **What treaty?** The so-called Constitution of Medina, an early agreement among Medina's groups, does not name Qaynuqaʿ, al-Nadir or Qurayza: "the three great Jewish tribes of Medina are not included in the document" (Rubin, p. 6). Lecker writes that Qurayza had a separate "non-belligerency agreement with Muhammad" (*Encyclopaedia Judaica*). The historians Watt and Stillman doubted that a specific treaty existed; the historian al-Waqidi (d. 823) reports one that Qurayza tore up (Wikipedia, "Siege").

      **What Qurayza did.** Lecker writes that Qurayza "probably remained neutral": they lent the Muslims tools for digging the trench but also sold provisions to the besiegers. Ibn Ishaq reports that they readmitted Huyayy ibn Akhtab, the leader of al-Nadir, and al-Waqidi that Huyayy tore up their agreement; Watt says they "seem to have tried to remain neutral" and later entered negotiations with the invading army (Wikipedia, "Siege"). So the "breach" was, at the least, negotiating with an army besieging the city they were bound not to fight against; how far it went is disputed.

      **The siege and the verdict.** After the coalition withdrew, the Muslims besieged Qurayza for 25 days (Wikipedia, "Siege"). They surrendered unconditionally, and their fate was "reportedly decided not by Muhammad" but by Saʿd ibn Muʿadh, the gravely wounded leader of the Aws, Qurayza's former allies; some of the Aws opposed his decision (Lecker). One woman was also executed, reportedly for killing a Muslim by dropping a millstone (Wikipedia, citing Abu Dawud and al-Mubarakpuri).

      **How late are the sources?** Ibn Ishaq, the main source for the details, died in Baghdad in 767 — about 140 years after the event. His biography of the Prophet (pbuh) survives mostly through Ibn Hisham (d. 833) and extracts in al-Tabari (Wikipedia, "Ibn Ishaq"). His contemporary Malik ibn Anas (d. 795) rejected his stories about the Jews of Medina because, he said, "they were taken solely based on accounts by sons of Jewish converts" (as reported by *Wikipedia*, citing Arafat).

      **The numbers.** The hadith collections give no number. The later sources give: Ibn Ishaq, 600 or 700, with the highest estimate 800–900; al-Tabari, 600 or 700, up to 800–900; Ibn Kathir, 700–800 (Wikipedia, "Siege", citing these sources). Kister estimated the women and children at about 1,000. Kirazli (2019) argues that "the number of Jews punished in this incident were significantly less than what is reported by Ibn Isḥāq".

      **Arafat and Kister.** W. N. M. J. Kister (*Jerusalem Studies in Arabic and Islam* 8, 1986) re-examined the traditions and concluded that the core account — the execution of the adult men — is historical. Whether most historians follow Kister has not yet been checked; the numbers remain uncertain.

      **The other campaigns.** The sources count 27 campaigns led by the Prophet (pbuh) (al-Waqidi and Ibn Saʿd; Ibn Ishaq counts 19) and 35–48 smaller expeditions (Wikipedia). They end with the conquest of Mecca (630), which was "largely bloodless" with a general amnesty, and at Khaybar (628) the Jews were allowed to stay in return for half their produce.
    tr: |-
      **Ortam.** Medine'de üç büyük Yahudi kabilesi vardı: Kaynuka, Nadîr ve Kurayza. Kaynuka, cinayetlere varan bir anlaşmazlıktan sonra 624'te kuşatıldı ve sürüldü; Nadîr, Hz. Peygamber'e (s.a.v.) onu öldürmeyi planladıkları bildirildikten sonra 625'te kuşatıldı ve sürüldü; ikisi de ayrıldı (Kaynuka Suriye'ye doğru, Nadîr Hayber'e) (Wikipedia, "Military career of Muhammad"). Nadîr'in liderleri daha sonra 626–627'de Medine'yi Hendek Savaşı'nda kuşatan — yaklaşık 10.000 kişilik — koalisyonun kurulmasına yardım etti.

      **Hangi antlaşma?** Medine Vesikası denen, Medine'deki gruplar arasındaki erken dönem antlaşma, Kaynuka'yı, Nadîr'i ya da Kurayza'yı adıyla anmaz: "Medine'nin üç büyük Yahudi kabilesi belgede yer almıyor" (Rubin, s. 6). Lecker, Kurayza'nın ayrı bir "Muhammed'le saldırmazlık antlaşması" olduğunu yazar (*Encyclopaedia Judaica*). Tarihçiler Watt ve Stillman belirli bir antlaşmanın varlığından şüphe etti; tarihçi Vâkıdî (ö. 823) ise Kurayza'nın yırttığı bir antlaşmadan söz eder (Wikipedia, "Siege").

      **Kurayza ne yaptı?** Lecker, Kurayza'nın "muhtemelen tarafsız kaldığını" yazar: Müslümanlara hendeği kazmak için alet ödünç verdiler, ama kuşatanlara da erzak sattılar. İbn İshâk, onların Nadîr'in lideri Huyey b. Ahtab'ı yeniden içeri aldıklarını, Vâkıdî de Huyey'in antlaşmalarını yırttığını aktarır; Watt onların "tarafsız kalmaya çalışmış göründüklerini" ve sonra işgalci orduyla müzakerelere girdiklerini söyler (Wikipedia, "Siege"). Yani "ihlal" en azından, karşı savaşmamakla yükümlü oldukları şehri kuşatan bir orduyla müzakere etmekti; ne kadar ileri gittiği tartışmalıdır.

      **Kuşatma ve hüküm.** Koalisyon çekildikten sonra Müslümanlar Kurayza'yı 25 gün kuşattı (Wikipedia, "Siege"). Kayıtsız şartsız teslim oldular ve akıbetleri "rivayete göre Muhammed tarafından değil", Kurayza'nın eski müttefikleri Evs'in ağır yaralı lideri Sa'd b. Muâz tarafından belirlendi; Evs'ten bazıları onun kararına karşı çıktı (Lecker). Bir kadın da, rivayete göre bir değirmen taşı atarak bir Müslümanı öldürdüğü için idam edildi (Wikipedia, Ebû Dâvûd'a ve Mübârekpûrî'ye atıfla).

      **Kaynaklar ne kadar geç?** Ayrıntıların ana kaynağı İbn İshâk, olaydan yaklaşık 140 yıl sonra, 767'de Bağdat'ta öldü. Hz. Peygamber'in (s.a.v.) hayatını anlatan eseri çoğunlukla İbn Hişâm (ö. 833) aracılığıyla ve Taberî'deki alıntılarla günümüze ulaştı (Wikipedia, "Ibn Ishaq"). Çağdaşı Mâlik b. Enes (ö. 795), onun Medine Yahudileri hakkındaki hikâyelerini, "yalnızca Yahudi mühtedilerin oğullarının anlattıklarına dayanılarak alındıkları" gerekçesiyle reddetti (*Wikipedia*'nın Arafat'a atıfla aktardığına göre).

      **Sayılar.** Hadis külliyatları hiçbir sayı vermez. Sonraki kaynaklar şunları verir: İbn İshâk, 600 ya da 700, en yüksek tahmin 800–900; Taberî, 600 ya da 700, 800–900'e kadar; İbn Kesîr, 700–800 (Wikipedia, "Siege", bu kaynaklara atıfla). Kister kadınları ve çocukları yaklaşık 1.000 olarak tahmin etti. Kirazlı (2019), "bu olayda cezalandırılan Yahudilerin sayısının İbn İshâk'ın bildirdiğinden önemli ölçüde az olduğunu" savunur.

      **Arafat ve Kister.** M. J. Kister (*Jerusalem Studies in Arabic and Islam* 8, 1986) rivayetleri yeniden inceledi ve olayın özünün — yetişkin erkeklerin idamının — tarihî olduğu sonucuna vardı. Tarihçilerin çoğunun Kister'i izleyip izlemediği henüz kontrol edilmedi; sayılar belirsizliğini koruyor.

      **Diğer seferler.** Kaynaklar Hz. Peygamber'in (s.a.v.) bizzat komuta ettiği 27 sefer (Vâkıdî ve İbn Sa'd; İbn İshâk 19 sayar) ve 35–48 küçük askerî birlik sayar (Wikipedia). Bunlar, genel afla birlikte "büyük ölçüde kansız" geçen Mekke'nin fethiyle (630) sona erer; Hayber'de (628) ise Yahudilerin ürünlerinin yarısı karşılığında kalmalarına izin verildi.
    title:
      en: Tarih
      tr: Tarih
  - kind: scholars
    en: |-
      **Classical readings were often broad.** Ibn Kathir writes that 9:5 "was called the Ayah of the Sword", and cites al-Dahhak ibn Muzahim: it "abrogated every agreement of peace between the Prophet and any idolator, every treaty, and every term". He says these verses "allowed fighting people unless, and until, they embrace Islam". On 9:29, he reads "while they are humbled" as "disgraced, humiliated and belittled", and cites conditions attributed to ʿUmar that restricted Christians' public worship.

      **Other classical voices.** Al-Hasan al-Basri held 9:5 to be unabrogated but specific; al-Shafiʿi reports scholars explaining "while they are humbled" as meaning that "Islamic rulings are enforced on them"; Ibn al-Qayyim read it as requiring all subjects to obey the law (Wikipedia, "Sword Verse"; "Jizya"). "*An yadin*" ("willingly", literally "from a hand") was read by al-Tabari as paying directly, by Rashid Rida as according to means (Wikipedia, "Jizya").

      **Modern readings.** Muhammad Abdel Haleem says the targeted polytheists "continuously broke their agreements and aided others against the Muslims", that the passage exempts those who kept their treaties (9:4, 9:7), and that 9:6 "orders that those enemies seeking safe-conduct should be protected"; he rejects the humiliation reading of 9:29. Patricia Crone, a non-Muslim historian, says 9:5 "is directed against a particular group accused of oath-breaking and aggression" (Wikipedia, "Sword Verse"). The Ottoman Empire abolished the jizya in 1856; Yusuf al-Qaradawi wrote that "there is no longer room for any payment, whether by name of jizya or any other", since all citizens now serve in the army (Wikipedia, "Jizya"). The 2014 Open Letter to al-Baghdadi states: "Jihad in Islam is defensive war."
    tr: |-
      **Klasik okumalar çoğu zaman geniş kapsamlıydı.** İbn Kesîr, 9:5'e "Seyf (Kılıç) Âyeti denildiğini" yazar ve Dahhâk b. Müzâhim'i aktarır: Bu âyet "Peygamber ile herhangi bir müşrik arasındaki her barış antlaşmasını, her ahdi ve her şartı neshetti". Bu âyetlerin "insanlarla, İslam'ı kabul etmedikçe ve edinceye kadar savaşmaya izin verdiğini" söyler. 9:29'da "alçalmış oldukları halde" ifadesini "rezil edilmiş, aşağılanmış ve küçük düşürülmüş" olarak okur ve Hz. Ömer'e atfedilen, Hristiyanların açık ibadetini kısıtlayan şartları aktarır.

      **Diğer klasik sesler.** Hasan-ı Basrî 9:5'in neshedilmediğini ama özel olduğunu savundu; Şâfiî, âlimlerin "alçalmış oldukları halde" ifadesini "İslami hükümlerin onlara uygulanması" anlamında açıkladığını aktarır; İbn Kayyim bunu bütün tebaanın hukuka uymasını gerektiren bir ifade olarak okudu (Wikipedia, "Sword Verse"; "Jizya"). "*An yedin*" (Saheeh International'da "willingly", yani "gönüllü olarak"; kelimesi kelimesine "elden"; Elmalılı: "elden") Taberî tarafından doğrudan ödemek, Reşîd Rızâ tarafından ise güce göre ödemek olarak okundu (Wikipedia, "Jizya").

      **Modern okumalar.** Muhammad Abdel Haleem, hedef alınan müşriklerin "antlaşmalarını sürekli bozduğunu ve Müslümanlara karşı başkalarına yardım ettiğini", pasajın antlaşmalarına bağlı kalanları bunun dışında tuttuğunu (9:4, 9:7) ve 9:6'nın "güvenli geçiş isteyen düşmanların korunmasını emrettiğini" söyler; 9:29'un aşağılama okumasını reddeder. Müslüman olmayan bir tarihçi olan Patricia Crone, 9:5'in "yemin bozmak ve saldırganlıkla suçlanan belirli bir gruba yöneltildiğini" söyler (Wikipedia, "Sword Verse"). Osmanlı Devleti cizyeyi 1856'da kaldırdı; Yûsuf el-Karadâvî, artık bütün vatandaşlar orduda hizmet ettiği için "ister cizye adıyla ister başka bir adla olsun, hiçbir ödemeye artık yer olmadığını" yazdı (Wikipedia, "Jizya"). Bağdâdî'ye 2014 tarihli Açık Mektup şöyle der: "İslam'da cihad savunma savaşıdır."
    title:
      en: Âlimler 9:5 ve 9:29'u nasıl okudu?
      tr: Âlimler 9:5 ve 9:29'u nasıl okudu?
  - kind: reasoning
    en: |-
      **What the defence says.** Qurayza were judged for treason during a siege that threatened the city's survival, by an arbiter they themselves accepted, under the war norms of their time; the Prophet (pbuh) forbade killing women and children (Bukhari 3015); the verdict was a judgment on one group's conduct, not a rule about Jews; and the Quran's rules on war are defensive (22:39–40; 2:190).

      **What the critic says.** Collective execution of all adult males, decided by physical signs of puberty, violates basic modern principles of individual guilt. "The norms of the time" explain; they do not justify. And if the Prophet (pbuh) is a model beyond his time, his approval of the verdict needs more than context.

      **How the tradition can answer the "model" question.** As on the page about Aisha's age, Muslim jurists distinguished the Prophet's acts as messenger from his acts as judge and head of state (al-Qarafi; Ibn ʿAshur). Saʿd's verdict was a judicial and political act in a specific war, not a general law; the Quran's general law of war is restraint and defence. *Limit:* the Prophet (pbuh) called the verdict "Allah's Judgment" ({hadith:bukhari:4121}), which makes it harder to treat as merely political. The moral weight remains.
    tr: |-
      **Savunma ne diyor?** Kurayza, şehrin varlığını tehdit eden bir kuşatma sırasında ihanetten dolayı, kendilerinin kabul ettiği bir hakem tarafından, zamanlarının savaş normlarına göre yargılandı; Hz. Peygamber (s.a.v.) kadınların ve çocukların öldürülmesini yasakladı (Buhârî 3015); hüküm Yahudiler hakkında bir kural değil, bir grubun davranışı hakkında bir yargıydı; ve Kur'an'ın savaş kuralları savunmaya dayalıdır (22:39–40; 2:190).

      **Eleştirmen ne diyor?** Ergenliğin bedensel işaretlerine göre belirlenen bütün yetişkin erkeklerin toplu idamı, bireysel suçun temel modern ilkelerini çiğner. "Zamanın normları" açıklar; haklı çıkarmaz. Ve Hz. Peygamber (s.a.v.) zamanının ötesinde bir örnekse, hükmü onaylaması bağlamdan fazlasını gerektirir.

      **Gelenek "örnek" sorusuna nasıl cevap verebilir?** Hz. Âişe'nin yaşıyla ilgili sayfada olduğu gibi, Müslüman fakihler Hz. Peygamber'in elçi olarak yaptıklarını, hâkim ve devlet başkanı olarak yaptıklarından ayırdı (Karâfî; İbn Âşûr). Sa'd'ın hükmü, belirli bir savaştaki yargısal ve siyasi bir fiildi, genel bir hukuk değildi; Kur'an'ın genel savaş hukuku itidal ve savunmadır. *Sınır:* Hz. Peygamber (s.a.v.) hükmü "Allah'ın hükmü" olarak adlandırdı ({hadith:bukhari:4121}); bu da onu yalnızca siyasi bir şey olarak ele almayı zorlaştırır. Ahlaki ağırlık yerinde duruyor.
    title:
      en: Ahlaki olarak bunu nasıl düşünmeli?
      tr: Ahlaki olarak bunu nasıl düşünmeli?
  - kind: objection
    en: |-
      **"The numbers prove a massacre."** *Reply:* the numbers come from sources written 140 years later and vary widely; Arafat and Kirazli argue they are inflated. *Limit:* even the lowest numbers describe a mass execution; the debate is about scale, not about whether it was severe.

      **"9:5 commands killing all non-Muslims."** *Reply:* the passage names treaty-breaking polytheists, exempts those who kept treaties (9:4, 9:7), and orders protection for those who seek it (9:6). *Limit:* classical scholars such as al-Dahhak (via Ibn Kathir) read it far more broadly, and that reading had real effects; the modern contextual reading is strong but not the only one in the tradition.

      **"9:29 commands humiliating Christians and Jews."** *Reply:* scholars disagreed on what "humbled" means — from humiliation (Ibn Kathir) to submission to the law (al-Shafiʿi's report; Ibn al-Qayyim; Abdel Haleem) — and the jizya was abolished in 1856. *Limit:* the humiliation reading was common in classical tafsir and law.
    tr: |-
      **"Sayılar bir katliamı ispat ediyor."** *Cevap:* Sayılar 140 yıl sonra yazılmış kaynaklardan geliyor ve büyük farklılıklar gösteriyor; Arafat ve Kirazlı bunların şişirildiğini savunur. *Sınır:* En düşük sayılar bile toplu bir idamı anlatır; tartışma olayın ağır olup olmadığı hakkında değil, ölçeği hakkındadır.

      **"9:5 bütün gayrimüslimlerin öldürülmesini emrediyor."** *Cevap:* Pasaj antlaşma bozan müşrikleri anar, antlaşmalarına bağlı kalanları bunun dışında tutar (9:4, 9:7) ve koruma isteyenlerin korunmasını emreder (9:6). *Sınır:* Dahhâk gibi klasik âlimler (İbn Kesîr yoluyla) onu çok daha geniş okudu ve bu okumanın gerçek etkileri oldu; modern bağlamsal okuma güçlüdür ama gelenekteki tek okuma değildir.

      **"9:29 Hristiyanları ve Yahudileri aşağılamayı emrediyor."** *Cevap:* Âlimler "alçalmış" kelimesinin ne anlama geldiği konusunda ayrıldı — aşağılamadan (İbn Kesîr) hukuka boyun eğmeye kadar (Şâfiî'nin aktarımı; İbn Kayyim; Abdel Haleem) — ve cizye 1856'da kaldırıldı. *Sınır:* Aşağılama okuması klasik tefsirde ve hukukta yaygındı.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **Traditional account** — treason in wartime, arbitration, verdict approved by the Prophet (pbuh).
      - **Arafat (1976)** — the story as told by Ibn Ishaq is not credible.
      - **Kister (1986)** — the core account is historical.
      - **Kirazli (2019)** — far fewer were executed than Ibn Ishaq says.
      - **On 9:5 and 9:29** — broad classical readings (al-Dahhak; Ibn Kathir) and contextual readings (al-Hasan al-Basri; Abdel Haleem; Crone; al-Qaradawi).
    tr: |-
      - **Geleneksel anlatı** — savaş zamanında ihanet, hakemlik, Hz. Peygamber'in (s.a.v.) onayladığı hüküm.
      - **Arafat (1976)** — İbn İshâk'ın anlattığı şekliyle hikâye inandırıcı değildir.
      - **Kister (1986)** — olayın özü tarihîdir.
      - **Kirazlı (2019)** — İbn İshâk'ın söylediğinden çok daha azı idam edildi.
      - **9:5 ve 9:29 hakkında** — geniş klasik okumalar (Dahhâk; İbn Kesîr) ve bağlamsal okumalar (Hasan-ı Basrî; Abdel Haleem; Crone; Karadâvî).
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: Who were Saʿd ibn Muʿadh and Ibn Ishaq?
      tr: Sa'd b. Muâz ve İbn İshâk kimdi?
    a:
      en: Saʿd was leader of the Aws, a Medinan Arab tribe allied to Qurayza before Islam; he died of wounds from the Trench soon after. Ibn Ishaq (d. 767) wrote the earliest surviving biography of the Prophet (pbuh), about 140 years after the events.
      tr: Sa'd, İslam'dan önce Kurayza ile müttefik olan Medineli Arap kabilesi Evs'in lideriydi; kısa süre sonra Hendek'te aldığı yaralardan öldü. İbn İshâk (ö. 767), Hz. Peygamber'in (s.a.v.) günümüze ulaşan en eski biyografisini, olaylardan yaklaşık 140 yıl sonra yazdı.
  - q:
      en: Were boys judged adult by checking for pubic hair?
      tr: Erkek çocukların yetişkin olup olmadığına kasık kıllarına bakılarak mı karar verildi?
    a:
      en: Yes, according to ʿAtiyya al-Qurazi's report in Abu Dawud 4404, graded *ṣaḥīḥ* by al-Albani.
      tr: Evet, Ebû Dâvûd 4404'teki, Elbânî'nin *sahih* olarak derecelendirdiği Atıyye el-Kurazî rivayetine göre.
  - q:
      en: What happened to the other Jewish tribes?
      tr: Diğer Yahudi kabilelerine ne oldu?
    a:
      en: Qaynuqaʿ (624) and al-Nadir (625) were besieged and expelled; Khaybar's Jews (628) stayed on terms.
      tr: Kaynuka (624) ve Nadîr (625) kuşatıldı ve sürüldü; Hayber Yahudileri (628) şartlı olarak kaldı.
  - q:
      en: Was there a treaty?
      tr: Bir antlaşma var mıydı?
    a:
      en: Not the "Constitution of Medina", which does not name Qurayza (Rubin). Lecker speaks of a non-belligerency agreement; some historians doubt any specific treaty.
      tr: Kurayza'yı adıyla anmayan "Medine Vesikası" değil (Rubin). Lecker bir saldırmazlık antlaşmasından söz eder; bazı tarihçiler belirli bir antlaşmanın varlığından şüphe eder.
  - q:
      en: How is the Prophet (pbuh) a moral model on this point?
      tr: Hz. Peygamber (s.a.v.) bu konuda nasıl ahlaki bir örnektir?
    a:
      en: In his general rules of war — defence, restraint, protection of women, children and those who seek safety — rather than in one wartime verdict whose moral weight Muslims should acknowledge.
      tr: Ahlaki ağırlığını Müslümanların kabul etmesi gereken tek bir savaş zamanı hükmünde değil, genel savaş kurallarında — savunma, itidal, kadınların, çocukların ve güvenlik isteyenlerin korunması.
  - q:
      en: Does this justify hostility to Jews?
      tr: Bu, Yahudilere düşmanlığı haklı çıkarır mı?
    a:
      en: No. The Quran protects synagogues (22:40), and a judgment about one group in one war is not a judgment about a people.
      tr: Hayır. Kur'an havraları korur (22:40) ve tek bir savaştaki tek bir grup hakkındaki bir hüküm, bir halk hakkında bir hüküm değildir.
