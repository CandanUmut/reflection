id: Q3
slugs:
  tr: deizm
  en: deism
order: 3
theme: deism
title:
  tr: Yaratıcının dünyayla ilgilendiğine neden inanmalı (deizm)?
  en: Why believe the Creator is involved (deism)?
sensitivity: normal
helpCard: false
verses:
  - 20:50
  - 30:30
steelman:
  tr: |
    Akıl bir İlk Sebebe ulaşabilir, ama kanun vahyeden ya da duaya cevap veren bir Tanrı'ya değil. Dinler kültürel olarak şekillenmiş görünür; bu yüzden uzak bir Yaratıcı akla uygun asgari kabul gibi görünür.
  en: Reason may reach a First Cause, but not a God who reveals laws or answers prayer. Religions look culturally shaped, so a distant Creator seems the rational minimum.
whyAsked:
  tr: |
    Türk gençliğinde baskın olan örüntüdür. Kökleri: din temsilcilerinden duyulan hayal kırıklığı, bilime karşı öğretilen din ve kötülük.
  en: It is the dominant Turkish youth pattern. Its roots are disappointment with religious representatives, religion taught against science, and evil.
shortAnswer:
  tr: |
    Anlam arayan zihinler yaratan bir Yaratıcının onlara kayıtsız olması pek olası değildir. Dünyayla ilgilendiğine dair gerekçe Allah'ın vasıflarına (deizmin sessizce bıraktığı rahmet ve hikmete), peygamberliğin tarihî delillerine ve vahyin insan fıtratına uyumuna (*fıtrat*, 30:30) dayanır.
  en: A Creator who makes meaning-seeking minds is unlikely to be indifferent to them. The case for involvement rests on God's character (mercy and wisdom, which deism quietly drops), the historical evidence for prophethood, and revelation's fit with human nature (fiṭra, 30:30).
layers:
  - kind: religious
    tr: |
      - Kur'an rızıktan hidayete doğru delil getirir (20:50; 87:2–3).
      - Gazzâlî'nin *el-Munkız*'ı kendi şüphe krizini ve iyileşmesini anlatır.
      - Nursî doğadaki iyiliği (inayet) şahsî bir kastın göstergesi olarak okur.
    en: |-
      - The Quran argues from provision to guidance (20:50; 87:2–3).
      - Al-Ghazali's *al-Munqidh* narrates his own crisis of doubt and recovery.
      - Nursi reads nature's beneficence (inayet, providence) as personal intent.
  - kind: philosophical
    tr: |
      - Tasarım ve ince ayar bir niyete işaret eder.
      - İtirazlar: ilahi gizlilik (Schellenberg) ve rakip vahiyler.
      - Cevap: gizlilik imtihanı korur, çünkü zorlayıcı işaretler imtihanı bitirirdi (6:158).
    en: |-
      - Design and fine-tuning suggest intention.
      - Objections: divine hiddenness (Schellenberg) and rival revelations.
      - Reply: hiddenness preserves the test, since compelling signs would end it (6:158).
  - kind: scientific
    tr: |
      Bkz. S9 (ince ayar).
    en: See S9.
  - kind: psychological
    tr: |
      Konya çalıştayındaki öğretmenler, ikiyüzlülüğün ve eskimiş dinî söylemin gençleri uzaklaştırdığını belirtir. Deizm çoğu zaman ahlâkî bir protestodur; bu yüzden dürüst bir cevap yalnızca argümanlara değil, dürüstlüğe de değinmelidir.
    en: Konya teachers note that hypocrisy and outdated religious discourse push young people away. Deism is often a moral protest, so an honest answer has to speak to integrity, not only to arguments.
honestLimits:
  tr: |
    Argümanlar zorunluluk değil, makuliyet verir.
  en: Arguments give plausibility, not compulsion.
visualizations:
  - id: ideas
    tr: |
      - Bir "aklın erişimi" merdiveni.
      - Gazzâlî'nin yolculuğu, kaydırmalı bir hikâye olarak.
      - İnayet işaretlerinden bir galeri.
    en: |-
      - A "reach of reason" staircase.
      - Al-Ghazali's journey as a scroll story.
      - A gallery of care-signs.
