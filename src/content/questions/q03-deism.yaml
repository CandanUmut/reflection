  - kind: psychological
    tr: |
      Konya çalıştayındaki öğretmenler, ikiyüzlülüğün ve eskimiş dinî söylemin gençleri uzaklaştırdığını belirtir. Deizm çoğu zaman ahlâkî bir protestodur; bu yüzden dürüst bir cevap yalnızca argümanlara değil, dürüstlüğe de değinmelidir.
    en: Konya teachers note that hypocrisy and outdated religious discourse push young people away. Deism is often a moral protest, so an honest answer has to speak to integrity, not only to arguments.
honestLimits:
  tr: Bir Yaratıcı lehindeki argümanlar pek çok insan için güçlüdür ama kesin değildir; SEP maddeleri her birine verilmiş ciddi cevapları kaydeder. "Bir Yaratıcı"dan "konuşan bir Yaratıcı"ya geçiş, Allah'ın hikmeti hakkında bir beklentiye dayanır; Eş'arî geleneğin kendisi bu beklentiyi aklın temellendiremeyeceğini söyler. Gizlilik argümanı açık kalmaktadır. Belirli bir vahyin hakiki olup olmadığı, insanların farklı değerlendirdiği deliller üzerinden tartılmalıdır.
  en: Arguments for a Creator are strong for many people but not decisive; the SEP entries record serious replies to each. The step from "a Creator" to "a Creator who speaks" depends on an expectation about God's wisdom that the Ashʿari tradition itself says reason cannot establish. The hiddenness argument remains open. Whether a particular revelation is genuine has to be weighed on evidence that people judge differently.
