title:
  tr: Yaratıcının dünyayla ilgilendiğine neden inanmalı (deizm)?
  en: Why believe the Creator is involved (deism)?
sensitivity: normal
helpCard: false
verses:
  - 20:50
  - 30:30
steelman:
  tr: "\"Evrenin bir sebebe ihtiyacı olduğu düşüncesini anlayabiliyorum. Ama bir İlk Sebep, yedinci yüzyıl Arabistan'ında bir adamı seçen, onun aracılığıyla bir kitap bildiren, sonra da benim dualarımı dinlemeyi bekleyen bir Tanrı değildir. Her din, Tanrı'nın *kendisiyle* konuştuğunu söylüyor; mesajlar da birbiriyle çelişiyor. Tanrı bilinmek isteseydi, kendini herkese açıkça gösterebilirdi; ama milyonlarca dürüst, açık fikirli insan O'nu hiç bulamıyor. Tanrı adına konuştuğunu söyleyenler de çoğu zaman tanıdığım en güvenilmez insanlar. O halde en dürüst tutum en küçük olanıdır: Bir Yaratıcı, evet; konuşan bir Tanrı, hayır.\""
  en: '"I can follow the argument that the universe needs a cause. But a First Cause is not a God who chooses a man in seventh-century Arabia, dictates a book through him, and then waits to hear my prayers. Every religion says God spoke to *it*, and the messages contradict each other. If God wanted to be known, He could make Himself plain to everyone, yet millions of honest, open people never find Him. And the people who claim to speak for God are often the least trustworthy people I know. So the most honest position is the smallest one: a Creator, yes; a God who speaks, no."'
whyAsked:
  tr: "Tanrı'ya inancını koruyup dini bırakan pek çok kişi, bir argümandan çok dindar insanlarda gördüklerine tepki veriyor. Başkaları aynı noktaya felsefe yoluyla varıyor: Akıl bir Yaratıcıya ulaşıyor gibi görünüyor, ama bir vahye ulaşmıyor. Türkiye'de 2018'de din öğretmenlerinin bir çalıştayı, inanç sorunları yaşayan gençler arasında deizmin öne çıktığını söyledi; bu da ülke çapında bir tartışmaya dönüştü."
  en: "Many people who keep belief in God but drop religion are reacting to what they saw in religious people, more than to an argument. Others reach the same place through philosophy: reason seems to reach a Creator but not a revelation. In Türkiye, a 2018 workshop of religion teachers named deism as prominent among young people with problems of belief, and it became a national debate."
shortAnswer:
  tr: "Deizm bir Yaratıcıyı kabul eder, ama O'nun kendini bildirdiğini ya da dünyada etkin olduğunu reddeder. Müslümanların orada durmamak için öne sürdüğü gerekçe üç adımdır. Birincisi: Düzenli ve hayata elverişli bir dünyadan çıkardığımız Yaratıcı yalnızca güçlü değil, aynı zamanda amaç sahibidir; \"neden?\" diye soran varlıkları yaratan amaç sahibi bir Yaratıcının onlara cevap vermesi için bir sebebi vardır. İkincisi: O'nun cevap verip vermediği bir delil meselesidir. Gazzâlî, bir peygamberin bir doktorun tanındığı gibi tanındığını savundu: Tek bir harikadan değil, davranışındaki ve öğretisindeki pek çok işaretin bir araya gelmesinden. Üçüncüsü: Allah'ın kısmen gizli oluşu ve dindar insanların başarısızlıkları gerçek sorunlardır, ama Allah'ın sustuğunu göstermezler. Bu adımların hiçbiri inanmaya zorlamaz. Gösterdikleri şudur: Deizm akla yatkın tek durak değildir, belki de en sağlam olanı değildir."
  en: "Deism keeps a Creator but denies that He reveals Himself or acts in the world. The Muslim case against stopping there has three steps. First, the Creator we infer from an ordered, life-permitting world is not only powerful but purposeful; a purposeful Creator of beings who ask \"why?\" has reason to answer them. Second, whether He has answered is a question of evidence, and al-Ghazali argued that a prophet is known the way a doctor is known: from many signs in his conduct and teaching taken together, not from one wonder. Third, God's partial hiddenness and the failures of religious people are real problems, but they do not show that God is silent. None of these steps compels belief. They show that deism is not the only reasonable stopping point, and perhaps not the most stable one."
