id: Q19
slugs:
  tr: mezhepler
  en: sects
order: 19
theme: sects
title:
  tr: Neden tek bir "doğru" İslam? Neden bu kadar çok mezhep var?
  en: Why one "right" Islam? Why so many sects?
sensitivity: normal
helpCard: false
verses:
  - 5:48
  - 3:103
steelman:
  tr: |
    Allah'ın mesajı açıksa, neden bölünmeler var ve her grup kendini "fırka-i nâciye" (kurtulan fırka) ilan ediyor? Ya mesaj açık değil ya da kesinlik iddiası kibirli.
  en: If God's message is clear, why the splits, each group claiming to be the "saved sect"? Either the message is unclear or the claim to certainty is arrogant.
whyAsked:
  tr: |
    "Tek doğru yol" katılığı, Yaqeen'deki en büyük tetikleyicilerden biridir. Türk gençleri rakip cemaatlerle, internetteki Selefî vaizlerle, Alevi komşularla ve laik akrabalarla karşılaşır. "73 fırka" hadisi sık sık bir silah olarak kullanılır.
  en: '"Only one right way" rigidity is a top Yaqeen trigger. Young Turks meet rival religious communities (cemaats), online Salafi preachers, Alevi neighbours and secular relatives. The "73 sects" hadith is often used as a weapon.'
shortAnswer:
  tr: |
    Bütün Müslümanlar ortak bir çekirdeği paylaşır: Allah, Peygamber, Kur'an, namaz ve âhiret. Yorum farklılıkları sahâbeden itibaren kabul gördü. 4–6 Temmuz 2005'te 50 ülkeden 200 önde gelen âlim Amman'da toplandı. Sünnî, Şiî ve İbâdî İslam'ın sekiz mezhebinin hepsinin geçerliliğini tanıdılar ve diğer Müslümanları tekfir etmeyi (kâfir ilan etmeyi) yasakladılar. Daha sonra 500'den fazla âlim bunu onayladı.
  en: "All Muslims share a core: God, the Prophet, the Quran, prayer and the afterlife. Disagreement over interpretation was accepted from the Companions onward. On 4–6 July 2005, 200 leading scholars from 50 countries met in Amman. They recognised the validity of all eight schools of Sunni, Shiʿi and Ibāḍī Islam and forbade declaring other Muslims unbelievers (*takfīr*). More than 500 scholars later endorsed this."
layers:
  - kind: religious
    tr: |
      Kur'an çeşitliliği Allah'ın planının bir parçası sayar (5:48; 11:118), ama düşmanca bölünmeyi kınar (3:103, 105; 6:159).
      - **73 fırka hadisi.** Ebû Dâvûd 4596, Elbânî tarafından *hasen sahih* sayılır. Ebû Dâvûd 4597 "72'si ateşte, biri cennette: *cemaat*" ekini taşır ve *hasen* sayılır. İbn Teymiyye 72'nin kâfir *olmadığı* görüşündeydi (Abdallah, *AFKAR* 2006). Bağdâdî'nin *el-Fark*'ı bilinen fırkaları 73 sayısına zorladı (Gömbeyaz, *ULUM* 2018).
      - **"İhtilaf rahmettir."** "*İhtilâfu ümmetî rahmetün*" sözünün bilinen bir senedi yoktur (Sübkî, Süyûtî, Elbânî) ve İbn Hazm onu kınadı. Sabit olan, Kāsım b. Muhammed'in sahâbenin ihtilafının rahmet olduğuna dair sözüdür (İbn Sa'd).
      - **Sünnî–Şiî karşılıklı tanıma.** Ezher'den Şeltût 1959'da Ca'ferî (Şiî) mezhebinin geçerli olduğuna hükmetti. Sîstânî ve Ezher Şeyhi Amman Mesajı'nı destekledi.
    en: |-
      The Quran treats diversity as part of God's plan (5:48; 11:118) but condemns hostile splitting (3:103, 105; 6:159).
      - **The 73-sects hadith.** Abū Dāwūd 4596 is graded *ḥasan ṣaḥīḥ* by al-Albānī. Abū Dāwūd 4597 adds "72 in the Fire, one in Paradise: the *jamāʿa*" and is graded *ḥasan*. Ibn Taymiyya held that the 72 are *not* unbelievers (Abdallah, *AFKAR* 2006). Al-Baghdādī's *al-Farq* forced known sects into the number 73 (Gömbeyaz, *ULUM* 2018).
      - **"Disagreement is a mercy."** "*Ikhtilāf ummatī raḥma*" has no known chain (al-Subkī, al-Suyūṭī, al-Albānī), and Ibn Ḥazm condemned it. What is attested is al-Qāsim b. Muḥammad's saying that the Companions' differences are a mercy (Ibn Saʿd).
      - **Sunni–Shiʿi recognition.** Shaltūt of al-Azhar ruled the Jaʿfarī (Shiʿi) school valid in 1959. Sistani and the Shaykh al-Azhar backed the Amman Message.
  - kind: philosophical
    tr: |
      Klasik teori kesin olanı (*kat'î*) muhtemel olandan (*zannî*) ayırır: çekirdek için kesinlik, geri kalanında tevazu. Dikkatle içtihat edip yanılan bir âlim yine de sevap alır (Buhârî 7352).
    en: "Classical theory separates the definitive (*qaṭʿī*) from the probable (*ẓannī*): certainty for the core, humility elsewhere. A scholar who reasons carefully and errs is still rewarded (Bukhārī 7352)."
  - kind: history
    tr: |
      Onlarca erken fıkıh mezhebinden dört Sünnî mezhep ile Ca'ferî, Zeydî ve İbâdî mezhepleri ayakta kaldı. Sünnî–Şiî ayrılığı 632'den sonra liderlik meselesiyle başladı. Türkiye'de Hanefî, Şâfiî, Alevi-Bektaşi ve Ca'ferî topluluklar vardır.
    en: Of dozens of early legal schools, the four Sunni schools plus the Jaʿfarī, Zaydī and Ibāḍī survived. The Sunni–Shiʿi split began over leadership after 632. Türkiye has Hanafi, Shāfiʿī, Alevi-Bektashi and Jaʿfarī communities.
  - kind: psychological
    tr: |
      Siyah-beyaz dinî düşünce kaygı ve hoşgörüsüzlükle ilişkilidir. Düşünsel tevazu gruplar arası ilişkilerin daha iyi olmasını yordar.
    en: Black-and-white religious thinking correlates with anxiety and intolerance. Intellectual humility predicts better relations between groups.
honestLimits:
  tr: |
    Her farklılık zararsız değildir ve Amman Mesajı bazı grupları (ör. Ahmedîler) dışarıda bıraktı. İki slogan da iddiasını abartır.
  en: Not every difference is harmless, and the Amman Message excluded some groups (e.g., Ahmadis). Both slogans overstate their case.
visualizations:
  - id: ideas
    tr: |
      Ortak çekirdeği gövde, mezhepleri dallar ve yerel âdetleri yapraklar olarak gösteren bir ağaç. Bir *kat'î/zannî* ayırma oyunu. Bir hadis derecelendirme kartı.
    en: A tree with the shared core as trunk, schools as branches and local customs as leaves. A *qaṭʿī/ẓannī* sorting game. A hadith grading card.
