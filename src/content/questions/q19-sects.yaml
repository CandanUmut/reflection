fullAnswer:
  - kind: heart
    en: |-
      **Being called a disbeliever by another Muslim is a serious wrong, and the scholars of the Amman Message forbade it.** They wrote that it is "not possible nor permissible to declare as apostates any group of Muslims" who believe in God and His Messenger, accept the pillars of faith and of Islam, and do not deny anything necessarily known of the religion. If you were shunned, mocked or threatened because of your school, your family's tradition, or your questions, the wrong was done to you.

      **What helps.** Find teachers who can say "this is my view, and others hold another" — the "I do not know" that al-Ghazali counted as a mark of a true scholar (see Q18). Keep friendships across lines. And remember the Quran's promise: "To Allah is your return all together, and He will [then] inform you concerning that over which you used to differ" (5:48) — not you, and not the person who excluded you.
    tr: |-
      **Başka bir Müslüman tarafından kâfir ilan edilmek ciddi bir haksızlıktır ve Amman Mesajı'nın âlimleri bunu yasakladı.** Allah'a ve Resulü'ne inanan, iman ve İslam'ın şartlarını kabul eden ve dinden zorunlu olarak bilinen hiçbir şeyi inkâr etmeyen "herhangi bir Müslüman grubunu mürted ilan etmenin ne mümkün ne de caiz olduğunu" yazdılar. Mezhebin, ailenin geleneği ya da soruların yüzünden dışlandıysan, alay edildiysen ya da tehdit edildiysen, haksızlık sana yapıldı.

      **Ne yardımcı olur?** "Bu benim görüşüm, başkaları başka bir görüş savunuyor" diyebilen hocalar bul — Gazzâlî'nin gerçek bir âlimin alameti saydığı "bilmiyorum" (bkz. Q18). Farklı çizgilerin ötesinde arkadaşlıkları sürdür. Ve Kur'an'ın vaadini hatırla: "Hepinizin dönüşü Allah'adır. O, ihtilafa düştüğünüz şeyleri size haber verir." (5:48) — ne sen ne de seni dışlayan kişi.
    title:
      en: Yanlış grupta olduğun söylendiyse
      tr: Yanlış grupta olduğun söylendiyse
  - kind: quran
    en: |-
      **Diversity as part of the plan (5:48).** "To each of you We prescribed a law and a method. Had Allah willed, He would have made you one nation [united in religion], but [He intended] to test you in what He has given you; so race to [all that is] good. To Allah is your return all together, and He will [then] inform you concerning that over which you used to differ" (5:48), Medinan. It comes after verses on the Torah and the Gospel; "To each of you" refers to the communities given scripture, which commentators generally take to include the Muslims (no tafsir on this was checked). It is about different communities with different laws; applying it to schools within Islam is an extension.

      **Unity commanded (3:103).** "And hold firmly to the rope of Allah all together and do not become divided. And remember the favor of Allah upon you - when you were enemies and He brought your hearts together and you became, by His favor, brothers" (3:103), Medinan, addressed to the believers of Medina, whose tribes had been at war.

      **A warning (3:105).** "And do not be like the ones who became divided and differed after the clear proofs had come to them. And those will have a great punishment" (3:105). Al-Jalālayn: "these are the Jews and the Christians". The *Mukhtasar* (a modern summary commentary): "Do not be, O believers, like the People of the Scripture who became divided into different groups and divisions".

      **What these verses say together.** Different paths of law can be part of God's test (5:48); hostile division after clear guidance is condemned (3:103, 105). The line runs between difference and division.
    tr: |-
      **Planın bir parçası olarak çeşitlilik (5:48).** "Biz, herbiriniz için bir şeriat ve yol belirledik. Eğer Allah dileseydi sizi tek bir ümmet yapardı, fakat size verdiklerinde sizi denemek istedi. Öyleyse iyiliklere koşun. Hepinizin dönüşü Allah'adır. O, ihtilafa düştüğünüz şeyleri size haber verir." (5:48), Medenî. Tevrat ve İncil hakkındaki âyetlerden sonra gelir; "herbiriniz" kitap verilen toplulukları ifade eder ve müfessirler genellikle Müslümanları da buna dahil sayar (bu konuda hiçbir tefsir kontrol edilmedi). Âyet farklı hukukları olan farklı topluluklarla ilgilidir; onu İslam içindeki mezheplere uygulamak bir genişletmedir.

      **Emredilen birlik (3:103).** "Hep birlikte Allah'ın ipine (kitabına, dinine) sımsıkı sarılın. Parçalanıp ayrılmayın. Allah'ın üzerinizdeki nimetini düşünün. Hani siz birbirinize düşmanlar idiniz de, O, kalplerinizi birleştirmişti. İşte O'nun (bu) nimeti sayesinde kardeşler olmuştunuz." (3:103), Medenî; kabileleri savaş hâlinde olmuş Medineli müminlere hitap eder.

      **Bir uyarı (3:105).** "Kendilerine apaçık deliller geldikten sonra parçalanıp ayrılığa düşenler gibi olmayın. İşte bunlar için büyük bir azap vardır" (3:105). *Celâleyn*: "Bunlar Yahudiler ve Hristiyanlardır." *Muhtasar* (modern bir özet tefsir): "Ey müminler, farklı gruplara ve fırkalara bölünen Ehl-i Kitap gibi olmayın".

      **Bu âyetler birlikte ne söyler?** Farklı hukuk yolları Allah'ın imtihanının bir parçası olabilir (5:48); açık hidayetten sonra düşmanca bölünme kınanır (3:103, 105). Çizgi farklılık ile bölünme arasından geçer.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: |-
      **The hadith.** Abu Hurayra (ra) reports: "my community will be split up into seventy-three sects" ({hadith:abudawud:4596}; al-Albani: *ḥasan ṣaḥīḥ*). In Muʿawiya's (ra) version, "seventy two of them will go to Hell and one of them will go to Paradise, and it is the majority group" — the Arabic word is *al-jamāʿa* ({hadith:abudawud:4597}; al-Albani: *ḥasan*). Ibn Kathir cites Muʿawiya's version from Imam Ahmad: "This Ummah will divide into seventy-three sects, all in the Fire except one, that is, the Jama'ah."

      **Which group is the *jamāʿa*, and does it mean you?** The hadith's own word is *al-jamāʿa*, "the community", which the sunnah.com translator renders "the majority group". It is not the name of a small sect, and nothing in the hadith says any particular modern group is the saved one.

      **Honest error is rewarded.** ʿAmr ibn al-ʿAs (ra) reports the Prophet (pbuh): a judge who rules carefully and is correct "will receive a double reward", and if wrong, a single reward ({hadith:bukhari:7352}). Careful reasoning that reaches different answers is not sin.

      Ibn Taymiyya (d. 1328) rejected reading the hadith as a verdict of unbelief on the 72: the claim that all the sects are unbelievers, he wrote, "was only said by some later scholars", while the early generations and the imams did not declare the Murjiʾa or the Shiʿa unbelievers (*Majmūʿ al-Fatāwā* 3/351). S. S. Abdallah summarises his position: "He warns against summary excommunication of any Muslim groups, as long as they still profess the teachings of Islam" (*Afkar*, 2006).

      He did not excuse everyone: some innovators, he wrote, are hidden heretics and so unbelievers, but others "have strong Iman" and "are neither hypocrites nor infidels" (trans. Abdallah, 2006).

      Al-Baghdadi (d. 1037) built his *al-Farq bayna al-firaq*, the main source for later books on sects, around this hadith, starting from its first chapter (Abdallah, 2006).
    tr: |-
      **Hadis.** Ebû Hüreyre (r.a.) şöyle aktarır: "Ümmetim yetmiş üç fırkaya ayrılacak" ({hadith:abudawud:4596}; Elbânî: *hasen sahih*). Muâviye'nin (r.a.) versiyonunda, "bunlardan yetmiş ikisi cehenneme, biri cennete gidecek ve o da çoğunluk grubudur" — Arapça kelime *el-cemâa*dır ({hadith:abudawud:4597}; Elbânî: *hasen*). İbn Kesîr Muâviye'nin versiyonunu İmam Ahmed'den zikreder: "Bu ümmet yetmiş üç fırkaya ayrılacak; biri dışında hepsi ateştedir, o da cemaattir."

      ***Cemaat* hangi gruptur ve beni mi kastediyor?** Hadisin kendi kelimesi *el-cemâa*, "topluluk"tur; sunnah.com çevirmeni bunu "çoğunluk grubu" olarak verir. Küçük bir fırkanın adı değildir ve hadiste belirli bir modern grubun kurtulan grup olduğunu söyleyen hiçbir şey yoktur.

      **Dürüst hata sevap kazandırır.** Amr b. Âs (r.a.), Hz. Peygamber'in (s.a.v.) şöyle buyurduğunu aktarır: Dikkatle hüküm veren ve isabet eden bir hâkim "iki kat sevap alır", yanılırsa tek sevap ({hadith:bukhari:7352}). Farklı cevaplara ulaşan dikkatli akıl yürütme günah değildir.
    title:
      en: 73 fırka hadisi ve dürüst hatanın sevabı
      tr: 73 fırka hadisi ve dürüst hatanın sevabı
  - kind: scholars
    en: |-
      **What it is.** In July 2005, King Abdullah II of Jordan "convened an international Islamic conference of 200 of the world's leading Islamic scholars" from 50 countries in Amman; "over 500 leading Muslim scholars worldwide" later endorsed its Three Points (ammanmessage.com).

      **The eight schools.** The statement lists: "the four Sunni schools (Mathahib) of Islamic jurisprudence (Hanafi, Maliki, Shafi'i and Hanbali)", "the two Shi'i schools of Islamic jurisprudence (Jafari and Zaydi)", and "the Ibadi school of Islamic jurisprudence and the Thahiri school of Islamic jurisprudence".

      **Theology, Sufism and Salafism.** It is "not possible nor permissible to declare whosoever subscribes to the Ash'ari creed or whoever practices real Tasawwuf (Sufism) an apostate", and "Likewise… whosoever subscribes to true Salafi thought".

      **The other two points.** It forbids *takfīr* (declaring Muslims apostates), and it holds that "no one may issue a fatwa without the requisite personal qualifications". The King's speech to the OIC summit in Mecca (December 2005) adds: "there exists more in common between the various schools of Islamic jurisprudence than there is difference between them."

      **Its limits.** Rabbani stresses that the Message "should not be promoted as making Islam a 'free-for-all'" and is "not an affirmation that 'everyone is on the complete truth'"; it recognises groups as Muslim, not every view as correct. It did not list the Ahmadis. Whether it has changed behaviour on the ground — in sectarian conflicts in Iraq, Syria or Pakistan — is not something the sources read could measure.

      **Earlier recognition.** In 1959 Mahmud Shaltut, rector of al-Azhar, issued a fatwa that the Jaʿfari (Shiʿi) school "is a school of thought that is religiously correct to follow in worship as are other Sunni schools of thought" (text as published by al-islam.org).
    tr: |-
      **Nedir?** Temmuz 2005'te Ürdün Kralı II. Abdullah, 50 ülkeden "dünyanın önde gelen 200 İslam âliminin katıldığı uluslararası bir İslam konferansı topladı"; "dünya genelinde 500'den fazla önde gelen Müslüman âlim" daha sonra onun Üç Maddesini onayladı (ammanmessage.com).

      **Sekiz mezhep.** Bildiri şunları sayar: "dört Sünnî fıkıh mezhebi (Hanefî, Mâlikî, Şâfiî ve Hanbelî)", "iki Şiî fıkıh mezhebi (Caferî ve Zeydî)" ve "İbâdî fıkıh mezhebi ile Zâhirî fıkıh mezhebi".

      **Kelâm, tasavvuf ve Selefîlik.** "Eş'arî akidesine bağlı olan ya da hakiki tasavvufu uygulayan kimseyi mürted ilan etmek ne mümkün ne de caizdir" ve "aynı şekilde… hakiki Selefî düşünceye bağlı olan kimseyi" de.

      **Diğer iki madde.** Tekfiri (Müslümanları mürted ilan etmeyi) yasaklar ve "gerekli şahsi niteliklere sahip olmayan hiç kimsenin fetva veremeyeceğini" kabul eder. Kral'ın Mekke'deki İİT zirvesinde (Aralık 2005) yaptığı konuşma şunu ekler: "Çeşitli fıkıh mezhepleri arasında farklılıktan çok ortak nokta vardır."

      **Sınırları.** Rabbani, Mesaj'ın "İslam'ı 'herkesin istediğini yaptığı' bir şey hâline getiriyormuş gibi tanıtılmaması gerektiğini" ve onun "'herkesin tam bir hakikat üzerinde olduğunun' bir onayı olmadığını" vurgular; grupları Müslüman olarak tanır, her görüşü doğru olarak değil. Ahmedîleri listelemedi. Sahada — Irak'taki, Suriye'deki ya da Pakistan'daki mezhep çatışmalarında — davranışı değiştirip değiştirmediği, okunan kaynakların ölçebildiği bir şey değil.

      **Daha önceki tanıma.** Ezher şeyhi Mahmûd Şeltût, "Şiî İslam hukukunu beşinci İslam hukuku mezhebi olarak tanıyan" bir fetva verdi (okunan kaynakta tarihi verilmemiş; 1959'da Ezher ayrıca "Şiî fıkhı derslerinin öğretilmesine izin verdi") (*Wikipedia*, "Shia–Sunni relations").
    title:
      en: Amman Mesajı
      tr: Amman Mesajı
  - kind: history
    en: |-
      **Sunnis and Shiʿis.** "The issue of succession following the death of Muhammad divided Muslims into two branches." Shiʿis hold that the Prophet (pbuh) designated ʿAli (citing Ghadir Khumm) and that leadership belongs to his family; Sunnis hold that he named no successor and that Abu Bakr was chosen at the Saqifa. The killing of Husayn at Karbala "finalized the schism" (*Wikipedia*). Other differences: Shiʿis count sayings of the Prophet's family (*Ahl al-Bayt*) as hadith and reject many Sunni-only hadith; Twelver Shiʿis permit temporary marriage (*mutʿa*), which Sunnis, Ismailis and Zaydis do not; and there are differences in prayer (Shiʿis prostrate on a clay tablet; Shiʿis and Malikis pray with hands at their sides) (*Wikipedia*).

      **Is imamate a core belief?** For Twelver Shiʿis, yes: the leadership of the Imams is a doctrine, not only a historical question. That is a real difference at the level of belief, not only of law, and this page does not hide it. What the Amman Message affirms is that both groups share the pillars of faith and of Islam and so may not declare each other apostates; it does not claim they agree on imamate.

      **Alevis.** Alevis are mainly in Türkiye, where estimates range from about 4% to 15% of the population. They revere ʿAli and the Twelve Imams; their central ritual is the *cem*, a gathering with music and both men and women, led by a *dede*; they fast in the first twelve days of Muharram. Most belong to the Bektashi tradition. They are usually classed with Shiʿism, but their practice differs considerably from Twelver practice; some groups follow Jaʿfari law (*Wikipedia*). The Turkish state recognised Alevism as a "cultural group" in 2022, and President Erdoğan has said a cemevi "is not a place of worship" (*Wikipedia*). Alevis are not named separately among the eight Amman schools; those Alevis who follow Jaʿfari law fall under it, and the Message's general rule against *takfīr* covers all who accept the pillars of faith and Islam.

      **Ibadis.** Ibadis call themselves "The People of Truth and Integrity" and "may object to being classified as Kharijites"; their community grew from the teachings of Jabir ibn Zayd in Basra. Their largest community is in Oman (Wikipedia gives conflicting figures on whether they are a majority there), and they live also in the M'zab (Algeria), Djerba (Tunisia), Libya and Zanzibar. They hold that the imam should be elected, "the most pious man of the community", and need not be from Quraysh; that believers "will not see God on the Day of Resurrection"; and some hold the Quran created (*Wikipedia*). They are among the Amman schools.

      **Ahmadis.** The Ahmadiyya were "founded by Mirza Ghulam Ahmad (1835–1908)" in British India; Ahmadis regard him as "divinely appointed as both the promised Messiah and Mahdi" and as a prophet without a new law — in Wikipedia's words, "a true reflection of Muhammad's prophethood". Mainstream Muslims regard this as heresy because they believe Muhammad (pbuh) was the "final prophet" (*khātam al-nabiyyīn*). In 1974 Pakistan amended its constitution so that anyone who does not accept that Muhammad (pbuh) is the final prophet "is not a Muslim for the purposes of the Constitution or law", naming the Ahmadis (Second Amendment, 1974, Arts. 106 and 260). The Amman Message does not list them; the pages read do not mention them or give a reason. Whatever one's view, it is a core-level dispute, not a difference of law.
    tr: |-
      **Sünnîler ve Şiîler.** "Muhammed'in vefatından sonraki halefiyet meselesi Müslümanları iki kola ayırdı." Şiîler, Hz. Peygamber'in (s.a.v.) Hz. Ali'yi tayin ettiğini (Gadîr-i Hum'u zikrederek) ve önderliğin onun ailesine ait olduğunu savunur; Sünnîler ise onun hiçbir halef tayin etmediğini ve Hz. Ebû Bekir'in Sakîfe'de seçildiğini savunur. Hz. Hüseyin'in Kerbelâ'da öldürülmesi "ayrılığı kesinleştirdi" (*Wikipedia*). Diğer farklar: Şiîler Hz. Peygamber'in ailesinin (*Ehl-i Beyt*) sözlerini hadis sayar ve yalnızca Sünnîlerce kabul edilen pek çok hadisi reddeder; İsnâaşerî Şiîler, Sünnîlerin, İsmâilîlerin ve Zeydîlerin kabul etmediği geçici nikâha (*mut'a*) izin verir; ve namazda farklar vardır (Şiîler kilden bir taş üzerine secde eder; Şiîler ve Mâlikîler elleri yanlarda namaz kılar) (*Wikipedia*).

      **İmamet bir öz inanç mı?** İsnâaşerî Şiîler için evet: İmamların önderliği yalnızca tarihî bir soru değil, bir akidedir. Bu yalnızca hukuk düzeyinde değil, inanç düzeyinde gerçek bir farktır ve bu sayfa onu gizlemiyor. Amman Mesajı'nın teyit ettiği şey, iki grubun iman ve İslam'ın şartlarını paylaştığı ve dolayısıyla birbirlerini mürted ilan edemeyecekleridir; imamet konusunda hemfikir olduklarını iddia etmez.

      **Aleviler.** Aleviler esas olarak Türkiye'dedir; tahminler nüfusun yaklaşık %4'ü ile %15'i arasında değişir. Hz. Ali'ye ve On İki İmam'a hürmet ederler; temel ibadetleri, müziğin ve hem erkeklerin hem kadınların bulunduğu, bir *dede*nin yönettiği bir toplantı olan *cem*dir; Muharrem'in ilk on iki gününde oruç tutarlar. Çoğu Bektaşî geleneğine mensuptur. Genellikle Şiîlik içinde sınıflandırılırlar, ama uygulamaları İsnâaşerî uygulamasından önemli ölçüde farklıdır; bazı gruplar Caferî fıkhını izler (*Wikipedia*). Türk devleti 2022'de Aleviliği bir "kültürel grup" olarak tanıdı ve Cumhurbaşkanı Erdoğan cemevinin "bir ibadet yeri olmadığını" söyledi (*Wikipedia*). Aleviler sekiz Amman mezhebi arasında ayrıca adlandırılmıyor; Caferî fıkhını izleyen Aleviler onun kapsamına girer ve Mesaj'ın tekfire karşı genel kuralı iman ve İslam'ın şartlarını kabul eden herkesi kapsar.

      **İbâdîler.** İbâdîler kendilerine "Hak ve Doğruluk Ehli" der ve "Hâricî olarak sınıflandırılmaya itiraz edebilirler"; toplulukları Basra'da Câbir b. Zeyd'in öğretilerinden doğdu. En büyük toplulukları Umman'dadır (Wikipedia orada çoğunluk olup olmadıkları konusunda çelişkili rakamlar veriyor) ve ayrıca Mzab'da (Cezayir), Cerbe'de (Tunus), Libya'da ve Zengibar'da yaşarlar. İmamın seçilmesi gerektiğini, "topluluğun en takvalı adamı" olması gerektiğini ve Kureyş'ten olmasının gerekmediğini; müminlerin "Kıyamet Günü'nde Allah'ı görmeyeceğini" savunurlar; bazıları da Kur'an'ın mahluk olduğunu savunur (*Wikipedia*). Amman mezhepleri arasındadırlar.

      **Ahmedîler.** Ahmediyye, Britanya Hindistanı'nda "Mirza Gulam Ahmed (1835–1908) tarafından kuruldu"; Ahmedîler onu "hem vaat edilen Mesih hem de Mehdi olarak ilahi olarak tayin edilmiş" ve yeni bir şeriat getirmeyen bir peygamber olarak görür — Wikipedia'nın ifadesiyle "Muhammed'in peygamberliğinin gerçek bir yansıması". Ana akım Müslümanlar bunu sapkınlık olarak görür, çünkü Hz. Muhammed'in (s.a.v.) "son peygamber" (*hâtemü'n-nebiyyîn*) olduğuna inanırlar; Pakistan bir anayasa değişikliğiyle onları "resmen" "gayrimüslim" ilan etti (*Wikipedia*). Amman Mesajı onları listelemiyor; okunan sayfalar onlardan söz etmiyor ya da bir sebep vermiyor. Kişinin görüşü ne olursa olsun, bu bir hukuk farkı değil, öz düzeyinde bir anlaşmazlıktır.
    title:
      en: Ana gruplar neye inanır ve nerede ayrılır?
      tr: Ana gruplar neye inanır ve nerede ayrılır?
  - kind: reasoning
    en: |-
      **What is shared.** Belief in one God; Muhammad (pbuh) as His Messenger; the Quran; prayer, fasting, almsgiving and pilgrimage; the Last Day. The Amman Message's rule is built on exactly this: it protects those "who believe in God, Glorified and Exalted be He, and His Messenger… and the pillars of faith, and acknowledges the five pillars of Islam, and does not deny any necessarily self-evident tenet of religion".

      **Where the core is disputed.** Two places: whether there can be a prophet after Muhammad (pbuh) (the Ahmadi question), and how leadership after him is to be understood (imamate). The first, on the mainstream view, is outside the core; the second is a real difference that the Message chose not to treat as grounds for *takfīr*.

      **The two slogans.** The first overstates by making every difference good; the second by turning the 73-sects hadith into a licence to condemn other Muslims, when the hadith's own word for the saved is *al-jamāʿa*, the community.

      *Limit:* a shared core does not make the remaining differences trivial. Centuries of violence show that they can be lethal when mixed with politics.

      The saying "Disagreement in my community is a mercy" is not an established hadith: al-Sakhawi reported that "many imams held that it has no basis", and al-Bayhaqi cited it without a chain (as gathered by Rashid Rida).
    tr: |-
      **Ortak olan nedir?** Tek bir Allah'a iman; Hz. Muhammed (s.a.v.) O'nun Resulü olarak; Kur'an; namaz, oruç, zekât ve hac; Son Gün. Amman Mesajı'nın kuralı tam olarak bunun üzerine kuruludur: "Allah'a — Sübhânehû ve Teâlâ — ve Resulü'ne… ve imanın şartlarına inanan, İslam'ın beş şartını kabul eden ve dinin zorunlu olarak bilinen hiçbir esasını inkâr etmeyen" kimseleri korur.

      **Özün tartışmalı olduğu yerler.** İki yer: Hz. Muhammed'den (s.a.v.) sonra bir peygamber olup olamayacağı (Ahmedî sorusu) ve ondan sonraki önderliğin nasıl anlaşılacağı (imamet). Birincisi, ana akım görüşe göre özün dışındadır; ikincisi, Mesaj'ın tekfir için gerekçe saymamayı seçtiği gerçek bir farktır.

      **İki slogan.** Birincisi her farkı iyi sayarak abartır; ikincisi 73 fırka hadisini başka Müslümanları kınamak için bir izne dönüştürerek abartır, oysa hadisin kurtulanlar için kullandığı kelime *el-cemâa*, yani topluluktur.

      *Sınır:* Ortak bir öz, geri kalan farkları önemsiz kılmaz. Yüzyıllarca süren şiddet, siyasetle karıştıklarında bunların ölümcül olabileceğini gösteriyor.
    title:
      en: Ortak bir öz var mı?
      tr: Ortak bir öz var mı?
  - kind: science
    en: "**Intellectual humility.** [Moderate; US samples] Across four studies (181 students; 188 and 169 adults online; 104 students in an experiment), Porter and Schumann (2018) found that people higher in intellectual humility \"were more open to learning about the opposition's views\", gave more respectful reasons for disagreement, and in one study read more of the opposing arguments; an article teaching a growth mindset raised intellectual humility (Heterodox Academy summary; effect sizes were not given in the summary read)."
    tr: '**Entelektüel tevazu.** [Orta; ABD örneklemleri] Dört çalışmada (181 öğrenci; internette 188 ve 169 yetişkin; bir deneyde 104 öğrenci), Porter ve Schumann (2018), entelektüel tevazusu daha yüksek olan insanların "karşı tarafın görüşlerini öğrenmeye daha açık olduğunu", anlaşmazlık için daha saygılı gerekçeler verdiğini ve bir çalışmada karşıt argümanları daha fazla okuduğunu buldu; gelişim zihniyetini öğreten bir makale entelektüel tevazuyu artırdı (Heterodox Academy özeti; okunan özette etki büyüklükleri verilmemişti).'
    title:
      en: Araştırmalar ne gösteriyor?
      tr: Araştırmalar ne gösteriyor?
  - kind: objection
    en: |-
      **"If the message were clear, there would be no sects."** *Reply:* the core is clear and shared by almost all Muslims; most disagreement is about interpretation, which the tradition expected; Bukhari 7352 rewards a judge's careful reasoning even when wrong, and applying it to scholarly disagreement in general is an extension of that hadith. *Limit:* the imamate and finality-of-prophethood disputes are not just interpretation.

      **"Each group claims to be the saved sect, so all are arrogant."** *Reply:* the hadith names "the *jamāʿa*", the community, not a sect; the Amman Message forbids declaring other Muslims apostates. *Limit:* many groups still read the hadith exclusively.

      **"Sunnis and Shiʿis killed each other for centuries."** *Reply:* yes, often when sectarian identity was fused with dynastic or state power (from Karbala to modern Iraq and Syria, per *Wikipedia*). Among the senior scholars whose rulings the Amman Message gathered was the Shiʿi authority Ayatollah Sistani (ammanmessage.com). *Limit:* recognition on paper has not ended conflict.
    tr: |-
      **"Mesaj açık olsaydı fırkalar olmazdı."** *Cevap:* Öz açıktır ve neredeyse bütün Müslümanlar tarafından paylaşılır; anlaşmazlıkların çoğu, geleneğin beklediği yorumla ilgilidir; Buhârî 7352 bir hâkimin dikkatli akıl yürütmesini yanılsa bile ödüllendirir ve bunu genel olarak ilmî anlaşmazlığa uygulamak o hadisin bir genişletmesidir. *Sınır:* İmamet ve son peygamberlik anlaşmazlıkları sadece yorum değildir.

      **"Her grup kurtulan fırka olduğunu iddia ediyor, öyleyse hepsi kibirli."** *Cevap:* Hadis bir fırkayı değil, "*cemaati*", topluluğu anar; Amman Mesajı başka Müslümanları mürted ilan etmeyi yasaklar. *Sınır:* Pek çok grup hâlâ hadisi dışlayıcı bir şekilde okuyor.

      **"Sünnîler ve Şiîler yüzyıllarca birbirlerini öldürdü."** *Cevap:* Evet, çoğu zaman mezhep kimliği hanedan ya da devlet gücüyle kaynaştığında (Kerbelâ'dan modern Irak ve Suriye'ye, *Wikipedia*'ya göre). Âlimler de tanınma için çalıştı: Sünnî taraftan Şeltût'un fetvası ve iki Şiî mezhebini tanıyan Amman Mesajı (Şiî âlimlerin onu imzalayıp imzalamadığı okunan kaynaklarda henüz kontrol edilmedi). *Sınır:* Kâğıt üzerindeki tanınma çatışmayı sona erdirmedi.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **Amman Message signatories** — eight schools, Ashʿari creed, Sufism and "true Salafi thought" are all within Islam; *takfīr* forbidden.
      - **Twelver Shiʿis** — imamate is a doctrine of faith.
      - **Ahmadis** — accept Mirza Ghulam Ahmad as a non-law-bearing prophet; regarded by mainstream Muslims as outside Islam.
      - **Alevis** — a Türkiye-centred tradition revering ʿAli and the Imams, with its own rituals.
    tr: |-
      - **Amman Mesajı'nı imzalayanlar** — sekiz mezhep, Eş'arî akidesi, tasavvuf ve "hakiki Selefî düşünce" İslam'ın içindedir; tekfir yasaktır.
      - **İsnâaşerî Şiîler** — imamet bir iman esasıdır.
      - **Ahmedîler** — Mirza Gulam Ahmed'i şeriat getirmeyen bir peygamber olarak kabul eder; ana akım Müslümanlar tarafından İslam'ın dışında sayılır.
      - **Aleviler** — Hz. Ali'ye ve İmamlara hürmet eden, kendi ibadetleri olan, Türkiye merkezli bir gelenek.
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: If the core is so clear, why did Sunnis and Shiʿis fight over it for centuries? Is imamate not a core belief?
      tr: Öz bu kadar açıksa, Sünnîler ve Şiîler neden yüzyıllarca onun için savaştı? İmamet bir öz inanç değil mi?
    a:
      en: For Twelver Shiʿis it is a core belief; that is a real difference. The fighting was often bound up with political power. The Amman Message's answer is that, sharing the pillars, neither may declare the other apostate — not that they agree.
      tr: İsnâaşerî Şiîler için bir öz inançtır; bu gerçek bir farktır. Savaşlar çoğu zaman siyasi güçle iç içeydi. Amman Mesajı'nın cevabı, şartları paylaştıkları için hiçbirinin diğerini mürted ilan edemeyeceğidir — hemfikir oldukları değil.
  - q:
      en: Which group is the "*jamāʿa*" in the 73-sects hadith, and does it mean me?
      tr: 73 fırka hadisindeki "*cemaat*" hangi gruptur ve beni mi kastediyor?
    a:
      en: The hadith's word is *al-jamāʿa*, the community or "the majority group" ({hadith:abudawud:4597}). It does not name any modern sect.
      tr: Hadisin kelimesi *el-cemâa*, topluluk ya da "çoğunluk grubu"dur ({hadith:abudawud:4597}). Hiçbir modern fırkayı adlandırmaz.
  - q:
      en: What are the "two slogans" that "both overstate their case"?
      tr: '"İkisi de abartan" "iki slogan" nedir?'
    a:
      en: '"Disagreement is a mercy" (no known chain) and "only one sect is saved, so the rest are lost". See "Is there a shared core?".'
      tr: '"İhtilaf rahmettir" (bilinen bir senedi yok) ve "yalnızca bir fırka kurtulur, öyleyse geri kalanlar kaybolmuştur". Bkz. "Ortak bir öz var mı?".'
  - q:
      en: What do Sunnis and Shiʿis actually disagree about, beyond "leadership after 632"?
      tr: Sünnîler ve Şiîler "632'den sonraki önderliğin" ötesinde gerçekte neyde ayrılıyor?
    a:
      en: Imamate as doctrine; which hadith are accepted; temporary marriage; details of prayer (*Wikipedia*).
      tr: Akide olarak imamet; hangi hadislerin kabul edildiği; geçici nikâh; namaz ayrıntıları (*Wikipedia*).
  - q:
      en: Who are the Alevis, and are they counted among the eight schools?
      tr: Aleviler kimdir ve sekiz mezhep arasında sayılıyorlar mı?
    a:
      en: A Türkiye-centred tradition revering ʿAli and the Twelve Imams, with the *cem* ritual. Not named separately; those following Jaʿfari law fall under it, and the rule against *takfīr* covers all who accept the pillars.
      tr: Hz. Ali'ye ve On İki İmam'a hürmet eden, *cem* ibadeti olan Türkiye merkezli bir gelenek. Ayrıca adlandırılmıyorlar; Caferî fıkhını izleyenler onun kapsamına girer ve tekfire karşı kural şartları kabul eden herkesi kapsar.
  - q:
      en: What are the Ibadis, and why were Ahmadis excluded?
      tr: İbâdîler kimdir ve Ahmedîler neden dışarıda bırakıldı?
    a:
      en: "Ibadis: a school centred in Oman, with its own views on the imamate; included in Amman. Ahmadis: the Amman Message does not list them. Separately, mainstream Muslims regard them as outside Islam because they hold that no prophet comes after Muhammad (pbuh)."
      tr: "İbâdîler: imamet konusunda kendi görüşleri olan, Umman merkezli bir mezhep; Amman'a dahil edildi. Ahmedîler: Amman Mesajı onları listelemiyor. Ayrıca ana akım Müslümanlar, Hz. Muhammed'den (s.a.v.) sonra hiçbir peygamber gelmeyeceğine inandıkları için onları İslam'ın dışında görür."
