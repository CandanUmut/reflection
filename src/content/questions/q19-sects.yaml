theme: sects
title:
  tr: Neden tek bir "doğru" İslam? Neden bu kadar çok mezhep var?
  en: Why one "right" Islam? Why so many sects?
sensitivity: normal
helpCard: false
verses:
  - 5:48
  - 3:103
steelman:
  tr: "\"Allah'ın mesajı açıksa, Müslümanlar neden Sünnîlere, Şiîlere, İbâdîlere, Alevilere ve daha fazlasına bölündü — ve neden her grup meşhur hadisteki tek 'kurtulan fırka' olduğunu iddia ediyor? Ya mesaj açık değil ya da kesinlik iddiası kibirdir. Ve anlaşmazlıklar küçük değil: Sünnîler ve Şiîler Peygamber'den (s.a.v.) sonra kimin önderlik edeceği konusunda yüzyıllarca savaştı ve bazı gruplar ondan sonra bir peygamber geldiğini söylüyor. 'Ortak bir öz' olduğunu nasıl söyleyebilirsin?\""
  en: "\"If God's message is clear, why have Muslims split into Sunnis, Shiʿis, Ibadis, Alevis and more — and why does each group claim to be the one 'saved sect' of the famous hadith? Either the message is unclear, or the claim to certainty is arrogance. And the disagreements are not small: Sunnis and Shiʿis fought for centuries over who should lead after the Prophet (pbuh), and some groups say there was a prophet after him. How can you say there is a 'shared core'?\""
whyAsked:
  tr: "Çünkü \"tek bir doğru yol\" katılığı, Chouhoud'un anketinde şüpheyi tetikleyen başlıca etkendir: \"[bazılarının] dini yaşamanın yalnızca tek bir 'doğru' yolu olduğunda ısrar etmesi\" (Yaqeen, 2018). Türkiye'deki gençler rakip dinî topluluklarla (*cemaat*lerle), başka Müslümanları kınayan internet vaizleriyle, Alevi komşularla ve seküler akrabalarla karşılaşıyor. \"73 fırka\" hadisi çoğu zaman bir silah olarak kullanılıyor."
  en: "Because \"only one right way\" rigidity is the leading trigger of doubt in Chouhoud's survey: \"The way that [some] insist there is only one 'right' way to practice faith\" (Yaqeen, 2018). Young Turks meet rival religious communities (*cemaat*s), online preachers who condemn other Muslims, Alevi neighbours and secular relatives. The \"73 sects\" hadith is often used as a weapon."
shortAnswer:
  tr: "Müslümanlar arasındaki anlaşmazlık gerçektir ve bir kısmı derindir. Ama çoğu ortak bir öz içindeki yorumla ilgilidir ve gelenek onunla yaşamak için araçlar geliştirdi. Kur'an hukukların çeşitliliğini Allah'ın planının bir parçası olarak görür — \"Biz, herbiriniz için bir şeriat ve yol belirledik.\" (5:48) — ve düşman kamplara bölünmeyi kınar: \"Parçalanıp ayrılmayın.\" (3:103). Hz. Peygamber (s.a.v.), dikkatli bir hüküm veren ve isabet eden bir hâkimin iki kat sevap, yanılırsa tek sevap alacağını söyledi ({hadith:bukhari:7352}). 2005'te Amman Mesajı — 50 ülkeden 200 âlimin katıldığı ve daha sonra 500'den fazla âlimin onayladığı bir konferanstan çıkan — sekiz fıkıh mezhebini (dört Sünnî, iki Şiî, İbâdî ve Zâhirî), Eş'arî akidesini, \"hakiki tasavvufu\" ve \"hakiki Selefî düşünceyi\" tanıdı ve bunlardan herhangi birini mürted ilan etmeyi yasakladı. Öz düzeyindeki anlaşmazlıklar gerçektir ve bu sayfa onları ortaya koyuyor: kimin önderlik edeceğine dair Sünnî–Şiî sorusu, ki bu bir akide sorusuna dönüştü; ve ana akım Müslümanların reddettiği, Hz. Muhammed'den (s.a.v.) sonra bir peygamber geldiğine dair Ahmedî inancı. 73 fırka hadisi kabul edilebilir olarak derecelendirilmiştir (Ebû Dâvûd 4596: *hasen sahih*; 4597: *hasen*; ikisi de Elbânî) ve daha tam versiyonu (4597, *hasen* olan) kurtulan grubun küçük bir fırka değil, \"*cemaat*\" — ana gövde — olduğunu söyler."
  en: "Disagreement among Muslims is real, and some of it is deep. But most of it is about interpretation within a shared core, and the tradition built tools for living with it. The Quran treats diversity of laws as part of God's plan — \"To each of you We prescribed a law and a method\" (5:48) — while condemning division into hostile camps: \"do not become divided\" (3:103). The Prophet (pbuh) said that a judge who makes a careful judgement and is right gets a double reward, and if wrong, a single reward ({hadith:bukhari:7352}). In 2005, the Amman Message — from a conference of 200 scholars from 50 countries, later endorsed by over 500 — recognised eight schools of law (four Sunni, two Shiʿi, the Ibadi and the Zahiri), the Ashʿari creed, \"real Tasawwuf (Sufism)\" and \"true Salafi thought\", and forbade declaring any of them apostates. The core-level disputes are real, and this page states them: the Sunni–Shiʿi question of who should lead, which became a question of doctrine; and the Ahmadi belief in a prophet after Muhammad (pbuh), which mainstream Muslims reject. The 73-sects hadith is graded acceptable (Abu Dawud 4596: *ḥasan ṣaḥīḥ*; 4597: *ḥasan*; both al-Albani), and its fuller version (4597, the *ḥasan* one) says the saved group is \"the *jamāʿa*\" — the main body — not a small sect."
layers:
  - kind: religious
    tr: |
      Kur'an çeşitliliği Allah'ın planının bir parçası sayar (5:48; 11:118), ama düşmanca bölünmeyi kınar (3:103, 105; 6:159).
      - **73 fırka hadisi.** Ebû Dâvûd 4596, Elbânî tarafından *hasen sahih* sayılır. Ebû Dâvûd 4597 "72'si ateşte, biri cennette: *cemaat*" ekini taşır ve *hasen* sayılır. İbn Teymiyye 72'nin kâfir *olmadığı* görüşündeydi (Abdallah, *AFKAR* 2006). Bağdâdî'nin *el-Fark*'ı bilinen fırkaları 73 sayısına zorladı (Gömbeyaz, *ULUM* 2018).
      - **"İhtilaf rahmettir."** "*İhtilâfu ümmetî rahmetün*" sözünün bilinen bir senedi yoktur (Sübkî, Süyûtî, Elbânî) ve İbn Hazm onu kınadı. Sabit olan, Kāsım b. Muhammed'in sahâbenin ihtilafının rahmet olduğuna dair sözüdür (İbn Sa'd).
      - **Sünnî–Şiî karşılıklı tanıma.** Ezher'den Şeltût 1959'da Ca'ferî (Şiî) mezhebinin geçerli olduğuna hükmetti. Sîstânî ve Ezher Şeyhi Amman Mesajı'nı destekledi.
    en: |-
      The Quran treats diversity as part of God's plan (5:48; 11:118) but condemns hostile splitting (3:103, 105; 6:159).
      - **The 73-sects hadith.** Abū Dāwūd 4596 is graded *ḥasan ṣaḥīḥ* by al-Albānī. Abū Dāwūd 4597 adds "72 in the Fire, one in Paradise: the *jamāʿa*" and is graded *ḥasan*. Ibn Taymiyya held that the 72 are *not* unbelievers (Abdallah, *AFKAR* 2006). Al-Baghdādī's *al-Farq* forced known sects into the number 73 (Gömbeyaz, *ULUM* 2018).
      - **"Disagreement is a mercy."** "*Ikhtilāf ummatī raḥma*" has no known chain (al-Subkī, al-Suyūṭī, al-Albānī), and Ibn Ḥazm condemned it. What is attested is al-Qāsim b. Muḥammad's saying that the Companions' differences are a mercy (Ibn Saʿd).
      - **Sunni–Shiʿi recognition.** Shaltūt of al-Azhar ruled the Jaʿfarī (Shiʿi) school valid in 1959. Sistani and the Shaykh al-Azhar backed the Amman Message.
  - kind: philosophical
    tr: |
      Klasik teori kesin olanı (*kat'î*) muhtemel olandan (*zannî*) ayırır: çekirdek için kesinlik, geri kalanında tevazu. Dikkatle içtihat edip yanılan bir âlim yine de sevap alır (Buhârî 7352).
    en: "Classical theory separates the definitive (*qaṭʿī*) from the probable (*ẓannī*): certainty for the core, humility elsewhere. A scholar who reasons carefully and errs is still rewarded (Bukhārī 7352)."
  - kind: history
    tr: |
      Onlarca erken fıkıh mezhebinden dört Sünnî mezhep ile Ca'ferî, Zeydî ve İbâdî mezhepleri ayakta kaldı. Sünnî–Şiî ayrılığı 632'den sonra liderlik meselesiyle başladı. Türkiye'de Hanefî, Şâfiî, Alevi-Bektaşi ve Ca'ferî topluluklar vardır.
    en: Of dozens of early legal schools, the four Sunni schools plus the Jaʿfarī, Zaydī and Ibāḍī survived. The Sunni–Shiʿi split began over leadership after 632. Türkiye has Hanafi, Shāfiʿī, Alevi-Bektashi and Jaʿfarī communities.
  - kind: psychological
    tr: |
      Siyah-beyaz dinî düşünce kaygı ve hoşgörüsüzlükle ilişkilidir. Düşünsel tevazu gruplar arası ilişkilerin daha iyi olmasını yordar.
    en: Black-and-white religious thinking correlates with anxiety and intolerance. Intellectual humility predicts better relations between groups.
honestLimits:
  tr: Gerçek anlaşmazlıklar — imamet ve Hz. Muhammed'den (s.a.v.) sonra peygamberlik — ortak bir öze işaret ederek çözülmez. Buradaki gruplar kendi metinlerinden değil, *Wikipedia*'dan tarif edildi. İbn Teymiyye'ye, Bağdâdî'ye, "ihtilaf rahmettir" hadisine ve eleştirmenlerine, Müslim 55'e ve siyah-beyaz dinî düşünce üzerine çalışmalara henüz başvurulmadı. Amman Mesajı'nın davranışı değiştirip değiştirmediği ölçülmedi.
  en: The real disputes — imamate, and prophethood after Muhammad (pbuh) — are not resolved by pointing to a shared core. The groups here were described from *Wikipedia*, not from their own texts. Ibn Taymiyya, al-Baghdadi, the hadith "disagreement is a mercy" and its critics, Muslim 55, and studies on black-and-white religious thinking have not yet been consulted. Whether the Amman Message changed behaviour was not measured.
visualizations:
  - id: ideas
    tr: |
      Ortak çekirdeği gövde, mezhepleri dallar ve yerel âdetleri yapraklar olarak gösteren bir ağaç. Bir *kat'î/zannî* ayırma oyunu. Bir hadis derecelendirme kartı.
    en: A tree with the shared core as trunk, schools as branches and local customs as leaves. A *qaṭʿī/ẓannī* sorting game. A hadith grading card.
