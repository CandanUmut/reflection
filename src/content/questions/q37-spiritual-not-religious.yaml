steelman:
  tr: "\"Allah'a inanıyorum. Bazen kendi sözlerimle dua ediyorum. Ama cami yargılandığım yer, kurallar bitmek bilmiyor gibi ve din hakkında en yüksek sesle konuşanlar çoğu zaman en nazik olanlar değil. İman bir kalp meselesidir. Neden kalbi tutup kurumu bırakamıyorum? Samimi inanç, şekli yerine getirmekten daha değerli değil mi?\""
  en: "\"I believe in God. I pray sometimes, in my own words. But the mosque is where I was judged, the rules seem endless, and the people most loud about religion are often not the kindest. Faith is a matter of the heart. Why can't I keep the heart and leave the institution? Isn't sincere belief worth more than going through the motions?\""
whyAsked:
  tr: "Bazıları dinî topluluklarda incindi — utandırıldı, kontrol edildi ya da ikiyüzlülükle karşılaştı. Bazıları kuralları katı, ruhu ise eksik buluyor. Bazıları kişisel maneviyatın norm olduğu bir kültürde yaşıyor: Amerika Birleşik Devletleri'nde yetişkinlerin %27'si 2017'de kendini dindar değil ama manevi biri olarak tanımladı; bu oran beş yılda 8 puan arttı (Pew)."
  en: "Some were hurt in religious communities — shamed, controlled, or met with hypocrisy. Some find rules rigid and the spirit missing. Some live in a culture where personal spirituality is the norm: in the United States, 27% of adults described themselves as spiritual but not religious in 2017, up 8 points in five years (Pew)."
shortAnswer:
  tr: "İslam kalbin önce geldiği konusunda hemfikirdir: İman, özünde, kalbin tasdik ettiği şeydir. Kur'an imanı çoğu zaman amellerle birlikte anar; örneğin: \"İnsan mutlaka ziyandadır. Ancak iman edenler, salih amel (iyi işler) işleyenler, birbirlerine hakkı tavsiye eden ve sabrı tavsiye edenler bunun dışındadır\" (103:2–3). Cibrîl hadisi dini üç katman hâlinde tarif eder — dış uygulama (*islâm*), iç inanç (*îmân*) ve güzellik (*ihsân*, \"Allah'a O'nu görüyormuş gibi ibadet etmek\") — ve üçüne birlikte \"dinleri\" der. Sünnî mezhepler amellerin imanın *parçası* olup olmadığı konusunda ayrıldı, ama hiçbiri amellerin önemsiz olduğunu savunmadı (buna en çok yaklaşan erken dönem bir grup olan Mürcie'ydi; aşağıya bak). İslam'ın istediği asgari şey küçük ve açıktır (Buhârî 46). Bir topluluk seni incittiyse, bu sana yapılmış bir haksızlıktır, Allah hakkında bir hüküm değil; uygulamanı yavaş yavaş, küçük başlayarak yeniden kurabilir ve nerede ve kiminle olacağını seçebilirsin."
  en: 'Islam agrees that the heart comes first: faith is, at its root, what the heart affirms. The Quran often pairs faith with deeds, as in: "Indeed, mankind is in loss, Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience" (103:2–3). The hadith of Jibril describes religion in three layers — outward practice (*islām*), inward belief (*īmān*) and excellence (*iḥsān*, "To worship Allah as if you see Him") — and calls all three together "their religion". The Sunni schools disagreed on whether deeds are *part* of faith, but none of them held that deeds do not matter (an early group, the Murjiʾa, came closest; see below). The minimum Islam asks is small and clear (Bukhari 46). If a community hurt you, that is a wrong done to you, not a verdict on God; you can rebuild practice slowly, starting small, and choose where and with whom.'
