steelman:
  tr: |
    İmanı neden kişisel tutmayayım?
  en: "\"I believe in God. I pray sometimes, in my own words. But the mosque is where I was judged, the rules seem endless, and the people most loud about religion are often not the kindest. Faith is a matter of the heart. Why can't I keep the heart and leave the institution? Isn't sincere belief worth more than going through the motions?\""
whyAsked:
  tr: |
    KONDA 2025: "inançlı ama dindar değil" diyenler %31'den %34'e yükseldi.
  en: "Some were hurt in religious communities — shamed, controlled, or met with hypocrisy. Some find rules rigid and the spirit missing. Some live in a culture where personal spirituality is the norm: in the United States, 27% of adults described themselves as spiritual but not religious in 2017, up 8 points in five years (Pew)."
shortAnswer:
  tr: |
    Kalpteki iman temeldir; beden ve ruh birlikte olduğu gibi, pratik de onu ayakta tutar. Küçük başla.
  en: 'Islam agrees that the heart comes first: faith is, at its root, what the heart affirms. The Quran often pairs faith with deeds, as in: "Indeed, mankind is in loss, Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience" (103:2–3). The hadith of Jibril describes religion in three layers — outward practice (*islām*), inward belief (*īmān*) and excellence (*iḥsān*, "To worship Allah as if you see Him") — and calls all three together "their religion". The Sunni schools disagreed on whether deeds are *part* of faith, but none of them held that deeds do not matter (an early group, the Murjiʾa, came closest; see below). The minimum Islam asks is small and clear (Bukhari 46). If a community hurt you, that is a wrong done to you, not a verdict on God; you can rebuild practice slowly, starting small, and choose where and with whom.'
