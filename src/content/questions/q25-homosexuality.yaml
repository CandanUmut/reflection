steelman:
  tr: '"Kendi cinsimden insanlara ilgi duymayı ben seçmedim; eşcinsellerin çoğu aynı şeyi söylüyor ve bilim de yönelimin basit bir seçim olmadığını kabul ediyor. İslam bana sevdiğim kişiyle asla evlenemeyeceğimi, asla bir partnerim olamayacağını ve hayat boyu yalnız yaşamam gerektiğini söylüyor — heteroseksüel Müslümanların hiçbir zaman taşımadığı bir yük. Bazı ülkelerde kanun benim gibi insanları hapisle ya da ölümle cezalandırıyor ve pek çok ailede ortaya çıkmak evden atılmak demek. Bazı genç eşcinsel Müslümanlar canlarına kıyıyor. Adil ve merhametli bir Allah birini nasıl böyle yaratıp sonra ona sevgiyi yasaklayabilir?"'
  en: '"I did not choose to be attracted to people of my own sex; most gay people say the same, and the science agrees that orientation is not a simple choice. Islam tells me I may never marry the person I love, never have a partner, and must live alone for life — a burden that straight Muslims never carry. In some countries the law punishes people like me with prison or death, and in many families, being found out means being thrown out. Some young gay Muslims take their own lives. How can a just and merciful God create someone this way and then forbid them love?"'
whyAsked:
  tr: Bazıları bunu kendi hayatı olduğu için sorar. Başkaları bir arkadaşı, bir çocuğu ya da bir kardeşi için sorar, ya da modern ahlak bunu bir eşitlik meselesi olarak gördüğü ve İslam'ın tutumunun buna nasıl uyduğunu göremedikleri için sorar.
  en: Some ask because it is their own life. Others ask for a friend, a child or a sibling, or because modern ethics treats this as a matter of equality and they cannot see how Islam's position fits.
shortAnswer:
  tr: "Ana akım İslam hukuku, bütün Sünnî ve Şiî mezheplerde, aynı cinsten kişiler arasındaki cinsel fiilleri yasaklar ve klasik müfessirler Kur'an'daki Lût kıssasını bu şekilde okur. Ama İslam hukuku duyguları değil fiilleri yargılar: Kişinin seçmediği bir ilgi günah değildir ve bunu hissedip buna göre davranmayan bir Müslüman \"hiçbir kınamayı hak etmez\" (Yaqeen). Mezheplerin tarif ettiği hukuki cezalar katı ispat şartlarına — dört şahit ya da itiraf — ve işleyen bir hukuk sistemine bağlıydı; özel hayatta ortaya çıkmaya ya da kendi başına adalet dağıtmaya değil. Scott Kugle'ın öncülük ettiği küçük bir revizyonist azınlık, Kur'an'ın aynı cinsten kişiler arasındaki sevgiye dayalı ilişkileri yasaklamadığını savunur; eleştirmenleri bunun metinleri yanlış okuduğunu savunur. Bilim, aynı cinsle cinsel davranışın kısmen genetik olduğunu, pek çok genden etkilendiğini ve herhangi bir birey için önceden kestirilemeyeceğini, yönelimi \"değiştirme\" girişimlerinin de zararla ilişkili olduğunu gösteriyor. Hayat boyu bekâr kalmanın yükü gerçektir ve bu sayfa onun küçük olduğu izlenimini vermez. Her insanın Allah'ın verdiği bir onuru vardır; zulüm, şiddet ve ailenin dışlaması yanlıştır."
  en: "Mainstream Islamic law, in all the Sunni and Shiʿi schools, prohibits same-sex sexual acts, and the Quran's story of Lot is read that way by classical commentators. But Islamic law judges acts, not feelings: attraction one did not choose is not a sin, and a Muslim who feels it and does not act on it \"carries no blame\" (Yaqeen). The legal penalties the schools describe were tied to strict proof — four witnesses or a confession — and to a functioning legal system, not to private discovery or vigilante action. A small revisionist minority, led by Scott Kugle, argues the Quran does not forbid loving same-sex relationships; their critics argue that this misreads the texts. Science shows that same-sex behaviour is partly genetic, influenced by many genes, and not predictable for any individual, and that attempts to \"change\" orientation are linked to harm. The burden of lifelong celibacy is real, and this page does not pretend it is small. Every person has God-given dignity, and cruelty, violence and family rejection are wrong."
layers:
  - kind: religious
    tr: |
      Lût kıssası (7:80–84) klasik olarak erkekler arası eşcinsel fiilleri kınayan bir anlatı olarak okunur. Ebû Hanîfe sabit bir *had* cezası olmadığı görüşündeydi. Scott Kugle (2010) kıssayı tecavüz ve misafirperverlik ihlali hakkında okur. Mobeen Vaid (*AJISS* 34(3), 2017), Kugle'ın hem Kur'an'ı hem İbn Hazm'ı yanlış okuduğunu savunur [Debated].
    en: The story of Lot (Lūṭ) (7:80–84) is classically read as condemning male same-sex acts. Abū Ḥanīfa held that there is no fixed *ḥadd* penalty. Scott Kugle (2010) reads the story as being about rape and inhospitality. Mobeen Vaid (*AJISS* 34(3), 2017) argues that Kugle misreads both the Quran and Ibn Ḥazm [Debated].
  - kind: philosophical
    tr: |
      Ömür boyu bekârlığın farklı türden bir yük olduğu itirazı ciddidir. Tam tatmin edici bir cevabı yoktur. Teolojik cevap, Allah'ın insanları farklı şekillerde imtihan ettiğidir (2:286).
    en: The objection that lifelong celibacy is a different kind of burden is serious. It has no fully satisfying answer. The theological reply is that God tests people differently (2:286).
  - kind: scientific
    tr: |
      Tek bir "eşcinsellik geni" yoktur (Ganna ve ark., *Science* 2019, yaklaşık 500.000 kişi). Dönüşüm terapisi zararlıdır.
    en: There is no single "gay gene" (Ganna et al., *Science* 2019, ~500,000 people). Conversion therapy is harmful.
  - kind: psychological
    tr: |
      Önce güvenlik gelir: Türkiye'de 112 ya da bir kriz hattı.
    en: "Safety comes first: 112 in Türkiye, or a crisis line."
honestLimits:
  tr: Ana akım tutum açıktır ve revizyonist görüş, âlimlerin çoğunun reddettiği bir azınlık görüşüdür. Bu tutumun eşcinsel Müslümanlara yüklediği yük ağırdır ve buradaki hiçbir cevap onu hafifletmez. Birkaç klasik mezhep ölüm cezası öngördü ve bazı devletler hâlâ öngörüyor; bu gizlenmemelidir. Kugle'ın kitabı ve El-Rouayheb'in kitabı yalnızca incelemeler ve özetler aracılığıyla okundu; Kecia Ali'nin *Sexual Ethics and Islam* (2016) kitabına henüz başvurulmadı.
  en: The mainstream position is clear, and the revisionist view is a minority that most scholars reject. The burden this position places on gay Muslims is heavy, and no answer here makes it light. Several classical schools prescribed death, and some states still do; that must not be hidden. Kugle's book and El-Rouayheb's book were read only through reviews and summaries; Kecia Ali's *Sexual Ethics and Islam* (2016) has not yet been consulted.
