fullAnswer:
  - kind: heart
    en: |-
      **If you are gay, bisexual or same-sex attracted and Muslim, you are not alone, and you are not less of a Muslim for what you feel.** The tradition's own principle is that "a person is not held accountable for feelings they did not choose" (Yaqeen). God "does not charge a soul except [with that within] its capacity" (2:286).

      **If you are in danger — from yourself, or from others — get help now.** Call your local emergency number. If you are thinking about suicide, call a crisis line in your country (findahelpline.com lists them). Naseeha, a Muslim helpline based in Canada, answers 24 hours a day on the North American toll-free number 1-866-627-3342 and by live chat, with counsellors in English, French, Arabic, Urdu, Hindi, Punjabi, Bengali and Gujarati; it is non-judgemental and confidential (except where there is a serious risk of harm), and you can stay anonymous.

      **Practical steps.** You can pray, fast, go to the mosque and belong to your community; none of that depends on what you feel. Find one trusted, discreet person — a counsellor, an imam you trust, a friend. Avoid "conversion" programmes (see science, below). If your family's reaction might put you at risk, think about your safety before telling them. Muslims who hold the mainstream view and live celibate, and Muslims who hold the revisionist view, both exist; you will meet both, and you deserve to be treated with respect by both.

      **If you are a parent or friend,** your first duty is to keep the person safe and loved. Rejection and shaming do not make anyone more faithful; they put lives at risk.
    tr: |-
      **Eşcinsel, biseksüel ya da kendi cinsine ilgi duyan bir Müslümansan, yalnız değilsin ve hissettiklerin yüzünden daha az Müslüman değilsin.** Geleneğin kendi ilkesi şudur: "Kişi seçmediği duygulardan sorumlu tutulmaz" (Yaqeen). "Allah hiç kimseye gücünün yeteceğinden başka yük yüklemez." (2:286).

      **Tehlikedeysen — kendinden ya da başkalarından — şimdi yardım al.** Bulunduğun yerdeki acil yardım numarasını ara. İntiharı düşünüyorsan, ülkendeki bir kriz hattını ara (findahelpline.com bunları listeler). Kanada merkezli bir Müslüman yardım hattı olan Naseeha, Kuzey Amerika'daki ücretsiz 1-866-627-3342 numarasından ve canlı sohbetle günün 24 saati cevap verir; İngilizce, Fransızca, Arapça, Urduca, Hintçe, Pencapça, Bengalce ve Guceratça konuşan danışmanları vardır; yargılamaz ve gizlidir (ciddi bir zarar riski olduğu durumlar hariç) ve kimliğini gizli tutabilirsin.

      **Pratik adımlar.** Namaz kılabilir, oruç tutabilir, camiye gidebilir ve topluluğuna ait olabilirsin; bunların hiçbiri ne hissettiğine bağlı değildir. Güvenilir, ağzı sıkı bir kişi bul — bir danışman, güvendiğin bir imam, bir arkadaş. "Dönüştürme" programlarından uzak dur (aşağıda bilim kısmına bak). Ailenin tepkisi seni tehlikeye atabilecekse, onlara söylemeden önce güvenliğini düşün. Ana akım görüşü benimseyip bekâr yaşayan Müslümanlar da, revizyonist görüşü benimseyen Müslümanlar da var; ikisiyle de karşılaşacaksın ve ikisinin de sana saygıyla davranmasını hak ediyorsun.

      **Bir anne baba ya da arkadaşsan,** ilk görevin o kişiyi güvende ve sevilmiş tutmaktır. Dışlamak ve utandırmak kimseyi daha imanlı yapmaz; hayatları riske atar.
    title:
      en: Kalp ve akıl için
      tr: Kalp ve akıl için
  - kind: quran
    en: |-
      **The story of Lot.** "And [We had sent] Lot when he said to his people, 'Do you commit such immorality as no one has preceded you with from among the worlds? Indeed, you approach men with desire, instead of women. Rather, you are a transgressing people.' But the answer of his people was only that they said, 'Evict them from your city! Indeed, they are men who keep themselves pure.' So We saved him and his family, except for his wife… And We rained upon them a rain [of stones]" (7:80–84), from Sura al-Aʿraf, Meccan.

      **Other tellings.** "Do you approach males among the worlds / And leave what your Lord has created for you as mates? But you are a people transgressing" (26:165–166), Meccan. "Do you commit immorality while you are seeing? Do you indeed approach men with desire instead of women? Rather, you are a people behaving ignorantly" (27:54–55), Meccan. Other passages (11:77–83; 15:61–77; 29:28–35) tell of the people's attempt on Lot's guests; they were not quoted.

      **How the classical commentators read them.** Ibn Kathir says the people of Lot had relations with males instead of females, and that "this evil practice was not known among the Children of Adam before"; he cites ʿAmr ibn Dinar: "Never before the people of Lut did a male have sex with another male." Al-Tabari, as Vaid shows, integrates 7:80–81 with "a simple and straightforward explanation" that the iniquity was "coming with desire unto men instead of women" (Vaid, pp. 61–62).

      **4:15–16.** "Those who commit unlawful sexual intercourse of your women… confine the guilty women to houses… And the two who commit it among you, dishonor them both. But if they repent and correct themselves, leave them alone" (4:15–16), Medinan. Ibn Kathir reports Mujahid saying 4:16 "was revealed about the case of two men who do it", and that the ruling was later abrogated by the penalties for unlawful sex. Others read "the two" as a man and a woman.
    tr: |-
      **Lût kıssası.** "Lût'u da (peygamber olarak) gönderdik. Kavmine dedi ki: "Sizden önce âlemlerden hiç birinin yapmadığı fuhuşu mu yapıyor sunuz? Çünkü siz kadınları bırakıp da şehvetle erkeklere gidiyorsunuz. Belki de siz haddi aşan bir kavimsiniz. Kavminin cevabı: "Onları (Lût'u ve taraftarlarını) kentinizden çıkarın, çünkü onlar, fazla temizlenen insanlarmış! "demelerinden başka bir şey olmadı. Biz de onu ve ailesini kurtardık, yalnız karısı(nı kurtarmadık)… Ve üzerlerine bir (azab) yağmuru yağdırdık." (7:80–84), A'râf Sûresi'nden, Mekkî.

      **Başka anlatımlar.** "İnsanlar içinden erkeklere mi gidiyorsunuz… Bırakıyorsunuz da sizler için yarattığı eşleri! Doğrusu siz insanlıktan çıkmış bir kavimsiniz" (26:165–166), Mekkî. "Göz göre göre hala o hayasızlığı yapacak mısınız… Siz ille de kadınları bırakıp şehvetle erkeklere yaklaşacak mısınız? Doğrusu siz beyinsizlikte devam edegelen bir kavimsiniz" (27:54–55), Mekkî. Başka pasajlar (11:77–83; 15:61–77; 29:28–35) kavmin Lût'un misafirlerine yönelik girişimini anlatır; bunlar alıntılanmadı.

      **Klasik müfessirler bunları nasıl okudu?** İbn Kesîr, Lût kavminin kadınlar yerine erkeklerle ilişkiye girdiğini ve "bu kötü uygulamanın daha önce Âdemoğulları arasında bilinmediğini" söyler; Amr b. Dînâr'ı aktarır: "Lût kavminden önce hiçbir erkek başka bir erkekle cinsel ilişkiye girmemişti." Vaid'in gösterdiğine göre Taberî, 7:80–81'i, kötülüğün "kadınlar yerine erkeklere şehvetle gelmek" olduğu yönünde "basit ve dolaysız bir açıklamayla" birleştirir (Vaid, s. 61–62).

      **4:15–16.** "Kadınlarınızdan zina edenlere karşı… bu kadınları… evlerde hapsedin… Sizlerden zina edenlerin her ikisine de eziyet edin. Eğer onlar tevbe edip kendilerini ıslah ederlerse onlardan vazgeçin." (4:15–16), Medenî. İbn Kesîr, Mücâhid'in 4:16'nın "bunu yapan iki erkek hakkında indiğini" söylediğini ve hükmün daha sonra zina cezalarıyla neshedildiğini aktarır. Başkaları "ikisi"ni bir erkek ve bir kadın olarak okur.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: |-
      **The key reports.** Ibn ʿAbbas (ra) reports the Prophet (pbuh) as saying: "If you find anyone doing as Lot's people did, kill the one who does it, and the one to whom it is done" ({hadith:abudawud:4462}; al-Albani: *ḥasan ṣaḥīḥ*). Another report from Ibn ʿAbbas curses those who do "the act of the people of Lot"; Brown calls this the most reliable condemnation (p. 10); it was graded *ṣaḥīḥ* by al-Hakim, Ibn Hibban, al-Diyaʾ al-Maqdisi and al-Albani (p. 13).

      **How strong are they?** The killing report was graded *ṣaḥīḥ* by Ibn al-Jarud, al-Tabari, al-Hakim and al-Suyuti (p. 9). Critics focus on its narrator ʿAmr ibn Abi ʿAmr: Ibn Maʿin and al-Nasaʾi said his hadiths were "not strong", while Ahmad ibn Hanbal and Abu Hatim said "there is nothing wrong with him" (p. 15). Ibn Hajar called the report weak in *Fath al-Bari* but noted disagreement in *Bulugh al-Maram* (p. 17); al-Tirmidhi noted conflicting evidence on the punishment (p. 16). A stoning report from ʿAli was judged weak by Ibn Hajar (p. 17). So the prohibition is firmly established; the specific penalty was disputed among hadith scholars themselves.
    tr: |-
      **Temel rivayetler.** İbn Abbâs (r.a.), Hz. Peygamber'in (s.a.v.) şöyle dediğini aktarır: "Lût kavminin yaptığını yapan birini bulursanız, yapanı da kendisine yapılanı da öldürün" ({hadith:abudawud:4462}; Elbânî: *hasen sahih*). İbn Abbâs'tan gelen bir başka rivayet "Lût kavminin fiilini" yapanları lanetler; Brown bunu en güvenilir kınama olarak nitelendirir (s. 10); Hâkim, İbn Hibbân, Ziyâ el-Makdisî ve Elbânî bunu *sahih* olarak derecelendirdi (s. 13).

      **Ne kadar güçlüler?** Öldürme rivayetini İbnü'l-Cârûd, Taberî, Hâkim ve Suyûtî *sahih* olarak derecelendirdi (s. 9). Eleştirmenler râvisi Amr b. Ebî Amr üzerinde durur: İbn Maîn ve Nesâî onun hadislerinin "güçlü olmadığını" söyledi, Ahmed b. Hanbel ve Ebû Hâtim ise "onda bir sakınca yoktur" dedi (s. 15). İbn Hacer *Fethu'l-Bârî*'de rivayeti zayıf saydı, ama *Bulûğu'l-Merâm*'da ihtilaf olduğunu not etti (s. 17); Tirmizî ceza konusunda çelişen deliller olduğunu not etti (s. 16). Hz. Ali'den gelen bir recm rivayetini İbn Hacer zayıf saydı (s. 17). Yani yasak sağlam bir şekilde sabittir; belirli ceza ise hadis âlimlerinin kendi aralarında tartışmalıydı.
    title:
      en: Hadis rivayetleri ne diyor?
      tr: Hadis rivayetleri ne diyor?
  - kind: fiqh
    en: |-
      **What *ḥadd* means.** A *ḥadd* (plural *ḥudūd*) is a fixed penalty set by God for a specific crime; *taʿzīr* is a discretionary penalty left to a judge.

      **The schools' positions.** According to Brown (2017, pp. 4–5) and Sedick (2024):
      - **Maliki** — the main position is death by stoning for both partners.
      - **Shafiʿi** — al-Shafiʿi's early view was death for both. For the later school, the sources differ: Brown (p. 4) gives the dominant view as "the active partner is executed by the sword while the passive partner is punished with 100 lashes and exiled for one year"; Sedick, citing al-Nawawi's *Minhaj*, gives the *zinā* (unlawful sex) rule — death if married, a hundred lashes and a year's exile if not.
      - **Hanbali** — Ahmad's early view was death for both; the later school treats it like *zinā*.
      - **Hanafi** — Abu Hanifa held there is no fixed *ḥadd*; the penalty is *taʿzīr*, with execution possible for repeat offenders as a matter of governance (Brown). His students Abu Yusuf and Muhammad al-Shaybani treated it like *zinā* (Sedick).
      - **Ibn Hazm** (Zahiri) held the act "categorically forbidden" but rejected a fixed *ḥadd*, requiring *taʿzīr* (Vaid, pp. 73, 76).

      **Proof and process.** All the schools required four male witnesses to the act itself, or a clear, voluntary confession — standards Sedick calls "nigh impossible", meant to protect people from accusation. He adds that "no one is allowed to take the law into their own hands", and that these laws presuppose a full legal system with courts. In this framework, what could be punished was a proven act, not an inclination (Sedick; El-Rouayheb, below).

      **Desire and act.** El-Rouayheb's study of the Arab-Islamic world from 1500 to 1800 shows that jurists treated intercourse between men as sinful but distinguished it sharply from feelings, chaste love and even love poetry, some of which they permitted (as summarised by *Wikipedia*). The modern idea of a fixed "orientation" did not exist; the law judged acts.

      **What states do today.** According to ILGA World's 2024 report, 60 UN member states criminalise consensual same-sex acts by law and two more do so in practice; Uganda's 2023 law includes a possible death penalty, and reports surfaced of executions in Afghanistan and Yemen (*PinkNews*). Many of these countries are Muslim-majority, some are not. Whether such laws meet classical Islamic standards of proof is a separate question from whether they exist.
    tr: |-
      ***Had* ne demek?** *Had* (çoğulu *hudûd*), belirli bir suç için Allah tarafından belirlenmiş sabit bir cezadır; *ta'zîr* ise hâkimin takdirine bırakılmış bir cezadır.

      **Mezheplerin tutumları.** Brown (2017, s. 4–5) ve Sedick'e (2024) göre:
      - **Mâlikî** — ana görüş, iki taraf için de recmle ölümdür.
      - **Şâfiî** — Şâfiî'nin erken görüşü iki taraf için de ölümdü. Sonraki mezhep için kaynaklar farklı şeyler söyler: Brown (s. 4) baskın görüşü "aktif taraf kılıçla idam edilir, pasif taraf ise 100 sopa ve bir yıl sürgünle cezalandırılır" olarak verir; Sedick, Nevevî'nin *Minhâc*'ına atıfla, *zina* hükmünü verir — evliyse ölüm, değilse yüz sopa ve bir yıl sürgün.
      - **Hanbelî** — Ahmed'in erken görüşü iki taraf için de ölümdü; sonraki mezhep bunu *zina* gibi ele alır.
      - **Hanefî** — Ebû Hanîfe sabit bir *had* olmadığını savundu; ceza *ta'zîr*dir ve tekrar edenler için siyaseten idam mümkündür (Brown). Öğrencileri Ebû Yûsuf ve İmam Muhammed eş-Şeybânî bunu *zina* gibi ele aldı (Sedick).
      - **İbn Hazm** (Zâhirî), fiilin "kesinlikle haram" olduğunu savundu, ama sabit bir *haddi* reddetti ve *ta'zîr* gerektiğini söyledi (Vaid, s. 73, 76).

      **İspat ve usul.** Bütün mezhepler, fiilin kendisine dört erkek şahit ya da açık ve gönüllü bir itiraf şart koştu — Sedick'in "neredeyse imkânsız" dediği ve insanları suçlamalara karşı korumayı amaçlayan ölçütler. Sedick, "hiç kimsenin kanunu kendi eline almasına izin verilmediğini" ve bu hükümlerin mahkemeleriyle eksiksiz bir hukuk sistemini önceden varsaydığını ekler. Bu çerçevede cezalandırılabilecek olan bir eğilim değil, ispat edilmiş bir fiildi (Sedick; El-Rouayheb, aşağıda).

      **Arzu ve fiil.** El-Rouayheb'in 1500–1800 arası Arap-İslam dünyası üzerine çalışması, fakihlerin erkekler arasındaki cinsel ilişkiyi günah saydığını, ama onu duygulardan, iffetli aşktan, hatta bir kısmına izin verdikleri aşk şiirinden kesin bir şekilde ayırdığını gösterir (*Wikipedia*'nın özetlediğine göre). Sabit bir "yönelim" şeklindeki modern fikir yoktu; hukuk fiilleri yargılıyordu.

      **Devletler bugün ne yapıyor?** ILGA World'ün 2024 raporuna göre, BM üyesi 60 devlet rızaya dayalı eşcinsel fiilleri kanunla suç sayıyor, iki devlet daha uygulamada suç sayıyor; Uganda'nın 2023 kanunu olası bir ölüm cezası içeriyor ve Afganistan ile Yemen'de idamlar yapıldığına dair haberler ortaya çıktı (*PinkNews*). Bu ülkelerin çoğu Müslüman çoğunluklu, bazıları değil. Bu kanunların klasik İslami ispat ölçütlerini karşılayıp karşılamadığı, var olup olmadıklarından ayrı bir sorudur.
    title:
      en: Dört mezhep ne diyor?
      tr: Dört mezhep ne diyor?
  - kind: science
    en: |-
      **Genes play a part, but no single gene decides.** [Established.] In a genome study of 477,522 people, Ganna and colleagues (*Science*, 2019) found "five loci significantly associated with same-sex sexual behavior". "In aggregate, all tested genetic variants accounted for 8 to 25% of variation", and the variants "do not allow meaningful prediction of an individual's sexual behavior". Twin and family studies show the behaviour is "partly genetically influenced". So sexuality is shaped by many genes, environment and experience; it is not a simple choice, and it is not a simple genetic switch.

      **"Conversion" efforts are linked to harm.** [Moderate.] In a nationally representative US sample of 1,518 sexual-minority adults, Blosnich and colleagues (2020) found that those exposed to sexual orientation change efforts — 80.8% of them from a religious leader — had higher odds of suicidal ideation (adjusted odds ratio 1.92, 95% CI 1.01–3.64), planning (1.75, CI 1.01–3.06) and suicide attempts with no or minor injury (1.88, CI 1.01–3.50) than those not exposed, after controlling for adverse childhood experiences; for attempts with moderate or severe injury the difference (1.67, CI 0.76–3.64) was not statistically significant. Only 6.9% of the sample (108 people) were exposed, and all the intervals are close to 1. The authors note that the measure was new and that they could not time the change efforts relative to childhood adversity, so causation is not proven. A published reanalysis (Sullins, 2022) disputes the findings; it has not yet been consulted here.
    tr: |-
      **Genlerin bir payı var, ama tek bir gen belirleyici değil.** [Established.] 477.522 kişi üzerinde yapılan bir genom çalışmasında Ganna ve arkadaşları (*Science*, 2019) "aynı cinsle cinsel davranışla anlamlı şekilde ilişkili beş lokus" buldu. "Toplu olarak, test edilen bütün genetik varyantlar varyasyonun %8 ile %25'ini açıkladı" ve varyantlar "bir bireyin cinsel davranışının anlamlı bir şekilde öngörülmesine imkân vermiyor". İkiz ve aile çalışmaları bu davranışın "kısmen genetik olarak etkilendiğini" gösteriyor. Yani cinsellik pek çok gen, çevre ve tecrübe tarafından şekillenir; basit bir seçim değildir ve basit bir genetik anahtar da değildir.

      **"Dönüştürme" girişimleri zararla ilişkilidir.** [Orta.] Blosnich ve arkadaşları (2020), cinsel azınlıktan 1.518 yetişkinden oluşan, ABD'yi temsil eden bir örneklemde, cinsel yönelimi değiştirme girişimlerine maruz kalanların — bunların %80,8'i bir din önderinden — maruz kalmayanlara göre, olumsuz çocukluk tecrübeleri kontrol edildikten sonra, daha yüksek intihar düşüncesi (düzeltilmiş olasılık oranı 1,92, %95 GA 1,01–3,64), planlama (1,75, GA 1,01–3,06) ve yaralanmasız ya da hafif yaralanmalı intihar girişimi (1,88, GA 1,01–3,50) olasılığına sahip olduğunu buldu; orta ya da ağır yaralanmalı girişimler için fark (1,67, GA 0,76–3,64) istatistiksel olarak anlamlı değildi. Örneklemin yalnızca %6,9'u (108 kişi) maruz kalmıştı ve bütün aralıklar 1'e yakındır. Yazarlar ölçümün yeni olduğunu ve değiştirme girişimlerinin çocukluk sıkıntılarına göre zamanlamasını belirleyemediklerini not eder; dolayısıyla nedensellik ispat edilmiş değildir. Yayımlanmış bir yeniden analiz (Sullins, 2022) bulgulara itiraz eder; buna burada henüz başvurulmadı.
    title:
      en: Bilim ne diyor?
      tr: Bilim ne diyor?
  - kind: reasoning
    en: |-
      **"Why would God make someone gay and then forbid them love?"** The mainstream Islamic answer has several parts, and it is fair to say none is complete.

      First, Islam does not teach that God created a person *in order to* sin. It teaches that every person has desires, some of which they may not act on, and that what is judged is what they choose to do (2:286). A same-sex-attracted Muslim who does not act on it "carries no blame", and "the effort to stay within God's limits can itself earn reward" (Yaqeen).

      Second, the burden of not being able to marry is not unique to gay Muslims: many Muslims never find a spouse, or are widowed young, or are unable to marry for other reasons. *Limit:* this comparison is imperfect. For a gay Muslim, the burden is not a circumstance that might change, and it falls on a whole dimension of life; it is right to say this plainly.

      Third, Islam does not reduce love to sex. Deep friendship, family, community and the love of God are open to everyone. *Limit:* this is true but can sound like a consolation prize to someone who wants a partner, and should be offered with humility, not as a dismissal.

      Fourth, the answer finally rests on trust that God's commands come from knowledge and mercy, even when a person cannot see their wisdom. *Limit:* that is a theological answer, not a philosophical proof, and it will not persuade someone who does not share the premise.
    tr: |-
      **"Allah neden birini eşcinsel yaratıp sonra ona sevgiyi yasaklasın?"** Ana akım İslami cevabın birkaç parçası vardır ve hiçbirinin tam olmadığını söylemek adil olur.

      Birincisi, İslam Allah'ın bir insanı günah işlesin *diye* yarattığını öğretmez. Her insanın, bir kısmına göre davranamayacağı arzuları olduğunu ve yargılanan şeyin yapmayı seçtiği şey olduğunu öğretir (2:286). Kendi cinsine ilgi duyup buna göre davranmayan bir Müslüman "hiçbir kınamayı hak etmez" ve "Allah'ın sınırları içinde kalma çabasının kendisi sevap kazandırabilir" (Yaqeen).

      İkincisi, evlenememenin yükü eşcinsel Müslümanlara özgü değildir: Pek çok Müslüman hiçbir zaman eş bulamaz, genç yaşta dul kalır ya da başka sebeplerle evlenemez. *Sınır:* Bu karşılaştırma kusurludur. Eşcinsel bir Müslüman için yük, değişebilecek bir durum değildir ve hayatın bütün bir boyutuna düşer; bunu açıkça söylemek doğrudur.

      Üçüncüsü, İslam sevgiyi cinselliğe indirgemez. Derin dostluk, aile, topluluk ve Allah sevgisi herkese açıktır. *Sınır:* Bu doğrudur, ama bir partner isteyen birine teselli ödülü gibi gelebilir ve geçiştirme olarak değil, tevazuyla sunulmalıdır.

      Dördüncüsü, cevap nihayetinde, kişi hikmetlerini göremese bile Allah'ın emirlerinin ilim ve merhametten geldiğine güvene dayanır. *Sınır:* Bu felsefi bir ispat değil, teolojik bir cevaptır ve bu öncülü paylaşmayan birini ikna etmeyecektir.
    title:
      en: En zor soru
      tr: En zor soru
  - kind: objection
    en: |-
      **The revisionist argument (Kugle).** Scott Kugle, in *Homosexuality in Islam* (2010), argues that the Lot verses condemn rape and the violation of hospitality — the people tried to assault Lot's guests — "rather than forbidding same-sex intercourse"; that the hadith condemning such acts have weak chains or reflect later views; and that classical jurists had "no actual consensus on the nature of the act" (Rahemtulla's review). He treats the medieval jurist Ibn Hazm as "our guide" (Vaid, p. 72; page numbers from running heads may be off by one).

      **Vaid's reply.** Mobeen Vaid (2017) argues that Kugle's rape reading depends on late storytelling material; that 7:81 itself names the act ("you approach men with desire, instead of women"); that "traditional exegetes do not mention any wives when commenting on Q. 26:165–66" (p. 71); and that "Ibn Hazm never demurred as to whether same-sex sexual behavior was prohibited" — Ibn Hazm called such conduct "horrible and disgusting" in *Ṭawq al-Ḥamāma* and only rejected a fixed *ḥadd* (pp. 73–76). The reviewer Rahemtulla praises Kugle's book as "groundbreaking" while criticising gaps in it.

      **Assessment.** The revisionist case is worth reading because it raises real questions about what the texts emphasise. But the classical reading rests on the Quran's own words in 7:81, 26:165–166 and 27:55, which name desire for men instead of women, and on a broad consensus that even Ibn Hazm shared. *Limit:* the revisionists reply that ancient categories of sexual conduct do not map onto modern loving, committed relationships, and that question — whether the texts address what we now call orientation — is not fully settled by pointing to the verses.

      **"The penalties are barbaric."** *Reply:* the schools differed widely; the Hanafis set no fixed penalty; all required near-impossible proof; and none allowed private violence. *Limit:* several classical schools did prescribe death, some states still do, and that history should not be hidden.
    tr: |-
      **Revizyonist argüman (Kugle).** Scott Kugle, *Homosexuality in Islam* (*İslam'da Eşcinsellik*, 2010) adlı kitabında, Lût âyetlerinin "aynı cinsten kişiler arasındaki cinsel ilişkiyi yasaklamaktan ziyade" tecavüzü ve misafirperverliğin çiğnenmesini kınadığını — kavmin Lût'un misafirlerine saldırmaya çalıştığını —; bu fiilleri kınayan hadislerin zayıf senetlere sahip olduğunu ya da sonraki görüşleri yansıttığını; ve klasik fakihlerin "fiilin mahiyeti konusunda gerçek bir icmâı olmadığını" savunur (Rahemtulla'nın incelemesi). Ortaçağ fakihi İbn Hazm'ı "rehberimiz" olarak görür (Vaid, s. 72; sayfa başlıklarından alınan sayfa numaraları bir sayfa kayık olabilir).

      **Vaid'in cevabı.** Mobeen Vaid (2017), Kugle'ın tecavüz okumasının geç dönem hikâye malzemesine dayandığını; 7:81'in kendisinin fiili adlandırdığını ("siz kadınları bırakıp da şehvetle erkeklere gidiyorsunuz"); "geleneksel müfessirlerin K. 26:165–66'yı yorumlarken herhangi bir eşten söz etmediğini" (s. 71); ve "İbn Hazm'ın aynı cinsten kişiler arasındaki cinsel davranışın haram olup olmadığı konusunda hiçbir zaman tereddüt etmediğini" savunur — İbn Hazm *Tavku'l-Hamâme*'de bu davranışı "korkunç ve iğrenç" olarak nitelendirdi ve yalnızca sabit bir *haddi* reddetti (s. 73–76). İncelemeyi yazan Rahemtulla, Kugle'ın kitabını "çığır açıcı" olarak överken içindeki boşlukları eleştirir.

      **Değerlendirme.** Revizyonist savunma okunmaya değer, çünkü metinlerin neyi vurguladığı hakkında gerçek sorular ortaya koyar. Ama klasik okuma, Kur'an'ın 7:81, 26:165–166 ve 27:55'teki, kadınlar yerine erkeklere duyulan şehveti adlandıran kendi sözlerine ve İbn Hazm'ın bile paylaştığı geniş bir icmâya dayanır. *Sınır:* Revizyonistler, eski cinsel davranış kategorilerinin modern, sevgiye dayalı, bağlılık içeren ilişkilere karşılık gelmediği cevabını verir ve bu soru — metinlerin bugün yönelim dediğimiz şeye hitap edip etmediği — âyetleri göstermekle tam olarak çözülmez.

      **"Cezalar barbarca."** *Cevap:* Mezhepler büyük ölçüde ayrıldı; Hanefîler sabit bir ceza belirlemedi; hepsi neredeyse imkânsız bir ispat şart koştu; ve hiçbiri özel şiddete izin vermedi. *Sınır:* Birkaç klasik mezhep gerçekten ölüm cezası öngördü, bazı devletler hâlâ öngörüyor ve bu tarih gizlenmemelidir.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **All classical schools** — same-sex acts are prohibited; feelings are not punished.
      - **Maliki** — death; **Shafiʿi, Hanbali (later)** — like *zinā*; **Hanafi (Abu Hanifa)** — discretionary; **Ibn Hazm** — discretionary.
      - **Contemporary mainstream** (e.g. Yaqeen) — attraction is not sinful; celibacy is the path; support, not shame.
      - **Revisionist minority** (Kugle) — the Quran does not forbid loving same-sex relationships; rejected by most scholars (Vaid).
    tr: |-
      - **Bütün klasik mezhepler** — aynı cinsten kişiler arasındaki fiiller haramdır; duygular cezalandırılmaz.
      - **Mâlikî** — ölüm; **Şâfiî, Hanbelî (sonraki)** — *zina* gibi; **Hanefî (Ebû Hanîfe)** — takdirî; **İbn Hazm** — takdirî.
      - **Çağdaş ana akım** (ör. Yaqeen) — ilgi günah değildir; bekâret yoldur; utandırma değil, destek.
      - **Revizyonist azınlık** (Kugle) — Kur'an aynı cinsten kişiler arasındaki sevgiye dayalı ilişkileri yasaklamaz; âlimlerin çoğu tarafından reddedilir (Vaid).
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: Is being gay a sin?
      tr: Eşcinsel olmak günah mı?
    a:
      en: "In mainstream Islamic teaching, no: feelings one did not choose are not sins. Acts are what the law addresses."
      tr: "Ana akım İslami öğretide hayır: Kişinin seçmediği duygular günah değildir. Hukukun ilgilendiği şey fiillerdir."
  - q:
      en: What do 26:165–166 and 27:54–55 say?
      tr: 26:165–166 ve 27:54–55 ne diyor?
    a:
      en: They describe Lot's people approaching men "with desire instead of women" and leaving "what your Lord has created for you as mates".
      tr: Lût kavminin "kadınları bırakıp şehvetle erkeklere" yaklaştığını ve "sizler için yarattığı eşleri" bıraktığını anlatır.
  - q:
      en: What does *ḥadd* mean, and what did schools other than Abu Hanifa's hold?
      tr: "*Had* ne demek ve Ebû Hanîfe'ninki dışındaki mezhepler ne savundu?"
    a:
      en: A fixed penalty. Malikis held death; later Shafiʿis and Hanbalis treated the act like *zinā*; Abu Hanifa held there was no fixed penalty.
      tr: Sabit bir ceza. Mâlikîler ölümü savundu; sonraki Şâfiîler ve Hanbelîler fiili *zina* gibi ele aldı; Ebû Hanîfe sabit bir ceza olmadığını savundu.
  - q:
      en: Is the punishment actually applied?
      tr: Ceza gerçekten uygulanıyor mu?
    a:
      en: In a few states, laws exist and are sometimes enforced; in most Muslim-majority countries, the classical standards of proof are not what is applied. Vigilante violence is forbidden in Islamic law.
      tr: Birkaç devlette kanunlar var ve bazen uygulanıyor; Müslüman çoğunluklu ülkelerin çoğunda uygulanan şey klasik ispat ölçütleri değil. İslam hukukunda kişinin kendi başına şiddet uygulaması yasaktır.
  - q:
      en: Is the revisionist view worth taking seriously?
      tr: Revizyonist görüş ciddiye alınmaya değer mi?
    a:
      en: It is worth understanding. Most scholars think it misreads the texts (Vaid).
      tr: Anlaşılmaya değer. Âlimlerin çoğu onun metinleri yanlış okuduğunu düşünüyor (Vaid).
  - q:
      en: How do gay Muslims live their faith in practice?
      tr: Eşcinsel Müslümanlar imanlarını pratikte nasıl yaşıyor?
    a:
      en: "In many ways: some live celibate within mainstream teaching, with the support of friends and counsellors; some hold revisionist views; many are simply trying to stay close to God and safe. What helps all of them is a community that keeps their dignity and confidence."
      tr: "Pek çok şekilde: Bazıları ana akım öğretiye bağlı olarak, arkadaşlarının ve danışmanlarının desteğiyle bekâr yaşıyor; bazıları revizyonist görüşleri benimsiyor; pek çoğu sadece Allah'a yakın ve güvende kalmaya çalışıyor. Hepsine yardım eden şey, onurlarını ve sırlarını koruyan bir topluluktur."
