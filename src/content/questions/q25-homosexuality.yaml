title:
  tr: Eşcinsellik
  en: Homosexuality
sensitivity: high
helpCard: urgent
verses:
  - 7:80-84
  - 2:286
steelman:
  tr: |
    Cinsel yönelim seçilmez. Ömür boyu bekâr kalmayı şart koşmak adaletsiz görünür ve toplumsal zulüm bazı insanları intihara iter.
  en: Sexual orientation is not chosen. Requiring lifelong celibacy seems unjust, and social cruelty pushes some people toward suicide.
whyAsked:
  tr: |
    İnsanlar bunu kendi kimlikleri, arkadaşları ya da modern ahlâkî kaygı yüzünden sorar.
  en: People ask because of their own identity, because of friends, or out of modern ethical concern.
shortAnswer:
  tr: |
    İslam yönelimi fiilden ayırır; duygular günah değildir. Ana akım İslam hukuku eşcinsel fiilleri yasaklar; küçük bir revizyonist azınlık buna katılmaz. Her insanın Allah'ın verdiği bir onuru vardır. Alay, şiddet ve aile tarafından dışlanma yanlıştır.
  en: Islam separates attraction from acts, and feelings are not sins. Mainstream Islamic law prohibits same-sex acts; a small revisionist minority disagrees. Every person has God-given dignity. Mockery, violence and family rejection are wrong.
layers:
  - kind: religious
    tr: |
      Lût kıssası (7:80–84) klasik olarak erkekler arası eşcinsel fiilleri kınayan bir anlatı olarak okunur. Ebû Hanîfe sabit bir *had* cezası olmadığı görüşündeydi. Scott Kugle (2010) kıssayı tecavüz ve misafirperverlik ihlali hakkında okur. Mobeen Vaid (*AJISS* 34(3), 2017), Kugle'ın hem Kur'an'ı hem İbn Hazm'ı yanlış okuduğunu savunur [Debated].
    en: The story of Lot (Lūṭ) (7:80–84) is classically read as condemning male same-sex acts. Abū Ḥanīfa held that there is no fixed *ḥadd* penalty. Scott Kugle (2010) reads the story as being about rape and inhospitality. Mobeen Vaid (*AJISS* 34(3), 2017) argues that Kugle misreads both the Quran and Ibn Ḥazm [Debated].
  - kind: philosophical
    tr: |
      Ömür boyu bekârlığın farklı türden bir yük olduğu itirazı ciddidir. Tam tatmin edici bir cevabı yoktur. Teolojik cevap, Allah'ın insanları farklı şekillerde imtihan ettiğidir (2:286).
    en: The objection that lifelong celibacy is a different kind of burden is serious. It has no fully satisfying answer. The theological reply is that God tests people differently (2:286).
  - kind: scientific
    tr: |
      Tek bir "eşcinsellik geni" yoktur (Ganna ve ark., *Science* 2019, yaklaşık 500.000 kişi). Dönüşüm terapisi zararlıdır.
    en: There is no single "gay gene" (Ganna et al., *Science* 2019, ~500,000 people). Conversion therapy is harmful.
  - kind: psychological
    tr: |
      Önce güvenlik gelir: Türkiye'de 112 ya da bir kriz hattı.
    en: "Safety comes first: 112 in Türkiye, or a crisis line."
honestLimits:
  tr: |
    Ana akım görüş açıktır ve revizyonist görüş tartışmalı bir azınlıktır. Lût kıssası asla kimseyi insanlıktan çıkarmak için kullanılmamalıdır.
  en: The mainstream position is clear, and the revisionist view is a disputed minority. The story of Lot must never be used to dehumanise anyone.
