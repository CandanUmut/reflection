theme: worship
title:
  tr: Allah'ın ibadetimize neden ihtiyacı var?
  en: Why does God need our worship?
sensitivity: normal
helpCard: false
verses:
  - 51:56-57
  - 35:15
steelman:
  tr: '"Allah kusursuzsa ve hiçbir şeye muhtaç değilse, neden ibadeti emrediyor? Sürekli övgü isteyen bir insan güvensiz biri gibi görünürdü. Ve ibadet yalnızca benim yararımaysa, ibadet etmemek neden — hem de sonsuza dek — cezalandırılıyor da sadece kaçırılmış bir fırsat olarak kalmıyor? Bu bir ilaçtan çok, tehditle desteklenen bir talep gibi görünüyor."'
  en: '"If God is perfect and needs nothing, why command worship at all? A human who demanded constant praise would seem insecure. And if worship is only for my benefit, why is not worshipping punished — even eternally — instead of just being a missed chance? That sounds less like medicine and more like a demand backed by a threat."'
whyAsked:
  tr: Çünkü Kur'an Allah'a övgüyle ve O'na ibadet etme emirleriyle doludur ve modern bir okuyucu bunu bir ihtiyaç olarak duyar. Ve çünkü pek çok insan korku yoluyla öğretilen bir ibadetle yetiştirildi.
  en: Because the Quran is full of praise of God and commands to worship Him, and a modern reader hears that as a need. And because many people were raised on worship taught through fear.
shortAnswer:
  tr: "Kur'an Allah'ın hiçbir şeye muhtaç olmadığı konusunda hemfikirdir: \"Ey insanlar! Siz Allah'a muhtaçsınız. Allah ise zengin ve her hamde lâyıktır.\" (35:15). \"Ben cinleri ve insanları ancak bana ibadet etsinler diye yarattım\" dedikten hemen sonra Allah şöyle der: \"Ben onlardan herhangi bir rızık istemiyorum. Beni yedirmelerini de istemiyorum.\" (51:56–57). Bir kudsî hadiste Allah şöyle der: \"Bana zarar vermeye güç yetiremezsiniz ki bana zarar veresiniz, bana fayda vermeye güç yetiremezsiniz ki bana fayda veresiniz\" (Müslim 2577). İbadet ibadet eden içindir. İslam'da ibadet ayrıca ritüelden çok daha geniştir: İbn Teymiyye onu sözde ve fiilde, içte ve dışta, \"Allah'ın sevdiği ve razı olduğu her şey\" olarak tanımladı — dürüstlük, akrabalık bağlarını sürdürmek, iyilik. Sorunun en zor kısmı, onu ihmal etmenin neden sonuçları olduğudur. Kur'an'ın cevabının bir okuması — âyetlerin kendi sözleri değil, kelâmî bir okuma — sonuçların kişinin ne hâle geldiğini izlediği ve Allah'ın rahmetinin gazabına galip geldiğidir (Buhârî 7404). Bu sayfa bu cevabı ve sınırını ortaya koyuyor."
  en: "The Quran agrees that God needs nothing: \"O mankind, you are those in need of Allah, while Allah is the Free of need, the Praiseworthy\" (35:15). Right after \"I did not create the jinn and mankind except to worship Me\", God says, \"I do not want from them any provision, nor do I want them to feed Me\" (51:56–57). In a hadith qudsi, God says: \"you will not attain harming Me so as to harm Me, and you will not attain benefiting Me so as to benefit Me\" (Muslim 2577). Worship is for the worshipper. In Islam it is also much wider than ritual: Ibn Taymiyya defined it as \"everything that God loves and is pleased with\" in word and deed, inward and outward — honesty, keeping family ties, kindness. The hardest part of the question is why neglecting it has consequences. One reading of the Quran's answer — a theological reading, not the verses' own words — is that consequences follow what a person becomes, and that God's mercy outweighs His wrath (Bukhari 7404). This page states that answer and its limit."
layers:
  - kind: religious
    tr: |
      - *Âyetler:* 51:56 ("Cinleri ve insanları ancak bana ibadet etsinler diye yarattım") hemen ardından "Onlardan bir rızık istemiyorum" (51:57) ile devam eder; 39:7; 31:12.
      - *Hadis:* hadis-i kudsî, Sahîh-i Müslim 2577: bütün yaratılışın takvası Allah'ın mülküne hiçbir şey katmaz; bütün kötülüğü de hiçbir şey eksiltmez.
      - *Klasik:* İbn Abbâs (Taberî aracılığıyla) "bana ibadet etsinler" ifadesini "beni tanısınlar" diye açıklar. Râzî: yaratılışın amacı yaratılanın kemalidir. Gazzâlî (*İhyâ*, Kitâbü'l-Mahabbe): ibadet, ruhun en yüksek mutluluğu olan Allah sevgisine ve marifetine giden yoldur.
      - *Kelâm:* Eş'arîler Allah'ın kendisini tamamlayan bir amaç için iş yaptığını reddeder; Mâtürîdîler yaratıkların yararına bir hikmet (*hikmet*) olduğunu kabul eder. İki taraf da O'nun hiçbir şey kazanmadığında hemfikirdir.
      - *Modern:* Said Nursî (*Sözler*), ibadeti insanlığın asıl vazifesi ve ilahi isimlerin aynası olarak görür; Tim Winter ibadeti parçalanmış benliğin iyileşmesi olarak anlatır.
    en: |-
      - *Verses:* 51:56 ("I did not create jinn and humans except to worship Me") is followed by "I want no provision from them" (51:57); 39:7; 31:12.
      - *Hadith:* ḥadīth qudsī, Ṣaḥīḥ Muslim 2577: all creation's piety adds nothing to God's kingdom; all its wickedness takes nothing away.
      - *Classical:* Ibn ʿAbbās (via al-Ṭabarī) glosses "to worship Me" as "to know Me". Al-Rāzī: creation's purpose is the creature's perfection. Al-Ghazālī (Iḥyāʾ, Kitāb al-Maḥabba): worship is the path to love and knowledge of God, the soul's highest happiness.
      - *Kalam:* Ashʿarīs deny God acts for a purpose completing Him; Māturīdīs affirm wisdom (ḥikma) for creatures' benefit. Both agree He gains nothing.
      - *Modern:* Said Nursi (Sözler) on worship as humanity's true duty and mirror of the divine Names; Tim Winter on worship as healing the fractured self.
  - kind: philosophical
    tr: |
      Şükür, karşılık gören fayda görsün görmesin iyiliğe yakışır. İtiraz: neden sonuçları olan bir yükümlülük? Cevap: sonuçlar ruhun hâlini izler (79:40–41); ihmal kendine zarardır. Geriye kalan: gazap dili kişisel hissettirebilir; "Rahmetim gazabımı geçmiştir" (Buhârî 7404) hadisiyle okunmalıdır.
    en: "Gratitude fits goodness whether or not the recipient benefits. Objection: why obligatory with consequences? Response: consequences follow the soul's state (79:40–41); neglect is self-harm. Residue: wrath language can feel personal; read through \"My mercy outweighs My wrath\" (Bukhārī 7404)."
  - kind: scientific
    tr: |
      [Debated] — mütevazı: şükür ve tefekkür pratikleri, iyi oluşla küçük-orta düzeyde ilişkiler gösterir; bu, pratiklerin yardımcı olabileceğinin delilidir, teolojinin kanıtı değil.
    en: "[Debated, modest] Gratitude and contemplative practices show small-to-moderate wellbeing associations: evidence that practices can help, not proof of theology."
  - kind: psychological
    tr: |
      Korkuya dayalı Allah imgeleri ibadeti bir yatıştırma çabası gibi hissettirir; onu bir ilişki olarak yeniden çerçevelemek gerekir. Geçersiz ibadete dair zorlayıcı korku vesvese olabilir; hayatı aksatıyorsa profesyonel yardım uygundur.
    en: Fear-based God images make worship feel like appeasement; reframe as relationship. Intrusive fear of invalid worship may be vesvese; where it impairs life, professional help is appropriate.
