fullAnswer:
  - kind: heart
    en: |-
      **God's own description of Himself puts mercy first.** "Verily My Mercy overcomes My Anger" ({hadith:bukhari:7404}, Abu Hurayra), written, the hadith says, in a Book "placed with Him on the Throne". If your picture of God is mainly of anger, it is not the picture God gives of Himself.

      **God is near and answers.** "And when My servants ask you, [O Muhammad], concerning Me - indeed I am near. I respond to the invocation of the supplicant when he calls upon Me" (2:186). Worship can begin as conversation, not as fear of punishment.

      **Practical steps.** Start with what draws you, not only with what you fear: thanking God for one thing each day; a short *duʿāʾ* in your own words; reading verses about mercy. If fear of God becomes constant anxiety, with checking and repeating, that may be religious OCD; the International OCD Foundation (iocdf.org) describes it and its treatment.
    tr: |-
      **Allah'ın kendisini tarifi rahmeti öne koyar.** "Şüphesiz rahmetim gazabıma galip gelir" ({hadith:bukhari:7404}, Ebû Hüreyre); hadise göre "Arş'ın üzerinde O'nun katında bulunan" bir Kitapta yazılmıştır. Allah hakkındaki tablon esas olarak öfkeden oluşuyorsa, bu Allah'ın kendisi hakkında verdiği tablo değildir.

      **Allah yakındır ve cevap verir.** "Şayet kullarım, sana benden sordularsa, gerçekten ben çok yakınımdır. Bana dua edince, duacının duasını kabul ederim." (2:186). İbadet ceza korkusuyla değil, bir konuşma olarak başlayabilir.

      **Pratik adımlar.** Yalnızca korktuğun şeyle değil, seni çeken şeyle başla: her gün bir şey için Allah'a şükretmek; kendi sözlerinle kısa bir *dua*; rahmetle ilgili âyetleri okumak. Allah korkusu kontrol etme ve tekrarlamayla birlikte sürekli bir kaygıya dönüşürse, bu dinî OKB olabilir; Uluslararası OKB Vakfı (iocdf.org) onu ve tedavisini anlatır.
    title:
      en: Korkuyla yetiştirildiysen
      tr: Korkuyla yetiştirildiysen
  - kind: quran
    en: |-
      **The purpose, and the denial of need (51:56–57).** "And I did not create the jinn and mankind except to worship Me. I do not want from them any provision, nor do I want them to feed Me" (51:56–57), Meccan. In the same breath that names worship as the purpose of creation, God denies that He needs anything from it.

      **Need is on our side (35:15).** "O mankind, you are those in need of Allah, while Allah is the Free of need, the Praiseworthy" (35:15), Meccan. *Al-Ghanī*, "the Free of need", and *al-Ḥamīd*, "the Praiseworthy": God is worthy of praise whether or not anyone praises Him.

      **Gratitude (14:7).** "And [remember] when your Lord proclaimed, 'If you are grateful, I will surely increase you [in favor]; but if you deny, indeed, My punishment is severe'" (14:7), Meccan, in Moses' (pbuh) words to his people. Gratitude increases the one who is grateful.
    tr: |-
      **Amaç ve ihtiyacın reddi (51:56–57).** "Ben cinleri ve insanları ancak bana ibadet etsinler diye yarattım. Ben onlardan herhangi bir rızık istemiyorum. Beni yedirmelerini de istemiyorum." (51:56–57), Mekkî. İbadeti yaratılışın amacı olarak adlandırdığı aynı nefeste Allah ondan hiçbir şeye ihtiyacı olmadığını söyler.

      **İhtiyaç bizim tarafımızdadır (35:15).** "Ey insanlar! Siz Allah'a muhtaçsınız. Allah ise zengin ve her hamde lâyıktır." (35:15), Mekkî. *El-Ğanî*, "zengin, hiçbir şeye muhtaç olmayan", ve *el-Hamîd*, "her hamde lâyık olan": Allah, biri O'nu övse de övmese de övgüye lâyıktır.

      **Şükür (14:7).** "Ve hatırlayın ki Rabbiniz size şöyle bildirmişti: Yüceliğim hakkı için şükrederseniz elbette size (nimetimi) artırırım ve eğer nankörlük ederseniz hiç şüphesiz azabım çok şiddetlidir." (14:7), Mekkî, Hz. Mûsâ'nın (a.s.) kavmine sözlerinde. Şükür, şükredeni artırır.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: scholars
    en: |-
      **Ibn Kathir.** "I, Allah, only created them so that I order them to worship Me, not that I need them." He reports Ibn ʿAbbas: "So that they worship Me, willingly or unwillingly." He also cites a hadith in which God says: "O Son of Adam! "O son of Adam! Devote yourself to My worship, I will fill your chest with riches and alleviate your poverty" ({hadith:tirmidhi:2466}; al-Tirmidhi: *ḥasan gharīb*; al-Albani: *ṣaḥīḥ*).

      **Al-Jalālayn.** It addresses the obvious objection — that many do not worship — and says "the fact that disbelievers do not worship God does not contradict this statement", comparing it to a pencil sharpened for writing: its purpose is writing, even if it is never used.

      **Other readings, not yet checked.** On the Ibn Kathir page read, that gloss does not appear; the phrase "to recognize Me, serve Me" appears in a different commentary (*al-Muntakhab*) on the same page.

      **What *ʿibāda* covers.** Ibn Taymiyya, in his treatise *al-ʿUbūdiyya*, defined worship as "a collective term for everything that God loves and is pleased with, whether of outward or inward sayings and actions" (Nadwi's rendering). On this view, worship includes prayer, fasting, almsgiving and pilgrimage, but also truthfulness, trustworthiness, dutifulness to parents, keeping family ties, kindness and good character (Nadwi). Worship is not a slice of life; it is a way of living all of it.

      **Kalām on God's purposes.** (*Kalām* is Islamic rational theology.) No source on this difference was read.
    tr: |-
      **İbn Kesîr.** "Ben, Allah, onları ancak bana ibadet etmelerini emredeyim diye yarattım; onlara ihtiyacım olduğu için değil." İbn Abbâs'tan şunu aktarır: "Bana ibadet etsinler diye, isteyerek ya da istemeyerek." Ayrıca Allah'ın şöyle buyurduğu bir hadis zikreder: "Ey Âdemoğlu! Kendini bana ibadete ver, göğsünü zenginlikle doldurayım ve fakirliğini gidereyim" (Ahmed, Tirmizî ve İbn Mâce kaydetmiştir; Tirmizî 2466, Ebû Hüreyre'den (r.a.); Tirmizî: *hasen garîb*; Elbânî: *sahih*, hadithunlocked'a göre).

      ***Celâleyn*.** Açık itiraza — pek çok kişinin ibadet etmediğine — değinir ve "kâfirlerin Allah'a ibadet etmemesinin bu ifadeyle çelişmediğini" söyler; bunu yazmak için açılmış bir kaleme benzetir: Hiç kullanılmasa bile amacı yazmaktır.

      **Henüz kontrol edilmemiş başka okumalar.** Okunan İbn Kesîr sayfasında bu açıklama yer almıyor; "beni tanısınlar, bana kulluk etsinler" ifadesi aynı sayfada farklı bir tefsirde (*el-Muntehab*) geçiyor.

      ***İbadet* neyi kapsar?** İbn Teymiyye, *el-Ubûdiyye* risalesinde ibadeti "Allah'ın sevdiği ve razı olduğu, dış ya da iç sözlerden ve fiillerden her şey için toplu bir isim" olarak tanımladı (Nedvî'nin aktarımı). Bu görüşe göre ibadet namazı, orucu, zekâtı ve haccı, ama aynı zamanda doğruluğu, güvenilirliği, anne babaya iyiliği, akrabalık bağlarını sürdürmeyi, iyiliği ve güzel ahlakı da içerir (Nedvî). İbadet hayatın bir dilimi değildir; hayatın tamamını yaşamanın bir yoludur.

      **Allah'ın fiillerindeki amaçlar konusunda kelâm.** (*Kelâm*, İslam'ın akli ilahiyatıdır.) Bu fark hakkında hiçbir kaynak okunmadı.
    title:
      en: Müfessirler "bana ibadet etsinler" ifadesini nasıl okudu?
      tr: Müfessirler "bana ibadet etsinler" ifadesini nasıl okudu?
  - kind: reasoning
    en: |-
      **1. Praise that fits, not praise that is needed.** We praise a beautiful piece of music not because the composer needs it, but because praise is the fitting response to what is good. On the Islamic view, God is the source of every good; praising Him is seeing things as they are. That is why the Quran calls God *al-Ḥamīd*, "the Praiseworthy" — worthy of praise — while also saying He is "Free of need" (35:15).

      **2. Worship serves the worshipper.** Like medicine, it is for the patient, not the doctor. Gratitude increases the grateful (14:7). Remembering God reorients a person away from the self. Ibn Kathir's hadith puts it in God's words: "I will fill your chest with riches".

      **3. A God who invites worship differs from a human who demands it.** A human who demands constant praise is insecure because he needs it. God, by His own statement, gains nothing from it (Muslim 2577). The structure is the opposite: the human is the one in need.

      *Limit:* this answer works for someone who already accepts that God is good. For someone who doubts that, the commands to worship can still sound like demands.
    tr: |-
      **1. İhtiyaç duyulan değil, yakışan övgü.** Güzel bir müzik eserini, bestecinin buna ihtiyacı olduğu için değil, övgü iyi olana yakışan karşılık olduğu için överiz. İslami görüşe göre Allah her iyiliğin kaynağıdır; O'nu övmek şeyleri oldukları gibi görmektir. Kur'an'ın Allah'ı hem "zengin" (hiçbir şeye muhtaç olmayan) hem de *el-Hamîd*, "her hamde lâyık" olarak adlandırmasının sebebi budur (35:15).

      **2. İbadet ibadet edene hizmet eder.** İlaç gibi, doktor için değil, hasta içindir. Şükür şükredeni artırır (14:7). Allah'ı anmak kişiyi benlikten uzaklaştırarak yeniden yönlendirir. İbn Kesîr'in hadisi bunu Allah'ın sözleriyle ifade eder: "göğsünü zenginlikle doldurayım".

      **3. İbadete davet eden bir Allah, onu talep eden bir insandan farklıdır.** Sürekli övgü talep eden bir insan ona ihtiyacı olduğu için güvensizdir. Allah, kendi ifadesiyle, ondan hiçbir şey kazanmaz (Müslim 2577). Yapı tam tersidir: Muhtaç olan insandır.

      *Sınır:* Bu cevap Allah'ın iyi olduğunu zaten kabul eden biri için işler. Bundan şüphe eden biri için ibadet emirleri yine de talep gibi gelebilir.
    title:
      en: Allah hiçbir şeye muhtaç değilse, neden ibadet?
      tr: Allah hiçbir şeye muhtaç değilse, neden ibadet?
  - kind: objection
    en: |-
      **The objection in full.** If I skip medicine, I just stay ill; the doctor does not punish me. If worship is only for my good, why does the Quran attach severe, even eternal, consequences to neglecting it?

      **The reply.**
      1. *Consequences follow what a person becomes.* "But as for he who feared the position of his Lord and prevented the soul from [unlawful] inclination, Then indeed, Paradise will be [his] refuge" (79:40–41). On one reading (a modern theological reading; no named holder was read), the Hereafter is the result of the self one has made: a person who turns away from God for a lifetime becomes someone turned away. The Quran itself also speaks of recompense (*jazāʾ*), so this reading does not exhaust it.
      2. *Ingratitude is not neutral.* 14:7 sets gratitude and denial side by side. To deny the source of every good is not only to miss a benefit; it is to wrong the truth.
      3. *Mercy is greater.* "Verily My Mercy overcomes My Anger" (Bukhari 7404). The Quran's warnings are real, but they sit inside a frame in which mercy prevails.
      4. *The account is of your own deeds.* "it is but your deeds that I account for you, and then recompense you for. So he who finds good, let him praise Allah" (al-Nawawi's Forty, no. 24, from Muslim 2577).

      *Limit:* the language of wrath and eternal punishment in the Quran is strong, and some readers will still find it hard to reconcile with the "medicine" picture. This page does not remove that difficulty; it shows how the tradition holds the two together.

      **"What does 'neglect is self-harm' mean in concrete terms?"** A person who never pauses to thank, never turns from the self, never holds back from wrong for God's sake, gradually becomes harder, more anxious and more self-centred — the reverse of the "riches" of the chest Ibn Kathir's hadith promises. That is a moral and spiritual claim, not a measured one.
    tr: |-
      **İtirazın tamamı.** İlacı atlarsam sadece hasta kalırım; doktor beni cezalandırmaz. İbadet yalnızca benim iyiliğim içinse, Kur'an onu ihmal etmeye neden ağır, hatta ebedî sonuçlar bağlıyor?

      **Cevap.**
      1. *Sonuçlar kişinin ne hâle geldiğini izler.* "Kim de Rabbinin divanında durmaktan korkmuş, nefsini boş heveslerden menetmiş ise, Kuşkusuz onun varacağı yer cennettir." (79:40–41). Bir okumaya göre (modern bir kelâmî okuma; adı belli hiçbir savunucusu okunmadı), ahiret kişinin kendinden yaptığı benliğin sonucudur: Bir ömür boyu Allah'tan yüz çeviren biri yüz çevirmiş biri olur. Kur'an'ın kendisi de karşılıktan (*cezâ*) söz eder; dolayısıyla bu okuma onu tüketmez.
      2. *Nankörlük tarafsız değildir.* 14:7 şükrü ve nankörlüğü yan yana koyar. Her iyiliğin kaynağını inkâr etmek yalnızca bir yararı kaçırmak değildir; hakikate haksızlık etmektir.
      3. *Rahmet daha büyüktür.* "Şüphesiz rahmetim gazabıma galip gelir" (Buhârî 7404). Kur'an'ın uyarıları gerçektir, ama rahmetin galip geldiği bir çerçevenin içindedir.
      4. *Hesap senin kendi amellerindir.* "Bunlar ancak sizin amellerinizdir; onları sizin için sayarım, sonra size karşılığını veririm. Kim hayır bulursa Allah'a hamdetsin" (Nevevî'nin Kırk Hadis'i, no. 24, Müslim 2577'den).

      *Sınır:* Kur'an'daki gazap ve ebedî ceza dili güçlüdür ve bazı okuyucular onu yine de "ilaç" tablosuyla bağdaştırmayı zor bulacaktır. Bu sayfa bu güçlüğü ortadan kaldırmıyor; geleneğin ikisini nasıl bir arada tuttuğunu gösteriyor.

      **"İhmalin kendine zarar olması somut olarak ne demek?"** Hiç şükretmek için durmayan, hiç benlikten yüz çevirmeyen, Allah için hiç yanlıştan geri durmayan biri yavaş yavaş daha katı, daha kaygılı ve daha bencil olur — İbn Kesîr'in hadisinin vaat ettiği göğsün "zenginliğinin" tersi. Bu ölçülmüş değil, ahlaki ve manevi bir iddiadır.
    title:
      en: '"Benim yararımaysa, ibadet etmemek neden cezalandırılıyor?"'
      tr: '"Benim yararımaysa, ibadet etmemek neden cezalandırılıyor?"'
  - kind: science
    en: No study was read, so the claim is not repeated here.
    tr: Hiçbir çalışma okunmadı, dolayısıyla iddia burada tekrarlanmıyor.
    title:
      en: Araştırmalar ne gösteriyor?
      tr: Araştırmalar ne gösteriyor?
  - kind: views
    en: |-
      - **Quran and hadith** — God is free of need; worship is for humans (35:15; 51:57; Muslim 2577).
      - **Ibn Taymiyya** — worship covers all that God loves, inward and outward.
      - **Ashʿaris and Maturidis** — differ on whether God's acts have purposes; agree He gains nothing.
      - **Critics** — commanded worship backed by punishment looks like a demand, not a gift.
    tr: |-
      - **Kur'an ve hadis** — Allah hiçbir şeye muhtaç değildir; ibadet insanlar içindir (35:15; 51:57; Müslim 2577).
      - **İbn Teymiyye** — ibadet Allah'ın sevdiği her şeyi, içte ve dışta, kapsar.
      - **Eş'arîler ve Mâtürîdîler** — Allah'ın fiillerinin amaçları olup olmadığı konusunda ayrılırlar; O'nun hiçbir şey kazanmadığında hemfikirdirler.
      - **Eleştirmenler** — cezayla desteklenen emredilmiş ibadet bir armağandan çok bir talep gibi görünür.
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: If worship is only for my benefit, why is not worshipping punished?
      tr: İbadet yalnızca benim yararımaysa, ibadet etmemek neden cezalandırılıyor?
    a:
      en: Because, in the Quran's picture, the Hereafter is the outcome of the self one becomes (79:40–41), denying the source of good is a wrong (14:7), and mercy still outweighs wrath (Bukhari 7404). The difficulty does not disappear entirely.
      tr: Çünkü Kur'an'ın tablosunda ahiret kişinin ne hâle geldiğinin sonucudur (79:40–41), iyiliğin kaynağını inkâr etmek bir haksızlıktır (14:7) ve rahmet yine de gazaba galip gelir (Buhârî 7404). Güçlük tamamen ortadan kalkmıyor.
  - q:
      en: Why does the Quran call God "the Praiseworthy" if He does not want praise?
      tr: Allah övgü istemiyorsa, Kur'an neden O'nu "her hamde lâyık" olarak adlandırıyor?
    a:
      en: Because He is worthy of praise whether or not anyone praises Him (35:15). Praise is the fitting response to the good, not a supply God needs.
      tr: Çünkü biri O'nu övse de övmese de övgüye lâyıktır (35:15). Övgü iyi olana yakışan karşılıktır, Allah'ın ihtiyaç duyduğu bir erzak değil.
  - q:
      en: What does "neglect is self-harm" mean in concrete terms?
      tr: '"İhmal kendine zarardır" somut olarak ne demek?'
    a:
      en: That a life without gratitude, remembrance or restraint shapes a person into someone narrower and harder — the opposite of the "riches" of the chest God promises the worshipper (Ibn Kathir's hadith).
      tr: Şükürsüz, zikirsiz ya da kendini tutmadan geçen bir hayatın kişiyi daha dar ve daha katı biri hâline getirdiği — Allah'ın ibadet edene vaat ettiği göğsün "zenginliğinin" tersi (İbn Kesîr'in hadisi).
  - q:
      en: What does *ʿibāda* cover?
      tr: "*İbadet* neyi kapsar?"
    a:
      en: 'Ibn Taymiyya: "everything that God loves and is pleased with", outward and inward — from prayer to honesty and kindness to parents.'
      tr: "İbn Teymiyye: \"Allah'ın sevdiği ve razı olduğu her şey\", dışta ve içte — namazdan dürüstlüğe ve anne babaya iyiliğe kadar."
  - q:
      en: What are Ashʿarīs, Māturīdīs, *kalām* and a hadith qudsi?
      tr: Eş'arîler, Mâtürîdîler, *kelâm* ve kudsî hadis nedir?
    a:
      en: "*Kalām*: Islamic rational theology. The Ashʿaris and Maturidis: its two main Sunni schools. A hadith qudsi: a saying the Prophet (pbuh) attributes to God, in the Prophet's own words, distinct from the Quran."
      tr: "*Kelâm*: İslam'ın akli ilahiyatı. Eş'arîler ve Mâtürîdîler: onun iki ana Sünnî mezhebi. Kudsî hadis: Hz. Peygamber'in (s.a.v.) kendi sözleriyle Allah'a nispet ettiği, Kur'an'dan ayrı bir söz."
  - q:
      en: What does *taʿabbudī* mean?
      tr: "*Teabbüdî* ne demek?"
    a:
      en: An act of worship whose form is followed as devotion, even where its full reason is not stated (e.g. the number of units in a prayer).
      tr: Tam sebebi bildirilmemiş olsa bile biçimine ibadet olarak uyulan bir ibadet (ör. bir namazdaki rekât sayısı).
