honestLimits:
  tr: |
    Yetiştirilme inancı gerçekten şekillendirir. *Fıtrat* verilerle uyuşur ama onlarla kanıtlanmaz.
  en: Upbringing does shape belief, and examining one's faith cannot remove that influence entirely. *Fiṭra* fits the research on children, but the research does not prove it. Barrett's book and the Pew paper's full methods were read only through summaries. Ibn Taymiyya's *Darʾ*, cited on the current page, was not read.
