id: Q26
slugs:
  tr: inanc-yetistirilme-mi
  en: belief-and-upbringing
order: 26
theme: god
title:
  tr: İnanç sadece yetiştirilme tarzının sonucu değil mi?
  en: Isn't belief just upbringing?
sensitivity: normal
helpCard: false
verses:
  - 2:170
  - 30:30
steelman:
  tr: |
    Tamil Nadu'da doğsaydım Hindu olurdum. İnanç doğum yerini izliyor.
  en: If I had been born in Tamil Nadu, I would be Hindu. Belief tracks birthplace.
whyAsked:
  tr: |
    Üniversite öğrencileri arasında yaygındır.
  en: It is common among university students.
shortAnswer:
  tr: |
    Bir inancın nasıl ortaya çıktığı, doğru olup olmadığına karar vermez; öyle varsaymak köken safsatasıdır. Kur'an'ın kendisi de atalardan devralınan imanı kınar (2:170; 43:22–23). Allah'a doğal bir açıklık, *fıtrata*, yani doğuştan gelen yatkınlığa uyar. Asıl soru, şimdi sebeplerinin olup olmadığıdır.
  en: How a belief arose does not settle whether it is true; assuming it does is the genetic fallacy. The Quran itself rebukes inherited faith (2:170; 43:22–23). A natural openness to God fits *fiṭra*, the innate disposition. The real question is whether you have reasons now.
layers:
  - kind: religious
    tr: |
      Fıtrat için bkz. 30:30 ve Buhârî 1385. Gazzâlî'nin kendi şüphesi tam olarak bu soruyla başladı (*Munkız*).
    en: On *fiṭra*, see 30:30 and Bukhārī 1385. Al-Ghazālī's own doubt began with exactly this question (*Munqidh*).
  - kind: philosophical
    tr: |
      Çürütme argümanları gereğinden fazlasını kanıtlar. Barrett (2012), çocukların inanmaya yatkın olduğunu, ama belirli bir dinî ya da teolojik geleneğe yatkın olmadığını bulur.
    en: Debunking arguments prove too much. Barrett (2012) finds children are inclined to believe, though not in any specific religious or theological tradition.
  - kind: scientific
    tr: |
      Analitik düşünmenin inancı azalttığı iddiası büyük bir tekrar çalışmasında tutmadı (Sanchez ve ark., *PLOS ONE* 2017).
    en: The claim that analytic thinking reduces belief did not hold up in a large replication (Sanchez et al., *PLOS ONE* 2017).
  - kind: psychological
    tr: |
      İmanı sahiplenmek, gelişimin normal bir evresidir.
    en: Owning one's faith is a normal stage of development.
honestLimits:
  tr: |
    Yetiştirilme inancı gerçekten şekillendirir. *Fıtrat* verilerle uyuşur ama onlarla kanıtlanmaz.
  en: Upbringing does shape belief. *Fiṭra* fits the data but is not proven by it.
visualizations:
  - id: ideas
    tr: |
      "İki yol." Bir test. Tohum, toprak ve bahçıvan kartı.
    en: '"Two roads." A quiz. A seed, soil and gardener card.'
