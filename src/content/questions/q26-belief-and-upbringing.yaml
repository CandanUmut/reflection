steelman:
  tr: |
    Tamil Nadu'da doğsaydım Hindu olurdum. İnanç doğum yerini izliyor.
  en: "\"If I had been born in Tamil Nadu, I would almost certainly be Hindu; in Utah, a Mormon; in Riyadh, a Muslim. My reasons feel convincing to me, but a Hindu's reasons feel convincing to him. So my feeling that my reasons are good is exactly what I would have if my belief came only from my upbringing. Saying 'that's the genetic fallacy' misses the point: I'm not saying my belief is false because of where it came from — I'm saying I have no way of telling, from the inside, whether my reasons are real or just my upbringing talking.\""
whyAsked:
  tr: |
    Üniversite öğrencileri arasında yaygındır.
  en: University students meet people raised in other faiths, often for the first time, and notice how much of their own belief came with their family. The question is sharper for Muslims because the Quran itself criticises people who follow their fathers' religion.
shortAnswer:
  tr: |
    Bir inancın nasıl ortaya çıktığı, doğru olup olmadığına karar vermez; öyle varsaymak köken safsatasıdır. Kur'an'ın kendisi de atalardan devralınan imanı kınar (2:170; 43:22–23). Allah'a doğal bir açıklık, *fıtrata*, yani doğuştan gelen yatkınlığa uyar. Asıl soru, şimdi sebeplerinin olup olmadığıdır.
  en: "Upbringing shapes belief strongly; the data and the Prophet (pbuh) both say so. The weak form of the objection (\"where a belief came from shows it is false\") is a fallacy. The strong form (\"I can't tell whether my reasons are real\") is serious, and it is the question al-Ghazali faced in the eleventh century: he saw that \"Christian youths always grew up to be Christians, Jewish youths to be Jews and Muslim youths to be Muslims\", doubted everything he had inherited, and came out with a faith he had tested. The answer is not to stop believing — the same doubt would undermine moral, political and even atheist beliefs, which are also shaped by upbringing — but to examine one's reasons. The Quran rebukes not inherited belief as such, but refusing to look at evidence because \"we found our fathers\" doing otherwise (2:170; 43:22–24). And most classical theologians held that the faith of someone who has not reasoned it through is still valid, though they urged people to think."
