honestLimits:
  tr: "Zor problem bir ruhun var olduğunu ispat etmez; fizikalist açıklamanın tamamlanmadığını gösterir. Bilimsel teoriler hızla değişiyor. Ruh üzerine klasik İslami tartışma burada okunabilenden çok daha zengindir: Kelâm görüşleri, *Kitâbü'r-Rûh*'un tamamı ve 17:85'in tam tefsiri yalnızca özetler aracılığıyla okundu. Cogitate sonuçları makaleden değil, bir basın bülteninden alındı."
  en: "The hard problem does not prove that a soul exists; it shows that the physicalist explanation is not complete. The scientific theories are changing quickly. The classical Islamic discussion of the soul is much richer than what could be read here: the kalam positions, the full *Kitāb al-Rūḥ*, and the full tafsir of 17:85 were read only through summaries. The Cogitate results come from a press release, not the paper."
