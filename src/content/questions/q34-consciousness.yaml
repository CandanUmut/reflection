steelman:
  tr: "\"Sinirbilim her yıl daha fazlasını açıklıyor. Beynin bir bölümüne zarar verin, kişi yüzleri tanıma yeteneğini kaybeder; bir başkasına zarar verin, kişiliği değişir. Anestezi bilinci dakikalar içinde kapatır. İlaçlar ruh hâlini, hafızayı, hatta ahlaki yargıyı değiştirir. Benlik kimyasallar ve yaralanmalarla karartılabiliyor, bölünebiliyor ve değiştirilebiliyorsa, benlik beyindir. 'Ruh', henüz açıklayamadığımız şeyin adıdır — bilim büyüdükçe küçülecek bir 'boşlukların ruhu'. Bir gün bir makine bilinçliymiş gibi davranırsa, ruha yapacak bir şey kalmayacak.\""
  en: "\"Every year neuroscience explains more. Damage one part of the brain and a person loses the ability to recognise faces; damage another and their personality changes. Anaesthesia switches consciousness off in minutes. Drugs change mood, memory and even moral judgement. If the self can be dimmed, split and altered by chemicals and injuries, then the self *is* the brain. 'Soul' is a word for what we have not yet explained — a soul of the gaps that will shrink as science grows. And if a machine one day acts conscious, the soul will have nothing left to do.\""
whyAsked:
  tr: Sinirbilim ve yapay zekâ her gün haberlerde ve pek çok insan bu soruyla bir psikoloji ya da biyoloji dersinde karşılaşıyor. Başkaları onunla bir hastane yatağının başında, demansın bir annenin ya da babanın hafızasını alıp götürüşünü izlerken karşılaşıyor.
  en: Neuroscience and artificial intelligence are in the news every day, and many people meet the question in a psychology or biology course. Others meet it at a hospital bedside, watching dementia take away a parent's memory.
shortAnswer:
  tr: "Zihnin beyne bağlı olduğuna dair delil güçlüdür ve hiçbir dürüst cevap bunu inkâr etmez. Bilimin açıklayamadığı şey, bu beyin faaliyetinin neden *yaşandığı*, yani içeriden neden hissedildiğidir — filozof David Chalmers'ın \"tecrübe problemi\", yani zor problem dediği şey. Önde gelen bilimsel teoriler hâlâ sınanıyor ve 2025'teki bir testte iki ana teoriden hiçbiri bütün öngörülerini doğrulatamadı. Filozofların yaklaşık yarısı fizikalizmi kabul ediyor, yaklaşık üçte biri reddediyor (PhilPapers 2020). Kur'an *rûh*'un (ruh) \"Rabbimin bildiği bir iş\" olduğunu ve insana verilen ilmin \"az bir şey\" olduğunu söyler (17:85); İbn Kayyim gibi klasik âlimler ruhun yaratılmış ve Allah'a bağlı olduğunu, bedenle birleştiğini kabul etti. Zihnin beyne bağlı olması bu görüşe de uyar: Bir bedenle birleşmiş bir ruh onun aracılığıyla iş görür. Zor problem bir ruhun varlığını ispat etmez; \"madde zihni açıklar\" iddiasının da ispat edilmediğini gösterir."
  en: 'The evidence that the mind depends on the brain is strong, and no honest answer denies it. What science has not explained is why any of this brain activity is *experienced* at all — what the philosopher David Chalmers called "the problem of experience", or the hard problem. The leading scientific theories are still being tested, and in a 2025 test neither of the two main theories passed all its predictions. Among philosophers, about half accept physicalism and about a third reject it (PhilPapers 2020). The Quran says that the *rūḥ* (spirit or soul) "is of the affair of my Lord" and that human knowledge is "a little" (17:85); classical scholars such as Ibn al-Qayyim held that the soul is created and depends on God, and is joined to the body. Dependence of the mind on the brain fits that view too: a soul joined to a body acts through it. The hard problem does not prove a soul; it shows that "matter explains the mind" has not been shown either.'
