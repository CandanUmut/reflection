steelman:
  tr: |
    Eski metinler değişir. Kur'an Muhammed'in vefatından sonra toplandı, Osman tarafından standartlaştırıldı ve rakip nüshalar yakıldı.
  en: "\"Muslims say not a letter of the Quran has changed. But the early sources themselves say that the caliph ʿUthman had the other copies burned, that the Companion Ibn Masʿud had a copy without the first and last two suras, that a verse on stoning was once recited and is not in the book, and that there are different 'readings' still recited today. The oldest manuscripts show variants. How is that 'preserved'?\""
whyAsked:
  tr: |
    İnternetteki polemikler ve Kur'an ile hadisin güvenilirliğini birbirine karıştıran Türk Kur'ancı tartışmaları.
  en: Christian and atheist critics raise it; Muslims hear the strong claim "not a letter changed" and then discover the early history.
shortAnswer:
  tr: |
    Aktarım başından itibaren hem sözlü hem yazılıydı. Birmingham yapraklarının parşömeni, %95,4 olasılıkla MS 568–645 arasına, yani Hz. Peygamber'in hayatına yakın bir döneme radyokarbonla tarihlendi. İlmî çalışmalar, belgelenmiş kıraat farklarıyla birlikte istikrarlı bir ünsüz metin bulur. "Hiçbir yazmada tek bir harf bile farklı değildir" demek abartıdır.
  en: "The Quran's text was fixed very early: manuscripts radiocarbon-dated to within a few decades of the Prophet's (pbuh) death match the standard text closely, and the tradition itself records, openly, how it was collected under Abu Bakr and standardised under ʿUthman. Preservation in the classical Muslim sense does not mean that no other wording ever existed. The tradition records early variant copies (such as Ibn Masʿud's), verses reported as no longer recited, and several accepted ways of reading the same consonantal text (*qirāʾāt*). An early witness from outside the ʿUthmanic line, the lower text of the Sanaa palimpsest, has variants in wording and sura order; *Wikipedia* judges, without a citation, that they \"rarely diverge from the fundamental meaning\". So \"not a letter has changed since ʿUthman\" is close to the evidence; \"there were never any variants\" is not."
