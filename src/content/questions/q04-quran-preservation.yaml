  en: quran-preservation
order: 4
theme: quran
title:
  tr: Kur'an korundu mu?
  en: Was the Quran preserved?
sensitivity: normal
helpCard: false
verses:
  - 15:9
steelman:
  tr: |
    Eski metinler değişir. Kur'an Muhammed'in vefatından sonra toplandı, Osman tarafından standartlaştırıldı ve rakip nüshalar yakıldı.
  en: Ancient texts change. The Quran was collected after Muhammad's death, standardized by Uthman, and rival codices were burned.
whyAsked:
  tr: |
    İnternetteki polemikler ve Kur'an ile hadisin güvenilirliğini birbirine karıştıran Türk Kur'ancı tartışmaları.
  en: Online polemics, and Turkish Quranist debates that blur the reliability of Quran and hadith.
shortAnswer:
  tr: |
    Aktarım başından itibaren hem sözlü hem yazılıydı. Birmingham yapraklarının parşömeni, %95,4 olasılıkla MS 568–645 arasına, yani Hz. Peygamber'in hayatına yakın bir döneme radyokarbonla tarihlendi. İlmî çalışmalar, belgelenmiş kıraat farklarıyla birlikte istikrarlı bir ünsüz metin bulur. "Hiçbir yazmada tek bir harf bile farklı değildir" demek abartıdır.
  en: Transmission was oral and written from the start. The parchment of the Birmingham folios is radiocarbon-dated to 568–645 CE with 95.4% probability, close to the Prophet's lifetime. Scholarship finds a stable consonantal text with documented variant readings. "Not one letter differs in any manuscript" overstates the case.
layers:
  - kind: religious
    tr: |
      - 15:9 korunmayı vaat eder.
      - Ebû Bekir ve Osman dönemindeki cem çalışmaları Buhârî 4986 ve 4987'de aktarılır.
      - Mütevatir kıraatler, inen okuma biçimleri olarak kabul edilir. [Scholarly]
    en: |-
      - 15:9 promises preservation.
      - The collections under Abu Bakr and Uthman are reported in Bukhari 4986 and 4987.
      - The canonical qirā'āt are regarded as revealed modes. [Scholarly]
  - kind: history
    tr: |
      - Birmingham yaprakları (Mingana 1572a), Hicazî yazıyla 18–20. sûrelerin bazı bölümlerini içerir.
      - Tarih mürekkebe değil, deriye aittir; kütüphane yazmayı 7. yüzyılın ortası olarak kataloglar.
      - Small, asıl metnin tam olarak yeniden kurulamayacağını savunur; Donner ise bunu temkinli bulur. [Debated]
    en: |-
      - The Birmingham leaves (Mingana 1572a) contain parts of suras 18–20 in Hijazi script.
      - The date applies to the skin, not the ink; the library catalogues the manuscript as mid-7th century.
      - Small argues the original text cannot be fully reconstructed, while Donner calls this tentative. [Debated]
  - kind: scientific
    tr: |
      1461±21 BP (OxA-29418). [Established]
    en: 1461±21 BP (OxA-29418). [Established]
  - kind: psychological
    tr: |
      Üç soruyu (korunma, kimin sözü olduğu, yorum) birbirinden ayırmak kaygıyı azaltır.
    en: Separating three questions (preservation, authorship, interpretation) lowers anxiety.
honestLimits:
  tr: |
    İbn Mes'ûd'unki gibi erken mushaflar küçük farklılıklar gösterir.
  en: Early codices such as Ibn Mas'ud's differ slightly.
