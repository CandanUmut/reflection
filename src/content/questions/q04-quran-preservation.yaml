steelman:
  tr: "\"Müslümanlar Kur'an'ın tek bir harfinin bile değişmediğini söylüyor. Ama erken dönem kaynakların kendisi, halife Osman'ın diğer nüshaları yaktırdığını, sahâbî İbn Mes'ûd'un ilk ve son iki sûreyi içermeyen bir nüshası olduğunu, recmle ilgili bir âyetin bir zamanlar okunduğunu ve kitapta olmadığını ve bugün hâlâ okunan farklı 'kıraatler' bulunduğunu söylüyor. En eski el yazmaları farklılıklar gösteriyor. Bu nasıl 'korunmuş' oluyor?\""
  en: "\"Muslims say not a letter of the Quran has changed. But the early sources themselves say that the caliph ʿUthman had the other copies burned, that the Companion Ibn Masʿud had a copy without the first and last two suras, that a verse on stoning was once recited and is not in the book, and that there are different 'readings' still recited today. The oldest manuscripts show variants. How is that 'preserved'?\""
whyAsked:
  tr: Hristiyan ve ateist eleştirmenler bunu gündeme getirir; Müslümanlar "tek bir harf bile değişmedi" şeklindeki güçlü iddiayı duyar ve sonra erken dönem tarihini keşfeder.
  en: Christian and atheist critics raise it; Muslims hear the strong claim "not a letter changed" and then discover the early history.
shortAnswer:
  tr: "Kur'an'ın metni çok erken sabitlendi: Radyokarbon yöntemiyle Hz. Peygamber'in (s.a.v.) vefatından sonraki birkaç on yıl içine tarihlenen el yazmaları standart metinle yakından örtüşür ve geleneğin kendisi, metnin Hz. Ebû Bekir döneminde nasıl toplandığını ve Hz. Osman döneminde nasıl standart hâle getirildiğini açıkça kaydeder. Klasik Müslüman anlamında korunmuşluk, başka hiçbir lafzın hiç var olmadığı anlamına gelmez. Gelenek erken dönemdeki farklı nüshaları (İbn Mes'ûd'unki gibi), artık okunmadığı bildirilen âyetleri ve aynı ünsüz metnin birkaç kabul görmüş okunuş biçimini (*kırâat*) kaydeder. Osman nüshası çizgisinin dışından erken bir tanık olan San'â palimpsestinin alt metni, lafızda ve sûre sıralamasında farklılıklar içerir; *Wikipedia*, kaynak göstermeden, bunların \"temel anlamdan nadiren saptığı\" kanaatindedir. Yani \"Osman'dan beri tek bir harf bile değişmedi\" sözü delillere yakındır; \"hiçbir zaman farklılık olmadı\" sözü değildir."
  en: "The Quran's text was fixed very early: manuscripts radiocarbon-dated to within a few decades of the Prophet's (pbuh) death match the standard text closely, and the tradition itself records, openly, how it was collected under Abu Bakr and standardised under ʿUthman. Preservation in the classical Muslim sense does not mean that no other wording ever existed. The tradition records early variant copies (such as Ibn Masʿud's), verses reported as no longer recited, and several accepted ways of reading the same consonantal text (*qirāʾāt*). An early witness from outside the ʿUthmanic line, the lower text of the Sanaa palimpsest, has variants in wording and sura order; *Wikipedia* judges, without a citation, that they \"rarely diverge from the fundamental meaning\". So \"not a letter has changed since ʿUthman\" is close to the evidence; \"there were never any variants\" is not."
