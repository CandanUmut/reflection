steelman:
  tr: "\"Her şeyin bir sebebi olması gerekiyorsa, Allah'ın da bir sebebi olması gerekir. Allah'ın gerekmediğini söylersen, yalnızca O'nun için bir istisna yapmış olursun — özel kayırma. Ve bir şey sebepsiz var olabiliyorsa, neden evrenin kendisi olmasın? Nasıl var olduğuna dair hiçbir şey açıklamayan bir Allah eklemek yerine evrende durmak daha basit. Bertrand Russell'ın Copleston'a dediği gibi, evren sadece 'açıklamasız' olabilir. Dawkins de herhangi bir tasarımcının tasarladığı şeyden daha karmaşık olması gerektiğini, dolayısıyla onun daha da fazla açıklanmaya ihtiyaç duyacağını ekliyor.\""
  en: "\"If everything needs a cause, then God needs one too. If you say God doesn't, you are making an exception just for Him — special pleading. And if something can exist without a cause, why not the universe itself? It is simpler to stop at the universe than to add a God who explains nothing about how He exists. As Bertrand Russell said to Copleston, the universe may simply be 'without explanation'. And Dawkins adds that any designer would have to be more complex than what it designs, so it would need explaining even more.\""
whyAsked:
  tr: "Bu çoğu zaman bir çocuğun ilk felsefi sorusudur ve yetişkinlikte bir sınav olarak geri gelir: İman düşünmekten korkuyor mu? Bazen bu hiç de bir soru değildir, gitmeyen, zihne zorla giren bir düşüncedir — Hz. Peygamber'in (s.a.v.) önceden haber verdiği vesvesenin ta kendisi."
  en: "It is often a child's first philosophical question, and it comes back in adulthood as a test: is faith afraid of thinking? Sometimes it is not a question at all but an intrusive thought that will not go away — the very whisper the Prophet (pbuh) foresaw."
shortAnswer:
  tr: "Klasik argümanlar \"her şeyin bir sebebi vardır\" demez. *Var olmaya başlayan* ya da *var olmayabilecek* her şeyin kendi dışında bir sebebe ihtiyaç duyduğunu söyler. *Zorunlu* bir varlık — var olmaması mümkün olmayan ve hiç başlamamış olan — sebebi olabilecek türden bir şey değildir. \"Yaratılmamış olanı kim yarattı?\" diye sormak, bir dairenin köşelerini kimin çizdiğini sormaya benzer. Dolayısıyla teselsül itirazı hedefini ıskalar. Asıl soru bir sonrakidir: Neden evrende değil de Allah'ta duruyoruz? Burada argümanlar güçlüdür ama kesin değildir. Evren başka türlü olabilecek bir şeye benziyor ve güncel kozmoloji başlangıcı olan bir evrene uyuyor, ancak fizik bunu kesinleştirmiş değil. Argümanlar başarılı olsa bile zorunlu bir ilk sebebe ulaşırlar; bu sebebin Kur'an'ın bir ve şahsi Allah'ı olduğunu göstermek ek adımlar gerektirir. Profesyonel filozofların yaklaşık %19'u teizmi kabul ediyor ya da ona yakın duruyor (PhilPapers 2020). Soru ciddi bir sorudur ve onu düşünüp taşınmakta bir sakınca yoktur. Zorlantılı, korkutucu bir döngü olarak geliyorsa, bu başka bir meseledir (aşağıya bak)."
  en: 'The classical arguments do not say "everything has a cause". They say that whatever *begins to exist*, or whatever *could fail to exist*, needs a cause outside itself. A being that is *necessary* — that could not fail to exist and never began — is not the kind of thing that can be caused. Asking "who created the uncreated?" is like asking who drew the corners of a circle. So the regress objection misses its target. The real question is the next one: why stop at God rather than at the universe? Here the arguments are strong but not decisive. The universe looks like a thing that could have been otherwise, and current cosmology fits a universe with a beginning, though physics has not settled this. Even if the arguments succeed, they reach a necessary first cause; showing that this cause is the one, personal God of the Quran takes further steps. Among professional philosophers, about 19% accept or lean towards theism (PhilPapers 2020). The question is a serious one, and it is fine to think it through. If it comes as a compulsive, frightening loop, that is a different matter (see below).'
layers:
  - kind: religious
    tr: |
      Allah *es-Samed*dir, her şeyin kendisine muhtaç olduğu (112). 52:35 mantıksal seçenekleri ortaya koyar.
      - **Kelâmdaki hudûs delili:** başlayan her şeyin bir sebebi vardır (Eş'arî, Mâtürîdî, Gazzâlî).
      - **İbn Sînâ'nın *burhânü's-sıddîkîn*'i** (*İşârât*, 4. nemt): sonsuz bir mümkünler zinciri bile zorunlu bir temele (*vâcibü'l-vücûd*) muhtaçtır.
      - **Sonraki cevaplar:** Gazzâlî ve İbn Rüşd bazı kısımlarını eleştirdi; Molla Sadrâ ve Tabâtabâî onu yeniden işledi.
    en: |-
      God is *al-Ṣamad*, the one on whom all depend (112). 52:35 sets out the logical options.
      - **The kalām origination argument (*ḥudūth*):** whatever begins has a cause (al-Ashʿarī, al-Māturīdī, al-Ghazālī).
      - **Ibn Sīnā's *burhān al-ṣiddīqīn*** (*Ishārāt*, namaṭ 4): even an infinite chain of contingent things needs a necessary ground (*wājib al-wujūd*).
      - **Later responses:** al-Ghazālī and Ibn Rushd criticised parts of it; Mullā Ṣadrā and Ṭabāṭabāʾī reworked it.
  - kind: philosophical
    tr: |
      Başlıca itirazlar ve cevaplar:
      - *Neden zorunlu bir evren olmasın?* Fiziksel sabitleri mümkün görünür ve zorunlu bir varlık basit olmalıdır.
      - *Hume ve Kant:* argüman Allah'ın bir tanımından değil, varoluş olgusundan yola çıkar.
      - *Bileşim safsatası:* iddia parçalar ve bütünler hakkında değil, bağımlılık hakkındadır.
      - *Dawkins:* klasik teizm Allah'ın karmaşık değil, basit olduğunu kabul eder.

      Filozofların %18,93'ü teizme, %66,95'i ateizme meyleder (PhilPapers 2020, N=1.770). Argümanlar saygındır, kesin değildir.
    en: |-
      The main objections and replies:
      - *Why not a necessary universe?* Its physical constants look contingent, and a necessary being would have to be simple.
      - *Hume and Kant:* the argument starts from the fact of existence, not from a definition of God.
      - *Composition fallacy:* the claim is about dependence, not about parts and wholes.
      - *Dawkins:* classical theism holds that God is simple, not complex.

      Among philosophers, 18.93% lean toward theism and 66.95% toward atheism (PhilPapers 2020, N=1,770). The arguments are respectable, not decisive.
  - kind: scientific
    tr: |
      Büyük Patlama ve Borde–Guth–Vilenkin teoremi başlangıcı olan bir evrene uyar. Kuantum kütle çekimi modelleri bunu açık bırakır [Debated]. Kozmoloji bir "kanıt" değildir.
    en: The Big Bang and the Borde–Guth–Vilenkin theorem fit a universe with a beginning. Quantum-gravity models leave this open [Debated]. Cosmology is not a "proof."
  - kind: psychological
    tr: |
      Soruyu ciddiye almak güven inşa eder. Düşünce zorlayıcı biçimde tekrar tekrar geliyorsa, onu vesvese olarak ele almak gerekir.
    en: Taking the question seriously builds trust. If the thought keeps intruding compulsively, treat it as vesvese.
honestLimits:
  tr: "Teselsül itirazı klasik argümanlara karşı başarısız olur, ama argümanların kendisi kesin olmaktan çok saygı görür: Profesyonel filozofların çoğu ikna olmuş değil. Zorunlu bir varlıktan bir ve şahsi Allah'a ulaşmak ek, daha zayıf adımlar gerektirir. İbn Sînâ, Gazzâlî, İbn Rüşd ve Molla Sadrâ burada kendi metinlerinden değil, yalnızca ansiklopedi özetlerinden okundu; Hume'un *Diyaloglar*'ına ve Gazzâlî'nin *el-İktisâd*'ına henüz başvurulmadı; Tabâtabâî'nin versiyonu ele alınmadı. İlahi basitliğin açıklaması klasik görüşün bir özetidir; bu konuda hiçbir kaynak okunmadı."
  en: "The regress objection fails against the classical arguments, but the arguments themselves are respected rather than decisive: most professional philosophers are not persuaded. Getting from a necessary being to the one personal God takes further, weaker steps. Ibn Sina, al-Ghazali, Ibn Rushd and Mulla Sadra were read here only through encyclopedia summaries, not in their own texts; Hume's *Dialogues* and al-Ghazali's *al-Iqtiṣād* have not yet been consulted; Ṭabāṭabāʾī's version was not covered. The explanation of divine simplicity is a summary of the classical view; no source on it was read."
