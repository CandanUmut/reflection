  en: The "accident of birth" problem is not fully answered by pointing out that everyone faces it; it is answered only by testing beliefs, which most people do not do. Exclusivism combined with eternal punishment remains hard for many readers even with the classical limits on who is held to account. The intellectual-humility finding is from a press release, not the paper, and no evidence was read on effects between groups.
