  tr: |
    Milyarlarca insan buna katılmıyor.
  en: Billions of people disagree.
whyAsked:
  tr: |
    Çoğulcu bir kültür.
  en: A pluralist culture.
shortAnswer:
  tr: |
    Her görüş, "bütün dinler eşittir" görüşü dâhil, başkalarını dışarıda bırakır. Kibir, bir inancın *tutulup tutulmamasıyla* değil, *nasıl* tutulduğuyla ilgilidir.
  en: Every view excludes others, including "all religions are equal." Arrogance concerns *how* a belief is held, not *whether* it is held.
