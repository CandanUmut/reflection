steelman:
  tr: '"İnsanların çoğu sonunda anne babasının dinine sahip oluyor. Başka bir ülkede doğsaydın, başka bir inançtan da aynı derecede emin olurdun. Yani kesinliğin nerede doğduğun tesadüfünden geliyor — sonra da milyarlarca samimi insanın yanıldığını, birçoğunun sonsuza dek cezalandırılacağını iddia ediyorsun. Hakikatin yalnızca senin grubunda olduğuna, diğer herkesin kaybolmuş olduğuna inanmak, kibrin ta kendisi gibi görünüyor."'
  en: '"Most people end up with the religion of their parents. If you were born in another country, you would be just as sure of another faith. So your certainty comes from the accident of where you were born — and you then claim that billions of sincere people are wrong, and that many of them will be punished forever. Believing that your group alone has the truth, and that everyone else is lost, looks like the very definition of arrogance."'
whyAsked:
  tr: Karma toplumlarda insanlar başka inançlardan ya da hiçbir inancı olmayan arkadaşlarla yan yana yaşıyor. Birçoğu, dinî hakikate dair her iddiayı bir üstünlük iddiası olarak hissediyor. Soru, sonsuz cezayla birleştiğinde daha da keskinleşiyor.
  en: In mixed societies, people live alongside friends of other faiths and none. Many feel that any claim to religious truth is a claim to superiority. The question becomes sharper when it is tied to eternal punishment.
shortAnswer:
  tr: "Başkalarının reddettiği bir inanca sahip olmak tek başına kibir değildir; her tutum — \"bütün dinler eşit derecede geçerlidir\" dahil — birilerinin görüşünü reddeder. Filozof Alvin Plantinga bunu şöyle ifade etti: \"Başkalarıyla çelişmek kibirli ve bencilce ise, ayrı düşmek de öyledir.\" Kibir, bir inancın *nasıl* taşındığıyla ilgilidir: küçümseyerek, dinlemeden ya da zorla. Kur'an dinde zorlamayı yasaklar (2:256), Hz. Peygamber'e (s.a.v.) inanmaya zorlamanın onun görevi olmadığını söyler (10:99) ve insanın değerini grup aidiyetine değil, takvaya dayandırır (49:13). \"Doğum tesadüfü\" sorunu gerçektir; Gazzâlî'nin yaptığı gibi, bütün inançları bırakmayı değil, inançları sınamayı gerektirir. Sonsuz ceza konusunda ise ana akım âlimler, kendisine gerçekten ulaşmamış bir mesajdan kimsenin sorumlu tutulmayacağını kabul eder (17:15)."
  en: "Holding a belief that others reject is not, in itself, arrogant; every position — including \"all religions are equally valid\" — rejects someone's view. The philosopher Alvin Plantinga put it this way: \"if contradicting others is arrogant and egoistical, so is dissenting.\" Arrogance is about *how* a belief is held: with contempt, without listening, or with force. The Quran forbids compulsion in religion (2:256), tells the Prophet (pbuh) that forcing belief is not his task (10:99), and grounds human worth in righteousness, not in group membership (49:13). The \"accident of birth\" problem is real; it calls for testing one's beliefs, as al-Ghazali did, rather than dropping all of them. And on eternal punishment, mainstream scholars hold that no one is held to account for a message that did not truly reach them (17:15)."
