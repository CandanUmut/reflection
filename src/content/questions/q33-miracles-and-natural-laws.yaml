honestLimits:
  tr: Bir mucizeyi kabul etmek büyük ölçüde kişinin Allah'a inanmak için zaten sebeplerinin olup olmadığına bağlıdır; bu sayfa aksini iddia etmiyor. Kur'an'ın talep edilen mucizeleri göstermeyi reddetmesi, şüphecilerin bizzat işaret ettiği bir şeydir. Gazzâlî'nin on yedinci meseledeki kendi sözlerine henüz bir çeviriden başvurulmadı; görüşü Lee ve Adamson aracılığıyla verildi. Hadislerdeki mucize haberleri değerlendirilmedi.
  en: Accepting a miracle depends heavily on whether one already has reasons to believe in God; this page does not claim otherwise. The Quran's refusal to perform demanded miracles is itself something skeptics point to. Al-Ghazali's exact words in the seventeenth discussion have not yet been consulted in translation; his view is given through Lee and Adamson. The miracle reports in hadith were not assessed.
