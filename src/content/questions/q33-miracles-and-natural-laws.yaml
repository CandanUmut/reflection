steelman:
  tr: |
    Hume, bir mucizeye dair tanıklığın her zaman bir hatadan daha az olası olduğunu savundu.
  en: '"Science works because nature is regular. Every time we have checked, dead people stay dead, water does not turn into wine, and the moon does not split. Hume showed that a report of a miracle should never convince a reasonable person: the chance that the witnesses were mistaken or lying is always greater than the chance that the laws of nature were broken. Every religion reports miracles, and they cancel each other out. And if God made the laws, why would He break them?"'
whyAsked:
  tr: |
    Fen, teknoloji, mühendislik ve matematik öğrencileri arasında yaygındır.
  en: Students in science and engineering learn that nature follows laws, then hear religious stories that seem to deny this. Hume's essay is widely taught and widely quoted online, often in one sentence.
shortAnswer:
  tr: |
    Gazzâlî'ye göre tabiattaki düzenlilik Allah'ın âdetidir (*âdet*) ve mucizeler anlamlı işaretlerdir. Hume, kanıtlaması gereken şeyi varsayar.
  en: "Hume's argument is stronger than one sentence, but it does not show that miracles are impossible; at most, it sets a high bar for believing reports of them, and the height of the bar depends on whether one already thinks God exists. The philosopher Peter Millican, a leading Hume scholar, concludes that Hume's maxim as stated is mistaken, though his stress on how often reports go wrong is valuable. The Islamic tradition has its own account: for the Ashʿari theologians and al-Ghazali, the regularity of nature is God's custom (*ʿāda*), so a miracle is not a broken machine but God acting otherwise than usual, as a sign. The Quran itself refuses many demanded miracles, says that signs come only from God, and presents the Quran as the sign that is \"sufficient\" (29:51). A miracle, if it happens, need not break a conservation law in the sense physics uses, since those laws describe closed systems."
