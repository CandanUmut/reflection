steelman:
  tr: '"Bilim, tabiat düzenli olduğu için işler. Ne zaman kontrol ettiysek, ölüler ölü kaldı, su şaraba dönüşmedi, ay yarılmadı. Hume, bir mucize haberinin makul bir insanı asla ikna etmemesi gerektiğini gösterdi: Tanıkların yanılmış ya da yalan söylemiş olma ihtimali, tabiat kanunlarının çiğnenmiş olma ihtimalinden her zaman daha büyüktür. Her din mucizeler bildirir ve bunlar birbirini götürür. Hem Allah kanunları koyduysa, onları neden çiğnesin?"'
  en: '"Science works because nature is regular. Every time we have checked, dead people stay dead, water does not turn into wine, and the moon does not split. Hume showed that a report of a miracle should never convince a reasonable person: the chance that the witnesses were mistaken or lying is always greater than the chance that the laws of nature were broken. Every religion reports miracles, and they cancel each other out. And if God made the laws, why would He break them?"'
whyAsked:
  tr: Fen ve mühendislik öğrencileri tabiatın kanunlara uyduğunu öğreniyor, sonra bunu inkâr ediyor gibi görünen dinî hikâyeler duyuyor. Hume'un denemesi yaygın biçimde okutuluyor ve internette, çoğu zaman tek bir cümleyle, sık sık alıntılanıyor.
  en: Students in science and engineering learn that nature follows laws, then hear religious stories that seem to deny this. Hume's essay is widely taught and widely quoted online, often in one sentence.
shortAnswer:
  tr: "Hume'un argümanı tek bir cümleden daha güçlüdür, ama mucizelerin imkânsız olduğunu göstermez; en fazla, mucize haberlerine inanmak için yüksek bir çıta koyar ve çıtanın yüksekliği, kişinin zaten Allah'ın var olduğunu düşünüp düşünmediğine bağlıdır. Önde gelen bir Hume uzmanı olan filozof Peter Millican, Hume'un ilkesinin ifade edildiği hâliyle yanlış olduğu, ama haberlerin ne sıklıkla yanlış çıktığına yaptığı vurgunun değerli olduğu sonucuna varır. İslam geleneğinin kendi açıklaması vardır: Eş'arî kelâmcılara ve Gazzâlî'ye göre tabiatın düzenliliği Allah'ın âdetidir (*âdet*); dolayısıyla bir mucize bozulmuş bir makine değil, Allah'ın bir işaret olarak alışılmışın dışında davranmasıdır. Kur'an'ın kendisi talep edilen pek çok mucizeyi reddeder, mucizelerin yalnızca Allah'tan geldiğini söyler ve Kur'an'ı \"yeten\" mucize olarak sunar (29:51). Bir mucize gerçekleşirse, fiziğin kullandığı anlamda bir korunum kanununu çiğnemesi gerekmez, çünkü bu kanunlar kapalı sistemleri tarif eder."
  en: "Hume's argument is stronger than one sentence, but it does not show that miracles are impossible; at most, it sets a high bar for believing reports of them, and the height of the bar depends on whether one already thinks God exists. The philosopher Peter Millican, a leading Hume scholar, concludes that Hume's maxim as stated is mistaken, though his stress on how often reports go wrong is valuable. The Islamic tradition has its own account: for the Ashʿari theologians and al-Ghazali, the regularity of nature is God's custom (*ʿāda*), so a miracle is not a broken machine but God acting otherwise than usual, as a sign. The Quran itself refuses many demanded miracles, says that signs come only from God, and presents the Quran as the sign that is \"sufficient\" (29:51). A miracle, if it happens, need not break a conservation law in the sense physics uses, since those laws describe closed systems."
