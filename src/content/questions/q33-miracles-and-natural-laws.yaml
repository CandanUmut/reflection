title:
  tr: Mucizeler ve tabiat kanunları
  en: Miracles vs natural laws
sensitivity: normal
helpCard: false
verses: []
steelman:
  tr: |
    Hume, bir mucizeye dair tanıklığın her zaman bir hatadan daha az olası olduğunu savundu.
  en: Hume argued that testimony to a miracle is always less probable than error.
whyAsked:
  tr: |
    Fen, teknoloji, mühendislik ve matematik öğrencileri arasında yaygındır.
  en: Common among STEM students.
shortAnswer:
  tr: |
    Gazzâlî'ye göre tabiattaki düzenlilik Allah'ın âdetidir (*âdet*) ve mucizeler anlamlı işaretlerdir. Hume, kanıtlaması gereken şeyi varsayar.
  en: For al-Ghazālī, natural regularity is God's habit (*ʿāda*), and miracles are meaningful signs. Hume assumes what he needs to prove.
layers:
  - kind: religious
    tr: |
      Gazzâlî *Tehâfüt*'ün 17. meselesinde, gözlemin yalnızca iki olayın birlikte gerçekleştiğini gösterdiğini, birinin ötekine zorunlu olarak sebep olduğunu göstermediğini savunur. Griffel (SEP), onun hem vesileciliğe hem ikincil sebepliliğe izin verdiğini savunur. İbn Rüşd, sebepleri inkâr etmenin bilgiyi yok ettiği cevabını verdi.
    en: In the 17th discussion of the *Tahāfut*, al-Ghazālī argues that observation shows only that two events occur together, not that one necessarily causes the other. Griffel (SEP) argues that he allowed both occasionalism and secondary causality. Ibn Rushd replied that denying causes destroys knowledge.
  - kind: philosophical
    tr: |
      Kanunlar düzenlilikleri tarif eder; zorlamaz.
    en: Laws describe regularities; they do not compel.
  - kind: scientific
    tr: |
      Cartwright ve Mumford kanunları idealleştirmeler olarak ele alır.
    en: Cartwright and Mumford treat laws as idealisations.
  - kind: psychological
    tr: |
      Yalnızca mucizelere dayanan iman kırılgandır.
    en: Faith that rests only on miracles is fragile.
honestLimits:
  tr: |
    Mucizeleri kabul etmek, önceden Allah'a inanmaya bağlıdır.
  en: Accepting miracles depends on prior belief in God.
visualizations:
  - id: ideas
    tr: |
      Ateş ve pamuk. "Âdet ve kanun." Üç düşünürün karşılaştırması.
    en: Fire and cotton. "Habit vs law." Three thinkers compared.
