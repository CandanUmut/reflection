    Mucizeleri kabul etmek, önceden Allah'a inanmaya bağlıdır.
  en: Accepting a miracle depends heavily on whether one already has reasons to believe in God; this page does not claim otherwise. The Quran's refusal to perform demanded miracles is itself something skeptics point to. Al-Ghazali's exact words in the seventeenth discussion were not read in translation for this page; his view is given through Lee and Adamson. The miracle reports in hadith were not assessed.
