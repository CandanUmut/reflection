steelman:
  tr: "\"Kafam karışık değil, öfkeli de değilim. Sadece deizmin en dürüst tutum olduğunu düşünüyorum. Bir Yaratıcı, neden hiçbir şey yerine bir şeyin var olduğunu açıklar. Ama vahiy olduğu iddia edilen her metin, iyi bir Tanrı'nın söylemeyeceği şeyler içeriyor; vahiyler birbiriyle çelişiyor; Tanrı da meseleyi o kadar belirsiz bırakmış ki samimi insanlar her yerde ayrı düşüyor. Deizme 'istikrarsız' demek, beni bir din seçmeye zorlamanın bir yolu. 'Bir Yaratıcı, o kadar' neden yaşanacak bir yer olmasın?\""
  en: "\"I am not confused and I am not angry. I simply think deism is the most honest position. A Creator explains why there is something rather than nothing. But every claimed revelation contains things a good God would not say, the revelations contradict each other, and God has left the question so unclear that sincere people disagree everywhere. Calling deism 'unstable' is just a way of pressuring me to choose a religion. Why can't 'a Creator, and nothing more' be a place to live?\""
whyAsked:
  tr: Dindar aileler ve öğretmenler deizmi çoğu zaman, biri müdahale etmezse ateizmle biten bir dönem gibi görür; deistler de bunu baskı olarak duyar. 2018'de Türk din öğretmenlerinin bir çalıştayı, inanç sorunları yaşayan gençler arasında deizmin öne çıktığını bildirdi ve bu iddia ülke çapında bir tartışmaya dönüştü. Aynı soru, insanların bir dine değil de "yüce bir güce" inandığı her yerde vardır.
  en: Religious families and teachers often treat deism as a phase that ends in atheism unless someone intervenes, and deists hear that as pressure. In 2018 a workshop of Turkish religion teachers reported deism as prominent among young people with problems of belief, and the claim became a national debate. The same question exists wherever people believe in "a higher power" but not in a religion.
shortAnswer:
  tr: "Deizm bir ömür boyu taşınabilir; bunu yapan insanlar da vardır. Daha dar bir anlamda \"istikrarsız\"dır: Düzenli bir dünya yaratacak kadar hikmetli ve iyi bir Yaratıcıyı kabul eder, ama sonra bu Yaratıcının kendisi hakkında soru soran varlıklara söyleyecek hiçbir şeyi olmadığını varsayar. Müslüman kelâmcılar, hikmet sahibi bir Allah'ın yarattıklarına yol göstereceğini farklı yollardan savundular; Kur'an da vahyi inkâr etmenin \"Allah'ı gereği gibi\" tanıyamamak olduğunu söyler (6:91). Tarihte İngiliz deizmi yaklaşık 1689 ile 1742 arasında zirvesine ulaştı, sonra bir akım olarak geriledi; ama bunun sebepleri tartışmalıdır. Türkiye'de anket verileri, \"deist\" etiketine yakınlık duyan pek çok kişinin, işlenmiş bir felsefeye sahip olmaktan çok dindar insanlara itiraz ettiğini düşündürüyor. Sabır ve dürüst sohbet, baskıdan daha çok işe yarar."
  en: 'Deism can be held for a lifetime, and some people do. It is "unstable" in a narrower sense: it keeps a Creator who is wise and good enough to make an ordered world, but then assumes this Creator has nothing to say to the beings who ask about Him. Muslim theologians argued in different ways that a wise God would guide those He created, and the Quran says that denying revelation is a failure to "appraise Allah with true appraisal" (6:91). Historically, English deism had its high point between about 1689 and 1742 and then declined as a movement, though the reasons are debated. In Türkiye, survey data suggest that many who feel close to the "deist" label are protesting religious people more than holding a worked-out philosophy. Patience and honest conversation help more than pressure.'
