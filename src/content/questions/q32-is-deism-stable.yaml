honestLimits:
  tr: Bazı insanlar ömür boyu deist kalır ve burada söylenen hiçbir şey onların akıl dışı olduğunu göstermez. "İstikrarsızlık" argümanı felsefidir ve kişinin Allah'ın hikmetinden ne çıkardığına bağlıdır; Eş'arî geleneğin kendisi, aklın Allah'ın ne yapması gerektiğini temellendiremeyeceğini söyler. Deizmin gerileyiş tarihi ikincil özetlerden alındı. Türkiye rakamları, yöntemi eleştirilmiş tek bir anketten geliyor; tek tek insanların zaman içindeki yollarına dair veri bulunamadı.
  en: Some people remain deists for life, and nothing here shows they are irrational. The "instability" argument is philosophical and depends on what one thinks God's wisdom implies; the Ashʿari tradition itself denies that reason can establish what God must do. The history of deism's decline was taken from secondary summaries. The Turkish figures come from one survey whose method has been criticised, and no data were found on individual paths over time.
