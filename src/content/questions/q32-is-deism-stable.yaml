steelman:
  tr: |
    Bir Yaratıcıya inanıyorum ama dini reddediyorum.
  en: "\"I am not confused and I am not angry. I simply think deism is the most honest position. A Creator explains why there is something rather than nothing. But every claimed revelation contains things a good God would not say, the revelations contradict each other, and God has left the question so unclear that sincere people disagree everywhere. Calling deism 'unstable' is just a way of pressuring me to choose a religion. Why can't 'a Creator, and nothing more' be a place to live?\""
whyAsked:
  tr: |
    Türkiye'deki 2018 tartışması, Konya'da 50 din kültürü öğretmeninin katıldığı "Gençlik ve İnanç" çalıştayında (4 Mart 2018) başladı. Kapanış bildirgesi, inanç sorunları yaşayan gençler arasında deizmin ön plana çıktığını söyledi. TİDA/Nişancı anketi (2023) gerçek deizmin %2'nin altında olduğunu buldu; ama 18–24 yaş arasındakilerin %11'i kendini bu etikete yakın hissediyor.
  en: Religious families and teachers often treat deism as a phase that ends in atheism unless someone intervenes, and deists hear that as pressure. In 2018 a workshop of Turkish religion teachers reported deism as prominent among young people with problems of belief, and the claim became a national debate. The same question exists wherever people believe in "a higher power" but not in a religion.
shortAnswer:
  tr: |
    Deizm çoğu zaman bir varış noktası değil, bir mola yeridir. İyi bir Yaratıcı pek sessiz kalmaz. Türkiye'deki "deizmin" büyük kısmı dindarlara karşı bir protestodur.
  en: 'Deism can be held for a lifetime, and some people do. It is "unstable" in a narrower sense: it keeps a Creator who is wise and good enough to make an ordered world, but then assumes this Creator has nothing to say to the beings who ask about Him. Muslim theologians argued in different ways that a wise God would guide those He created, and the Quran says that denying revelation is a failure to "appraise Allah with true appraisal" (6:91). Historically, English deism had its high point between about 1689 and 1742 and then declined as a movement, though the reasons are debated. In Türkiye, survey data suggest that many who feel close to the "deist" label are protesting religious people more than holding a worked-out philosophy. Patience and honest conversation help more than pressure.'
