id: Q32
slugs:
  tr: deizm-istikrarli-mi
  en: is-deism-stable
order: 32
theme: deism
title:
  tr: Deizm istikrarlı bir tutum mu?
  en: Is deism a stable position?
sensitivity: normal
helpCard: false
verses:
  - 6:91
  - 29:61-63
steelman:
  tr: |
    Bir Yaratıcıya inanıyorum ama dini reddediyorum.
  en: I believe in a Creator but reject religion.
whyAsked:
  tr: |
    Türkiye'deki 2018 tartışması, Konya'da 50 din kültürü öğretmeninin katıldığı "Gençlik ve İnanç" çalıştayında (4 Mart 2018) başladı. Kapanış bildirgesi, inanç sorunları yaşayan gençler arasında deizmin ön plana çıktığını söyledi. TİDA/Nişancı anketi (2023) gerçek deizmin %2'nin altında olduğunu buldu; ama 18–24 yaş arasındakilerin %11'i kendini bu etikete yakın hissediyor.
  en: |
    Türkiye's 2018 debate began at the "Gençlik ve İnanç" workshop of 50 religion teachers in Konya (4 March 2018). Its closing statement said deism was coming to the fore among young people with problems of belief. The TİDA/Nişancı survey (2023) found actual deism under 2%, though 11% of 18–24-year-olds feel close to the label.
shortAnswer:
  tr: |
    Deizm çoğu zaman bir varış noktası değil, bir mola yeridir. İyi bir Yaratıcı pek sessiz kalmaz. Türkiye'deki "deizmin" büyük kısmı dindarlara karşı bir protestodur.
  en: Deism is often a resting place, not a destination. A good Creator would hardly stay silent. Much Turkish "deism" is a protest against religious people.
layers:
  - kind: religious
    tr: |
      6:91; 29:61–63; Allah'ın lütfu (*lütuf*) ve hikmeti (*hikmet*) hakkındaki klasik fikirler. Ayrıca bkz. Q3.
    en: |
      6:91; 29:61–63; the classical ideas of God's grace (*luṭf*) and wisdom (*ḥikma*). See also Q3.
  - kind: philosophical
    tr: |
      Allah şahsî bir varlıksa, iletişim muhtemeldir.
    en: If God is personal, communication is likely.
  - kind: history
    tr: |
      İngiliz ve Fransız deizmi birkaç nesil içinde söndü.
    en: English and French deism faded within a few generations.
  - kind: psychological
    tr: |
      Deist bir mola sabrı hak eder.
    en: A deist pause deserves patience.
honestLimits:
  tr: |
    Bazı insanlar ömür boyu deist kalır.
  en: Some people remain deists for life.
