theme: ethics
title:
  tr: Hz. Âişe'nin evlilik yaşı
  en: Aisha's age at marriage
sensitivity: high
helpCard: general
verses: []
steelman:
  tr: |
    Buhârî ve Müslim, altı yaşında nikâhı ve dokuz yaşında zifafı rivayet eder. Peygamber bütün zamanlar için bir örnekse, bugün çocuk istismarı dediğimiz şeyi onaylamış mı oldu? Bazı hukuk sistemleri bu rivayeti asgari yaş kanunlarına karşı delil olarak kullanır.
  en: Bukhārī and Muslim report marriage at six and consummation at nine. If the Prophet is a model for all time, did he endorse what we now call child abuse? Some legal systems cite the report against minimum-age laws.
whyAsked:
  tr: |
    İnternetteki başlıca polemiklerden biridir ve pek çok genç onunla ilk kez düşmanca videolarda karşılaşır.
  en: It is a leading online polemic, and many young people first meet it in hostile videos.
shortAnswer:
  tr: |
    Geleneksel rivayet en saygın hadis derlemelerinde yer alır. Bazı âlimler Âişe'nin daha büyük olduğunu savunur; 2022 tarihli bir Oxford tezi de rivayetin kendisinin sonradan ortaya çıktığını savunur; başkaları ikisini de reddeder. Tarih ne olursa olsun, bu site bugün çocuk yaşta evliliği onaylamaz. Bu, Türk hukukuna ve *makâsıd*a (zararı önlemek dâhil şeriatın amaçlarına) aykırıdır.
  en: The traditional report is in the most respected hadith collections. Some scholars argue Aisha was older, and a 2022 Oxford thesis argues the report itself arose later; others rebut both. Whatever the history, this site does not endorse child marriage today. It is contrary to Turkish law and to the *maqāṣid* (the Sharia's purposes, including preventing harm).
layers:
  - kind: religious
    tr: |
      Buhârî 5133–5134 ve Müslim 1422 rivayeti, çoğunlukla Hişâm b. Urve ← Urve ← Âişe yoluyla taşır. Klasik fakihler zifafı bedensel hazırlığa (*tâkat*) bağladı. Sonraki hukuk düzenlemeleri, *siyâset-i şer'iyye* (şeriat çerçevesinde yönetim) kapsamında devletin asgari yaşı belirlemesine izin verdi. Revizyonist kronolojiler (Urduca Kândehlevî ve bazı Türk ilahiyatçılar) Esmâ'nın yaşını ve Âişe'nin Bedir ve Uhud'da bulunmasını kullanarak onun on yaşlarının sonunda olduğunu savunur. Bunlar belirsiz rivayetlere dayanır [Debated].
    en: Bukhārī 5133–5134 and Muslim 1422 carry the report, mostly through Hishām b. ʿUrwa ← ʿUrwa ← Aisha. Classical jurists tied consummation to physical readiness (*ṭāqa*). Later legal codes let the state set minimum ages under *siyāsa sharʿiyya* (governance within the Sharia). Revisionist chronologies (Kāndhlawī in Urdu, and some Turkish theologians) use Asmāʾ's age and Aisha's presence at Badr and Uḥud to argue she was in her late teens. These rely on uncertain reports [Debated].
  - kind: philosophical
    tr: |
      Joshua Little (Oxford doktorası, 2022) bütün rivayetleri MS 754–765 arasında Kûfe'deki Hişâm'a dayandırır. Rivayetin "muhtemelen proto-Şiî polemiklere bir cevap olarak" ortaya çıktığını ve "gerçek bir tarihî hafıza"dan yoksun olduğunu söyler. ICRAA ("The Age of Aisha," 2024) buna katılmaz; en az üç kişinin Urve'den Hişâm'ı desteklediğini ve Urve dışında bir düzine râvinin aynı şeyi Âişe'den aktardığını belirtir.
    en: Joshua Little (Oxford DPhil, 2022) traces every version to Hishām in Kufa between 754 and 765 CE. He says it arose "probably as a response to proto-Šīʿī polemics" and lacks "genuine historical memory." ICRAA ("The Age of Aisha," 2024) disagrees, noting that at least three others corroborate Hishām from ʿUrwa, and a dozen narrators besides ʿUrwa relate the same from Aisha.
  - kind: history
    tr: |
      Ergenlikte evlilik, geç Antikçağda ve Orta Çağ Avrupa'sında yaygındı. Türk Medeni Kanunu'nun 124. maddesi asgari yaşı 17 (mahkeme izniyle 16) olarak belirler. Erken evliliğin tıbbi riskleri, onu yasaklamak için bir *makâsıd* gerekçesi verir.
    en: Marriage at puberty was common in late antiquity and medieval Europe. Article 124 of the Turkish Civil Code sets the minimum age at 17 (16 with court permission). The medical risks of early marriage give a *maqāṣid* reason to prohibit it.
  - kind: psychological
    tr: |
      Bu rivayet karşısındaki ahlâkî sarsılma *yerindedir* ve kabul edilmelidir. Konu kişisel bir travmaya dokunuyorsa, nazikçe destek hizmetleri önerilmelidir.
    en: Moral shock at this report is *right*, and it should be acknowledged. If the topic touches personal trauma, gently suggest support services.
honestLimits:
  tr: |
    Âişe'nin tam yaşı bilinemez. Rivayet klasik ölçütlere göre güçlüdür. Little'ın tezi ciddidir ama tartışmalıdır. Revizyonist kronolojiler çoğu zaman abartılıdır. Sayı oyunlarından kaçınmak gerekir; sağlam ifade ahlâkî olanıdır.
  en: Aisha's exact age cannot be known. The report is strong by classical standards. Little's thesis is serious but contested. Revisionist chronologies are often overstated. Avoid number games; the firm statement is the ethical one.
visualizations:
