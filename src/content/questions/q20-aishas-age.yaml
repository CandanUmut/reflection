title:
  tr: Hz. Âişe'nin evlilik yaşı
  en: Aisha's age at marriage
sensitivity: high
helpCard: general
verses:
  - 4:6
steelman:
  tr: "\"En güvenilir iki hadis külliyatı, Peygamber'in Âişe ile altı yaşındayken evlendiğini ve dokuz yaşındayken gerdeğe girdiğini söylüyor. Müslümanlar onu bütün zamanlar için en güzel örnek olarak görüyor. Bu doğruysa, ya dokuz yaşında bir çocuğun evliliği doğruydu — ki bugün buna haklı olarak istismar diyoruz — ya da örnek bütün zamanlar için değil. Bazı hükümetler ve vaizler bu rivayeti hâlâ asgari yaş yasalarına karşı delil olarak kullanıyor. 'O zaman normaldi' demek işe yaramaz: Allah'ın son elçisi yalnızca normal olanı yaptıysa, onu ahlaki bir örnek yapan nedir?\""
  en: "\"The two most trusted hadith collections say the Prophet married Aisha at six and consummated the marriage at nine. Muslims call him the best example for all time. If that is true, then either a nine-year-old's marriage was right — which we now rightly call abuse — or the example is not for all time. Some governments and preachers still cite this report against minimum-age laws. Saying 'it was normal then' does not help: if God's final messenger only did what was normal, what makes him a moral model at all?\""
whyAsked:
  tr: "Bu, internette İslam'a yöneltilen en yaygın saldırılardan biridir ve pek çok genç Müslüman onunla ilk kez düşmanca bir videoda karşılaşır. Hukuk açısından da önemlidir: Bazı ülkelerde rivayet, yasal evlilik yaşının yükseltilmesine direnmek için hâlâ kullanılıyor."
  en: "It is one of the most common attacks on Islam online, and many young Muslims first meet it in a hostile video. It also matters in law: in some countries the report is still used to resist raising the legal age of marriage."
shortAnswer:
  tr: "Rivayet en saygın hadis külliyatlarında yer alır ve klasik ölçütlere göre dürüstçe zayıf denemez. Joshua Little'ın 2022 tarihli Oxford tezi, rivayetin en erken biçiminin tek bir râvi, Hişâm b. Urve tarafından, hayatının sonlarına doğru Irak'a taşındıktan sonra \"üretilmiş ve yayılmış gibi göründüğünü\" savunur; başka âlimler rivayetin birkaç bağımsız senetle desteklendiği cevabını verir. Âişe'yi bir genç kız yapan revizyonist hesaplamalar, devirmeye çalıştıkları rivayetlerden daha zayıf rivayetlere dayanır. Daha önemli soru ahlakidir: Klasik âlimler Hz. Peygamber'in (s.a.v.) yaptığı her şeyi bütün zamanlar için bir kural olarak görmedi — onun bir elçi olarak yaptıklarını kendi toplumunun bir insanı olarak yaptıklarından ayırdılar — ve Kur'an onun bazı evliliklerinin \"başka müminlere değil de sadece sana mahsus\" olduğunu söyler (33:50). Klasik hukuk gerdeği bedensel hazırlığa bağladı ve bugünkü Müslüman devletler asgari yaşları belirlemek için Şerîat'ın kendi araçlarını kullanıyor. Bugün, erken evliliğin zararları hakkında bildiklerimizin ışığında, çocuk evliliği yanlıştır ve bu site bunu açıkça söyler."
  en: "The report is in the most respected hadith collections, and it cannot honestly be called weak by classical standards. A 2022 Oxford thesis by Joshua Little argues that the earliest form of the report \"appears to have been created and disseminated\" by one narrator, Hisham ibn ʿUrwa, after he moved to Iraq late in his life; other scholars reply that it is corroborated by several independent chains. Revisionist calculations that make Aisha a teenager rely on reports that are weaker than the ones they try to overturn. The more important question is moral: classical scholars never treated everything the Prophet (pbuh) did as a rule for all times — they distinguished his acts as a messenger from his acts as a man of his society, and the Quran says some of his marriages were \"only for you excluding the [other] believers\" (33:50). Classical law tied consummation to physical readiness, and modern Muslim states use the Sharia's own tools to set minimum ages. Today, given what we know about the harm of early marriage, child marriage is wrong, and this site says so plainly."
layers:
  - kind: religious
    tr: |
      Buhârî 5133–5134 ve Müslim 1422 rivayeti, çoğunlukla Hişâm b. Urve ← Urve ← Âişe yoluyla taşır. Klasik fakihler zifafı bedensel hazırlığa (*tâkat*) bağladı. Sonraki hukuk düzenlemeleri, *siyâset-i şer'iyye* (şeriat çerçevesinde yönetim) kapsamında devletin asgari yaşı belirlemesine izin verdi. Revizyonist kronolojiler (Urduca Kândehlevî ve bazı Türk ilahiyatçılar) Esmâ'nın yaşını ve Âişe'nin Bedir ve Uhud'da bulunmasını kullanarak onun ergenlik çağının sonlarında, yani yirmi yaşına yakın olduğunu savunur. Bunlar belirsiz rivayetlere dayanır [Debated].
    en: Bukhārī 5133–5134 and Muslim 1422 carry the report, mostly through Hishām b. ʿUrwa ← ʿUrwa ← Aisha. Classical jurists tied consummation to physical readiness (*ṭāqa*). Later legal codes let the state set minimum ages under *siyāsa sharʿiyya* (governance within the Sharia). Revisionist chronologies (Kāndhlawī in Urdu, and some Turkish theologians) use Asmāʾ's age and Aisha's presence at Badr and Uḥud to argue she was in her late teens. These rely on uncertain reports [Debated].
  - kind: philosophical
    tr: |
      Joshua Little (Oxford doktorası, 2022) bütün rivayetleri MS 754–765 arasında Kûfe'deki Hişâm'a dayandırır. Rivayetin "muhtemelen proto-Şiî polemiklere bir cevap olarak" ortaya çıktığını ve "gerçek bir tarihî hafıza"dan yoksun olduğunu söyler. ICRAA ("The Age of Aisha," 2024) buna katılmaz; en az üç kişinin Urve'den Hişâm'ı desteklediğini ve Urve dışında bir düzine râvinin aynı şeyi Âişe'den aktardığını belirtir.
    en: Joshua Little (Oxford DPhil, 2022) traces every version to Hishām in Kufa between 754 and 765 CE. He says it arose "probably as a response to proto-Šīʿī polemics" and lacks "genuine historical memory." ICRAA ("The Age of Aisha," 2024) disagrees, noting that at least three others corroborate Hishām from ʿUrwa, and a dozen narrators besides ʿUrwa relate the same from Aisha.
  - kind: history
    tr: |
      Ergenlikte evlilik, geç Antikçağda ve Orta Çağ Avrupa'sında yaygındı. Türk Medeni Kanunu'nun 124. maddesi asgari yaşı 17 (mahkeme izniyle 16) olarak belirler. Erken evliliğin tıbbi riskleri, onu yasaklamak için bir *makâsıd* gerekçesi verir.
    en: Marriage at puberty was common in late antiquity and medieval Europe. Article 124 of the Turkish Civil Code sets the minimum age at 17 (16 with court permission). The medical risks of early marriage give a *maqāṣid* reason to prohibit it.
  - kind: psychological
    tr: |
      Bu rivayet karşısındaki ahlâkî sarsılma *yerindedir* ve burada kabul ediliyor. Konu senin bir travmana dokunuyorsa, bu sayfadaki destek yardımcı olabilir.
    en: Moral shock at this report is *right*, and it is acknowledged here. If this topic touches a trauma of your own, the support on this page can help.
honestLimits:
  tr: Hz. Âişe'nin tam yaşı kesin olarak bilinemez. Rivayet klasik ölçütlere göre güçlüdür; Little'ın tezi ciddidir ama tartışmalıdır; revizyonist kronolojiler zayıftır. Klasik hukuk velilerin çocuklar için nikâh akdetmesine gerçekten izin verdi ve bu açıklanıp geçiştirilemez. Bu sitenin ahlaki tutumu — çocuk evliliğinin bugün yanlış olduğu — rivayetin yanlış olduğunu ispat etmeye değil, zarar ilkesine, devletin Şerîat altındaki yetkisine ve modern delillere dayanır.
  en: Aisha's exact age cannot be known with certainty. The report is strong by classical standards; Little's thesis is serious but contested; the revisionist chronologies are weak. Classical law did allow guardians to contract marriages for children, and that cannot be explained away. The ethical position of this site — that child marriage is wrong today — rests on the harm principle, the state's authority under the Sharia, and modern evidence, not on proving the report false.
visualizations:
