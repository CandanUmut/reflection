title:
  tr: Muhammed'in peygamber olduğuna neden inanmalı?
  en: Why believe Muhammad was a prophet?
sensitivity: normal
helpCard: false
verses:
  - 10:16
  - 2:23
  - 30:2-4
steelman:
  tr: "\"Tarihte pek çok insan Allah'tan mesaj aldığını iddia etti. Bazıları sahtekârdı; pek çoğu samimiydi. Muhammed'den şüphe etmek için onun yalan söylediğini düşünmek zorunda değilim: Tamamen samimi olup yine de yanılmış olabilir — kendi derin düşüncelerini vahiy olarak yaşayan, yetenekli, manevi bir adam. Hayatının sonraki dönemi savaşları, siyasi gücü ve pek çok evliliği de içeriyordu; bunlar bir elçiden çok başarılı bir liderin hayatına benziyor. Ve duyduğum argümanlar — Kur'an taklit edilemez, o okuma yazma bilmiyordu, bazı şeyleri önceden bildirdi — ya sınanamaz ya da ondan çok sonra yazılmış Müslüman kaynaklara dayanıyor.\""
  en: "\"Many people in history have claimed to receive messages from God. Some were frauds; many were sincere. I don't have to think Muhammad was lying to doubt him: he could have been completely sincere and still mistaken — a gifted, spiritual man who experienced his own deep thoughts as revelation. His later life also included war, political power and many marriages, which look like the career of a successful leader more than of a messenger. And the arguments I hear — the Quran is inimitable, he was illiterate, he predicted things — are either untestable or depend on Muslim sources written long after him.\""
whyAsked:
  tr: "Bu soru diğer bütün soruların altında yatar: O bir peygamberse, İslam'ın geri kalanı bundan çıkar; değilse, hiçbiri çıkmaz. İnsanlar \"yalancı, deli ya da peygamber\" argümanıyla, çoğu zaman samimi ama yanılmış olma seçeneğini görmezden gelen zayıf bir biçimiyle karşılaşır."
  en: 'The question underlies all the others: if he was a prophet, the rest of Islam follows; if not, none of it does. People meet the "liar, lunatic or prophet" argument, often in a weak form that ignores the sincere-but-mistaken option.'
shortAnswer:
  tr: "630'larda Arap hareketine Hz. Muhammed'in (s.a.v.) önderlik ettiği, vefatından birkaç yıl sonra yazılmış gayrimüslim kaynaklarca da doğrulanır; bu kaynakların doğrulamadığı şey O'nun peygamberliğidir. Peygamberliği lehindeki delil birikimlidir: Herhangi bir iddiada bulunmadan önceki dürüstlük ünü (Hz. Hatice'nin onun karakterine başvurması, {hadith:bukhari:3}); eleştirel tarihçi W. Montgomery Watt'ın bile samimiyetinin delili saydığı, yıllarca süren zulüm altındaki metaneti; kendi meydan okumasına göre taklit edilemeyen (2:23) ve klasik okumaların çoğuna göre resmî eğitimi olmayan bir adam aracılığıyla gelen bir kutsal kitap; ve çevresindeki insanların ahlaki dönüşümü. \"Samimi ama yanılmış\" seçeneği ciddi olanıdır ve yalnızca argümanla dışlanamaz. Müslümanlar için ona karşı ağır basan şey, mesajın kendi içeriği ve meyveleridir. Bazı popüler \"kehanetler\" abartılıdır; 30:2–4'teki Bizans kehaneti en bilinenidir ve açıkça söylenmesi gereken gerçek güçlükleri vardır."
  en: "That Muhammad (pbuh) led the Arab movement in the 630s is confirmed by non-Muslim sources written within a few years of his death; what those sources do not confirm is his prophethood. The case for it is cumulative: his reputation for honesty before he claimed anything (Khadija's appeal to his character, {hadith:bukhari:3}); his steadiness under years of persecution, which even the critical historian W. Montgomery Watt took as evidence of sincerity; a scripture that, by its own challenge, cannot be imitated (2:23), and which came, by most classical readings, through a man without formal learning; and the moral transformation of the people around him. The \"sincere but mistaken\" option is the serious one, and it cannot be ruled out by argument alone. What weighs against it, for Muslims, is the content of the message itself and its fruits. Some popular \"prophecies\" are overstated; the Byzantine prediction of 30:2–4 is the best-known, and it has real complications that should be stated."
layers:
  - kind: religious
    tr: |
      Bkz. 10:16, Kur'an'ın benzeri bir sûre getirme meydan okuması (2:23) ve Bizans hakkındaki haber (30:2–4). O zaman düşman olan Ebû Süfyân, Herakleios'a Muhammed'in hiç yalan söylemediğini itiraf etti (Buhârî 7). Ayrıca bkz. Nursî'nin *19. Mektup*'u ve Mutahhari'nin *Nübüvvet*'i.
    en: See 10:16, the Quran's challenge to produce a chapter like it (2:23), and the prediction about Byzantium (30:2–4). Abū Sufyān, then an enemy, admitted to Heraclius that Muhammad never lied (Bukhārī 7). See also Nursi's *19. Mektup* and Muṭahharī's *Nubuwwat*.
  - kind: philosophical
    tr: |
      Yalancı mı, yanılgıda mı, yoksa doğru sözlü mü? Yalancılık, onun yoksulluğuyla ve gördüğü zulümle pek uyuşmaz.
    en: Was he a liar, deluded, or truthful? Lying fits poorly with his poverty and persecution.
  - kind: history
    tr: |
      630'lar–660'lardan gayrimüslim kaynaklar ondan söz eder. Birmingham yazması MS 568–645'e tarihlendirilir.
    en: Non-Muslim sources from the 630s–660s mention him. The Birmingham manuscript is dated 568–645 CE.
  - kind: psychological
    tr: |
      Hayatından hikâyeler kıyaslardan daha ikna edicidir.
    en: Stories from his life persuade more than syllogisms do.
honestLimits:
  tr: Hiçbir argüman Allah'ın onunla konuştuğunu ispat etmez; delil birikimlidir ve farklı insanlar tarafından farklı değerlendirilir. Hoyland'ın kitabına, Watt'ın kitabına ve 30:2–4'ün farklı kıraatine henüz doğrudan başvurulmadı; savaşın tarihleri yalnızca *Wikipedia*'dan geliyor. Şüphe anketi (Chouhoud, 2018) "bilimsel mucizeler" sayfasında ele alınıyor.
  en: No argument proves that God spoke to him; the case is cumulative and judged differently by different people. Hoyland's book, Watt's book and the variant reading of 30:2–4 have not yet been consulted directly; the war's dates come from *Wikipedia* only. The doubt survey (Chouhoud, 2018) is discussed on the "scientific miracles" page.
