  - kind: reasoning
    en: |-
      **The Quran's own case.** The Quran points to its language and its challenge (2:23), to the character of the messenger (10:16), to the coherence of its message, and to the signs in nature as prompts for reflection (3:190) — not as hidden proofs. These are the arguments on "Why believe Muhammad was a prophet?".

      **How apparent conflicts are handled.** If it describes nature as people saw it (the sun "setting", for example), that is the language of appearance, not a scientific claim. Ibn Rushd argued that demonstrated truth cannot contradict revelation, and that apparent conflicts call for interpretation (see "Knowledge and seeking it" for his *Decisive Treatise*).
    tr: |-
      **Kur'an'ın kendi savunması.** Kur'an kendi diline ve meydan okumasına (2:23), elçinin karakterine (10:16), mesajının tutarlılığına ve doğadaki âyetlere düşünme vesileleri olarak (3:190) işaret eder — gizli deliller olarak değil. Bunlar "Muhammed'in peygamber olduğuna neden inanmalı?" sayfasındaki argümanlardır.

      **Görünüşteki çelişkiler nasıl ele alınır?** Kur'an doğayı insanların gördüğü gibi tarif ediyorsa (örneğin güneşin "batması"), bu bilimsel bir iddia değil, görünüşün dilidir. İbn Rüşd, ispatlanmış hakikatin vahiyle çelişemeyeceğini ve görünüşteki çelişkilerin yorumu gerektirdiğini savundu (onun *Faslü'l-Makâl*'i için bkz. "İlim ve ilim talebi").
    title:
      en: İddialar giderse geriye ne kalır?
      tr: İddialar giderse geriye ne kalır?
  - kind: objection
    en: |-
      **"Without the miracles, there is no evidence."** *Reply:* the classical case for inimitability did not rest on them: al-Baqillani's three aspects are composition, reports of the unseen and the Prophet's (pbuh) being *ummī* (Divlekci 2019). *Limit:* for people who came to faith through these claims, losing them can still feel like losing the ground.

      **"Some harmonies are striking."** *Reply:* they can be noted and reflected on, as harmonies. *Limit:* critics will still say any rich text can be made to fit many things after the fact.

      **"Muslim institutions still promote *iʿjāz ʿilmī*."** *Reply:* yes; the view on this page is a scholarly position, not a consensus.
    tr: |-
      **"Mucizeler olmadan delil yok."** *Cevap:* Taklit edilemezliğe dair klasik delil onlara dayanmıyordu: Bâkıllânî'nin üç yönü nazım, gaybdan haberler ve Hz. Peygamber'in (s.a.v.) *ümmî* olmasıdır (Divlekci 2019). *Sınır:* Bu iddialar aracılığıyla imana gelen insanlar için onları kaybetmek yine de zemini kaybetmek gibi hissettirebilir.

      **"Bazı uyumlar çarpıcı."** *Cevap:* Uyumlar olarak not edilebilir ve üzerinde düşünülebilir. *Sınır:* Eleştirmenler yine de zengin herhangi bir metnin olaydan sonra pek çok şeye uydurulabileceğini söyleyecektir.

      **"Müslüman kurumlar hâlâ *i'câz-ı ilmî*yi savunuyor."** *Cevap:* Evet; bu sayfadaki görüş bir icmâ değil, ilmî bir görüştür.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **Supporters** — Zaghloul El-Naggar, Keith Moore (1982/83 edition), Tantawi Jawhari.
      - **Critics** — Amin al-Khuli, Mahmud Shaltut, Nidhal Guessoum.
      - **This site** — verses as signs for reflection; harmony noted honestly, prediction not claimed.
    tr: |-
      - **Savunucular** — Zağlûl en-Neccâr, Keith Moore (1982/83 baskısı), Tantâvî Cevherî.
      - **Eleştirmenler** — Emîn el-Hûlî, Mahmûd Şeltût, Nidhal Guessoum.
      - **Bu site** — âyetler düşünmek için işaretlerdir; uyum dürüstçe not edilir, kehanet iddia edilmez.
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: Which popular claims hold up?
      tr: Hangi popüler iddialar ayakta kalıyor?
    a:
      en: None that was checked here holds up as a *prediction*. Some verses can be read in harmony with modern science (21:30; 51:47); classical commentators read them differently.
      tr: Burada kontrol edilenlerin hiçbiri bir *kehanet* olarak ayakta kalmıyor. Bazı âyetler modern bilimle uyum içinde okunabilir (21:30; 51:47); klasik müfessirler onları farklı okudu.
  - q:
      en: If I drop these claims, what reason is left?
      tr: Bu iddiaları bırakırsam, geriye hangi gerekçe kalır?
    a:
      en: "The Quran's own case: its language, its messenger, its message and its call to reflection."
      tr: "Kur'an'ın kendi savunması: dili, elçisi, mesajı ve düşünmeye çağrısı."
  - q:
      en: Which verses "harmonise with science"?
      tr: Hangi âyetler "bilimle uyum içinde"?
    a:
      en: 21:30 and 51:47 can be read in harmony with cosmology, and 23:12–14 with embryology, as discussed on the site's sign pages — with the caveats above.
      tr: 21:30 ve 51:47 kozmolojiyle, 23:12–14 de embriyolojiyle uyum içinde okunabilir; sitenin âyet sayfalarında, yukarıdaki çekincelerle birlikte ele alındığı gibi.
  - q:
      en: What is tafsir, and why does classical tafsir matter here?
      tr: Tefsir nedir ve klasik tefsir burada neden önemli?
    a:
      en: Tafsir is Quranic commentary. Classical tafsir shows how the words were understood before modern science, which is the test of whether a "prediction" is in the text or read into it.
      tr: Tefsir Kur'an yorumudur. Klasik tefsir kelimelerin modern bilimden önce nasıl anlaşıldığını gösterir; bir "kehanetin" metinde mi olduğunun yoksa ona sonradan mı yüklendiğinin sınavı budur.
  - q:
      en: What does it mean that classical *iʿjāz* centred on composition?
      tr: Klasik *i'câz*ın nazım etrafında yoğunlaşması ne demek?
    a:
      en: That al-Baqillani located the Quran's inimitability chiefly in its composition (*naẓm*), alongside its reports of the unseen and the Prophet's (pbuh) being *ummī* (Divlekci 2019).
      tr: Bâkıllânî'nin Kur'an'ın taklit edilemezliğini, gaybdan verdiği haberler ve Hz. Peygamber'in (s.a.v.) *ümmî* olmasıyla birlikte, esas olarak nazmına (*nazm*) yerleştirdiği anlamına gelir (Divlekci 2019).
  - q:
      en: What does al-Shatibi say about the first audience?
      tr: Şâtıbî ilk muhataplar hakkında ne diyor?
    a:
      en: His own text has not yet been consulted. Abu ʿAsi, writing about him, says the Quran was revealed "in the established usage of the Arabs", in a discussion of why tafsir is still needed.
      tr: Kendi metnine henüz başvurulmadı. Onun hakkında yazan Ebû Âsî, tefsirin neden hâlâ gerekli olduğuna dair bir tartışmada, Kur'an'ın "Arapların yerleşik kullanımına göre" indiğini söylüyor.
