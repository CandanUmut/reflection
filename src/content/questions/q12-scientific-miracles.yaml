    en: "**Science is not what most often triggers doubt.** [Moderate; one US sample.] In Chouhoud's survey of 630 Muslim Americans (2017), \"the top four issues all come from the Moral and Social Concerns family of doubts\", led by \"The way that [some] insist there is only one 'right' way to practice faith\", while \"each of the four items that least trigger doubt are directly related to doctrinal belief\". The exact rank of the science item (evolution and creation) was not given in the text read."
    tr: "**Şüpheyi en sık tetikleyen şey bilim değil.** [Orta; tek bir ABD örneklemi.] Chouhoud'un 630 Amerikalı Müslümanla yaptığı ankette (2017), \"ilk dört konunun hepsi Ahlaki ve Sosyal Kaygılar şüphe ailesinden geliyor\"; başta \"[bazılarının] dini yaşamanın yalnızca tek bir 'doğru' yolu olduğunda ısrar etmesi\" geliyor; \"şüpheyi en az tetikleyen dört maddenin her biri doğrudan akideyle ilgili\". Bilim maddesinin (evrim ve yaratılış) tam sırası okunan metinde verilmemişti."
    title:
      en: Araştırmalar ne gösteriyor?
