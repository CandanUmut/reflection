id: Q12
slugs:
  tr: bilimsel-mucizeler
  en: scientific-miracles
order: 12
theme: science
title:
  tr: Kur'an'daki "bilimsel mucizeler" gerçek mi?
  en: Are "scientific miracles" in the Quran real?
sensitivity: normal
helpCard: false
verses:
  - 3:190
  - 2:2
steelman:
  tr: |
    Popüler medya, Kur'an'ın embriyolojiyi, Büyük Patlama'yı, hatta ışık hızını önceden bildirdiğini iddia ediyor. Doğruysa ilahi kaynaklı olduğunu kanıtlar; zorlamaysa İslam'ı dürüst olmayan bir din gibi gösterir.
  en: Popular media claim the Quran predicted embryology, the Big Bang, even the speed of light. If true, it proves divine origin; if forced, it makes Islam look dishonest.
whyAsked:
  tr: |
    Viral videolar (Zağlul en-Neccâr, Harun Yahya), bunları çürüten videolar ve bir iddia çöktüğünde kendini aldatılmış hisseden şüpheciler.
  en: Viral videos (Zaghloul El-Naggar, Harun Yahya), debunking videos, and doubters who feel misled when a claim collapses.
shortAnswer:
  tr: |
    Kur'an doğa üzerine tefekküre davet eder ve pek çok âyet bilimle uyum içindedir. Ama âyetlerin belirli keşifleri *önceden bildirdiğini* iddia eden tür (i'câz-ı ilmî) çoğu zaman kelime anlamlarını zorlar, klasik tefsiri görmezden gelir ve Kur'an'ı değişebilen kuramlara bağlar. Pek çok Müslüman bilim insanı ve âlim, Kur'an'ı tamamen kabul ederken bu türü reddeder. Bu site âyetleri gizli bilim dersleri olarak değil, işaretler (âyât) olarak ele alır.
  en: The Quran invites reflection on nature, and many verses harmonize with science. But the genre claiming verses *predicted* specific discoveries (i'jāz ʿilmī) often stretches word meanings, ignores classical tafsir, and ties the Quran to changeable theories. Many Muslim scientists and scholars reject it while fully affirming the Quran. This site treats verses as signs (āyāt), not hidden science lectures.
layers:
  - kind: religious
    tr: |
      Kur'an kendini hidayet (2:2), doğayı da tefekkür edenler için işaretler (3:190) olarak tanımlar. Şâtıbî (*el-Muvâfakât*), ilk muhatapların bilmediği bilimleri Kur'an'a okumaya karşı uyardı; Gazzâlî (*Cevâhirü'l-Kur'ân*) ve Râzî daha açıktı. Modern savunucular: Tantâvî Cevherî, Neccâr; eleştirenler: Emîn el-Hûlî, Mahmûd Şeltût, Nidhal Guessoum. Klasik i'câz esas olarak *edebî* idi (Bâkıllânî, Cürcânî).
    en: "The Quran calls itself guidance (2:2) and nature signs for reflectors (3:190). Al-Shāṭibī (al-Muwāfaqāt) warned against reading in sciences unknown to the first audience; al-Ghazālī (Jawāhir al-Qurʾān) and al-Rāzī were more open. Modern supporters: Ṭanṭāwī Jawharī, El-Naggar; critics: Amīn al-Khūlī, Maḥmūd Shaltūt, Nidhal Guessoum. Classical i'jāz was mainly *literary* (al-Bāqillānī, al-Jurjānī)."
  - kind: philosophical
    tr: |
      Guessoum'un 2008 tarihli Zygon makalesi, bilimsel mucizeciliği hem bilimin hem Kur'an'ın yanlış anlaşılmasına dayandığı gerekçesiyle değerlendirir ve reddeder; İbn Rüşd'ün "çatışma mümkün değildir" ilkesini savunur: öngörüyü değil, bağdaşmayı göstermek. İtirazlar: sonradan yakıştırma, Arapçanın çok anlamlılığı, yanlışlanabilirlik riski. Savunucuların cevabı: birikimli örtüşme. Cevap: çarpıcı uyumları tefekkür olarak, öyle etiketleyerek not etmek.
    en: "Guessoum's 2008 Zygon article assesses and dismisses scientific miraculousness as resting on misunderstandings of science and the Quran, upholding Ibn Rushd's \"no possible conflict\": show compatibility, not prediction. Objections: post-hoc fitting, Arabic polysemy, falsifiability risk. Supporters' reply: cumulative convergence. Response: note striking harmonies as reflections, labelled as such."
  - kind: scientific
    tr: |
      Embriyo (S4), yörüngeler (S5) ve iki deniz (S7) sayfaları yaklaşımın örneğidir: doğru anlatmak, abartıları işaretlemek.
    en: |
      The embryo (S4), orbit (S5) and two-seas (S7) pages model the approach: describe accurately, flag overclaims.
  - kind: psychological
    tr: |
      Mucizeye dayalı iman kırılgandır; tek bir çöküş "hepsi yalan" genellemesine dönüşür. Yaqeen'in, bilimin şüphe tetikleyicileri arasında *alt sıralarda* olduğu bulgusu, abartılı iddiaları bırakmanın az şey kaybettirip güven kazandırdığı anlamına gelir.
    en: Miracle-based faith is brittle; one collapse generalizes to "it's all lies". Yaqeen's finding that science ranks *low* among triggers means dropping overclaims costs little and builds trust.
honestLimits:
  tr: |
    Bazı Müslüman kurumlar hâlâ i'câz-ı ilmîyi destekliyor; bu sitenin tutumu ilmî bir görüştür, icma değildir.
  en: Some Muslim institutions still promote i'jāz ʿilmī; this site's stance is a scholarly position, not consensus.
visualizations:
  - id: ideas
    tr: |
