fullAnswer:
  - kind: heart
    en: '**If a "miracle" you believed in turned out to be false, you were not foolish, and your faith was not foolish either.** You trusted people who presented a claim with confidence. The Quran never asked you to believe it because of modern science; it asks you to reflect, and it makes its own case.'
    tr: "**İnandığın bir \"mucizenin\" yanlış çıktığını gördüysen, ne sen ne de imanın aptalca değildi.** Bir iddiayı kendinden emin bir şekilde sunan insanlara güvendin. Kur'an senden ona modern bilim yüzünden inanmanı hiçbir zaman istemedi; senden düşünmeni ister ve kendi savunmasını kendisi yapar."
    title:
      en: İmanı sarsılan kişi için
      tr: İmanı sarsılan kişi için
  - kind: quran
    en: |-
      **Signs for reflection (3:190).** "Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding" (3:190). Nature is a sign pointing to God, to be reflected on.

      **A book of guidance (2:2).** "This is the Book about which there is no doubt, a guidance for those conscious of Allah" (2:2). Its stated purpose is guidance.
    tr: |-
      **Düşünmek için âyetler (3:190).** "Göklerin ve yerin yaratılışında, gece ile gündüzün birbiri ardınca gelip gidişinde selim akıl sahipleri için gerçekten açık, ibretli deliller vardır." (3:190). Doğa, Allah'ı gösteren ve üzerinde düşünülecek bir işarettir.

      **Bir hidayet kitabı (2:2).** "İşte o kitap, bunda şüphe yok, müttakiler (kötülükten korunacaklar) için hidayettir." (2:2). Bildirdiği amacı hidayettir.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: scholars
    en: |-
      **The verses.** "Have those who disbelieved not considered that the heavens and the earth were a joined entity, and We separated them and made from water every living thing?" (21:30), Meccan. "And the heaven We constructed with strength, and indeed, We are [its] expander" (51:47), Meccan.

      **The modern claim.** That 21:30 describes the Big Bang (a single original state, separated) and 51:47 the expanding universe.

      **Classical tafsir.** Ibn Kathir reports Ibn ʿAbbas on 21:30: "the heavens were joined together and it did not rain, and the earth was joined together and nothing grew", until "rain came forth from the heavens and vegetation came forth from the earth"; al-Hasan and Qatada: "They were joined together, then they were separated by this air"; and his own gloss: "in the beginning they were all one piece… piled up on top of one another", then separated. On 51:47 he explains "We constructed… with strength" with Ibn ʿAbbas, Mujahid, Qatada and al-Thawri, and *la-mūsiʿūn* ("expander") as: "We made it vast and We brought its roof higher without pillars to support it."

      **Assessment.** The words *ratq* (joined) and *fatq* (separated) and *mūsiʿūn* (making wide, or having the power to make wide) can be read as compatible with modern cosmology, and that compatibility can be a prompt for reflection. But Ibn Kathir, and the early authorities he reports, do not read these verses as describing an expanding universe or an initial singularity; the modern readings arose after the science. That is the pattern critics point to. So the honest statement is: these verses *can be read in harmony with* modern cosmology; they do not *predict* it.

      The astrophysicist Nidhal Guessoum gives a detailed critique of the "scientific miracles" literature in *Islam's Quantum Question* (2011), as described by Hawramani's review.
    tr: |-
      **Âyetler.** "O kâfir olanlar, görmediler mi ki, göklerle yer bitişik bir halde iken biz onları ayırdık. Hayatı olan her şeyi sudan yarattık." (21:30), Mekkî. "Biz göğü kudretimizle bina ettik. Hiç şüphesiz biz, çok genişlik ve kudret sahibiyiz." (51:47), Mekkî.

      **Modern iddia.** 21:30'un Büyük Patlama'yı (tek bir ilk hâl, sonra ayrılma), 51:47'nin ise genişleyen evreni anlattığı.

      **Klasik tefsir.** İbn Kesîr, 21:30 hakkında İbn Abbâs'tan şunu aktarır: "Gökler bitişikti ve yağmur yağmıyordu, yer bitişikti ve hiçbir şey bitmiyordu", ta ki "gökten yağmur inip yerden bitki çıkana kadar"; Hasan ve Katâde'den: "Bitişiktiler, sonra bu hava ile ayrıldılar"; ve kendi açıklaması: "Başlangıçta hepsi tek parçaydı… üst üste yığılmıştı", sonra ayrıldılar. 51:47'de "kudretimizle bina ettik" ifadesini İbn Abbâs, Mücâhid, Katâde ve Sevrî ile açıklar ve *le-mûsiûn* ("genişletenleriz") ifadesini şöyle açıklar: "Onu geniş kıldık ve tavanını onu destekleyecek sütunlar olmadan daha yükseğe kaldırdık."

      **Değerlendirme.** *Ratk* (bitişik) ve *fetk* (ayrılmış) ve *mûsiûn* (genişleten ya da genişletme gücüne sahip olan) kelimeleri modern kozmolojiyle bağdaşır şekilde okunabilir ve bu bağdaşma düşünmek için bir vesile olabilir. Ama İbn Kesîr ve aktardığı erken dönem otoriteler bu âyetleri genişleyen bir evreni ya da bir ilk tekilliği anlatan âyetler olarak okumaz; modern okumalar bilimden sonra ortaya çıktı. Eleştirmenlerin işaret ettiği örüntü budur. Dolayısıyla dürüst ifade şudur: Bu âyetler modern kozmolojiyle *uyum içinde okunabilir*; onu *önceden bildirmez*.
    title:
      en: "İşlenmiş bir örnek: 21:30 ve 51:47"
      tr: "İşlenmiş bir örnek: 21:30 ve 51:47"
  - kind: scholars
    en: |-
      **The claim.** That 23:12–14 — "a sperm-drop in a firm lodging… a clinging clot… a lump [of flesh]… bones… covered the bones with flesh" — matches modern embryology so exactly that it must be from God. Its best-known supporter was the Canadian anatomist Keith Moore, who is quoted as saying he had worked "for the past three years" with an embryology committee at King Abdulaziz University in Jeddah. With Abdul-Majeed al-Zindani, named there as Director of the Project of Scientific Miracles at that university, he produced a special edition of his textbook, *The Developing Human*, "with Islamic Additions" (Saunders, 1982; Dar Al-Qiblah, 1983). He is quoted as saying the Quranic descriptions "cannot be based on scientific knowledge in the seventh century" (Islamic Awareness, a site that promotes the claims).

      **Assessment.** The stages named in 23:14 are the same words the site's sign page on the embryo (S4) examines, with their meanings and the classical readings. The current S4 page says the historian of science Joseph Needham noted parallels with Galen's Greek medicine; that has not yet been checked in Needham's text. The fair position is the site's general one: describe accurately, note what harmonises, and flag overclaims.

      **The speed of light.** A popular claim derives the speed of light from 32:5 and the Moon's orbit. No source assessing it was read, so this page makes no judgement on it.
    tr: |-
      **İddia.** 23:12–14'ün — "nutfe… emin ve sağlam bir karargahta… alaka… mudga… kemik… o kemiklere bir et giydirdik" — modern embriyolojiyle o kadar tam örtüştüğü ki Allah'tan gelmesi gerektiği. En bilinen savunucusu Kanadalı anatomist Keith Moore'du; onun Cidde'deki Kral Abdülaziz Üniversitesi'nde bir embriyoloji komitesiyle "son üç yıldır" çalıştığını söylediği aktarılır. Orada o üniversitedeki Bilimsel Mucizeler Projesi'nin Direktörü olarak anılan Abdülmecîd ez-Zindânî ile birlikte, ders kitabı *The Developing Human*'ın "İslami Eklerle" özel bir baskısını hazırladı (Saunders, 1982; Dar Al-Qiblah, 1983). Kur'an'daki tasvirlerin "yedinci yüzyıldaki bilimsel bilgiye dayanıyor olamayacağını" söylediği aktarılır (Islamic Awareness, bu iddiaları savunan bir site).

      **Değerlendirme.** 23:14'te sayılan evreler, sitenin embriyo hakkındaki âyet sayfasının (S4) anlamları ve klasik okumalarıyla birlikte incelediği kelimelerin aynısıdır. Mevcut S4 sayfası, bilim tarihçisi Joseph Needham'ın Galenos'un Yunan tıbbıyla paralellikler not ettiğini söylüyor; bu, Needham'ın metninde henüz kontrol edilmedi. Adil tutum sitenin genel tutumudur: doğru tarif et, uyum içinde olanı not et ve abartıları işaretle.

      **Işık hızı.** Popüler bir iddia ışık hızını 32:5'ten ve Ay'ın yörüngesinden çıkarır. Bunu değerlendiren hiçbir kaynak okunmadı, dolayısıyla bu sayfa onun hakkında hüküm vermiyor.
    title:
      en: Embriyoloji
      tr: Embriyoloji
  - kind: scholars
    en: |-
      **Al-Shatibi and the Arabs' usage.** Muhammad Salim Abu ʿAsi, in his study of the Andalusian jurist al-Shatibi's *al-Muwāfaqāt*, writes in his own words that "the whole Quran was revealed in the established usage of the Arabs, without doubt" (translated). He says this in a section on why tafsir is still needed: Arabic words carry literal, figurative and implied meanings. The passage read says nothing about reading later sciences into the Quran.

      **Classical *iʿjāz*.** According to Divlekci (2019), al-Baqillani names three aspects of the Quran's inimitability: its reports of the unseen ("gâipten haberler"), the Prophet's (pbuh) being *ummī*, and the uniqueness of its composition (*naẓm*).

      **Modern critics.** Guessoum's 2008 article in *Zygon* could not be opened (blocked), so his arguments are not summarised here.
    tr: |-
      **Şâtıbî ve Arapların kullanımı.** Muhammed Sâlim Ebû Âsî, Endülüslü fakih Şâtıbî'nin *el-Muvâfakât*'ı üzerine çalışmasında, kendi sözleriyle, "Kur'an'ın tamamının şüphesiz Arapların yerleşik kullanımına göre indiğini" yazar (çeviri). Bunu tefsirin neden hâlâ gerekli olduğuna dair bir bölümde söyler: Arapça kelimeler lafzi, mecazi ve ima edilen anlamlar taşır. Okunan pasaj sonraki ilimleri Kur'an'a okumak hakkında hiçbir şey söylemiyor.

      **Klasik *i'câz*.** Divlekci'ye (2019) göre Bâkıllânî, Kur'an'ın taklit edilemezliğinin üç yönünü sayar: gaybdan verdiği haberler ("gâipten haberler"), Hz. Peygamber'in (s.a.v.) *ümmî* olması ve nazmının (*nazm*) eşsizliği.

      **Modern eleştirmenler.** Guessoum'un *Zygon*'daki 2008 tarihli makalesi açılamadı (engellendi), dolayısıyla argümanları burada özetlenmiyor.
