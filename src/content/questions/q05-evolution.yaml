title:
  tr: Evrim İslam'la bağdaşır mı?
  en: Is evolution compatible with Islam?
sensitivity: normal
helpCard: false
verses:
  - 3:59
steelman:
  tr: "\"Biyoloji, insanlar dahil bütün canlıların ortak atalara sahip olduğunu gösteriyor. Delil tek bir fosil değil, genetik, anatomi ve fosil kaydı birlikte. Kur'an Âdem'in çamurdan yapıldığını, meleklerin ona secde ettiğini ve bütün insanların tek bir nefisten geldiğini söylüyor. Popülasyon genetiği, insan genetik çeşitliliğinin son birkaç yüz bin yıl içindeki tek bir çiftten gelemeyecek kadar büyük olduğunu söylüyor. Yani ya Kur'an Âdem konusunda yanılıyor ya da bilim yanılıyor — ve bilim çok güçlü.\""
  en: '"Biology shows that all living things, humans included, share common ancestors. The evidence is not one fossil but genetics, anatomy and the fossil record together. The Quran says Adam was made from clay, that angels bowed to him, and that all people come from one soul. Population genetics says human genetic diversity is too great to come from one couple in the last few hundred thousand years. So either the Quran is wrong about Adam, or the science is wrong — and the science is very strong."'
whyAsked:
  tr: Öğrenciler biyoloji dersinde evrimle karşılaşırken evde ya da camide onun ateizm olduğunu duyuyor. Pek çoğuna seçmek zorunda oldukları söyleniyor. Bazıları bu yüzden imanı bırakıyor; diğerleri bilimden kaçıyor.
  en: Students meet evolution in biology class while hearing at home or in the mosque that it is atheism. Many are told they must choose. Some leave faith over it; others avoid science.
shortAnswer:
  tr: "Soru göründüğünden daha dardır. Kur'an bitkilerin ve hayvanların bugünkü biçimlerine nasıl geldiği hakkında hiçbir şey söylemez; insanlarla ilgili yaratılış âyetleri Âdem'le ilgilidir. Şuayb Ahmed Malik (*Islam and Evolution*, 2021), Gazzâlî'nin yorum kurallarını uygulayarak Müslüman görüşlerini dört tutuma ayırır — yaratılışçılık, insan istisnacılığı, Âdem istisnacılığı ve \"istisnasız\" — ve ilk üçünün kutsal metinle bağdaştığı, dördüncüsünün ise bağdaşmadığı sonucuna varır. Asıl tartışma, Âdem'in kendisinin biyolojik anne babası olup olmadığıdır. Ortak ata, kaynaşmış insan 2. kromozomu gibi delillerle çok iyi desteklenir. Popülasyon genetiği yakın geçmişte tek bir kurucu çifti dışlar, ama sonraki analizlere göre yaklaşık 500.000 yıldan daha önceki bir çifti dışlamaz. Geleneksel ilmî cevaplar ihtiyatlıdır: Okunan bir cevap (SeekersGuidance, 2020), diğer türlerin evrimini açık bırakırken Âdem'in kesinlikle doğrudan yaratıldığını kabul eder."
  en: "The question is narrower than it looks. The Quran says nothing about how plants and animals came to be in their present forms; its creation verses about humans concern Adam. Shoaib Ahmed Malik (*Islam and Evolution*, 2021), applying al-Ghazali's rules of interpretation, sorts Muslim views into four positions — creationism, human exceptionalism, Adamic exceptionalism and \"no exceptions\" — and concludes that the first three are compatible with scripture and the fourth is not. The real dispute is whether Adam himself had biological parents. Common descent is very well supported by evidence such as the fused human chromosome 2. Population genetics rules out a single founding couple in the recent past, but not, on later analyses, one more than about 500,000 years ago. Traditional scholarly answers are cautious: one read (SeekersGuidance, 2020) holds that Adam was certainly created directly, while leaving the evolution of other species open."
