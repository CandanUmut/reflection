honestLimits:
  tr: Malik'in kitabının kendisi, Jalajel'in çalışması ve Guessoum'un kitabı yalnızca incelemeler aracılığıyla okundu; Gazzâlî'nin *Kânûnü't-Te'vîl*'ine ve *Faysalü't-Tefrika*'sına henüz başvurulmadı, dolayısıyla onun kuralı yalnızca inceleme yazarlarının sözleriyle tarif ediliyor. Burada ortak ataya dair delil taraması bir örnek veriyor; tam bir anlatım değil. Okunan tek cevabın ötesindeki kurumsal görüşlere (Diyanet, Ezher, fetva kurulları) henüz bakılmadı.
  en: Malik's book itself, Jalajel's work and Guessoum's book were read only through reviews; al-Ghazali's *Qānūn al-Taʾwīl* and *Fayṣal al-Tafriqa* have not yet been consulted, so his rule is described only in the reviewers' words. The survey of evidence for common descent here gives one example; it is not a full account. Institutional positions (Diyanet, al-Azhar, fatwa councils) beyond the one answer read have not yet been checked.
