title:
  tr: Evrim İslam'la bağdaşır mı?
  en: Is evolution compatible with Islam?
sensitivity: normal
helpCard: false
verses:
  - 3:59
steelman:
  tr: |
    Biyoloji doğal seçilim yoluyla ortak ataları gösterir; Kur'an ise Âdem'in topraktan yaratıldığını söyler.
  en: '"Biology shows that all living things, humans included, share common ancestors. The evidence is not one fossil but genetics, anatomy and the fossil record together. The Quran says Adam was made from clay, that angels bowed to him, and that all people come from one soul. Population genetics says human genetic diversity is too great to come from one couple in the last few hundred thousand years. So either the Quran is wrong about Adam, or the science is wrong — and the science is very strong."'
whyAsked:
  tr: |
    Biyoloji dersleri ve bilime karşıt olarak öğretilen din.
  en: Students meet evolution in biology class while hearing at home or in the mosque that it is atheism. Many are told they must choose. Some leave faith over it; others avoid science.
shortAnswer:
  tr: |
    Şuayb Ahmed Malik (*Islam and Evolution*, Routledge 2021) dört görüşü haritalar: yaratılışçılık, insan istisnacılığı, Âdem istisnacılığı ve istisnasızlık. Gazzâlî'nin yorum ilkelerini kullanarak ilk üçünü metinle bağdaşır bulur ve David Solomon Jalajel'in geliştirdiği Âdem istisnacılığını tercih eder. Asıl tartışma dardır: Âdem'in kendisinin ataları olup olmadığı.
  en: "The question is narrower than it looks. The Quran says nothing about how plants and animals came to be in their present forms; its creation verses about humans concern Adam. Shoaib Ahmed Malik (*Islam and Evolution*, 2021), applying al-Ghazali's rules of interpretation, sorts Muslim views into four positions — creationism, human exceptionalism, Adamic exceptionalism and \"no exceptions\" — and concludes that the first three are compatible with scripture and the fourth is not. The real dispute is whether Adam himself had biological parents. Common descent is very well supported by evidence such as the fused human chromosome 2. Population genetics rules out a single founding couple in the recent past, but not, on later analyses, one more than about 500,000 years ago. Traditional scholarly answers are cautious: one read (SeekersGuidance, 2020) holds that Adam was certainly created directly, while leaving the evolution of other species open."
layers:
