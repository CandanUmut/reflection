    tr: |
      3:59, Âdem'i bir âyet olarak İsa'ya benzetir. Malik, Darwin'i İbn Haldun'a ya da İbn Miskeveyh'e okumaya karşı uyarır. [Scholarly]
    en: 3:59 likens Adam to Jesus as a sign. Malik cautions against reading Darwin into Ibn Khaldun or Ibn Miskawayh. [Scholarly]
  - kind: philosophical
    tr: |
      - "Güdümsüz" olması biyoloji değil, metafiziktir. Eş'arî vesilecilikte her doğal süreç Allah'ın fiilidir.
      - İtiraz: popülasyon genetiği tek bir kurucu çifte karşı delil getirir. Âdem istisnacılığı, başka hominidlerin Âdem'le birlikte var olabileceği cevabını verir. Eleştirmenler bunu duruma göre uydurulmuş (ad hoc) bulur. [Debated]
    en: |-
      - "Unguided" is metaphysics, not biology. In Ash'ari occasionalism, every natural process is God's act.
      - Objection: population genetics argues against a single founding pair. Adamic exceptionalism answers that other hominins could have coexisted with Adam. Critics call this ad hoc. [Debated]
  - kind: scientific
    tr: |
      Ortak ata [Established].
    en: Common descent is [Established].
  - kind: psychological
    tr: |
      Bu seçeneklerin var olduğunu öğrenmek çoğu zaman rahatlama getirir.
    en: Learning that these options exist often brings relief.
honestLimits:
  tr: |
    Kurumsal tutumlar temkinli olmaya devam ediyor.
  en: Malik's book itself, Jalajel's work and Guessoum's book were read only through reviews; al-Ghazali's *Qānūn al-Taʾwīl* and *Fayṣal al-Tafriqa* have not yet been consulted, so his rule is described only in the reviewers' words. The survey of evidence for common descent here gives one example; it is not a full account. Institutional positions (Diyanet, al-Azhar, fatwa councils) beyond the one answer read have not yet been checked.
