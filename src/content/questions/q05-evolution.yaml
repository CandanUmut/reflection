order: 5
theme: evolution
title:
  tr: Evrim İslam'la bağdaşır mı?
  en: Is evolution compatible with Islam?
sensitivity: normal
helpCard: false
verses:
  - 3:59
steelman:
  tr: |
    Biyoloji doğal seçilim yoluyla ortak ataları gösterir; Kur'an ise Âdem'in topraktan yaratıldığını söyler.
  en: Biology shows common ancestry by natural selection, while the Quran says Adam came from clay.
whyAsked:
  tr: |
    Biyoloji dersleri ve bilime karşıt olarak öğretilen din.
  en: Biology classes, and religion taught as opposed to science.
shortAnswer:
  tr: |
    Şuayb Ahmed Malik (*Islam and Evolution*, Routledge 2021) dört görüşü haritalar: yaratılışçılık, insan istisnacılığı, Âdem istisnacılığı ve istisnasızlık. Gazzâlî'nin yorum ilkelerini kullanarak ilk üçünü metinle bağdaşır bulur ve David Solomon Jalajel'in geliştirdiği Âdem istisnacılığını tercih eder. Asıl tartışma dardır: Âdem'in kendisinin ataları olup olmadığı.
  en: "Shoaib Ahmed Malik (*Islam and Evolution*, Routledge 2021) maps four positions: creationism, human exceptionalism, Adamic exceptionalism and no exceptions. Using al-Ghazali's hermeneutics, he finds the first three scripturally compatible and favours Adamic exceptionalism, developed by David Solomon Jalajel. The real dispute is narrow: whether Adam himself had ancestors."
layers:
  - kind: religious
    tr: |
      3:59, Âdem'i bir âyet olarak İsa'ya benzetir. Malik, Darwin'i İbn Haldun'a ya da İbn Miskeveyh'e okumaya karşı uyarır. [Scholarly]
    en: 3:59 likens Adam to Jesus as a sign. Malik cautions against reading Darwin into Ibn Khaldun or Ibn Miskawayh. [Scholarly]
  - kind: philosophical
    tr: |
      - "Güdümsüz" olması biyoloji değil, metafiziktir. Eş'arî vesilecilikte her doğal süreç Allah'ın fiilidir.
      - İtiraz: popülasyon genetiği tek bir kurucu çifte karşı delil getirir. Âdem istisnacılığı, başka hominidlerin Âdem'le birlikte var olabileceği cevabını verir. Eleştirmenler bunu duruma göre uydurulmuş (ad hoc) bulur. [Debated]
    en: |-
      - "Unguided" is metaphysics, not biology. In Ash'ari occasionalism, every natural process is God's act.
      - Objection: population genetics argues against a single founding pair. Adamic exceptionalism answers that other hominins could have coexisted with Adam. Critics call this ad hoc. [Debated]
  - kind: scientific
    tr: |
      Ortak ata [Established].
    en: Common descent is [Established].
  - kind: psychological
    tr: |
      Bu seçeneklerin var olduğunu öğrenmek çoğu zaman rahatlama getirir.
    en: Learning that these options exist often brings relief.
honestLimits:
  tr: |
    Kurumsal tutumlar temkinli olmaya devam ediyor.
  en: Institutional positions remain cautious.
