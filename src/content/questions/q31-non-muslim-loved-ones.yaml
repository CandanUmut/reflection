theme: salvation
title:
  tr: Gayrimüslim sevdiklerim için umut yok mu?
  en: Are my non-Muslim loved ones lost?
sensitivity: high
helpCard: suffering
verses:
  - 17:15
steelman:
  tr: |
    İyi kalpli büyükannemin mahkûm olduğuna inanmak zorunda mıyım?
  en: '"My mother is not Muslim. My father died last year as a Christian. They raised me and loved me. Am I meant to believe they are lost for ever, and that I may not even ask God to forgive my father? Even the Prophet was not allowed to pray for his own mother. What is the point of my love?"'
whyAsked:
  tr: |
    Yas ve farklı inançlardan oluşan aileler.
  en: Converts, children of mixed families and the bereaved live with this every day. It shapes how they grieve, pray and visit graves.
shortAnswer:
  tr: |
    Kalpleri yalnızca Allah bilir. Pek çok klasik âlim, mesajı açıkça hiç duymamış insanları mazur gördü. Yas tutabilir, ümit edebilir ve onları anabilirsin.
  en: Islam forbids asking God's forgiveness for someone who died a non-Muslim (9:113). It does not ask you to stop loving them. That ruling applies "after it has become clear" that they are people of the Fire, and no one knows that about a particular person, because no one knows whether the message truly reached them (Q14). You may pray for a living relative's guidance, honour non-Muslim parents, grieve, attend the funeral (permitted in Shafiʿi and Hanbali texts), and visit the grave, as the Prophet (pbuh) did his mother's. The strict majority holds that someone who clearly heard and rejected is not saved, but the "never heard clearly" excuse is mainstream, not fringe.
layers:
  - kind: religious
    tr: |
      "Biz bir peygamber göndermedikçe azap etmeyiz" (17:15). Gazzâlî (*Faysal*) İslam'ın çarpıtılmış bir resmini alanları mazur görür. 9:113 bazı ölüler için af dilemeyi sınırlar. Hz. Peygamber annesinin kabri başında ağladı (Müslim 976). Ayrıca bkz. Q14.
    en: |
      "We do not punish until We send a messenger" (17:15). Al-Ghazālī (*Fayṣal*) excuses those who received a distorted picture of Islam. 9:113 restricts asking forgiveness for some of the dead. The Prophet wept at his mother's grave (Muslim 976). See also Q14.
  - kind: philosophical
    tr: |
      Allah'ın her insana dair bilgisi tamdır; bizimki değildir.
    en: God's knowledge of each person is complete; ours is not.
  - kind: scientific
    tr: |
      Farklı inançlardan oluşan aileler artıyor.
    en: Mixed-faith families are increasing.
  - kind: psychological
    tr: |
      Yas danışmanlığı yardımcı olur.
    en: Grief counselling helps.
honestLimits:
  tr: |
    Âlimler bu metinlerin nasıl uygulanacağı konusunda farklı görüşlere sahiptir ve kimse kimsenin nihai durumunu bilmez.
  en: The plain sense of Muslim 203 and 976 is strict, and al-Suyuti's alternative is a minority view. Several practical rulings were not verified school by school, and no research on grief in mixed-faith families was found.
