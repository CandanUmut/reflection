order: 18
theme: hypocrisy
title:
  tr: '"Dindarlar böyle davranıyorsa, neden inanayım?"'
  en: '"If religious people act like this, why believe?"'
sensitivity: high
helpCard: general
verses:
  - 2:44
  - 61:2-3
steelman:
  tr: "\"Bir inanç insanları gerçekten değiştiriyorsa, onun kamusal yüzü çevresindeki dünyadan daha iyi görünmelidir. Oysa ben yalan söyleyen vaizler, istismarı örtbas eden topluluklar, kim iktidardaysa ona hizmet eden âlimler ve oy kazanmak ve darbeleri meşrulaştırmak için kullanılan bir din görüyorum. Ve alışılmış cevap — 'onlar gerçek Müslüman değil' — her şeyi açıklayıp geçebilir: İyi müminler inancı ispat ediyorsa ve kötü müminler de onu ispat ediyorsa (çünkü Kur'an münafıkları 'önceden bildirmiş'), o zaman hiçbir şey onun aleyhine sayılamaz. Din, pratikte, sadece bir güç aracı değil mi?\""
  en: "\"If a faith truly changes people, its public face should look better than the world around it. Instead I see preachers who lie, communities that cover up abuse, scholars who serve whoever is in power, and religion used to win votes and justify coups. And the usual answer — 'those people aren't real Muslims' — can explain away anything: if good believers prove the faith and bad believers also prove it (because the Quran 'predicted' hypocrites), then nothing could ever count against it. Isn't religion, in practice, just a tool of power?\""
whyAsked:
  tr: "Çünkü pek çok insanın şüphesi bir argümanla değil, bir ihanetle başlar: bir hocanın, bir imamın, bir aile üyesinin ya da bir hareketin ihanetiyle. Chouhoud'un Amerikalı Müslümanlarla yaptığı ankette, şüpheyi tetikleyen ilk dört etkenin hepsi ahlaki ve sosyal kaygılardı; başta \"[bazılarının] dini yaşamanın yalnızca tek bir 'doğru' yolu olduğunda ısrar etmesi\" geliyordu (Yaqeen, 2018). Türkiye'de gençler dinin rakip siyasi aktörler tarafından kullanıldığını ve devletin dinî bir yapıya atfettiği bir darbe girişimini gördü (aşağıda Tarih bölümüne bak)."
  en: "Because many people's doubt starts not with an argument but with a betrayal: by a teacher, an imam, a family member, or a movement. In Chouhoud's survey of Muslim Americans, the top four triggers of doubt were all moral and social concerns, led by \"The way that [some] insist there is only one 'right' way to practice faith\" (Yaqeen, 2018). In Türkiye, young people have watched religion used by rival political actors, and a coup attempt that the state attributes to a religious network (see History below)."
shortAnswer:
  tr: "Öfken meşrudur ve Kur'an da onu paylaşır: \"İnsanlara iyiliği emreder de kendinizi unutur musunuz? Halbuki kitab (Tevrat)ı okuyorsunuz. Hâlâ aklınızı başınıza almayacak mısınız?\" (2:44); \"Yapmayacağınızı söylemeniz, Allah yanında şiddetli bir buğza sebeb olur.\" (61:3). Hz. Peygamber (s.a.v.) münafığın alametlerini verdi: yalan söylemek, sözünden dönmek, emanete hıyanet etmek ({hadith:bukhari:33}). Gazzâlî, dini \"bu hayatın lükslerinden yararlanmak\" ve \"halkı arasında güç ve makam elde etmek\" için kullanan âlimlere karşı sayfalarca yazdı. Yani gelenek senden dindar insanları mazur görmeni istemez; sana onları yargılayacağın ölçüyü verir. Ama bir mesaj ona ihanet edenler tarafından çürütülmez; tıbbın sigara içen bir doktor tarafından çürütülmediği gibi. İtirazın ciddi biçimi kurumlar ve güçle ilgilidir ve gerçek bir cevap gerektirir: Din devlet gücüyle kaynaştığında, ikisi de bozulabilir. Said Nursî'nin \"Eûzü billâhi mine'ş-şeytâni ve's-siyâse\" (\"Şeytandan ve siyasetten Allah'a sığınırım\") sözü, imanı güç mücadelesinin dışında tutmaktan yana bir Müslüman sesidir (Saritoprak, 2008). Pratikte: Mesajı kaynağına ve en iyi insanlarına göre değerlendir, hocalarını dikkatle seç ve istismarcıların imanına sahip olmasına izin verme. İstismara uğradıysan, bu bir günah olduğu kadar bir suçtu da ve onu bildirmelisin."
  en: "Your anger is legitimate, and the Quran shares it: \"Do you order righteousness of the people and forget yourselves while you recite the Scripture? Then will you not reason?\" (2:44); \"Great is hatred in the sight of Allah that you say what you do not do\" (61:3). The Prophet (pbuh) gave the signs of a hypocrite: lying, breaking promises, betraying trust ({hadith:bukhari:33}). Al-Ghazali wrote pages against learned men who use religion \"to enjoy the luxuries of this life\" and \"to achieve power and position among its people\". So the tradition does not ask you to excuse religious people; it gives you the standard to judge them by. But a message is not disproved by those who betray it, any more than medicine is disproved by a doctor who smokes. The serious version of the objection is about institutions and power, and that needs a real answer: when religion is fused with state power, both can be corrupted. Said Nursi's phrase \"I take refuge in God from Satan and politics\" is one Muslim voice for keeping faith out of the struggle for power (Saritoprak, 2008). In practice: judge the message by its source and its best people, choose your teachers carefully, and do not let abusers own your faith. If you were abused, it was a crime as well as a sin, and you should report it."
layers:
  - kind: religious
    tr: |
      - "İnsanlara iyiliği emredip kendinizi unutuyor musunuz?" (2:44); ayrıca 61:2–3, Mâûn sûresi ve münafıklar hakkında Münâfikûn sûresi.
      - Münafığın alametleri yalan söylemek, sözünden dönmek ve emanete ihanet etmektir (Buhârî 33; Müslim 59).
      - "Din nasihattir", yöneticilere nasihat dâhil (Müslim 55).
      - Gazzâlî "dünya âlimlerine" saldırdı. Nursî "şeytandan ve siyasetten" Allah'a sığındı.
    en: |-
      - "Do you command righteousness and forget yourselves?" (2:44); see also 61:2–3, Sūra 107, and Sūra 63 on hypocrites.
      - The signs of a hypocrite are lying, breaking promises and betraying trust (Bukhārī 33; Muslim 59).
      - "Religion is sincere counsel," including counsel to rulers (Muslim 55).
      - Al-Ghazālī attacked the "scholars of this world." Nursi sought refuge "from Satan and politics."
  - kind: philosophical
    tr: |
      İtiraz *ad hominem*dir: mesajı taşıyıcılarına göre yargılar. Veriler karışıktır. Dinî pratik daha fazla bağışı yordar, ama yalnızca dinî bir etiket pek az şeyi yordar. Bu, Kur'an'ın *islâm* (dışa dönük teslimiyet) ile *îmân/ihsân* (iman ve güzellik) arasındaki ayrımına uyar. Adil bir karşı nokta "gerçek İskoç yoktur" sorunudur: kötü aktörlerin hiç gerçek mümin olmadığını söylemek çok kolaydır. Topluluklar kendi başarısızlıklarını sahiplenmelidir.
    en: "The objection is *ad hominem*: it judges the message by its messengers. The data are mixed. Religious practice predicts more giving, but a religious label alone predicts little. That matches the Quran's distinction between *islām* (outward submission) and *īmān/iḥsān* (faith and excellence). A fair counterpoint is the \"no true Scotsman\" problem: it is too easy to say bad actors were never real believers. Communities must own their failures."
  - kind: scientific
    tr: |
      Norris ve Inglehart gençler arasındaki daha hızlı dinden kopuşu din ile devletin iç içe geçmesine bağlar. KONDA'nın Türkiye eğilimi bu örüntüye uyar, ama sebebi kanıtlayamaz.
    en: Norris & Inglehart link faster disaffiliation among the young to the fusion of religion and state. KONDA's Turkish trend fits this pattern but cannot prove the cause.
  - kind: psychological
    tr: |
      Dindarların verdiği yara, "kişilerarası" manevî mücadele olarak ortaya çıkar (Exline ve ark. 2014). İstismar mağdurları için önce güvenlik ve travma terapisi gelir. İstismarcı bir gruptan ayrılmak Allah'tan ayrılmak değildir.
    en: Hurt caused by religious people shows up as "interpersonal" spiritual struggle (Exline et al. 2014). For abuse survivors, safety and trauma therapy come first. Leaving an abusive group is not leaving God.
honestLimits:
  tr: Dinî uygulamanın davranışı değiştirip değiştirmediğine dair araştırmalar çoğunlukla Amerikan'dır ve çoğunlukla bağışla ilgilidir; topluluklar arasında dürüstlük ya da ikiyüzlülük üzerine hiçbir şey okunmadı. Müslim 55'e, Norris ve Inglehart'ın kitabının kendisine (bir incelemenin ötesinde), KONDA verilerine ve Diyanet dergisine ve Nursî'nin sözünün geçtiği esere henüz başvurulmadı.
  en: The research on whether religious practice changes behaviour is mostly American and mostly about giving; nothing was read on honesty or hypocrisy across communities. Muslim 55, the Norris and Inglehart book itself (beyond a review), the KONDA data and the Diyanet magazine, and the work in which Nursi's phrase appears, have not yet been consulted.
visualizations:
  - id: ideas
    tr: |
      Bir "ayna ve pencere" kartı. İkiyüzlülük âyetlerinden bir kaydırıcı. Mesajı, taşıyıcıyı ve kötüye kullanımı ayıran bir ayırıcı.
    en: A "mirror vs window" card. A slider of verses on hypocrisy. A sorter that separates message, messenger and misuse.
