fullAnswer:
  - kind: heart
    en: |-
      **What they did was wrong, and it was not God who did it.** Many people who leave a community feel they are leaving God. They are not the same. Pargament and Exline describe "interpersonal" religious struggles as "Conflicts with other people and institutions about sacred issues, anger at organized religion" — and they write that "Religious/spiritual struggles are not unusual", recommending "normalizing religious/spiritual struggles, which might otherwise be seen as morally wrong" (APA, 2020).

      **If it was abuse.** Over a hundred female Islamic scholars, in a 2024 statement, define spiritual abuse as "the misuse of religious knowledge, authority, or position to control, manipulate" or harm, and say: "The fault always lies with the perpetrators and never with the victim." They write that "It is an Islamic obligation for anyone who witnesses a criminal act or knows of a criminal act" (for a crime "that took place (with evidence)") to report it to the legal authorities, and warn that "concealing harm is going to encourage impunity and further perpetuate that harm" (Female Scholars Network). They add that "no scholar or pious person should be held equal to Allah."

      > **What to do.** If you are in danger, call your local emergency number (112 in Türkiye and across Europe). Report crimes to the police, not only to community leaders. For confidential support in your country, Find A Helpline (findahelpline.com) lists free support lines. For trauma, a qualified therapist comes first; spiritual rebuilding can come after you are safe.

      **Spiritual recovery.** You can rebuild a relationship with God that does not run through the person who hurt you. Start privately; choose new teachers slowly; trust your own judgement when something feels wrong.
    tr: |-
      **Yaptıkları yanlıştı ve onu yapan Allah değildi.** Bir topluluktan ayrılan pek çok insan Allah'tan ayrıldığını hisseder. İkisi aynı şey değildir. Pargament ve Exline "kişiler arası" dinî mücadeleleri "kutsal konularda başka insanlarla ve kurumlarla çatışmalar, örgütlü dine öfke" olarak tarif eder — ve "dinî/manevi mücadelelerin olağan dışı olmadığını" yazar ve "aksi hâlde ahlaken yanlış görülebilecek dinî/manevi mücadeleleri normalleştirmeyi" önerir (APA, 2020).

      **İstismar söz konusuysa.** Yüzü aşkın kadın İslam âlimi, 2024 tarihli bir bildiride, manevi istismarı "dinî bilginin, otoritenin ya da konumun kontrol etmek, manipüle etmek" ya da zarar vermek için kötüye kullanılması olarak tanımlar ve şöyle der: "Kusur her zaman faildedir, asla mağdurda değildir." "Bir suç fiiline tanık olan ya da bir suç fiilini bilen herkesin" ("(delilleriyle) gerçekleşmiş" bir suç için) bunu yasal makamlara bildirmesinin "İslami bir yükümlülük olduğunu" yazarlar ve "zararı gizlemenin cezasızlığı teşvik edeceği ve o zararı daha da sürdüreceği" konusunda uyarırlar (Female Scholars Network). Şunu eklerler: "Hiçbir âlim ya da takva sahibi kişi Allah'a denk tutulmamalıdır."

      > **Ne yapmalı?** Tehlikedeysen bulunduğun yerdeki acil yardım numarasını ara (Türkiye'de ve Avrupa genelinde 112). Suçları yalnızca topluluk önderlerine değil, polise bildir. Ülkende gizli destek için Find A Helpline (findahelpline.com) ücretsiz destek hatlarını listeler. Travma için önce ehil bir terapist gelir; manevi yeniden yapılanma güvende olduktan sonra gelebilir.

      **Manevi iyileşme.** Allah'la, seni inciten kişiden geçmeyen bir ilişkiyi yeniden kurabilirsin. Önce kendi başına başla; yeni hocaları yavaş yavaş seç; bir şey yanlış geldiğinde kendi muhakemene güven.
    title:
      en: Dindar insanlar tarafından incitildiysen
      tr: Dindar insanlar tarafından incitildiysen
  - kind: quran
    en: |-
      **Against saying without doing.** "Do you order righteousness of the people and forget yourselves while you recite the Scripture? Then will you not reason?" (2:44), Medinan, addressed in context to the Children of Israel — the scholars who taught others what they did not practise. "O you who have believed, why do you say what you do not do? Great is hatred in the sight of Allah that you say what you do not do" (61:2–3), Medinan, addressed to believers.

      **The hypocrites (Sura 63).** A whole sura, *al-Munāfiqūn*, Medinan, describes people inside the community: "When the hypocrites come to you, [O Muhammad], they say, 'We testify that you are the Messenger of Allah'… and Allah testifies that the hypocrites are liars" (63:1). "They have taken their oaths as a cover, so they averted [people] from the way of Allah" (63:2). "And when you see them, their forms please you, and if they speak, you listen to their speech. [They are] as if they were pieces of wood propped up" (63:4). The Quran's own picture: impressive appearance and fine speech can hide emptiness.
    tr: |-
      **Yapmadan söylemeye karşı.** "İnsanlara iyiliği emreder de kendinizi unutur musunuz? Halbuki kitab (Tevrat)ı okuyorsunuz. Hâlâ aklınızı başınıza almayacak mısınız?" (2:44), Medenî; bağlamında İsrâiloğulları'na — başkalarına uygulamadıkları şeyi öğreten âlimlere — hitap eder. "Ey iman edenler! Yapmayacağınız şeyi niçin söylüyorsunuz? Yapmayacağınızı söylemeniz, Allah yanında şiddetli bir buğza sebeb olur." (61:2–3), Medenî, müminlere hitap eder.

      **Münafıklar (63. sûre).** Bütün bir sûre, Medenî *el-Münâfikûn*, topluluğun içindeki insanları anlatır: "Münafıklar sana geldikleri vakit: "Şahitlik ederiz ki sen muhakkak Allah'ın elçisisin." derler… ve Allah münafıkların yalancı olduklarına şahitlik eder" (63:1). "Yeminlerini kalkan yapıp (insanları) Allah'ın yolundan çevirdiler." (63:2). "Onları gördüğün zaman kalıpları hoşuna gider, konuşurlarsa sözlerini dinlersin. Onlar sanki dayanmış keresteler gibidirler." (63:4). Kur'an'ın kendi tablosu: Etkileyici bir görünüş ve güzel söz boşluğu gizleyebilir.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: |-
      **The signs of a hypocrite.** Abu Hurayra (ra) reports three: "Whenever he speaks, he tells a lie", whenever he promises he breaks it, and whenever he is trusted he betrays ({hadith:bukhari:33}). These are tests anyone can apply to a teacher.

      The Prophet (pbuh) said that religion is sincere good will (*naṣīḥa*): "For Allah, His Book, His Messenger and for the leaders and the general Muslims" ({hadith:muslim:55}). Sincere counsel to leaders is part of the religion, not disloyalty to it.
    tr: '**Münafığın alametleri.** Ebû Hüreyre (r.a.) üç alamet aktarır: "Konuştuğunda yalan söyler", söz verdiğinde sözünden döner ve kendisine güvenildiğinde hıyanet eder ({hadith:bukhari:33}). Bunlar herkesin bir hocaya uygulayabileceği sınavlardır.'
    title:
      en: Hz. Peygamber (s.a.v.) ne öğretti?
      tr: Hz. Peygamber (s.a.v.) ne öğretti?
  - kind: scholars
    en: |-
      **Al-Ghazali against "the learned men of this world".** In the Book of Knowledge of his *Iḥyāʾ*, Section VI, al-Ghazali (d. 1111) distinguishes "teachers of falsehood" from "the learned men of the hereafter" (Faris's translation). The former seek knowledge "to enjoy the luxuries of this life" and "to achieve power and position among its people"; they frequent rulers — he quotes Saʿid ibn al-Musayyab: "If you see a learned man frequent the houses of the rulers, beware of him because he is a thief." The scholars of the hereafter, by contrast, "should not seek this world through their knowledge", practise what they teach, live simply, keep away from rulers' courts, and say "I do not know" when unsure. Al-Ghazali also cites several hadith here; at least two are weak and nothing on this page rests on them: "the end of time there will be ignorant worshippers and corrupt learned men" (al-Hakim, *al-Mustadrak* 8081; its chain is graded very weak, and al-Dhahabi calls the narrator Yusuf b. ʿAtiyya *hālik*, worthless) and "Whoever would increase in knowledge but would not increase in righteousness would increase Allah's wrath upon him" (al-ʿIraqi, *al-Mughnī*, no. 140: narrated by al-Daylami "with a weak chain"). A third, "No man will be learned unless he puts knowledge into practice", he also gives as the Prophet's saying; its grade was not found. (Grades as reported by the independent source check of this report, from tohed.com and hadithanswers.com.)

      **Nursi: "I take refuge in God from Satan and politics."** Said Nursi coined this phrase, and Zeki Saritoprak's study examines why, comparing his reading of some Quranic verses with Sayyid Qutb's (Saritoprak, 2008). The abstract read does not give the work in which the phrase appears or Nursi's full reasons. The phrase itself is a Muslim scholar's warning against using faith as a political tool.
    tr: |-
      **Gazzâlî "dünya âlimlerine" karşı.** Gazzâlî (ö. 1111), *İhyâ*'nın İlim Kitabı'nın VI. bölümünde "batılın hocalarını" "ahiret âlimlerinden" ayırır (Faris'in çevirisi). Birinciler ilmi "bu hayatın lükslerinden yararlanmak" ve "halkı arasında güç ve makam elde etmek" için ararlar; yöneticilerin kapısını aşındırırlar — Saîd b. Müseyyeb'den şunu aktarır: "Bir âlimin yöneticilerin kapısını aşındırdığını görürsen, ondan sakın, çünkü o bir hırsızdır." Ahiret âlimleri ise "ilimleriyle bu dünyayı aramamalı", öğrettiklerini uygulamalı, sade yaşamalı, yöneticilerin saraylarından uzak durmalı ve emin olmadıklarında "bilmiyorum" demelidir. Gazzâlî burada birkaç hadis de zikreder; en az ikisi zayıftır ve bu sayfadaki hiçbir şey onlara dayanmaz: "Ahir zamanda cahil âbidler ve fasık âlimler olacak" (Hâkim, *el-Müstedrek* 8081; senedi çok zayıf olarak derecelendirilmiştir ve Zehebî râvi Yûsuf b. Atiyye'ye *hâlik*, değersiz der) ve "Kimin ilmi artar da takvası artmazsa, Allah'ın ona olan gazabı artar" (Irâkî, *el-Muğnî*, no. 140: Deylemî "zayıf bir senedle" rivayet etmiştir). Üçüncüsünü, "Kişi ilmiyle amel etmedikçe âlim olmaz", de Hz. Peygamber'in sözü olarak verir; derecesi bulunamadı. (Dereceler, bu raporun bağımsız kaynak denetiminin tohed.com ve hadithanswers.com'dan aktardığı şekliyledir.)

      **Nursî: "Eûzü billâhi mine'ş-şeytâni ve's-siyâse."** Said Nursî bu ifadeyi ("Şeytandan ve siyasetten Allah'a sığınırım") ortaya koydu ve Zeki Sarıtoprak'ın çalışması, onun bazı âyetleri okuyuşunu Seyyid Kutub'unkiyle karşılaştırarak bunun sebebini inceler (Saritoprak, 2008). Okunan özet, ifadenin geçtiği eseri ya da Nursî'nin gerekçelerinin tamamını vermiyor. İfadenin kendisi, imanı siyasi bir araç olarak kullanmaya karşı bir Müslüman âlimin uyarısıdır.
    title:
      en: Gazzâlî ve Nursî ne dedi?
      tr: Gazzâlî ve Nursî ne dedi?
  - kind: reasoning
    en: |-
      **1. The personal form: "religious people are bad".** *Reply:* this judges a message by its messengers (an *ad hominem*). Hypocrisy shows a gap between what people say and what they do; it does not show that what they say is false. The Quran itself condemns that gap more harshly than most critics (61:3). *Limit:* if a faith claims to transform people, some evidence of transformation is a fair thing to ask for (see "What research shows").

      **2. The institutional form: "religion is a tool of power".** This is the strongest version. When religion is joined to state power, those in power have every reason to bend it to their needs, and religious officials have every reason to please them. Al-Ghazali saw exactly this danger in the scholars who "frequent the houses of the rulers". *Reply:* the tradition contains its own critique of this — al-Ghazali's Section VI, Nursi's refusal of politics — and the Quran's standard (justice, honesty, 4:135; 5:8) is above any ruler. *Limit:* a critique inside the tradition does not undo the harm done by institutions; communities have to change practice, not only quote their critics.

      **3. The "unfalsifiable" worry.** If good believers confirm the faith and bad believers also confirm it, nothing could count against it. *Reply:* the claim is narrower. The Quran predicts that hypocrites will exist; it also claims that sincere faith and practice change people. The second claim *can* fail: if, over a whole community, sincere practice made no difference to honesty, generosity or care, that would count against it. *Limit:* measuring sincerity is hard, so in practice the test is never clean.

      **"No true Scotsman."** It is too easy to say that every bad actor "was never a real Muslim". The honest position: some bad actors are sincere believers who sin; some are hypocrites; communities must own their failures in both cases.
    tr: |-
      **1. Kişisel biçim: "Dindar insanlar kötü."** *Cevap:* Bu, bir mesajı elçilerine göre değerlendirmektir (*ad hominem*). İkiyüzlülük, insanların söyledikleri ile yaptıkları arasında bir uçurum olduğunu gösterir; söyledikleri şeyin yanlış olduğunu göstermez. Kur'an'ın kendisi bu uçurumu eleştirmenlerin çoğundan daha sert kınar (61:3). *Sınır:* Bir inanç insanları dönüştürdüğünü iddia ediyorsa, dönüşümün bir miktar delilini istemek adil bir taleptir (bkz. "Araştırmalar ne gösteriyor?").

      **2. Kurumsal biçim: "Din bir güç aracıdır."** Bu en güçlü biçimdir. Din devlet gücüyle birleştiğinde, iktidardakilerin onu ihtiyaçlarına göre eğmek için her türlü sebebi vardır ve din görevlilerinin de onları memnun etmek için her türlü sebebi vardır. Gazzâlî tam da bu tehlikeyi "yöneticilerin kapısını aşındıran" âlimlerde gördü. *Cevap:* Gelenek bunun kendi eleştirisini içerir — Gazzâlî'nin VI. bölümü, Nursî'nin siyaseti reddi — ve Kur'an'ın ölçüsü (adalet, dürüstlük, 4:135; 5:8) her yöneticinin üstündedir. *Sınır:* Geleneğin içindeki bir eleştiri, kurumların verdiği zararı ortadan kaldırmaz; topluluklar yalnızca eleştirmenlerinden alıntı yapmakla değil, uygulamayı değiştirmekle yükümlüdür.

      **3. "Yanlışlanamaz" kaygısı.** İyi müminler inancı doğruluyorsa ve kötü müminler de doğruluyorsa, hiçbir şey onun aleyhine sayılamaz. *Cevap:* İddia daha dardır. Kur'an münafıkların var olacağını önceden bildirir; ama aynı zamanda samimi iman ve uygulamanın insanları değiştirdiğini iddia eder. İkinci iddia *başarısız olabilir*: Bütün bir toplulukta samimi uygulama dürüstlük, cömertlik ya da özen bakımından hiçbir fark yaratmasaydı, bu onun aleyhine sayılırdı. *Sınır:* Samimiyeti ölçmek zordur, dolayısıyla pratikte sınav hiçbir zaman temiz değildir.

      **"Gerçek İskoç olmaz" safsatası.** Her kötü aktörün "hiçbir zaman gerçek bir Müslüman olmadığını" söylemek fazla kolaydır. Dürüst tutum: Bazı kötü aktörler günah işleyen samimi müminlerdir; bazıları münafıktır; topluluklar her iki durumda da başarısızlıklarını sahiplenmelidir.
    title:
      en: İtirazın üç biçimi
      tr: İtirazın üç biçimi
  - kind: science
    en: |-
      **Giving.** [Moderate; US data] In the Philanthropy Panel Study (more than 9,000 individuals and families), 62% of religiously affiliated households gave to charity of any kind, against 46% of households with no religious affiliation; affiliated households "give as much or more to other types of charities"; monthly attenders were "11 times more likely to give to religious congregations" (Lake Institute, 2017). The main finding is about the label: affiliated households give more, and not only to congregations. The "11 times" figure compares monthly attenders with those who attend less than once a month, and covers giving to congregations only. The source read does not separate the effect of practice from that of the label.

      **Religious struggles.** Pargament and Exline report that, in a national sample, "higher levels of religious/spiritual struggle were tied to many indicators of psychopathology", and note that "Much of the research on this topic has been correlational in nature", which leaves causes open (APA, 2020).

      **Religion and the state.** Norris and Inglehart's *Sacred and Secular* (2004) explains religious decline mainly by "existential security": "the experience of people living in weak and vulnerable societies heightens the importance of religious values" (Ikenberry's review).

      **Is hypocrisy worse among Muslims?** No study comparing hypocrisy across religious communities was read, so this page makes no claim either way.
    tr: |-
      **Bağış.** [Orta; ABD verileri] Hayırseverlik Panel Çalışması'nda (9.000'den fazla birey ve aile), dinî aidiyeti olan hanelerin %62'si herhangi bir türde hayır kurumuna bağış yaparken, dinî aidiyeti olmayan hanelerde bu oran %46'ydı; aidiyeti olan haneler "diğer hayır kurumu türlerine de aynı ya da daha fazla bağış yapıyor"; her ay ibadete katılanların "dinî cemaatlere bağış yapma olasılığı 11 kat daha yüksek" (Lake Institute, 2017). Ana bulgu etiketle ilgilidir: Aidiyeti olan haneler daha fazla bağış yapıyor, yalnızca cemaatlere değil. "11 kat" rakamı her ay katılanları ayda birden az katılanlarla karşılaştırır ve yalnızca cemaatlere yapılan bağışı kapsar. Okunan kaynak uygulamanın etkisini etiketin etkisinden ayırmıyor.

      **Dinî mücadeleler.** Pargament ve Exline, ulusal bir örneklemde "daha yüksek dinî/manevi mücadele düzeylerinin psikopatolojinin pek çok göstergesine bağlı olduğunu" bildirir ve "bu konudaki araştırmaların çoğunun korelasyonel nitelikte olduğunu" not eder; bu da sebepleri açık bırakır (APA, 2020).

      **Din ve devlet.** Norris ve Inglehart'ın *Sacred and Secular* (*Kutsal ve Seküler*, 2004) adlı kitabı dinî gerilemeyi esas olarak "varoluşsal güvenlik" ile açıklar: "Zayıf ve kırılgan toplumlarda yaşayan insanların tecrübesi dinî değerlerin önemini artırır" (Ikenberry'nin incelemesi).

      **İkiyüzlülük Müslümanlar arasında daha mı kötü?** Dinî topluluklar arasında ikiyüzlülüğü karşılaştıran hiçbir çalışma okunmadı, dolayısıyla bu sayfa her iki yönde de bir iddiada bulunmuyor.
    title:
      en: Araştırmalar ne gösteriyor?
      tr: Araştırmalar ne gösteriyor?
  - kind: history
    en: |-
      **What is Diyanet?** The Presidency of Religious Affairs is "a state institution established in 1924" in Türkiye, created "to administer the affairs related to faith and worship of the religion of Islam". It writes a weekly sermon read in about 85,000 mosques, trains and employs Türkiye's imams as civil servants, and follows the Hanafi school. Starting from 2006, its staff "doubled to nearly 150,000" and its budget "quadrupled to over $2 billion by 2015"; critics have accused it of "serving for the ruling AKP party" (Wikipedia, citing Cornell 2015). Separately, and earlier, Wikipedia records that "During the Government of Süleyman Demirel, the Diyanet's approach towards the Alevi became denialist in nature", and that under its president Mehmet Görmez the Alevi question "was acknowledged for the first time".

      **The 2016 coup attempt.** In 2017 the UK House of Commons Foreign Affairs Committee reportedly accepted that some Gülenists were involved, but found that the claim that the movement as a whole and its leadership were behind the coup "is not substantiated by hard, publicly available evidence" (as reported by Al Jazeera, 25 March 2017). About 300 people were killed. President Erdoğan said the plotters were "linked to the Gülen movement", which the government later designated "FETÖ". Fethullah Gülen said: "I categorically deny such accusations." Germany's intelligence chief said Germany was unconvinced, and a British parliamentary committee found "no hard evidence that Fethullah Gülen masterminded the failed coup", though some Gülenists were involved. In the aftermath, "150,000 government officials and workers" were suspended (*Wikipedia*). This page takes no side in Turkish party politics. Whether, and how much, these events damaged young people's trust in religion is a question for survey data, and none was read.
    tr: |-
      **Diyanet nedir?** Diyanet İşleri Başkanlığı, Türkiye'de "İslam dininin inanç ve ibadetiyle ilgili işlerini yürütmek" için "1924'te kurulmuş bir devlet kurumudur". Yaklaşık 85.000 camide okunan haftalık bir hutbe yazar, Türkiye'nin imamlarını devlet memuru olarak yetiştirir ve istihdam eder ve Hanefî mezhebini izler. 2006'dan itibaren personeli "yaklaşık 150.000'e iki katına çıktı" ve bütçesi "2015'e kadar dört katına çıkarak 2 milyar doları aştı"; eleştirmenler onu "iktidardaki AKP'ye hizmet etmekle" suçladı (Wikipedia, Cornell 2015'e atıfla). Ayrı olarak ve daha önce, Wikipedia "Süleyman Demirel hükümeti döneminde Diyanet'in Alevilere yaklaşımının inkârcı bir nitelik kazandığını" ve başkanı Mehmet Görmez döneminde Alevi meselesinin "ilk kez kabul edildiğini" kaydeder.

      **2016 darbe girişimi.** 15 Temmuz 2016 gecesi "300'den fazla kişi öldürüldü" ve "2.100'den fazla kişi yaralandı". Cumhurbaşkanı Erdoğan darbecilerin "Gülen hareketiyle bağlantılı" olduğunu söyledi; hükümet daha sonra hareketi "FETÖ" olarak tanımladı. Fethullah Gülen şöyle dedi: "Bu tür suçlamaları kesinlikle reddediyorum." Almanya'nın istihbarat başkanı Almanya'nın ikna olmadığını söyledi ve bir İngiliz parlamento komitesi, bazı Gülencilerin dahil olduğunu, ama "Fethullah Gülen'in başarısız darbeyi yönettiğine dair somut bir delil bulunmadığını" tespit etti. Sonrasında "150.000 kamu görevlisi ve çalışanı" görevden uzaklaştırıldı (*Wikipedia*). Bu sayfa Türk parti siyasetinde taraf tutmuyor. Bu olayların gençlerin dine güvenine zarar verip vermediği ve ne kadar zarar verdiği anket verilerine ait bir sorudur ve hiçbiri okunmadı.
    title:
      en: Türkiye bağlamı
      tr: Türkiye bağlamı
  - kind: objection
    en: |-
      **"If religion doesn't make people better, why believe?"** *Reply:* the evidence that religious affiliation goes with some prosocial behaviour, such as giving, is real but modest (and mostly American); and Islam itself expects many who carry its name to fall short. *Limit:* modest effects will not satisfy someone who expected religion to make people saints.

      **"Your own scholars served tyrants."** *Reply:* some did, and al-Ghazali condemned them in his *Iḥyāʾ*. *Limit:* the existence of honest critics does not cancel the record.

      **"'Misuse confirms the Quran' is unfalsifiable."** *Reply:* only the narrow claim (that hypocrites exist) is confirmed; the broader claim (that sincere practice changes people) can fail. *Limit:* testing it cleanly is hard.
    tr: |-
      **"Din insanları daha iyi yapmıyorsa, neden inanayım?"** *Cevap:* Dinî aidiyetin bağış gibi bazı toplum yanlısı davranışlarla birlikte gittiğine dair delil gerçektir ama mütevazıdır (ve çoğunlukla Amerikan'dır); ve İslam'ın kendisi onun adını taşıyan pek çok kişinin yetersiz kalmasını bekler. *Sınır:* Mütevazı etkiler, dinin insanları aziz yapmasını bekleyen birini tatmin etmeyecektir.

      **"Kendi âlimleriniz zalimlere hizmet etti."** *Cevap:* Bazıları etti ve Gazzâlî onları *İhyâ*'sında kınadı. *Sınır:* Dürüst eleştirmenlerin varlığı kaydı silmez.

      **"'Kötüye kullanım Kur'an'ı doğrular' yanlışlanamaz bir iddiadır."** *Cevap:* Yalnızca dar iddia (münafıkların var olduğu) doğrulanır; daha geniş iddia (samimi uygulamanın insanları değiştirdiği) başarısız olabilir. *Sınır:* Onu temiz bir şekilde sınamak zordur.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      - **The Quran and Sunna** — hypocrisy is condemned and expected; judge people by honesty, keeping promises and trust (Bukhari 33).
      - **Al-Ghazali** — distinguish the learned men of this world from the learned men of the hereafter.
      - **Nursi** — keep faith away from politics.
      - **Secular critics** — religion functions as a tool of power.
      - **Female Scholars Network** — abuse must be reported; cover-ups are a further wrong.
    tr: |-
      - **Kur'an ve Sünnet** — ikiyüzlülük kınanır ve beklenir; insanları dürüstlüğe, sözünü tutmaya ve emanete göre değerlendir (Buhârî 33).
      - **Gazzâlî** — dünya âlimlerini ahiret âlimlerinden ayır.
      - **Nursî** — imanı siyasetten uzak tut.
      - **Seküler eleştirmenler** — din bir güç aracı işlevi görür.
      - **Female Scholars Network** — istismar bildirilmelidir; örtbas etmek ayrı bir haksızlıktır.
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
followUps:
  - q:
      en: How do I tell the message apart from the people, when the people are the ones teaching me?
      tr: Bana öğretenler insanlarsa, mesajı insanlardan nasıl ayırırım?
    a:
      en: 'Use the tests the tradition gives: does the teacher lie, break promises, betray trust (Bukhari 33)? Do they practise what they teach, live simply, avoid courting power, and say "I do not know" (al-Ghazali)? Check what they say against the Quran and against more than one teacher.'
      tr: "Geleneğin verdiği sınavları kullan: Hoca yalan söylüyor mu, sözünden dönüyor mu, emanete hıyanet ediyor mu (Buhârî 33)? Öğrettiğini uyguluyor mu, sade yaşıyor mu, güce yaranmaktan kaçınıyor mu ve \"bilmiyorum\" diyor mu (Gazzâlî)? Söylediklerini Kur'an'la ve birden fazla hocayla karşılaştır."
  - q:
      en: Who are the "best examples" I should look at?
      tr: Bakmam gereken "en iyi örnekler" kim?
    a:
      en: The Prophet (pbuh) first; then people you can see up close who are honest, humble, generous and fair — often not the most famous. Al-Ghazali's description of the "learned men of the hereafter" is a portrait to look for.
      tr: Önce Hz. Peygamber (s.a.v.); sonra yakından görebildiğin, dürüst, mütevazı, cömert ve adil insanlar — çoğu zaman en ünlüler değil. Gazzâlî'nin "ahiret âlimleri" tarifi, aranacak bir portredir.
  - q:
      en: If religious practice really changes people, where is the evidence?
      tr: Dinî uygulama insanları gerçekten değiştiriyorsa, delil nerede?
    a:
      en: "Some, modest: in the US, religious households are more likely to give to charity (62% against 46%), and frequent attenders far more likely to give to congregations (Lake Institute, 2017). No study on honesty or hypocrisy across communities was read."
      tr: "Biraz var, mütevazı: ABD'de dindar hanelerin hayır kurumlarına bağış yapma olasılığı daha yüksek (%62'ye karşı %46) ve sık katılanların cemaatlere bağış yapma olasılığı çok daha yüksek (Lake Institute, 2017). Topluluklar arasında dürüstlük ya da ikiyüzlülük üzerine hiçbir çalışma okunmadı."
  - q:
      en: What is Diyanet, and which "religious network" is behind the 2016 coup attempt?
      tr: Diyanet nedir ve 2016 darbe girişiminin arkasında hangi "dinî yapı" var?
    a:
      en: Diyanet is Türkiye's state religious authority, founded in 1924. The government blames the Gülen movement ("FETÖ") for the coup attempt; Gülen denied it; some foreign bodies said they had not seen conclusive evidence that he masterminded it, though a British parliamentary committee found that some Gülenists were involved (*Wikipedia*).
      tr: Diyanet, 1924'te kurulan Türkiye'nin devlet din otoritesidir. Hükümet darbe girişimi için Gülen hareketini ("FETÖ") suçluyor; Gülen bunu reddetti; bazı yabancı kurumlar onun darbeyi yönettiğine dair kesin bir delil görmediklerini söyledi, ancak bir İngiliz parlamento komitesi bazı Gülencilerin dahil olduğunu tespit etti (*Wikipedia*).
  - q:
      en: Is hypocrisy a bigger problem in Muslim communities than in others?
      tr: İkiyüzlülük Müslüman topluluklarda diğerlerinden daha büyük bir sorun mu?
    a:
      en: No comparative study was read; the Quran treats hypocrisy as a danger in every community of faith (2:44 was addressed to the People of the Book; 61:2–3 to believers).
      tr: Karşılaştırmalı hiçbir çalışma okunmadı; Kur'an ikiyüzlülüğü her inanç topluluğunda bir tehlike olarak ele alır (2:44 Ehl-i Kitab'a, 61:2–3 müminlere hitap eder).
  - q:
      en: Where in the *Iḥyāʾ* does al-Ghazali attack the "learned men of this world"?
      tr: "*İhyâ*'nın neresinde Gazzâlî \"dünya âlimlerine\" saldırır?"
    a:
      en: In the Book of Knowledge (*Kitāb al-ʿIlm*), Section VI, on the evils of knowledge and the signs of the learned men of the hereafter (tr. Faris).
      tr: İlim Kitabı'nda (*Kitâbü'l-İlm*), VI. bölümde; ilmin âfetleri ve ahiret âlimlerinin alametleri üzerine (Faris'in çevirisi).
