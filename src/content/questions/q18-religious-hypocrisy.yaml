id: Q18
slugs:
  tr: dindarlarin-davranislari
  en: religious-hypocrisy
order: 18
theme: hypocrisy
title:
  tr: '"Dindarlar böyle davranıyorsa, neden inanayım?"'
  en: '"If religious people act like this, why believe?"'
sensitivity: high
helpCard: general
verses:
  - 2:44
  - 61:2-3
steelman:
  tr: |
    Bir inanç insanları gerçekten dönüştürüyorsa, kamusal yüzü daha iyi görünmeliydi. Yalan söyleyen vaizler, örtbas edilen istismarlar ve oy kazanmak için kullanılan din, onun bir güç aracı olduğunu düşündürüyor.
  en: If a faith truly transforms people, its public face should look better. Lying preachers, abuse cover-ups and religion used to win votes suggest it is a tool of power.
whyAsked:
  tr: |
    Bu, Yaqeen verilerindeki en büyük tetikleyicidir. Türkiye'de gençler şunları gördü:
    - dinin rakip siyasi ve cemaat aktörlerince kullanılması;
    - dinî yurtlardaki istismar vakaları;
    - devletin dinî bir yapılanmaya bağladığı 2016 darbe girişimi.

    Diyanet'in kendi aylık dergisi (Kasım 2018) gençlerin *din istismarından* nasıl korunacağını sordu. Bu, mantıktan değil ihanetten doğan bir şüphedir.
  en: |-
    This is the top trigger in Yaqeen's data. In Türkiye, young people have seen:
    - religion used by rival political and community actors;
    - abuse cases in religious dormitories;
    - the 2016 coup attempt, which the state attributes to a religious network.

    Diyanet's own monthly magazine (November 2018) asked how to protect youth from *din istismarı* (exploitation of religion). This is doubt born of betrayal, not of logic.
shortAnswer:
  tr: |
    Kur'an müminler arasında ikiyüzlülük olacağını bekler ve onu hiçbir eleştirmenin yapmadığı kadar sert kınar. Dinin kötüye kullanılması, Kur'an'ın insan doğasına dair anlatımını doğrular; sigara içen bir doktor tıbbı çürütmez. Öfken meşrudur. Mesajı kaynağına ve en iyi örneklerine göre değerlendir; yozlaşmış insanların imanını sahiplenmesine izin verme.
  en: The Quran expects hypocrisy among believers and condemns it more harshly than any critic does. Misuse of religion confirms its account of human nature; a doctor who smokes does not disprove medicine. Your anger is legitimate. Judge the message by its source and its best examples, and don't let corrupt people own your faith.
layers:
  - kind: religious
    tr: |
      - "İnsanlara iyiliği emredip kendinizi unutuyor musunuz?" (2:44); ayrıca 61:2–3, Mâûn sûresi ve münafıklar hakkında Münâfikûn sûresi.
      - Münafığın alametleri yalan söylemek, sözünden dönmek ve emanete ihanet etmektir (Buhârî 33; Müslim 59).
      - "Din nasihattir", yöneticilere nasihat dâhil (Müslim 55).
      - Gazzâlî "dünya âlimlerine" saldırdı. Nursî "şeytandan ve siyasetten" Allah'a sığındı.
    en: |-
      - "Do you command righteousness and forget yourselves?" (2:44); see also 61:2–3, Sūra 107, and Sūra 63 on hypocrites.
      - The signs of a hypocrite are lying, breaking promises and betraying trust (Bukhārī 33; Muslim 59).
      - "Religion is sincere counsel," including counsel to rulers (Muslim 55).
      - Al-Ghazālī attacked the "scholars of this world." Nursi sought refuge "from Satan and politics."
  - kind: philosophical
    tr: |
      İtiraz *ad hominem*dir: mesajı taşıyıcılarına göre yargılar. Veriler karışıktır. Dinî pratik daha fazla bağışı yordar, ama yalnızca dinî bir etiket pek az şeyi yordar. Bu, Kur'an'ın *islâm* (dışa dönük teslimiyet) ile *îmân/ihsân* (iman ve güzellik) arasındaki ayrımına uyar. Adil bir karşı nokta "gerçek İskoç yoktur" sorunudur: kötü aktörlerin hiç gerçek mümin olmadığını söylemek çok kolaydır. Topluluklar kendi başarısızlıklarını sahiplenmelidir.
    en: "The objection is *ad hominem*: it judges the message by its messengers. The data are mixed. Religious practice predicts more giving, but a religious label alone predicts little. That matches the Quran's distinction between *islām* (outward submission) and *īmān/iḥsān* (faith and excellence). A fair counterpoint is the \"no true Scotsman\" problem: it is too easy to say bad actors were never real believers. Communities must own their failures."
  - kind: scientific
    tr: |
      Norris ve Inglehart gençler arasındaki daha hızlı dinden kopuşu din ile devletin iç içe geçmesine bağlar. KONDA'nın Türkiye eğilimi bu örüntüye uyar, ama sebebi kanıtlayamaz.
    en: Norris & Inglehart link faster disaffiliation among the young to the fusion of religion and state. KONDA's Turkish trend fits this pattern but cannot prove the cause.
  - kind: psychological
    tr: |
      Dindarların verdiği yara, "kişilerarası" manevî mücadele olarak ortaya çıkar (Exline ve ark. 2014). İstismar mağdurları için önce güvenlik ve travma terapisi gelir. İstismarcı bir gruptan ayrılmak Allah'tan ayrılmak değildir.
    en: Hurt caused by religious people shows up as "interpersonal" spiritual struggle (Exline et al. 2014). For abuse survivors, safety and trauma therapy come first. Leaving an abusive group is not leaving God.
honestLimits:
  tr: |
    Türkiye'deki topluluklar da, başkaları gibi, zaman zaman istismarcıları korudu ve inancı siyasi olarak kullandı. "Bu gerçek İslam değil" demek yetmez. Bu site:
    - istismarı hem günah hem suç olarak adlandırır;
    - hukukî ve klinik yardıma yönlendirir;
    - parti siyasetinden uzak durur;
    - *hangi taraftan* gelirse gelsin kötüye kullanımı eleştirir.
  en: |
    Turkish communities, like others, have sometimes shielded abusers and used faith politically. "That's not real Islam" is not enough. This site:
    - names abuse as both sin and crime;
    - points to legal and clinical help;
    - avoids party politics;
    - criticises misuse by *any* side.
visualizations:
  - id: ideas
    tr: |
      Bir "ayna ve pencere" kartı. İkiyüzlülük âyetlerinden bir kaydırıcı. Mesajı, taşıyıcıyı ve kötüye kullanımı ayıran bir ayırıcı.
    en: A "mirror vs window" card. A slider of verses on hypocrisy. A sorter that separates message, messenger and misuse.
