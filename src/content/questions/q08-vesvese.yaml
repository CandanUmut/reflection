title:
  tr: Şüphe etmek günah mı? Aklıma sürekli küfür gibi düşünceler geliyor.
  en: Is doubting a sin? I keep having blasphemous thoughts.
steelman:
  tr: Allah hakkında istemediğim düşünceler durmadan geliyor. Namazımı ve abdestimi tekrar tekrar kontrol ediyorum. Gerçek bir mümin bu düşünceleri yaşar mı?
  en: "\"A terrible thought about God comes into my head — an insult, a doubt, an image I would never choose. I try to push it away and it comes back stronger. I wash again for prayer because I'm not sure I did it right, and then again. I'm afraid that having these thoughts means I am not really a believer, or that I have already left Islam without meaning to. A real Muslim wouldn't think like this. Would he?\""
whyAsked:
  tr: Dinî titizlik takıntısı (vesvese) dindar insanlarda sık görülür ve takvanın arkasına gizlenir.
  en: Unwanted, intrusive thoughts are very common, and in religious people they often attach to the things they care about most. Many people suffer in silence for years because they are ashamed to say what the thoughts are, and because they think the thoughts themselves are sins.
shortAnswer:
  tr: |
    İstenmeyen düşünceler inanç değildir. Allah, eyleme dökülmeyen ve dile getirilmeyen iç seslenmeleri affeder (Buhârî 5269; Müslim 127). Hz. Peygamber, sahâbenin bu düşüncelerden duyduğu rahatsızlığı "sarih iman" diye niteledi (Müslim 132). Sık tekrarlayan kontrol döngüleri, tedavi edilebilen bir durum olan dinî titizlik tipi obsesif-kompulsif bozukluğun (OKB) işareti olabilir. Yardım istemek imanla çelişmez.
  en: 'Unwanted thoughts are not beliefs, and you are not held to account for them. The Prophet (pbuh) said that God has forgiven his community what occurs in their minds as long as they do not act on it or speak it ({hadith:bukhari:5269}; {hadith:muslim:127a}). When his Companions told him they had thoughts too terrible to say aloud, he called their distress "the faith manifest" ({hadith:muslim:132a}). Jurists taught people troubled by misgivings not to dwell on them, because "certainty is not lifted by a doubt" (Ibn Nujaym, via Rabbani). If the thoughts come in loops that you feel you must neutralise — by repeating, checking or seeking reassurance — this may be scrupulosity, a form of obsessive-compulsive disorder (OCD). It is treatable, and the main treatment fits closely with what the jurists advised. Honest intellectual doubt is different: it is a question to think through, not a thought to push away.'
layers:
  - kind: religious
    tr: |
      Fakihler vesveseye yakalanan kişilere şüphelerini önemsememelerini ve ibadetlerini tekrarlamamalarını öğütlemiştir. Bu öğüt, "maruz bırakma ve tepki önleme" (exposure and response prevention) yöntemine paraleldir.
    en: |
      Jurists advised people with vesvese to ignore their doubts and not repeat acts, which parallels exposure and response prevention.
  - kind: philosophical
    tr: |
      Araştırma olarak şüphe (Gazzâlî'nin yolu) ile takıntı olarak şüphe aynı şey değildir.
    en: |
      Doubt as inquiry (al-Ghazālī) differs from doubt as compulsion.
  - kind: clinical
    tr: |
      - Dinî titizlik (skrupulozite), OKB hastalarının yaklaşık **%5–33**'ünde görülür.
      - Dinî titizlik yaşayan hastaların yaklaşık **%70**'i, durumun dinî pratiklerini aksattığını bildirir.
      - Dinî temalı OKB, Orta Doğu örneklemlerinde ortalama yaklaşık **%52**, Türkiye'de yaklaşık **%27** oranında görülür. [Scholarly] Örneklemler farklılık gösterir.
      - İbn Haldun Üniversitesi'nde İslam'la bütünleştirilmiş bir psikoterapi yöntemi (TIIP) üzerine yürütülen klinik çalışma (NCT07872462) Mart 2026'da tamamlandı; araştırma yazıldığında sonuçları henüz yayımlanmamıştı.
    en: |
      - Scrupulosity appears in about **5–33%** of OCD patients.
      - About **70%** of scrupulosity patients report that it interferes with their religious practice.
      - Religious-themed OCD averages around **52%** in Middle Eastern samples and about **27%** in Turkey. [Scholarly] Samples vary.
      - A trial of Traditional Islamically Integrated Psychotherapy (TIIP) at Ibn Haldun University (NCT07872462) was completed in March 2026; when the research was written, its results were not yet available.
  - kind: psychological
    tr: |
      Yaqeen Enstitüsü'ne göre vesvese, OKB'nin dinî bir görünümüdür; bir "Müslüman hastalığı" değildir. Bir klinisyen ile bir imamın birlikte çalışmasını gerektirir.
    en: |
      Yaqeen Institute describes waswasa as a religious presentation of OCD, not a "Muslim disease". It needs a clinician and an imam to work together.
honestLimits:
  tr: Bir internet sitesi teşhis koyamaz.
  en: A website cannot diagnose OCD. The Maliki, Shafiʿi and Hanbali works on *waswasa* were not read here, and the clinical prevalence figures for Muslim and Turkish samples could not be traced. The overlap between the jurists' advice and ERP is a modern observation (Awad), not a claim that classical jurists knew of OCD.
