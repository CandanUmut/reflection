fullAnswer:
  - kind: heart
    en: |-
      **The fact that the thought horrifies you is the clearest sign of what you actually believe.** A person who has stopped believing is not tormented by a thought that insults God. The torment comes from the love.

      **You do not have to argue with the thought, answer it, or prove to yourself that you don't believe it.** Trying to win that argument is what keeps it going. You can let it be there, the way you let a car alarm in the street be there, and carry on with what you were doing.

      **You are not alone, and you are not uniquely bad.** Awad cites an international study (Radomsky et al., 2014) estimating that "about 94% of the human population worldwide experience intrusive thoughts"; the study's own sample has not yet been checked. What differs is how much they stick.

      **If you are in distress right now:** speak to someone you trust today. In North America, Naseeha (1-866-627-3342) is a confidential Muslim helpline; in the UK, the Muslim Youth Helpline and Samaritans (116 123); in Türkiye, call 112 in an emergency; elsewhere, findahelpline.com lists free services by country. If you ever have thoughts of harming yourself, call your local emergency number.
    tr: |-
      **Düşüncenin seni dehşete düşürmesi, gerçekte neye inandığının en açık işaretidir.** İnanmayı bırakmış biri, Allah'a hakaret eden bir düşünceden azap duymaz. Azap sevgiden gelir.

      **Düşünceyle tartışmak, ona cevap vermek ya da kendine ona inanmadığını ispat etmek zorunda değilsin.** O tartışmayı kazanmaya çalışmak, onu sürdüren şeydir. Sokaktaki bir araba alarmının orada olmasına izin verdiğin gibi onun da orada olmasına izin verebilir ve yaptığın işe devam edebilirsin.

      **Yalnız değilsin ve benzersiz şekilde kötü de değilsin.** Awad, "dünya genelinde insan nüfusunun yaklaşık %94'ünün zihne zorla giren düşünceler yaşadığını" tahmin eden uluslararası bir çalışmayı (Radomsky ve ark., 2014) zikreder; çalışmanın kendi örneklemi henüz kontrol edilmedi. Farklı olan, bu düşüncelerin ne kadar yapıştığıdır.

      **Şu anda sıkıntı içindeysen:** Bugün güvendiğin biriyle konuş. Kuzey Amerika'da Naseeha (1-866-627-3342) gizli bir Müslüman yardım hattıdır; Birleşik Krallık'ta Muslim Youth Helpline ve Samaritans (116 123); Türkiye'de acil durumda 112'yi ara; başka yerlerde findahelpline.com ücretsiz hizmetleri ülkelere göre listeler. Kendine zarar verme düşüncelerin olursa, bulunduğun yerdeki acil yardım numarasını ara.
    title:
      en: Kalp ve akıl için
      tr: Kalp ve akıl için
  - kind: quran
    en: |-
      **God does not burden a soul beyond its capacity.** "Allah does not charge a soul except [with that within] its capacity… Our Lord, do not impose blame upon us if we have forgotten or erred… and burden us not with that which we have no ability to bear" (2:286). This is the closing verse of Sura al-Baqara (Medinan), a prayer the believers are taught to say. A thought that comes against your will is not within your choosing, and the verse says you are charged only with what is.

      **The Quran names a "whisperer".** The last sura asks refuge "From the evil of the retreating whisperer — Who whispers [evil] into the breasts of mankind" (114:4–5). The word for whispering is *waswās*. In Muslim belief, some unwanted thoughts are attributed to this whispering (Awad cites 20:120, where Satan whispers to Adam). The verse teaches a response: seeking refuge in God, not arguing with the whisper. Reading it as a description of OCD is a modern application; the verse itself does not describe a mental illness.
    tr: |-
      **Allah hiç kimseye gücünün üstünde yük yüklemez.** "Allah hiç kimseye gücünün yeteceğinden başka yük yüklemez… Ey Rabbimiz, eğer unuttuk ya da yanıldıysak bizi tutup sorguya çekme!… Ey Rabbimiz, bize gücümüzün yetmeyeceği yükü de yükleme!" (2:286). Bu, Bakara Sûresi'nin (Medenî) son âyetidir; müminlere okumaları öğretilen bir duadır. İradene rağmen gelen bir düşünce senin seçimin dahilinde değildir ve âyet, yalnızca seçimin dahilinde olandan sorumlu tutulduğunu söyler.

      **Kur'an bir "vesveseci"den söz eder.** Son sûre şuna karşı sığınma ister: "O sinsi vesvesecinin şerrinden, O ki, insanların göğüslerine vesveseler fısıldar" (114:4–5). Fısıldama için kullanılan kelime *vesvâs*tır. Müslüman inancında bazı istenmeyen düşünceler bu fısıldamaya bağlanır (Awad, şeytanın Âdem'e vesvese verdiği 20:120'yi zikreder). Âyet bir tepki öğretir: fısıltıyla tartışmak değil, Allah'a sığınmak. Onu OKB'nin bir tarifi olarak okumak modern bir uygulamadır; âyetin kendisi bir ruhsal hastalığı tarif etmez.
    title:
      en: Kur'an ne diyor?
      tr: Kur'an ne diyor?
  - kind: sunnah
    en: |-
      **Thoughts are forgiven unless acted on or spoken.** The Prophet (pbuh) said: "Allah has forgiven my followers the evil thoughts that occur to their minds, as long as such thoughts are not put into action or uttered" ({hadith:bukhari:5269}, narrated by Abu Hurayra). The narrator Qatada drew a legal conclusion from it: a divorce pronounced only in the mind has no effect. Sahih Muslim has the same teaching: "Verily Allah forgave my people the evil promptings which arise within their hearts as long as they did not speak about them or did not act upon them" ({hadith:muslim:127a}).

      **The Companions had these thoughts too.** Abu Hurayra (ra) reports that some Companions came to the Prophet (pbuh) and said: "Verily we perceive in our minds that which every one of us considers it too grave to express." He asked: "Do you really perceive it?" They said yes. He said: "That is the faith manifest" ({hadith:muslim:132a}). The *Companions* (*ṣaḥāba*) are the people who knew the Prophet (pbuh) and believed in him; *Bukhari* and *Muslim* are the two collections of hadith that Sunni Muslims regard as most reliable. The point of this report is that the Companions — the generation Muslims regard as the best — had the very experience you are having, and the Prophet (pbuh) did not treat it as unbelief.
    tr: |-
      **Düşünceler, uygulanmadıkça ya da söylenmedikçe bağışlanır.** Hz. Peygamber (s.a.v.) şöyle buyurdu: "Allah ümmetimin içinden geçen kötü düşünceleri, bu düşünceler uygulanmadığı ya da söylenmediği sürece bağışlamıştır" ({hadith:bukhari:5269}, Ebû Hüreyre'den). Râvi Katâde bundan hukuki bir sonuç çıkardı: Yalnızca zihinde söylenen bir boşamanın hiçbir hükmü yoktur. *Sahîh-i Müslim*'de aynı öğreti vardır: "Şüphesiz Allah ümmetimin kalplerinde beliren kötü vesveseleri, onları söylemedikleri ya da onlara göre davranmadıkları sürece bağışladı" ({hadith:muslim:127a}).

      **Sahâbîlerin de bu düşünceleri vardı.** Ebû Hüreyre (r.a.), bazı sahâbîlerin Hz. Peygamber'e (s.a.v.) gelip şöyle dediklerini aktarır: "Gerçekten içimizde, her birimizin söylemeyi çok ağır bulduğu şeyler hissediyoruz." O, "Gerçekten bunu hissediyor musunuz?" diye sordu. Evet dediler. O da şöyle buyurdu: "İşte bu imanın ta kendisidir" ({hadith:muslim:132a}). *Sahâbîler* (*sahâbe*), Hz. Peygamber'i (s.a.v.) tanıyan ve ona iman eden insanlardır; *Buhârî* ve *Müslim*, Sünnî Müslümanların en güvenilir saydığı iki hadis külliyatıdır. Bu rivayetin vurgusu şudur: Müslümanların en hayırlı nesil saydığı sahâbîler, senin yaşadığın tecrübenin aynısını yaşadı ve Hz. Peygamber (s.a.v.) bunu küfür olarak görmedi.
    title:
      en: Hz. Peygamber (s.a.v.) ne öğretti?
      tr: Hz. Peygamber (s.a.v.) ne öğretti?
  - kind: fiqh
    en: |-
      **Certainty is not removed by doubt.** A basic maxim of Islamic law is: "Certainty is not lifted by a doubt." Rabbani attributes it to the Hanafi jurist Ibn Nujaym (d. 1563) in *al-Ashbāh wa-l-Naẓāʾir* and to the Ottoman civil code, the *Majalla*. It means: if you know you made ablution, a doubt about whether you broke it does not count. Rabbani adds that "mere doubts and suppositions are of no legal consequence", and that until you are certain a prayer was invalid, "you do not have any prayers to make up."

      **Following misgivings is itself blameworthy.** Rabbani, summarising Ibn ʿAbidin, the leading late Hanafi authority (no work named), writes that following misgivings is "highly blameworthy in the Shariah: it is from the Shaytan." In other words, the law does not reward the extra checking; it discourages it.

      **The other schools.** The Maliki, Shafiʿi and Hanbali positions on *waswasa* have not yet been consulted in their own works.
    tr: |-
      **Yakîn şekle zâil olmaz.** İslam hukukunun temel bir kaidesi şudur: "Yakîn (kesin bilgi) şek (şüphe) ile ortadan kalkmaz." Rabbani bunu Hanefî fakih İbn Nüceym'e (ö. 1563), *el-Eşbâh ve'n-Nezâir*'de, ve Osmanlı medeni kanunu *Mecelle*'ye dayandırır. Anlamı şudur: Abdest aldığını biliyorsan, onu bozup bozmadığına dair bir şüphe hesaba katılmaz. Rabbani, "sırf şüphelerin ve tahminlerin hiçbir hukuki sonucu olmadığını" ve bir namazın geçersiz olduğundan emin olana kadar "kaza etmen gereken hiçbir namazın olmadığını" ekler.

      **Vesveselerin peşinden gitmek başlı başına kınanmıştır.** Rabbani, geç dönem Hanefîlerin önde gelen otoritesi İbn Âbidîn'i özetleyerek (eser adı verilmeden) vesveselerin peşinden gitmenin "Şerîat'ta son derece kınanmış olduğunu: şeytandan olduğunu" yazar. Başka bir deyişle hukuk fazladan kontrolü ödüllendirmez; ondan caydırır.

      **Diğer mezhepler.** Mâlikî, Şâfiî ve Hanbelî mezheplerinin *vesvese* hakkındaki görüşlerine kendi eserlerinden henüz başvurulmadı.
    title:
      en: Fakihler ne diyor?
      tr: Fakihler ne diyor?
  - kind: science
    en: |-
      **Scrupulosity is a recognised form of OCD.** [Established.] The International OCD Foundation's packet for faith leaders describes scrupulosity as OCD centred on religious or moral concerns: people are "overly concerned that something they thought or did might be a sin." It distinguishes it from a tender conscience: such a person can "find comfort when advised by a religious leader", whereas people with scrupulosity "cannot have their fear or concern resolved by competent explanation."

      **How common it is.** [Moderate.] İnözü, Keser and Karancı (2017) summarise Western studies as finding scrupulosity in "between 10.0% and 33.0% of patients diagnosed with OCD" — that is, a percentage of people who already have OCD, not of the general population — and note that "this rate can vary across different cultures".

      **Waswasa and OCD.** Awad (Yaqeen) writes: "*Waswasah* is not a Muslim disease — it is a religious presentation of OCD in Muslims", and notes that scrupulosity is "found in all religions".

      **Exposure and response prevention (ERP).** [Established as the main psychological treatment.] The IOCDF packet calls ERP the most important form of cognitive behavioural therapy for OCD. *Exposure* means the person "systematically confronts the thoughts, images, objects, and situations that cause anxiety"; *response prevention* means choosing not to perform the compulsion (re-washing, re-praying, asking for reassurance), so that the anxiety falls by itself — "the decrease in anxiety with nothing but the passage of time" (IOCDF packet). Awad calls ERP "compatible with the Islamic approach" and says "the Islamic advice to ignore the obsession and resist the compulsion is the layperson's form of ERP." She also reports that about 25% of people drop out of ERP and a further 5–22% refuse it (Twohig et al., 2010), so it is not easy — which is why it is best done with a therapist.
    tr: |-
      **Dinî vesvese, OKB'nin tanınmış bir biçimidir.** [Established.] Uluslararası OKB Vakfı'nın (IOCDF) din önderleri için hazırladığı dosya, dinî vesveseyi (skrupülozite) dinî ya da ahlaki kaygılar etrafında yoğunlaşan bir OKB olarak tarif eder: İnsanlar "düşündükleri ya da yaptıkları bir şeyin günah olabileceği konusunda aşırı kaygılıdır." Bunu hassas bir vicdandan ayırır: Böyle biri "bir din önderi nasihat ettiğinde teselli bulabilir", oysa dinî vesvesesi olan insanlar "korkularını ya da kaygılarını yetkin bir açıklamayla çözüme kavuşturamaz."

      **Ne kadar yaygın?** [Orta.] İnözü, Keser ve Karancı (2017), Batı'daki çalışmaların dinî vesveseyi "OKB tanısı almış hastaların %10,0 ile %33,0'ı arasında" bulduğunu özetler — yani genel nüfusun değil, zaten OKB'si olan insanların bir yüzdesi — ve "bu oranın farklı kültürlerde değişebileceğini" not eder.

      **Vesvese ve OKB.** Awad (Yaqeen) şöyle yazar: "*Vesvese* bir Müslüman hastalığı değildir — Müslümanlarda OKB'nin dinî bir görünümüdür" ve dinî vesvesenin "bütün dinlerde bulunduğunu" not eder.

      **Maruz bırakma ve tepki önleme (ERP).** [Established, ana psikolojik tedavi olarak.] IOCDF dosyası ERP'yi OKB için bilişsel davranışçı terapinin en önemli biçimi olarak nitelendirir. *Maruz bırakma*, kişinin "kaygıya yol açan düşüncelerle, görüntülerle, nesnelerle ve durumlarla sistematik olarak yüzleşmesi" demektir; *tepki önleme* ise zorlantıyı (yeniden abdest almayı, yeniden namaz kılmayı, güvence istemeyi) yapmamayı seçmek demektir; böylece kaygı kendiliğinden düşer — "zamanın geçmesinden başka hiçbir şey olmadan kaygının azalması" (IOCDF dosyası). Awad, ERP'yi "İslami yaklaşımla uyumlu" olarak niteler ve "saplantıyı görmezden gelme ve zorlantıya direnme yönündeki İslami tavsiyenin ERP'nin halk arasındaki biçimi olduğunu" söyler. Ayrıca insanların yaklaşık %25'inin ERP'yi yarıda bıraktığını ve %5–22'sinin de onu reddettiğini aktarır (Twohig ve ark., 2010); yani kolay değildir — bu yüzden en iyisi bir terapistle yapılmasıdır.
    title:
      en: Araştırmalar ne diyor?
      tr: Araştırmalar ne diyor?
  - kind: reasoning
    en: |-
      **They feel similar, but they behave differently.** Al-Ghazali's doubt (see "How do I rebuild faith after a crisis of doubt?") was an inquiry: he asked how we know anything, followed the question for two months, and came out with an answer. That kind of doubt is helped by thinking, reading and talking with someone knowledgeable. A compulsive thought is different:
      - It comes against your will and feels alien, even disgusting, to you.
      - Answering it brings relief for minutes, then it returns, often stronger.
      - It fixes on certainty: you cannot rest until you are *sure*, and you never are.
      - It drives rituals: repeating ablution or prayer, mentally reviewing, asking others again and again.

      **A rule of thumb.** If a good answer from a knowledgeable person settles the question for a long time, it was a question. If no answer ever settles it, and you find yourself asking the same thing again, it is probably the compulsion — and the remedy is not another answer, but less answering. *Limit:* only a qualified clinician can diagnose OCD, and some people have both real questions and compulsive doubts at once.

      **"If part of me half-agrees with the thought, is it still unchosen?"** That "half-agreeing" feeling is very common in OCD; the mind asks "what if I actually believe this?", and the question feels like evidence. The hadith set the line at acting on the thought or speaking it, not at how it feels ({hadith:bukhari:5269}). If you are unsure, the jurists' maxim applies: you were a believer with certainty, and a doubt does not remove it.
    tr: |-
      **Benzer hissettirirler, ama farklı davranırlar.** Gazzâlî'nin şüphesi (bkz. "Bir şüphe krizinden sonra imanımı nasıl yeniden inşa ederim?") bir araştırmaydı: Bir şeyi nasıl bildiğimizi sordu, soruyu iki ay boyunca izledi ve bir cevapla çıktı. Bu tür bir şüpheye düşünmek, okumak ve bilgili biriyle konuşmak yardımcı olur. Zorlantılı bir düşünce farklıdır:
      - İradene rağmen gelir ve sana yabancı, hatta iğrenç gelir.
      - Ona cevap vermek birkaç dakikalık rahatlama getirir, sonra çoğu zaman daha güçlü geri döner.
      - Kesinliğe takılır: *Emin* olana kadar rahat edemezsin ve hiçbir zaman emin olamazsın.
      - Ritüellere iter: abdesti ya da namazı tekrarlamak, zihinde tekrar tekrar gözden geçirmek, başkalarına tekrar tekrar sormak.

      **Pratik bir ölçü.** Bilgili birinden gelen iyi bir cevap soruyu uzun süre çözüyorsa, bu bir soruydu. Hiçbir cevap onu çözmüyorsa ve kendini aynı şeyi yeniden sorarken buluyorsan, muhtemelen zorlantıdır — ve çare başka bir cevap değil, daha az cevap vermektir. *Sınır:* OKB tanısını ancak ehil bir klinisyen koyabilir ve bazı insanların aynı anda hem gerçek soruları hem de zorlantılı şüpheleri olur.

      **"Bir yanım düşünceye yarı yarıya katılıyorsa, bu yine de seçilmemiş mi sayılır?"** Bu "yarı yarıya katılma" hissi OKB'de çok yaygındır; zihin "ya gerçekten buna inanıyorsam?" diye sorar ve soru delil gibi hissettirir. Hadis, çizgiyi düşüncenin nasıl hissettirdiğine değil, ona göre davranmaya ya da onu söylemeye çekti ({hadith:bukhari:5269}). Emin değilsen fakihlerin kaidesi geçerlidir: Yakînen mümindin ve bir şüphe bunu ortadan kaldırmaz.
    title:
      en: Dürüst şüphe mi, zorlantılı düşünce mi?
      tr: Dürüst şüphe mi, zorlantılı düşünce mi?
  - kind: objection
    en: |-
      **"Calling it OCD is a way to avoid real questions."** *Reply:* the distinction above keeps real questions open: they deserve answers, and this site tries to give them. What it rejects is treating a compulsion as if it were a question. *Limit:* a person may use the OCD label to avoid a real question, and a good therapist or scholar will notice.

      **"Satan's whispering is a spiritual matter; therapy is secular."** *Reply:* the Islamic remedy and the clinical one point the same way: don't engage the whisper, don't repeat the act (Rabbani; Awad). Awad argues that a therapist "will likely need to defer to and coordinate with a person of Islamic knowledge", and that the imam should teach principles such as "doubt can not negate certainty" rather than answer repeated questions. *Limit:* not every therapist understands religious clients; look for one who does (Khalil Center in North America, the Muslim Mental Health directory, or ask the IOCDF for providers experienced with scrupulosity).
    tr: |-
      **"Buna OKB demek, gerçek sorulardan kaçmanın bir yoludur."** *Cevap:* Yukarıdaki ayrım gerçek soruları açık tutar: Onlar cevabı hak eder ve bu site onları vermeye çalışır. Reddettiği şey, bir zorlantıyı bir soruymuş gibi ele almaktır. *Sınır:* Bir kişi gerçek bir sorudan kaçmak için OKB etiketini kullanabilir ve iyi bir terapist ya da âlim bunu fark eder.

      **"Şeytanın vesvesesi manevi bir meseledir; terapi ise dünyevidir."** *Cevap:* İslami çare ile klinik çare aynı yönü gösterir: Vesveseyle uğraşma, fiili tekrarlama (Rabbani; Awad). Awad, bir terapistin "muhtemelen İslami bilgi sahibi biriyle istişare etmesi ve onunla eşgüdüm içinde çalışması gerekeceğini" ve imamın tekrarlanan soruları cevaplamak yerine "şüphe kesinliği ortadan kaldıramaz" gibi ilkeleri öğretmesi gerektiğini savunur. *Sınır:* Her terapist dindar danışanları anlamaz; anlayan birini ara (Kuzey Amerika'da Khalil Center, Muslim Mental Health rehberi ya da dinî vesvese konusunda tecrübeli uzmanlar için IOCDF'ye sor).
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: practice
    title:
      en: Practical steps for the moment it happens
      tr: Practical steps for the moment it happens
    en: |-
      1. **Name it.** "This is a whisper / an intrusive thought. It is not me and it is not my belief."
      2. **Say a short refuge and move on.** For example, the words of 114:1, "I seek refuge in the Lord of mankind" — once, not repeatedly.
      3. **Do not repeat the act.** If you finished the prayer, it stands unless you are certain it was invalid: until then "you do not have any prayers to make up" (Rabbani). The same principle applies, by illustration, to ablution: if you know you made it, a doubt does not undo it.
      4. **Do not ask for reassurance.** Each "are you sure I'm still Muslim?" brings relief and feeds the loop (IOCDF packet).
      5. **Let the anxiety rise and fall.** It will fall by itself if you do not feed it.
      6. **Choose one teacher.** Bring your questions to one knowledgeable person rather than to many people whenever the urge comes (the IOCDF packet suggests seeking "religious counsel from a single faith leader or confessor").
      7. **See a clinician** if this takes up a lot of your day, stops you praying, or makes you dread worship. (Clinicians use a time threshold — more than an hour a day — among the signs of OCD; that criterion has not yet been checked in a source.)
    tr: |-
      1. **Adını koy.** "Bu bir vesvese / zihne zorla giren bir düşünce. Bu ben değilim ve benim inancım değil."
      2. **Kısa bir sığınma sözü söyle ve devam et.** Örneğin 114:1'in sözleri, "Sığınırım ben insanların Rabbine" — bir kez, tekrar tekrar değil.
      3. **Fiili tekrarlama.** Namazı bitirdiysen, geçersiz olduğundan emin olmadıkça geçerlidir: O zamana kadar "kaza etmen gereken hiçbir namaz yoktur" (Rabbani). Aynı ilke, bir örnek olarak, abdeste de uygulanır: Abdest aldığını biliyorsan, bir şüphe onu bozmaz.
      4. **Güvence isteme.** Her "hâlâ Müslüman olduğumdan emin misin?" sorusu rahatlama getirir ve döngüyü besler (IOCDF dosyası).
      5. **Kaygının yükselip alçalmasına izin ver.** Onu beslemezsen kendiliğinden düşer.
      6. **Tek bir hoca seç.** Dürtü her geldiğinde sorularını pek çok insana değil, bilgili tek bir kişiye götür (IOCDF dosyası "tek bir din önderinden ya da itirafçıdan dinî rehberlik" almayı önerir).
      7. **Bir klinisyene git**, eğer bu gününün büyük bir kısmını alıyorsa, namaz kılmanı engelliyorsa ya da ibadetten korkmana yol açıyorsa. (Klinisyenler OKB belirtileri arasında bir zaman eşiği — günde bir saatten fazla — kullanır; bu ölçüt henüz bir kaynakta kontrol edilmedi.)
followUps:
  - q:
      en: What exactly does Muslim 132 say?
      tr: Müslim 132 tam olarak ne diyor?
    a:
      en: 'Companions said: "we perceive in our minds that which every one of us considers it too grave to express." The Prophet (pbuh) asked, "Do you really perceive it?" and said, "That is the faith manifest."'
      tr: 'Sahâbîler şöyle dedi: "İçimizde, her birimizin söylemeyi çok ağır bulduğu şeyler hissediyoruz." Hz. Peygamber (s.a.v.), "Gerçekten bunu hissediyor musunuz?" diye sordu ve "İşte bu imanın ta kendisidir" buyurdu.'
  - q:
      en: How do I tell real doubt from a compulsive thought?
      tr: Gerçek şüpheyi zorlantılı bir düşünceden nasıl ayırırım?
    a:
      en: A real question is settled, at least for a while, by a good answer. A compulsion returns no matter what answer you get, and drives you to check and repeat.
      tr: Gerçek bir soru, iyi bir cevapla en azından bir süreliğine çözülür. Bir zorlantı ise hangi cevabı alırsan al geri döner ve seni kontrol etmeye ve tekrarlamaya iter.
  - q:
      en: What is waswasa?
      tr: Vesvese nedir?
    a:
      en: Arabic *waswasa*, "whispering" (Turkish *vesvese*). In the Quran it is the whispering of the "retreating whisperer" (114:4–5); in everyday Muslim speech it also means obsessive doubts about worship.
      tr: Arapça *vesvese*, "fısıldama". Kur'an'da "sinsi vesveseci"nin fısıldamasıdır (114:4–5); Müslümanların gündelik dilinde ibadetle ilgili saplantılı şüpheler anlamına da gelir.
  - q:
      en: What is exposure and response prevention?
      tr: Maruz bırakma ve tepki önleme nedir?
    a:
      en: A therapy in which you face the trigger and deliberately do not perform the compulsion, so the anxiety fades on its own.
      tr: Tetikleyiciyle yüzleştiğin ve zorlantıyı bilerek yapmadığın, böylece kaygının kendiliğinden azaldığı bir terapi.
  - q:
      en: Who are the Companions, and what are Bukhari and Muslim?
      tr: Sahâbîler kimdir; Buhârî ve Müslim nedir?
    a:
      en: The Companions are the people who knew the Prophet (pbuh) and believed in him. Bukhari (d. 870) and Muslim (d. 875) compiled the two most trusted hadith collections.
      tr: Sahâbîler, Hz. Peygamber'i (s.a.v.) tanıyan ve ona iman eden insanlardır. Buhârî (ö. 870) ve Müslim (ö. 875), en güvenilir iki hadis külliyatını derledi.
  - q:
      en: Did I leave Islam because of a thought?
      tr: Bir düşünce yüzünden İslam'dan çıktım mı?
    a:
      en: No. In the hadith, thoughts are forgiven unless acted on or spoken ({hadith:bukhari:5269}), and a doubt does not remove certainty (Ibn Nujaym).
      tr: Hayır. Hadiste düşünceler, uygulanmadıkça ya da söylenmedikçe bağışlanır ({hadith:bukhari:5269}) ve bir şüphe kesinliği ortadan kaldırmaz (İbn Nüceym).
