id: Q14
slugs:
  tr: baska-dinlerdeki-iyiler
  en: salvation-of-others
order: 14
theme: salvation
title:
  tr: Başka dinlerden iyi insanlar kurtulacak mı? Hiç duymamış olanlar ne olacak?
  en: Are good people of other faiths saved? What about those who never heard?
sensitivity: normal
helpCard: false
verses:
  - 17:15
  - 2:62
  - 3:85
steelman:
  tr: |
    Milyarlarca insan, hiçbir seçimleri olmadan başka dinlerde doğuyor. Pek çoğu iyi ve samimi. Onları bir doğum tesadüfü yüzünden mahkûm etmek adaletsiz görünüyor.
  en: Billions are born into other religions by no choice. Many are kind and sincere. Condemning them for an accident of birth seems unjust.
whyAsked:
  tr: |
    Dostluklar, karma aileler, göç. ABD'de İslam'dan ayrılanların çoğunun dinsiz olduğuna dair Pew verileri, çoğulculuk baskısının gerçek olduğunu düşündürür.
  en: Friendships, mixed families, migration. Pew data that most US ex-Muslims become non-religious suggests pluralism pressures are real.
shortAnswer:
  tr: |
    Allah bir elçi göndermedikçe azap etmez (17:15). Ana akım âlimlere göre mesajı hiç almamış ya da çarpıtılmış bir hâlini almış olanlar, reddedenler gibi sorumlu tutulmaz. Gazzâlî, kendi döneminin Bizans Hristiyanlarının ve Türklerinin çoğunun muhtemelen Allah'ın rahmetine dâhil olacağını yazdı. Kimin "gerçekten duyduğunu" yalnızca Allah bilir; Müslümanlardan bireyler hakkında hüküm vermeleri istenmez.
  en: God does not punish until He sends a messenger (17:15). Mainstream scholars hold that those who never received the message, or received a distorted version, are not accountable as rejecters. Al-Ghazālī wrote that most Christians of Byzantium and Turks of his day would likely be covered by God's mercy. Who has "truly heard" is known only to God; Muslims are not asked to pronounce on individuals.
layers:
  - kind: religious
    tr: |
      - *Âyetler:* 17:15; 2:62 ve 5:69; 3:85; 4:165.
      - *Hadis:* Müslim 153 (benden "haberdar olup" reddederek ölen ateştendir); âlimler bunu doğru biçimde duymak olarak okur; fetret ehlinin Kıyamet günü imtihan edileceğine dair hadis (Ahmed).
      - *Gazzâlî, Faysalü't-Tefrika:* (1) Peygamber'in adını hiç duymamış: mazur; (2) adını, gerçek karakterinin tersiyle duymuş: ilki gibi mazur; (3) doğru duymuş ve araştırmış: araştırırken ölürse iyi hâldedir. Yalnızca doğru duyup bile bile reddedenler sorumludur.
      - *İbn Teymiyye ve İbn Kayyim:* fetret ehli âhirette imtihan edilir.
      - *Şiî (Farsça):* Murtazâ Mutahhari (*Adl-e İlâhî*), câhil-i kâsır (kusuru olmayan, mazur cahil) ile câhil-i mukassır (kusurlu cahil) arasında ayrım yapar; kusuru olmayan gayrimüslimler çoğunluktadır ve cezalandırılmayacaktır; Allah'a samimiyetle inananlar mükâfat görür. Berkeley Enstitüsü'nün bir çalışmasına göre Humeynî'nin yazıları da benzerdir.
      - *Modern Sünnî:* Reşîd Rızâ: çarpıtılmış bir sunum, gerçekten "duymak" sayılmaz. Yaqeen'in makalesi istisnalarıyla dışlayıcılığı, ahlâkî teizmi (2:62) ve Perennialism'i (Nasr, Schuon) ortaya koyar.
    en: |-
      - *Verses:* 17:15; 2:62 and 5:69; 3:85; 4:165.
      - *Hadith:* Muslim 153 (whoever "hears of me" and dies rejecting is of the Fire), read by scholars as hearing accurately; hadith on people of fatra tested on Judgment Day (Aḥmad).
      - *Al-Ghazālī, Fayṣal al-Tafriqa:* (1) never heard the Prophet's name: excused; (2) heard his name with the opposite of his true character: excused like the first; (3) heard accurately and investigated: in a good state if dying while searching. Only accurate-hearing deliberate rejecters are culpable.
      - *Ibn Taymiyya and Ibn al-Qayyim:* people of fatra are tested in the Hereafter.
      - *Shiʿi (Persian):* Murtaḍā Muṭahharī (ʿAdl-e Elāhī) distinguishes jāhil qāṣir (inculpably ignorant) from jāhil muqaṣṣir (culpable); non-culpable non-Muslims are the majority and will not be punished, and sincere believers in God are rewarded. Khomeini's writings are similar, per a Berkeley Institute study.
      - *Modern Sunni:* Rashīd Riḍā: distorted presentation means not truly "heard". Yaqeen's paper lays out exclusivism with exceptions, moral theism (2:62) and Perennialism (Nasr, Schuon).
  - kind: philosophical
    tr: |
      İslam'ın kurtuluş anlayışı doğuma değil, *ulaşma ve karşılık vermeye* dayanır (2:286). Gerilim sürer: 3:85 ve Müslim 153 dışlayıcı bir ağırlık taşır; kapsayıcı okumalar "gerçekten duymaya" bağlıdır. Perennialism [Debated] fakihlerin çoğunca reddedilir.
    en: 'Islamic soteriology rests on *access and response*, not birth (2:286). Tension remains: 3:85 and Muslim 153 carry exclusivist weight; inclusive readings depend on "true hearing". Perennialism [Debated] is rejected by most jurists.'
  - kind: psychological
    tr: |
      Gayrimüslim aile üyeleri için duyulan keder gerçektir; sahte kesinlik olmadan ümide yer açmak gerekir.
    en: Grief for non-Muslim family is real; allow hope without false certainty.
