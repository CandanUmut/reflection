  - kind: scholars
    en: |-
      **Al-Ghazali's three categories.** In *Fayṣal al-Tafriqa* (*The Decisive Criterion*), al-Ghazali (d. 1111) writes:

      > "I hold that most Christians of the present time… are included in the divine mercy, Allah Most High willing… One group has never even heard the name of Muhammad… so are excused. A second group has heard of his name, his character, and the miraculous signs — these are the unbelievers who deny the revelation. And a third group… have heard of the name of Muhammad… but not of his character and attributes, since childhood, they have heard that a lying impostor named Muhammad claimed to be a prophet. Such people fall into the same category as the first group."

      **The Ashʿari position.** Al-Jurjani: "There is no accountability upon the one whom the call of a prophet definitively did not reach." Faraz Rabbani traces the view through al-Sanusi and al-Bajuri and calls it "solidly mainstream Sunni theology." The Maturidi position has not yet been sourced.

      **The Athari position.** Ibn Taymiyya (*al-Jawab al-Sahih* 2/298) and Ibn al-Qayyim (*Ahkam Ahl al-Dhimma* 2/1137) favour testing in the Hereafter. Ibn al-Qayyim also answers the question "who decides?" (*Tariq al-Hijratayn* 2/900):

      > "He will not punish anyone except those against whom proof is established through the Messengers… But as for the question of whether or not proof is established against any particular individual, this is a matter to be decided by Allah and we cannot issue rulings concerning specific individuals in that regard."

      **The strict answer, stated plainly.** Suppose someone received the message as al-Ghazali's second group did, with "his name, his character, and the miraculous signs", and died rejecting it. Al-Ghazali, Ibn Kathir and Ibn al-Qayyim all hold that such a person is not saved. Rabbani adds that "amnesty for those who are not reached by the message does not constitute validation of other religions." **Limit:** the same scholars forbid declaring this of any named person.

      **Khalil's study.** Mohammad Hassan Khalil (Michigan State University), in *Islam and the Fate of Others* (OUP, 2012), studies four figures: al-Ghazali ("Damnation as Exception"), Ibn ʿArabi ("All Paths Lead to God"), Ibn Taymiyya ("The Redemption of Humanity") and Rashid Rida ("The Modern Scene"). Bazzano summarises the finding as "not a monolithic consensus but… a cacophony of opinions… which overwhelmingly envisions a heaven filled with Muslims and non-Muslims." This describes Khalil's influential sample, not the whole tradition.
    tr: |-
      **Gazzâlî'nin üç grubu.** *Faysalü't-Tefrika* (*Ayırt Edici Ölçüt*) adlı eserinde Gazzâlî (ö. 1111) şöyle yazar:

      > "Kanaatimce, zamanımızdaki Hristiyanların çoğu… inşallah ilahi rahmete dahildir… Bir grup Muhammed'in adını bile hiç duymamıştır… bu yüzden mazurdur. İkinci bir grup onun adını, ahlakını ve mucizevi işaretlerini duymuştur — bunlar vahyi inkâr eden kâfirlerdir. Ve üçüncü bir grup… Muhammed'in adını duymuş… ama ahlakını ve sıfatlarını duymamıştır; çocukluklarından beri Muhammed adında yalancı bir sahtekârın peygamber olduğunu iddia ettiğini duymuşlardır. Bu tür insanlar birinci grupla aynı kategoriye girer."

      **Eş'arî görüşü.** Cürcânî: "Bir peygamberin daveti kesin olarak kendisine ulaşmayan kimse için hiçbir sorumluluk yoktur." Faraz Rabbani bu görüşü Senûsî ve Bâcûrî üzerinden izler ve onu "sağlam bir şekilde ana akım Sünnî kelâm" olarak nitelendirir. Mâtürîdî görüşünün kaynağı henüz bulunmadı.

      **Eserî görüşü.** İbn Teymiyye (*el-Cevâbü's-Sahîh* 2/298) ve İbn Kayyim (*Ahkâmü Ehli'z-Zimme* 2/1137) ahirette imtihanı tercih eder. İbn Kayyim "buna kim karar veriyor?" sorusuna da cevap verir (*Târîku'l-Hicreteyn* 2/900):

      > "Peygamberler aracılığıyla aleyhine delil ikame edilenler dışında hiç kimseyi cezalandırmayacaktır… Ama belirli bir bireye karşı delilin ikame edilip edilmediği meselesine gelince, bu Allah'ın karar vereceği bir meseledir ve bu konuda belirli bireyler hakkında hüküm veremeyiz."

      **Katı cevap, açıkça söylenmiş hâliyle.** Birinin mesajı Gazzâlî'nin ikinci grubu gibi, "adını, ahlakını ve mucizevi işaretlerini" duyarak aldığını ve onu reddederek öldüğünü varsayalım. Gazzâlî, İbn Kesîr ve İbn Kayyim'in hepsi böyle birinin kurtulmadığını kabul eder. Rabbani, "mesajın ulaşmadığı kimselere tanınan affın diğer dinleri onaylamak anlamına gelmediğini" ekler. **Sınır:** Aynı âlimler, adı belli herhangi bir kişi hakkında bunu ilan etmeyi yasaklar.

      **Khalil'in çalışması.** Mohammad Hassan Khalil (Michigan State Üniversitesi), *Islam and the Fate of Others* (*İslam ve Ötekilerin Akıbeti*, OUP, 2012) adlı eserinde dört isim üzerinde durur: Gazzâlî ("İstisna olarak lanetlenme"), İbnü'l-Arabî ("Bütün yollar Allah'a çıkar"), İbn Teymiyye ("İnsanlığın kurtuluşu") ve Reşîd Rızâ ("Modern sahne"). Bazzano bulguyu, "yekpare bir icmâ değil… ezici çoğunlukla Müslümanlar ve gayrimüslimlerle dolu bir cenneti öngören… bir görüşler kakofonisi" olarak özetler. Bu, geleneğin tamamını değil, Khalil'in etkili örneklemini tarif eder.
    title:
      en: Âlimler bunu nasıl anladı?
      tr: Âlimler bunu nasıl anladı?
  - kind: objection
    en: |-
      **"'True hearing' is an escape hatch."** *Reply:* The tradition says explicitly that God decides. The standard rests on 17:15, and al-Ghazali stated it in the 11th century, long before modern pluralism. **Limit:** nobody can check it on earth, and it gives no one certainty in either direction.

      **"Honest error is punished."** *Reply:* What the mainstream holds culpable is rejection after the truth has become clear, not mistaken belief, and only God knows the inner state. **Limit:** for someone who truly understood and was not persuaded, the strict view offers no comfort, and Muslims should say so plainly.
    tr: |-
      **"'Gerçekten duymak' bir kaçış kapısıdır."** *Cevap:* Gelenek açıkça Allah'ın karar verdiğini söyler. Ölçüt 17:15'e dayanır ve Gazzâlî onu 11. yüzyılda, modern çoğulculuktan çok önce dile getirdi. **Sınır:** Kimse bunu yeryüzünde kontrol edemez ve bu, kimseye her iki yönde de kesinlik vermez.

      **"Dürüst hata cezalandırılıyor."** *Cevap:* Ana akımın kusurlu saydığı şey, yanlış inanç değil, hakikat açıkça ortaya çıktıktan sonra reddetmektir ve iç hâli yalnızca Allah bilir. **Sınır:** Gerçekten anlayıp ikna olmayan biri için katı görüş hiçbir teselli sunmaz ve Müslümanlar bunu açıkça söylemelidir.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
  - kind: views
    en: |-
      **Scholarly views range from strict exclusivism to perennialism.**
      - **Strict exclusivism:** excuses are read narrowly.
      - **The mainstream "message-reached" view:** al-Ghazali, the Ashʿaris, Ibn Taymiyya, Ibn al-Qayyim, al-Albani.
      - **Wider hope:** Ibn ʿArabi, and Ibn Taymiyya's view on the end of Hell (Q13).
      - **Modern pluralist readings of 2:62:** a minority.
      - **Not documented here:** Perennialism (Schuon, Nasr: all major religions as valid paths), and Mutahhari's Shiʿi distinction between the culpable and non-culpable ignorant (*jāhil muqaṣṣir/qāṣir*).

      **What ordinary Muslims believe.** Pew (2013) found that in 34 of 38 countries at least half of Muslims say Islam is "the one true religion that can lead to eternal life in heaven." The figure was 96% in Egypt and Jordan and 95% in Iraq, but 29% in Kazakhstan (where 49% said many religions can) and 37% in Albania. Muslims who pray several times a day held this view more often; in Russia the gap was 41 points. US Muslims are "much more open" to many paths.
    tr: |-
      **Âlimlerin görüşleri katı dışlayıcılıktan perennializme kadar uzanır.**
      - **Katı dışlayıcılık:** mazeretler dar okunur.
      - **Ana akım "mesaj ulaştı mı" görüşü:** Gazzâlî, Eş'arîler, İbn Teymiyye, İbn Kayyim, Elbânî.
      - **Daha geniş umut:** İbnü'l-Arabî ve İbn Teymiyye'nin cehennemin sona ermesi hakkındaki görüşü (Q13).
      - **2:62'nin modern çoğulcu okumaları:** bir azınlık.
      - **Burada belgelenmedi:** Perennializm (Schuon, Nasr: bütün büyük dinler geçerli yollardır) ve Mutahharî'nin kusurlu ve kusursuz cahil (*câhil-i mukassır/kâsır*) arasındaki Şiî ayrımı.

      **Sıradan Müslümanlar neye inanıyor?** Pew (2013), 38 ülkeden 34'ünde Müslümanların en az yarısının İslam'ın "cennette ebedî hayata götürebilecek tek hak din" olduğunu söylediğini buldu. Bu oran Mısır ve Ürdün'de %96, Irak'ta %95, ama Kazakistan'da %29 (burada %49 pek çok dinin götürebileceğini söyledi) ve Arnavutluk'ta %37'ydi. Günde birkaç kez namaz kılan Müslümanlar bu görüşü daha sık savundu; Rusya'da fark 41 puandı. ABD'li Müslümanlar pek çok yola "çok daha açık".
    title:
      en: Görüşlerin yelpazesi
      tr: Görüşlerin yelpazesi
  - kind: heart
    en: "**If someone you love died outside Islam, neither you nor anyone else can know that the message truly reached them.** Al-Ghazali hoped that most Christians of his day were within God's mercy. Ibn al-Qayyim forbade judging any individual. You may leave your loved one with God, and hope."
    tr: "**Sevdiğin biri İslam'ın dışında öldüyse, ne sen ne de başka biri mesajın ona gerçekten ulaşıp ulaşmadığını bilebilir.** Gazzâlî, kendi zamanındaki Hristiyanların çoğunun Allah'ın rahmeti içinde olduğunu umdu. İbn Kayyim herhangi bir birey hakkında hüküm vermeyi yasakladı. Sevdiğini Allah'a bırakabilir ve umut edebilirsin."
    title:
      en: Yas tutan okuyucu için
      tr: Yas tutan okuyucu için
followUps:
  - q:
      en: Is my sincere friend who knows Islam well going to Hell?
      tr: İslam'ı iyi bilen samimi arkadaşım cehenneme mi gidecek?
    a:
      en: On the strict view, yes, if she truly understood and rejected. Whether she did is known only to God.
      tr: Katı görüşe göre, gerçekten anlayıp reddettiyse, evet. Bunu yapıp yapmadığını yalnızca Allah bilir.
  - q:
      en: Was 2:62 abrogated?
      tr: 2:62 neshedildi mi?
    a:
      en: A report from Ibn ʿAbbas says so. Ibn Kathir reads it as meaning that after Muhammad (pbuh), only his law is accepted.
      tr: İbn Abbâs'tan gelen bir rivayet öyle diyor. İbn Kesîr bunu, Hz. Muhammed'den (s.a.v.) sonra yalnızca onun şeriatının kabul edildiği şeklinde okur.
  - q:
      en: What happens to people who never heard?
      tr: Hiç duymamış insanlara ne olur?
    a:
      en: They are excused or tested. Musnad Ahmad 16301 is graded sahih by al-Albani and hasan by al-Arnaʾut.
      tr: Mazur görülürler ya da imtihan edilirler. Müsned-i Ahmed 16301, Elbânî tarafından sahih, Arnaût tarafından hasen olarak derecelendirildi.
  - q:
      en: Is the "never heard properly" excuse fringe?
      tr: '"Doğru düzgün duymamış olma" mazereti marjinal mi?'
    a:
      en: No. Al-Ghazali, al-Nawawi, al-Jurjani, Ibn al-Qayyim and al-Albani all hold it.
      tr: Hayır. Gazzâlî, Nevevî, Cürcânî, İbn Kayyim ve Elbânî'nin hepsi bunu savunur.
  - q:
      en: Do most Muslims believe only Muslims are saved?
      tr: Müslümanların çoğu yalnızca Müslümanların kurtulacağına mı inanıyor?
    a:
      en: In most countries Pew surveyed, yes.
      tr: Pew'in ankete katıldığı ülkelerin çoğunda evet.
