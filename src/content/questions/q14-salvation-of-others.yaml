honestLimits:
  tr: Doğru bilginin ne kadarının "duymak" sayılacağını kimse tam olarak tanımlamadı. Mâtürîdî, Şiî ve Perennialist görüşler belgelenmedi ve anket cevapları ayrıntıları yakalayamaz.
  en: No one has defined precisely how much accurate knowledge counts as "hearing." The Maturidi, Shiʿi and Perennialist views were not documented, and survey answers do not capture nuance.
