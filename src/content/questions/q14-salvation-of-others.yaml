honestLimits:
  tr: |
    Hiçbir büyük Sünnî mezhep bütün dinlerin eşit derecede geçerli yollar olduğunu öğretmez. Kapsayıcı görüşler, Allah'ın her kişinin mesaja ulaşma imkânını ve samimiyetini bilmesine dayanır.
  en: No one has defined precisely how much accurate knowledge counts as "hearing." The Maturidi, Shiʿi and Perennialist views were not documented, and survey answers do not capture nuance.
