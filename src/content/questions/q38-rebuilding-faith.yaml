  - kind: sunnah
    en: "**Distress at doubt is a sign of faith.** When Companions told the Prophet (pbuh) they had thoughts \"too grave to express\", he said: \"That is the faith manifest\" ({hadith:muslim:132a}). This applies most directly to unwanted thoughts (see \"Is doubting a sin?\"), but it also shows that the Prophet (pbuh) did not meet his Companions' inner struggles with condemnation."
    tr: "**Şüpheden duyulan sıkıntı imanın bir işaretidir.** Sahâbîler Hz. Peygamber'e (s.a.v.) \"söylemeyi çok ağır buldukları\" düşünceleri olduğunu söylediklerinde, o şöyle buyurdu: \"İşte bu imanın ta kendisidir\" ({hadith:muslim:132a}). Bu en doğrudan istenmeyen düşüncelere uygulanır (bkz. \"Şüphe etmek günah mı?\"), ama aynı zamanda Hz. Peygamber'in (s.a.v.) sahâbîlerinin iç mücadelelerini kınamayla karşılamadığını da gösterir."
    title:
      en: Hz. Peygamber (s.a.v.) ne öğretti?
      tr: Hz. Peygamber (s.a.v.) ne öğretti?
  - kind: science
    en: |-
      **Spiritual struggles predict a little more distress later, on average.** [Moderate.] A meta-analysis by Bockrath and colleagues (published online in 2021; a 2022 print citation has not yet been checked) combined 32 longitudinal studies with 5,729 participants. Struggles at the start "significantly predicted increases in negative psychological adjustment" (Zr = 0.08; the paper gives the 95% CI as 0.04–0.10 in the abstract and 0.05–0.10 in the results). That is a small effect: struggles are a risk factor, not a sentence. The link to *positive* adjustment (well-being, growth) was not significant (12 studies; Zr = −0.04).

      **Doubt itself is not always the harmful part.** [Mixed.] The Religious and Spiritual Struggles (RSS) scale (Exline et al., 2014) measures six kinds of struggle: divine (with God), demonic, interpersonal, moral, ultimate meaning, and doubt. In one sample of atheist undergraduates, Sedlar and colleagues (2018) found that doubt struggles *negatively* predicted depressive symptoms after other factors were controlled (β about −0.18), though not in a second sample of adults. (2014) has not yet been checked against that paper itself; the effect, where found, is small and not consistent.

      **What this means.** Struggling is common, it is not a sign that you are broken, and it carries a modest risk of distress. Support — a trusted person, a counsellor, a community — is a sensible response to a real risk.
    tr: |-
      **Manevi sıkıntılar, ortalamada, sonradan biraz daha fazla psikolojik sıkıntıyı öngörür.** [Orta.] Bockrath ve arkadaşlarının bir meta-analizi (2021'de çevrimiçi yayımlandı; 2022 tarihli basılı künyesi henüz kontrol edilmedi), 5.729 katılımcılı 32 boylamsal çalışmayı birleştirdi. Başlangıçtaki sıkıntılar "olumsuz psikolojik uyumdaki artışları anlamlı şekilde öngördü" (Zr = 0,08; makale %95 GA'yı özette 0,04–0,10, bulgular bölümünde 0,05–0,10 olarak veriyor). Bu küçük bir etkidir: Sıkıntılar bir hüküm değil, bir risk etkenidir. *Olumlu* uyumla (iyi oluş, gelişim) ilişki anlamlı değildi (12 çalışma; Zr = −0,04).

      **Şüphenin kendisi her zaman zararlı kısım değildir.** [Karışık.] Dinî ve Manevi Mücadeleler (RSS) ölçeği (Exline ve ark., 2014) altı tür mücadeleyi ölçer: ilahi (Allah'la), şeytani, kişiler arası, ahlaki, nihai anlam ve şüphe. Ateist üniversite öğrencilerinden oluşan bir örneklemde Sedlar ve arkadaşları (2018), diğer etkenler kontrol edildikten sonra şüphe mücadelelerinin depresif belirtileri *ters yönde* öngördüğünü buldu (β yaklaşık −0,18); ancak yetişkinlerden oluşan ikinci bir örneklemde bu görülmedi. (2014) henüz o makalenin kendisiyle karşılaştırılarak kontrol edilmedi; etki, bulunduğu yerde, küçüktür ve tutarlı değildir.

      **Bunun anlamı.** Mücadele yaygındır, bozuk olduğunun işareti değildir ve mütevazı bir psikolojik sıkıntı riski taşır. Destek — güvenilir bir insan, bir danışman, bir topluluk — gerçek bir riske karşı makul bir cevaptır.
    title:
      en: Araştırmalar ne diyor?
      tr: Araştırmalar ne diyor?
  - kind: practice
    title:
      en: What to do
      tr: Ne yapmalı?
    en: |-
      **Be honest about where you are.** Write down, privately, what you actually believe now, what you doubt, and what you miss. Many people find that the doubt is narrower than it felt: one question, not everything.

      **Find a guide who won't shame your questions.** Look for someone who: listens to the whole question before answering; says "I don't know" when they don't; does not threaten you; points you to sources rather than demanding trust; and is happy for you to talk to others. Avoid anyone who treats questions as betrayal. A university chaplain, a scholar with experience of young people, or a Muslim counsellor (for example through the Khalil Center in North America) may be a good start.

      **Keep small practices, and let them be small.** Pray the obligatory prayers if you can, even if they feel empty. Read a little of the Quran with a translation. Make one short du'a in your own words each day. These keep the connection open without pretending to feel what you don't.

      **"What if I go back to prayer and it feels empty?"** That is normal, and it is not proof that the prayer is empty. Al-Ghazali's second crisis was about exactly this gap between knowing and feeling. Keep the form; let the feeling come when it comes; and tell God honestly how it is — the Quran preserves Jacob's (pbuh) words, "I only complain of my suffering and my grief to Allah" (12:86).

      **Take the questions one at a time.** This site's Ask pages try to give honest answers to the hardest questions. Read the one that troubles you most, then talk about it with your guide.

      **Keep good company.** Spend time with people whose faith is calm and kind, not anxious or harsh.

      **Get therapy if needed.** If the doubt comes in loops you cannot stop (see "Is doubting a sin?"), or with depression, a therapist can help — ideally one who respects your faith.
    tr: |-
      **Nerede olduğun konusunda dürüst ol.** Kendine özel olarak, şu an gerçekte neye inandığını, neden şüphe ettiğini ve neyi özlediğini yaz. Pek çok insan şüphenin hissettirdiğinden daha dar olduğunu fark eder: her şey değil, tek bir soru.

      **Sorularını utandırmayacak bir rehber bul.** Şöyle birini ara: cevap vermeden önce sorunun tamamını dinleyen; bilmediğinde "bilmiyorum" diyen; seni tehdit etmeyen; güven talep etmek yerine seni kaynaklara yönlendiren; ve başkalarıyla konuşmandan memnun olan. Soruları ihanet olarak gören herkesten uzak dur. Bir üniversite din görevlisi, gençlerle tecrübesi olan bir âlim ya da bir Müslüman danışman (örneğin Kuzey Amerika'da Khalil Center aracılığıyla) iyi bir başlangıç olabilir.

      **Küçük ibadetleri sürdür ve küçük kalmalarına izin ver.** Boş hissettirse bile, yapabiliyorsan farz namazları kıl. Kur'an'dan biraz, bir mealiyle oku. Her gün kendi sözlerinle kısa bir dua et. Bunlar, hissetmediğin şeyi hissediyormuş gibi yapmadan bağı açık tutar.

      **"Namaza dönersem ve boş hissettirirse ne olacak?"** Bu normaldir ve namazın boş olduğunun ispatı değildir. Gazzâlî'nin ikinci krizi tam da bilmek ile hissetmek arasındaki bu boşlukla ilgiliydi. Biçimi koru; his geldiğinde gelsin; ve Allah'a durumun nasıl olduğunu dürüstçe söyle — Kur'an, Hz. Yâkûb'un (a.s.) şu sözlerini korur: "Ben hüznümü, kederimi ancak Allah'a şikayet ederim" (12:86).

      **Soruları birer birer ele al.** Bu sitenin Sor sayfaları en zor sorulara dürüst cevaplar vermeye çalışır. Seni en çok rahatsız edeni oku, sonra onu rehberinle konuş.

      **İyi arkadaşlar edin.** İmanı kaygılı ya da sert değil, sakin ve nazik olan insanlarla vakit geçir.

      **Gerekirse terapi al.** Şüphe durduramadığın döngüler hâlinde geliyorsa (bkz. "Şüphe etmek günah mı?") ya da depresyonla birlikte geliyorsa, bir terapist yardımcı olabilir — ideal olarak imanına saygı gösteren biri.
  - kind: objection
    en: |-
      **"This is just a way of talking myself back into belief."** *Reply:* honesty means following the evidence where it leads, and this site does not ask you to ignore it. But it also means noticing that a crisis is often driven by pain, exhaustion or other people's behaviour, not only by arguments; dealing with those first lets you see the arguments more clearly. *Limit:* some people, after honest searching, do not return. Their search was honest too.

      **"Al-Ghazali's 'light' is not something I can do."** *Reply:* that is true; he says himself it was not an argument. What one can do is what he did around it: keep searching, change what needs changing in one's life, and ask. *Limit:* there is no method that guarantees the outcome.
    tr: |-
      **"Bu sadece kendimi yeniden inanmaya ikna etmenin bir yolu."** *Cevap:* Dürüstlük, delili götürdüğü yere kadar izlemek demektir ve bu site senden onu görmezden gelmeni istemiyor. Ama aynı zamanda bir krizin çoğu zaman yalnızca argümanlarla değil, acıyla, yorgunlukla ya da başkalarının davranışlarıyla beslendiğini fark etmek demektir; önce bunlarla ilgilenmek argümanları daha açık görmeni sağlar. *Sınır:* Bazı insanlar dürüst bir arayıştan sonra geri dönmez. Onların arayışı da dürüsttü.

      **"Gazzâlî'nin 'nur'u benim yapabileceğim bir şey değil."** *Cevap:* Bu doğru; bizzat kendisi bunun bir argüman olmadığını söyler. Yapılabilecek olan, onun bunun etrafında yaptıklarıdır: aramaya devam etmek, kişinin hayatında değişmesi gerekeni değiştirmek ve istemek. *Sınır:* Sonucu garanti eden bir yöntem yoktur.
    title:
      en: En güçlü itirazlar ve cevaplar
      tr: En güçlü itirazlar ve cevaplar
followUps:
  - q:
      en: What were al-Ghazali's two crises?
      tr: Gazzâlî'nin iki krizi neydi?
    a:
      en: A crisis of knowledge (about two months of radical doubt) and, years later, a crisis of how to live (about six months, ending with his leaving Baghdad in 1095).
      tr: Bir bilgi krizi (yaklaşık iki aylık radikal şüphe) ve yıllar sonra bir yaşama biçimi krizi (yaklaşık altı ay; 1095'te Bağdat'tan ayrılmasıyla sona erdi).
  - q:
      en: What is the *Munqidh*?
      tr: "*Munkız* nedir?"
    a:
      en: "*Al-Munqidh min al-Dalal* (*Deliverance from Error*), al-Ghazali's short account of his search for certainty."
      tr: "*El-Munkız mine'd-Dalâl* (*Dalâletten Kurtuluş*), Gazzâlî'nin kesinlik arayışını anlattığı kısa eseri."
  - q:
      en: How do I find a guide I can trust?
      tr: Güvenebileceğim bir rehberi nasıl bulurum?
    a:
      en: Look for someone who listens fully, admits what they don't know, never threatens, and is happy for you to read and ask others.
      tr: Sonuna kadar dinleyen, bilmediğini kabul eden, asla tehdit etmeyen ve okumandan ve başkalarına sormandan memnun olan birini ara.
  - q:
      en: Do Muslims see doubt as sinful?
      tr: Müslümanlar şüpheyi günah olarak mı görür?
    a:
      en: Unwanted doubts are not sins ({hadith:bukhari:5269}). Honest questions are not sins either; choosing to reject God after the truth is clear is what the Quran condemns.
      tr: İstenmeyen şüpheler günah değildir ({hadith:bukhari:5269}). Dürüst sorular da günah değildir; Kur'an'ın kınadığı şey, hakikat açıkça ortaya çıktıktan sonra Allah'ı reddetmeyi seçmektir.
  - q:
      en: What is "religious OCD"?
      tr: '"Dinî OKB" nedir?'
    a:
      en: 'Scrupulosity: obsessive doubts and compulsive checking about religious matters. It is a treatable condition (see "Is doubting a sin?").'
      tr: 'Dinî vesvese (skrupülozite): dinî konularda saplantılı şüpheler ve zorlantılı kontrol. Tedavi edilebilir bir durumdur (bkz. "Şüphe etmek günah mı?").'
  - q:
      en: What if I never get my old certainty back?
      tr: Eski kesinliğimi hiç geri kazanamazsam ne olacak?
    a:
      en: Many people find a different, quieter faith instead. Some do not return. Either way, honesty and kindness to yourself matter.
      tr: Pek çok insan bunun yerine farklı, daha sessiz bir iman bulur. Bazıları geri dönmez. Her iki durumda da dürüstlük ve kendine karşı nazik olmak önemlidir.
