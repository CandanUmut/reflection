fullAnswer:
  - kind: heart
    en: |-
      **You are not a hypocrite for praying while you doubt.** A person who keeps turning toward God while unsure is doing something honest: keeping the door open. Abraham (pbuh), the friend of God, asked to see how God gives life to the dead. Asked, "Have you not believed?", he answered: "Yes, but [I ask] only that my heart may be satisfied" (2:260). Faith and the longing for more certainty can sit together.

      **You don't have to solve everything this month.** Faith that comes back is often slower and quieter than the faith that left. That is not weaker; it is often more your own.

      **If the crisis comes with hopelessness** — you can't sleep, can't eat, or think life is not worth living — that is a reason to see a doctor or counsellor now, not later. Naseeha (North America, 1-866-627-3342), Samaritans (UK, 116 123), 112 in Türkiye in an emergency, or findahelpline.com elsewhere.
    tr: |-
      **Şüphe ederken namaz kıldığın için ikiyüzlü değilsin.** Emin olmadığı hâlde Allah'a yönelmeye devam eden biri dürüst bir şey yapıyordur: kapıyı açık tutuyordur. Allah'ın dostu Hz. İbrâhim (a.s.), Allah'ın ölüleri nasıl dirilttiğini görmek istedi. "İnanmadın mı ki?" diye sorulunca şöyle cevap verdi: "İnandım, fakat kalbim iyice yatışsın diye istiyorum." (2:260). İman ile daha fazla kesinlik özlemi bir arada durabilir.

      **Her şeyi bu ay çözmek zorunda değilsin.** Geri dönen iman, giden imandan çoğu zaman daha yavaş ve daha sessizdir. Bu daha zayıf olduğu anlamına gelmez; çoğu zaman daha çok senindir.

      **Kriz umutsuzlukla birlikte geliyorsa** — uyuyamıyorsan, yiyemiyorsan ya da hayatın yaşamaya değmediğini düşünüyorsan — bu, sonra değil şimdi bir doktora ya da danışmana gitmek için bir sebeptir. Naseeha (Kuzey Amerika, 1-866-627-3342), Samaritans (Birleşik Krallık, 116 123), Türkiye'de acil durumda 112 ya da başka yerlerde findahelpline.com.
    title:
      en: Kalp ve akıl için
      tr: Kalp ve akıl için
  - kind: scholars
    en: |-
      **The first crisis: can I know anything?** Al-Ghazali (d. 1111) was the most famous teacher in Baghdad. In *al-Munqidh min al-Dalal* (*Deliverance from Error*), written late in life, he tells how he began to ask whether anything he believed was certain. He noticed that "Christian youths always grew up to be Christians, Jewish youths to be Jews and Muslim youths to be Muslims", and tested even his senses and reason. He fell into a doubt that "lasted almost two months". It did not end by argument: "but by a light which God most high cast into my breast" (Watt, sections I–II).

      **What that "light" meant in practice.** He describes it as the return of trust in the basic truths of reason — the things one cannot prove but must rely on to prove anything. Many people in a crisis find something similar: not a new argument, but the slow return of trust in what they had stopped trusting — that the world makes sense, that goodness is real, that their own mind is not lying to them.

      **The second crisis: knowing is not enough.** Years later, with his intellectual questions answered, al-Ghazali realised that his life did not match what he knew. He describes being pulled between two forces: "Worldly desires were striving to keep me by their chains just where I was." The struggle lasted "for nearly six months beginning with Rajab 488 A.H. (=July 1095 A.D.)". Then "God caused my tongue to dry up so that I was prevented from lecturing", and "I could hardly swallow or digest a single mouthful of food." The doctors said: "the only method of treatment is that the anxiety which has come over the heart should be allayed." He left Baghdad — telling people he was going to Mecca while privately planning to go to Syria — gave away most of his wealth, and spent "nearly two years" in Damascus in solitude and worship (Watt, section on the mystics).

      **What he found.** He concluded that the Sufis "were men who had real experiences, not men of words", and that their path is "something which cannot be apprehended by study" — only by living it. *Dhawq* ("tasting") is his word for this direct experience.

      **What this means for you.** Al-Ghazali's two crises are two kinds that people still have. One is a crisis of the mind, which needs honest answers and time. The other is a crisis of the heart and of how one lives, which needs changes in practice, company and attention more than arguments. Many people have both.
    tr: |-
      **İlk kriz: Herhangi bir şeyi bilebilir miyim?** Gazzâlî (ö. 1111) Bağdat'ın en ünlü hocasıydı. Hayatının sonlarında yazdığı *el-Munkız mine'd-Dalâl* (*Dalâletten Kurtuluş*) adlı eserinde, inandığı herhangi bir şeyin kesin olup olmadığını nasıl sormaya başladığını anlatır. "Hristiyan çocukların hep Hristiyan, Yahudi çocukların Yahudi ve Müslüman çocukların Müslüman olarak yetiştiğini" fark etti ve duyularını ve aklını bile sınadı. "Yaklaşık iki ay süren" bir şüpheye düştü. Bu şüphe bir argümanla bitmedi: "yüce Allah'ın göğsüme attığı bir nur ile" bitti (Watt, I–II. bölümler).

      **Bu "nur" pratikte ne demekti?** Onu aklın temel doğrularına — ispat edilemeyen ama herhangi bir şeyi ispat etmek için güvenilmesi gereken şeylere — güvenin geri dönüşü olarak tarif eder. Krizdeki pek çok insan benzer bir şey bulur: Yeni bir argüman değil, güvenmeyi bıraktıkları şeye güvenin yavaşça geri dönüşünü — dünyanın bir anlamı olduğuna, iyiliğin gerçek olduğuna, kendi akıllarının onlara yalan söylemediğine.

      **İkinci kriz: Bilmek yetmez.** Yıllar sonra, entelektüel soruları cevaplanmışken, Gazzâlî hayatının bildikleriyle örtüşmediğini fark etti. İki güç arasında çekiştirildiğini anlatır: "Dünyevi arzular beni zincirleriyle tam olduğum yerde tutmaya çalışıyordu." Mücadele "488 yılı Receb ayından (=Temmuz 1095) başlayarak yaklaşık altı ay" sürdü. Sonra "Allah dilimi kuruttu, öyle ki ders vermekten alıkonuldum" ve "tek bir lokmayı bile güçlükle yutabiliyor ya da sindirebiliyordum." Doktorlar şöyle dedi: "Tek tedavi yolu, kalbe çöken sıkıntının dindirilmesidir." Bağdat'tan ayrıldı — insanlara Mekke'ye gittiğini söyleyip gizlice Suriye'ye gitmeyi planlayarak —, servetinin çoğunu dağıttı ve Şam'da "yaklaşık iki yıl" inziva ve ibadet içinde geçirdi (Watt, sûfiler bölümü).

      **Ne buldu?** Sûfilerin "söz adamları değil, gerçek tecrübeleri olan insanlar" olduğu ve yollarının "çalışarak kavranamayacak bir şey" olduğu — ancak yaşanarak — sonucuna vardı. *Zevk* ("tatma"), bu doğrudan tecrübe için kullandığı kelimedir.

      **Bunun senin için anlamı.** Gazzâlî'nin iki krizi, insanların bugün de yaşadığı iki türdür. Biri akıl krizidir ve dürüst cevaplara ve zamana ihtiyaç duyar. Diğeri kalbin ve yaşama biçiminin krizidir ve argümanlardan çok ibadette, arkadaşlıkta ve dikkatte değişikliklere ihtiyaç duyar. Pek çok insan ikisini de yaşar.
    title:
      en: Gazzâlî'nin iki krizi, bir hikâye olarak
      tr: Gazzâlî'nin iki krizi, bir hikâye olarak
  - kind: quran
    en: |-
      **Ease comes with hardship.** "For indeed, with hardship [will be] ease. Indeed, with hardship [will be] ease" (94:5–6). Sura al-Sharh is Meccan and addressed to the Prophet (pbuh) in a hard period; the repetition is its own reassurance. It does not promise when the ease comes.

      **God does not burden beyond capacity.** 2:286 (see "Is doubting a sin?") includes the prayer: "Our Lord, do not impose blame upon us if we have forgotten or erred."
    tr: |-
      **Zorlukla birlikte kolaylık gelir.** "Demek ki, zorlukla beraber bir kolaylık vardır. Evet, zorlukla beraber bir kolaylık vardır." (94:5–6). İnşirâh Sûresi Mekkîdir ve zor bir dönemde Hz. Peygamber'e (s.a.v.) hitap eder; tekrarın kendisi bir güvencedir. Kolaylığın ne zaman geleceğini vaat etmez.

      **Allah gücün üstünde yük yüklemez.** 2:286 (bkz. "Şüphe etmek günah mı?") şu duayı içerir: "Ey Rabbimiz, eğer unuttuk ya da yanıldıysak bizi tutup sorguya çekme!"
    title:
      en: Kur'an ne diyor?
