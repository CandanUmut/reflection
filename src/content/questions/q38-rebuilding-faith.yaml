steelman:
  tr: |
    Kesinliğim gitti. Rol yapmadan nasıl geri dönerim?
  en: "\"I used to be sure. Then something broke — an argument I couldn't answer, a tragedy, the behaviour of religious people, or just a slow fading. Now when I pray I feel I'm pretending. People tell me to 'have faith', but faith is exactly what I've lost. I don't want to fake certainty, and I don't want to throw everything away. Is there an honest way back?\""
whyAsked:
  tr: |
    ABD'deki bir örneklemde yetişkinlerin %45,4'ü şüpheyle ilgili mücadeleler bildirdi (Exline ve ark.).
  en: Crises of faith are common and often private. The person may be ashamed to tell family or a mosque, and may feel that the only options are pretending or leaving.
shortAnswer:
  tr: |
    Eski kesinliğine bir anda geri dönmen gerekmiyor. Gazzâlî iki kriz yaşadı ve daha derinleşerek geri döndü. Dürüst ol, bir rehber bul, küçük pratiklere geri dön, iyi insanlarla ol ve gerekirse terapi al.
  en: Yes, there is an honest way back, and it does not start with recovering your old certainty all at once. It starts with telling the truth about where you are, finding one or two people who can hear your questions without shaming you, keeping small practices without demanding that they feel full, and taking the hardest questions one at a time. Al-Ghazali, one of the greatest Muslim scholars, went through two crises — one of the mind, one of the heart — and came out with a deeper faith; he wrote that his first doubt ended "by a light which God most high cast into my breast", and his second only after he changed how he lived. Research suggests that spiritual struggles predict somewhat more distress over time, on average, so getting support matters. Not everyone returns, and that should be respected.
