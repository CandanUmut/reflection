id: Q38
slugs:
  tr: imani-yeniden-insa
  en: rebuilding-faith
order: 38
theme: doubt
title:
  tr: Bir şüphe krizinden sonra imanımı nasıl yeniden inşa ederim?
  en: How do I rebuild faith after a crisis of doubt?
sensitivity: high
helpCard: suffering
verses:
  - 2:260
steelman:
  tr: |
    Kesinliğim gitti. Rol yapmadan nasıl geri dönerim?
  en: My certainty is gone. How do I come back without pretending?
whyAsked:
  tr: |
    ABD'deki bir örneklemde yetişkinlerin %45,4'ü şüpheyle ilgili mücadeleler bildirdi (Exline ve ark.).
  en: In one US sample, 45.4% of adults reported doubt-related struggles (Exline et al.).
shortAnswer:
  tr: |
    Eski kesinliğine bir anda geri dönmen gerekmiyor. Gazzâlî iki kriz yaşadı ve daha derinleşerek geri döndü. Dürüst ol, bir rehber bul, küçük pratiklere geri dön, iyi insanlarla ol ve gerekirse terapi al.
  en: You don't need your old certainty back all at once. Al-Ghazālī went through two crises and came back deeper. Be honest, find a guide, return to small practices, keep good company, and get therapy if needed.
layers:
  - kind: religious
    tr: |
      Gazzâlî'nin ilk krizi, "Allah'ın göğse attığı bir nur" ile sona erdi (*Munkız*). İbrahim "kalbim mutmain olsun diye" sordu (2:260). Şüpheden duyulan sıkıntı "sarih imandır" (Müslim 132).
    en: Al-Ghazālī's first crisis ended through "a light God cast into the breast" (*Munqidh*). Abraham asked "so that my heart may be at rest" (2:260). Distress at doubt is "clear faith" (Muslim 132).
  - kind: philosophical
    tr: |
      İman, belirsizlik altında güvendir.
    en: Faith is trust under uncertainty.
  - kind: scientific
    tr: |
      RSS'de (Dinî ve Manevî Mücadeleler ölçeği) şüphe alt ölçeği biraz *daha az* depresyonu yordadı (Exline ve ark. 2014). Bir meta-analiz (Bockrath ve ark. 2022) manevî mücadeleleri sonraki sıkıntıyla ilişkilendirir.
    en: On the RSS (Religious and Spiritual Struggles scale), the doubt subscale predicted slightly *less* depression (Exline et al. 2014). A meta-analysis (Bockrath et al. 2022) links spiritual struggles to later distress.
  - kind: psychological
    tr: |
      Umutsuzluk ya da dinî OKB için yardım iste: 112 ya da bir Toplum Ruh Sağlığı Merkezi (TRSM).
    en: "Seek help for hopelessness or religious OCD: 112 or a community mental health centre (TRSM)."
honestLimits:
  tr: |
    Herkes geri dönmez ve buna saygı duyulmalıdır.
  en: Not everyone returns, and that should be respected.
visualizations:
  - id: ideas
    tr: |
      Gazzâlî'nin yolculuğunun haritası. Bir adım takipçisi. Bir yardım kartı.
    en: A map of al-Ghazālī's journey. A steps tracker. A help card.
