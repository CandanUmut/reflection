title:
  tr: Bir şüphe krizinden sonra imanımı nasıl yeniden inşa ederim?
  en: How do I rebuild faith after a crisis of doubt?
sensitivity: high
helpCard: suffering
verses:
  - 2:260
steelman:
  tr: "\"Eskiden emindim. Sonra bir şey kırıldı — cevaplayamadığım bir argüman, bir trajedi, dindar insanların davranışları ya da sadece yavaş bir sönme. Şimdi namaz kılarken rol yapıyormuşum gibi hissediyorum. İnsanlar bana 'iman et' diyor, ama kaybettiğim şey tam da iman. Sahte bir kesinlik takınmak istemiyorum ve her şeyi bir kenara atmak da istemiyorum. Dürüst bir dönüş yolu var mı?\""
  en: "\"I used to be sure. Then something broke — an argument I couldn't answer, a tragedy, the behaviour of religious people, or just a slow fading. Now when I pray I feel I'm pretending. People tell me to 'have faith', but faith is exactly what I've lost. I don't want to fake certainty, and I don't want to throw everything away. Is there an honest way back?\""
whyAsked:
  tr: İman krizleri yaygındır ve çoğu zaman gizli yaşanır. Kişi bunu ailesine ya da bir camiye söylemekten utanabilir ve tek seçeneğin rol yapmak ya da ayrılmak olduğunu hissedebilir.
  en: Crises of faith are common and often private. The person may be ashamed to tell family or a mosque, and may feel that the only options are pretending or leaving.
shortAnswer:
  tr: Evet, dürüst bir dönüş yolu var ve bu yol eski kesinliğini bir anda geri kazanmakla başlamıyor. Nerede olduğun konusunda doğruyu söylemekle, sorularını seni utandırmadan dinleyebilecek bir iki kişi bulmakla, küçük ibadetleri tam hissettirmelerini beklemeden sürdürmekle ve en zor soruları birer birer ele almakla başlıyor. En büyük Müslüman âlimlerden biri olan Gazzâlî iki kriz yaşadı — biri akılda, biri kalpte — ve daha derin bir imanla çıktı; ilk şüphesinin "yüce Allah'ın göğsüme attığı bir nur" ile sona erdiğini, ikincisinin ise ancak yaşama biçimini değiştirdikten sonra bittiğini yazdı. Araştırmalar manevi sıkıntıların, ortalamada, zamanla biraz daha fazla psikolojik sıkıntıyı öngördüğünü gösteriyor; bu yüzden destek almak önemlidir. Herkes geri dönmez ve buna saygı gösterilmelidir.
  en: Yes, there is an honest way back, and it does not start with recovering your old certainty all at once. It starts with telling the truth about where you are, finding one or two people who can hear your questions without shaming you, keeping small practices without demanding that they feel full, and taking the hardest questions one at a time. Al-Ghazali, one of the greatest Muslim scholars, went through two crises — one of the mind, one of the heart — and came out with a deeper faith; he wrote that his first doubt ended "by a light which God most high cast into my breast", and his second only after he changed how he lived. Research suggests that spiritual struggles predict somewhat more distress over time, on average, so getting support matters. Not everyone returns, and that should be respected.
