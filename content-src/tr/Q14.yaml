rangeOfViews:
  title:
    tr: "Görüşlerin yelpazesi"
    en: "The range of views"
  from:
    tr: "Dar"
    en: "Narrower"
  to:
    tr: "Geniş"
    en: "Wider"
  views:
    - who:
        tr: "İstisnalarıyla dışlayıcılık"
        en: "Exclusivism with exceptions"
      view:
        tr: Mesajı almamış olanlar reddeden sayılmaz (17:15).
        en: Those the message never reached are not counted as rejecters (17:15).
    - who:
        tr: "İbn Teymiyye ve İbn Kayyim"
        en: "Ibn Taymiyya and Ibn al-Qayyim"
      view:
        tr: Fetret ehli âhirette imtihan edilir.
        en: People of fatra are tested in the Hereafter.
    - who:
        tr: "Gazzâlî"
        en: "al-Ghazālī"
      view:
        tr: Yalnızca doğru duyup bile bile reddedenler sorumludur.
        en: Only those who heard accurately and deliberately rejected are culpable.
    - who:
        tr: "Reşîd Rızâ"
        en: "Rashīd Riḍā"
      view:
        tr: "Çarpıtılmış bir sunum, gerçekten duymak sayılmaz."
        en: "A distorted presentation does not count as truly hearing."
    - who:
        tr: "Mutahhari"
        en: "Muṭahharī"
      view:
        tr: Kusuru olmayan cahiller çoğunluktadır ve cezalandırılmaz; Allah'a samimiyetle inananlar mükâfat görür.
        en: The inculpably ignorant are the majority and will not be punished; sincere believers in God are rewarded.
    - who:
        tr: "Ahlâkî teizm (2:62)"
        en: "Moral theism (2:62)"
      view:
        tr: "Yaqeen'in makalesinde sayılan görüşlerden biri; 2:62'ye dayanır."
        en: "One of the positions set out in Yaqeen's paper; it rests on 2:62."
    - who:
        tr: "Perennializm (Nasr, Schuon)"
        en: "Perennialism (Nasr, Schuon)"
      view:
        tr: Fakihlerin çoğunca reddedilir. [Debated]
        en: Rejected by most jurists. [Debated]
