slugs: { tr: kuranin-korunmasi, en: quran-preservation }
theme: quran
title: Kur'an korundu mu?
verses: ["15:9"]
steelman: |
  Eski metinler değişir. Kur'an Muhammed'in vefatından sonra toplandı, Osman tarafından standartlaştırıldı ve rakip nüshalar yakıldı.
whyAsked: |
  İnternetteki polemikler ve Kur'an ile hadisin güvenilirliğini birbirine karıştıran Türk Kur'ancı tartışmaları.
shortAnswer: |
  Aktarım başından itibaren hem sözlü hem yazılıydı. Birmingham yapraklarının parşömeni, %95,4 olasılıkla MS 568–645 arasına, yani Hz. Peygamber'in hayatına yakın bir döneme radyokarbonla tarihlendi. İlmî çalışmalar, belgelenmiş kıraat farklarıyla birlikte istikrarlı bir ünsüz metin bulur. "Hiçbir yazmada tek bir harf bile farklı değildir" demek abartıdır.
layers:
  4: |
    - 15:9 korunmayı vaat eder.
    - Ebû Bekir ve Osman dönemindeki cem çalışmaları Buhârî 4986 ve 4987'de aktarılır.
    - Mütevatir kıraatler, inen okuma biçimleri olarak kabul edilir. [Scholarly]
  5: |
    - Birmingham yaprakları (Mingana 1572a), Hicazî yazıyla 18–20. sûrelerin bazı bölümlerini içerir.
    - Tarih mürekkebe değil, deriye aittir; kütüphane yazmayı 7. yüzyılın ortası olarak kataloglar.
    - Small, asıl metnin tam olarak yeniden kurulamayacağını savunur; Donner ise bunu temkinli bulur. [Debated]
  6: |
    1461±21 BP (OxA-29418). [Established]
  7: |
    Üç soruyu (korunma, kimin sözü olduğu, yorum) birbirinden ayırmak kaygıyı azaltır.
honest: |
  İbn Mes'ûd'unki gibi erken mushaflar küçük farklılıklar gösterir.
visualization: |
  - Yakınlaştırılabilir bir yaprak.
  - MS 610–656 zaman çizelgesi.
  - Bir radyokarbon tarihlendirme açıklaması.
