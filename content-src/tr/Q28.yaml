theme: diversity
title: Neden başka bir din değil de İslam?
verses: ["2:285", "29:46"]
steelman: |
  Her inancın velileri var ve her biri doğru olduğunu iddia ediyor.
whyAsked: |
  Başka inançlardan insanlarla kurulan dostluklar.
shortAnswer: |
  İslam kendini önceki bütün peygamberlerin devamı olarak sunar. Gerekçesi katı tevhide, iyi korunmuş bir kitaba ve tarihî olarak izlenebilen bir peygambere dayanır. İnanç ve saygı bir arada var olabilir.
layers:
  4: |
    2:285; 5:48; 2:62 (âlimlerce farklı okunur); 29:46; 3:85. Nasr ve Winter İslam'ı *dînü'l-fıtrat*a, insan tabiatının dinine bir dönüş olarak tarif eder.
  5: |
    Başka inançlara uyguladığın ölçütleri İslam'ın zayıf noktalarına da uygula.
  6: |
    Kur'an'ın aktarımı iyi belgelenmiştir.
  7: |
    Tevazu, inançla bağdaşır.
honest: |
  Gerekçe güçlüdür ama zorlamaz.
visualization: |
  Bir peygamberler zinciri. Bir ölçüt pusulası. Bir âyetler kartı.
