      See Q1 (suffering). Here: a lawful, stable world in which plate tectonics recycles carbon and builds continents entails hazards; building codes are human responsibility. Objection: God could have made a world without lethal quakes. Response: Q1's soul-making and stable-law defences, with honest limits.

