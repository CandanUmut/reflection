slugs: { tr: parmak-uclari, en: fingertips }
theme: human
title:
  tr: Parmak uçları ve diriliş
  en: Fingertips and resurrection
summary:
  tr: Âyet, hiçbir şeyin Allah'ın geri getiremeyeceği kadar ince olmadığını göstermek için parmak uçlarını seçer.
  en: The verse picks the fingertips to show that nothing is too fine for God to restore.
verses: ["75:3-4"]
verseNotes:
  tr: "*Nüsevviye*: bir araya getirmek. *Benân*: parmak uçları."
  en: "*Nusawwiya*: to put together. *Banān*: fingertips."
tafsir: |
  [Scholarly]

  İki ana okuma vardır.

  1. **En küçük parçalar üzerindeki kudret.** Allah parmak uçlarının küçücük kemiklerini bile geri getirebiliyorsa, bütün bedeni yeniden kurmak kolaydır. En yaygın okuma budur (Taberî, İbn Kesîr, Kurtubî).
  2. **İbn Abbâs'tan nakledilen.** "Parmaklarını devenin tırnağı gibi düz ve bitişik yapabilirdik"; o zaman ince iş yapamazdı. Bu okuma, ayrı ve becerikli parmakların nimetini vurgular.

  İki klasik okuma da parmak izinden söz etmez.
howItWorks: |
  [Established]

  - Gebeliğin yaklaşık 6.–7. haftasında, ceninin parmak uçlarında düz "volar yastıkçıklar" oluşur. Yaklaşık 10. haftada büyümeleri durur ve el büyümeye devam ederken geri çekilirler.
  - Kabaca 10. ile 15. haftalar arasında sırtlar belirir. Yüksek bir yastıkçık girdap (whorl), kısmen çekilmiş bir yastıkçık ilmek (loop), neredeyse kaybolmuş bir yastıkçık kemer (arch) deseni verir. Desen yaklaşık 17. haftada sabitlenir.
  - Genel desen türü kısmen kalıtsaldır. İnce ayrıntılar rahimdeki küçük koşullara bağlıdır: konum, basınç, kan akışı, amniyon sıvısı.
  - Bu yüzden aynı DNA'ya sahip tek yumurta ikizlerinin bile parmak izleri farklıdır.
  - Sistematik parmak izi tanımlaması 1800'lerin sonunda başladı (Faulds, Galton, Henry).
awe: |
  - Parmak izleriniz doğumdan önce belirlendi ve ömür boyu aynı kalır.
  - Tek yumurta ikizleri DNA'yı paylaşır, parmak izlerini değil.
  - Parmak izlerinin yaklaşık %60'ı ilmek, %35'i girdap, %5'i kemer desenidir.
reflection: |
  Âyet, hiçbir şeyin Allah'ın geri getiremeyeceği kadar ince olmadığını göstermek için bedenin en küçük ve en ayrıntılı parçalarından biri olan parmak uçlarını seçer. Bugün parmak uçlarının yalnızca bize ait bir iz de taşıdığını biliyoruz. Sizi yeniden kuracak olan, sizi en kişisel ayrıntınıza kadar bilir.
honest: |
  - Çok yaygın bir iddiaya göre "Kur'an parmak izini 1.400 yıl önce bildirdi." Âyet izlerden değil parmak uçlarından söz eder ve hiçbir klasik âlim onu parmak iziyle ilgili okumadı. Parmak izini öngörü olarak değil, açıkça modern bir tefekkür olarak etiketleyerek sunmak gerekir.
  - Dünyadaki her parmak izinin benzersiz olduğunu kimse resmî olarak kanıtlamadı. Bu çok güçlü bir pratik kuraldır, matematiksel bir kesinlik değil.
visualization: |
  - 6. haftadan 17. haftaya bir cenin eli canlandırması: yastıkçıklar şişer, çekilir ve sırtlar girdap, ilmek ya da kemer olarak belirir. Bir zamanlama kaydırıcısı deseni değiştirir.
  - Bir "ikizler" kartı: iki aynı yüz, iki farklı parmak izi.
