slugs: { tr: ilim, en: knowledge }
theme: knowledge
title:
  tr: İlim ve ilim talebi
  en: Knowledge and seeking it
summary:
  tr: '"Rabbim, ilmimi artır" (20:114) — Hz. Peygamber''e daha fazlasını istemesi söylenen tek şey.'
  en: '"My Lord, increase me in knowledge" (20:114) — the only thing the Prophet is told to ask for more of.'
verses: ["96:1-5", "20:114", "39:9", "58:11", "35:28"]
teachings: |
  - İlk vahiy: "Yaratan Rabbinin adıyla oku… O ki kalemle öğretti, insana bilmediğini öğretti" (96:1–5).
  - '"De ki: Rabbim, ilmimi artır" (20:114) — Hz. Peygamber''e daha *fazlasını* istemesi söylenen tek şey.'
  - '"Hiç bilenlerle bilmeyenler bir olur mu?" (39:9).'
  - '"Allah sizden iman edenlerin ve kendilerine ilim verilenlerin derecelerini yükseltir" (58:11).'
  - '"Kulları içinden Allah''tan ancak âlimler gerçekten saygıyla korkar" (35:28) — bağlamın doğa ve renkler olduğuna dikkat (S33).'
  - 'Hadis: "Kim ilim talebi için bir yola girerse, Allah ona cennete giden bir yolu kolaylaştırır" (Müslim 2699). "İlim talep etmek her Müslümana farzdır" (İbn Mâce 224; senedi tartışmalı, bazılarınca birden çok yolla *hasen* sayılır).'
scholarship: |
  - Gazzâlî *İhyâ*'yı İlim Kitabı ile açar; farz-ı ayn olan ilmi (herkesin imanı ve gündelik hayatı için muhtaç olduğu bilgi) farz-ı kifâye olandan (tıp, matematik, zanaatlar — topluluğun sahip olması gereken bilimler) ayırır.
  - İbn Rüşd (*Faslü'l-Makâl*), doğayı akılla incelemenin Kur'an'ın tefekküre davetleriyle emredildiğini savundu.
  - Makâsıd çerçevesinde ilim *aklı* (*akl*) korur.
evidence: |
  - Merak öğrenmeyi ve hafızayı güçlendirir: insanlar meraklı olduklarında cevabı — ve hatta ilgisiz bilgileri — daha iyi hatırlar (Gruber ve ark., *Neuron* 2014). [*moderate*]
  - Eğitim, ülkeler genelinde sağlık, gelir ve uzun ömürle güçlü biçimde ilişkilidir. [Established, partly causal]
  - "Gelişim zihniyeti" (yeteneğin gelişebileceğine inanmak) büyük çalışmalarda başarı üzerinde yalnızca **küçük** etkiler gösterir. [*small*, debated]
stories: |
  - Bağdat'taki Beytü'l-Hikme (Hikmet Evi): tercüme ve araştırma merkezi (9. yüzyıl).
  - Bir kadın, Fâtıma el-Fihrî tarafından kurulan Fas'taki Karaviyyîn (859), sürekli faaliyetteki en eski öğrenim yerlerinden biri olarak sık sık anılır.
  - Hârizmî (cebir), İbnü'l-Heysem (optik ve deneysel yöntem) ve İbn Sînâ (tıp) gibi âlimler.
  - Kadın âlimler: Akram Nadwi binlerce kadın hadis râvisini belgeledi (*el-Muhaddisât*).
gaps: |
  - Araştırma üretimi, okuryazarlık ve eğitim kalitesi Müslüman çoğunluklu ülkeler arasında büyük farklılıklar gösterir; bazıları 96:1–5'in beklettiğinin çok altındadır.
  - '"İspanya bir yılda, Arap dünyasının bin yılda çevirdiği kadar kitap çevirir" şeklinde yaygın olarak paylaşılan iddia (ilk Arap İnsani Gelişme Raporu haberlerinden) **itiraz görmüştür**; burada tekrarlanmıyor.'
  - Bugün hiçbir şeyin değişmesi gerekmediğini ima eden "altın çağ" nostaljisinden kaçınmak gerekir.
enOverrides:
  # Author-facing notes ("Exact current data to be added…", "do not repeat it") rephrased; the data gap is logged in CONTENT_GAPS.
  gaps: |
    - Research output, literacy and education quality vary widely across Muslim-majority countries; several are far below what 96:1–5 would lead one to expect.
    - A widely shared claim that "Spain translates as many books in a year as the Arab world did in a thousand years" (from early Arab Human Development Report coverage) has been **disputed**; it is not repeated here.
    - Avoid "golden age" nostalgia that implies nothing needs to change today.
visualization: |
  - '"Oku" (96:1): ilk kelime, bilimlere — cebir, optik, tıp, astronomi — dallanan bir kalem darbesiyle çizilir; her biri küçük resimli bir yaprak.'
  - '"Rabbi zidnî ilmâ" (20:114) günlük kartı: her gün öğrenilecek ve üzerine düşünülecek yeni bir şey, bir âyet sayfasına bağlantıyla.'
