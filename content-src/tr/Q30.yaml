slugs: { tr: ahiret-delili, en: afterlife }
theme: afterlife
title: Âhirete dair delil
verses: ["36:78-79", "38:28"]
steelman: |
  Zihin beyne bağlıdır ve ölüme yakın deneyimler (ÖYD) ölmekte olan bir beyin tarafından üretiliyor olabilir.
whyAsked: |
  Yas ve adaletsizlik.
shortAnswer: |
  Kur'an ilk yaratılıştan ve adaletten delil getirir. ÖYD araştırmaları ilgi çekicidir ama kanıt değildir.
layers:
  4: |
    36:78–79; 38:28. Gazzâlî bedensel dirilişi savundu. Mutahhari ve Nursî adaletten delil getirir.
  5: |
    Ahlâkî argüman (Kant): adalet bu hayattan fazlasını gerektiriyor gibi görünür.
  6: |
    - **AWARE I (2014):** 2.060 kalp durması; görüşülen 101 hayatta kalandan 9'u ÖYD yaşadı.
    - **AWARE II (*Resuscitation* 2023):** 567 kalp durması ve 53 hayatta kalan. Yaklaşık %40'ı farkındalık, yaklaşık %20'si "hatırlanan bir ölüm deneyimi" bildirdi.

    Yazarlar, bunun deneyimlerin gerçek olduğunu ne kanıtladığını ne de çürüttüğünü söylüyor.
  7: |
    Karmaşık yas bir klinisyen gerektirir.
honest: |
  ÖYD'ler kanıt değildir. Hiçbir hasta gizli bir görsel hedefi tanımlayamadı.
visualization: |
  Ağaca dönüşen bir tohum. Bir AWARE grafiği. Bir adalet terazisi.
sourceLabels: [null, null, 'Gazzâlî, *Tehâfüt* (Arapça)', 'Nursî (Türkçe)', 'Mutahhari (Farsça)']
