slugs: { tr: denge-ve-olcu, en: balance-and-measure }
theme: earth
title:
  tr: Ekolojik denge ve ölçü
  en: Ecological balance and measure
summary:
  tr: Âyet kozmik dengeyi ve adil ticareti yan yana koyar. Doğada gördüğümüz düzen aynı zamanda ahlâkî bir öğüttür.
  en: The verse puts the cosmic balance and fair trade side by side. The order we see in nature is also a moral instruction.
verses: ["55:7-9", "15:19"]
seeAlso: ["54:49", "25:2"]
verseNotes:
  tr: "55:7'de *el-mîzân* (denge, ölçü); 15:19'da *mevzûn* (ölçülü)."
  en: "In 55:7, *al-mīzān* (the balance); in 15:19, *mawzūn* (in measured proportion)."
tafsir: |
  [Scholarly]

  - Müfessirler 55:7'deki *mîzân*ı hem kozmik düzen hem adalet olarak okur. Sonraki âyetler doğrudan ticaretteki adil tartılara ve ölçülere geçer.
  - 15:19'daki *mevzûn* "doğru oranda", her şeyin hikmete ve ihtiyaca göre olması diye okunur.
  - Temel adım kozmostan ahlâka geçiştir: yaratılıştaki denge, insan ilişkilerindeki denge için bir örnektir.
howItWorks: |
  [Established]

  - Ekosistemler karbon, azot, su ve besin döngüleriyle işler. Üreticiler, tüketiciler ve ayrıştırıcılar maddelerin dolaşmasını sağlar.
  - **Kilit türlerin** etkisi sayılarından çok daha büyüktür. Klasik bir örnek deniz samurudur: deniz kestanelerini yiyerek yosun ormanlarını korur.
  - 1995'te geri getirilen Yellowstone kurtlarının bir "trofik çağlayan" yoluyla nehirleri ve titrek kavakları eski hâline getirdiği sık sık söylenir. Son çalışmalar bu etkinin gerçekte ne kadar güçlü olduğuna itiraz ediyor ve bilim insanları hâlâ tartışıyor.
  - İnsan etkinliği sistemleri dengeden çıkarabilir: aşırı avlanma, yaşam alanı kaybı ve iklim değişikliği.
awe: |
  - Küçük tek bir avcıyı ortadan kaldırmak, bütün bir kıyının ekosistemini değiştirebilir.
  - Doğanın dengesi donmuş değil, dinamiktir; sürekli kendini ayarlar.
reflection: |
  Âyet kozmik dengeyi ve adil ticareti yan yana koyar. Doğada gördüğümüz düzen aynı zamanda ahlâkî bir öğüttür: *dengeyi bozmayın*. Bu, hem insanlara hem yeryüzüne nasıl davrandığımız için geçerlidir.
honest: |
  - Doğanın "dengesi" kusursuz bir ahenk değildir. Yok oluşu, rekabeti ve değişimi de içerir. Doğa her zaman barışçıl değildir.
  - Yellowstone kurtlarının hikâyesi sık sık basit bir başarı olarak anlatılır; bilimsel tartışma gerçektir.
  - 55:7–9'daki *mîzân* öncelikle adaletle ilgilidir; onu ekoloji olarak okumak geçerli bir genişletmedir [Scholarly], tek anlamı değil.
visualization: |
  - Etkileşimli bir besin ağı: bir kilit türü (deniz samurları) çıkarın ve etkilerin sistemde dalga dalga yayılışını izleyin (deniz kestaneleri çoğalır, yosun kaybolur).
  - 55:7'yi (kozmos) 55:9'a (adil tartı) bağlayan bir "denge" terazisi kartı.
sourceLabels:
